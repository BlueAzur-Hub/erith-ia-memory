          <span id="liveBattery">Batterie : détection…</span>
          <span id="liveMode">Mode : Full AAA</span>
        </aside>

        <aside class="system-drawer" id="systemDrawer">
          <div class="drawer-head">
            <strong>System Details HUD</strong>
            <button onclick="toggleSystemDrawer(false)">×</button>
          </div>
          <div class="system-grid" id="systemGrid"></div>
          <textarea id="systemRaw" readonly></textarea>
        </aside>

        <aside class="mini-submenu" id="miniSubmenu">
          <div class="drawer-head">
            <strong id="submenuTitle">Sous-menu</strong>
            <button onclick="closeSubmenu()">×</button>
          </div>
          <div class="submenu-grid" id="submenuGrid"></div>
        </aside>

        <aside class="options-panel" id="optionsPanel">
          <div class="drawer-head">
            <strong>Options d’apparence</strong>
            <button onclick="toggleOptions(false)">×</button>
          </div>
          <label>Opacité des modules <input type="range" min="70" max="100" value="96" id="opacityRange" oninput="setModuleOpacity(this.value)"></label>
          <label>Échelle UI <input type="range" min="92" max="104" value="100" id="scaleRange" oninput="setStageScale(this.value)"></label>
          <label>Fond <select id="bgSelect" onchange="setBackground(this.value)">
            <option value="sky_castle_background.png">Hero Sky Castle</option>
            <option value="sky_castle_template_master.png">Template complet</option>
          </select></label>
          <button onclick="saveAppearance()">Sauvegarder apparence par défaut</button>
