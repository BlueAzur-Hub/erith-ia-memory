<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seven Portable Terminal</title>

<style>
body{
  margin:0;
  padding:40px;
  font-family:Georgia, serif;
  color:#f3e7b3;
  background:#0b1f33;
  background-image:url('./assets/atlas_29_crystal_sanctuary_arche.jpg');
  background-size:cover;
  background-position:center;
}

.panel{
  max-width:1200px;
  margin:auto;
  background:rgba(0,0,0,0.45);
  border:1px solid rgba(255,230,150,0.35);
  border-radius:24px;
  padding:30px;
  backdrop-filter:blur(6px);
}

h1{
  font-size:72px;
  margin:0 0 10px 0;
}

.subtitle{
  opacity:0.9;
  margin-bottom:30px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:20px;
}

.card{
  border:1px solid rgba(255,230,150,0.35);
  border-radius:18px;
  padding:20px;
  background:rgba(0,0,0,0.25);
  min-height:120px;
}

.card h2{
  margin-top:0;
  font-size:28px;
}

pre{
  white-space:pre-wrap;
  color:#fff;
}

@media(max-width:900px){
  .grid{
    grid-template-columns:1fr;
  }

  h1{
    font-size:48px;
  }
}
</style>
</head>

<body>

<div class="panel">

<h1>Seven Portable Terminal</h1>
<div class="subtitle">
Pupitre Aerith · mémoire · production · synchronisation GitHub
</div>

<div class="grid">

<div class="card">
<h2>Top vidéos</h2>
<div id="topVideos">Chargement...</div>
</div>

<div class="card">
<h2>Familles mémoire</h2>
<div id="memoryFamilies">Chargement...</div>
</div>

<div class="card">
<h2>Brief chargé</h2>
<div id="briefLoaded">Chargement...</div>
</div>

<div class="card">
<h2>État</h2>
<div id="systemState">Initialisation...</div>
</div>

<div class="card">
<h2>Action Aerith</h2>
<div id="aerithAction">En attente...</div>
</div>

<div class="card">
<h2>YouTube Memory Brief</h2>
<pre id="memoryBrief">...</pre>
</div>

</div>
</div>

<script>

async function loadSevenHeavenData(){

  try{

    const [
      topVideosResponse,
      memoryFamiliesResponse,
      briefResponse
    ] = await Promise.all([
      fetch('./data/top_videos.json'),
      fetch('./data/memory_families.json'),
      fetch('./data/brief.json')
    ]);

    const topVideos = await topVideosResponse.json();
    const memoryFamilies = await memoryFamiliesResponse.json();
    const briefData = await briefResponse.json();

    const topVideosBox = document.getElementById('topVideos');

    if(topVideos.length === 0){
      topVideosBox.innerHTML = 'Aucune donnée';
    }else{
      const first = topVideos[0];
      topVideosBox.innerHTML =
        '<strong>' + (first.title || 'Vidéo') + '</strong><br>' +
        (first.views || 0) + ' vues';
    }

    const familiesBox =
      document.getElementById('memoryFamilies');

    if(memoryFamilies.length === 0){
      familiesBox.innerHTML = 'Aucune donnée';
    }else{
      familiesBox.innerHTML =
        memoryFamilies.length + ' familles mémoire';
    }

    document.getElementById('briefLoaded').innerHTML =
      briefData.brief || 'Seven Heaven online.';

    document.getElementById('memoryBrief').textContent =
      JSON.stringify(briefData, null, 2);

    document.getElementById('systemState').innerHTML =
      'Données chargées';

    document.getElementById('aerithAction').innerHTML =
      'Synchronisation mémoire active';

  }catch(error){

    console.error(error);

    document.getElementById('systemState').innerHTML =
      'Erreur chargement JSON';

  }

}

window.addEventListener('DOMContentLoaded', () => {

  loadSevenHeavenData();

  setInterval(loadSevenHeavenData, 60000);

});

</script>

</body>
</html>
