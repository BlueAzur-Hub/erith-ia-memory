<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Seven Portable Terminal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="ui">
    <header class="topbar">
      <div class="brand">
        <span class="sigil">✦</span>
        <strong>Seven Portable Terminal</strong>
      </div>

      <nav>
        <button class="active" data-page="home">Accueil</button>
        <button data-page="llm">LLM</button>
        <button data-page="notion">Notion</button>
        <button data-page="github">GitHub</button>
        <button data-page="production">Production</button>
        <button data-page="system">Système</button>
      </nav>
    </header>

    <section class="side-panel">
      <p class="label">SEVEN</p>
      <button id="copyPrompt">Copier prompt</button>
      <button id="openChat">ChatGPT</button>
      <button id="readability">Lisibilité</button>
    </section>

    <section class="page active" id="home">
      <h1>Sky Castle Console</h1>
      <p>Interface légère. Le décor reste visible.</p>
    </section>

    <section class="page" id="llm">
      <h1>LLM</h1>
      <p>Prompts et activation Seven.</p>
    </section>

    <section class="page" id="notion">
      <h1>Notion</h1>
      <p>Mémoire éditoriale.</p>
    </section>

    <section class="page" id="github">
      <h1>GitHub</h1>
      <p>assets/SEVEN_PORTABLE_TERMINAL/</p>
    </section>

    <section class="page" id="production">
      <h1>Production</h1>
      <p>Image, animation, DaVinci, YouTube.</p>
    </section>

    <section class="page" id="system">
      <h1>Système</h1>
      <p id="trace"></p>
    </section>
  </main>

  <textarea id="drawer" readonly></textarea>
  <script src="script.js"></script>
</body>
</html>
