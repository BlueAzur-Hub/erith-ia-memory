<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Seven Portable Terminal — Laputa Core</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="terminal" aria-label="Seven Portable Terminal">
    <section class="hero-panel">
      <div class="sigil">✦</div>
      <p class="kicker">ERITH.IA · SEVEN HEAVEN</p>
      <h1>Seven Portable<br />Terminal</h1>
      <p class="subtitle">Cité céleste · Mémoire opérative · Interface privée</p>

      <div class="actions">
        <button id="copyPrompt">Copier le prompt</button>
        <button id="startSeven">Démarrer Seven</button>
      </div>

      <p id="status" class="status">Prêt.</p>
    </section>

    <nav class="dock" aria-label="Modules rapides">
      <button>LLM</button>
      <button>Notion</button>
      <button>GitHub</button>
      <button>Production</button>
      <button>Système</button>
    </nav>
  </main>

  <script src="script.js"></script>
</body>
</html>
