<style>

*{box-sizing:border-box}html{background:var(--ivory)}body{margin:0;min-width:320px;background:radial-gradient(circle at 100% 0,rgba(217,167,166,.22),transparent 29rem),radial-gradient(circle at 0 100%,rgba(199,160,106,.17),transparent 30rem),var(--ivory);color:var(--espresso);font:15px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid rgba(199,160,106,.48);outline-offset:2px}a{color:inherit}.shell{width:min(1560px,calc(100% - 32px));min-height:calc(100vh - 32px);margin:16px auto;display:grid;grid-template-columns:282px minmax(0,1fr);overflow:hidden;border:1px solid var(--line);border-radius:30px;background:rgba(255,253,249,.78);box-shadow:var(--shadow);backdrop-filter:blur(14px)}

main{min-width:0;padding:30px}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:22px;margin-bottom:27px}.eyebrow{margin:0 0 7px;color:var(--taupe);font-weight:800;font-size:.75rem;letter-spacing:.12em;text-transform:uppercase}h1,h2,h3{font-family:Georgia,"Times New Roman",serif;font-weight:500}h1{max-width:800px;margin:0;font-size:clamp(2.05rem,4vw,3.4rem);line-height:1.04;letter-spacing:-.035em}h2{margin:0;font-size:1.74rem;line-height:1.12}h3{margin:0;font-size:1.18rem}.lead{max-width:760px;margin:11px 0 0;color:rgba(45,33,28,.68)}.portrait{width:84px;height:84px;overflow:hidden;flex:0 0 auto;border:1px solid rgba(199,160,106,.56);border-radius:27px;background:#e5d1ba;box-shadow:0 12px 28px rgba(99,65,42,.12)}.portrait img{width:100%;height:100%;object-fit:cover;object-position:50% 25%;transform:scale(1.12)}
.card{border:1px solid var(--line);border-radius:var(--r);background:rgba(255,253,249,.88);box-shadow:0 11px 28px rgba(92,61,42,.055)}.panel{padding:25px}.grid{display:grid;gap:18px}.cols2{grid-template-columns:minmax(0,1.18fr) minmax(300px,.82fr)}.cols3{grid-template-columns:repeat(3,minmax(0,1fr))}.hero{position:relative;overflow:hidden;min-height:222px;padding:28px;color:#fffdf9;background:radial-gradient(circle at 84% 5%,rgba(255,227,196,.30),transparent 14rem),radial-gradient(circle at 3% 100%,rgba(217,167,166,.40),transparent 20rem),linear-gradient(135deg,#5a4033,#392921)}.hero:after{content:"";position:absolute;right:-76px;bottom:-111px;width:208px;height:208px;border:1px solid rgba(255,245,226,.42);border-radius:44% 56% 48% 52%;transform:rotate(29deg)}.hero>*{position:relative;z-index:1}.hero .eyebrow{color:#f9d8a2}.hero h2{max-width:620px;font-size:clamp(1.48rem,2.4vw,2.05rem)}.hero p:last-child{max-width:590px;margin:12px 0 0;color:rgba(255,249,243,.84)}.stat{padding:21px}.stat label,.metric label{display:block;margin-bottom:12px;color:var(--taupe);font-size:.73rem;font-weight:800;letter-spacing:.10em;text-transform:uppercase}.stat strong{font-size:1.06rem}.stat p{margin:8px 0 0;color:rgba(45,33,28,.63);font-size:.89rem}.dot{display:inline-block;width:9px;height:9px;margin-right:7px;border-radius:50%;background:var(--amber)}.dot.good{background:var(--green)}.dot.bad{background:var(--red)}

.list{display:grid;gap:10px;margin-top:21px}.item{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;padding:15px;border:1px solid var(--line);border-radius:16px;background:#fffdf9}.item h3{font-family:inherit;font-size:.98rem;font-weight:760}.item p{margin:5px 0 0;color:rgba(45,33,28,.66);font-size:.88rem;white-space:pre-wrap}.item small{display:block;margin-top:5px;color:var(--taupe);font-size:.78rem}.itemactions{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:7px}.empty{padding:20px;border:1px dashed rgba(169,135,112,.48);border-radius:15px;color:rgba(45,33,28,.60);background:rgba(255,253,249,.46)}.badge{display:inline-flex;align-items:center;border-radius:999px;padding:5px 8px;font-size:.73rem;font-weight:750}.badge.todo{color:#765a3d;background:#f4e9d7}.badge.verify{color:#875a11;background:#fff0d4}.badge.good{color:#3f6249;background:#eaf2eb}.badge.lock{color:#633d68;background:#f1e7f0}.badge.bad{color:#8f3e3e;background:#fff0ef}.checkrow{display:flex;gap:10px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}.checkrow:last-child{border-bottom:0}.checkrow input{margin-top:4px;accent-color:var(--green);transform:scale(1.12)}.checkrow b{font-size:.92rem}.checkrow small{display:block;margin-top:2px;color:rgba(45,33,28,.60)}
.phasegrid{display:grid;gap:10px;margin-top:18px}.phase{padding:15px;border:1px solid var(--line);border-radius:16px;background:#fffdf9}.phasehead{display:flex;justify-content:space-between;gap:12px;align-items:center}.phase h3{font-family:inherit;font-size:.98rem;font-weight:760}.task{display:flex;gap:10px;align-items:flex-start;padding:9px 0 0}.task input{margin-top:4px;accent-color:var(--green);transform:scale(1.12)}.task span{font-size:.88rem}.task.done span{text-decoration:line-through;color:rgba(45,33,28,.48)}.scorebar{display:flex;gap:4px;margin-top:8px}.scorebar i{display:block;width:16px;height:8px;border-radius:99px;background:#eee3d8}.scorebar i.on{background:#c7a06a}.tablewrap{overflow:auto;margin-top:18px}.table{width:100%;border-collapse:collapse;font-size:.87rem}.table th,.table td{padding:11px 9px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}.table th{color:var(--taupe);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase}.table td.num{text-align:right;font-variant-numeric:tabular-nums}.goodtext{color:var(--green)}.warntext{color:var(--amber)}.badtext{color:var(--red)}.statusstrip{display:flex;flex-wrap:wrap;gap:8px;margin-top:13px}.chip{border:1px solid rgba(169,135,112,.30);border-radius:999px;padding:7px 10px;color:var(--brown);background:transparent;font-size:.80rem}.chip:hover{border-color:var(--champagne);background:#fff6e9}.divider{height:1px;margin:21px 0;background:var(--line)}
.modalback{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:20px;background:rgba(45,33,28,.50);backdrop-filter:blur(4px)}.modal{width:min(690px,100%);max-height:calc(100vh - 40px);overflow:auto;border:1px solid rgba(255,255,255,.45);border-radius:26px;padding:28px;background:#fffdf9;box-shadow:0 24px 70px rgba(0,0,0,.28)}.modal .topline{display:flex;justify-content:space-between;align-items:start;gap:16px}.modalclose{border:0;border-radius:10px;padding:6px 9px;color:var(--brown);background:#f6ede4}.toast{position:fixed;right:20px;bottom:20px;z-index:60;max-width:min(430px,calc(100vw - 40px));padding:13px 15px;border-radius:14px;color:#fff;background:#3f6249;box-shadow:0 10px 26px rgba(30,62,43,.25);opacity:0;transform:translateY(10px);pointer-events:none;transition:.2s}.toast.show{opacity:1;transform:translateY(0)}.hidden{display:none!important}
@media (max-width:1050px){.shell{grid-template-columns:1fr}.sidebar{display:none}.mobile-head{position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;padding:13px 16px;border-bottom:1px solid var(--line);background:rgba(255,253,249,.94);backdrop-filter:blur(12px)}.mobile-head b{font-family:Georgia,serif}.mobilemenu{border:1px solid var(--line);border-radius:10px;padding:7px 10px;color:var(--brown);background:#fffdf9}.mobile-nav{display:none;position:fixed;inset:59px 13px auto 13px;z-index:21;padding:10px;border:1px solid var(--line);border-radius:17px;background:#fffdf9;box-shadow:var(--shadow)}.mobile-nav.open{display:grid}.mobile-nav button{border:0;border-radius:11px;padding:10px;color:var(--brown);background:transparent;text-align:left}.mobile-nav button.active{background:#fff5e8}.main{padding:24px}main{padding:24px}}@media (max-width:800px){.cols2,.summary,.cols3,.actiongrid{grid-template-columns:1fr}.metricgrid{grid-template-columns:1fr 1fr}.top{margin-bottom:22px}.portrait{width:62px;height:62px;border-radius:20px}.formgrid{grid-template-columns:1fr}.field.full{grid-column:auto}.panel{padding:20px}.hero{min-height:auto}.item{flex-direction:column}.itemactions{justify-content:flex-start}.table{min-width:650px}}@media (max-width:520px){.shell{width:100%;min-height:100vh;margin:0;border:0;border-radius:0}.mobile-head{border-radius:0}.metricgrid{grid-template-columns:1fr}.top{gap:12px}h1{font-size:2.05rem}main{padding:18px}.panel{padding:17px}.modal{padding:22px}.formfooter .primary,.formfooter .secondary,.formfooter .danger{width:100%;text-align:center}.portrait{display:none}}
@media print{body{background:#fff}.shell{display:block;width:100%;margin:0;border:0;box-shadow:none}.sidebar,.mobile-head,.top .portrait,.nav,.action,.formfooter,button,.toast{display:none!important}main{padding:0}.card{box-shadow:none;break-inside:avoid}.print-hide{display:none!important}}

<body>
<div class="shell">
  <aside class="sidebar">
    <div class="brand"><div class="brandmark">✦</div><div><b>Charlene Salon</b><small>Atelier Champagne · local</small></div></div>
    <nav class="nav" id="nav"></nav>
    <div class="sidebar-foot"><b>Application locale</b>Les informations restent dans ce navigateur. Pense à exporter une sauvegarde.</div>
  </aside>
  <div class="mobile-head"><b>Charlene Salon</b><button class="mobilemenu" id="mobile-menu">Menu</button></div><nav class="mobile-nav" id="mobile-nav"></nav>
  <main id="app"></main>
</div>
<div id="modal-root"></div><div class="toast" id="toast"></div>
<script>
(() => {
  'use strict';
  const KEY='charlene-salon-v1-metier';
  const VERSION='1.0.1';
  const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
  const clone=o=>JSON.parse(JSON.stringify(o));
  const uid=()=>`${Date.now().toString(36)}-${Math.random().toString(36).slice(2,8)}`;
  const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
  const attr=esc;
  const n=v=>{const x=Number(String(v??'').replace(',','.'));return Number.isFinite(x)?x:0};
  const euro=v=>new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR',maximumFractionDigits:0}).format(n(v));
  const euro2=v=>new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR',minimumFractionDigits:2,maximumFractionDigits:2}).format(n(v));
  const fmt=v=>new Intl.NumberFormat('fr-FR',{maximumFractionDigits:1}).format(n(v));
  const dateFR=v=>v?new Date(`${v}T12:00:00`).toLocaleDateString('fr-FR'):'—';
  const nowISO=()=>new Date().toISOString();
  const statuses=['À définir','À vérifier','Validé','Verrouillé'];
  const statusClass=s=>s==='Validé'?'good':s==='Verrouillé'?'lock':s==='À vérifier'?'verify':'todo';
  const statusBadge=s=>`<span class="badge ${statusClass(s)}">${esc(s)}</span>`;
  const defaultTasks=()=>[
    {id:'c1',phase:'Cadrage',title:'Définir la cliente principale et l’expérience souhaitée',done:false},
    {id:'c2',phase:'Cadrage',title:'Clarifier le pays, la ville ou la zone de lancement',done:false},
    {id:'f1',phase:'Faisabilité',title:'Lister les hypothèses de budget à vérifier',done:false},
    {id:'f2',phase:'Faisabilité',title:'Préparer les questions à poser aux professionnels compétents',done:false},
    {id:'l1',phase:'Local & travaux',title:'Comparer les locaux avec une grille identique',done:false},
    {id:'l2',phase:'Local & travaux',title:'Chiffrer les travaux et le matériel avant engagement',done:false},
    {id:'o1',phase:'Offre & prix',title:'Créer une première carte de prestations réaliste',done:false},
    {id:'o2',phase:'Offre & prix',title:'Vérifier marge, durée et coût produit de chaque prestation',done:false},
    {id:'p1',phase:'Pré-ouverture',title:'Préparer les routines d’ouverture et de fermeture',done:false},
    {id:'p2',phase:'Pré-ouverture',title:'Vérifier les points administratifs, techniques et de sécurité adaptés',done:false}
  ];
  const defaults=()=>({
    meta:{version:VERSION,createdAt:nowISO(),updatedAt:nowISO(),onboarded:false},
    profile:{salonName:'Charlene Salon',phase:'Cadrage',country:'',city:'',concept:'',client:'',vision:'',openingTarget:'',availableCash:'',openingDays:'24'},
    tasks:defaultTasks(),
    localVisits:[], services:[], budget:[], stock:[], suppliers:[], operations:[], decisions:[],
    routines:{opening:[{id:'ro1',label:'Vérifier la propreté et la préparation des espaces',done:false},{id:'ro2',label:'Contrôler le matériel et les produits nécessaires à la journée',done:false},{id:'ro3',label:'Préparer l’accueil et les priorités de la journée',done:false}],closing:[{id:'rf1',label:'Ranger, nettoyer et sécuriser les espaces',done:false},{id:'rf2',label:'Noter les produits à surveiller ou à commander',done:false},{id:'rf3',label:'Préparer les priorités de la prochaine ouverture',done:false}]},
    settings:{showDemo:false}
  });
  function normalize(raw){
    const base=defaults();
    if(!raw||typeof raw!=='object') return base;
    const clean={...base,...raw};
    clean.meta={...base.meta,...(raw.meta||{}),version:VERSION,updatedAt:raw.meta?.updatedAt||nowISO()};
    clean.profile={...base.profile,...(raw.profile||{})};
    for(const k of ['tasks','localVisits','services','budget','stock','suppliers','operations','decisions']) clean[k]=Array.isArray(raw[k])?raw[k]:base[k];
    clean.routines={opening:Array.isArray(raw.routines?.opening)?raw.routines.opening:base.routines.opening,closing:Array.isArray(raw.routines?.closing)?raw.routines.closing:base.routines.closing};
    clean.settings={...base.settings,...(raw.settings||{})};
    return clean;
  }
  function load(){try{return normalize(JSON.parse(localStorage.getItem(KEY)))}catch{return defaults()}}
  let state=load(), route='dashboard', edit={type:null,id:null};
  function save(){state.meta.updatedAt=nowISO();localStorage.setItem(KEY,JSON.stringify(state));}
  function getEdit(type){return edit.type===type?state[type].find(x=>x.id===edit.id)||{}:{}}
  function toast(text){const el=$('#toast');el.textContent=text;el.classList.add('show');clearTimeout(window.__toast);window.__toast=setTimeout(()=>el.classList.remove('show'),3200)}
  const navItems=[
    ['dashboard','⌂','Mon atelier'],['launch','↗','Plan d’ouverture'],['project','◈','Mon projet'],['local','⌑','Local & installation'],['offer','✂','Prestations & marges'],['budget','€','Budget & rentabilité'],['operations','◷','Organisation du salon'],['stock','▣','Stocks & fournisseurs'],['decisions','◆','Mes décisions'],['backup','⇩','Sauvegarde']
  ];
  function nav(){const html=navItems.map(([id,ico,label])=>`<button data-route="${id}" class="${route===id?'active':''}"><span class="ico">${ico}</span>${label}</button>`).join('');$('#nav').innerHTML=html;$('#mobile-nav').innerHTML=html;}
  function setRoute(next){route=next;edit={type:null,id:null};nav();render();window.scrollTo({top:0,behavior:'smooth'});$('#mobile-nav').classList.remove('open')}
  function top(title,lead){return `<div class="top"><div><p class="eyebrow">Charlene Salon · Atelier personnel</p><h1>${title}</h1><p class="lead">${lead}</p></div><div class="portrait"><img src="assets/images/CHARLENE_SALON_ASSISTANT_ACCUEIL_1080x1350.png" alt="Portrait décoratif Charlene Salon"></div></div>`}
  function sum(list,fn){return list.reduce((a,x)=>a+n(fn(x)),0)}
  function servicesComplete(){return state.services.filter(s=>s.name&&n(s.price)>0&&n(s.duration)>0)}
  function margin(s){return n(s.price)-n(s.cost)}
  function mhr(s){return n(s.duration)>0?margin(s)/(n(s.duration)/60):0}
  function monthlyFixed(){return sum(state.budget.filter(x=>x.kind==='monthly'),x=>x.amount)}
  function startupCost(){return sum(state.budget.filter(x=>x.kind==='startup'),x=>x.amount)}
  function avgMargin(){const list=servicesComplete();return list.length?sum(list,margin)/list.length:0}
  function avgRate(){const list=servicesComplete();const sales=sum(list,x=>x.price), mg=sum(list,margin);return sales>0?mg/sales:0}
  function breakEvenRevenue(){const r=avgRate();return r>0?monthlyFixed()/r:0}
  function breakEvenServices(){const a=avgMargin();return a>0?monthlyFixed()/a:0}
  function lowStock(){return state.stock.filter(x=>x.name&&n(x.stock)<=n(x.reorder))}
  function phaseProgress(){const all=state.tasks.length||1,done=state.tasks.filter(t=>t.done).length;return {all,done,p:Math.round(done/all*100)}}
  function readiness(){let pts=0,all=7; if(state.profile.country||state.profile.city)pts++;if(state.profile.client)pts++;if(state.localVisits.length)pts++;if(servicesComplete().length)pts++;if(state.budget.length)pts++;if(state.decisions.some(x=>x.status==='Validé'||x.status==='Verrouillé'))pts++;if(state.tasks.some(x=>x.done))pts++;return {pts,all,p:Math.round(pts/all*100)}}
  function nextMoves(){const out=[];if(!(state.profile.country||state.profile.city))out.push(['project','Situer le projet','Renseigne au moins le pays et la ville ou la zone envisagée.']);if(!state.profile.client)out.push(['project','Décrire la cliente repère','Une cliente claire aide à choisir local, services et prix.']);if(!state.services.length)out.push(['offer','Créer la première offre','Ajoute les prestations que le salon pourra réellement tenir.']);if(!state.budget.length)out.push(['budget','Chiffrer un premier poste','Une seule estimation suffit pour commencer le budget.']);if(!state.localVisits.length)out.push(['local','Préparer la comparaison des locaux','Ajoute chaque visite avec les mêmes critères.']);if(!state.decisions.length)out.push(['decisions','Conserver le premier choix','Ajoute une décision et son état, même provisoire.']);return out.slice(0,3).length?out.slice(0,3):[['launch','Suivre le plan d’ouverture','Le socle est en place : complète la prochaine tâche utile.'],['operations','Préparer une routine quotidienne','Les procédures simples protègent la qualité et l’énergie.'],['backup','Créer une sauvegarde','Exporte une copie locale avant toute grosse modification.']];}
  function renderDashboard(){const ready=readiness(), progress=phaseProgress(), low=lowStock(), actions=nextMoves();return `${top(`Bonjour ${esc(state.profile.salonName||'Charlene')}.`,`Cette application transforme progressivement une idée de salon en décisions, chiffres, routines et étapes concrètes — sans API et sans donnée envoyée.`)}

  function renderLaunch(){const phases=['Cadrage','Faisabilité','Local & travaux','Offre & prix','Pré-ouverture'];const progress=phaseProgress();return `${top('Le plan d’ouverture.','Un rétroplanning lisible pour avancer sans mélanger les décisions importantes. Chaque tâche reste modifiable et ne remplace pas une vérification humaine adaptée.')}

  function renderProject(){const p=state.profile;return `${top('Le socle du salon.','Écris une première version sans viser la perfection. Les décisions verrouillées vivent dans Mes décisions ; ici, le projet peut évoluer.')}

  function weightedScore(x){const a=['visibility','access','layout','budgetFit','worksRisk']; const vals=a.map(k=>n(x[k]));return vals.some(Boolean)?vals.reduce((s,v,i)=>s+v*([.24,.16,.25,.22,.13][i]),0):n(x.score)}

  function renderOperations(){const item=getEdit('operations');const list=[...state.operations].sort((a,b)=>`${a.day||''}${a.time||''}`.localeCompare(`${b.day||''}${b.time||''}`));const routine=(kind,label)=>`<div class="card panel"><p class="eyebrow">Routine ${label.toLowerCase()}</p><h2>${label}</h2><p class="hint" style="margin-top:8px">Coche seulement ce qui est réellement fait. Les routines sont locales et personnalisables.</p><div class="list">${state.routines[kind].map(r=>`<label class="checkrow"><input type="checkbox" data-routine="${kind}:${attr(r.id)}" ${r.done?'checked':''}><div><b>${esc(r.label)}</b></div></label>`).join('')}</div><form class="routine-add" data-routine-kind="${kind}"><div class="formfooter"><input required maxlength="180" placeholder="Ajouter une étape" style="flex:1;min-width:180px;border:1px solid rgba(169,135,112,.32);border-radius:12px;padding:10px 11px;background:#fffdf9"><button class="tiny">Ajouter</button></div></form></div>`;return `${top('Organisation du salon.','Prépare le fonctionnement quotidien sans enregistrer de données clientes. Les routines, créneaux et rôles aident à protéger la qualité, le temps et la charge de l’équipe.')}

ts qui évitent les oublis coûteux.</div>'}</div></article></div>`}
  function renderStock(){const item=getEdit('stock');const list=[...state.stock].sort((a,b)=>(n(a.stock)-n(a.reorder))-(n(b.stock)-n(b.reorder)));const lows=lowStock();return `${top('Stocks & fournisseurs.','Suivre les seuils utiles sans passer de commande automatiquement. Cette application prépare une liste de réapprovisionnement que Charlene valide ensuite elle-même.')}

  function renderDecisions(){const item=getEdit('decisions');const list=[...state.decisions].sort((a,b)=>`${b.date||''}`.localeCompare(`${a.date||''}`));return `${top('Mes décisions.','Une décision claire garde le projet cohérent. Conserve l’objet, l’état, la raison et ce qui doit encore être vérifié.')}
  <div class="grid cols2"><article class="card panel"><p class="eyebrow">${item.id?'Modifier une décision':'Ajouter une décision'}</p><h2>Un choix traçable</h2><form id="decision-form"><input type="hidden" id="decision-id" value="${attr(item.id||'')}"><div class="formgrid"><div class="field"><label for="decision-title">Décision</label><input id="decision-title" required maxlength="160" value="${attr(item.title)}" placeholder="Ex. Commencer avec une carte courte"></div><div class="field"><label for="decision-status">État</label><select id="decision-status">${statuses.map(s=>`<option ${item.status===s?'selected':''}>${s}</option>`).join('')}</select></div><div class="field"><label for="decision-category">Domaine</label><input id="decision-category" maxlength="90" value="${attr(item.category)}" placeholder="Ex. offre, local, budget"></div><div class="field"><label for="decision-date">Date</label><input id="decision-date" type="date" value="${attr(item.date||new Date().toISOString().slice(0,10))}"></div><div class="field full"><label for="decision-reason">Raison / élément de preuve</label><textarea id="decision-reason" maxlength="1100" placeholder="Pourquoi ce choix ? Qu’est-ce qui le rend cohérent ?">${esc(item.reason)}</textarea></div><div class="field full"><label for="decision-next">À vérifier ou prochain point</label><textarea id="decision-next" maxlength="900" placeholder="Quelle confirmation ou quelle action reste nécessaire ?">${esc(item.next)}</textarea></div></div><div class="formfooter"><button class="primary">${item.id?'Mettre à jour':'Ajouter la décision'}</button>${item.id?'<button type="button" class="secondary" data-cancel>Annuler</button>':''}</div></form><div class="list">${list.length?list.map(x=>`<article class="item"><div><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><h3>${esc(x.title)}</h3>${statusBadge(x.status||'À définir')}</div><small>${esc(x.category||'Domaine non précisé')} · ${dateFR(x.date)}</small><p>${esc(x.reason||'Raison non ajoutée.')}${x.next?'\n\nÀ vérifier : '+esc(x.next):''}</p></div><div class="itemactions"><button class="tiny" data-edit="decisions:${attr(x.id)}">Modifier</button><button class="tiny delete" data-delete="decisions:${attr(x.id)}">Retirer</button></div></article>`).join(''):'<div class="empty">Aucune décision enregistrée. Commence par le choix qui t’évitera de repartir de zéro demain.</div>'}</div></article><aside class="card panel"><h2>Les quatre états</h2><div class="list"><div class="checkrow"><div>${statusBadge('À définir')}<small>Une idée ou un sujet non tranché.</small></div></div><div class="checkrow"><div>${statusBadge('À vérifier')}<small>Une hypothèse qui a besoin d’une source, d’un devis ou d’un avis adapté.</small></div></div><div class="checkrow"><div>${statusBadge('Validé')}<small>Charlene a confirmé le choix à ce stade.</small></div></div><div class="checkrow"><div>${statusBadge('Verrouillé')}<small>Ne pas changer sans une nouvelle décision explicite.</small></div></div></div><div class="notice warning"><span>!</span><div>Cette trace aide à décider. Elle ne rend pas un engagement légal, financier ou contractuel automatique.</div></div></aside></div>`}
  function renderBackup(){const count=state.localVisits.length+state.services.length+state.budget.length+state.stock.length+state.operations.length+state.decisions.length;const updated=new Date(state.meta.updatedAt).toLocaleString('fr-FR');return `${top('Sauvegarde & confidentialité.','Une application locale doit être sauvegardée par la personne qui l’utilise. GitHub héberge les fichiers de l’application, pas tes décisions ni tes données.')}
  <div class="grid cols2"><article class="card panel"><h2>Conserver une copie</h2><p class="lead" style="margin-top:8px">Les données sont enregistrées dans ce navigateur. Exporte un fichier JSON avant un changement d’appareil, un nettoyage de navigateur ou une grosse évolution du projet.</p><div class="metricgrid" style="margin-top:20px"><div class="metric"><label>Version</label><strong>${VERSION}</strong><small>Application locale</small></div><div class="metric"><label>Éléments</label><strong>${count}</strong><small>Enregistrements métier</small></div><div class="metric"><label>Dernière modification</label><strong style="font-size:.92rem">${esc(updated)}</strong><small>Sur cet appareil</small></div></div><div class="formfooter" style="margin-top:23px"><button class="primary" data-backup="export">Exporter ma sauvegarde</button><label class="secondary" style="display:inline-flex;align-items:center;cursor:pointer">Importer une sauvegarde<input id="import-file" type="file" accept="application/json,.json" hidden></label><button class="secondary" data-backup="print">Imprimer le récapitulatif</button><button class="danger" data-backup="reset">Effacer les données locales</button></div><div class="notice privacy"><span>✦</span><div><b>Local uniquement :</b> aucune donnée n’est envoyée par cette application. N’ajoute pas de données clients nominatives, de documents RH, de données bancaires, de santé ou de contrats.</div></div></article><aside class="card panel"><h2>Préparer une démonstration</h2><p class="hint" style="margin-top:8px">Charge un exemple uniquement pour découvrir les calculs et les écrans. Il remplace les données locales actuelles après confirmation.</p><div class="formfooter"><button class="secondary" data-backup="demo">Charger un exemple</button></div><div class="divider"></div><h3>Ce qui est inclus</h3><div class="checkrow"><div><b>Projet et plan</b><small>Profil, étapes et décisions.</small></div></div><div class="checkrow"><div><b>Local, offre, budget et stocks</b><small>Les éléments saisis dans l’application.</small></div></div><div class="checkrow"><div><b>Routines et organisation</b><small>Les checklists et créneaux internes.</small></div></div></aside></div>`}
  function render(){const views={dashboard:renderDashboard,launch:renderLaunch,project:renderProject,local:renderLocal,offer:renderOffer,budget:renderBudget,operations:renderOperations,stock:renderStock,decisions:renderDecisions,backup:renderBackup};$('#app').innerHTML=views[route]();bind();}
  function findItem(type,id){return state[type]?.find(x=>x.id===id)}
  function upsert(type,value){const idx=state[type].findIndex(x=>x.id===value.id);if(idx>=0)state[type][idx]=value;else state[type].push(value);save();edit={type:null,id:null};render()}
  function deleteItem(type,id){if(!confirm('Retirer cet élément de cet appareil ?'))return;state[type]=state[type].filter(x=>x.id!==id);save();render();toast('Élément retiré de cet appareil.')}
  function bind(){
    $$('#nav button,[data-route],#mobile-nav button').forEach(b=>b.addEventListener('click',()=>b.dataset.route&&setRoute(b.dataset.route)));
    $('#mobile-menu')?.addEventListener('click',()=>$('#mobile-nav').classList.toggle('open'));
    $$('[data-cancel]').forEach(b=>b.addEventListener('click',()=>{edit={type:null,id:null};render()}));
    $$('[data-edit]').forEach(b=>b.addEventListener('click',()=>{const [type,id]=b.dataset.edit.split(':');edit={type,id};render();window.scrollTo({top:0,behavior:'smooth'})}));
    $$('[data-delete]').forEach(b=>b.addEventListener('click',()=>{const [type,id]=b.dataset.delete.split(':');deleteItem(type,id)}));
    $$('[data-task]').forEach(i=>i.addEventListener('change',()=>{const t=state.tasks.find(x=>x.id===i.dataset.task);if(t){t.done=i.checked;save();render()}}));
    $$('[data-routine]').forEach(i=>i.addEventListener('change',()=>{const [kind,id]=i.dataset.routine.split(':');const r=state.routines[kind].find(x=>x.id===id);if(r){r.done=i.checked;save();render()}}));
    $$('.routine-add').forEach(f=>f.addEventListener('submit',e=>{e.preventDefault();const input=f.querySelector('input');const val=input.value.trim();if(!val)return;state.routines[f.dataset.routineKind].push({id:uid(),label:val,done:false});save();render();toast('Étape ajoutée.')}));
    $('#task-form')?.addEventListener('submit',e=>{e.preventDefault();state.tasks.push({id:uid(),phase:$('#task-phase').value,title:$('#task-title').value.trim(),done:false});save();render();toast('Étape ajoutée au plan.');});
    $('#profile-form')?.addEventListener('submit',e=>{e.preventDefault();state.profile={...state.profile,salonName:$('#salonName').value.trim()||'Charlene Salon',phase:$('#phase').value,country:$('#country').value.trim(),city:$('#city').value.trim(),openingTarget:$('#openingTarget').value,openingDays:$('#openingDays').value,concept:$('#concept').value.trim(),client:$('#client').value.trim(),vision:$('#vision').value.trim()};save();toast('Projet enregistré sur cet appareil.');setRoute('dashboard')});
    $('#local-form')?.addEventListener('submit',e=>{e.preventDefault();const id=$('#local-id').value||uid();upsert('localVisits',{id,name:$('#local-name').value.trim(),zone:$('#local-zone').value.trim(),rent:$('#local-rent').value,surface:$('#local-surface').value,visibility:$('#local-visibility').value,access:$('#local-access').value,layout:$('#local-layout').value,budgetFit:$('#local-budgetFit').value,worksRisk:$('#local-worksRisk').value,status:$('#local-status').value,notes:$('#local-notes').value.trim()});toast('Visite enregistrée.');});
    $('#service-form')?.addEventListener('submit',e=>{e.preventDefault();const id=$('#service-id').value||uid();const price=n($('#service-price').value),cost=n($('#service-cost').value);if(cost>price){if(!confirm('Le coût direct dépasse le prix de vente. Enregistrer quand même ?'))return;}upsert('services',{id,name:$('#service-name').value.trim(),category:$('#service-category').value.trim(),duration:$('#service-duration').value,price:$('#service-price').value,cost:$('#service-cost').value,status:$('#service-status').value,note:$('#service-note').value.trim()});toast('Prestation enregistrée.');});
    $('#budget-form')?.addEventListener('submit',e=>{e.preventDefault();const id=$('#budget-id').value||uid();upsert('budget',{id,label:$('#budget-label').value.trim(),kind:$('#budget-kind').value,category:$('#budget-category').value.trim(),amount:$('#budget-amount').value,status:$('#budget-status').value,date:$('#budget-date').value,note:$('#budget-note').value.trim()});toast('Ligne de budget enregistrée.');});
    $('#cash-form')?.addEventListener('submit',e=>{e.preventDefault();state.profile.availableCash=$('#available-cash').value;save();render();toast('Trésorerie mise à jour.');});
    $('#operations-form')?.addEventListener('submit',e=>{e.preventDefault();const id=$('#op-id').value||uid();upsert('operations',{id,day:$('#op-day').value,time:$('#op-time').value,title:$('#op-title').value.trim(),owner:$('#op-owner').value.trim(),note:$('#op-note').value.trim()});toast('Créneau enregistré.');});
    $('#stock-form')?.addEventListener('submit',e=>{e.preventDefault();const id=$('#stock-id').value||uid();const current=n($('#stock-current').value),reorder=n($('#stock-reorder').value),target=n($('#stock-target').value);if(target&&target<reorder){if(!confirm('Le stock cible est inférieur au seuil d’alerte. Enregistrer quand même ?'))return;}upsert('stock',{id,name:$('#stock-name').value.trim(),supplier:$('#stock-supplier').value.trim(),unit:$('#stock-unit').value.trim(),stock:current,reorder,target,cost:$('#stock-cost').value,lead:$('#stock-lead').value,note:$('#stock-note').value.trim()});toast('Produit enregistré.');});
    $('#decision-form')?.addEventListener('submit',e=>{e.preventDefault();const id=$('#decision-id').value||uid();upsert('decisions',{id,title:$('#decision-title').value.trim(),status:$('#decision-status').value,category:$('#decision-category').value.trim(),date:$('#decision-date').value,reason:$('#decision-reason').value.trim(),next:$('#decision-next').value.trim()});toast('Décision enregistrée.');});
    $$('[data-backup]').forEach(b=>b.addEventListener('click',()=>backup(b.dataset.backup)));
    $('#import-file')?.addEventListener('change',importFile);
  }
  function backup(action){
    if(action==='export'){const stamp=new Date().toISOString().slice(0,10);const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`charlene-salon-sauvegarde-${stamp}.json`;document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(a.href);toast('Sauvegarde téléchargée.');}
    if(action==='print')window.print();
    if(action==='reset'){if(!confirm('Effacer toutes les données locales sur cet appareil ? Cette action ne peut pas être annulée sans sauvegarde.'))return;state=defaults();save();setRoute('dashboard');toast('Données locales effacées.');}
    if(action==='demo'){if(!confirm('Charger un exemple et remplacer les données locales actuelles ? Exporte d’abord une sauvegarde si nécessaire.'))return;state=demoData();save();setRoute('dashboard');toast('Exemple chargé.');}

  function importFile(e){const file=e.target.files?.[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const data=JSON.parse(reader.result);if(!data||typeof data!=='object')throw new Error();if(!confirm('Importer cette sauvegarde et remplacer les données locales actuelles ?'))return;state=normalize(data);save();setRoute('dashboard');toast('Sauvegarde importée.')}catch{alert('Fichier de sauvegarde non reconnu.')}};reader.readAsText(file);e.target.value='';}
