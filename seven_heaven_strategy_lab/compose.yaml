name: seven-heaven-strategy-lab
services:
  laboratory:
    build:
      context: .
      dockerfile: Dockerfile
    image: seven-heaven-strategy-lab:local-paper
    restart: "no"
    ports:
      - "127.0.0.1:8777:8777"
    volumes:
      - "./workspace:/workspace"
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=32m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    environment:
      SEVEN_LAB_HOST: "0.0.0.0"
      SEVEN_LAB_PORT: "8777"
      SEVEN_LAB_WORKSPACE: "/workspace"
