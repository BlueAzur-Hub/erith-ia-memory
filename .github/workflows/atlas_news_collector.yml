name: Atlas News Sentinel World-to-Market Live Feed

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

concurrency:
  group: atlas-news-sentinel-world-to-market
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate collector
        run: python public/agent_crypto_erith_ia/tools/atlas_news_collector.py --self-test

      - name: Collect qualified world and crypto news
        id: collect_news
        continue-on-error: true
        run: python public/agent_crypto_erith_ia/tools/atlas_news_collector.py

      - name: Commit News Sentinel archive
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/agent_crypto_erith_ia/data/news/latest.json \
                  public/agent_crypto_erith_ia/data/news/status.json \
                  public/agent_crypto_erith_ia/data/news/history || true
          if git diff --cached --quiet; then
            echo "No News Sentinel archive change"
            exit 0
          fi
          git commit -m "archive news sentinel world to market feed"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Propagate collector failure
        if: steps.collect_news.outcome == 'failure'
        run: |
          echo "News Sentinel collector failed; any generated error status was preserved."
          exit 1
