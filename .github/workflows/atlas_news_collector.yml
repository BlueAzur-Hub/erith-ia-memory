name: Atlas News Sentinel World-to-Market Live Feed
# 40.4.110 — canonical collector → raw offline EN→FR → deterministic editorial French display → validated archive publication.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/atlas_news_collector.yml"
      - "public/agent_crypto_erith_ia/tools/atlas_news_collector.py"
      - "public/agent_crypto_erith_ia/tools/atlas_news_translate_fr.py"
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

env:
  ATLAS_NEWS_VERSION: V1.1-alpha.26.47.5
  XDG_DATA_HOME: ${{ github.workspace }}/.argos-cache/data
  XDG_CACHE_HOME: ${{ github.workspace }}/.argos-cache/cache
  XDG_CONFIG_HOME: ${{ github.workspace }}/.argos-cache/config
  ARGOS_PACKAGES_DIR: ${{ github.workspace }}/.argos-cache/packages
  ARGOS_DEVICE_TYPE: cpu

concurrency:
  group: atlas-news-sentinel-world-to-market
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache French translation model
        uses: actions/cache@v4
        with:
          path: .argos-cache
          key: atlas-news-argos-en-fr-v1

      - name: Install French translation runtime
        run: python -m pip install --disable-pip-version-check --quiet argostranslate==1.11.0

      - name: Validate collector
        run: python public/agent_crypto_erith_ia/tools/atlas_news_collector.py --self-test

      - name: Validate French translation layer
        run: python public/agent_crypto_erith_ia/tools/atlas_news_translate_fr.py --self-test

      - name: Collect qualified world, macro, flow and crypto news
        id: collect_news
        run: python public/agent_crypto_erith_ia/tools/atlas_news_collector.py

      - name: Add French presentation headlines
        id: translate_news_fr
        run: python public/agent_crypto_erith_ia/tools/atlas_news_translate_fr.py --require-french

      - name: Validate French publication payload
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("public/agent_crypto_erith_ia/data/news/latest.json")
          data=json.loads(p.read_text(encoding="utf-8"))
          events=[e for e in data.get("events",[]) if isinstance(e,dict) and str(e.get("headline") or "").strip()]
          missing=[str(e.get("event_id") or e.get("id") or "?") for e in events if not str(e.get("headline_fr") or "").strip() or not str(e.get("headline_fr_display") or "").strip()]
          summary=data.get("translation_fr") if isinstance(data.get("translation_fr"),dict) else {}
          if str(summary.get("build")) != "40.4.110": raise SystemExit("French translation build marker missing")
          if missing: raise SystemExit(f"headline_fr missing for {len(missing)} events: {missing[:5]}")
          print(f"FRENCH NEWS PUBLICATION PASS · {len(events)}/{len(events)} headline_fr + headline_fr_display")
          PY

      - name: Commit News Sentinel archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/agent_crypto_erith_ia/data/news/latest.json \
                  public/agent_crypto_erith_ia/data/news/status.json \
                  public/agent_crypto_erith_ia/data/news/history || true
          if git diff --cached --quiet; then
            echo "No News Sentinel archive change"
            exit 0
          fi
          git commit -m "archive news sentinel world to market feed"
          git pull --rebase origin main
          git push origin HEAD:main

