name: Agent-Crypto 40.4.175 Version Truth Lock

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/agent-crypto-40-4-175-version-truth-lock.yml'

permissions:
  contents: write

concurrency:
  group: agent-crypto-40-4-175-version-truth-lock
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebase onto latest main before surgery
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main

      - name: Patch 40.4.175 version truth
        shell: python
        run: |
          from pathlib import Path
          import json
          from datetime import datetime, timezone

          root = Path('public/agent_crypto_erith_ia/administrator')
          index_path = root / 'index.html'
          version_path = root / 'version.json'
          admin_path = root / 'administrator-version.json'

          old_build = '40.4.174'
          new_build = '40.4.175'
          old_release = 'DOMAIN SKELETON MIRROR · CRYPTO MASTER'
          new_release = 'VERSION TRUTH LOCK · DOMAIN SKELETON MIRROR'
          new_status = 'version_truth_lock_domain_skeleton_mirror'
          now = datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00', 'Z')

          html = index_path.read_text(encoding='utf-8')
          required = [
              f'<meta name="atlas-build" content="{old_build}"',
              f'<meta name="administrator-build" content="{old_build}"',
              f'Build {old_build}',
          ]
          missing = [token for token in required if token not in html]
          if missing:
              raise SystemExit(f'index precondition failed; missing: {missing}')
          html = html.replace(old_build, new_build)
          html = html.replace(old_release, new_release)
          index_path.write_text(html, encoding='utf-8')

          version = json.loads(version_path.read_text(encoding='utf-8'))
          if version.get('build') != old_build:
              raise SystemExit(f'version.json expected {old_build}, got {version.get("build")}')
          version['release'] = new_release
          version['build'] = new_build
          version['asset_token'] = f'market-core-v2.0-alpha-build-{new_build}'
          version['status'] = new_status
          version['prepared_at'] = now
          version['published_at'] = now
          version['parent_build'] = old_build
          contracts = version.setdefault('contracts', {})
          contracts['version_truth_404175'] = {
              'schema': 'erith.admin.version-truth-lock.v1',
              'authorities': ['index.html', 'version.json', 'administrator-version.json'],
              'all_authorities_must_match': True,
              'release_number_exists_only_after_verified_commit': True,
              'market_core_modified': False,
          }
          version_path.write_text(json.dumps(version, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          admin = json.loads(admin_path.read_text(encoding='utf-8'))
          if admin.get('build') != old_build or admin.get('global_versioning') != old_build:
              raise SystemExit('administrator-version.json precondition failed')
          admin['build'] = new_build
          admin['global_versioning'] = new_build
          admin['release'] = new_release
          admin['status'] = new_status
          admin['prepared_at'] = now
          admin['published_at'] = now
          contracts = admin.setdefault('contracts', {})
          contracts['version_truth_404175'] = {
              'schema': 'erith.admin.version-truth-lock.v1',
              'authorities': ['index.html', 'version.json', 'administrator-version.json'],
              'all_authorities_must_match': True,
              'release_number_exists_only_after_verified_commit': True,
              'market_core_modified': False,
          }
          admin_path.write_text(json.dumps(admin, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

      - name: Validate three authorities
        shell: python
        run: |
          from pathlib import Path
          import json, re

          root = Path('public/agent_crypto_erith_ia/administrator')
          html = (root / 'index.html').read_text(encoding='utf-8')
          version = json.loads((root / 'version.json').read_text(encoding='utf-8'))
          admin = json.loads((root / 'administrator-version.json').read_text(encoding='utf-8'))

          def meta(name):
              m = re.search(rf'<meta name="{re.escape(name)}" content="([^"]+)"', html)
              if not m:
                  raise SystemExit(f'missing meta {name}')
              return m.group(1)

          expected = '40.4.175'
          values = {
              'index atlas-build': meta('atlas-build'),
              'index administrator-build': meta('administrator-build'),
              'version.json build': version.get('build'),
              'administrator-version.json build': admin.get('build'),
              'administrator-version.json global_versioning': admin.get('global_versioning'),
          }
          bad = {k:v for k,v in values.items() if v != expected}
          if bad:
              raise SystemExit(f'version truth mismatch: {bad}')
          if meta('atlas-engine-build') != '38.15.11':
              raise SystemExit('protected Market Core changed')
          if version.get('engine', {}).get('reference_build') != '38.15.11':
              raise SystemExit('version manifest Market Core changed')
          if 'Build 40.4.175 · Administrator' not in html:
              raise SystemExit('document title identity not synchronized')
          if 'market-core-v2.0-alpha-build-40.4.175' not in html:
              raise SystemExit('index asset token not synchronized')
          if version.get('asset_token') != 'market-core-v2.0-alpha-build-40.4.175':
              raise SystemExit('manifest asset token not synchronized')
          if '40.4.174' in html:
              raise SystemExit('stale 40.4.174 remains in live Administrator index')
          print('PASS', values)

      - name: Commit release and retire one-shot
        run: |
          rm -f .github/workflows/agent-crypto-40-4-175-version-truth-lock.yml
          git add public/agent_crypto_erith_ia/administrator/index.html \
                  public/agent_crypto_erith_ia/administrator/version.json \
                  public/agent_crypto_erith_ia/administrator/administrator-version.json \
                  .github/workflows/agent-crypto-40-4-175-version-truth-lock.yml
          git commit -m "release Agent-Crypto 40.4.175 version truth lock"

          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "push raced with main writer; retry $attempt"
            sleep 3
          done
          echo "failed to publish after retries" >&2
          exit 1
