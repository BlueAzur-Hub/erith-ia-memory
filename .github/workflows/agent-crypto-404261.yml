name: Agent-Crypto 40.4.261 Strategy A Proposal

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/agent-crypto-404261.yml'

permissions:
  contents: write

concurrency:
  group: agent-crypto-404261-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch Strategy A proposal owner
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('public/agent_crypto_erith_ia/administrator/app.js')
          text = path.read_text(encoding='utf-8')
          marker = '/* 40.4.144 — KRAKEN CLI LOCAL READ-ONLY HANDSHAKE'
          owner = '/* 40.4.261 — STRATEGY A TRADE PROPOSAL ENVELOPE FOUNDATION LOCK */'
          if text.count(owner):
              raise SystemExit('40.4.261 owner already present; refusing duplicate injection')
          if text.count(marker) != 1:
              raise SystemExit(f'expected one Kraken 40.4.144 marker, got {text.count(marker)}')

          block = r'''/* 40.4.261 — STRATEGY A TRADE PROPOSAL ENVELOPE FOUNDATION LOCK */
/* One responsibility: expose a deterministic BTC proposal candidate for the isolated
   Strategy A sandbox. This owner never executes, sizes, stores or transmits an order. */
let STRATEGY_A_LAST_PROPOSAL_404261=null;
function strategyAReadNumber404261(...values){
  for(const value of values){const n=Number(value);if(Number.isFinite(n))return n;}
  return null;
}
function strategyAHash404261(value){
  let h=2166136261;
  const s=String(value??"");
  for(let i=0;i<s.length;i++)h=Math.imul(h^s.charCodeAt(i),16777619);
  return (h>>>0).toString(16).padStart(8,"0");
}
function strategyABtcContext404261(){
  let coin=null,quote=null;
  try{coin=findCoinByQuery?.("BTC")||state?.coins?.find?.(row=>String(row?.symbol||"").toUpperCase()==="BTC")||null;}catch(_){}
  try{if(coin)quote=atlasCurrentQuoteForCoin?.(coin)||null;}catch(_){}
  const price=strategyAReadNumber404261(quote?.price,coin?.price,coin?.current_price);
  const change24h=strategyAReadNumber404261(
    coin?.price_change_percentage_24h,coin?.change_24h,coin?.change24h,coin?.change24hPct,coin?.changePct24h
  );
  return {
    asset_id:String(coin?.id||"bitcoin"),symbol:"BTC",
    price_eur:price>0?price:null,change_24h_pct:change24h,
    quote_source:String(quote?.source||coin?.source||"UNKNOWN").trim()||"UNKNOWN",
    available:!!coin&&price>0
  };
}
function strategyAOracleContext404261(){
  const root=document.getElementById("atlasOracleV0");
  const text=String(root?.textContent||"").replace(/\s+/g," ").trim();
  const upper=text.toUpperCase();
  const regimeMatch=upper.match(/RÉGIME\s+(TENDANCE HAUSSIÈRE|TENDANCE BAISSIÈRE|CONTRADICTOIRE|HAUSSIER|BAISSIER|MIXTE)/);
  const confMatch=upper.match(/(?:CONF\.?|CONFIANCE(?: DONNÉES)?)\s*(\d{1,3})\/100/);
  const active=/ORACLE\s*ACTIVE\s*·?\s*5\/5/.test(upper)||/ACTIVE\s*·?\s*5\/5/.test(upper);
  return {
    available:!!root,active,
    regime:regimeMatch?.[1]||"UNKNOWN",
    confidence:confMatch?Number(confMatch[1]):null,
    informational_only:true
  };
}
function strategyALocalContext404261(){
  let comparison=null,integration=null,acceptance=null;
  try{comparison=paperWorkspaceComparisonPayload404143();}catch(_){}
  try{integration=paperWorkspaceIntegrationTruth404151("strategy_a");}catch(_){}
  try{acceptance=simulationAcceptance404153();}catch(_){}
  const rows=Array.isArray(comparison?.rows)?comparison.rows:[];
  const row=rows.find(item=>[item?.workspace_key,item?.key,item?.workspace].some(v=>String(v||"")==="strategy_a"))
    ||rows.find(item=>/STRAT[ÉE]GIE A/i.test(String(item?.label||item?.name||"")))||null;
  const cash=strategyAReadNumber404261(row?.cash_eur,row?.cash,row?.portfolio?.cash,integration?.local?.cash);
  const exposure=strategyAReadNumber404261(row?.exposure_eur,row?.invested_eur,row?.positions_value_eur,row?.position_value_eur,row?.portfolio?.positionsValue,integration?.local?.position_value_eur);
  return {
    workspace:"strategy_a",kraken_workspace:"erith-strategy-a",
    active_workspace:String(typeof PAPER_WORKSPACE_404142!=="undefined"?PAPER_WORKSPACE_404142:""),
    cash_eur:cash,exposure_before_eur:exposure,
    static_safety_ok:acceptance?.static_ok===true,
    kraken_mapping_state:String(acceptance?.runtime_kraken_mapping||"UNTESTED"),
    integration_available:!!integration
  };
}
function strategyATradeProposal404261(){
  const btc=strategyABtcContext404261();
  const oracle=strategyAOracleContext404261();
  const local=strategyALocalContext404261();
  const bullishRegime=/HAUSSI/.test(oracle.regime)&&!/BAISS/.test(oracle.regime);
  const reasons=[];
  let status="PROPOSED";
  if(local.active_workspace!=="strategy_a"){status="NO_TRADE";reasons.push("Activer STRATÉGIE A avant de générer une proposition.");}
  if(!local.static_safety_ok){status="REJECTED";reasons.push("Audit statique Simulation non validé.");}
  if(!btc.available){status="NO_TRADE";reasons.push("Prix BTC critique indisponible.");}
  if(!oracle.available||!oracle.active){status="NO_TRADE";reasons.push("Oracle indisponible ou inactif.");}
  if(!bullishRegime){status="NO_TRADE";reasons.push(`Régime Oracle non haussier (${oracle.regime}).`);}
  if(!(Number.isFinite(oracle.confidence)&&oracle.confidence>=55)){status="NO_TRADE";reasons.push("Confiance Oracle absente ou inférieure à 55/100.");}
  if(!(Number.isFinite(btc.change_24h_pct)&&btc.change_24h_pct>0)){status="NO_TRADE";reasons.push("Variation BTC 24 h absente ou non positive.");}
  if(status==="PROPOSED")reasons.push("Baseline admissible : BTC 24 h positif + Oracle actif + régime haussier + confiance ≥ 55/100.");

  const decisionFingerprint=[btc.price_eur??"na",btc.change_24h_pct??"na",oracle.regime,oracle.confidence??"na",local.cash_eur??"na",local.exposure_before_eur??"na",status].join("|");
  const proposalId=`STRAT-A-BTC-${strategyAHash404261(decisionFingerprint)}`;
  return {
    schema:"agent_crypto_trade_proposal_v1",build:"40.4.261",
    proposal_id:proposalId,decision_fingerprint:decisionFingerprint,
    generated_at:new Date().toISOString(),strategy:"STRATEGY_A_V1",
    strategy_label:"BTC CONTINUATION BASELINE",workspace:"strategy_a",
    kraken_workspace:"erith-strategy-a",mode:"paper_proposal_only",
    asset_id:btc.asset_id,symbol:"BTC",status,
    direction:status==="PROPOSED"?"LONG":"NO_TRADE",horizon:"5m",
    market:btc,oracle,
    atlas:{context:"READ_ONLY_EXISTING_STATE",pipeline_mutation:false},
    data_quality:{critical_price_available:btc.available,simulation_static_safety_ok:local.static_safety_ok,kraken_mapping_state:local.kraken_mapping_state},
    entry_condition:"BTC 24h > 0 + Oracle actif + régime haussier + confiance ≥ 55/100",
    invalidation_condition:"Donnée critique absente/dégradée, régime non haussier, Oracle inactif ou confiance < 55/100",
    requested_notional_eur:null,authorized_notional_eur:null,
    exposure_before_eur:local.exposure_before_eur,exposure_after_eur:null,
    theoretical_stop:null,stop_state:"REQUIRES_RISK_GOVERNOR",
    position_sizing_owner:"RISK_GOVERNOR_NOT_IMPLEMENTED",
    cost_model:{state:"UNKNOWN",source:"not_bound_in_40.4.261",execution_allowed:false},
    reason:reasons.join(" "),
    safety:{simulation_only:true,proposal_only:true,real_order:false,kraken_order:false,credentials:false,wallet:false,withdrawal:false,storage_write:false,final_authorization:false}
  };
}
function renderStrategyATradeProposal404261(){
  const anchor=document.getElementById("simulationReadiness404152");
  if(!anchor)return;
  let panel=document.getElementById("strategyATradeProposal404261");
  if(!panel){
    panel=document.createElement("section");panel.id="strategyATradeProposal404261";
    panel.setAttribute("data-strategy-a-proposal-build","40.4.261");
    panel.style.cssText="margin:0 0 10px 0;border:1px solid rgba(98,236,255,.30);border-radius:12px;padding:10px 12px;background:rgba(4,22,32,.52)";
    panel.innerHTML=`<div style="display:flex;flex-wrap:wrap;align-items:center;gap:8px"><strong style="letter-spacing:.08em">STRATÉGIE A · TRADE PROPOSAL V1</strong><span style="font-size:10px;color:#7ef4bc">PAPER PROPOSAL ONLY · ZÉRO ORDRE</span><span style="flex:1"></span><button type="button" class="btn small" id="strategyAGenerate404261">GÉNÉRER PROPOSITION A</button></div><div id="strategyASummary404261" style="font-size:10px;color:var(--muted,#9fb0c5);margin-top:7px">Aucune proposition générée · BTC uniquement · Risk Governor non implémenté.</div>`;
    anchor.insertAdjacentElement("afterend",panel);
    panel.querySelector("#strategyAGenerate404261")?.addEventListener("click",()=>{STRATEGY_A_LAST_PROPOSAL_404261=strategyATradeProposal404261();renderStrategyATradeProposal404261();});
  }
  const summary=document.getElementById("strategyASummary404261");
  if(!summary)return;
  const p=STRATEGY_A_LAST_PROPOSAL_404261;
  if(!p){summary.textContent="Aucune proposition générée · BTC uniquement · Risk Governor non implémenté.";return;}
  const price=Number.isFinite(p.market?.price_eur)?fmtEUR.format(p.market.price_eur):"prix inconnu";
  const conf=Number.isFinite(p.oracle?.confidence)?`${p.oracle.confidence}/100`:"—";
  summary.textContent=`${p.status} · ${p.proposal_id} · BTC ${price} · Oracle ${p.oracle?.regime||"UNKNOWN"} · conf. ${conf} · ${p.reason}`;
  summary.style.color=p.status==="PROPOSED"?"#7ef4bc":(p.status==="REJECTED"?"#ff9f9f":"#ffd27a");
}
try{globalThis.AgentCryptoStrategyAProposal404261=Object.freeze({
  build:"40.4.261",generate:strategyATradeProposal404261,last:()=>STRATEGY_A_LAST_PROPOSAL_404261,
  paper_proposal_only:true,real_orders:false,kraken_orders:false,storage_write:false,new_fetch:false,new_timer:false,new_observer:false
});}catch(_){}

'''
          text = text.replace(marker, block + marker, 1)

          start = text.find('function renderSimulation() {')
          if start < 0:
              raise SystemExit('renderSimulation owner not found')
          end = text.find('\n}', start)
          if end < 0:
              raise SystemExit('renderSimulation end not found')
          render = text[start:end+2]
          call = '  renderSimulationAcceptance404153();'
          if render.count(call) != 1:
              raise SystemExit(f'expected one acceptance render call inside renderSimulation, got {render.count(call)}')
          if 'renderStrategyATradeProposal404261();' in render:
              raise SystemExit('Strategy A render call already present')
          render = render.replace(call, call+'\n  renderStrategyATradeProposal404261();', 1)
          text = text[:start] + render + text[end+2:]
          path.write_text(text, encoding='utf-8')
          PY

      - name: Prepare release contract
        shell: bash
        run: |
          cat > /tmp/404261-contract.json <<'JSON'
          {
            "build": "40.4.261",
            "parent_build": "40.4.260",
            "scope": "strategy_a_trade_proposal_envelope_foundation",
            "strategy": "STRATEGY_A_V1",
            "asset": "BTC",
            "mode": "paper_proposal_only",
            "proposal_only": true,
            "real_orders": false,
            "kraken_orders": false,
            "credentials": false,
            "wallet": false,
            "withdrawals": false,
            "final_sizing": false,
            "risk_governor_required": true,
            "new_fetch_owner": false,
            "new_timer": false,
            "new_observer": false,
            "new_storage_owner": false,
            "market_core_changed": false,
            "atlas_pipeline_changed": false,
            "oracle_engine_changed": false,
            "learning_changed": false,
            "graph_changed": false,
            "technical_reading_changed": false,
            "window_manager_changed": false
          }
          JSON

      - name: Canonical release identity
        shell: bash
        run: |
          python .github/scripts/agent_crypto_release_driver.py \
            --build 40.4.261 \
            --parent 40.4.260 \
            --release "STRATEGY A · TRADE PROPOSAL ENVELOPE FOUNDATION LOCK" \
            --status "strategy_a_trade_proposal_envelope_foundation_lock_404261" \
            --contract-key "strategy_a_trade_proposal_404261" \
            --contract-json /tmp/404261-contract.json \
            --lineage-note "40.4.261 Strategy A BTC Trade Proposal Envelope foundation: deterministic paper-only proposal, no order, no sizing authority, Market Core protected"

      - name: Static safety and syntax gates
        shell: bash
        run: |
          node --check public/agent_crypto_erith_ia/administrator/app.js
          node --check public/agent_crypto_erith_ia/administrator/js/app.js
          python .github/scripts/agent_crypto_version_truth_guard.py
          python - <<'PY'
          from pathlib import Path
          p=Path('public/agent_crypto_erith_ia/administrator/app.js')
          s=p.read_text(encoding='utf-8')
          a=s.index('/* 40.4.261 — STRATEGY A TRADE PROPOSAL ENVELOPE FOUNDATION LOCK */')
          b=s.index('/* 40.4.144 — KRAKEN CLI LOCAL READ-ONLY HANDSHAKE',a)
          section=s[a:b]
          forbidden=('fetch(','setInterval(','setTimeout(','MutationObserver','IntersectionObserver','WebSocket','localStorage','indexedDB','workspace create','/order')
          bad=[x for x in forbidden if x in section]
          if bad: raise SystemExit(f'forbidden owner(s) in 40.4.261 section: {bad}')
          required=(
            'schema:"agent_crypto_trade_proposal_v1"',
            'strategy:"STRATEGY_A_V1"',
            'mode:"paper_proposal_only"',
            'requested_notional_eur:null',
            'authorized_notional_eur:null',
            'position_sizing_owner:"RISK_GOVERNOR_NOT_IMPLEMENTED"',
            'real_order:false',
            'kraken_order:false',
            'storage_write:false',
            'renderStrategyATradeProposal404261();'
          )
          missing=[x for x in required if x not in s]
          if missing: raise SystemExit(f'missing 40.4.261 contract marker(s): {missing}')
          if s.count('renderStrategyATradeProposal404261();') != 1:
            raise SystemExit('Strategy A render call must exist exactly once')
          print('40.4.261 bounded safety gate: PASS')
          PY

      - name: Commit release and self-clean workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/agent-crypto-404261.yml
          git add public/agent_crypto_erith_ia/administrator
          git commit -m "feat Agent-Crypto 40.4.261 add Strategy A paper proposal envelope"
          git pull --rebase origin main
          node --check public/agent_crypto_erith_ia/administrator/app.js
          node --check public/agent_crypto_erith_ia/administrator/js/app.js
          python .github/scripts/agent_crypto_version_truth_guard.py
          git push origin HEAD:main
