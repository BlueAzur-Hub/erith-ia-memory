name: Agent Crypto Verified Multi-month Hourly History
on:
  pull_request:
    paths:
      - '.github/workflows/agent-crypto-hourly-history.yml'
      - 'public/agent_crypto_erith_ia/tools/build_historical_hourly_views.py'
      - 'public/agent_crypto_erith_ia/tools/historical_hourly_views_test.py'
      - 'public/agent_crypto_erith_ia/tools/build_verified_periods.py'
      - 'public/agent_crypto_erith_ia/tools/build_btc_integrated_max.py'
      - 'public/agent_crypto_erith_ia/tools/reconcile_btc_native_daily.py'
      - 'public/agent_crypto_erith_ia/tools/btc_native_daily_reconciliation_test.py'
      - 'public/agent_crypto_erith_ia/tools/btc_integrated_max_test.py'
      - 'public/agent_crypto_erith_ia/tools/verified_periods_test.py'
      - 'public/agent_crypto_erith_ia/tools/verified_periods_pages_smoke.py'
      - 'public/agent_crypto_erith_ia/tools/verified-periods-reader.test.mjs'
      - 'public/agent_crypto_erith_ia/administrator/js/verified-periods-reader.js'
      - 'public/agent_crypto_erith_ia/tools/shared-hourly-history.test.mjs'
      - 'public/agent_crypto_erith_ia/administrator/js/shared-hourly-history.js'
      - 'public/agent_crypto_erith_ia/administrator/js/shared-historical-view.js'
      - 'public/agent_crypto_erith_ia/administrator/historical-vault.html'
  push:
    branches: [main]
    paths:
      - '.github/workflows/agent-crypto-hourly-history.yml'
      - 'public/agent_crypto_erith_ia/tools/build_historical_hourly_views.py'
      - 'public/agent_crypto_erith_ia/tools/historical_hourly_views_test.py'
      - 'public/agent_crypto_erith_ia/tools/build_verified_periods.py'
      - 'public/agent_crypto_erith_ia/tools/build_btc_integrated_max.py'
      - 'public/agent_crypto_erith_ia/tools/reconcile_btc_native_daily.py'
      - 'public/agent_crypto_erith_ia/tools/btc_native_daily_reconciliation_test.py'
      - 'public/agent_crypto_erith_ia/tools/btc_integrated_max_test.py'
      - 'public/agent_crypto_erith_ia/tools/verified_periods_test.py'
      - 'public/agent_crypto_erith_ia/tools/verified_periods_pages_smoke.py'
      - 'public/agent_crypto_erith_ia/tools/verified-periods-reader.test.mjs'
      - 'public/agent_crypto_erith_ia/administrator/js/verified-periods-reader.js'
      - 'public/agent_crypto_erith_ia/tools/shared-hourly-history.test.mjs'
      - 'public/agent_crypto_erith_ia/administrator/js/shared-hourly-history.js'
      - 'public/agent_crypto_erith_ia/administrator/js/shared-historical-view.js'
      - 'public/agent_crypto_erith_ia/administrator/historical-vault.html'
  workflow_dispatch:
  workflow_run:
    # Hourly histories depend on the source Release catalog directly.
    # Avoid a fourth workflow_run level (identity -> addenda -> catalog -> monthly -> hourly).
    workflows:
      - 'Agent Crypto Top250 Historical Coverage Catalog'
    types: [completed]
  schedule:
    - cron: '59 6 * * *'
permissions:
  contents: write
concurrency:
  # A new commit may replace only its own PR checks; canonical main builds never cancel.
  group: agent-crypto-verified-hourly-history-${{ github.event.pull_request.number || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  btc-native-daily-audit:
    # Only official Binance native Spot 1d; no interpolation or venue mixing.
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: btc-native-daily-official-audit
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit incomplete day ledger and verify Binance ZIP checksum parsing
        run: |
          set -euo pipefail
          python -m py_compile public/agent_crypto_erith_ia/tools/reconcile_btc_native_daily.py
          python public/agent_crypto_erith_ia/tools/btc_native_daily_reconciliation_test.py
          python public/agent_crypto_erith_ia/tools/reconcile_btc_native_daily.py --audit-only
      - name: Reconcile native 1d sources while retaining native minute gaps
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os,pathlib
          root=pathlib.Path("public/agent_crypto_erith_ia/data/historical_archive_prototype")
          out=root/"btc_native_daily_reconciliation"
          existing=out/"index.json"
          if existing.is_file():
              old=json.loads(existing.read_text())
              original={
                "btc_max_integrated/index.json": hashlib.sha256((root/"btc_max_integrated/index.json").read_bytes()).hexdigest(),
                "btc_verified_gap_months/index.json": hashlib.sha256((root/"btc_verified_gap_months/index.json").read_bytes()).hexdigest()}
              archive=out/old.get("file","unavailable")
              if (old.get("source_catalog_sha256")==original and archive.is_file() and
                  hashlib.sha256(archive.read_bytes()).hexdigest()==old.get("sha256")):
                  pathlib.Path(os.environ["RUNNER_TEMP"],"native-daily-reconciled").touch()
                  print("NOOP: native 1d audit already materialized for this source snapshot")
          PY
          if [[ -f "$RUNNER_TEMP/native-daily-reconciled" ]]; then exit 0; fi
          python public/agent_crypto_erith_ia/tools/reconcile_btc_native_daily.py --output "$RUNNER_TEMP/btc_native_daily_reconciliation"
          python - <<'PY'
          import gzip,hashlib,json,os,pathlib
          out=pathlib.Path(os.environ["RUNNER_TEMP"])/"btc_native_daily_reconciliation"
          idx=json.loads((out/"index.json").read_text())
          raw=(out/idx["file"]).read_bytes()
          obj=json.loads(gzip.decompress(raw))
          assert idx["schema"]=="seven.crypto.btc.native-1d-reconciliation-index.v1"
          assert idx["pair"]=="BTCUSDT" and idx["quote"]=="USDT"
          assert idx["original_bars"]==3049 and idx["missing_minutes_unchanged"]==5881
          assert idx["bars"]==3049+idx["native_1d_recovered"]
          assert idx["unresolved_count"]+idx["native_1d_recovered"]==26
          assert len(raw)==idx["bytes"] and hashlib.sha256(raw).hexdigest()==idx["sha256"]
          assert len(obj["rows"])==idx["bars"]
          assert len(obj["native_1d_overrides"])==idx["native_1d_recovered"]
          assert len(idx["source_dates"])==26
          assert obj["native_1m_gaps_preserved"] is True
          print("NATIVE 1D CHECKSUM AUDIT PASSED",idx["native_1d_recovered"],"/26 recovered; unresolved:",idx["unresolved_dates"])
          PY
      - name: Publish separate evidence and daily-source reconciled Max
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          if [[ -f "$RUNNER_TEMP/native-daily-reconciled" ]]; then exit 0; fi
          root=public/agent_crypto_erith_ia/data/historical_archive_prototype
          for attempt in 1 2 3; do
            git fetch origin main
            for relative in btc_max_integrated/index.json btc_verified_gap_months/index.json; do
              old=$(sha256sum "$root/$relative" | cut -d' ' -f1)
              new=$(git show "origin/main:$root/$relative" | sha256sum | cut -d' ' -f1)
              if [[ "$old" != "$new" ]]; then
                echo "::error::Original native minute source changed during 1d archive audit"
                exit 1
              fi
            done
            git reset --hard origin/main
            mkdir -p "$root/btc_native_daily_reconciliation"
            cp -a "$RUNNER_TEMP/btc_native_daily_reconciliation/." "$root/btc_native_daily_reconciliation/"
            git add -- "$root/btc_native_daily_reconciliation"
            git diff --cached --check
            if git diff --cached --quiet; then echo 'NOOP: audit already published'; exit 0; fi
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Publish source-certified BTC native daily gap reconciliation'
            if git push origin HEAD:main; then exit 0; fi
          done
          echo "::error::Concurrent updates blocked native daily audit"
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: btc-native-daily-source-audit
          path: ${{ runner.temp }}/btc_native_daily_reconciliation/index.json
          if-no-files-found: ignore
          retention-days: 30
  btc-integrated-max:
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      GH_TOKEN: ${{ github.token }}
    concurrency:
      group: btc-integrated-max-source-repair
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate BTC monthly original sources and no synthesized daily candles
        run: |
          set -euo pipefail
          python -m py_compile public/agent_crypto_erith_ia/tools/build_btc_integrated_max.py
          python public/agent_crypto_erith_ia/tools/btc_integrated_max_test.py
          python public/agent_crypto_erith_ia/tools/build_btc_integrated_max.py --audit-only
      - name: Reconstruct once for any changed verified source fingerprint
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os,pathlib
          root=pathlib.Path("public/agent_crypto_erith_ia/data/historical_archive_prototype")
          dest=root/"btc_max_integrated"
          source={k:hashlib.sha256((root/k).read_bytes()).hexdigest()
            for k in ("top250_history_catalog/index.json",
                      "btc_verified_gap_months/index.json",
                      "calendar_year_hourly_shards/index.json")}
          if (dest/"index.json").exists():
              old=json.loads((dest/"index.json").read_text())
              payload=dest/old.get("file","not-found")
              if old.get("source_catalog_sha256")==source and payload.is_file() and hashlib.sha256(payload.read_bytes()).hexdigest()==old.get("sha256"):
                  pathlib.Path(os.environ["RUNNER_TEMP"],"btc-max-unchanged").touch()
                  print("NOOP: published BTC Max sources unchanged")
          PY
          if [[ -f "$RUNNER_TEMP/btc-max-unchanged" ]]; then exit 0; fi
          python public/agent_crypto_erith_ia/tools/build_btc_integrated_max.py --output "$RUNNER_TEMP/btc_max_integrated"
          python - <<'PY'
          import gzip,hashlib,json,os,pathlib
          folder=pathlib.Path(os.environ["RUNNER_TEMP"])/"btc_max_integrated"
          idx=json.loads((folder/"index.json").read_text())
          raw=(folder/idx["file"]).read_bytes()
          assert len(raw)==idx["bytes"]
          assert hashlib.sha256(raw).hexdigest()==idx["sha256"]
          data=json.loads(gzip.decompress(raw))
          assert len(data["rows"])==idx["bars"] and data["pair"]=="BTCUSDT"
          march=next(x for x in data["source_months"] if x["month"]=="2023-03")
          assert march["valid_daily_rows"]==30 and march["missing_source_minutes"]==80
          print("VERIFIED BTC MAX",idx["bars"],"authentic days")
          PY
      - name: Commit independently without rewriting the existing certified Top5 windows
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          if [[ -f "$RUNNER_TEMP/btc-max-unchanged" ]]; then exit 0; fi
          root=public/agent_crypto_erith_ia/data/historical_archive_prototype
          for attempt in 1 2 3; do
            git fetch origin main
            for relative in top250_history_catalog/index.json btc_verified_gap_months/index.json calendar_year_hourly_shards/index.json; do
              original=$(sha256sum "$root/$relative" | cut -d' ' -f1)
              current=$(git show "origin/main:$root/$relative" | sha256sum | cut -d' ' -f1)
              if [[ "$original" != "$current" ]]; then
                echo "::error::Canonical source changed while reconstructing BTC Max"
                exit 1
              fi
            done
            git reset --hard origin/main
            mkdir -p "$root/btc_max_integrated"
            cp -a "$RUNNER_TEMP/btc_max_integrated/." "$root/btc_max_integrated/"
            git add -- "$root/btc_max_integrated"
            git diff --cached --check
            if git diff --cached --quiet; then
              echo 'NOOP: new BTC Max already published'
              exit 0
            fi
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Publish verified gap-aware BTC Max native historical view'
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: btc-integrated-max-audit
          path: ${{ runner.temp }}/btc_max_integrated/index.json
          if-no-files-found: ignore
          retention-days: 30
  public-pages-smoke:
    # Independent network audit: GitHub Pages bytes must match all committed SHAs.
    # No new scheduled workflow; this job belongs to the historical workflow.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch all 35 published gzip files, compare hashes and validate OHLCV
        run: |
          set -euo pipefail
          python -m py_compile public/agent_crypto_erith_ia/tools/verified_periods_pages_smoke.py
          python public/agent_crypto_erith_ia/tools/verified_periods_pages_smoke.py
  verified-core-periods:
    # Reuse the existing historical workflow: no new scheduler or collector.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: agent-crypto-verified-core-periods-${{ github.event.pull_request.number || 'main' }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify identities, gaps, OHLCV and genuine one-year source coverage
        run: |
          set -euo pipefail
          python -m py_compile public/agent_crypto_erith_ia/tools/build_verified_periods.py
          python public/agent_crypto_erith_ia/tools/verified_periods_test.py
      - name: Compile seven original-source-qualified periods for five crypto markets
        run: |
          set -euo pipefail
          python public/agent_crypto_erith_ia/tools/build_verified_periods.py --output "$RUNNER_TEMP/verified_periods"
          python - <<'PY'
          import gzip, hashlib, json, os, pathlib
          folder = pathlib.Path(os.environ['RUNNER_TEMP'])/'verified_periods'
          index = json.loads((folder/'index.json').read_text())
          assert index['schema']=='seven.crypto.verified-period-index'
          assert index['core_assets']==5 and index['periods_per_asset']==7
          assert len(index['assets'])==5
          for asset in index['assets']:
              assert len(asset['periods'])==7
              for record in asset['periods']:
                  raw=(folder/record['file']).read_bytes()
                  assert len(raw)==record['bytes']
                  assert hashlib.sha256(raw).hexdigest()==record['sha256']
                  payload=json.loads(gzip.decompress(raw))
                  assert len(payload['rows'])==record['bars']
                  assert payload['quote']=='USDT' and payload['is_live'] is False
                  assert len(payload['gaps'])==record['gaps']
          print('VERIFIED TOP FIVE: 35 period files and complete SHA-256 verification')
          PY
      - name: Publish verified windows in the existing canonical Coffre
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          root=public/agent_crypto_erith_ia/data/historical_archive_prototype
          target="$root/verified_periods"
          git fetch origin main
          for relative in shared_monthly_views/index.json shared_hourly_views/index.json calendar_year_hourly_shards/index.json; do
            path="$root/$relative"
            original=$(sha256sum "$path" | cut -d ' ' -f1)
            current=$(git show "origin/main:$path" | sha256sum | cut -d ' ' -f1)
            if [[ "$original" != "$current" ]]; then
              echo "::error::Verified source changed during build: $relative"
              exit 1
            fi
          done
          git reset --hard origin/main
          mkdir -p "$target"
          cp -a "$RUNNER_TEMP/verified_periods/." "$target/"
          git add -- "$target"
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'NOOP: 35 verified views already published'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Publish five-market verified daily-to-year historical period projections'
          git push origin HEAD:main
      - name: Attach verified period manifest for audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verified-core-period-manifest
          path: ${{ runner.temp }}/verified_periods/index.json
          if-no-files-found: warn
          retention-days: 30
  verify-and-build:
    # Do not publish from failed or PR-only upstream checks; scheduled catalog refreshes retain their own downstream daily cadences.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.event != 'schedule')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run offline source, gap, SHA and Firefox-compatible reader regression
        run: |
          set -euo pipefail
          python -m py_compile public/agent_crypto_erith_ia/tools/build_historical_hourly_views.py
          python public/agent_crypto_erith_ia/tools/historical_hourly_views_test.py
          node --check public/agent_crypto_erith_ia/administrator/js/shared-hourly-history.js
          node --check public/agent_crypto_erith_ia/administrator/js/shared-historical-view.js
          node --test public/agent_crypto_erith_ia/tools/shared-hourly-history.test.mjs
          node --test public/agent_crypto_erith_ia/tools/shared-historical-view.test.mjs
          node --check public/agent_crypto_erith_ia/administrator/js/verified-periods-reader.js
          node --test public/agent_crypto_erith_ia/tools/verified-periods-reader.test.mjs
      - name: Build authentic 60d 90d annual Max historical multi-asset views
        run: |
          set -euo pipefail
          python public/agent_crypto_erith_ia/tools/build_historical_hourly_views.py \
            --output "$RUNNER_TEMP/shared_hourly_views" --workers 4
          python - <<'PY'
          import hashlib,json,os,pathlib
          folder=pathlib.Path(os.environ["RUNNER_TEMP"])/"shared_hourly_views"
          j=json.loads((folder/"index.json").read_text())
          assert j["schema"]=="aerith.public.ohlcv.shared.contiguous-hourly-index.v1"
          assert j["is_live"] is False and j["max_is_all_time"] is False
          assert 30<=j["archived_assets"]<=250 and j["quote"]=="USDT"
          assert len(j["assets"])==j["archived_assets"]
          assert any(e["id"]=="bitcoin" and e["months"]==12 and e["hourly_count"]==8760
                     for e in j["assets"])
          for e in j["assets"]:
              raw=(folder/e["file"]).read_bytes()
              assert len(raw)==e["bytes"]
              assert hashlib.sha256(raw).hexdigest()==e["sha256"]
              assert e["native_1m_count"]==60*e["hourly_count"]
          print("VERIFIED MULTI MONTH HOURLY",j["archived_assets"],flush=True)
          PY
      - name: Publish only validated hourly views to canonical historical vault
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          target=public/agent_crypto_erith_ia/data/historical_archive_prototype/shared_hourly_views
          catalog=public/agent_crypto_erith_ia/data/historical_archive_prototype/top250_history_catalog/index.json
          # Rebuilt files live outside the checkout. The authenticated source
          # catalog MUST still match main before the result may be published.
          source_sha=$(sha256sum "$catalog" | cut -d' ' -f1)
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            current_sha=$(git show "origin/main:$catalog" | sha256sum | cut -d' ' -f1)
            if [[ "$source_sha" != "$current_sha" ]]; then
              echo "::error::Source catalog changed while generating hourly views; refusing stale publish"
              exit 1
            fi
            # Old-index conflicts are not evidence that rebuilt candles failed.
            # Start a fresh verified-only commit on the current main tip instead
            # of rebasing over a competing update to the same index.json.
            git reset --hard origin/main
            mkdir -p "$target"
            cp -a "$RUNNER_TEMP/shared_hourly_views/." "$target/"
            git add -- "$target"
            git diff --cached --check
            if git diff --cached --quiet; then
              echo "NOOP: canonical hourly sources already match verified result"
              exit 0
            fi
            git commit -m "Publish authenticated contiguous hourly histories for archived markets"
            if git push origin HEAD:main; then
              echo "VERIFIED HOURLY PUBLISHED: attempt $attempt"
              exit 0
            fi
            echo "::warning::Concurrent main update while publishing; retry $attempt of 3"
          done
          echo "::error::Concurrent updates prevented safe hourly publication"
          exit 1
      - name: Deliver proof index
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verified-contiguous-hourly-history
          path: ${{ runner.temp }}/shared_hourly_views/index.json
          if-no-files-found: error
          retention-days: 30
      - name: Protect Trader, Market Core and Bridge
        if: always()
        run: |
          set -euo pipefail
          git diff --exit-code -- \
            public/agent_crypto_erith_ia/trader/ \
            public/agent_crypto_erith_ia/administrator/app.js \
            public/agent_crypto_erith_ia/core/ \
            public/agent_crypto_erith_ia/data/crypto/
