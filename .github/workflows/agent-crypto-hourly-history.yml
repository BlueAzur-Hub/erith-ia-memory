name: Agent Crypto Verified Multi-month Hourly History
on:
  pull_request:
    paths:
      - '.github/workflows/agent-crypto-hourly-history.yml'
      - 'public/agent_crypto_erith_ia/tools/build_historical_hourly_views.py'
      - 'public/agent_crypto_erith_ia/tools/historical_hourly_views_test.py'
      - 'public/agent_crypto_erith_ia/tools/build_verified_periods.py'
      - 'public/agent_crypto_erith_ia/tools/verified_periods_test.py'
      - 'public/agent_crypto_erith_ia/tools/verified_periods_pages_smoke.py'
      - 'public/agent_crypto_erith_ia/tools/verified-periods-reader.test.mjs'
      - 'public/agent_crypto_erith_ia/administrator/js/verified-periods-reader.js'
      - 'public/agent_crypto_erith_ia/tools/shared-hourly-history.test.mjs'
      - 'public/agent_crypto_erith_ia/administrator/js/shared-hourly-history.js'
      - 'public/agent_crypto_erith_ia/administrator/js/shared-historical-view.js'
      - 'public/agent_crypto_erith_ia/administrator/historical-vault.html'
  push:
    branches: [main]
    paths:
      - '.github/workflows/agent-crypto-hourly-history.yml'
      - 'public/agent_crypto_erith_ia/tools/build_historical_hourly_views.py'
      - 'public/agent_crypto_erith_ia/tools/historical_hourly_views_test.py'
      - 'public/agent_crypto_erith_ia/tools/build_verified_periods.py'
      - 'public/agent_crypto_erith_ia/tools/verified_periods_test.py'
      - 'public/agent_crypto_erith_ia/tools/verified_periods_pages_smoke.py'
      - 'public/agent_crypto_erith_ia/tools/verified-periods-reader.test.mjs'
      - 'public/agent_crypto_erith_ia/administrator/js/verified-periods-reader.js'
      - 'public/agent_crypto_erith_ia/tools/shared-hourly-history.test.mjs'
      - 'public/agent_crypto_erith_ia/administrator/js/shared-hourly-history.js'
      - 'public/agent_crypto_erith_ia/administrator/js/shared-historical-view.js'
      - 'public/agent_crypto_erith_ia/administrator/historical-vault.html'
  workflow_dispatch:
  workflow_run:
    # Hourly histories depend on the source Release catalog directly.
    # Avoid a fourth workflow_run level (identity -> addenda -> catalog -> monthly -> hourly).
    workflows:
      - 'Agent Crypto Top250 Historical Coverage Catalog'
    types: [completed]
  schedule:
    - cron: '59 6 * * *'
permissions:
  contents: write
concurrency:
  # PR checks cannot cancel the canonical production rebuild or each other.
  group: agent-crypto-verified-hourly-history-${{ github.event.pull_request.number || 'main' }}
  cancel-in-progress: false
jobs:
  public-pages-smoke:
    # Independent network audit: GitHub Pages bytes must match all committed SHAs.
    # No new scheduled workflow; this job belongs to the historical workflow.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch all 35 published gzip files, compare hashes and validate OHLCV
        run: |
          set -euo pipefail
          python -m py_compile public/agent_crypto_erith_ia/tools/verified_periods_pages_smoke.py
          python public/agent_crypto_erith_ia/tools/verified_periods_pages_smoke.py
  verified-core-periods:
    # Reuse the existing historical workflow: no new scheduler or collector.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: agent-crypto-verified-core-periods-${{ github.event.pull_request.number || 'main' }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify identities, gaps, OHLCV and genuine one-year source coverage
        run: |
          set -euo pipefail
          python -m py_compile public/agent_crypto_erith_ia/tools/build_verified_periods.py
          python public/agent_crypto_erith_ia/tools/verified_periods_test.py
      - name: Compile seven original-source-qualified periods for five crypto markets
        run: |
          set -euo pipefail
          python public/agent_crypto_erith_ia/tools/build_verified_periods.py --output "$RUNNER_TEMP/verified_periods"
          python - <<'PY'
          import gzip, hashlib, json, os, pathlib
          folder = pathlib.Path(os.environ['RUNNER_TEMP'])/'verified_periods'
          index = json.loads((folder/'index.json').read_text())
          assert index['schema']=='seven.crypto.verified-period-index'
          assert index['core_assets']==5 and index['periods_per_asset']==7
          assert len(index['assets'])==5
          for asset in index['assets']:
              assert len(asset['periods'])==7
              for record in asset['periods']:
                  raw=(folder/record['file']).read_bytes()
                  assert len(raw)==record['bytes']
                  assert hashlib.sha256(raw).hexdigest()==record['sha256']
                  payload=json.loads(gzip.decompress(raw))
                  assert len(payload['rows'])==record['bars']
                  assert payload['quote']=='USDT' and payload['is_live'] is False
                  assert len(payload['gaps'])==record['gaps']
          print('VERIFIED TOP FIVE: 35 period files and complete SHA-256 verification')
          PY
      - name: Publish verified windows in the existing canonical Coffre
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          root=public/agent_crypto_erith_ia/data/historical_archive_prototype
          target="$root/verified_periods"
          git fetch origin main
          for relative in shared_monthly_views/index.json shared_hourly_views/index.json calendar_year_hourly_shards/index.json; do
            path="$root/$relative"
            original=$(sha256sum "$path" | cut -d ' ' -f1)
            current=$(git show "origin/main:$path" | sha256sum | cut -d ' ' -f1)
            if [[ "$original" != "$current" ]]; then
              echo "::error::Verified source changed during build: $relative"
              exit 1
            fi
          done
          git reset --hard origin/main
          mkdir -p "$target"
          cp -a "$RUNNER_TEMP/verified_periods/." "$target/"
          git add -- "$target"
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'NOOP: 35 verified views already published'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Publish five-market verified daily-to-year historical period projections'
          git push origin HEAD:main
      - name: Attach verified period manifest for audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verified-core-period-manifest
          path: ${{ runner.temp }}/verified_periods/index.json
          if-no-files-found: warn
          retention-days: 30
  verify-and-build:
    # Do not publish from failed or PR-only upstream checks; scheduled catalog refreshes retain their own downstream daily cadences.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.event != 'schedule')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run offline source, gap, SHA and Firefox-compatible reader regression
        run: |
          set -euo pipefail
          python -m py_compile public/agent_crypto_erith_ia/tools/build_historical_hourly_views.py
          python public/agent_crypto_erith_ia/tools/historical_hourly_views_test.py
          node --check public/agent_crypto_erith_ia/administrator/js/shared-hourly-history.js
          node --check public/agent_crypto_erith_ia/administrator/js/shared-historical-view.js
          node --test public/agent_crypto_erith_ia/tools/shared-hourly-history.test.mjs
          node --test public/agent_crypto_erith_ia/tools/shared-historical-view.test.mjs
          node --check public/agent_crypto_erith_ia/administrator/js/verified-periods-reader.js
          node --test public/agent_crypto_erith_ia/tools/verified-periods-reader.test.mjs
      - name: Build authentic 60d 90d annual Max historical multi-asset views
        run: |
          set -euo pipefail
          python public/agent_crypto_erith_ia/tools/build_historical_hourly_views.py \
            --output "$RUNNER_TEMP/shared_hourly_views" --workers 4
          python - <<'PY'
          import hashlib,json,os,pathlib
          folder=pathlib.Path(os.environ["RUNNER_TEMP"])/"shared_hourly_views"
          j=json.loads((folder/"index.json").read_text())
          assert j["schema"]=="aerith.public.ohlcv.shared.contiguous-hourly-index.v1"
          assert j["is_live"] is False and j["max_is_all_time"] is False
          assert 30<=j["archived_assets"]<=250 and j["quote"]=="USDT"
          assert len(j["assets"])==j["archived_assets"]
          assert any(e["id"]=="bitcoin" and e["months"]==12 and e["hourly_count"]==8760
                     for e in j["assets"])
          for e in j["assets"]:
              raw=(folder/e["file"]).read_bytes()
              assert len(raw)==e["bytes"]
              assert hashlib.sha256(raw).hexdigest()==e["sha256"]
              assert e["native_1m_count"]==60*e["hourly_count"]
          print("VERIFIED MULTI MONTH HOURLY",j["archived_assets"],flush=True)
          PY
      - name: Publish only validated hourly views to canonical historical vault
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          target=public/agent_crypto_erith_ia/data/historical_archive_prototype/shared_hourly_views
          catalog=public/agent_crypto_erith_ia/data/historical_archive_prototype/top250_history_catalog/index.json
          # Rebuilt files live outside the checkout. The authenticated source
          # catalog MUST still match main before the result may be published.
          source_sha=$(sha256sum "$catalog" | cut -d' ' -f1)
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            current_sha=$(git show "origin/main:$catalog" | sha256sum | cut -d' ' -f1)
            if [[ "$source_sha" != "$current_sha" ]]; then
              echo "::error::Source catalog changed while generating hourly views; refusing stale publish"
              exit 1
            fi
            # Old-index conflicts are not evidence that rebuilt candles failed.
            # Start a fresh verified-only commit on the current main tip instead
            # of rebasing over a competing update to the same index.json.
            git reset --hard origin/main
            mkdir -p "$target"
            cp -a "$RUNNER_TEMP/shared_hourly_views/." "$target/"
            git add -- "$target"
            git diff --cached --check
            if git diff --cached --quiet; then
              echo "NOOP: canonical hourly sources already match verified result"
              exit 0
            fi
            git commit -m "Publish authenticated contiguous hourly histories for archived markets"
            if git push origin HEAD:main; then
              echo "VERIFIED HOURLY PUBLISHED: attempt $attempt"
              exit 0
            fi
            echo "::warning::Concurrent main update while publishing; retry $attempt of 3"
          done
          echo "::error::Concurrent updates prevented safe hourly publication"
          exit 1
      - name: Deliver proof index
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verified-contiguous-hourly-history
          path: ${{ runner.temp }}/shared_hourly_views/index.json
          if-no-files-found: error
          retention-days: 30
      - name: Protect Trader, Market Core and Bridge
        if: always()
        run: |
          set -euo pipefail
          git diff --exit-code -- \
            public/agent_crypto_erith_ia/trader/ \
            public/agent_crypto_erith_ia/administrator/app.js \
            public/agent_crypto_erith_ia/core/ \
            public/agent_crypto_erith_ia/data/crypto/
