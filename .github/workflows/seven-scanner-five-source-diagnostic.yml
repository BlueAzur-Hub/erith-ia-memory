name: Seven scanner five EUR source diagnostic
on:
  pull_request:
    paths:
      - "public/agent_crypto_erith_ia/tools/scanner_verified_history.cjs"
      - "public/agent_crypto_erith_ia/tools/test_scanner_verified_history.cjs"
      - ".github/workflows/seven-scanner-five-source-diagnostic.yml"
permissions:
  contents: read
jobs:
  acquire-diagnostic:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate exact five-only EUR collector
        run: |
          node --check public/agent_crypto_erith_ia/tools/scanner_verified_history.cjs
          node --test public/agent_crypto_erith_ia/tools/test_scanner_verified_history.cjs
      - name: Acquire real server 24-hour EUR histories for frozen screenshot identities
        run: |
          mkdir -p evidence
          node public/agent_crypto_erith_ia/tools/scanner_verified_history.cjs \
            "--ids=quant-network,rain,ethena,figure-heloc,hedera-hashgraph" \
            "--frame=firefox-screenshot-20261028-0854" \
            "--output=evidence/scanner_server_history.json"
      - name: Archive original source data for isolated evaluation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scanner-eur-five-screenshot-evidence
          path: evidence/scanner_server_history.json
          if-no-files-found: warn
          retention-days: 7
