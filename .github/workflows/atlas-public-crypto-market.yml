name: Atlas Public Crypto Market

on:
  workflow_dispatch:
  schedule:
    - cron: "11,41 * * * *"
      timezone: "Europe/Paris"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/atlas-public-crypto-market.yml"
      - "public/agent_crypto_erith_ia/tools/collect_public_crypto.py"

permissions:
  contents: write

# Core Top-250 publication owns only latest.json + status.json.
# A distinct group from unrelated Agent-Crypto builds lets this job retry cleanly,
# while the exact-file publisher prevents it from reverting extended.json.
concurrency:
  group: atlas-public-crypto-market-${{ github.ref }}
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install collector dependency
        run: python -m pip install --disable-pip-version-check requests==2.32.5

      - name: Collect CoinGecko USD and convert with ECB EUR rate
        run: >-
          python public/agent_crypto_erith_ia/tools/collect_public_crypto.py
          --root public/agent_crypto_erith_ia
          --timeout 25
          --minimum-assets 40

      - name: Validate public crypto snapshot contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import math
          from pathlib import Path

          root = Path("public/agent_crypto_erith_ia/data/crypto")
          latest_path = root / "latest.json"
          status_path = root / "status.json"
          if not status_path.is_file():
              raise SystemExit("crypto status.json missing")

          status = json.loads(status_path.read_text(encoding="utf-8"))
          if status.get("schema") != "agent_crypto_public_market_collector_status_v1":
              raise SystemExit("invalid crypto status schema")
          if status.get("status") not in {"ready", "degraded", "unavailable"}:
              raise SystemExit("unsupported crypto collector status")
          security = status.get("security") or {}
          if security.get("api_key_required") is not False:
              raise SystemExit("no-key contract missing")
          if security.get("browser_direct_market_fetch_required") is not False:
              raise SystemExit("browser independence contract missing")
          if security.get("exchange_order_allowed") is not False:
              raise SystemExit("exchange order lock missing")
          if security.get("wallet_action_allowed") is not False:
              raise SystemExit("wallet action lock missing")

          if not latest_path.is_file():
              raise SystemExit("public crypto latest.json missing")
          latest = json.loads(latest_path.read_text(encoding="utf-8"))
          if latest.get("schema") != "agent_crypto_public_market_snapshot_v1":
              raise SystemExit("invalid public crypto snapshot schema")
          coins = latest.get("coins") or []
          if len(coins) < 40 or int(latest.get("assets_count") or 0) != len(coins):
              raise SystemExit(f"insufficient crypto universe: {len(coins)}")
          fx = latest.get("fx") or {}
          rate = float(fx.get("eur_per_usd") or 0)
          if not math.isfinite(rate) or rate <= 0:
              raise SystemExit("invalid ECB EUR per USD rate")
          if str(fx.get("pair") or "").upper() != "USD/EUR":
              raise SystemExit("invalid FX pair")

          ids = set()
          for coin in coins:
              coin_id = str(coin.get("id") or "")
              if not coin_id or coin_id in ids:
                  raise SystemExit("missing or duplicate coin id")
              ids.add(coin_id)
              price_usd = float(coin.get("priceUsd") or 0)
              price_eur = float(coin.get("priceEur") or 0)
              if not all(math.isfinite(value) and value > 0 for value in (price_usd, price_eur)):
                  raise SystemExit(f"invalid price for {coin_id}")
              tolerance = max(1e-8, abs(price_usd * rate) * 1e-10)
              if abs(price_eur - price_usd * rate) > tolerance:
                  raise SystemExit(f"FX mismatch for {coin_id}")
              if coin.get("source") != "CoinGecko" or coin.get("sourceMode") != "github-public":
                  raise SystemExit(f"invalid provenance for {coin_id}")

          integrity = latest.get("integrity") or {}
          required_true = (
              "no_invented_values",
              "original_usd_preserved",
              "all_eur_monetary_values_use_single_fx_rate",
              "percentage_variations_remain_coingecko_usd_based",
              "last_valid_preserved_on_failure",
          )
          if any(integrity.get(key) is not True for key in required_true):
              raise SystemExit("public crypto integrity lock missing")
          if integrity.get("browser_direct_market_fetch_required") is not False:
              raise SystemExit("browser direct market lock missing")
          if integrity.get("orders_generated") is not False or integrity.get("wallet_actions_generated") is not False:
              raise SystemExit("financial action lock missing")

          forbidden = ("x-api-key", "authorization:", "bearer ", "ghp_", "github_pat_")
          for path in root.rglob("*.json"):
              text = path.read_text(encoding="utf-8").lower()
              if any(token in text for token in forbidden):
                  raise SystemExit(f"forbidden secret marker in {path}")

          print({
              "status": status.get("status"),
              "assets": len(coins),
              "snapshot": latest.get("snapshot_id"),
              "fx_date": fx.get("source_date"),
          })
          PY

      - name: Write workflow summary
        if: always()
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          root = Path("public/agent_crypto_erith_ia/data/crypto")
          status = json.loads((root / "status.json").read_text(encoding="utf-8"))
          latest_path = root / "latest.json"
          latest = json.loads(latest_path.read_text(encoding="utf-8")) if latest_path.is_file() else {}
          print("## Atlas Public Crypto Market · Canonical Snapshot Publication Recovery R1")
          print(f"- Collector state: **{status.get('status')}**")
          print(f"- Assets published: **{latest.get('assets_count', 0)}/250**")
          print(f"- Canonical snapshot: **{latest.get('snapshot_id', '—')}**")
          print(f"- Schedule: **11 and 41 Europe/Paris each hour**")
          print(f"- Market source: **CoinGecko USD**")
          print(f"- Conversion: **ECB USD/EUR · {latest.get('fx', {}).get('source_date', '—')}**")
          print(f"- Role: **broad market snapshot/cache — never execution quote**")
          print(f"- Browser direct CoinGecko market request required: **No**")
          if status.get("last_error"):
              print(f"- Collector warning: `{status['last_error'][:1000]}`")
          PY

      - name: Publish canonical Top-250 crypto data · dual qualification
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bash .github/scripts/agent_crypto_publish_live_data.sh \
            dual \
            public/agent_crypto_erith_ia/data/crypto \
            "archive public crypto market snapshot" \
            "publish live crypto Top-250 snapshot" \
            latest.json status.json

      - name: Require a usable public snapshot
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("public/agent_crypto_erith_ia/data/crypto")
          path = root / "latest.json"
          status_path = root / "status.json"
          if not path.is_file():
              raise SystemExit("No usable public crypto snapshot is available")
          payload = json.loads(path.read_text(encoding="utf-8"))
          status = json.loads(status_path.read_text(encoding="utf-8"))
          count = int(payload.get("assets_count") or 0)
          if count < 40:
              raise SystemExit(f"Public crypto snapshot incomplete: {count}/250")
          if status.get("status") != "ready":
              raise SystemExit(
                  "Collector did not publish a fresh snapshot; the last valid public snapshot was preserved"
              )
          print(f"Public crypto snapshot ready: {count}/250 · {payload.get('snapshot_id')}")
          PY