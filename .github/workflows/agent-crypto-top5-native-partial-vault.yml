name: Agent Crypto Top5 Authenticated Partial Native Vault
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/agent-crypto-top5-native-partial-vault.yml'
      - 'public/agent_crypto_erith_ia/tools/archive_top5_partial_months.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: agent-crypto-top5-original-partial-vault
  cancel-in-progress: false
jobs:
  preserve-authentic-partial-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_TAG: crypto-top5-binance-partial-months-2026-10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify original source parser and SQLite precision with isolated toy fixture
        run: |
          set -euo pipefail
          python -m py_compile \
            public/agent_crypto_erith_ia/tools/audit_top5_incomplete_months.py \
            public/agent_crypto_erith_ia/tools/archive_top5_partial_months.py
          python public/agent_crypto_erith_ia/tools/archive_top5_partial_months.py --self-test
      - name: Reject drift in previously source-verified 14-month archive catalog
        run: |
          set -euo pipefail
          root=public/agent_crypto_erith_ia/data/historical_archive_prototype
          git fetch origin main
          old=$(sha256sum "$root/top5_original_gap_audit/index.json" | cut -d' ' -f1)
          new=$(git show "origin/main:$root/top5_original_gap_audit/index.json" | sha256sum | cut -d' ' -f1)
          test "$old" = "$new" || { echo "::error::Historical proof changed while reading"; exit 1; }
      - name: Download all 14 original ZIP and checksums and build queryable immutable SQLite copies
        run: |
          set -euo pipefail
          python public/agent_crypto_erith_ia/tools/archive_top5_partial_months.py \
            --stage --output "$RUNNER_TEMP/top5-native-partial-release" --workers 3
      - name: Confirm staged Release contains original prices, 1881 empty 1m slots and zero synthetic rows
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,pathlib,hashlib
          base=pathlib.Path(os.environ["RUNNER_TEMP"])/"top5-native-partial-release"
          j=json.loads((base/"manifest.json").read_text())
          assert j["stored_months"]==14 and j["stored_original_candles"]==612999
          assert j["original_missing_minutes"]==1881 and j["synthetic_rows"]==0
          names={"manifest.json"}
          for row in j["months"]:
              assert row["sqlite"]["rows"]==row["native_rows"]
              assert row["native_rows"]+row["missing_minutes"]==row["calendar_minutes"]
              assert sum(x["missing_minutes"] for x in row["missing_intervals"])==row["missing_minutes"]
              for key in ("original_zip","official_checksum","sqlite"):
                  asset=row[key]
                  assert asset["name"] not in names
                  names.add(asset["name"])
                  p=base/asset["name"]
                  assert p.is_file() and p.stat().st_size==asset["bytes"]
                  assert hashlib.sha256(p.read_bytes()).hexdigest()==asset["sha256"]
          assert len(names)==43 and {p.name for p in base.iterdir()}==names
          print("ORIGINAL NATIVE BINARY VAULT VALIDATED",j["stored_months"],j["stored_original_candles"],j["original_missing_minutes"])
          PY
      - name: Publish original ZIPs, Binance checksum witnesses, SQLite files and manifest as immutable GitHub Release
        run: |
          set -euo pipefail
          root=public/agent_crypto_erith_ia/data/historical_archive_prototype
          folder="$RUNNER_TEMP/top5-native-partial-release"
          git fetch origin main
          old=$(sha256sum "$root/top5_original_gap_audit/index.json" | cut -d' ' -f1)
          new=$(git show "origin/main:$root/top5_original_gap_audit/index.json" | sha256sum | cut -d' ' -f1)
          test "$old" = "$new" || { echo "::error::Source audit updated, do not publish obsolete Release"; exit 1; }
          if gh release view "$SOURCE_TAG" --json tagName > "$RUNNER_TEMP/existing-partial-tag.json" 2>"$RUNNER_TEMP/tag-error.txt"; then
            echo "IMMUTABLE SOURCE RELEASE EXISTS: verifying, not overwriting"
            mkdir -p "$RUNNER_TEMP/existing"
            gh release download "$SOURCE_TAG" --pattern manifest.json --dir "$RUNNER_TEMP/existing"
            cmp "$RUNNER_TEMP/existing/manifest.json" "$folder/manifest.json" || {
              echo "::error::Previously published source manifest does not match"; exit 1;
            }
          else
            if ! grep -Eqi 'release not found|HTTP 404|not found' "$RUNNER_TEMP/tag-error.txt"; then
              cat "$RUNNER_TEMP/tag-error.txt"
              exit 1
            fi
            gh release create "$SOURCE_TAG" "$folder"/* \
              --target "$GITHUB_SHA" \
              --title "Binance Spot Top5 original native partial 1m archive (2021-2023)" \
              --notes "Four verified Binance Spot market pairs, fourteen original monthly ZIPs and official checksum documents; one queryable SQLite per month with original 1m OHLCV and complete provenance. Gaps are retained; no interpolated candles. Trader and Interface untouched." \
              --latest=false
          fi
          gh release view "$SOURCE_TAG" --json assets,isDraft,url > "$RUNNER_TEMP/actual-release.json"
          python - <<'PY'
          import json,os,pathlib
          temp=pathlib.Path(os.environ["RUNNER_TEMP"])
          actual=json.loads((temp/"actual-release.json").read_text())
          source=temp/"top5-native-partial-release"
          files={p.name:p.stat().st_size for p in source.iterdir()}
          published={a["name"]:a["size"] for a in actual["assets"]}
          assert not actual["isDraft"],"Unexpected unpublished Release"
          assert published==files,(sorted(published), sorted(files))
          print("GITHUB RELEASE VERIFIED",actual["url"],len(published),"immutable source assets")
          PY
      - name: Commit searchable index to GitHub main without changing original full-month canonical catalog
        run: |
          set -euo pipefail
          root=public/agent_crypto_erith_ia/data/historical_archive_prototype
          source="$RUNNER_TEMP/top5-native-partial-release/manifest.json"
          dest="$root/top5_partial_source_vault/index.json"
          for attempt in 1 2 3; do
            git fetch origin main
            a=$(sha256sum "$root/top5_original_gap_audit/index.json" | cut -d' ' -f1)
            b=$(git show "origin/main:$root/top5_original_gap_audit/index.json" | sha256sum | cut -d' ' -f1)
            test "$a" = "$b" || { echo "::error::Original audit changed during Release publication"; exit 1; }
            git reset --hard origin/main
            mkdir -p "$(dirname "$dest")"
            cp "$source" "$dest"
            git add -- "$dest"
            git diff --cached --check
            if git diff --cached --quiet; then
              echo "NOOP: queryable archive manifest already indexed"
              exit 0
            fi
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m "Coffre: index immutable authentic Top5 partial OHLCV and SQLite archives"
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
      - name: Preserve source-only bundle manifest as CI artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: top5-native-partial-release-manifest
          path: ${{ runner.temp }}/top5-native-partial-release/manifest.json
          retention-days: 30
          if-no-files-found: ignore
      - name: Assert Trader, Admin, Bridge and canonical monthly stores untouched by this job
        if: always()
        run: |
          set -euo pipefail
          git diff --exit-code -- \
            public/agent_crypto_erith_ia/trader/ \
            public/agent_crypto_erith_ia/administrator/ \
            public/agent_crypto_erith_ia/data/historical_archive_prototype/top250_multisource_coverage/ \
            public/agent_crypto_erith_ia/data/historical_archive_prototype/top5_original_gap_audit/
