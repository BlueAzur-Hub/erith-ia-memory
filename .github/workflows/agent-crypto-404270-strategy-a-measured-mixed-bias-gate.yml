name: Agent-Crypto 40.4.270 Strategy A Measured Mixed-Bias Gate

on:
  push:
    branches: [ main ]
    paths:
      - '.github/scripts/agent_crypto_404270_strategy_a_measured_mixed_bias_gate.py'
      - '.github/workflows/agent-crypto-404270-strategy-a-measured-mixed-bias-gate.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: agent-crypto-404270-strategy-a-measured-mixed-bias-gate
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure release identity
        run: |
          git config user.name "Seven Heaven Release"
          git config user.email "actions@users.noreply.github.com"

      - name: Rebase on current main
        run: git pull --rebase origin main

      - name: Build validate and package 40.4.270
        run: python .github/scripts/agent_crypto_404270_strategy_a_measured_mixed_bias_gate.py

      - name: Commit release and retire temporary tooling
        run: |
          git rm .github/scripts/agent_crypto_404270_strategy_a_measured_mixed_bias_gate.py
          git rm .github/workflows/agent-crypto-404270-strategy-a-measured-mixed-bias-gate.yml
          git add public/agent_crypto_erith_ia/administrator coordination/inter_ai_dialogues/agent_crypto
          git commit -m "agent-crypto: build 40.4.270 strategy a measured mixed-bias entry gate lock"
          git push origin HEAD:main

      - name: Upload differential release artifact
        uses: actions/upload-artifact@v4
        with:
          name: AGENT_CRYPTO_40_4_270_STRATEGY_A_MEASURED_MIXED_BIAS_ENTRY_GATE
          path: |
            coordination/inter_ai_dialogues/agent_crypto/AGENT_CRYPTO_40_4_270_STRATEGY_A_MEASURED_MIXED_BIAS_ENTRY_GATE.zip
            coordination/inter_ai_dialogues/agent_crypto/AGENT_CRYPTO_40_4_270_STRATEGY_A_MEASURED_MIXED_BIAS_ENTRY_GATE_SHA256.txt
          if-no-files-found: error
