name: Agent-Crypto direct release 40.4.286

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/agent-crypto-direct-release-40.4.286.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build 40.4.286 from canonical 40.4.284
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from datetime import datetime, timezone
          import json, hashlib, zipfile

          base=Path('public/agent_crypto_erith_ia/administrator')
          release='AETHER VEILLE · CRYPTO OPERATOR RELEVANCE SCOPE LOCK'
          status='aether_veille_crypto_operator_relevance_scope_lock_404286'
          token='market-core-v2.0-alpha-build-40.4.286'
          now=datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z')

          build_path=base/'build.json'
          current=json.loads(build_path.read_text(encoding='utf-8'))
          assert current['build']=='40.4.284', f"expected 40.4.284, got {current.get('build')}"
          assert current['engine']=='38.15.11'

          aether_path=base/'js/aether.js'
          s=aether_path.read_text(encoding='utf-8')
          start_marker='  function aetherNewsCanonicalFrenchEvent40110(event){\n  function aetherVeilleOperatorEligible404279(event){'
          start=s.find(start_marker)
          assert start>=0, 'malformed 40.4.279 scope marker not found'
          body_marker='\n    if(!event)return event;'
          body=s.find(body_marker,start)
          assert body>=0, 'canonical French event body marker not found'
          eligibility=r'''  function aetherVeilleOperatorEligible404286(event){
            const canonical=aetherNewsCanonicalFrenchEvent40110(event)||event||{};
            const assets=(Array.isArray(canonical?.assets)?canonical.assets:[]).map(v=>String(v||"").trim().toUpperCase()).filter(Boolean);
            const domains=(Array.isArray(canonical?.driver_domains)?canonical.driver_domains:[]).map(v=>String(v||"").trim().toLowerCase()).filter(Boolean);
            const topics=(Array.isArray(canonical?.matched_topics)?canonical.matched_topics:[]).map(v=>String(v||"").trim().toLowerCase()).filter(Boolean);
            const label=String(canonical?.event_label||"").toLowerCase();
            const headline=String(canonical?.headline_fr_display||canonical?.headline_fr||canonical?.headline||"").toLowerCase();
            const semanticText=[label,headline,...topics].join(" ");
            const cryptoSymbols=new Set([
              "BTC","ETH","BNB","XRP","SOL","USDT","USDC","DOGE","ADA","TRX","LINK","XLM","BCH","LTC",
              "AVAX","DOT","SUI","APT","ARB","OP","MATIC","UNI","AAVE","ONDO","MKR","PENDLE","NEAR","TAO",
              "RNDR","ICP","SHIB","PEPE","XMR","ZEC"
            ]);
            const assetAnchor=assets.some(symbol=>cryptoSymbols.has(symbol));
            const cryptoAnchor=assetAnchor||/(?:\bbitcoin\b|\bbtc\b|\bethereum\b|\bether\b|\beth\b|\bsolana\b|\bsol\b|\bxrp\b|\bbnb\b|\bcrypto(?:monnaie|currency)?s?\b|\bblockchain\b|\bdefi\b|\bstablecoin\b|\bweb3\b|\bwallet\b|\btoken\b|\baltcoin\b|\bmemecoin\b|\bon[- ]?chain\b|\bstaking\b|\bmining\b|\bminage\b|\bperpetuals?\b)/i.test(semanticText);
            const macroDomain=domains.includes("macro_liquidity");
            const macroAnchor=macroDomain&&/(?:federal reserve|\bfed\b|\bbce\b|\becb\b|treasury|banque centrale|central bank|taux|rates?|inflation|emploi|jobs|liquidit|jackson hole)/i.test(semanticText);
            // 40.4.286 — Aether owns a scarce operator lane, not the full News Sentinel archive.
            // A generic "marché global" sector, a crypto-media source, or a high impact score alone
            // never makes an unrelated world story eligible. The canonical archive remains untouched.
            return cryptoAnchor||macroAnchor;
          }
          function aetherNewsCanonicalFrenchEvent40110(event){'''
          s=s[:start]+eligibility+s[body:]
          s=s.replace('  Build: 40.4.139','  Build: 40.4.286',1)
          old_rev='  Revision: 40.4.134 discoverability lock. Existing Aether Attention, Maintenon five-day weather and Atlas AUTO owners preserved; the visible system band opens the existing detailed panel.'
          new_rev='  Revision: 40.4.286 operator relevance scope lock. The scarce Aether VEILLE lane is crypto/operator qualified; News Sentinel canonical archive remains untouched.'
          assert old_rev in s
          s=s.replace(old_rev,new_rev,1)

          fn=s.find('  function aetherVeilleEvents4087(){')
          assert fn>=0
          qstart=s.find('        const canonical=(Array.isArray(newsFeedState?.payload?.events)?newsFeedState.payload.events:[])',fn)
          qend_marker='        else addPool(newsFeedState?.events);'
          qend=s.find(qend_marker,qstart)
          assert qstart>=0 and qend>=0
          qend+=len(qend_marker)
          queue=r'''        const canonicalAll=(Array.isArray(newsFeedState?.payload?.events)?newsFeedState.payload.events:[])
                    .filter(event=>String(event?.headline_fr_display||event?.headline_fr||event?.headline||"").replace(/\s+/g," " ).trim());
                  const canonical=canonicalAll.filter(aetherVeilleOperatorEligible404286);
                  // 40.4.132 — VEILLE is a story reader: canonical content-bearing events own the queue.
                  // 40.4.286 — the scarce operator lane is filtered before rank/diversity selection.
                  // Derived/UI rows remain usable only when the canonical payload is genuinely absent,
                  // and they are subject to the exact same relevance gate.
                  if(canonical.length)addPool(canonical);
                  else if(!canonicalAll.length)addPool((Array.isArray(newsFeedState?.events)?newsFeedState.events:[]).filter(aetherVeilleOperatorEligible404286));'''
          s=s[:qstart]+queue+s[qend:]
          assert 'aetherVeilleOperatorEligible404279' not in s
          assert s.count('function aetherVeilleOperatorEligible404286')==1
          aether_path.write_text(s,encoding='utf-8',newline='\n')

          p=base/'app.js'
          s=p.read_text(encoding='utf-8')
          old='const ATLAS_BUILD = "40.4.284";'
          assert s.count(old)==1
          p.write_text(s.replace(old,'const ATLAS_BUILD = "40.4.286";',1),encoding='utf-8',newline='\n')

          p=base/'js/app.js'
          s=p.read_text(encoding='utf-8')
          assert 'const ADMIN_BUILD = "40.4.284";' in s
          assert 'const ADMIN_RELEASE = "MEMORY COVERAGE GAP-AWARE TRUTH + COLOR IDENTITY LOCK";' in s
          s=s.replace('const ADMIN_BUILD = "40.4.284";','const ADMIN_BUILD = "40.4.286";',1)
          s=s.replace('const ADMIN_RELEASE = "MEMORY COVERAGE GAP-AWARE TRUTH + COLOR IDENTITY LOCK";',f'const ADMIN_RELEASE = "{release}";',1)
          p.write_text(s,encoding='utf-8',newline='\n')

          p=base/'index.html'
          s=p.read_text(encoding='utf-8')
          replacements=[
            ('<meta name="atlas-build" content="40.4.284" />','<meta name="atlas-build" content="40.4.286" />'),
            ('<meta name="administrator-build" content="40.4.284" />','<meta name="administrator-build" content="40.4.286" />'),
            ('<meta name="administrator-release" content="MEMORY COVERAGE GAP-AWARE TRUTH + COLOR IDENTITY LOCK" />',f'<meta name="administrator-release" content="{release}" />'),
            ('<meta name="atlas-asset-token" content="market-core-v2.0-alpha-build-40.4.284" />',f'<meta name="atlas-asset-token" content="{token}" />'),
            ('<title>Agent-Crypto @erith.IA — Build 40.4.284 · Administrator</title>','<title>Agent-Crypto @erith.IA — Build 40.4.286 · Administrator</title>'),
            ('Agent-Crypto @erith.IA · Market Core · Build 40.4.284 · Version : Parker Lewis Can\'t Lose','Agent-Crypto @erith.IA · Market Core · Build 40.4.286 · Version : Parker Lewis Can\'t Lose'),
            ('./app.js?v=administrator-build-40.4.284','./app.js?v=administrator-build-40.4.286'),
            ('./js/aether.js?v=administrator-build-40.4.281','./js/aether.js?v=administrator-build-40.4.286'),
            ('./js/app.js?v=administrator-build-40.4.281','./js/app.js?v=administrator-build-40.4.286')
          ]
          for old,new in replacements:
            assert old in s, f'missing index token: {old}'
            s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8',newline='\n')

          b=current
          b.update(build='40.4.286',release=release,published=True,status=status)
          build_path.write_text(json.dumps(b,ensure_ascii=False,indent=2)+'\n',encoding='utf-8',newline='\n')

          admin_path=base/'administrator-version.json'
          a=json.loads(admin_path.read_text(encoding='utf-8'))
          a.update(build='40.4.286',release=release,status=status,prepared_at=now,published_at=now,global_versioning='40.4.286',asset_token=token,parent_build='40.4.284')
          api=a.get('integrity',{}).get('publication_identity')
          if isinstance(api,dict):
            api.update(build='40.4.286',asset_token=token,status=status)
          admin_path.write_text(json.dumps(a,ensure_ascii=False,indent=2)+'\n',encoding='utf-8',newline='\n')

          def sha(path):
            return hashlib.sha256(path.read_bytes()).hexdigest()

          vpath=base/'version.json'
          v=json.loads(vpath.read_text(encoding='utf-8'))
          v.update(release=release,build='40.4.286',asset_token=token,status=status,prepared_at=now,published_at=now,parent_build='40.4.284')
          lineage=v.get('lineage','')
          suffix=' → 40.4.286 Aether VEILLE crypto/operator relevance scope lock; canonical News Sentinel archive, Market Core 38.15.11, Web Classic and Technical Reading preserved.'
          if '40.4.286 Aether VEILLE crypto/operator relevance scope lock' not in lineage:
            v['lineage']=lineage+suffix
          fmap=v.get('files')
          if isinstance(fmap,dict):
            for rel in ['index.html','app.js','js/app.js','js/aether.js','build.json','administrator-version.json']:
              if rel in fmap:
                fmap[rel]=sha(base/rel)
          vpi=v.get('integrity',{}).get('publication_identity')
          if isinstance(vpi,dict):
            vpi.update(build='40.4.286',asset_token=token,status=status,app_sha256=sha(base/'app.js'))
          vpath.write_text(json.dumps(v,ensure_ascii=False,indent=2)+'\n',encoding='utf-8',newline='\n')

          changed=[
            'js/aether.js','app.js','js/app.js','index.html','build.json','version.json','administrator-version.json'
          ]
          out=Path('/tmp/AGENT_CRYPTO_40_4_286_AETHER_VEILLE_CRYPTO_OPERATOR_RELEVANCE_SCOPE_LOCK_CLEAN_UPLOAD.zip')
          with zipfile.ZipFile(out,'w',zipfile.ZIP_DEFLATED,compresslevel=9) as z:
            for rel in changed:
              z.write(base/rel,(base/rel).as_posix())
          print('BUILD',json.loads(build_path.read_text(encoding='utf-8'))['build'])
          print('ZIP',out,sha(out))
          PY

      - name: Validate runtime and protected contracts
        shell: bash
        run: |
          set -euo pipefail
          A=public/agent_crypto_erith_ia/administrator
          node --check "$A/js/aether.js"
          node --check "$A/app.js"
          node --check "$A/js/app.js"
          python3 - <<'PY'
          from pathlib import Path
          import json
          a=Path('public/agent_crypto_erith_ia/administrator')
          b=json.loads((a/'build.json').read_text(encoding='utf-8'))
          v=json.loads((a/'version.json').read_text(encoding='utf-8'))
          m=json.loads((a/'administrator-version.json').read_text(encoding='utf-8'))
          assert b['build']==v['build']==m['build']=='40.4.286'
          assert b['engine']=='38.15.11'
          assert v['engine']['reference_build']=='38.15.11'
          assert v['parent_build']=='40.4.284' and m['parent_build']=='40.4.284'
          s=(a/'js/aether.js').read_text(encoding='utf-8')
          assert 'aetherVeilleOperatorEligible404279' not in s
          assert s.count('function aetherVeilleOperatorEligible404286')==1
          assert 'canonicalAll.filter(aetherVeilleOperatorEligible404286)' in s
          assert 'else if(!canonicalAll.length)' in s
          h=(a/'index.html').read_text(encoding='utf-8')
          assert 'administrator-build-40.4.286' in h
          assert 'shared-memory-gap-aware-color-40.4.284.js?v=administrator-build-40.4.284' in h
          print('VALIDATION PASS 40.4.286 / ENGINE 38.15.11')
          PY
          git diff --check -- "$A"

      - name: Commit direct canonical release
        shell: bash
        run: |
          set -euo pipefail
          A=public/agent_crypto_erith_ia/administrator
          git config user.name "BlueAzur-Hub"
          git config user.email "Blue.Azur@protonmail.com"
          git rm .github/workflows/agent-crypto-direct-release-40.4.286.yml
          git add "$A/js/aether.js" "$A/app.js" "$A/js/app.js" "$A/index.html" "$A/build.json" "$A/version.json" "$A/administrator-version.json"
          git diff --cached --check
          git commit -m "release Agent-Crypto 40.4.286 Aether relevance scope lock"
          git push origin HEAD:main

      - name: Upload CLEAN_UPLOAD ZIP
        uses: actions/upload-artifact@v4
        with:
          name: AGENT_CRYPTO_40_4_286_AETHER_VEILLE_CRYPTO_OPERATOR_RELEVANCE_SCOPE_LOCK_CLEAN_UPLOAD
          path: /tmp/AGENT_CRYPTO_40_4_286_AETHER_VEILLE_CRYPTO_OPERATOR_RELEVANCE_SCOPE_LOCK_CLEAN_UPLOAD.zip
          if-no-files-found: error
          retention-days: 30
