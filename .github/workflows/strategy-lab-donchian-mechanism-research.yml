name: Strategy Lab Donchian Mechanism Research

on:
  push:
    branches:
      - research/strategy-lab-donchian-multiasset-2026-11-16
    paths:
      - 'seven_heaven_strategy_lab/tools/donchian_mechanism.py'
      - 'seven_heaven_strategy_lab/tests/test_donchian_mechanism.py'
      - '.github/workflows/strategy-lab-donchian-mechanism-research.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mechanism:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    defaults:
      run:
        working-directory: seven_heaven_strategy_lab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Run mechanism unit tests
        run: python -m unittest tests.test_donchian_mechanism

      - name: Download fixed Top5 source set
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/donchian-mechanism-top5"
          mkdir -p "$root"
          total_bytes=0
          for symbol in BTCUSDT ETHUSDT BNBUSDT XRPUSDT SOLUSDT; do
            mkdir -p "$root/$symbol"
            base="https://data.binance.vision/data/spot/monthly/klines/$symbol/1h"
            for year in 2024 2025; do
              for mm in $(seq -w 1 12); do
                file="$symbol-1h-$year-$mm.zip"
                curl --silent --show-error --fail --location --retry 2 --connect-timeout 10 --max-time 45                   "$base/$file" -o "$root/$symbol/$file"
                curl --silent --show-error --fail --location --retry 2 --connect-timeout 10 --max-time 20                   "$base/$file.CHECKSUM" -o "$root/$symbol/$file.CHECKSUM"
                bytes=$(stat -c%s "$root/$symbol/$file")
                if [ "$bytes" -le 0 ] || [ "$bytes" -gt 8000000 ]; then
                  echo "Unexpected archive size for $file: $bytes" >&2
                  exit 1
                fi
                total_bytes=$((total_bytes + bytes))
              done
            done
          done
          if [ "$total_bytes" -gt 80000000 ]; then
            echo "Top5 mechanism source set exceeded 80 MB: $total_bytes" >&2
            exit 1
          fi
          echo "Bounded Top5 mechanism source set: $total_bytes bytes"

      - name: Certify Top5 and compute descriptive mechanism diagnostics
        run: |
          set -euo pipefail
          SOURCE_ROOT="$RUNNER_TEMP/donchian-mechanism-top5" python - <<'PY'
          import json
          import os
          from pathlib import Path

          from tools.binance_symbol_month import validate_symbol_month
          from tools.donchian_mechanism import analyze_donchian_mechanism
          from src.observatory import aggregate_bars

          root = Path(os.environ["SOURCE_ROOT"])
          symbols = ("BTCUSDT", "ETHUSDT", "BNBUSDT", "XRPUSDT", "SOLUSDT")
          out = {}

          for symbol in symbols:
              yearly = {2024: [], 2025: []}
              for year in (2024, 2025):
                  previous_last = None
                  for month in range(1, 13):
                      name = f"{symbol}-1h-{year}-{month:02d}.zip"
                      report = validate_symbol_month(
                          (root / symbol / name).read_bytes(),
                          (root / symbol / f"{name}.CHECKSUM").read_text(encoding="ascii"),
                          symbol=symbol,
                          year=year,
                          month=month,
                      )
                      bars = report["bars"]
                      if previous_last is not None:
                          assert bars[0][0] == previous_last + 3600
                      previous_last = bars[-1][0]
                      yearly[year].extend(bars)

              out[symbol] = {}
              for year in (2024, 2025):
                  assert len(yearly[year]) == (8784 if year == 2024 else 8760)
                  bars4h = aggregate_bars(yearly[year], "4h", source_timeframe="1h")
                  report = analyze_donchian_mechanism(
                      bars4h,
                      fee=0.001,
                      slippage=0.0005,
                      entry_period=55,
                      exit_period=20,
                      annual_bars=2190,
                  )
                  out[symbol][str(year)] = {
                      "regime": report["regime"],
                      "summary": report["summary"],
                      "open_position_excluded": report["open_position_excluded"],
                      "safety": report["safety"],
                  }
                  assert report["safety"]["orders_real"] == 0
                  assert report["safety"]["filter_optimization"] is False

          print("DONCHIAN_MECHANISM_TOP5")
          print(json.dumps(out, indent=2, ensure_ascii=False, sort_keys=True))
          PY

      - name: Prove diagnostics stayed ephemeral
        run: |
          set -euo pipefail
          test ! -e workspace
          echo "PASS mechanism diagnostics used runner-temp only; workspace untouched"
