name: Atlas Public Crypto Market Watchdog

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/atlas-public-crypto-market-clock.yml"
  workflow_run:
    workflows:
      - "Atlas Market Archive Top 50 Stable"
      - "Atlas Public Crypto Market"
      - "Atlas Public Crypto Extended"
      - "Atlas Public Metals Archive"
      - "Atlas Public Indices Archive"
      - "Atlas Public Energy Archive"
      - "Atlas Public Cross Market Archive"
    types:
      - completed
  schedule:
    # Recovery heartbeat is deliberately offset from the canonical 11/41 beats.
    # A 10-minute local cadence makes a missed producer beat recover quickly,
    # while stale thresholds + active-run checks keep dispatch idempotent.
    - cron: "7,17,27,37,47,57 * * * *"
      timezone: "Europe/Paris"

permissions:
  actions: write
  contents: read

# Durable recovery owner for the public crypto producers.
#
# 40.4.139 used one 5h30 long-running clock which queued exactly one successor.
# If that successor did not materialize, the producer stopped after slot 11.
#
# 40.4.160R1 kept this file as the single recovery owner and added one independent
# wake source: completion of the already-existing Top-50 stable collector.
#
# 40.4.180 strengthened the same owner into an internal Aether pacemaker:
# - native schedule remained;
# - Top-50 completion remained an independent hourly wake source;
# - completion of the canonical/extended Crypto producers cross-checked the sibling;
# - completion of the parallel public market archives added low-frequency fallback
#   wake sources without adding a second recovery engine.
#
# 40.4.182 removes the remaining sleeping-princess gap:
# - the watchdog now wakes every 10 minutes in Europe/Paris;
# - editing this watchdog self-triggers one immediate health check;
# - canonical data stale >=20 min is recovered only when no producer is active;
# - extended data stale >=45 min keeps the same conservative contract.
#
# This is intentionally NOT a long-running runner and NOT a second collector.
# Every wake is idempotent: stale data + no active producer is required before
# a workflow_dispatch recovery is accepted.
#
# 40.4.180 reads freshness from data/agent-crypto-live so high-frequency market
# publication can be isolated from the GitHub Pages source without changing the
# collector or recovery semantics.
#
# Administrator, Atlas runtime, Market Core and data contracts are untouched.
concurrency:
  group: atlas-public-crypto-market-watchdog
  cancel-in-progress: true

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check public crypto freshness and recover only stale producers
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          canonical_workflow="atlas-public-crypto-market.yml"
          extended_workflow="atlas-public-crypto-extended.yml"
          canonical_url="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/data/agent-crypto-live/public/agent_crypto_erith_ia/data/crypto/latest.json"
          extended_url="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/data/agent-crypto-live/public/agent_crypto_erith_ia/data/crypto/extended.json"

          # Canonical runs at 11/41. Twenty minutes means one expected beat was missed.
          canonical_stale_after_seconds=1200
          # Extended runs at 22/52. Forty-five minutes tolerates normal schedule delay
          # without dispatching on every pacemaker wake.
          extended_stale_after_seconds=2700

          now_epoch="$(date -u +%s)"

          snapshot_age_seconds() {
            local url="$1"
            local snapshot_json=""
            local generated_at=""
            local generated_epoch=""

            if snapshot_json="$(curl -fsSL --retry 2 --retry-delay 2 "${url}")"; then
              generated_at="$(printf '%s' "${snapshot_json}" | jq -r '.generated_at // empty')"
            fi

            if [ -n "${generated_at}" ]; then
              generated_epoch="$(date -u -d "${generated_at}" +%s 2>/dev/null || true)"
            fi

            if [ -n "${generated_epoch}" ]; then
              echo "$(( now_epoch - generated_epoch ))"
            fi
          }

          active_runs() {
            local workflow="$1"
            local active=""
            active="$(gh api \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/runs?branch=main&per_page=20" \
              --jq '[.workflow_runs[] | select(.status != "completed")] | length')"
            printf '%s' "${active:-0}"
          }

          recover_if_stale() {
            local label="$1"
            local workflow="$2"
            local url="$3"
            local stale_after="$4"
            local age_seconds=""
            local active=""

            age_seconds="$(snapshot_age_seconds "${url}")"
            active="$(active_runs "${workflow}")"

            echo "${label} snapshot age_seconds=${age_seconds:-N/D}"
            echo "${label} active runs=${active:-0}"

            if [ "${active:-0}" -gt 0 ]; then
              echo "${label}: producer already active; pacemaker does not duplicate it."
              return 0
            fi

            if [ -n "${age_seconds}" ] && [ "${age_seconds}" -ge 0 ] && [ "${age_seconds}" -le "${stale_after}" ]; then
              echo "${label}: snapshot is fresh (<= ${stale_after}s); no recovery dispatch."
              return 0
            fi

            echo "${label}: snapshot stale/unreadable and no producer active; dispatch recovery."
            gh api --method POST \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/dispatches" \
              -f ref=main
            echo "${label}: recovery dispatch accepted."
          }

          recover_if_stale \
            "Top-250 canonical" \
            "${canonical_workflow}" \
            "${canonical_url}" \
            "${canonical_stale_after_seconds}"

          recover_if_stale \
            "Extended 251-1000" \
            "${extended_workflow}" \
            "${extended_url}" \
            "${extended_stale_after_seconds}"
