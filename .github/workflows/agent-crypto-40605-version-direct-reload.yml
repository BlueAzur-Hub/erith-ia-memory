name: Agent-Crypto 40.6.5 Version Truth Metadata Seal

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/agent-crypto-40605-version-direct-reload.yml'

permissions:
  contents: write

concurrency:
  group: agent-crypto-40605-version-truth-metadata-seal
  cancel-in-progress: false

jobs:
  seal:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout canonical main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Seal 40.6.5 publication truth metadata
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib, json

          ROOT = Path('public/agent_crypto_erith_ia/administrator')
          BUILD = '40.6.5'
          ENGINE = '38.15.11'

          def read_json(rel):
              data = json.loads((ROOT / rel).read_text(encoding='utf-8'))
              if not isinstance(data, dict):
                  raise SystemExit(f'STOP 40.6.5 seal: invalid JSON root {rel}')
              return data

          def write_json(rel, data):
              (ROOT / rel).write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          def sha256(rel):
              return hashlib.sha256((ROOT / rel).read_bytes()).hexdigest()

          version = read_json('version.json')
          mirror = read_json('administrator-version.json')
          build = read_json('build.json')

          for name, doc in (('version.json', version), ('administrator-version.json', mirror), ('build.json', build)):
              if str(doc.get('build') or '') != BUILD:
                  raise SystemExit(f'STOP 40.6.5 seal: {name} build={doc.get("build")} expected {BUILD}')

          if str((version.get('engine') or {}).get('reference_build') or '') != ENGINE:
              raise SystemExit('STOP 40.6.5 seal: version.json Market Core drift')
          if str(build.get('engine') or '') != ENGINE:
              raise SystemExit('STOP 40.6.5 seal: build.json Market Core drift')

          def seal_current_truth(doc, name):
              truth = doc.get('current_version_truth')
              if not isinstance(truth, dict):
                  raise SystemExit(f'STOP 40.6.5 seal: missing current_version_truth in {name}')
              truth['visible_owner'] = 'js/version-truth.js'
              truth['loaded_build'] = BUILD
              truth['published_manifest'] = 'build.json'
              truth['false_propagation_lock'] = True
              truth['legacy_ids_hidden_sink'] = True
              truth['manual_click_safe_reload'] = True
              truth['manual_click_network_calls'] = 0
              truth['manual_click_awaits_manifest'] = False

          seal_current_truth(version, 'version.json')
          seal_current_truth(mirror, 'administrator-version.json')
          seal_current_truth(build, 'build.json')

          # Write subordinate truth first so version.json can hash the final bytes.
          write_json('administrator-version.json', mirror)
          write_json('build.json', build)

          files = version.get('files')
          if isinstance(files, dict):
              for rel in ('index.html', 'js/version-truth.js', 'administrator-version.json', 'build.json', 'RELEASE_40_6_5.md'):
                  if (ROOT / rel).is_file():
                      files[rel] = sha256(rel)
              integrity = version.get('integrity')
              if isinstance(integrity, dict) and isinstance(integrity.get('files'), int):
                  integrity['files'] = len(files)

          write_json('version.json', version)

          # Final bounded proof.
          version = read_json('version.json')
          mirror = read_json('administrator-version.json')
          build = read_json('build.json')
          for name, doc in (('version.json', version), ('administrator-version.json', mirror), ('build.json', build)):
              truth = doc.get('current_version_truth') or {}
              if truth.get('loaded_build') != BUILD:
                  raise SystemExit(f'STOP 40.6.5 seal: stale loaded_build in {name}')
              if truth.get('manual_click_network_calls') != 0 or truth.get('manual_click_awaits_manifest') is not False:
                  raise SystemExit(f'STOP 40.6.5 seal: click contract mismatch in {name}')

          files = version.get('files')
          if isinstance(files, dict):
              for rel in ('index.html', 'js/version-truth.js', 'administrator-version.json', 'build.json', 'RELEASE_40_6_5.md'):
                  if rel in files and files[rel] != sha256(rel):
                      raise SystemExit(f'STOP 40.6.5 seal: manifest hash mismatch {rel}')
              integrity = version.get('integrity')
              if isinstance(integrity, dict) and isinstance(integrity.get('files'), int) and integrity['files'] != len(files):
                  raise SystemExit('STOP 40.6.5 seal: manifest file-count mismatch')

          print(json.dumps({
              'ok': True,
              'build': BUILD,
              'engine': ENGINE,
              'current_version_truth_loaded_build': BUILD,
              'manual_click_network_calls': 0,
              'manual_click_awaits_manifest': False,
              'manifest_file_count': len(files) if isinstance(files, dict) else None,
              'integrity_file_count': (version.get('integrity') or {}).get('files') if isinstance(version.get('integrity'), dict) else None,
          }, ensure_ascii=False))
          PY

          python -m json.tool public/agent_crypto_erith_ia/administrator/version.json >/dev/null
          python -m json.tool public/agent_crypto_erith_ia/administrator/administrator-version.json >/dev/null
          python -m json.tool public/agent_crypto_erith_ia/administrator/build.json >/dev/null

      - name: Commit metadata seal
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Seven Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add \
            public/agent_crypto_erith_ia/administrator/version.json \
            public/agent_crypto_erith_ia/administrator/administrator-version.json \
            public/agent_crypto_erith_ia/administrator/build.json
          git diff --cached --quiet && { echo 'No metadata seal changes produced'; exit 1; }
          git commit -m "fix(version): seal 40.6.5 current truth metadata"
          git push origin HEAD:main
