name: Agent-Crypto 40.6.21 Aerith-10 Workspace Bridge
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/agent-crypto-40621-aerith10-workspace-bridge.yml
permissions:
  contents: write
concurrency:
  group: agent-crypto-40621-aerith10-workspace
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout canonical main
        uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - name: Apply bounded workspace bridge
        run: python .github/scripts/agent_crypto_40621_aerith10_workspace_bridge.py
      - name: Anti-destruction gates
        shell: bash
        run: |
          set -euo pipefail
          ROOT=public/agent_crypto_erith_ia/administrator
          python -m json.tool "$ROOT/build.json" >/dev/null
          python -m json.tool "$ROOT/administrator-version.json" >/dev/null
          python -m json.tool "$ROOT/version.json" >/dev/null
          node --check "$ROOT/js/aerith10-workspace-bridge-406021.js"
          git diff --check
          for f in "$ROOT/admin-chronos.css" "$ROOT/js/version-truth.js" "$ROOT/oracle-presentation-405010.css" "$ROOT/oracle-fx-406013.css" "$ROOT/js/oracle-fx-406013.js" "$ROOT/js/app.js" "$ROOT/app.js" "$ROOT/js/core/admin-window-manager.js" "$ROOT/parallel-markets.css" "$ROOT/market-reading-depth.css"; do git diff --exit-code -- "$f"; done
          grep -q 'id="aerith10WorkspaceBridge"' "$ROOT/views/atlas.html"
          grep -q 'id="aerith10WorkspaceBridge"' "$ROOT/js/views/atlas-presentation.js"
          grep -q 'href="#aerith10-creator"' "$ROOT/index.html"
          grep -q 'id="forgeAerithEmbedded"' "$ROOT/views/atlas.html"
          grep -q 'id="aerith10CreatorEmbedded"' "$ROOT/views/atlas.html"
          python - <<'PY'
          import subprocess
          expected={
          'public/agent_crypto_erith_ia/administrator/index.html','public/agent_crypto_erith_ia/administrator/views/atlas.html','public/agent_crypto_erith_ia/administrator/js/views/atlas-presentation.js','public/agent_crypto_erith_ia/administrator/aerith10-creator-406020.css','public/agent_crypto_erith_ia/administrator/js/aerith10-workspace-bridge-406021.js','public/agent_crypto_erith_ia/administrator/build.json','public/agent_crypto_erith_ia/administrator/administrator-version.json','public/agent_crypto_erith_ia/administrator/version.json','public/agent_crypto_erith_ia/administrator/RELEASE_40_6_21.md','coordination/inter_ai_dialogues/agent_crypto/AGENT_CRYPTO_BUILD_40_6_21_AERITH10_WORKSPACE_BRIDGE_CLEAN_UPLOAD_9_FILES.zip','coordination/inter_ai_dialogues/agent_crypto/AGENT_CRYPTO_BUILD_40_6_21_AERITH10_WORKSPACE_BRIDGE_CLEAN_UPLOAD_9_FILES.zip.sha256'}
          s=subprocess.check_output(['git','status','--porcelain=v1','--untracked-files=all'],text=True); changed=set()
          for line in s.splitlines():
            if not line.strip():continue
            p=line[3:]
            if ' -> ' in p:p=p.split(' -> ',1)[1]
            changed.add(p)
          if changed-expected:raise SystemExit(f'STOP 40.6.21 extra {sorted(changed-expected)}')
          if expected-changed:raise SystemExit(f'STOP 40.6.21 missing {sorted(expected-changed)}')
          print('40.6.21 bounded diff OK')
          PY
      - name: Commit released build
        shell: bash
        run: |
          set -euo pipefail
          ROOT=public/agent_crypto_erith_ia/administrator
          git config user.name "Seven Release Bot"; git config user.email "actions@users.noreply.github.com"
          git add "$ROOT/index.html" "$ROOT/views/atlas.html" "$ROOT/js/views/atlas-presentation.js" "$ROOT/aerith10-creator-406020.css" "$ROOT/js/aerith10-workspace-bridge-406021.js" "$ROOT/build.json" "$ROOT/administrator-version.json" "$ROOT/version.json" "$ROOT/RELEASE_40_6_21.md"
          git add coordination/inter_ai_dialogues/agent_crypto/AGENT_CRYPTO_BUILD_40_6_21_AERITH10_WORKSPACE_BRIDGE_CLEAN_UPLOAD_9_FILES.zip*
          git commit -m "feat(agent-crypto): bridge Atlas Aerith-10 Forge 40.6.21"
          git pull --rebase origin main
          git push origin HEAD:main
