name: One-shot verified Administrator 40.6.710 release
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp_administrator_710_delivery.yml'
permissions:
  contents: write
concurrency:
  group: administrator-710-one-shot
  cancel-in-progress: false
jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Apply exact SHA-guarded upgrade 709 to 710
        run: python3 .github/scripts/tmp_administrator_710.py
      - name: Check syntax and six production regression verifiers
        shell: bash
        run: |
          set -euo pipefail
          node --check public/agent_crypto_erith_ia/administrator/app.js
          for t in annual_usd_integrity canonical_top5_integrity currency_integrity history_cache scanner_window_integrity top5_restore; do
            node "public/agent_crypto_erith_ia/tools/verify_administrator_$t.cjs"
          done
      - name: Package ten exact delivery files, integrity SHA and handoff
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          import hashlib
          shared=Path("coordination/inter_ai_dialogues/agent_crypto")
          shared.mkdir(parents=True,exist_ok=True)
          handoff=shared/"AGENT_CRYPTO_ADMINISTRATOR_HANDOFF.md"
          handoff.write_text("""# Administrator 40.6.710 — verified code deployment, Firefox validation pending

          Parent: 40.6.709. Engine: Market Core 38.15.11, unchanged.
          Scope: correct the saved Solo label using certified native EUR/USD currency; retry annual USD CoinGecko on transient failures only, not HTTP 403 or integrity rejection; require an explicit USD change24hUsd for native USD snapshot. EUR acquisition and other comparison modes unchanged.
          Tests: node --check plus six verification scripts, all PASS on the exact code before publication. Git SHA guards compare all six modified source files with the archived and tested 40.6.710 candidate. No fabricated market data.
          Browser status: Top5 USD annual 365d not certified in Firefox; actual five native USD series must still be checked by the user. 24h EUR/USD 5/5 is observed in supplied screenshots. Compact BTC display vs spot discrepancy remains open and intentionally unchanged.
          Release method: commit main after verifiers; ZIP with ten files and companion SHA-256 created in this shared directory. The archive does not install on a local Windows machine. Final Firefox validation belongs to the user.
          """,encoding="utf-8")
          paths=[
            handoff,
            Path("public/agent_crypto_erith_ia/administrator/app.js"),
            Path("public/agent_crypto_erith_ia/administrator/build.json"),
            Path("public/agent_crypto_erith_ia/administrator/index.html"),
            Path("public/agent_crypto_erith_ia/administrator/js/graph-native-usd-406520.js"),
            Path("public/agent_crypto_erith_ia/tools/verify_administrator_annual_usd_integrity.cjs"),
            Path("public/agent_crypto_erith_ia/tools/verify_administrator_canonical_top5_integrity.cjs"),
            Path("public/agent_crypto_erith_ia/tools/verify_administrator_currency_integrity.cjs"),
            Path("public/agent_crypto_erith_ia/tools/verify_administrator_history_cache.cjs"),
            Path("public/agent_crypto_erith_ia/tools/verify_administrator_scanner_window_integrity.cjs"),
            Path("public/agent_crypto_erith_ia/tools/verify_administrator_top5_restore.cjs")]
          name="AGENT_CRYPTO_ADMINISTRATOR_40.6.710_NATIVE_USD_INTEGRITY_11_FILES.zip"
          output=shared/name
          with ZipFile(output,"w",ZIP_DEFLATED,compresslevel=9) as z:
            for p in paths: z.write(p,arcname=str(p))
          with ZipFile(output) as z:
            assert len(z.namelist())==11
            assert z.testzip() is None
          h=hashlib.sha256(output.read_bytes()).hexdigest()
          (shared/(name+".sha256")).write_text(h+"  "+name+"\n",encoding="utf-8")
          print("ZIP stored", output, "SHA256",h)
          PY
      - name: Publish only validated code, archive, hash and passation on main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/agent_crypto_erith_ia/administrator/app.js public/agent_crypto_erith_ia/administrator/index.html public/agent_crypto_erith_ia/administrator/build.json public/agent_crypto_erith_ia/administrator/js/graph-native-usd-406520.js
          git add public/agent_crypto_erith_ia/tools/verify_administrator_annual_usd_integrity.cjs public/agent_crypto_erith_ia/tools/verify_administrator_canonical_top5_integrity.cjs public/agent_crypto_erith_ia/tools/verify_administrator_top5_restore.cjs
          git add coordination/inter_ai_dialogues/agent_crypto/AGENT_CRYPTO_ADMINISTRATOR_HANDOFF.md
          git add coordination/inter_ai_dialogues/agent_crypto/AGENT_CRYPTO_ADMINISTRATOR_40.6.710_NATIVE_USD_INTEGRITY_11_FILES.zip*
          git rm .github/scripts/tmp_administrator_710.py .github/workflows/tmp_administrator_710_delivery.yml
          git commit -m "Release Administrator 40.6.710 USD integrity and preserved chart currency"
          git push origin HEAD:main

