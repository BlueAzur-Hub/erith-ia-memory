name: Seven Public Spot Listings Watch
on:
  workflow_dispatch:
  # Bootstrap the collector when its own workflow or scanner changes on main.
  # The generated JSON is deliberately excluded: publishing a snapshot
  # must never trigger an infinite collection loop.
  push:
    branches: [main]
    paths:
      - ".github/workflows/seven-public-listings-watch.yml"
      - "public/agent_crypto_erith_ia/tools/seven_public_listings_watch.cjs"
  pull_request:
    paths:
      - "public/agent_crypto_erith_ia/tools/seven_public_listings_watch.cjs"
      - "public/agent_crypto_erith_ia/tools/test_seven_public_listings_watch.cjs"
      - ".github/workflows/seven-public-listings-watch.yml"
  schedule:
    - cron: "17 * * * *"
permissions:
  contents: write
concurrency:
  group: seven-public-spot-listings-watch
  cancel-in-progress: false
jobs:
  offline_validation:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate public Spot scanner offline (no exchange requests)
        run: |
          node --check public/agent_crypto_erith_ia/tools/seven_public_listings_watch.cjs
          node public/agent_crypto_erith_ia/tools/test_seven_public_listings_watch.cjs
  catalog:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check safety and scan public Spot instruments and dated OKX quotes
        shell: bash
        run: |
          set -euo pipefail
          node public/agent_crypto_erith_ia/tools/test_seven_public_listings_watch.cjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            node public/agent_crypto_erith_ia/tools/seven_public_listings_watch.cjs
            git add -- public/agent_crypto_erith_ia/administrator/data/new-listings-public-feed.json
            if git diff --cached --quiet; then
              echo "No change to public Spot feed"
              exit 0
            fi
            git commit -m "Archive read-only OKX and Bitget SPOT listing catalog (no orders)"
            if git push origin HEAD:main; then
              echo "Public listing watch published"
              exit 0
            fi
            sleep "$((attempt * 3))"
          done
          echo "Public watch scan could not publish" >&2
          exit 1
