name: Agent-Crypto 40.6.86 Version Authority Consolidation

on:
  push:
    branches: [main]
    paths:
      - '.github/triggers/agent-crypto-406086-version-authority.trigger'

permissions:
  contents: write

concurrency:
  group: agent-crypto-406086-version-authority
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Synchronize main
        run: |
          set -euo pipefail
          git pull --ff-only origin main

      - name: Apply 40.6.86 version authority surgery
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/scripts/agent_crypto_release_406086.py')
          s=p.read_text(encoding='utf-8')
          lines=s.splitlines()
          lines=[line for line in lines if not ('replace_one(root_app' in line and ("'ATLAS_RELEASE')" in line or "'ATLAS_ASSET_TOKEN')" in line))]
          s='\n'.join(lines)+'\n'
          old="if 'version.json' in files:\n    raise SystemExit('STOP: version.json cannot hash itself')\nfiles[f'index-{BUILD}.html'] = sha(immutable_path)"
          new="files.pop('version.json', None)\nfiles[f'index-{BUILD}.html'] = sha(immutable_path)"
          if old not in s:
              raise SystemExit('STOP: self-hash surgery anchor missing')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
          python .github/scripts/agent_crypto_release_406086.py

      - name: Syntax and canonical version gates
        run: |
          set -euo pipefail
          ROOT='public/agent_crypto_erith_ia/administrator'
          node --check "$ROOT/app.js"
          node --check "$ROOT/js/app.js"
          node --check "$ROOT/js/version-truth.js"
          node --check "$ROOT/js/views/system-presentation.js"
          python .github/scripts/agent_crypto_version_truth_guard_compat.py \
            --base "$ROOT" \
            --expected-build 40.6.86 \
            --expected-release 'VERSION AUTHORITY CONSOLIDATION · IMMUTABLE ENTRY LOCK'
          python - <<'PY'
          from pathlib import Path
          import json, re
          root=Path('public/agent_crypto_erith_ia/administrator')
          build=json.loads((root/'version.json').read_text(encoding='utf-8'))['build']
          p=root/f'index-{build}.html'
          if not p.is_file(): raise SystemExit('immutable entry missing')
          html=p.read_text(encoding='utf-8')
          if re.findall(r'<meta\s+name="administrator-build"\s+content="([^"]+)"',html)!=[build]: raise SystemExit('immutable meta drift')
          if re.findall(r'<span\s+id="atlasVersionTruthText">Build ([^<]+)</span>',html)!=[build]: raise SystemExit('immutable badge drift')
          print('IMMUTABLE_ENTRY_PASS', p.name)
          PY

      - name: Commit 40.6.86 release
        run: |
          set -euo pipefail
          git config user.name 'Seven Heaven Release Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/agent_crypto_erith_ia/administrator
          git commit -m 'fix(agent-crypto): 40.6.86 consolidate version authority and immutable delivery'
          git push origin HEAD:main

      - name: Build clean upload package
        run: |
          set -euo pipefail
          mkdir -p /tmp/agent-crypto-406086
          zip -qr /tmp/agent-crypto-406086/AGENT_CRYPTO_BUILD_40_6_86_VERSION_AUTHORITY_IMMUTABLE_ENTRY_LOCK_CLEAN_UPLOAD.zip \
            public/agent_crypto_erith_ia/administrator
          sha256sum /tmp/agent-crypto-406086/AGENT_CRYPTO_BUILD_40_6_86_VERSION_AUTHORITY_IMMUTABLE_ENTRY_LOCK_CLEAN_UPLOAD.zip \
            > /tmp/agent-crypto-406086/AGENT_CRYPTO_BUILD_40_6_86_VERSION_AUTHORITY_IMMUTABLE_ENTRY_LOCK_CLEAN_UPLOAD.zip.sha256

      - name: Retire one-shot release tooling
        run: |
          set -euo pipefail
          git pull --rebase origin main
          git rm -f .github/workflows/agent-crypto-406086-version-authority-consolidation.yml
          git rm -f .github/triggers/agent-crypto-406086-version-authority.trigger
          git rm -f .github/scripts/agent_crypto_release_406086.py
          git commit -m 'chore(agent-crypto): retire 40.6.86 one-shot release tooling'
          git push origin HEAD:main

      - name: Upload 40.6.86 package
        uses: actions/upload-artifact@v4
        with:
          name: AGENT_CRYPTO_BUILD_40_6_86_VERSION_AUTHORITY_IMMUTABLE_ENTRY_LOCK_CLEAN_UPLOAD
          path: /tmp/agent-crypto-406086/*
          if-no-files-found: error
          retention-days: 30
