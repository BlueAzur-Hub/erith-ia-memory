name: Seven dynamic EUR archive one-shot pilot
on:
  pull_request:
    paths:
      - ".github/workflows/seven-scanner-dynamic-eur-archive-pilot.yml"
permissions:
  contents: read
jobs:
  pilot:
    if: ${{ github.event.pull_request.number == 703 && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run strictly bounded exact-ID native EUR archive pilot
        env:
          ERITH_EUR_ARCHIVE_NETWORK: "1"
        run: |
          node public/agent_crypto_erith_ia/tools/run_scanner_market_eur_archive.cjs \
            --mode=collect --network=yes --universe=100 --budget=5 --offset=0
      - name: Upload raw per-coin native EUR evidence without merging it
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seven-dynamic-eur-archive-pilot
          path: public/agent_crypto_erith_ia/data/crypto/scanner_eur_archives/
          if-no-files-found: warn
          retention-days: 7
