name: Agent-Crypto 40.6.33 Aether Exact Stage

on:
  push:
    paths:
      - '.github/workflows/agent-crypto-40633-aether-exact-stage.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout canonical main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Validate and build 40.6.33
        shell: bash
        run: |
          set -euo pipefail
          cp .github/scripts/agent_crypto_40633_release.py /tmp/agent_crypto_40633_release.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/agent_crypto_40633_release.py')
          s=p.read_text(encoding='utf-8')
          old='MARKER = "/* 40.6.33 — AETHER EXACT ARTWORK STAGE · RESPONSIVE ALIGNMENT LOCK */"'
          new='MARKER = "/* 40.6.33 — AETHER EXACT ARTWORK STAGE · RESPONSIVE ALIGNMENT LOCK"'
          if s.count(old) != 1:
              raise SystemExit('release marker assignment not uniquely found')
          p.write_text(s.replace(old,new),encoding='utf-8')
          PY
          python3 -m py_compile /tmp/agent_crypto_40633_release.py
          python3 /tmp/agent_crypto_40633_release.py

      - name: Final anti-destruction gates
        shell: bash
        run: |
          set -euo pipefail
          ROOT=public/agent_crypto_erith_ia/administrator
          ASSET="$ROOT/assets/aether/aether-observatory-background-406032.webp"
          ZIP=coordination/inter_ai_dialogues/agent_crypto/AGENT_CRYPTO_BUILD_40_6_33_AETHER_EXACT_STAGE_RESPONSIVE_ALIGNMENT_CLEAN_UPLOAD_7_FILES.zip
          SHA="$ZIP.sha256"

          node --check "$ROOT/js/aether.js"
          python3 -m json.tool "$ROOT/build.json" >/dev/null
          python3 -m json.tool "$ROOT/administrator-version.json" >/dev/null
          python3 -m json.tool "$ROOT/version.json" >/dev/null
          grep -q '<meta name="administrator-build" content="40.6.33"' "$ROOT/index.html"
          grep -q 'admin-ribbons.css?v=administrator-build-40.6.33' "$ROOT/index.html"
          grep -q '40.6.33 — AETHER EXACT ARTWORK STAGE' "$ROOT/admin-ribbons.css"
          grep -q '"engine": "38.15.11"' "$ROOT/build.json"
          grep -q "Version : Parker Lewis Can't Lose" "$ROOT/js/footer-version-truth-406026.js"
          printf '5c4d61e9410d4a701372e2d30640d6523938dfe603f65902d493b354c5f2e7b2  %s\n' "$ASSET" | sha256sum -c -
          test -f "$ZIP"
          test -f "$SHA"
          (cd "$(dirname "$ZIP")" && sha256sum -c "$(basename "$SHA")")
          git diff --check

          python3 - <<'PY'
          from zipfile import ZipFile
          p='coordination/inter_ai_dialogues/agent_crypto/AGENT_CRYPTO_BUILD_40_6_33_AETHER_EXACT_STAGE_RESPONSIVE_ALIGNMENT_CLEAN_UPLOAD_7_FILES.zip'
          with ZipFile(p) as z:
              files=[n for n in z.namelist() if not n.endswith('/')]
              assert len(files)==7, files
              assert z.testzip() is None
              assert 'administrator/assets/aether/aether-observatory-background-406032.webp' in files
              assert 'administrator/admin-ribbons.css' in files
              assert 'administrator/RELEASE_40_6_33.md' in files
          print('40.6.33 ZIP 7 files PASS')
          PY

      - name: Commit and publish 40.6.33
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Seven Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/agent_crypto_erith_ia/administrator/admin-ribbons.css \
                  public/agent_crypto_erith_ia/administrator/index.html \
                  public/agent_crypto_erith_ia/administrator/build.json \
                  public/agent_crypto_erith_ia/administrator/administrator-version.json \
                  public/agent_crypto_erith_ia/administrator/version.json \
                  public/agent_crypto_erith_ia/administrator/RELEASE_40_6_33.md \
                  coordination/inter_ai_dialogues/agent_crypto/AGENT_CRYPTO_BUILD_40_6_33_AETHER_EXACT_STAGE_RESPONSIVE_ALIGNMENT_CLEAN_UPLOAD_7_FILES.zip \
                  coordination/inter_ai_dialogues/agent_crypto/AGENT_CRYPTO_BUILD_40_6_33_AETHER_EXACT_STAGE_RESPONSIVE_ALIGNMENT_CLEAN_UPLOAD_7_FILES.zip.sha256
          git commit -m "fix(agent-crypto): align Aether exact artwork stage 40.6.33"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Upload clean ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: AGENT_CRYPTO_BUILD_40_6_33_AETHER_EXACT_STAGE_RESPONSIVE_ALIGNMENT_CLEAN_UPLOAD_7_FILES
          path: coordination/inter_ai_dialogues/agent_crypto/AGENT_CRYPTO_BUILD_40_6_33_AETHER_EXACT_STAGE_RESPONSIVE_ALIGNMENT_CLEAN_UPLOAD_7_FILES.zip
          if-no-files-found: error
          compression-level: 0
