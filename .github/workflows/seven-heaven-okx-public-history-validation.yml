name: Seven Heaven - verify independent OKX BTC/USDC history

on:
  pull_request:
    paths:
      - '.github/workflows/seven-heaven-okx-public-history-validation.yml'
      - 'coordination/inter_ai_dialogues/agent_crypto/research/strategy_profiles/SEVEN_HEAVEN_OKX_BTC_USDC_HISTORY_READONLY_COVERAGE_CHECK.mjs'
      - 'coordination/inter_ai_dialogues/agent_crypto/research/strategy_profiles/SEVEN_HEAVEN_OKX_BINANCE_MATCHED_WINDOW_SWING_VERIFICATION.mjs'
      - 'coordination/inter_ai_dialogues/agent_crypto/research/strategy_profiles/SEVEN_HEAVEN_OKX_BINANCE_MATCHED_SWING_VERIFIED_EVIDENCE_2026_11_10.json'
      - 'coordination/inter_ai_dialogues/agent_crypto/research/strategy_profiles/SEVEN_HEAVEN_OKX_BINANCE_CROSSVENUE_BTC_SWING_VERIFICATION_REPORT_2026_11_10.md'

permissions:
  contents: read

jobs:
  public-read-only-okx-data-check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read OKX public historical daily Spot BTC/USDC (no credentials)
        run: |
          script=coordination/inter_ai_dialogues/agent_crypto/research/strategy_profiles/SEVEN_HEAVEN_OKX_BTC_USDC_HISTORY_READONLY_COVERAGE_CHECK.mjs
          node --check "$script"
          node "$script"
      - name: Compare the same Swing rules over the shared 2026 dates
        run: |
          set -euo pipefail
          script=coordination/inter_ai_dialogues/agent_crypto/research/strategy_profiles/SEVEN_HEAVEN_OKX_BINANCE_MATCHED_WINDOW_SWING_VERIFICATION.mjs
          node --check "$script"
          node "$script"
      - name: Validate paired historical research outputs
        run: |
          node - <<'NODE'
          const fs=require('node:fs'),assert=require('node:assert/strict');
          const d=JSON.parse(fs.readFileSync('/tmp/seven_okx_binance_matched_research.json','utf8'));
          assert.equal(d.researchOnly,true);assert.equal(d.ordersEnabled,false);assert.equal(d.realOrders,0);
          assert.equal(d.comparison.from,'2026-04-01');
          assert.equal(d.comparison.to,'2026-09-30');
          assert.equal(d.comparison.identicalDailyBarWindow,true);
          assert(d.comparison.warmupDays>=210);
          assert.equal(d.annual.length,12);
          for(const m of ['PULLBACK','BREAKOUT','REBOUND'])for(const cap of [25,100]){
            const arr=d.annual.filter(r=>r.method===m&&r.capitalCapPct===cap);
            assert.equal(arr.length,2,'Each method must be verified on both venues');
            assert(arr.every(x=>Number.isFinite(x.returnPct)&&Number.isFinite(x.maxDrawdownPct)));
            assert(arr.every(x=>x.wins<=x.trades&&x.tradeLog.length===x.trades));
          }
          const frozen=JSON.parse(fs.readFileSync('coordination/inter_ai_dialogues/agent_crypto/research/strategy_profiles/SEVEN_HEAVEN_OKX_BINANCE_MATCHED_SWING_VERIFIED_EVIDENCE_2026_11_10.json','utf8'));
          assert.equal(frozen.orders_enabled,false);
          assert.equal(frozen.research_only,true);
          assert.equal(frozen.study.results.length,d.annual.length);
          assert.equal(frozen.okx_history.record_digest,JSON.parse(fs.readFileSync('/tmp/seven_okx_history_coverage.json','utf8')).sha256);
          for(const z of frozen.study.results){
            const match=d.annual.find(v=>v.venue===z.venue&&v.method===z.method&&v.capitalCapPct===z.capitalCapPct);
            assert(match,'Frozen evidence missing method');
            assert(Math.abs(match.returnPct-z.returnPct)<1e-9,'Published result does not match independently recalculated result');
            assert.equal(match.trades,z.trades);
          }
          console.log('MATCHED_TWO_VENUES_VALIDATED');
          NODE
      - name: Preserve coverage evidence for reproducibility
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seven-heaven-okx-spot-btc-usdc-daily-coverage-evidence
          path: |
            /tmp/seven_okx_history_coverage.json
            /tmp/seven_okx_binance_matched_research.json
          if-no-files-found: warn
          retention-days: 30
