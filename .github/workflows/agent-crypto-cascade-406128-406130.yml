name: Agent-Crypto cascade 40.6.128-40.6.130

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/agent-crypto-cascade-406128-406130.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: agent-crypto-cascade-406128-406130
  cancel-in-progress: false

jobs:
  cascade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Build and publish 40.6.128 - DEX frozen API facade
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json, datetime

          root = Path('public/agent_crypto_erith_ia/administrator')
          p = root/'js/dex-freshness-guard.js'
          s = p.read_text(encoding='utf-8')
          assert 'const RELEASE = "40.6.127";' in s
          assert 'const proxy = new Proxy(api,' in s
          s = s.replace('const RELEASE = "40.6.127";', 'const RELEASE = "40.6.128";', 1)
          s = s.replace('let originalApi = null;', 'let originalApi = null;\n  let sourceFacade = null;\n  const FUTURE_TOLERANCE_SECONDS = 30;', 1)

          old_state = '''        const timestamp = providerTimestamp(provider);\n        const age = timestamp === null ? null : Math.max(0, (now - timestamp) / 1000);\n        const isStale = age === null || age > limit;\n        return {\n          name,\n          ok: true,\n          stale: isStale,\n          age_seconds: age,\n          reason: age === null ? "FRESHNESS_UNKNOWN" : isStale ? "STALE" : "FRESH"\n        };'''
          new_state = '''        const timestamp = providerTimestamp(provider);\n        const rawAge = timestamp === null ? null : (now - timestamp) / 1000;\n        const future = rawAge !== null && rawAge < -FUTURE_TOLERANCE_SECONDS;\n        const age = rawAge === null ? null : Math.max(0, rawAge);\n        const isStale = age === null || future || age > limit;\n        return {\n          name,\n          ok: true,\n          stale: isStale,\n          age_seconds: age,\n          reason: age === null ? "FRESHNESS_UNKNOWN" : future ? "FUTURE_TIMESTAMP" : isStale ? "STALE" : "FRESH"\n        };'''
          assert old_state in s
          s = s.replace(old_state, new_state, 1)

          start = s.index('  function bindSourceApi() {')
          end = s.index('  function aetherInvariant() {', start)
          facade = '''  function buildSourceFacade(api, originalContext, originalIntelligence) {\n    const facade = {};\n    for (const key of Reflect.ownKeys(api)) {\n      if (key === "contextSnapshot" || key === "sourceIntelligence") continue;\n      try { facade[key] = api[key]; } catch (_) {}\n    }\n    facade.contextSnapshot = () => sanitizeContext(originalContext());\n    if (originalIntelligence) {\n      facade.sourceIntelligence = () => sanitizeIntelligence(originalIntelligence(), originalContext());\n    }\n    facade.dex_freshness_facade = true;\n    facade.dex_freshness_facade_owner = "AgentCryptoDexFreshnessGuard";\n    return Object.freeze(facade);\n  }\n\n  function bindSourceApi() {\n    const api = globalThis.ErithPrivateBackendSources;\n    if (sourceFacade && api === sourceFacade) { wrapped = true; return true; }\n    if (!api || typeof api.contextSnapshot !== "function") return false;\n    originalApi = api;\n    const originalContext = api.contextSnapshot.bind(api);\n    const originalIntelligence = typeof api.sourceIntelligence === "function"\n      ? api.sourceIntelligence.bind(api)\n      : null;\n    try {\n      sourceFacade = buildSourceFacade(api, originalContext, originalIntelligence);\n      globalThis.ErithPrivateBackendSources = sourceFacade;\n      wrapped = true;\n      document.documentElement.dataset.dexFreshnessGuard = "active";\n      document.documentElement.dataset.dexFreshnessFacade = "frozen-compatible";\n      return true;\n    } catch (_) {\n      sourceFacade = null;\n      wrapped = false;\n      return false;\n    }\n  }\n\n'''
          s = s[:start] + facade + s[end:]

          sol = '        { asset: "SOL", dexscreener: { status: "ok" }, geckoterminal: { status: "ok", updated_at: fresh }, identity: { atlas_eligible: true } }'
          xrp = sol + ',\n        { asset: "XRP", dexscreener: { status: "ok", observed_at_utc: new Date(now + 120_000).toISOString() }, geckoterminal: { status: "ok", observed_at_utc: fresh }, identity: { atlas_eligible: true } }'
          assert sol in s
          s = s.replace(sol, xrp, 1)
          old_checks = '''      by.BTC.identity.atlas_eligible === true,\n      by.ETH.identity.atlas_eligible === false,\n      by.SOL.identity.atlas_eligible === false,\n      out.dex_freshness.stale_assets === 2'''
          new_checks = '''      by.BTC.identity.atlas_eligible === true,\n      by.ETH.identity.atlas_eligible === false,\n      by.SOL.identity.atlas_eligible === false,\n      by.XRP.identity.atlas_eligible === false,\n      by.XRP.dex_freshness.some(provider => provider.reason === "FUTURE_TIMESTAMP"),\n      out.dex_freshness.stale_assets === 3'''
          assert old_checks in s
          s = s.replace(old_checks, new_checks, 1)
          s = s.replace('    bindSourceApi,\n    aetherInvariant,', '    bindSourceApi,\n    buildSourceFacade,\n    aetherInvariant,', 1)
          s = s.replace('    max_age_fallback_seconds: FALLBACK_MAX_AGE_SECONDS,', '    max_age_fallback_seconds: FALLBACK_MAX_AGE_SECONDS,\n    future_tolerance_seconds: FUTURE_TOLERANCE_SECONDS,\n    proxy_used: false,\n    frozen_source_api_compatible: true,', 1)
          p.write_text(s, encoding='utf-8')

          def release_entry(build, parent):
            src = root/f'releases/{parent}/index.html'
            dst = root/f'releases/{build}/index.html'
            dst.parent.mkdir(parents=True, exist_ok=True)
            text = src.read_text(encoding='utf-8').replace(parent, build)
            dst.write_text(text, encoding='utf-8')

          def update_manifest(build, parent, release, status, key, detail):
            bp = root/'build.json'
            d = json.loads(bp.read_text(encoding='utf-8'))
            assert d['build'] == parent, (d['build'], parent)
            d.update({
              'build': build, 'engine': '38.15.11', 'release': release, 'published': True,
              'status': status, 'parent_build': parent,
              'asset_token': f'market-core-v2.0-alpha-build-{build}',
              'administrator_build': build, 'build_label': f'Build {build} · Administrator',
              'release_status': status, 'market_core': '38.15.11',
              'market_core_modified': False, 'web_classic_modified': False,
              'aether_modified': False, 'atlas_current_modified': False,
              'oracle_modified': False, 'lecture_technique_modified': False,
              'strategy_a_modified': False, 'automatic_order': False, 'real_order': False,
              'new_recurring_timer': False, 'new_observer': False, 'new_storage_owner': False,
              'entry': f'./releases/{build}/',
              'released_at': datetime.datetime.now(datetime.timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z')
            })
            d[key] = detail
            lineage = d.setdefault('recent_validated_lineage', [])
            label = f'{build} DEX FROZEN API FACADE'
            if label not in lineage: lineage.append(label)
            hist = d.setdefault('history', {})
            hist['authority'] = 'git'
            hist['previous_full_manifest_build'] = parent
            bp.write_text(json.dumps(d, ensure_ascii=False, separators=(',',':')), encoding='utf-8')

          release_entry('40.6.128', '40.6.127')
          update_manifest('40.6.128','40.6.127','DEX FROZEN API FACADE','dex_frozen_api_facade_406128','dex_frozen_api_facade',{
            'introduced_in':'40.6.128','scope':'replace the invalid Proxy around frozen ErithPrivateBackendSources with an ordinary frozen facade while preserving DEX fail-closed freshness truth',
            'runtime_patch':'js/dex-freshness-guard.js','proxy_used':False,'frozen_source_api_compatible':True,
            'observed_at_utc_supported':True,'future_timestamp_fail_closed':True,'future_tolerance_seconds':30,
            'threshold_seconds_unchanged':600,'force_atlas_eligible_count':False,'canonical_price_changed':False,
            'market_core_changed':False,'graph_changed':False,'lecture_technique_changed':False,'aether_changed':False,
            'oracle_changed':False,'atlas_current_algorithm_changed':False,'strategy_a_changed':False,'tradus_changed':False,
            'fetch':False,'recurring_timer':False,'observer':False,'storage_write':False,'trading_changed':False,'wallet_changed':False,
            'firefox_terrain_proof':'pending: frozen backend API must be callable through facade without TypeError and Sources/Diagnostics/Decision Context must agree'
          })
          PY
          node --check public/agent_crypto_erith_ia/administrator/js/dex-freshness-guard.js
          node <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const src=fs.readFileSync('public/agent_crypto_erith_ia/administrator/js/dex-freshness-guard.js','utf8');
          const doc={documentElement:{dataset:{}},addEventListener(){}};
          const win={addEventListener(){}};
          const now=Date.now(), fresh=new Date(now-60000).toISOString();
          const raw=Object.freeze({
            contextSnapshot(){return {assets:[{asset:'BTC',identity:{atlas_eligible:true},dexscreener:{status:'ok',observed_at_utc:fresh},geckoterminal:{status:'ok',observed_at_utc:fresh}}]};},
            sourceIntelligence(){return {state:'ready',dex:{atlas_eligible:1}};}
          });
          const c={globalThis:null,document:doc,window:win,Date,structuredClone,console,ErithPrivateBackendSources:raw}; c.globalThis=c;
          vm.createContext(c); vm.runInContext(src,c);
          if(c.ErithPrivateBackendSources.contextSnapshot().assets[0].identity.atlas_eligible!==true) throw new Error('facade context failed');
          if(c.ErithPrivateBackendSources.sourceIntelligence().dex.atlas_eligible!==1) throw new Error('facade intelligence failed');
          const st=c.AgentCryptoDexFreshnessGuard.selfTest(); if(!st.pass) throw new Error('DEX selftest failed '+JSON.stringify(st));
          console.log('40.6.128 DEX FACADE PASS', st);
          NODE
          git add public/agent_crypto_erith_ia/administrator
          git commit -m "release(agent-crypto): publish 40.6.128 DEX frozen API facade"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Build and publish 40.6.129 - Auto A manual stop owner
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin main
          python - <<'PY'
          from pathlib import Path
          import json, datetime
          root=Path('public/agent_crypto_erith_ia/administrator')
          app=root/'app.js'
          s=app.read_text(encoding='utf-8')
          STOP='agent_crypto_strategy_a_auto_manual_stop_v1'
          REASON='agent_crypto_strategy_a_auto_manual_stop_reason_v1'

          def inject(name, marker, code):
            global s
            if marker in s: return
            token=f'function {name}('
            i=s.find(token)
            assert i>=0, f'{name} not found'
            brace=s.find('{', i)
            assert brace>=0
            s=s[:brace+1]+'\n'+code+s[brace+1:]

          inject('strategyAAutoStop','40.6.129 MANUAL STOP OWNER', '''  // 40.6.129 MANUAL STOP OWNER — operator STOP persists across pageshow/rehydration.\n  try {\n    sessionStorage.setItem("agent_crypto_strategy_a_auto_manual_stop_v1", "1");\n    sessionStorage.setItem("agent_crypto_strategy_a_auto_manual_stop_reason_v1", JSON.stringify({ reason: "operator-stop", at: new Date().toISOString() }));\n  } catch (_) {}\n''')
          inject('strategyAAutoStart','40.6.129 EXPLICIT START CLEARS MANUAL STOP', '''  // 40.6.129 EXPLICIT START CLEARS MANUAL STOP — only an actual owner start can lift operator STOP.\n  try {\n    sessionStorage.removeItem("agent_crypto_strategy_a_auto_manual_stop_v1");\n    sessionStorage.removeItem("agent_crypto_strategy_a_auto_manual_stop_reason_v1");\n  } catch (_) {}\n''')
          app.write_text(s, encoding='utf-8')

          auto=root/'js/strategy-a-auto-start.js'
          a=auto.read_text(encoding='utf-8')
          assert 'const OWNER = "strategy-a-auto-start";' in a
          if 'const STOP_REASON_KEY' not in a:
            a=a.replace('const STOP_KEY = "agent_crypto_strategy_a_auto_manual_stop_v1";', 'const STOP_KEY = "agent_crypto_strategy_a_auto_manual_stop_v1";\n  const STOP_REASON_KEY = "agent_crypto_strategy_a_auto_manual_stop_reason_v1";',1)
          a=a.replace('      manual_stop: manualStop(),', '      manual_stop: manualStop(),\n      manual_stop_reason: (() => { try { return sessionStorage.getItem(STOP_REASON_KEY); } catch (_) { return null; } })(),',1)
          a=a.replace('      existing_runner_reused: true,', '      existing_runner_reused: true,\n      operator_stop_owner_persists: true,\n      explicit_owner_start_clears_stop: true,',1)
          auto.write_text(a,encoding='utf-8')

          src=root/'releases/40.6.128/index.html'; dst=root/'releases/40.6.129/index.html'; dst.parent.mkdir(parents=True,exist_ok=True)
          dst.write_text(src.read_text(encoding='utf-8').replace('40.6.128','40.6.129'),encoding='utf-8')
          bp=root/'build.json'; d=json.loads(bp.read_text(encoding='utf-8')); assert d['build']=='40.6.128'
          d.update({'build':'40.6.129','engine':'38.15.11','release':'AUTO A MANUAL STOP OWNER','published':True,
            'status':'auto_a_manual_stop_owner_406129','parent_build':'40.6.128','asset_token':'market-core-v2.0-alpha-build-40.6.129',
            'administrator_build':'40.6.129','build_label':'Build 40.6.129 · Administrator','release_status':'auto_a_manual_stop_owner_406129',
            'market_core':'38.15.11','market_core_modified':False,'web_classic_modified':False,'aether_modified':False,
            'atlas_current_modified':False,'oracle_modified':False,'lecture_technique_modified':False,'strategy_a_modified':False,
            'strategy_a_control_modified':True,'automatic_order':False,'real_order':False,'new_recurring_timer':False,
            'new_observer':False,'new_storage_owner':False,'entry':'./releases/40.6.129/',
            'released_at':datetime.datetime.now(datetime.timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z')})
          d['strategy_a_manual_stop_owner']={
            'introduced_in':'40.6.129','scope':'persist explicit operator STOP in the canonical Strategy A PAPER runner owner and respect it across pageshow/rehydration/autostart',
            'owner':'app.js strategyAAutoStop/strategyAAutoStart','autostart_reader':'js/strategy-a-auto-start.js',
            'manual_stop_session_key':STOP,'manual_stop_reason_key':REASON,'operator_stop_persists':True,'autostart_cannot_clear_manual_stop':True,
            'explicit_owner_start_clears_manual_stop':True,'paper_only':True,'strategy_engine_changed':False,'market_core_changed':False,
            'graph_changed':False,'lecture_technique_changed':False,'aether_changed':False,'oracle_changed':False,'atlas_current_changed':False,
            'real_order':False,'wallet':False,'credentials':False,'firefox_terrain_proof':'pending: STOP then pageshow/F5/rehydration must remain OFF; explicit START must resume under existing guards'}
          label='40.6.129 AUTO A MANUAL STOP OWNER'; lineage=d.setdefault('recent_validated_lineage',[])
          if label not in lineage: lineage.append(label)
          d.setdefault('history',{})['previous_full_manifest_build']='40.6.128'
          bp.write_text(json.dumps(d,ensure_ascii=False,separators=(',',':')),encoding='utf-8')
          PY
          node --check public/agent_crypto_erith_ia/administrator/app.js
          node --check public/agent_crypto_erith_ia/administrator/js/strategy-a-auto-start.js
          python - <<'PY'
          from pathlib import Path
          s=Path('public/agent_crypto_erith_ia/administrator/app.js').read_text(encoding='utf-8')
          assert '40.6.129 MANUAL STOP OWNER' in s
          assert '40.6.129 EXPLICIT START CLEARS MANUAL STOP' in s
          assert s.index('40.6.129 MANUAL STOP OWNER') > s.index('function strategyAAutoStop(')
          assert s.index('40.6.129 EXPLICIT START CLEARS MANUAL STOP') > s.index('function strategyAAutoStart(')
          print('40.6.129 OWNER STOP WIRING PASS')
          PY
          git add public/agent_crypto_erith_ia/administrator
          git commit -m "release(agent-crypto): publish 40.6.129 Auto A manual stop owner"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Build and publish 40.6.130 - TRADUS capture time lock
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin main
          python - <<'PY'
          from pathlib import Path
          import json, datetime
          root=Path('public/agent_crypto_erith_ia/administrator')

          rec=root/'js/tradus-strategy-a-reconcile.js'
          s=rec.read_text(encoding='utf-8')
          assert 'const RELEASE = "40.6.122";' in s
          s=s.replace('const RELEASE = "40.6.122";', 'const RELEASE = "40.6.130";',1)
          old='''  function compareFailClosed(a, signal) {\n    const state = stateOf(a);\n    const action = upper(signal?.action || "NO_TRADE") || "NO_TRADE";\n    const directional = action === "BUY" || action === "SELL";'''
          new='''  function compareFailClosed(a, signal) {\n    const state = stateOf(a);\n    const rawAction = upper(signal?.action || "");\n    if (!signal || unknownToken(rawAction)) {\n      return Object.freeze({ state:"NON COMPARABLE", text:"TRADUS inconnu · comparaison suspendue", fail_closed:true, reason:"TRADUS_SIGNAL_UNKNOWN" });\n    }\n    const action = rawAction;\n    const directional = action === "BUY" || action === "SELL";'''
          assert old in s
          s=s.replace(old,new,1)
          old_checks='''      compareFailClosed({ decision: "INCONNU" }, { action: "SELL" }).state === "NON COMPARABLE",\n      stateOf({ decision: "NO TRADE" }) === "WAIT",'''
          new_checks='''      compareFailClosed({ decision: "INCONNU" }, { action: "SELL" }).state === "NON COMPARABLE",\n      compareFailClosed({ decision: "NO TRADE" }, undefined).state === "NON COMPARABLE",\n      stateOf({ decision: "NO TRADE" }) === "WAIT",'''
          assert old_checks in s
          s=s.replace(old_checks,new_checks,1)
          rec.write_text(s,encoding='utf-8')

          rd=root/'js/tradus-canonical-strategy-reader.js'
          r=rd.read_text(encoding='utf-8')
          # Replace canonicalization with capture-only semantics and a separate current comparison.
          start=r.index('  function canonicalize(row, reason = "runtime") {')
          end=r.index('  function mutateObservationDetail(event) {',start)
          block='''  function signalKnown(signal) {\n    const action = upper(signal?.action || "");\n    return !unknown(action);\n  }\n\n  function nonComparable(reason = "UNKNOWN_SIDE") {\n    return Object.freeze({ state:"NON COMPARABLE", text:"Comparaison indisponible", fail_closed:true, reason });\n  }\n\n  function captureCanonical(row, reason = "capture") {\n    if (!row || typeof row !== "object") return row;\n    const out = clone(row) || { ...row };\n    const strategyA = readCanonicalStrategyA();\n    const capturedAt = String(out.at || new Date().toISOString());\n    out.strategy_a = strategyA ? (clone(strategyA) || strategyA) : null;\n    out.comparison = (!strategyA || !signalKnown(out.signal))\n      ? clone(nonComparable(!strategyA ? "STRATEGY_A_UNKNOWN" : "TRADUS_SIGNAL_UNKNOWN"))\n      : (clone(compareCanonical(strategyA, out.signal, nonComparable())) || nonComparable());\n    out.strategy_a_reader = "AgentCryptoTradusStrategyFailClosed";\n    out.strategy_a_reader_reason = String(reason || "capture");\n    out.comparison_capture_at = capturedAt;\n    out.strategy_a_capture_at = capturedAt;\n    out.comparison_time_locked = true;\n    canonicalized += 1;\n    lastReason = String(reason || "capture");\n    return out;\n  }\n\n  function canonicalize(row, reason = "runtime") {\n    if (!row || typeof row !== "object") return row;\n    if (/shadow-read|historical-read|read/i.test(String(reason || ""))) return clone(row) || row;\n    return captureCanonical(row, reason);\n  }\n\n  function currentComparison(row) {\n    const strategyA = readCanonicalStrategyA();\n    const at = new Date().toISOString();\n    if (!row || !strategyA || !signalKnown(row.signal)) {\n      return Object.freeze({ at, strategy_a: strategyA ? clone(strategyA) : null, comparison: nonComparable(!row || !signalKnown(row?.signal) ? "TRADUS_SIGNAL_UNKNOWN" : "STRATEGY_A_UNKNOWN") });\n    }\n    return Object.freeze({ at, strategy_a: clone(strategyA) || strategyA, comparison: clone(compareCanonical(strategyA, row.signal, nonComparable())) });\n  }\n\n'''
          r=r[:start]+block+r[end:]
          r=r.replace('const fixed = canonicalize(detail, "event_capture");','const fixed = captureCanonical(detail, "event_capture");',1)
          r=r.replace('capture(row, source = "event") { return capture(canonicalize(row, `ledger:${source}`), source); }','capture(row, source = "event") { return capture(captureCanonical(row, `ledger:${source}`), source); }',1)
          r=r.replace('async refresh(trigger = "manual") { return canonicalize(await refresh(trigger), `shadow-refresh:${trigger}`); },\n      read() { return canonicalize(read(), "shadow-read"); },','async refresh(trigger = "manual") { return captureCanonical(await refresh(trigger), `shadow-refresh:${trigger}`); },\n      read() { return clone(read()) || read(); },',1)
          r=r.replace('    canonicalize,\n    snapshot,','    canonicalize,\n    captureCanonical,\n    currentComparison,\n    snapshot,',1)
          r=r.replace('    historical_rows_rewritten: false,','    historical_rows_rewritten: false,\n    historical_reads_recomputed: false,\n    comparison_time_locked: true,',1)
          rd.write_text(r,encoding='utf-8')

          src=root/'releases/40.6.129/index.html'; dst=root/'releases/40.6.130/index.html'; dst.parent.mkdir(parents=True,exist_ok=True)
          dst.write_text(src.read_text(encoding='utf-8').replace('40.6.129','40.6.130'),encoding='utf-8')
          bp=root/'build.json'; d=json.loads(bp.read_text(encoding='utf-8')); assert d['build']=='40.6.129'
          d.update({'build':'40.6.130','engine':'38.15.11','release':'TRADUS CAPTURE TIME LOCK','published':True,
            'status':'tradus_capture_time_lock_406130','parent_build':'40.6.129','asset_token':'market-core-v2.0-alpha-build-40.6.130',
            'administrator_build':'40.6.130','build_label':'Build 40.6.130 · Administrator','release_status':'tradus_capture_time_lock_406130',
            'market_core':'38.15.11','market_core_modified':False,'web_classic_modified':False,'aether_modified':False,
            'atlas_current_modified':False,'oracle_modified':False,'lecture_technique_modified':False,'strategy_a_modified':False,
            'tradus_read_side_modified':True,'automatic_order':False,'real_order':False,'new_recurring_timer':False,
            'new_observer':False,'new_storage_owner':False,'entry':'./releases/40.6.130/',
            'released_at':datetime.datetime.now(datetime.timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z')})
          d['tradus_capture_time_lock']={
            'introduced_in':'40.6.130','scope':'freeze Strategy A/TRADUS comparison at observation capture time and keep later current comparison separate and dated',
            'reader':'js/tradus-canonical-strategy-reader.js','comparator':'js/tradus-strategy-a-reconcile.js',
            'historical_read_recomputed':False,'capture_strategy_a_snapshot':True,'capture_comparison_snapshot':True,
            'current_comparison_separate':True,'current_comparison_dated':True,'missing_tradus_signal_non_comparable':True,
            'unknown_strategy_a_non_comparable':True,'historical_rows_rewritten':False,'strategy_engine_changed':False,
            'tradus_execution_changed':False,'market_core_changed':False,'graph_changed':False,'lecture_technique_changed':False,
            'aether_changed':False,'oracle_changed':False,'atlas_current_changed':False,'real_order':False,'wallet':False,'credentials':False,
            'firefox_terrain_proof':'pending: same stored observation id/time must keep the same captured comparison after Strategy A changes; missing signal must be NON COMPARABLE'}
          label='40.6.130 TRADUS CAPTURE TIME LOCK'; lineage=d.setdefault('recent_validated_lineage',[])
          if label not in lineage: lineage.append(label)
          d.setdefault('history',{})['previous_full_manifest_build']='40.6.129'
          bp.write_text(json.dumps(d,ensure_ascii=False,separators=(',',':')),encoding='utf-8')
          PY
          node --check public/agent_crypto_erith_ia/administrator/js/tradus-strategy-a-reconcile.js
          node --check public/agent_crypto_erith_ia/administrator/js/tradus-canonical-strategy-reader.js
          node <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const noop=()=>{};
