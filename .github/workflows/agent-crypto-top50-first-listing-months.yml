name: Agent Crypto Top50 First Listing Original SHIB QNT Sources
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/agent-crypto-top50-first-listing-months.yml'
      - 'public/agent_crypto_erith_ia/tools/archive_top50_first_spot_months.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: agent-crypto-top50-shib-qnt-first-spot-months
  cancel-in-progress: false
jobs:
  authenticated-first-spot-months:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: crypto-top50-original-first-listing-shib-qnt-2021
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate source identity, original timestamp logic and date announcements
        run: |
          set -euo pipefail
          python -m py_compile public/agent_crypto_erith_ia/tools/archive_top50_first_spot_months.py
          python public/agent_crypto_erith_ia/tools/archive_top50_first_spot_months.py --self-test
      - name: Obtain original Binance Spot SHIB 2021-05 and QNT 2021-07 ZIPs and official CHECKSUMs
        run: |
          set -euo pipefail
          python public/agent_crypto_erith_ia/tools/archive_top50_first_spot_months.py \
            --stage --output "$RUNNER_TEMP/first-native-spot-months"
      - name: Independently verify all six original files and first listing truth
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,pathlib,hashlib
          base=pathlib.Path(os.environ["RUNNER_TEMP"])/"first-native-spot-months"
          j=json.loads((base/"manifest.json").read_text())
          assert j["schema"]=="seven.crypto.top50-first-listing-original-months.v1"
          assert j["verified_original_month_pairs"]==2 and j["no_synthetic_candles"]
          assert j["months_by_original_market"]=={"SHIBUSDT":"2021-05","QNTUSDT":"2021-07"}
          assert len(j["records"])==2 and j["strict_native_original_rows"]>0
          files={"manifest.json"}
          for r in j["records"]:
              assert r["status"]=="native_1m_partial" and r["strict_utc_aligned"]
              assert r["native_rows"]>0 and r["missing_1m_minutes"]>0
              assert r["native_rows"]+r["missing_1m_minutes"]==r["calendar_minutes"]
              assert sum(g["missing_minutes"] for g in r["missing_intervals"])==r["missing_1m_minutes"]
              for key in ("source_zip","official_checksum","sqlite"):
                  proof=r[key];p=base/proof["name"]
                  assert proof["name"] not in files and p.is_file()
                  assert p.stat().st_size==proof["bytes"]
                  assert hashlib.sha256(p.read_bytes()).hexdigest()==proof["sha256"]
                  files.add(proof["name"])
          assert len(files)==7 and files=={p.name for p in base.iterdir()}
          print("SHIB QNT FIRST-LISTING SPOT SOURCE VERIFIED",j["strict_native_original_rows"])
          PY
      - name: Publish immutable Binance source ZIP and SQLite first trading months
        run: |
          set -euo pipefail
          root=public/agent_crypto_erith_ia/data/historical_archive_prototype
          dir="$RUNNER_TEMP/first-native-spot-months"
          git fetch origin main
          for f in top250_multisource_coverage/index.json top50_historical_expansion/index.json; do
            a=$(sha256sum "$root/$f" | cut -d' ' -f1)
            b=$(git show "origin/main:$root/$f" | sha256sum | cut -d' ' -f1)
            test "$a" = "$b" || { echo "::error::Canonical rank ownership drift";exit 1; }
          done
          if gh release view "$TAG" --json tagName >/dev/null 2>"$RUNNER_TEMP/release-error.txt";then
            mkdir -p "$RUNNER_TEMP/older"
            gh release download "$TAG" --pattern manifest.json --dir "$RUNNER_TEMP/older"
            cmp "$RUNNER_TEMP/older/manifest.json" "$dir/manifest.json" || {
              echo "::error::Immutable original listing-source mismatch"; exit 1;
            }
          else
            if ! grep -Eqi 'release not found|HTTP 404|not found' "$RUNNER_TEMP/release-error.txt";then
              cat "$RUNNER_TEMP/release-error.txt";exit 1
            fi
            gh release create "$TAG" "$dir"/* --target "$GITHUB_SHA" \
              --title "Original Binance SHIB May and QNT July 2021 Spot opening months" \
              --notes "Two authentic original Binance 1m ZIP archives, official CHECKSUMs and native OHLCV SQLite. Prelisting minutes remain explicit gaps, never synthetic candles. No chart or legacy archive changes." \
              --latest=false
          fi
          gh release view "$TAG" --json assets,isDraft,url > "$RUNNER_TEMP/release.json"
          python - <<'PY'
          import os,json,pathlib
          base=pathlib.Path(os.environ["RUNNER_TEMP"])
          j=json.loads((base/"release.json").read_text())
          x={p["name"]:p["size"] for p in j["assets"]}
          y={p.name:p.stat().st_size for p in (base/"first-native-spot-months").iterdir()}
          assert not j["isDraft"] and x==y
          print("AUTHENTIC FIRST MONTH SPOT SOURCE RELEASE",j["url"])
          PY
      - name: Commit only new historical source manifest on main
        run: |
          set -euo pipefail
          root=public/agent_crypto_erith_ia/data/historical_archive_prototype
          file="$root/top50_historical_expansion/first_listing_months/index.json"
          for attempt in 1 2 3;do
            git fetch origin main
            for f in top250_multisource_coverage/index.json top50_historical_expansion/index.json;do
              a=$(sha256sum "$root/$f" | cut -d' ' -f1)
              b=$(git show "origin/main:$root/$f" | sha256sum | cut -d' ' -f1)
              test "$a" = "$b" || { echo "::error::Original ranking changed";exit 1; }
            done
            git reset --hard origin/main
            mkdir -p "$(dirname "$file")"
            cp "$RUNNER_TEMP/first-native-spot-months/manifest.json" "$file"
            git add -- "$file"
            git diff --cached --check
            if git diff --cached --quiet;then exit 0;fi
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m "Coffre: preserve authentic first SHIB QNT Binance Spot trading months"
            if git push origin HEAD:main;then exit 0;fi
          done
          exit 1
      - name: Original Trader, Interface and previous source vault unchanged
        if: always()
        run: |
          git diff --exit-code -- \
            public/agent_crypto_erith_ia/trader/ \
            public/agent_crypto_erith_ia/administrator/ \
            public/agent_crypto_erith_ia/data/historical_archive_prototype/top250_multisource_coverage/
