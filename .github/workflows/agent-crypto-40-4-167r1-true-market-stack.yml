name: Agent-Crypto 40.4.167R1 True Market Stack

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/agent-crypto-40-4-167r1-true-market-stack.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build and validate 40.4.167R1 True Market Stack
        run: |
          set -euo pipefail
          python .github/scripts/agent_crypto_40_4_167r1_true_market_stack.py
          node --check public/agent_crypto_erith_ia/administrator/js/market-stack.js
          node --check public/agent_crypto_erith_ia/administrator/js/markets-domain-contract.js
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('public/agent_crypto_erith_ia/administrator')
          for p in (root/'version.json', root/'administrator-version.json'):
              d=json.loads(p.read_text(encoding='utf-8'))
              assert d['build']=='40.4.167'
              assert d['revision']=='R1'
              assert d['status']=='true_market_stack_crypto_then_metals_cockpit_parity'
          idx=(root/'index.html').read_text(encoding='utf-8')
          assert 'atlasMarketCascade404167' not in idx
          assert 'market-stack.js?v=administrator-build-40.4.167R1' in idx
          js=(root/'js/market-stack.js').read_text(encoding='utf-8')
          assert 'atlasParallelMarketFoundation' in js
          assert 'atlasMetalsDetailPanel' in js
          assert 'new Chart' not in js
          assert 'fetch(' not in js
          PY

      - name: Commit release and retire one-shot
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/scripts/agent_crypto_40_4_167r1_true_market_stack.py
          rm .github/workflows/agent-crypto-40-4-167r1-true-market-stack.yml
          git add -A
          git commit -m "release Agent-Crypto 40.4.167R1 True Market Stack"
          git push origin HEAD:main
