name: Agent-Crypto Same Source Global Cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/agent-crypto-same-source-global-cleanup.yml'
      - '.github/scripts/agent_crypto_canonicalize_same_source_globals.py'

permissions:
  contents: write

concurrency:
  group: agent-crypto-same-source-global-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Synchronize
        run: git pull --ff-only origin main

      - name: Canonicalize same-source global owners
        run: python .github/scripts/agent_crypto_canonicalize_same_source_globals.py

      - name: JavaScript syntax check
        run: |
          find public/agent_crypto_erith_ia/administrator -type f -name '*.js' -print0 \
            | xargs -0 -n1 node --check

      - name: Market Core lock guard
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          data=json.loads(Path('public/agent_crypto_erith_ia/administrator/build.json').read_text(encoding='utf-8'))
          engine=str(data.get('engine_build') or data.get('engine') or data.get('market_core') or '')
          if '38.15.11' not in engine:
              raise SystemExit(f'Market Core lock violated: {engine!r}')
          print('Market Core 38.15.11 locked')
          PY

      - name: Runtime reference sanity
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          root=Path('public/agent_crypto_erith_ia/administrator')
          shell=(root/'runtime-shell.html').read_text(encoding='utf-8')
          missing=[]
          for ref in re.findall(r'(?:src|href)=["\'](\./[^"\']+)["\']', shell):
              clean=ref.split('?',1)[0]
              if not (root/clean[2:]).exists():
                  missing.append(clean)
          if missing:
              raise SystemExit('Missing runtime references: '+', '.join(sorted(set(missing))))
          print('Runtime references OK')
          PY

      - name: Commit cleanup and retire one-shot tooling
        run: |
          set -euo pipefail
          git config user.name 'Seven Heaven Refactor'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A public/agent_crypto_erith_ia/administrator
          git rm -f .github/workflows/agent-crypto-same-source-global-cleanup.yml
          git rm -f .github/scripts/agent_crypto_canonicalize_same_source_globals.py
          if git diff --cached --quiet; then
            echo 'No safe same-source globals to canonicalize'
            exit 0
          fi
          git commit -m 'refactor(agent-crypto): canonicalize same-source global owners'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo 'Rebase conflict; refusing force-push'
              exit 1
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          echo 'Push remained contested after safe retries'
          exit 1
