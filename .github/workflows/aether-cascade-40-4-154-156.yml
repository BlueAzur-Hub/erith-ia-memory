name: Aether Cascade 40.4.154-156 Recovery

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/aether-cascade-40-4-154-156.yml'

permissions:
  contents: write

concurrency:
  group: aether-agent-crypto-release-cascade
  cancel-in-progress: false

jobs:
  cascade:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout canonical main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Recover archive handoff and publish 40.4.155-156
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Aether Release"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          cat > /tmp/aether_release.py <<'PY'
          from pathlib import Path
          import hashlib, json, re, sys, zipfile
          from datetime import datetime, timezone

          admin = Path('public/agent_crypto_erith_ia/administrator')
          index_p = admin / 'index.html'
          root_p = admin / 'app.js'
          js_p = admin / 'js/app.js'
          manifests = [admin / 'version.json', admin / 'administrator-version.json']
          archive_dir = Path('coordination/inter_ai_dialogues/agent_crypto')

          def sha(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()

          def replace_exact(text, old, new, label):
              if text.count(old) != 1:
                  raise SystemExit(f'{label}: expected exactly one source block, got {text.count(old)}')
              return text.replace(old, new, 1)

          def replace_regex(text, pattern, repl, label, count=1):
              out, n = re.subn(pattern, repl, text, count=count)
              if count and n != count:
                  raise SystemExit(f'{label}: replacement count {n}, expected {count}')
              return out

          def patch_publication_identity(obj, build, status):
              if isinstance(obj, dict):
                  for key, value in obj.items():
                      if key == 'publication_identity' and isinstance(value, dict):
                          value['build'] = build
                          value['asset_token'] = f'market-core-v2.0-alpha-build-{build}'
                          value['status'] = status
                          if 'app_sha256' in value:
                              value['app_sha256'] = sha(root_p)
                      else:
                          patch_publication_identity(value, build, status)
              elif isinstance(obj, list):
                  for value in obj:
                      patch_publication_identity(value, build, status)

          def bump_identity(build, parent, release, status, lineage_note, verification_key, verification_value):
              html = index_p.read_text(encoding='utf-8')
              html = replace_regex(html, r'(<meta name="atlas-build" content=")[^"]+(" />)', rf'\g<1>{build}\2', 'atlas meta')
              html = replace_regex(html, r'(<meta name="administrator-build" content=")[^"]+(" />)', rf'\g<1>{build}\2', 'administrator meta')
              html = replace_regex(html, r'(<meta name="administrator-release" content=")[^"]+(" />)', rf'\g<1>{release}\2', 'release meta')
              html = replace_regex(html, r'(<meta name="atlas-asset-token" content=")[^"]+(" />)', rf'\g<1>market-core-v2.0-alpha-build-{build}\2', 'asset token meta')
              html = replace_regex(html, r'(<title>Agent-Crypto @erith\.IA — Build )40\.4\.\d+( · Administrator</title>)', rf'\g<1>{build}\2', 'title')
              html = re.sub(r'(\?v=administrator-build-)40\.4\.\d+', rf'\g<1>{build}', html)
              html = re.sub(r'(Agent-Crypto @erith\.IA · Market Core · Build )40\.4\.\d+( · Version : Parker Lewis Can\'t Lose)', rf'\g<1>{build}\2', html)
              index_p.write_text(html, encoding='utf-8', newline='\n')

              root = root_p.read_text(encoding='utf-8')
              root = replace_regex(root, r'const ATLAS_BUILD = "40\.4\.\d+";', f'const ATLAS_BUILD = "{build}";', 'root ATLAS_BUILD')
              root_p.write_text(root, encoding='utf-8', newline='\n')

              js = js_p.read_text(encoding='utf-8')
              js = replace_regex(js, r'const ADMIN_BUILD = "40\.4\.\d+";', f'const ADMIN_BUILD = "{build}";', 'modular ADMIN_BUILD')
              js = replace_regex(js, r'const ADMIN_RELEASE = "[^"]*";', f'const ADMIN_RELEASE = "{release}";', 'modular ADMIN_RELEASE')
              js_p.write_text(js, encoding='utf-8', newline='\n')

              now = datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00', 'Z')
              for path in manifests:
                  data = json.loads(path.read_text(encoding='utf-8'))
                  data['build'] = build
                  data['release'] = release
                  data['asset_token'] = f'market-core-v2.0-alpha-build-{build}'
                  data['status'] = status
                  data['parent_build'] = parent
                  data['prepared_at'] = now
                  data['published_at'] = now
                  if 'global_versioning' in data:
                      data['global_versioning'] = build
                  lineage = str(data.get('lineage') or '')
                  if lineage_note and lineage_note not in lineage:
                      data['lineage'] = (lineage + ' → ' + lineage_note).strip(' →')
                  files = data.setdefault('files', {})
                  for rel in list(files):
                      candidate = (admin / rel).resolve()
                      if candidate.is_file() and candidate != path.resolve():
                          files[rel] = sha(candidate)
                  data.setdefault('verification', {})[verification_key] = verification_value
                  patch_publication_identity(data, build, status)
                  path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8', newline='\n')

          def patch155():
              root = root_p.read_text(encoding='utf-8')
              old = '''  if (!element && entry.id === "simulation" && entry.target === "closest-collapse") {\n    return document.querySelector('details.atlas-collapse[data-collapse-key="simulation"]');\n  }'''
              new = '''  if (!element && entry.target === "closest-collapse") {\n    const key = String(entry.id || "");\n    const shell = [...document.querySelectorAll('details.atlas-collapse[data-collapse-key]')]\n      .find(detail => String(detail.dataset.collapseKey || "") === key);\n    if (shell) return shell;\n  }'''
              root = replace_exact(root, old, new, '40.4.155 generic detached-collapse target')

              old_open = '''  const entry = atlasV2ManifestEntry(id);\n  const target = document.getElementById(id);\n  if (!target) return false;'''
              new_open = '''  const entry = atlasV2ManifestEntry(id);\n  const target = entry ? atlasV2ManifestTarget(entry) : document.getElementById(id);\n  if (!target) return false;'''
              root = replace_exact(root, old_open, new_open, '40.4.155 hash/navigation manifest target')

              insert_at = 'function atlasV2OpenAdvancedForTarget(hash, options = {}) {'
              diagnostic = '''function atlasV2ThreeViewCoherenceSnapshot404155() {\n  const modes = ["essential", "intermediate", "advanced"];\n  return Object.freeze(modes.map(mode => {\n    const expected = ATLAS_V2_SECTION_MANIFEST.filter(entry => atlasV2EntryVisibleInMode(entry, mode));\n    const missing = expected.filter(entry => !atlasV2ManifestTarget(entry)).map(entry => entry.id);\n    return Object.freeze({ mode, expected: expected.length, missing: Object.freeze(missing), pass: missing.length === 0 });\n  }));\n}\n\nglobalThis.ErithThreeViewCoherence404155 = Object.freeze({\n  build: "40.4.155",\n  contract: "Classique → Intermédiaire → Administration",\n  generic_detached_collapse_resolution: true,\n  hash_navigation_uses_manifest_target: true,\n  business_logic_changed: false,\n  timer_added: false,\n  observer_added: false,\n  fetch_added: false,\n  storage_write_added: false,\n  snapshot: atlasV2ThreeViewCoherenceSnapshot404155\n});\n\n'''
              if 'ErithThreeViewCoherence404155' not in root:
                  if root.count(insert_at) != 1:
                      raise SystemExit('40.4.155 diagnostic insertion anchor missing')
                  root = root.replace(insert_at, diagnostic + insert_at, 1)
              root_p.write_text(root, encoding='utf-8', newline='\n')

              bump_identity(
                  '40.4.155', '40.4.154',
                  'THREE-VIEW COHERENCE · DETACHED COLLAPSE TARGET LOCK',
                  'three_view_coherence_detached_collapse_target_lock',
                  '40.4.155 three-view coherence + generic detached-collapse target resolution',
                  'three_view_coherence_404155',
                  {
                      'views': ['essential', 'intermediate', 'advanced'],
                      'generic_closest_collapse_fallback': True,
                      'hash_navigation_uses_manifest_target': True,
                      'runtime_audit': 'ErithThreeViewCoherence404155.snapshot()',
                      'operator_intermediate_simulation_evidence': 'PASS 2026-09-01',
                      'timer_added': False, 'observer_added': False, 'fetch_added': False,
                      'storage_write_added': False, 'market_core_changed': False,
                      'oracle_model_changed': False, 'atlas_pipeline_changed': False
                  }
              )

          def patch156():
              js = js_p.read_text(encoding='utf-8')
              anchor = '''      {\n        id: "graphique",\n        title: "Graphique + Lecture technique · Crypto",\n        tone: "cyan",\n        directFixed: true,\n        resolveEntries: () => [entry(byId("analyste"))].filter(Boolean),\n        resolveAnchor: nodes => nodes[0]\n      },'''
              addition = anchor + '''\n      {\n        id: "oracle-graph",\n        title: "Oracle V1 · Scénario court",\n        tone: "violet",\n        directFixed: true,\n        geometryPolicy: { minWidth: 520, minHeight: 360, keepFullyVisible: true },\n        preferredFloatGeometry: () => {\n          const vw = Math.max(document.documentElement.clientWidth, window.innerWidth || 0);\n          const vh = Math.max(document.documentElement.clientHeight, window.innerHeight || 0);\n          const rect = byId("atlasOracleV0")?.getBoundingClientRect?.();\n          const width = Math.min(980, Math.max(620, Math.round(vw * 0.62)));\n          const height = Math.min(680, Math.max(420, Math.round(rect?.height || vh * 0.68)));\n          return { x: Math.max(12, Math.round((vw - width) / 2)), y: Math.max(72, Math.round((vh - height) / 2)), width, height };\n        },\n        resolveEntries: () => [entry(byId("atlasOracleV0"))].filter(Boolean),\n        resolveAnchor: nodes => nodes[0],\n        resolveControlHosts: () => [byId("atlasOracleV0")].filter(Boolean)\n      },'''
              if 'id: "oracle-graph"' not in js:
                  js = replace_exact(js, anchor, addition, '40.4.156 Oracle native window')

              install_anchor = '  function installGlobalVersionIdentity() {'
              chrome = '''  function installOracleGraphWindowChrome404156() {\n    if (document.getElementById("atlasOracleGraphWindowChrome404156")) return true;\n    const style = document.createElement("style");\n    style.id = "atlasOracleGraphWindowChrome404156";\n    style.textContent = `\n      #atlasOracleV0.admin-native-anchor{--native-accent:#b890ff}\n      #atlasOracleV0.admin-native-anchor>.admin-native-controls{top:6px!important;right:8px!important;z-index:80!important;opacity:.84}\n      #atlasOracleV0.admin-native-anchor>.atlas-oracle-head{padding-right:176px}\n      #atlasOracleV0.admin-native-direct-floating>.admin-native-controls{opacity:1!important}\n      @media(max-width:900px){\n        #atlasOracleV0.admin-native-anchor>.atlas-oracle-head{padding-right:142px}\n        #atlasOracleV0.admin-native-anchor>.admin-native-controls .admin-native-control{width:24px!important;height:24px!important;min-width:24px!important;min-height:24px!important}\n      }\n    `;\n    document.head.appendChild(style);\n    return true;\n  }\n\n  globalThis.ErithOracleGraphWindow404156 = Object.freeze({\n    build: "40.4.156",\n    window_id: "oracle-graph",\n    owner: "existing Administrator Window Manager",\n    direct_fixed: true,\n    movable: true,\n    resizable: true,\n    persisted_by_existing_window_manager: true,\n    oracle_engine_changed: false,\n    forecast_math_changed: false,\n    canvas_data_changed: false,\n    timer_added: false,\n    observer_added: false,\n    fetch_added: false\n  });\n\n'''
              if 'function installOracleGraphWindowChrome404156()' not in js:
                  if js.count(install_anchor) != 1:
                      raise SystemExit('40.4.156 chrome insertion anchor missing')
                  js = js.replace(install_anchor, chrome + install_anchor, 1)

              boot_old = '''    if (bootRole40312 === "administrator") ensureAdministratorAtlasVisible(manager, "administrator-boot");\n    installMathCoreInlineWindowControls40148();'''
              boot_new = '''    if (bootRole40312 === "administrator") ensureAdministratorAtlasVisible(manager, "administrator-boot");\n    installOracleGraphWindowChrome404156();\n    installMathCoreInlineWindowControls40148();'''
              if 'installOracleGraphWindowChrome404156();' not in js:
                  js = replace_exact(js, boot_old, boot_new, '40.4.156 Oracle window chrome boot')
              js_p.write_text(js, encoding='utf-8', newline='\n')

              bump_identity(
                  '40.4.156', '40.4.155',
                  'ORACLE GRAPH WINDOW · DIRECT-FLOAT WORKSPACE LOCK',
                  'oracle_graph_window_direct_float_workspace_lock',
                  '40.4.156 Oracle V1 graph movable direct-float workspace window',
                  'oracle_graph_window_404156',
                  {
                      'window_id': 'oracle-graph',
                      'window_manager_owner': 'js/app.js nativeDefinitions',
                      'direct_fixed': True, 'movable': True, 'resizable': True,
                      'position_persistent': True, 'dock_restore': True,
                      'oracle_engine_changed': False, 'canvas_data_changed': False,
                      'forecast_math_changed': False, 'timer_added': False,
                      'observer_added': False, 'fetch_added': False,
                      'market_core_changed': False
                  }
              )

          def archive_current():
              manifest = json.loads((admin / 'version.json').read_text(encoding='utf-8'))
              build = str(manifest.get('build') or '').strip()
              if not build:
                  raise SystemExit('archive: version.json build absent')
              files = list((manifest.get('files') or {}).keys())
              for required in ('version.json', 'administrator-version.json'):
                  if required not in files:
                      files.append(required)
              missing = [rel for rel in files if not (admin / rel).is_file()]
              if missing:
                  raise SystemExit('archive missing manifest files: ' + ', '.join(missing))
              archive_dir.mkdir(parents=True, exist_ok=True)
              safe = build.replace('.', '_')
              out = archive_dir / f'AGENT_CRYPTO_BUILD_{safe}_AUTO_CANONICAL.zip'
              with zipfile.ZipFile(out, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=9) as zf:
                  for rel in files:
                      src = admin / rel
                      arc = Path('public/agent_crypto_erith_ia/administrator') / rel
                      zf.write(src, arcname=arc.as_posix())
              digest = sha(out)
              sha_p = Path(str(out) + '.sha256')
              sha_p.write_text(f'{digest}  {out.name}\n', encoding='utf-8')
              print(f'{build}|{out.as_posix()}|{sha_p.as_posix()}|{digest}')

          mode = sys.argv[1]
          if mode == 'patch155': patch155()
          elif mode == 'patch156': patch156()
          elif mode == 'archive': archive_current()
          else: raise SystemExit(f'unknown mode {mode}')
          PY

          current="$(python -c 'import json; print(json.load(open("public/agent_crypto_erith_ia/administrator/version.json", encoding="utf-8"))["build"])')"
          test "$current" = "40.4.154"

          archive_and_commit() {
            local expected="$1"
            local info build archive sha digest
            info="$(python /tmp/aether_release.py archive)"
            build="${info%%|*}"
            test "$build" = "$expected"
            local rest="${info#*|}"
            archive="${rest%%|*}"
            rest="${rest#*|}"
            sha="${rest%%|*}"
            digest="${rest##*|}"
            git add "$archive" "$sha"
            if ! git diff --cached --quiet; then
              git commit -m "coordination: archive Agent-Crypto ${expected} canonical"
            fi
            test -s "$archive"
            grep -Fq "$digest" "$sha"
            echo "${expected} canonical archive PASS · ${digest}"
          }

          archive_and_commit "40.4.154"

          python /tmp/aether_release.py patch155
          node --check public/agent_crypto_erith_ia/administrator/app.js
          node --check public/agent_crypto_erith_ia/administrator/js/app.js
          python -m json.tool public/agent_crypto_erith_ia/administrator/version.json >/dev/null
          python -m json.tool public/agent_crypto_erith_ia/administrator/administrator-version.json >/dev/null
          git diff --check
          git add public/agent_crypto_erith_ia/administrator/index.html \
                  public/agent_crypto_erith_ia/administrator/app.js \
                  public/agent_crypto_erith_ia/administrator/js/app.js \
                  public/agent_crypto_erith_ia/administrator/version.json \
                  public/agent_crypto_erith_ia/administrator/administrator-version.json
          git commit -m "fix Agent-Crypto 40.4.155 harden three-view manifest coherence"
          archive_and_commit "40.4.155"

          python /tmp/aether_release.py patch156
          node --check public/agent_crypto_erith_ia/administrator/app.js
          node --check public/agent_crypto_erith_ia/administrator/js/app.js
          python -m json.tool public/agent_crypto_erith_ia/administrator/version.json >/dev/null
          python -m json.tool public/agent_crypto_erith_ia/administrator/administrator-version.json >/dev/null
          git diff --check
          git add public/agent_crypto_erith_ia/administrator/index.html \
                  public/agent_crypto_erith_ia/administrator/app.js \
                  public/agent_crypto_erith_ia/administrator/js/app.js \
                  public/agent_crypto_erith_ia/administrator/version.json \
                  public/agent_crypto_erith_ia/administrator/administrator-version.json
          git commit -m "feat Agent-Crypto 40.4.156 add movable Oracle graph workspace window"
          archive_and_commit "40.4.156"

          rm -f .github/workflows/aether-cascade-40-4-154-156.yml
          git add .github/workflows/aether-cascade-40-4-154-156.yml
          git commit -m "chore Agent-Crypto retire completed 40.4.154-156 cascade"

          git log --oneline -8
          git push origin HEAD:main

      - name: Final local proof
        shell: bash
        run: |
          set -euo pipefail
          test "$(python -c 'import json; print(json.load(open("public/agent_crypto_erith_ia/administrator/version.json", encoding="utf-8"))["build"])')" = "40.4.156"
          test -s coordination/inter_ai_dialogues/agent_crypto/AGENT_CRYPTO_BUILD_40_4_154_AUTO_CANONICAL.zip
          test -s coordination/inter_ai_dialogues/agent_crypto/AGENT_CRYPTO_BUILD_40_4_155_AUTO_CANONICAL.zip
          test -s coordination/inter_ai_dialogues/agent_crypto/AGENT_CRYPTO_BUILD_40_4_156_AUTO_CANONICAL.zip
          grep -Fq 'ErithThreeViewCoherence404155' public/agent_crypto_erith_ia/administrator/app.js
          grep -Fq 'id: "oracle-graph"' public/agent_crypto_erith_ia/administrator/js/app.js
          grep -Fq 'ErithOracleGraphWindow404156' public/agent_crypto_erith_ia/administrator/js/app.js
          echo '40.4.154 → 40.4.156 local cascade proof PASS.'
