name: Archive Trader Master 40.6.719 differential update

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/agent-crypto-trader-406719-shared-archives.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: archive-trader-master-406719-20261103
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          persist-credentials: true
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /coordination/inter_ai_dialogues/agent_crypto/
            /public/agent_crypto_erith_ia/administrator/index.html
            /public/agent_crypto_erith_ia/trader/build.json
            /public/agent_crypto_erith_ia/trader/trading-desk.html
            /public/agent_crypto_erith_ia/trader/trader-runtime-mirror.js
            /.github/workflows/agent-crypto-trader-406719-shared-archives.yml
      - name: Download the four-file candidate artifact from the verified workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/trader-master-patch"
          gh run download 41698213361 --repo BlueAzur-Hub/erith-ia-memory --name agent-crypto-small-code-patch --dir "$RUNNER_TEMP/trader-master-patch"
      - name: Verify exact files and archive them without full-site content
        env:
          PATCH_TEMP: ${{ runner.temp }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, os, shutil, zipfile
          source=Path(os.environ["PATCH_TEMP"])/"trader-master-patch"
          original=source/"AGENT_CRYPTO_CLEAN_UPLOAD.zip"
          checksum=source/"AGENT_CRYPTO_CLEAN_UPLOAD.zip.sha256"
          name="AGENT_CRYPTO_TRADER_MASTER_40_6_719_ADMINISTRATOR_SHARED_RUNTIME_CLEAN_UPLOAD_4_FILES.zip"
          expected_zip_sha="7653666f30d490e24a690feb7dd42b4e96156f039c4e7f6c16f1e076c0e1cf58"
          expected_files={
            "public/agent_crypto_erith_ia/administrator/index.html",
            "public/agent_crypto_erith_ia/trader/build.json",
            "public/agent_crypto_erith_ia/trader/trading-desk.html",
            "public/agent_crypto_erith_ia/trader/trader-runtime-mirror.js"
          }
          data=original.read_bytes()
          assert hashlib.sha256(data).hexdigest()==expected_zip_sha, "ZIP SHA differs"
          assert checksum.read_text().split()[0]==expected_zip_sha, "Original SHA file differs"
          with zipfile.ZipFile(original) as z:
            assert z.testzip() is None, "ZIP CRC failed"
            files={n for n in z.namelist() if n!="CLEAN_UPLOAD_MANIFEST.json"}
            assert files==expected_files and len(z.namelist())==5, "Unexpected archive contents"
            manifest=json.loads(z.read("CLEAN_UPLOAD_MANIFEST.json"))
            assert manifest["head"]=="64a6190d870fa9d51294955b6e026502721e2127"
            assert manifest["base"]=="7136db2783c1308957140ed3c0fec51780de1190"
            assert len(manifest["files"])==4
            for item in manifest["files"]:
              p=item["path"]
              assert p in expected_files and ".." not in Path(p).parts
              payload=z.read(p)
              assert hashlib.sha256(payload).hexdigest()==item["sha256"]
              assert Path(p).read_bytes()==payload, "Published main differs: "+p
            build=json.loads(z.read("public/agent_crypto_erith_ia/trader/build.json"))
            assert build["build"]=="40.6.719" and build["administrator_base"]=="40.6.719"
            assert build["market_core"]=="38.15.11" and build["published"] is True
            assert build["execution"]=="disabled" and build["real_orders"] is False
          shared=Path("coordination/inter_ai_dialogues/agent_crypto")
          shared.mkdir(parents=True,exist_ok=True)
          dst=shared/name
          check=shared/(name+".sha256")
          expected_line=expected_zip_sha+"  "+name+"\n"
          if dst.exists():assert dst.read_bytes()==data, "Archive collision"
          else:shutil.copyfile(original,dst)
          if check.exists():assert check.read_text()==expected_line, "Checksum collision"
          else:check.write_text(expected_line)
          print("VERIFIED_TRADER_INCREMENTAL_ARCHIVE",name,len(data),expected_zip_sha)
          PY
      - name: Publish only this exact ZIP and SHA-256
        run: |
          set -euo pipefail
          shared=coordination/inter_ai_dialogues/agent_crypto
          git add -- "$shared/AGENT_CRYPTO_TRADER_MASTER_40_6_719_ADMINISTRATOR_SHARED_RUNTIME_CLEAN_UPLOAD_4_FILES.zip" "$shared/AGENT_CRYPTO_TRADER_MASTER_40_6_719_ADMINISTRATOR_SHARED_RUNTIME_CLEAN_UPLOAD_4_FILES.zip.sha256"
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Verified archive already present."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Archive Trader Master 40.6.719 differential update"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              echo "SHARED_TRADER_ARCHIVE_PUBLISHED"
              exit 0
            fi
          done
          exit 1
