name: Agent-Crypto 40.4.198 Metals Owner Extract

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/agent_crypto_40_4_198_metals_owner_extract.py'
      - '.github/workflows/agent-crypto-40-4-198-metals-owner-extract.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Extract native Metals owner snippets
        run: python .github/scripts/agent_crypto_40_4_198_metals_owner_extract.py
      - name: Commit diagnostic snapshot
        shell: bash
        run: |
          if git diff --quiet -- .github/diagnostics/agent_crypto_40_4_198_metals_owner.txt; then
            echo 'diagnostic unchanged'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/diagnostics/agent_crypto_40_4_198_metals_owner.txt
          git commit -m 'diagnose Metals native owner for 40.4.198'
          git push
