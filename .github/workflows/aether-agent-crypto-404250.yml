name: Aether Agent-Crypto 40.4.250

on:
  push:
    paths:
      - '.github/workflows/aether-agent-crypto-404250.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch 40.4.250
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, hashlib, datetime

          root = Path('public/agent_crypto_erith_ia/administrator')
          OLD = '40.4.249'
          NEW = '40.4.250'
          RELEASE = 'MULTI-MARKET · SINGLE GRAPH SURFACE EXCLUSIVITY'
          STATUS = 'single_market_graph_surface_exclusivity_404250'
          now = datetime.datetime.now(datetime.timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z')

          # app.js — domain truth: Crypto canvas paints only in Crypto.
          p = root / 'app.js'
          t = p.read_text(encoding='utf-8')
          old = '  const domain = atlasParallelMarketDomain();\n  const metalsActive = domain === "metals";'
          new = '  const domain = atlasParallelMarketDomain();\n  const cryptoActive = domain === "crypto";\n  const metalsActive = domain === "metals";'
          assert old in t, 'app.js domain owner drifted'
          t = t.replace(old, new, 1)
          old2 = '  if (foundation) foundation.hidden = !metalsActive;\n  if (canvas) canvas.hidden = metalsActive;'
          new2 = '  if (foundation) foundation.hidden = !metalsActive;\n  /* 40.4.250 — one painted market graph surface at a time.\n     The Crypto canvas must leave layout/paint for every non-Crypto domain. */\n  if (canvas) canvas.hidden = !cryptoActive;'
          assert old2 in t, 'app.js canvas owner drifted'
          t = t.replace(old2, new2, 1)
          assert OLD in t
          p.write_text(t.replace(OLD, NEW), encoding='utf-8')

          # parallel-markets.css — physical exclusivity + shared backdrop pass-through.
          p = root / 'parallel-markets.css'
          css = p.read_text(encoding='utf-8')
          old_rule = 'html[data-cyclic-market-mode="parallel"] #atlasParallelMarketFoundation{\n  visibility:hidden!important;pointer-events:none!important\n}'
          new_rule = 'html[data-cyclic-market-mode="parallel"] #atlasParallelMarketFoundation{\n  display:none!important;visibility:hidden!important;pointer-events:none!important\n}\n/* 40.4.250 — hidden is now a physical paint exclusion for the Crypto canvas.\n   This defeats older #mainChart display:block!important rules when another market owns the slot. */\n#analyste #mainChart[hidden]{display:none!important}'
          assert old_rule in css, 'parallel semantic owner drifted'
          css = css.replace(old_rule, new_rule, 1)

          old_shell = '    /* 40.4.249 — parallel background pass-through: no second office image over the shared market backdrop. */\n    background:linear-gradient(180deg,rgba(2,8,17,.18),rgba(2,8,17,.28))!important;'
          new_shell = '    /* 40.4.250 — single-surface pass-through: the shared chart-shell owns the backdrop. */\n    background:transparent!important;'
          assert old_shell in css, 'parallel shell owner drifted'
          css = css.replace(old_shell, new_shell, 1)

          old_stage = '    background:linear-gradient(180deg,rgba(1,7,14,.30),rgba(1,8,15,.16)),radial-gradient(circle at 74% 18%,color-mix(in srgb,var(--cyclic-market-accent,#a9b9c7) 8%,transparent),transparent 36%)!important;'
          assert old_stage in css, 'parallel live-stage owner drifted'
          css = css.replace(old_stage, '    background:transparent!important;', 1)

          needle = '  html[data-cyclic-market-mode="parallel"] .atlas-parallel-live-heading{display:none!important}\n'
          insert = '  html[data-cyclic-market-mode="parallel"] #atlasCyclicMarketInertStage404168{\n    background:transparent!important;\n  }\n'
          assert needle in css, 'parallel outer-stage insertion point drifted'
          css = css.replace(needle, needle + insert, 1)
          p.write_text(css, encoding='utf-8')

          # Runtime identity / cache busting.
          for rel in ['index.html', 'js/app.js']:
              q = root / rel
              text = q.read_text(encoding='utf-8')
              assert OLD in text, f'{rel}: old build token missing'
              q.write_text(text.replace(OLD, NEW), encoding='utf-8')

          # build.json
          q = root / 'build.json'
          d = json.loads(q.read_text(encoding='utf-8'))
          assert d.get('build') == OLD
          d.update({'build':NEW, 'release':RELEASE, 'published':True, 'status':STATUS})
          q.write_text(json.dumps(d, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          contract_key = 'single_market_graph_surface_exclusivity_404250'
          contract = {
              'build': NEW,
              'parent': OLD,
              'scope': 'single_market_graph_surface_exclusivity',
              'visual_redesign': False,
              'crypto_canvas_physical_exclusion_non_crypto': True,
              'metals_foundation_physical_exclusion_parallel': True,
              'parallel_outer_stage_shared_backdrop_passthrough': True,
              'parallel_live_shell_shared_backdrop_passthrough': True,
              'parallel_live_stage_shared_backdrop_passthrough': True,
              'active_surface_contract': {
                  'crypto': 'mainChart',
                  'metals': 'atlasMetalsChartCanvas',
                  'parallel': 'atlasParallelLiveCanvas404170'
              },
              'surface_mutual_exclusion_required': True,
              'technical_reading_changed': False,
              'rnd_changed': False,
              'market_graph_data_changed': False,
              'sources_changed': False,
              'histories_changed': False,
              'atlas_changed': False,
              'oracle_changed': False,
              'math_core_changed': False,
              'window_manager_changed': False,
              'bridge_changed': False,
              'market_core_changed': False,
              'protected_market_core': '38.15.11',
              'firefox_operator_validation_required': True,
              'next_step': 'single_host_convergence_only_after_operator_acceptance'
          }
          note = ('40.4.250 — Single graph surface exclusivity: Crypto, Metals and parallel domains become mutually exclusive painted surfaces; '
                  'Crypto canvas is physically hidden outside Crypto, Metals foundation is physically removed in parallel mode, and Indices/Energy/Cross '
                  'pass through the shared chart backdrop instead of covering it with a dark stage. Technical Reading and Market Core 38.15.11 remain unchanged.')
          lineage = (' → 40.4.250 enforces one painted market graph surface at a time and restores shared chart backdrop pass-through across Crypto, Metals, '
                     'Indices, Energy and Cross without changing data or Market Core')

          for name in ['version.json', 'administrator-version.json']:
              q = root / name
              d = json.loads(q.read_text(encoding='utf-8'))
              assert d.get('build') == OLD, f'{name}: base build drifted'
              d['build'] = NEW
              d['release'] = RELEASE
              d['status'] = STATUS
              d['prepared_at'] = now
              d['published_at'] = now
              d['asset_token'] = f'market-core-v2.0-alpha-build-{NEW}'
              d['parent_build'] = OLD
              if name == 'administrator-version.json':
                  d['global_versioning'] = NEW
              d.setdefault('contracts', {})[contract_key] = contract
              if isinstance(d.get('lineage'), str) and NEW not in d['lineage']:
                  d['lineage'] += lineage
              if isinstance(d.get('release_notes'), list):
                  d['release_notes'].insert(0, note)
              if isinstance(d.get('validation'), dict):
                  d['validation']['status'] = 'candidate_single_market_graph_surface_firefox_validation_required'
                  d['validation']['runtime_user_test_required'] = True
                  d['validation']['single_market_graph_surface_exclusivity_404250_required'] = True
                  d['validation']['technical_reading_404245_non_regression_required'] = True
              q.write_text(json.dumps(d, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          # Hash authority after payload finalization.
          q = root / 'version.json'
          v = json.loads(q.read_text(encoding='utf-8'))
          for rel in ['parallel-markets.css','app.js','js/app.js','index.html','build.json','administrator-version.json']:
              if rel in v.get('files', {}):
                  v['files'][rel] = hashlib.sha256((root / rel).read_bytes()).hexdigest()
          q.write_text(json.dumps(v, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Static checks
        shell: bash
        run: |
          set -euo pipefail
          node --check public/agent_crypto_erith_ia/administrator/app.js
          node --check public/agent_crypto_erith_ia/administrator/js/app.js
          python - <<'PY'
          from pathlib import Path
          import json, hashlib
          root = Path('public/agent_crypto_erith_ia/administrator')
          css = (root/'parallel-markets.css').read_text(encoding='utf-8')
          app = (root/'app.js').read_text(encoding='utf-8')
          assert 'const cryptoActive = domain === "crypto";' in app
          assert 'if (canvas) canvas.hidden = !cryptoActive;' in app
          assert '#analyste #mainChart[hidden]{display:none!important}' in css
          assert 'html[data-cyclic-market-mode="parallel"] #atlasParallelMarketFoundation{\n  display:none!important' in css
          assert '#atlasCyclicMarketInertStage404168{\n    background:transparent!important;' in css
          assert 'admin-chart-office.png' not in css
          for name in ['build.json','version.json','administrator-version.json']:
              d = json.loads((root/name).read_text(encoding='utf-8'))
              assert d['build'] == '40.4.250'
          v = json.loads((root/'version.json').read_text(encoding='utf-8'))
          assert v['parent_build'] == '40.4.249'
          assert v['engine']['reference_build'] == '38.15.11'
          assert v['engine']['status'] == 'protected'
          assert 'single_market_graph_surface_exclusivity_404250' in v['contracts']
          for rel in ['parallel-markets.css','app.js','js/app.js','index.html','build.json','administrator-version.json']:
              if rel in v.get('files', {}):
                  assert v['files'][rel] == hashlib.sha256((root/rel).read_bytes()).hexdigest(), rel
          print('40.4.250 static checks: PASS')
          PY
          git diff --check

      - name: Commit release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Aether Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add \
            public/agent_crypto_erith_ia/administrator/parallel-markets.css \
            public/agent_crypto_erith_ia/administrator/app.js \
            public/agent_crypto_erith_ia/administrator/js/app.js \
            public/agent_crypto_erith_ia/administrator/index.html \
            public/agent_crypto_erith_ia/administrator/build.json \
            public/agent_crypto_erith_ia/administrator/version.json \
            public/agent_crypto_erith_ia/administrator/administrator-version.json
          git commit -m 'agent-crypto: build 40.4.250 enforce single graph surface exclusivity'
          git push origin HEAD:main

      - name: Build changed-files artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/aether250
          mkdir -p /tmp/aether250/public/agent_crypto_erith_ia/administrator/js
          cp public/agent_crypto_erith_ia/administrator/parallel-markets.css /tmp/aether250/public/agent_crypto_erith_ia/administrator/
          cp public/agent_crypto_erith_ia/administrator/app.js /tmp/aether250/public/agent_crypto_erith_ia/administrator/
          cp public/agent_crypto_erith_ia/administrator/js/app.js /tmp/aether250/public/agent_crypto_erith_ia/administrator/js/
          cp public/agent_crypto_erith_ia/administrator/index.html /tmp/aether250/public/agent_crypto_erith_ia/administrator/
          cp public/agent_crypto_erith_ia/administrator/build.json /tmp/aether250/public/agent_crypto_erith_ia/administrator/
          cp public/agent_crypto_erith_ia/administrator/version.json /tmp/aether250/public/agent_crypto_erith_ia/administrator/
          cp public/agent_crypto_erith_ia/administrator/administrator-version.json /tmp/aether250/public/agent_crypto_erith_ia/administrator/
          cat > /tmp/aether250/FILES_CHANGED_40.4.250.md <<'EOF'
          # Agent-Crypto 40.4.250 — Single market graph surface exclusivity

          - Crypto canvas leaves paint/layout for every non-Crypto domain.
          - Metals foundation is physically absent in parallel mode instead of merely visibility-hidden.
          - Indices / Énergie / Cross pass through the shared chart-shell backdrop instead of painting a dark cover.
          - Exactly one market graph surface is intended to be painted at a time.
          - Technical Reading 40.4.245, RND/images, data, histories, Atlas, Oracle, Math Core, Window Manager, Bridge and Market Core 38.15.11 are unchanged.
          - Firefox operator validation required before 40.4.251.
          EOF
          cd /tmp/aether250
          zip -qr AGENT_CRYPTO_BUILD_40_4_250_SINGLE_MARKET_GRAPH_SURFACE_EXCLUSIVITY_CHANGED_FILES.zip FILES_CHANGED_40.4.250.md public

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AGENT_CRYPTO_BUILD_40_4_250_SINGLE_MARKET_GRAPH_SURFACE_EXCLUSIVITY_CHANGED_FILES
          path: /tmp/aether250/AGENT_CRYPTO_BUILD_40_4_250_SINGLE_MARKET_GRAPH_SURFACE_EXCLUSIVITY_CHANGED_FILES.zip
          if-no-files-found: error
          retention-days: 90

      - name: Cleanup temporary release tool
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin main
          git rm .github/workflows/aether-agent-crypto-404250.yml
          git commit -m 'agent-crypto: cleanup 40.4.250 temporary release tool'
          git push origin HEAD:main
