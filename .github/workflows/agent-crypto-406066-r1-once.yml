name: Agent-Crypto 40.6.66 R1 one-shot repair

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/agent-crypto-406066-r1-once.yml

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repair 40.6.66 truth, archive manifest and OFF semantics
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, re

          root = Path('public/agent_crypto_erith_ia/administrator')
          build = '40.6.66'

          def text(path):
              return path.read_text(encoding='utf-8')

          def write(path, value):
              path.write_text(value, encoding='utf-8', newline='\n')

          def replace_one(value, old, new, label):
              count = value.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, got {count}')
              return value.replace(old, new, 1)

          def sha256(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()

          manifest_path = root / 'version.json'
          manifest = json.loads(text(manifest_path))
          if str(manifest.get('build')) != build:
              raise SystemExit(f'R1 refuses non-{build} manifest: {manifest.get("build")}')
          if str(manifest.get('engine')) not in ('38.15.11', "{'reference_build': '38.15.11'}"):
              engine = manifest.get('engine')
              if not (isinstance(engine, dict) and str(engine.get('reference_build')) == '38.15.11'):
                  raise SystemExit(f'Market Core drift: {engine!r}')

          # 1 — First-paint / cache truth. No layout or business logic change.
          index_path = root / 'index.html'
          index = text(index_path)
          index = replace_one(index,
              'aria-label="Version Agent-Crypto installée : Build 40.6.64, mode Administrator"',
              'aria-label="Version Agent-Crypto installée : Build 40.6.66, mode Administrator"',
              'first-paint aria')
          index = replace_one(index,
              '<span id="atlasVersionTruthText">Build 40.6.64</span>',
              '<span id="atlasVersionTruthText">Build 40.6.66</span>',
              'first-paint badge')
          index = replace_one(index,
              '<span id="footerRelease">Administrator 40.6.64 · Market Core 38.15.11 · Web Classic · vérification… · Version : Parker Lewis Can\'t Lose</span>',
              '<span id="footerRelease">Administrator 40.6.66 · Market Core 38.15.11 · Web Classic · vérification… · Version : Parker Lewis Can\'t Lose</span>',
              'first-paint footer')
          index = replace_one(index,
              './app.js?v=administrator-build-40.6.64',
              './app.js?v=administrator-build-40.6.66',
              'root app cache token')
          index = replace_one(index,
              './js/version-truth.js?v=40.6.8',
              './js/version-truth.js?v=40.6.66',
              'version-truth cache token')
          write(index_path, index)

          # Root runtime build identity (A01): repair the actual owner, not the CI rule.
          root_app_path = root / 'app.js'
          root_app = text(root_app_path)
          root_app = replace_one(root_app,
              'const ATLAS_BUILD = "40.6.53";',
              'const ATLAS_BUILD = "40.6.66";',
              'root ATLAS_BUILD')
          write(root_app_path, root_app)

          # 2 — Strategy A OFF means absent from comparison, never divergence.
          adapter_path = root / 'js/tradus-shadow-adapter-406066.js'
          adapter = text(adapter_path)
          adapter = replace_one(adapter,
              'if (/NO TRADE|OFF|WAIT|INCONNU/.test(state)) return "WAIT";',
              'if (/^OFF$|ARR[ÊE]T[ÉE]?|INACTIF/.test(state)) return "OFF";\n    if (/NO TRADE|WAIT|INCONNU/.test(state)) return "WAIT";',
              'Strategy A OFF classifier')
          adapter = replace_one(adapter,
              'const bDirectional = bAction === "BUY" || bAction === "SELL";\n\n    if (aState === "STOP" && bDirectional) {',
              'const bDirectional = bAction === "BUY" || bAction === "SELL";\n\n    if (aState === "OFF") {\n      return { state:"NON COMPARABLE", text:`A OFF · TRADUS ${bAction === "NO_TRADE" ? "attend" : bAction}` };\n    }\n    if (aState === "STOP" && bDirectional) {',
              'Strategy A OFF comparison')
          adapter = replace_one(adapter,
              'const stopBuy=compare({decision:"STOP"},buy);\n    const waitBuy=compare({decision:"NO TRADE"},buy);',
              'const offBuy=compare({decision:"OFF"},buy);\n    const stopBuy=compare({decision:"STOP"},buy);\n    const waitBuy=compare({decision:"NO TRADE"},buy);',
              'OFF self-test fixture')
          adapter = replace_one(adapter,
              '&&stopBuy.state==="OPPOSITION SÉCURITÉ"&&waitBuy.state==="DIVERGENCE"&&paperBuy.state==="CONVERGENCE POTENTIELLE";',
              '&&offBuy.state==="NON COMPARABLE"&&stopBuy.state==="OPPOSITION SÉCURITÉ"&&waitBuy.state==="DIVERGENCE"&&paperBuy.state==="CONVERGENCE POTENTIELLE";',
              'OFF self-test assertion')
          adapter = replace_one(adapter,
              'stale:stale.reason,stop_buy:stopBuy.state,wait_buy:waitBuy.state,paper_buy:paperBuy.state',
              'stale:stale.reason,off_buy:offBuy.state,stop_buy:stopBuy.state,wait_buy:waitBuy.state,paper_buy:paperBuy.state',
              'OFF self-test receipt')
          write(adapter_path, adapter)

          contract_path = root / 'data/tradus-shadow-contract.json'
          contract = json.loads(text(contract_path))
          truth = contract.setdefault('comparison_truth', {})
          truth['OFF_plus_directional_tradus'] = 'NON COMPARABLE'
          truth['OFF_plus_no_trade_tradus'] = 'NON COMPARABLE'
          write(contract_path, json.dumps(contract, ensure_ascii=False, indent=2) + '\n')

          # R1 note: same functional build, bounded truth/archive correction only.
          r1_path = root / 'RELEASE_40_6_66_R1.md'
          write(r1_path, '''# Agent-Crypto Administrator — 40.6.66 R1

## TRUTH + ARCHIVE + OFF SEMANTICS

Functional build remains **40.6.66**. Parent remains **40.6.65**.  
Market Core **38.15.11** remains protected.

R1 changes only:

- Strategy A `OFF` + TRADUS directional or waiting signal => `NON COMPARABLE`;
- first-paint badge / aria / footer and cache truth aligned on 40.6.66;
- root `ATLAS_BUILD` runtime identity aligned on 40.6.66;
- dead manifest references `RELEASE_40_6_58.md` and `RELEASE_40_6_59.md` removed;
- manifest SHA-256 authority normalized against files actually present;
- currently loaded local JS/CSS included in manifest hash authority.

No Aether redesign. No Strategy A threshold change. No Market Core change.  
No API key, wallet or real order. TRADUS remains SHADOW ONLY.
''')

          # 3 — Manifest/archive truth. Preserve existing scope, remove only the two known dead releases,
          # normalize every hash to a plain SHA-256 string, then cover every loaded local JS/CSS.
          files = dict(manifest.get('files') or {})
          for dead in ('RELEASE_40_6_58.md', 'RELEASE_40_6_59.md'):
              files.pop(dead, None)

          for rel in list(files):
              p = root / rel
              if not p.is_file():
                  raise SystemExit(f'manifest target unexpectedly missing after known-debt cleanup: {rel}')
              files[rel] = sha256(p)

          loaded = set()
          for match in re.finditer(r'(?:src|href)="\./([^"?]+\.(?:js|css))(?:\?[^\"]*)?"', index):
              rel = match.group(1)
              p = root / rel
              if not p.is_file():
                  raise SystemExit(f'loaded local JS/CSS missing: {rel}')
              loaded.add(rel)
              files[rel] = sha256(p)

          release_scope = [
              'RELEASE_40_6_66.md',
              'RELEASE_40_6_66_R1.md',
              'data/tradus-shadow-contract.json',
              'data/tradus-shadow-ledger-contract.json',
              'js/tradus-shadow-adapter-406066.js',
              'js/tradus-shadow-ledger-406066.js',
          ]
          vendor = root / 'vendor/tradus-v1.0-r1'
          if vendor.is_dir():
              for p in vendor.rglob('*'):
                  if p.is_file() and '__pycache__' not in p.parts and '.pytest_cache' not in p.parts and p.suffix != '.pyc':
                      release_scope.append(p.relative_to(root).as_posix())

          for rel in release_scope:
              p = root / rel
              if not p.is_file():
                  raise SystemExit(f'R1 release scope missing: {rel}')
              files[rel] = sha256(p)

          manifest['files'] = files
          manifest['r1'] = {
              'label': '40.6.66 R1',
              'functional_build_unchanged': True,
              'strategy_a_off_comparison': 'NON COMPARABLE',
              'root_runtime_build_truth_repaired': True,
              'first_paint_truth_repaired': True,
              'dead_release_refs_removed': ['RELEASE_40_6_58.md', 'RELEASE_40_6_59.md'],
              'loaded_hash_authority_count': len(loaded),
              'market_core_modified': False,
              'aether_modified': False,
              'real_order': False,
          }
          write(manifest_path, json.dumps(manifest, ensure_ascii=False, indent=2) + '\n')

          # Local R1 invariants before the canonical repository guard.
          assert 'Build 40.6.64, mode Administrator' not in index
          assert '<span id="atlasVersionTruthText">Build 40.6.64</span>' not in index
          assert './app.js?v=administrator-build-40.6.64' not in index
          assert './js/version-truth.js?v=40.6.8' not in index
          assert 'const ATLAS_BUILD = "40.6.66";' in root_app
          assert 'return "OFF";' in adapter and 'state:"NON COMPARABLE"' in adapter
          assert all(isinstance(v, str) and re.fullmatch(r'[0-9a-f]{64}', v) for v in manifest['files'].values())
          assert 'RELEASE_40_6_58.md' not in manifest['files'] and 'RELEASE_40_6_59.md' not in manifest['files']
          assert loaded.issubset(set(manifest['files']))
          print(f'R1 prepared: {len(files)} manifest payloads; {len(loaded)} loaded JS/CSS covered')
          PY

      - name: JavaScript syntax after R1
        run: |
          node --check public/agent_crypto_erith_ia/administrator/app.js
          node --check public/agent_crypto_erith_ia/administrator/js/tradus-shadow-adapter-406066.js

      - name: Canonical version truth must pass before commit
        run: python .github/scripts/agent_crypto_version_truth_guard_compat.py

      - name: Commit bounded R1 and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/agent-crypto-406066-r1-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(agent-crypto): 40.6.66 R1 truth archive and OFF semantics"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
