name: Agent-Crypto 40.6.76 Aether Native Position Release

on:
  push:
    paths:
      - '.github/workflows/agent-crypto-406076-release.yml'

permissions:
  contents: write

env:
  ADMIN: public/agent_crypto_erith_ia/administrator

jobs:
  release:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Synchronize main before surgery
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Build canonical 40.6.76
        shell: python
        run: |
          from pathlib import Path
          import base64, json
          from datetime import datetime, timezone

          root = Path('public/agent_crypto_erith_ia/administrator')
          app = root / 'js/app.js'
          frame = root / 'js/aether-frame-406076.js'
          role = root / 'js/aether-role-visibility-406050.js'
          index = root / 'index.html'
          build_json = root / 'build.json'
          release = root / 'RELEASE_40_6_76.md'

          frame_b64 = ''
          release_b64 = ''

          text = app.read_text(encoding='utf-8')
          old = '''        preferredFloatGeometry: () => {\n          const vw = Math.max(document.documentElement.clientWidth, window.innerWidth || 0);\n          const vh = Math.max(document.documentElement.clientHeight, window.innerHeight || 0);\n          const width = Math.max(720, Math.min(1450, vw - 32, (vh * 1.7777777778) - 352));\n          const height = Math.max(405, Math.min(vh - 24, width * 9 / 16));\n          const fittedWidth = Math.min(width, height * 16 / 9);\n          const fittedHeight = fittedWidth * 9 / 16;\n          return {\n            x: Math.max(12, Math.round((vw - fittedWidth) / 2)),\n            y: Math.max(12, Math.round((vh * .5 + 99) - fittedHeight / 2)),\n            width: Math.round(fittedWidth),\n            height: Math.round(fittedHeight)\n          };\n        },'''
          new = '''        preferredFloatGeometry: () => {\n          const vw = Math.max(document.documentElement.clientWidth, window.innerWidth || 0);\n          const vh = Math.max(document.documentElement.clientHeight, window.innerHeight || 0);\n          const width = Math.max(720, Math.min(1450, vw - 32, (vh * 1.7777777778) - 352));\n          const height = Math.max(405, Math.min(vh - 24, width * 9 / 16));\n          const fittedWidth = Math.min(width, height * 16 / 9);\n          const fittedHeight = fittedWidth * 9 / 16;\n          const fallback = {\n            x: 12,\n            y: Math.max(12, Math.round((vh * .5 + 99) - fittedHeight / 2)),\n            width: Math.round(fittedWidth),\n            height: Math.round(fittedHeight)\n          };\n          try {\n            const raw = JSON.parse(localStorage.getItem(`${STORAGE_PREFIX}:window:aether-watch`) || 'null');\n            const saved = raw && typeof raw === 'object' ? {\n              x: Number(raw.x), y: Number(raw.y), width: Number(raw.width), height: Number(raw.height)\n            } : null;\n            if (saved && [saved.x, saved.y, saved.width, saved.height].every(Number.isFinite)) {\n              const centeredX = Math.max(12, Math.round((vw - saved.width) / 2));\n              const legacyAutoCenter = saved.x > 26 && Math.abs(saved.x - centeredX) <= 14;\n              return {\n                x: legacyAutoCenter ? 12 : saved.x,\n                y: saved.y,\n                width: saved.width,\n                height: saved.height\n              };\n            }\n          } catch (_) {}\n          return fallback;\n        },'''
          if text.count(old) != 1:
            raise SystemExit(f'Aether preferredFloatGeometry owner mismatch: {text.count(old)}')
          app.write_text(text.replace(old, new, 1), encoding='utf-8')
          frame.write_bytes(base64.b64decode(frame_b64))

          js = role.read_text(encoding='utf-8')
          replacements = [
            ('40.6.50 + Build 40.6.75 canonical Aether integration', '40.6.50 + Build 40.6.76 canonical Aether integration'),
            ('BUILD 40.6.75 — AETHER V2 ICON-SAFE CANONICAL INTEGRATION', 'BUILD 40.6.76 — AETHER V2 NATIVE POSITION LOCK'),
            ('const BUILD = "40.6.75";', 'const BUILD = "40.6.76";'),
            ('const REVISION = "V10";', 'const REVISION = "V11";'),
            ('const RELEASE = "AETHER V2 · ICON-SAFE LANES / TYPOGRAPHIC ALIGNMENT";', 'const RELEASE = "AETHER V2 · NATIVE POSITION LOCK";'),
            ('const SCRIPT_ID = "aetherFrame406075Canonical";', 'const SCRIPT_ID = "aetherFrame406076Canonical";'),
            ('const SCRIPT_SRC = "./js/aether-frame-406075.js?v=administrator-build-40.6.75";', 'const SCRIPT_SRC = "./js/aether-frame-406076.js?v=administrator-build-40.6.76";'),
            ('setMeta("administrator-revision", "V10");', 'setMeta("administrator-revision", "V11");'),
            ('setMeta("atlas-asset-token", "market-core-v2.0-alpha-build-40.6.75");', 'setMeta("atlas-asset-token", "market-core-v2.0-alpha-build-40.6.76");'),
            ('document.documentElement.dataset.aetherV2406074 = "canonical-40.6.75";', 'document.documentElement.dataset.aetherV2406074 = "canonical-40.6.76";'),
            ('link.dataset.aether406074 = "canonical-40.6.75";', 'link.dataset.aether406074 = "visual-lock-40.6.75";'),
            ('script.dataset.aether406074 = "canonical-40.6.75";', 'script.dataset.aether406074 = "native-position-40.6.76";'),
            ('document.documentElement.dataset.aetherFrameLoader406074 = "ready-r1";', 'document.documentElement.dataset.aetherFrameLoader406074 = "ready-40.6.76";'),
          ]
          for old, new in replacements:
            if js.count(old) != 1:
              raise SystemExit(f'role token mismatch: {old}')
            js = js.replace(old, new, 1)
          js = js.replace('   - publishes the 40.6.74 version truth in the running Administrator shell;\n   - loads one final Aether V2 stylesheet with the R1 optical fix;\n   - loads one canonical Window-Manager bridge with first-paint preframing;',
                          '   - publishes the 40.6.76 version truth in the running Administrator shell;\n   - reuses the field-validated 40.6.75 Aether V2 visual stylesheet unchanged;\n   - loads one migration bridge that retires forced centering and returns position ownership to the Window Manager;')
          role.write_text(js, encoding='utf-8')

          html = index.read_text(encoding='utf-8')
          html_replacements = [
            ('<meta name="atlas-build" content="40.6.75" />', '<meta name="atlas-build" content="40.6.76" />'),
            ('<meta name="administrator-build" content="40.6.75" />', '<meta name="administrator-build" content="40.6.76" />'),
            ('<meta name="administrator-revision" content="V10" />', '<meta name="administrator-revision" content="V11" />'),
            ('<meta name="administrator-release" content="AETHER V2 · ICON-SAFE LANES / TYPOGRAPHIC ALIGNMENT" />', '<meta name="administrator-release" content="AETHER V2 · NATIVE POSITION LOCK" />'),
            ('<meta name="atlas-asset-token" content="market-core-v2.0-alpha-build-40.6.75" />', '<meta name="atlas-asset-token" content="market-core-v2.0-alpha-build-40.6.76" />'),
            ('<title>Agent-Crypto @erith.IA — Build 40.6.75 · Administrator</title>', '<title>Agent-Crypto @erith.IA — Build 40.6.76 · Administrator</title>'),
            ('./js/aether-role-visibility-406050.js?v=administrator-build-40.6.75', './js/aether-role-visibility-406050.js?v=administrator-build-40.6.76'),
          ]
          for old, new in html_replacements:
            if html.count(old) != 1:
              raise SystemExit(f'index token mismatch: {old}')
            html = html.replace(old, new, 1)
          index.write_text(html, encoding='utf-8')

          data = json.loads(build_json.read_text(encoding='utf-8'))
          if data.get('build') != '40.6.75':
            raise SystemExit(f'build.json parent mismatch: {data.get("build")}')
          data.update({
            'build': '40.6.76',
            'engine': '38.15.11',
            'release': 'AETHER V2 · NATIVE POSITION LOCK',
            'published': True,
            'status': 'aether_v2_native_position_lock_406076',
            'parent_build': '40.6.75',
            'asset_token': 'market-core-v2.0-alpha-build-40.6.76',
            'administrator_build': '40.6.76',
            'build_label': 'Build 40.6.76 · Administrator',
            'release_status': 'aether_v2_native_position_lock',
            'timestamp': datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z'),
          })
          data.setdefault('current_version_truth', {})['loaded_build'] = '40.6.76'
          data['cascade_40_6_76'] = {
            'parent_build': '40.6.75',
            'release': 'AETHER V2 · NATIVE POSITION LOCK',
            'status': 'aether_v2_native_position_lock_406076',
            'visual_owner': 'aether-v2-406075.css',
            'visual_owner_modified': False,
            'position_owner': 'canonical Administrator Window Manager',
            'first_open_geometry_owner': 'js/app.js preferredFloatGeometry',
            'legacy_auto_center_migration_only': True,
            'operator_position_persistence_reused': True,
            'maximize_contract_preserved': True,
            'market_core': '38.15.11',
            'market_core_modified': False,
            'graph_modified': False,
            'technical_reading_modified': False,
            'operator_runtime_modified': False,
            'new_recurring_timer': False,
            'new_observer': False,
            'new_network_owner': False,
            'new_storage_owner': False,
            'automatic_order': False,
            'real_order': False
          }
          build_json.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          release.write_bytes(base64.b64decode(release_b64))

          app_body = app.read_text(encoding='utf-8')
          frame_body = frame.read_text(encoding='utf-8')
          role_body = role.read_text(encoding='utf-8')
          index_body = index.read_text(encoding='utf-8')
          manifest = json.loads(build_json.read_text(encoding='utf-8'))
          assert 'x: 12,' in app_body
          assert 'legacyAutoCenter ? 12 : saved.x' in app_body
          assert 'Math.round((vw - fittedWidth) / 2)' not in app_body
          assert 'window.addEventListener("resize"' not in frame_body
          assert 'window.addEventListener("pageshow"' not in frame_body
          assert 'new MutationObserver' not in frame_body
          assert 'setInterval' not in frame_body
          assert 'setTimeout' not in frame_body
          assert 'aether-frame-406076.js?v=administrator-build-40.6.76' in role_body
          assert 'aether-v2-406075.css?v=administrator-build-40.6.75' in role_body
          assert 'Build 40.6.76 · Administrator' in index_body
          assert manifest['build'] == '40.6.76'
          assert manifest['engine'] == '38.15.11'
          print('40.6.76 assertions: PASS')

      - name: Build exact release ZIP
        shell: python
        run: |
          from pathlib import Path
          import hashlib, json, zipfile
          base = Path('public/agent_crypto_erith_ia/administrator')
          paths = [base/'index.html', base/'build.json', base/'aether-v2-406075.css', base/'js/app.js', base/'js/aether-frame-406076.js', base/'js/aether-role-visibility-406050.js', base/'RELEASE_40_6_76.md']
          manifest = {'package':'AGENT_CRYPTO_BUILD_40_6_76_AETHER_NATIVE_POSITION_LOCK','build':'40.6.76','engine':'38.15.11','files':[]}
          for p in paths:
            raw = p.read_bytes()
            manifest['files'].append({'path':p.as_posix(),'bytes':len(raw),'sha256':hashlib.sha256(raw).hexdigest()})
          Path('PATCH_MANIFEST_40_6_76.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2)+'\n', encoding='utf-8')
          out = Path('AGENT_CRYPTO_BUILD_40_6_76_AETHER_NATIVE_POSITION_LOCK.zip')
          with zipfile.ZipFile(out,'w',zipfile.ZIP_DEFLATED) as z:
            for p in paths: z.write(p,p.as_posix())
            z.write('PATCH_MANIFEST_40_6_76.json','PATCH_MANIFEST.json')
          sha = hashlib.sha256(out.read_bytes()).hexdigest()
          Path('AGENT_CRYPTO_BUILD_40_6_76_AETHER_NATIVE_POSITION_LOCK.sha256').write_text(f'{sha}  {out.name}\n', encoding='utf-8')
          print(out.name, out.stat().st_size, sha)

      - name: Commit one canonical runtime build
        run: |
          git rm .github/workflows/agent-crypto-406076-release.yml
          git config user.name "BlueAzur-Hub"
          git config user.email "Blue.Azur@protonmail.com"
          git add "$ADMIN/index.html" "$ADMIN/build.json" "$ADMIN/js/app.js" "$ADMIN/js/aether-frame-406076.js" "$ADMIN/js/aether-role-visibility-406050.js" "$ADMIN/RELEASE_40_6_76.md"
          git diff --cached --check
          git commit -m "release(agent-crypto): promote Administrator 40.6.76 Aether native position lock"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

      - name: Upload exact 40.6.76 ZIP
        uses: actions/upload-artifact@v4
        with:
          name: AGENT_CRYPTO_BUILD_40_6_76_AETHER_NATIVE_POSITION_LOCK
          path: |
            AGENT_CRYPTO_BUILD_40_6_76_AETHER_NATIVE_POSITION_LOCK.zip
            AGENT_CRYPTO_BUILD_40_6_76_AETHER_NATIVE_POSITION_LOCK.sha256
          if-no-files-found: error
          retention-days: 30
