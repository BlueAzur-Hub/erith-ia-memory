name: Agent-Crypto Aether 40.4.127 one-shot publication

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/agent_crypto_aether_40_4_127_oneshot.yml"

permissions:
  contents: write

concurrency:
  group: agent-crypto-aether-40-4-127-publication
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply 40.4.127 unique News queue recovery
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, hashlib, re

          root = Path("public/agent_crypto_erith_ia/administrator")
          old = "40.4.126"
          new = "40.4.127"

          def read(rel): return (root / rel).read_text(encoding="utf-8")
          def write(rel, text): (root / rel).write_text(text, encoding="utf-8")
          def sha(rel): return hashlib.sha256((root / rel).read_bytes()).hexdigest()
          def replace_once(text, before, after, label):
              count = text.count(before)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, got {count}")
              return text.replace(before, after, 1)

          app = read("app.js")
          if f'const ATLAS_BUILD = "{old}";' not in app:
              raise SystemExit("40.4.127 guard refused: current app.js is not 40.4.126")

          aether = read("js/aether.js")
          aether = replace_once(
              aether,
              "  Build: 40.4.126\n  Revision: 40.4.126 Aether News flow recovery. The scarce FEED phase is NEWS-only: five ranked French News Sentinel stories rotate consecutively with no CONTEXTE interleave. Full-story readability is prioritized by scrolling headline + source only; 40.4.121 constant-read-speed marquee is preserved.",
              "  Build: 40.4.127\n  Revision: 40.4.127 unique News queue recovery. Aether builds its five-story queue from both loaded News Sentinel event pools, ranks first, then canonical-deduplicates by event identity, merged identity, source URL and displayed French headline before taking the first five unique stories. The INFO phase no longer carries a redundant compact News tail.",
              "aether header"
          )

          queue_re = re.compile(r'  function aetherVeilleEvents4087\(\)\{.*?\n  \}\n  function aetherVeilleScope4087', re.S)
          queue_lines = [
              '  function aetherVeilleStoryTokens40127(event){',
              '    const canonical=aetherNewsCanonicalFrenchEvent40110(event)||event||{};',
              '    const tokens=[];',
              '    const push=(prefix,value)=>{const v=String(value||"").replace(/\\s+/g," ").trim().toLowerCase();if(v)tokens.push(`${prefix}:${v}`);};',
              '    push("id",canonical?.event_id||canonical?.id||canonical?.fingerprint);',
              '    for(const id of (Array.isArray(canonical?.merged_event_ids)?canonical.merged_event_ids:[]))push("id",id);',
              '    push("url",canonical?.source_url);',
              '    push("fr",aetherNewsHeadlineFr40104(canonical,""));',
              '    push("raw",canonical?.headline||canonical?.event_label);',
              '    return [...new Set(tokens)];',
              '  }',
              '  function aetherVeilleEvents4087(){',
              '    const events=[];',
              '    const addPool=pool=>{if(!Array.isArray(pool))return;for(const event of pool)if(event)events.push(event);};',
              '    try{',
              '      if(typeof newsFeedState!=="undefined"){',
              '        addPool(newsFeedState?.events);',
              '        addPool(newsFeedState?.payload?.events);',
              '      }',
              '    }catch(_){}',
              '    const ranked=events.map((event,order)=>({event,order,rank:aetherVeilleRank4087(event),time:aetherVeilleTimestamp4087(event)}))',
              '      .sort((a,b)=>b.rank-a.rank||b.time-a.time||a.order-b.order);',
              '    const unique=[];',
              '    const seen=new Set();',
              '    for(const row of ranked){',
              '      const tokens=aetherVeilleStoryTokens40127(row.event);',
              '      if(tokens.length&&tokens.some(token=>seen.has(token)))continue;',
              '      tokens.forEach(token=>seen.add(token));',
              '      unique.push(row.event);',
              '      if(unique.length>=AETHER_VEILLE_TOP_4087)break;',
              '    }',
              '    return unique;',
              '  }',
              '  function aetherVeilleScope4087'
          ]
          aether, n = queue_re.subn("\n".join(queue_lines), aether, count=1)
          if n != 1:
              raise SystemExit(f"unique News queue: expected one match, got {n}")

          aether = replace_once(
              aether,
              'put("atlasAetherRibbonMarket4088",`Marché · ${s.market}`);put("atlasAetherRibbonAtlas4084",s.analysis);put("atlasAetherRibbonOracle4084",s.signal);put("atlasAetherRibbonSources4084",`Sources · ${s.sources}`);put("atlasAetherRibbonBook4084",s.veilleBrief);',
              'put("atlasAetherRibbonMarket4088",`Marché · ${s.market}`);put("atlasAetherRibbonAtlas4084",s.analysis);put("atlasAetherRibbonOracle4084",s.signal);put("atlasAetherRibbonSources4084",`Sources · ${s.sources}`);put("atlasAetherRibbonBook4084","");',
              "INFO redundant News tail"
          )
          aether = replace_once(aether, '    build:"40.4.126",', '    build:"40.4.127",', "Aether API build")
          aether = replace_once(
              aether,
              '    news_feed_ranked_story_count:5,\n    news_feed_story_detail:"headline + source",',
              '    news_feed_ranked_story_count:5,\n    news_feed_pool_union:"newsFeedState.events + newsFeedState.payload.events",\n    news_feed_unique_before_limit:true,\n    news_feed_unique_tokens:"canonical id + merged ids + source URL + French headline + raw headline",\n    news_feed_truthful_total:true,\n    news_feed_story_detail:"headline + source",',
              "News uniqueness flags"
          )
          if '    veille_alert_context_pairing:true,' in aether:
              aether = aether.replace('    veille_alert_context_pairing:true,','    veille_alert_context_pairing:false,',1)
          write("js/aether.js", aether)

          ribbons = read("admin-ribbons.css")
          marker = "/* 40.4.127 — AETHER INFO RIGHT-EDGE CLEANUP · NEWS LIVES IN FEED */"
          if marker in ribbons:
              raise SystemExit("40.4.127 CSS marker already present")
          css_patch = "\n".join([
              "",
              marker,
              "/* The compact News tail was redundant with the dedicated VEILLE phase and could be clipped at the right edge. */",
              "@media (min-width:901px){",
              "  body #atlasAetherRibbonBook4084{display:none!important}",
              "  body #atlasAetherRibbon4084 .atlas-aether-ribbon-track-4085{padding-right:2px!important}",
              "}",
              ""
          ])
          write("admin-ribbons.css", ribbons + css_patch)

          index = read("index.html")
          if index.count(old) != 13:
              raise SystemExit(f"index build-token guard refused: expected 13, got {index.count(old)}")
          write("index.html", index.replace(old,new))
          write("app.js", replace_once(app, f'const ATLAS_BUILD = "{old}";', f'const ATLAS_BUILD = "{new}";', "ATLAS_BUILD"))
          jsapp = read("js/app.js")
          write("js/app.js", replace_once(jsapp, f'const ADMIN_BUILD = "{old}";', f'const ADMIN_BUILD = "{new}";', "ADMIN_BUILD"))

          changed_hashes={rel:sha(rel) for rel in ["index.html","app.js","admin-ribbons.css","js/app.js","js/aether.js"]}
          release="AETHER UNIQUE NEWS QUEUE · CANONICAL DEDUP · RIGHT EDGE CLEANUP LOCK"
          status="candidate_aether_unique_news_queue_operator_validation_required"
          lineage_add=" → 40.4.127 Aether unique News queue: union of loaded News Sentinel pools, rank-first canonical dedup before Top 5, truthful queue total, redundant INFO News tail removed."
          note="40.4.127 — fixes the observed 40.4.126 repeated-story loop. Aether now considers both already-loaded News Sentinel event pools, sorts by existing priority, canonical-deduplicates before the five-story limit, and exposes the real unique queue length. The clipped INFO-row News tail is removed because VEILLE owns News display."
          release_note="40.4.127: Aether presentation/read-only queue correction only; no new fetch, collector, translator, timer, Market Core, Oracle engine, Graph, Bridge or Window Manager change."
          reason="Observed operator evidence showed five queue slots but repeated canonical News stories. Root cause was slice-before-dedup on newsFeedState.events only. 40.4.127 unions the two already-loaded event pools and deduplicates canonical story identities before limiting to five."

          def update_manifest(rel):
              p=root/rel
              d=json.loads(p.read_text(encoding="utf-8"))
              if d.get("build")!=old: raise SystemExit(f"{rel}: expected build {old}, got {d.get('build')}")
              d["build"]=new; d["release"]=release; d["status"]=status
              d["prepared_at"]="2026-08-31T08:02:00Z"; d["published_at"]=None
              d["global_versioning"]=new; d["asset_token"]=f"market-core-v2.0-alpha-build-{new}"; d["parent_build"]=old
              if isinstance(d.get("lineage"),str) and "40.4.127 Aether unique News queue" not in d["lineage"]: d["lineage"]+=lineage_add
              pub=d.setdefault("integrity",{}).setdefault("publication_identity",{})
              pub["build"]=new; pub["asset_token"]=f"market-core-v2.0-alpha-build-{new}"
              if "app_sha256" in pub: pub["app_sha256"]=changed_hashes["app.js"]
              if note not in d.setdefault("notes",[]): d["notes"].append(note)
              if release_note not in d.setdefault("release_notes",[]): d["release_notes"].append(release_note)
              d["publication_revision"]=new; d["publication_revision_reason"]=reason
              d.setdefault("files",{}).update(changed_hashes)
              p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")

          update_manifest("version.json")
          update_manifest("administrator-version.json")
          admin_sha=sha("administrator-version.json")
          vp=root/"version.json"; vd=json.loads(vp.read_text(encoding="utf-8"))
          vpub=vd.setdefault("integrity",{}).setdefault("publication_identity",{})
          if "administrator_version_sha256" in vpub: vpub["administrator_version_sha256"]=admin_sha
          vp.write_text(json.dumps(vd,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")

          for rel in ["version.json","administrator-version.json"]:
              d=json.loads((root/rel).read_text(encoding="utf-8"))
              assert d["build"]==new and d["parent_build"]==old and d["publication_revision"]==new
              for payload in ["index.html","app.js","js/app.js","js/aether.js","admin-ribbons.css"]:
                  if d["files"][payload] != sha(payload): raise SystemExit(f"{rel}: hash mismatch {payload}")

          final=read("js/aether.js")
          assert "function aetherVeilleStoryTokens40127" in final
          assert "addPool(newsFeedState?.payload?.events);" in final
          assert "news_feed_unique_before_limit:true" in final
          assert 'put("atlasAetherRibbonBook4084","")' in final
          print("40.4.127 PATCH PASS")
          PY

      - name: Static JavaScript validation
        run: |
          node --check public/agent_crypto_erith_ia/administrator/js/aether.js
          node --check public/agent_crypto_erith_ia/administrator/app.js
          node --check public/agent_crypto_erith_ia/administrator/js/app.js

      - name: Commit publication and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/agent_crypto_aether_40_4_127_oneshot.yml
          git add public/agent_crypto_erith_ia/administrator/index.html \
                  public/agent_crypto_erith_ia/administrator/app.js \
                  public/agent_crypto_erith_ia/administrator/admin-ribbons.css \
                  public/agent_crypto_erith_ia/administrator/js/aether.js \
                  public/agent_crypto_erith_ia/administrator/js/app.js \
                  public/agent_crypto_erith_ia/administrator/version.json \
                  public/agent_crypto_erith_ia/administrator/administrator-version.json
          git commit -m "feat Agent-Crypto 40.4.127 deduplicate Aether News before Top 5"
          git pull --rebase origin main
          git push origin HEAD:main
