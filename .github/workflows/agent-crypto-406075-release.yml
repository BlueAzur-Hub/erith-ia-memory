name: Agent-Crypto 40.6.75 Aether Icon-Safe Release

on:
  push:
    paths:
      - '.github/workflows/agent-crypto-406075-release.yml'

permissions:
  contents: write

env:
  ADMIN: public/agent_crypto_erith_ia/administrator

jobs:
  release:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Synchronize main before surgery
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Build canonical 40.6.75
        shell: python
        run: |
          from pathlib import Path
          import shutil

          root = Path("public/agent_crypto_erith_ia/administrator")
          css74 = root / "aether-v2-406074.css"
          css75 = root / "aether-v2-406075.css"
          role = root / "js/aether-role-visibility-406050.js"
          frame74 = root / "js/aether-frame-406074.js"
          frame75 = root / "js/aether-frame-406075.js"
          index = root / "index.html"
          release = root / "RELEASE_40_6_75.md"

          # ---- Aether presentation: standalone 40.6.75 owner, not an override tail. ----
          css = css74.read_text(encoding="utf-8")
          r1_marker = "/* ==========================================================================\n   40.6.74 R1 — OPTICAL TEXT ALIGNMENT / C5 LESSON RESTORED"
          if r1_marker in css:
              css = css.split(r1_marker, 1)[0].rstrip() + "\n"

          css = css.replace("/* Agent-Crypto @erith.IA — Build 40.6.74", "/* Agent-Crypto @erith.IA — Build 40.6.75", 1)
          css = css.replace("4. WORKBENCH — canonical 40.6.74 identity.", "4. WORKBENCH — canonical 40.6.75 identity.")
          css = css.replace('content:"AETHER WORKBENCH · 40.6.74";', 'content:"AETHER WORKBENCH · 40.6.75";')

          # Measured icon-safe lanes from the V2 1672×941 artwork. The icon belongs
          # to the PNG; live DOM begins only after that reserved lane.
          replacements = {
              "padding:1.22% 1.05% 1.00% 5.15% !important;": "padding:1.05% .72% .92% 6.70% !important;",
              "padding:1.22% 1.00% 1.04% 5.00% !important;": "padding:1.06% .68% .94% 6.70% !important;",
              "padding:1.28% 1.00% 1.02% 5.05% !important;": "padding:1.05% .68% .92% 6.75% !important;",
              "padding:1.16% 1.12% .98% 5.80% !important;": "padding:1.02% .76% .90% 7.45% !important;",
              "padding:1.18% 1.05% .98% 5.20% !important;": "padding:1.04% .70% .90% 6.90% !important;",
              "padding:1.18% 1.00% 1.02% 5.05% !important;": "padding:1.05% .66% .92% 6.85% !important;",
              "padding:1.05% 1.00% .92% 5.30% !important;": "padding:.92% .66% .82% 7.15% !important;",
              "padding:1.05% 1.00% .92% 5.20% !important;": "padding:.92% .66% .82% 7.05% !important;",
          }
          for old, new in replacements.items():
              if old not in css:
                  raise SystemExit(f"40.6.75 CSS source token missing: {old}")
              css = css.replace(old, new)

          card_anchor = '''html[data-aether-backplate-v2-406074="ready"] .aether46-card {\n  min-width:0 !important;\n  min-height:0 !important;\n  overflow:hidden !important;\n}\n'''
          card_owner = '''html[data-aether-backplate-v2-406074="ready"] .aether46-card {\n  min-width:0 !important;\n  min-height:0 !important;\n  overflow:hidden !important;\n  box-sizing:border-box !important;\n}\n\n/* 40.6.75 — ICON-SAFE LIVE TYPOGRAPHY\n   The V2 PNG owns every luminous icon. Live facts start in a measured clear lane\n   to the right of that icon; no text is allowed to paint across the emblem. */\nhtml[data-aether-backplate-v2-406074="ready"] .aether46-card[data-aether-card-406046="system"],\nhtml[data-aether-backplate-v2-406074="ready"] .aether46-card[data-aether-card-406046="sources"],\nhtml[data-aether-backplate-v2-406074="ready"] .aether46-card[data-aether-card-406046="atlas"],\nhtml[data-aether-backplate-v2-406074="ready"] .aether46-card[data-aether-card-406046="convergence"],\nhtml[data-aether-backplate-v2-406074="ready"] .aether46-card[data-aether-card-406046="divergence"],\nhtml[data-aether-backplate-v2-406074="ready"] .aether46-card[data-aether-card-406046="oracle"],\nhtml[data-aether-backplate-v2-406074="ready"] .aether46-card[data-aether-card-406046="weather"] {\n  display:flex !important;\n  flex-direction:column !important;\n  justify-content:center !important;\n}\n'''
          if card_anchor not in css:
              raise SystemExit("40.6.75 generic card owner anchor missing")
          css = css.replace(card_anchor, card_owner, 1)

          # Integrate the useful R1 breathing directly into the owner instead of
          # retaining an active R1 patch block.
          spacing = {
              "gap:clamp(4px,.36cqw,7px) !important;\n  margin:0 0 clamp(5px,.46cqw,8px) !important;": "gap:clamp(4px,.34cqw,7px) !important;\n  margin:0 0 clamp(4px,.36cqw,7px) !important;",
              "margin-top:clamp(4px,.38cqw,7px) !important;": "margin-top:clamp(3px,.34cqw,6px) !important;",
              "margin:.14cqw 0 0 !important;": "margin:.04cqw 0 .08cqw !important;",
              "margin:.06cqw 0 0 !important;": "margin:.04cqw 0 .05cqw !important;",
              "margin-top:.12cqw !important;": "margin-top:.02cqw !important;",
              "margin-top:.52cqw !important;": "margin-top:.44cqw !important;",
          }
          for old, new in spacing.items():
              if old not in css:
                  raise SystemExit(f"40.6.75 spacing token missing: {old}")
              css = css.replace(old, new)
          # convergence first; divergence paragraph second
          css = css.replace("margin-top:.08cqw !important;", "margin-top:.02cqw !important;", 1)
          css = css.replace("margin:.04cqw 0 0 !important;", "margin:.02cqw 0 0 !important;")
          css75.write_text(css, encoding="utf-8")

          # ---- Frame owner: same validated geometry contract, clean .75 identity. ----
          frame = frame74.read_text(encoding="utf-8")
          frame = frame.replace("Build 40.6.74 R1", "Build 40.6.75", 1)
          frame = frame.replace('const BUILD = "40.6.74 R1";', 'const BUILD = "40.6.75";', 1)
          frame75.write_text(frame, encoding="utf-8")

          # ---- Canonical loader/version truth. ----
          js = role.read_text(encoding="utf-8")
          required = [
              "40.6.50 + Build 40.6.74 R1 canonical Aether integration",
              "BUILD 40.6.74 R1 — AETHER V2 CANONICAL INTEGRATION",
              'const BUILD = "40.6.74";',
              'const REVISION = "R1";',
              'const RELEASE = "AETHER V2 · CANONICAL FRAME / READABILITY · R1";',
              './aether-v2-406074.css?v=administrator-build-40.6.74-r1',
              './js/aether-frame-406074.js?v=administrator-build-40.6.74-r1',
              'setMeta("administrator-revision", "V9");',
              'setMeta("atlas-asset-token", "market-core-v2.0-alpha-build-40.6.74");',
          ]
          for token in required:
              if token not in js:
                  raise SystemExit(f"40.6.75 loader source token missing: {token}")
          js = js.replace("40.6.50 + Build 40.6.74 R1 canonical Aether integration", "40.6.50 + Build 40.6.75 canonical Aether integration", 1)
          js = js.replace("BUILD 40.6.74 R1 — AETHER V2 CANONICAL INTEGRATION", "BUILD 40.6.75 — AETHER V2 ICON-SAFE CANONICAL INTEGRATION", 1)
          js = js.replace('const BUILD = "40.6.74";', 'const BUILD = "40.6.75";', 1)
          js = js.replace('const REVISION = "R1";', 'const REVISION = "V10";', 1)
          js = js.replace('const RELEASE = "AETHER V2 · CANONICAL FRAME / READABILITY · R1";', 'const RELEASE = "AETHER V2 · ICON-SAFE LANES / TYPOGRAPHIC ALIGNMENT";', 1)
          js = js.replace('const STYLE_ID = "aetherV2406074Canonical";', 'const STYLE_ID = "aetherV2406075Canonical";', 1)
          js = js.replace('const SCRIPT_ID = "aetherFrame406074Canonical";', 'const SCRIPT_ID = "aetherFrame406075Canonical";', 1)
          js = js.replace('./aether-v2-406074.css?v=administrator-build-40.6.74-r1', './aether-v2-406075.css?v=administrator-build-40.6.75')
          js = js.replace('./js/aether-frame-406074.js?v=administrator-build-40.6.74-r1', './js/aether-frame-406075.js?v=administrator-build-40.6.75')
          js = js.replace('setMeta("administrator-revision", "V9");', 'setMeta("administrator-revision", "V10");', 1)
          js = js.replace('setMeta("atlas-asset-token", "market-core-v2.0-alpha-build-40.6.74");', 'setMeta("atlas-asset-token", "market-core-v2.0-alpha-build-40.6.75");', 1)
          js = js.replace('canonical-r1', 'canonical-40.6.75')
          role.write_text(js, encoding="utf-8")

          # ---- Static entry point: the visible version must be truthful before JS. ----
          html = index.read_text(encoding="utf-8")
          html_replacements = [
              ('<meta name="atlas-build" content="40.6.74" />', '<meta name="atlas-build" content="40.6.75" />'),
              ('<meta name="administrator-build" content="40.6.74" />', '<meta name="administrator-build" content="40.6.75" />'),
              ('<meta name="administrator-revision" content="V9" />', '<meta name="administrator-revision" content="V10" />'),
              ('<meta name="administrator-release" content="AETHER V2 · CANONICAL FRAME / READABILITY · R1" />', '<meta name="administrator-release" content="AETHER V2 · ICON-SAFE LANES / TYPOGRAPHIC ALIGNMENT" />'),
              ('<meta name="atlas-asset-token" content="market-core-v2.0-alpha-build-40.6.74" />', '<meta name="atlas-asset-token" content="market-core-v2.0-alpha-build-40.6.75" />'),
              ('<title>Agent-Crypto @erith.IA — Build 40.6.74 · Administrator</title>', '<title>Agent-Crypto @erith.IA — Build 40.6.75 · Administrator</title>'),
              ('./js/aether-role-visibility-406050.js?v=administrator-build-40.6.74-r1', './js/aether-role-visibility-406050.js?v=administrator-build-40.6.75'),
          ]
          for old, new in html_replacements:
              count = html.count(old)
              if count != 1:
                  raise SystemExit(f"40.6.75 index token count {count}: {old}")
              html = html.replace(old, new, 1)
          index.write_text(html, encoding="utf-8")

          release.write_text('''# Agent-Crypto Administrator — 40.6.75\n\n## Aether Watch V2 — Icon-Safe Typography\n\nCanonical parent: **40.6.74**. Engine: **Market Core 38.15.11** unchanged.\n\n### Field defect corrected\n\nFirefox field captures showed that the 40.6.74 R1 live text lane still began inside the luminous icon footprint of the V2 backplate. The symptom affected System, Sources, Atlas, Convergence, Divergence, Events, Oracle and Weather; compact widths amplified the collision.\n\n40.6.75 fixes the owner geometry instead of shrinking typography or adding another override tail.\n\n### Canonical changes\n\n- standalone `aether-v2-406075.css`;\n- measured icon-safe left lanes for every V2 capsule;\n- R1 vertical breathing integrated directly into the canonical stylesheet;\n- Market and Recent Events keep dense top-flow; stable cards keep centered vertical breathing;\n- five Market assets remain visible; Sources and Oracle remain 2×2;\n- `aether-frame-406075.js` carries the already validated 40.6.74 window geometry contract unchanged;\n- static/runtime truth promoted to **Build 40.6.75 · Administrator / V10**;\n- no C/R candidate stylesheet is loaded by the 40.6.75 runtime.\n\n### Protected\n\n- Market Core **38.15.11** unchanged;\n- V2 PNG unchanged;\n- Administrator Window Manager core unchanged;\n- Graphique unchanged;\n- Lecture Technique unchanged;\n- Atlas / Oracle / Sources data owners unchanged;\n- active market fiche foreground R5 preserved;\n- no new timer;\n- no MutationObserver;\n- no storage owner;\n- no network owner;\n- no trading action;\n- Operator / Yohan runtime unchanged.\n\n### Acceptance\n\nAt normal Firefox and the wide Aether state, verify visually that every live title/value block starts to the right of its baked icon with a visible safety gap. No live text may cross the icon halo. Typography must remain readable rather than being reduced to solve the collision.\n''', encoding="utf-8")

          # ---- In-run release validation. ----
          checks = {
              css75: ["Build 40.6.75", "ICON-SAFE LIVE TYPOGRAPHY", "6.70%", "7.45%", "7.15%", "AETHER WORKBENCH · 40.6.75"],
              frame75: ['const BUILD = "40.6.75";', "largest complete 16:9 rectangle left of Lecture Technique"],
              role: ['const BUILD = "40.6.75";', 'const REVISION = "V10";', "aether-v2-406075.css", "aether-frame-406075.js"],
              index: ['content="40.6.75"', 'content="V10"', 'Build 40.6.75 · Administrator', 'administrator-build-40.6.75'],
              release: ["40.6.75", "Market Core 38.15.11", "Icon-Safe Typography"],
          }
          for path, tokens in checks.items():
              body = path.read_text(encoding="utf-8")
              for token in tokens:
                  if token not in body:
                      raise SystemExit(f"release validation failed: {path} missing {token}")
          if "40.6.74 R1 — OPTICAL TEXT ALIGNMENT" in css75.read_text(encoding="utf-8"):
              raise SystemExit("R1 override tail leaked into 40.6.75 canonical CSS")

          # Quantitative safety floor at the two observed stage widths.
          gutters = {"system":.0670,"sources":.0670,"atlas":.0675,"convergence":.0745,"divergence":.0690,"market":.0685,"events":.0690,"oracle":.0715,"weather":.0705}
          for stage_width in (936, 1246, 1450):
              px = {k: round(stage_width*v, 1) for k,v in gutters.items()}
              if min(px.values()) < (60 if stage_width == 936 else 75 if stage_width == 1246 else 90):
                  raise SystemExit(f"icon-safe gutter floor failed at {stage_width}: {px}")
              print(f"SAFE-LANES {stage_width}px", px)

      - name: Build exact release ZIP
        run: |
          rm -f AGENT_CRYPTO_BUILD_40_6_75_AETHER_ICON_SAFE_LAYOUT.zip
          zip -9 AGENT_CRYPTO_BUILD_40_6_75_AETHER_ICON_SAFE_LAYOUT.zip \
            "$ADMIN/index.html" \
            "$ADMIN/aether-v2-406075.css" \
            "$ADMIN/js/aether-frame-406075.js" \
            "$ADMIN/js/aether-role-visibility-406050.js" \
            "$ADMIN/RELEASE_40_6_75.md"
          sha256sum AGENT_CRYPTO_BUILD_40_6_75_AETHER_ICON_SAFE_LAYOUT.zip | tee AGENT_CRYPTO_BUILD_40_6_75_AETHER_ICON_SAFE_LAYOUT.sha256

      - name: Remove one-shot workflow and commit one canonical build
        run: |
          git rm .github/workflows/agent-crypto-406075-release.yml
          git config user.name "BlueAzur-Hub"
          git config user.email "Blue.Azur@protonmail.com"
          git add \
            "$ADMIN/index.html" \
            "$ADMIN/aether-v2-406075.css" \
            "$ADMIN/js/aether-frame-406075.js" \
            "$ADMIN/js/aether-role-visibility-406050.js" \
            "$ADMIN/RELEASE_40_6_75.md"
          git diff --cached --check
          git commit -m "release(agent-crypto): promote Administrator 40.6.75 Aether icon-safe layout"
          git push origin HEAD:main

      - name: Upload exact 40.6.75 ZIP
        uses: actions/upload-artifact@v4
        with:
          name: AGENT_CRYPTO_BUILD_40_6_75_AETHER_ICON_SAFE_LAYOUT
          path: |
            AGENT_CRYPTO_BUILD_40_6_75_AETHER_ICON_SAFE_LAYOUT.zip
            AGENT_CRYPTO_BUILD_40_6_75_AETHER_ICON_SAFE_LAYOUT.sha256
          if-no-files-found: error
          retention-days: 30
