name: Agent-Crypto Canonical Runtime Names

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/agent-crypto-canonical-runtime-names.yml'
      - '.github/scripts/agent_crypto_canonicalize_runtime_names.py'

permissions:
  contents: write

concurrency:
  group: agent-crypto-canonical-runtime-names
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Synchronize
        run: git pull --ff-only origin main

      - name: Canonicalize unambiguous active runtime filenames
        run: python .github/scripts/agent_crypto_canonicalize_runtime_names.py

      - name: Syntax-check renamed JavaScript
        run: |
          find public/agent_crypto_erith_ia/administrator/js -maxdepth 1 -type f -name '*.js' -print0 \
            | xargs -0 -n1 node --check

      - name: Commit migration and retire one-shot tooling
        run: |
          set -euo pipefail
          git config user.name 'Seven Heaven Refactor'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A public/agent_crypto_erith_ia/administrator
          git rm -f .github/workflows/agent-crypto-canonical-runtime-names.yml
          git rm -f .github/scripts/agent_crypto_canonicalize_runtime_names.py
          git commit -m 'refactor(agent-crypto): canonicalize active runtime filenames'
          git push origin HEAD:main
