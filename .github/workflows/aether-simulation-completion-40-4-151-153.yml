name: Aether Simulation Completion 40.4.151-153

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/aether-simulation-completion-40-4-151-153.yml'

permissions:
  contents: write

env:
  ADMIN: public/agent_crypto_erith_ia/administrator

jobs:
  cascade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gate exact 40.4.150 functional parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object "$ADMIN/app.js")" = "2c957ff4fa6ec3842b8f27160c68f6767a84d99f"
          test "$(git hash-object "$ADMIN/index.html")" = "07cb124b5a142dbef3e6472f9a8007b9065d37e6"
          test "$(git hash-object "$ADMIN/js/app.js")" = "e0a2b42a920d745444177fcc9513070190d0ee91"
          python - <<'PY2'
          import json, pathlib
          b=pathlib.Path('public/agent_crypto_erith_ia/administrator')
          assert json.loads((b/'version.json').read_text(encoding='utf-8'))['build']=='40.4.150'
          assert json.loads((b/'administrator-version.json').read_text(encoding='utf-8'))['build']=='40.4.150'
          print('PARENT GATE PASS · 40.4.150')
          PY2

      - name: Install cascade helper
        shell: bash
        run: |
          cat > /tmp/release_identity.py <<'PY2'
          from pathlib import Path
          import json,re,hashlib,sys
          base=Path('public/agent_crypto_erith_ia/administrator')
          build,parent,release,status,stamp,key=sys.argv[1:7]
          token=f'market-core-v2.0-alpha-build-{build}'
          ip=base/'index.html'; rp=base/'app.js'; jp=base/'js/app.js'
          html=ip.read_text(encoding='utf-8')
          html=re.sub(r'(<meta name="atlas-build" content=")[^"]+(" />)',rf'\g<1>{build}\2',html,count=1)
          html=re.sub(r'(<meta name="administrator-build" content=")[^"]+(" />)',rf'\g<1>{build}\2',html,count=1)
          html=re.sub(r'(<meta name="administrator-release" content=")[^"]+(" />)',rf'\g<1>{release}\2',html,count=1)
          html=re.sub(r'(<meta name="atlas-asset-token" content=")[^"]+(" />)',rf'\g<1>{token}\2',html,count=1)
          html=re.sub(r'(<title>Agent-Crypto @erith\.IA — Build )40\.4\.\d+( · Administrator</title>)',rf'\g<1>{build}\2',html,count=1)
          html=re.sub(r'(\?v=administrator-build-)40\.4\.\d+',rf'\g<1>{build}',html)
          ip.write_text(html,encoding='utf-8',newline='\n')
          js=jp.read_text(encoding='utf-8')
          js,n1=re.subn(r'const ADMIN_BUILD = "40\.4\.\d+";',f'const ADMIN_BUILD = "{build}";',js,count=1)
          js,n2=re.subn(r'const ADMIN_RELEASE = "[^"]*";',f'const ADMIN_RELEASE = "{release}";',js,count=1)
          assert n1==1 and n2==1,(n1,n2)
          jp.write_text(js,encoding='utf-8',newline='\n')
          def sha(p): return hashlib.sha256(p.read_bytes()).hexdigest()
          hashes={'index_sha256':sha(ip),'root_app_sha256':sha(rp),'js_app_sha256':sha(jp)}
          for name in ('version.json','administrator-version.json'):
              p=base/name; d=json.loads(p.read_text(encoding='utf-8'))
              d['build']=build; d['release']=release; d['asset_token']=token; d['status']=status; d['parent_build']=parent
              if 'global_versioning' in d: d['global_versioning']=build
              d['prepared_at']=stamp; d['published_at']=stamp
              integ=d.get('integrity')
              if isinstance(integ,dict) and isinstance(integ.get('publication_identity'),dict):
                  pi=integ['publication_identity']; pi['build']=build; pi['asset_token']=token; pi['status']=status; pi['app_sha256']=hashes['root_app_sha256']
              v=d.setdefault('verification',{})
              v[key]={'build':build,'parent_build':parent,**hashes,
                  'simulation_only':True,'kraken_mapping_read_only':True,
                  'new_fetch_owner':False,'new_storage_owner':False,'new_timer':False,'new_observer':False,
                  'real_orders':False,'workspace_mutation':False,'api_keys_added':False,'withdrawals':False,
                  'market_core_changed':False,'atlas_pipeline_changed':False,'window_manager_changed':False,
                  'bridge_changed':False,'private_backend_changed':False}
              p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8',newline='\n')
          print(build,hashes)
          PY2

          cat > /tmp/gate.py <<'PY2'
          from pathlib import Path
          import json,sys
          base=Path('public/agent_crypto_erith_ia/administrator'); build=sys.argv[1]
          root=(base/'app.js').read_text(encoding='utf-8'); html=(base/'index.html').read_text(encoding='utf-8'); js=(base/'js/app.js').read_text(encoding='utf-8')
          assert f'const ATLAS_BUILD = "{build}";' in root
          assert f'const ADMIN_BUILD = "{build}";' in js
          assert f'<meta name="atlas-build" content="{build}" />' in html
          assert f'<meta name="administrator-build" content="{build}" />' in html
          for n in ('version.json','administrator-version.json'):
              assert json.loads((base/n).read_text(encoding='utf-8'))['build']==build
          assert 'const KRAKEN_CLI_ADAPTER_BASE_404144 = "http://127.0.0.1:8791";' in root
          assert '{ method:"GET", mode:"cors", cache:"no-store", signal:ctl.signal }' in root
          ticker=root[root.index('async function krakenCliTicker404144'):root.index('async function krakenCliWorkspaceList404144')]
          work=root[root.index('async function krakenCliWorkspaceList404144'):root.index('function renderKrakenCliLab404144')]
          assert 'ingestKrakenPaperWorkspaceInventory404147' not in ticker
          assert work.count('ingestKrakenPaperWorkspaceInventory404147')==1
          if build>='40.4.151':
              assert root.count('function paperWorkspaceIntegrationTruth404151(')==1
              assert 'kraken_cli_connection:false' not in root[root.index('function paperWorkspacesPayload404142'):root.index('function switchPaperWorkspace404142')]
          if build>='40.4.152': assert root.count('function simulationReadinessPayload404152(')==1
          if build>='40.4.153': assert root.count('function simulationAcceptance404153(')==1
          print('STATIC GATE PASS',build)
          PY2

      - name: Build 40.4.151
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d | gzip -d > /tmp/151.patch
          git apply --check /tmp/151.patch
          git apply /tmp/151.patch
          python /tmp/release_identity.py '40.4.151' '40.4.150' 'SIMULATION ACTIVE WORKSPACE KRAKEN TRUTH · READ-ONLY INTEGRATION LOCK' 'simulation_active_workspace_kraken_truth_readonly_lock' '2026-09-01T06:20:00Z' 'simulation_workspace_truth_404151'
          node --check "$ADMIN/app.js"
          node --check "$ADMIN/js/app.js"
          python /tmp/gate.py '40.4.151'
          python -m json.tool "$ADMIN/version.json" >/dev/null
          python -m json.tool "$ADMIN/administrator-version.json" >/dev/null
          git diff --check
          zip -q -9 /tmp/AGENT_CRYPTO_BUILD_40_4_151_SIMULATION_ACTIVE_WORKSPACE_KRAKEN_TRUTH_READ_ONLY_INTEGRATION_LOCK_CLEAN_UPLOAD_5_FILES.zip "$ADMIN/app.js" "$ADMIN/index.html" "$ADMIN/js/app.js" "$ADMIN/version.json" "$ADMIN/administrator-version.json"
          git config user.name 'Aether Release'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$ADMIN/app.js" "$ADMIN/index.html" "$ADMIN/js/app.js" "$ADMIN/version.json" "$ADMIN/administrator-version.json"
          git commit -m 'feat Agent-Crypto 40.4.151 reconcile active Simulation workspace with Kraken Paper truth'

      - name: Build 40.4.152
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d | gzip -d > /tmp/152.patch
          git apply --check /tmp/152.patch
          git apply /tmp/152.patch
          python /tmp/release_identity.py '40.4.152' '40.4.151' 'SIMULATION OPERATOR READINESS · EXPERIMENT SNAPSHOT LOCK' 'simulation_operator_readiness_experiment_snapshot_lock' '2026-09-01T06:20:01Z' 'simulation_operator_readiness_404152'
          node --check "$ADMIN/app.js"
          node --check "$ADMIN/js/app.js"
          python /tmp/gate.py '40.4.152'
          python -m json.tool "$ADMIN/version.json" >/dev/null
          python -m json.tool "$ADMIN/administrator-version.json" >/dev/null
          git diff --check
          zip -q -9 /tmp/AGENT_CRYPTO_BUILD_40_4_152_SIMULATION_OPERATOR_READINESS_EXPERIMENT_SNAPSHOT_LOCK_CLEAN_UPLOAD_5_FILES.zip "$ADMIN/app.js" "$ADMIN/index.html" "$ADMIN/js/app.js" "$ADMIN/version.json" "$ADMIN/administrator-version.json"
          git add "$ADMIN/app.js" "$ADMIN/index.html" "$ADMIN/js/app.js" "$ADMIN/version.json" "$ADMIN/administrator-version.json"
          git commit -m 'feat Agent-Crypto 40.4.152 add Simulation operator readiness and experiment snapshot'

      - name: Build 40.4.153 final Simulation gate
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d | gzip -d > /tmp/153.patch
          git apply --check /tmp/153.patch
          git apply /tmp/153.patch
          python /tmp/release_identity.py '40.4.153' '40.4.152' 'SIMULATION ACCEPTANCE AUDIT · PAPER-ONLY FINALIZATION LOCK' 'simulation_acceptance_audit_paper_only_finalization_lock' '2026-09-01T06:20:02Z' 'simulation_acceptance_audit_404153'
          node --check "$ADMIN/app.js"
          node --check "$ADMIN/js/app.js"
          python /tmp/gate.py '40.4.153'
          python -m json.tool "$ADMIN/version.json" >/dev/null
          python -m json.tool "$ADMIN/administrator-version.json" >/dev/null
          git diff --check
          zip -q -9 /tmp/AGENT_CRYPTO_BUILD_40_4_153_SIMULATION_ACCEPTANCE_AUDIT_PAPER_ONLY_FINALIZATION_LOCK_CLEAN_UPLOAD_5_FILES.zip "$ADMIN/app.js" "$ADMIN/index.html" "$ADMIN/js/app.js" "$ADMIN/version.json" "$ADMIN/administrator-version.json"
          git add "$ADMIN/app.js" "$ADMIN/index.html" "$ADMIN/js/app.js" "$ADMIN/version.json" "$ADMIN/administrator-version.json"
          git commit -m 'feat Agent-Crypto 40.4.153 finalize Simulation with explicit paper-only acceptance audit'

      - name: Build release proof
        shell: bash
        run: |
          set -euo pipefail
          {
            echo 'Agent-Crypto Simulation cascade 40.4.151 -> 40.4.153'
            echo 'Static gates: PASS for 151 / 152 / 153'
            echo 'Runtime Firefox: not claimed; operator proof = WORKSPACES then AUDIT SIMULATION'
            echo 'Safety: no API keys, no withdrawals, no real orders, no workspace mutations'
            echo 'Protected owners: Market Core / Atlas pipeline / Window Manager / Bridge / backend unchanged'
            sha256sum /tmp/AGENT_CRYPTO_BUILD_40_4_15*.zip
          } > /tmp/AGENT_CRYPTO_SIMULATION_CASCADE_40_4_151_TO_40_4_153_PUBLISHED_SHA256.txt
          cat /tmp/AGENT_CRYPTO_SIMULATION_CASCADE_40_4_151_TO_40_4_153_PUBLISHED_SHA256.txt

      - name: Retire one-shot workflow and publish cascade
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/aether-simulation-completion-40-4-151-153.yml
          git add .github/workflows/aether-simulation-completion-40-4-151-153.yml
          git commit -m 'chore retire Agent-Crypto Simulation completion one-shot workflow'
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            git rebase --abort >/dev/null 2>&1 || true
            sleep $((attempt*4))
          done
          exit 1

      - name: Upload exact published release cascade
        uses: actions/upload-artifact@v4
        with:
          name: agent-crypto-simulation-cascade-40.4.151-153
          path: |
            /tmp/AGENT_CRYPTO_BUILD_40_4_151_SIMULATION_ACTIVE_WORKSPACE_KRAKEN_TRUTH_READ_ONLY_INTEGRATION_LOCK_CLEAN_UPLOAD_5_FILES.zip
            /tmp/AGENT_CRYPTO_BUILD_40_4_152_SIMULATION_OPERATOR_READINESS_EXPERIMENT_SNAPSHOT_LOCK_CLEAN_UPLOAD_5_FILES.zip
            /tmp/AGENT_CRYPTO_BUILD_40_4_153_SIMULATION_ACCEPTANCE_AUDIT_PAPER_ONLY_FINALIZATION_LOCK_CLEAN_UPLOAD_5_FILES.zip
            /tmp/AGENT_CRYPTO_SIMULATION_CASCADE_40_4_151_TO_40_4_153_PUBLISHED_SHA256.txt
          retention-days: 30
