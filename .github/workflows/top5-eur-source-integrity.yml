name: Top3 plus Top5 EUR - one owner contract
on:
  push:
    branches:
      - test/top3-top5-eur-source-integrity-20261027
    paths:
      - '.github/workflows/top5-eur-source-integrity.yml'
permissions:
  contents: write
jobs:
  validate-top5:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/top3-top5-eur-source-integrity-20261027
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /public/agent_crypto_erith_ia/administrator/app.js
            /.github/validation/apply_top5_eur_integrity.py
            /.github/validation/test_top5_eur_sources.cjs
            /.github/validation/test_top3_eur_sources.cjs
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reproduce Top5 EUR source failures before correction
        run: |
          if node --test .github/validation/test_top5_eur_sources.cjs; then
            echo "Top5 regression was not reproduced"
            exit 1
          fi
      - name: Correct canonical 24h Top5 EUR route without changing graph
        run: python3 .github/validation/apply_top5_eur_integrity.py
      - name: Verify Top3 and Top5 EUR contracts plus JS syntax
        run: |
          node --check public/agent_crypto_erith_ia/administrator/app.js
          node --test .github/validation/test_top3_eur_sources.cjs .github/validation/test_top5_eur_sources.cjs
          test "$(git diff --name-only)" = "public/agent_crypto_erith_ia/administrator/app.js"
          git diff --check
      - name: Commit only app.js on staged EUR branch
        run: |
          git config user.name 'erith-ci'
          git config user.email 'erith-ci@users.noreply.github.com'
          git add public/agent_crypto_erith_ia/administrator/app.js
          git commit -m "fix(agent-crypto): conserver Top5 EUR avec historiques EUR de secours"
          git push origin HEAD:refs/heads/test/top3-top5-eur-source-integrity-20261027
