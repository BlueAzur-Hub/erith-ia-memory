name: Agent-Crypto 40.4.185 Unified Graph Shell

on:
  push:
    paths:
      - '.github/workflows/agent-crypto-40-4-185-unified-graph-shell.yml'
      - '.github/scripts/agent_crypto_release_40_4_185.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply release
        run: python .github/scripts/agent_crypto_release_40_4_185.py
      - name: JavaScript syntax gate
        run: |
          node --check public/agent_crypto_erith_ia/administrator/app.js
          node --check public/agent_crypto_erith_ia/administrator/js/app.js
          node --check public/agent_crypto_erith_ia/administrator/js/market-stack.js
          node --check public/agent_crypto_erith_ia/administrator/js/parallel-markets.js
      - name: Commit release
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/agent-crypto-40-4-185-unified-graph-shell.yml .github/scripts/agent_crypto_release_40_4_185.py
          git add public/agent_crypto_erith_ia/administrator
          git commit -m 'release Agent-Crypto 40.4.185 unified graph shell soft transition'
          git pull --rebase origin main
          git push origin HEAD:main
