name: Agent Crypto Radar20 Historical Regime Diagnostic
on:
  pull_request:
    paths:
      - 'public/agent_crypto_erith_ia/laboratoire/radar-activity-audit.js'
      - 'public/agent_crypto_erith_ia/laboratoire/radar-native-activity-view.js'
      - 'public/agent_crypto_erith_ia/tools/analyze_radar20_native_activity.py'
      - 'public/agent_crypto_erith_ia/tools/test_analyze_radar20_native_activity.py'
      - 'public/agent_crypto_erith_ia/laboratoire/test-radar-activity-audit.cjs'
      - 'public/agent_crypto_erith_ia/laboratoire/radar-forward-decisions.js'
      - 'public/agent_crypto_erith_ia/laboratoire/test-radar-forward-decisions.cjs'
      - 'public/agent_crypto_erith_ia/laboratoire/zcash-case-study.html'
      - 'public/agent_crypto_erith_ia/laboratoire/zcash-paper-model.js'
      - 'public/agent_crypto_erith_ia/laboratoire/test-zcash-case-study.cjs'
      - 'public/agent_crypto_erith_ia/data/crypto/research/zcash.json'
      - 'public/agent_crypto_erith_ia/laboratoire/case-market-hourly-reader.js'
      - 'public/agent_crypto_erith_ia/laboratoire/radar-verified-targets.js'
      - 'public/agent_crypto_erith_ia/laboratoire/test-radar-verified-targets.cjs'
      - 'public/agent_crypto_erith_ia/laboratoire/radar-target-coverage.js'
      - 'public/agent_crypto_erith_ia/laboratoire/test-radar-target-coverage.cjs'
      - 'public/agent_crypto_erith_ia/laboratoire/test-case-market-hourly-reader.cjs'
      - 'public/agent_crypto_erith_ia/tools/build_radar_focus_identity_review.py'
      - 'public/agent_crypto_erith_ia/tools/test_build_radar_focus_identity_review.py'
      - 'public/agent_crypto_erith_ia/data/crypto/radar-opportunities/focus-identity-review.json'
      - 'public/agent_crypto_erith_ia/laboratoire/radar-priority-dossiers.html'
      - 'public/agent_crypto_erith_ia/data/crypto/radar-opportunities/priority-casebook.json'
      - 'public/agent_crypto_erith_ia/tools/test_radar_priority_casebook.py'
      - 'public/agent_crypto_erith_ia/laboratoire/radar-historique.html'
      - '.github/workflows/agent-crypto-radar20-regimes.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/agent-crypto-radar20-regimes.yml'
      - 'public/agent_crypto_erith_ia/tools/analyze_radar20_regimes.py'
      - 'public/agent_crypto_erith_ia/tools/test_analyze_radar20_regimes.py'
      - 'public/agent_crypto_erith_ia/data/trader_flux/radar20_regimes/**'
      - '!public/agent_crypto_erith_ia/data/trader_flux/radar20_regimes/native_activity.json'
      - 'public/agent_crypto_erith_ia/laboratoire/radar-activity-audit.js'
      - 'public/agent_crypto_erith_ia/laboratoire/radar-native-activity-view.js'
      - 'public/agent_crypto_erith_ia/tools/analyze_radar20_native_activity.py'
      - 'public/agent_crypto_erith_ia/tools/test_analyze_radar20_native_activity.py'
      - 'public/agent_crypto_erith_ia/laboratoire/test-radar-activity-audit.cjs'
      - 'public/agent_crypto_erith_ia/laboratoire/radar-forward-decisions.js'
      - 'public/agent_crypto_erith_ia/laboratoire/test-radar-forward-decisions.cjs'
      - 'public/agent_crypto_erith_ia/laboratoire/zcash-case-study.html'
      - 'public/agent_crypto_erith_ia/laboratoire/zcash-paper-model.js'
      - 'public/agent_crypto_erith_ia/laboratoire/test-zcash-case-study.cjs'
      - 'public/agent_crypto_erith_ia/data/crypto/research/zcash.json'
      - 'public/agent_crypto_erith_ia/laboratoire/case-market-hourly-reader.js'
      - 'public/agent_crypto_erith_ia/laboratoire/radar-verified-targets.js'
      - 'public/agent_crypto_erith_ia/laboratoire/test-radar-verified-targets.cjs'
      - 'public/agent_crypto_erith_ia/laboratoire/radar-target-coverage.js'
      - 'public/agent_crypto_erith_ia/laboratoire/test-radar-target-coverage.cjs'
      - 'public/agent_crypto_erith_ia/laboratoire/test-case-market-hourly-reader.cjs'
      - 'public/agent_crypto_erith_ia/tools/build_radar_focus_identity_review.py'
      - 'public/agent_crypto_erith_ia/tools/test_build_radar_focus_identity_review.py'
      - 'public/agent_crypto_erith_ia/data/crypto/radar-opportunities/focus-identity-review.json'
      - 'public/agent_crypto_erith_ia/laboratoire/radar-priority-dossiers.html'
      - 'public/agent_crypto_erith_ia/data/crypto/radar-opportunities/priority-casebook.json'
      - 'public/agent_crypto_erith_ia/tools/test_radar_priority_casebook.py'
      - 'public/agent_crypto_erith_ia/laboratoire/radar-historique.html'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit-readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate descriptive filters and source integrity
        env:
          RADAR20_REGIME_DATA_ROOT: public/agent_crypto_erith_ia/data/trader_flux
        run: |
          set -euo pipefail
          python -m py_compile public/agent_crypto_erith_ia/tools/analyze_radar20_regimes.py
          python -m py_compile public/agent_crypto_erith_ia/tools/analyze_radar20_native_activity.py
          python -m unittest discover -s public/agent_crypto_erith_ia/tools -p test_analyze_radar20_native_activity.py -v
          python -m unittest discover -s public/agent_crypto_erith_ia/tools -p test_analyze_radar20_regimes.py -v
          python -m py_compile public/agent_crypto_erith_ia/tools/build_radar_focus_identity_review.py
          python -m unittest discover -s public/agent_crypto_erith_ia/tools -p 'test_build_radar_focus_identity_review.py' -v
          python -m unittest discover -s public/agent_crypto_erith_ia/tools -p 'test_radar_priority_casebook.py' -v
          python public/agent_crypto_erith_ia/tools/build_radar_focus_identity_review.py --check
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify honest UTC hour groupings of accepted historical PAPER trades
        run: |
          set -euo pipefail
          node --check public/agent_crypto_erith_ia/laboratoire/radar-activity-audit.js
          node --check public/agent_crypto_erith_ia/laboratoire/radar-native-activity-view.js
          node --check public/agent_crypto_erith_ia/laboratoire/zcash-paper-model.js
          node --test public/agent_crypto_erith_ia/laboratoire/test-zcash-case-study.cjs
          node --check public/agent_crypto_erith_ia/laboratoire/radar-forward-decisions.js
          node --check public/agent_crypto_erith_ia/laboratoire/case-market-hourly-reader.js
          node --test public/agent_crypto_erith_ia/laboratoire/test-case-market-hourly-reader.cjs
          node --check public/agent_crypto_erith_ia/laboratoire/radar-verified-targets.js
          node --test public/agent_crypto_erith_ia/laboratoire/test-radar-verified-targets.cjs
          node --check public/agent_crypto_erith_ia/laboratoire/radar-target-coverage.js
          node --test public/agent_crypto_erith_ia/laboratoire/test-radar-target-coverage.cjs
          node --test public/agent_crypto_erith_ia/laboratoire/test-radar-forward-decisions.cjs
          node --test public/agent_crypto_erith_ia/laboratoire/test-radar-activity-audit.cjs

      - name: Rebuild exactly from canonical 120 monthly JSONs and two published cash ledgers
        run: |
          set -euo pipefail
          python public/agent_crypto_erith_ia/tools/analyze_radar20_regimes.py \
            --data-root public/agent_crypto_erith_ia/data/trader_flux \
            --out "$RUNNER_TEMP/regimes"
          target=public/agent_crypto_erith_ia/data/trader_flux/radar20_regimes
          for file in index.json summary.json annotated_trades.json; do
            cmp "$RUNNER_TEMP/regimes/$file" "$target/$file"
          done
          echo 'PASS: all 258 annotated trades match immutable published inputs byte-for-byte'
      - name: Rebuild native hourly trade counts and repeated 3h patterns from the same immutable inputs
        run: |
          set -euo pipefail
          python public/agent_crypto_erith_ia/tools/analyze_radar20_native_activity.py \
            --data-root public/agent_crypto_erith_ia/data/trader_flux \
            --out-file "$RUNNER_TEMP/native_activity.json"
          python - "$RUNNER_TEMP/native_activity.json" <<'PY'
          import json,sys
          x=json.load(open(sys.argv[1]))
          assert x['orders_enabled'] is False and x['real_orders']==0
          assert x['paper_fills']==0 and x['prediction'] is False
          assert x['periods'][0]['assets']==x['periods'][1]['assets']==20
          assert len(x['periods'])==2 and x['market_hours']>80000
          print('PASS: ',x['market_hours'],'hourly market observations')
          PY
      - name: Guard against live order or portfolio runtime mutation
        run: |
          set -euo pipefail
          git diff --exit-code -- public/agent_crypto_erith_ia/trader \
            public/agent_crypto_erith_ia/administrator \
            public/agent_crypto_erith_ia/data/historical_archive_prototype

  publish-descriptive-activity:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [audit-readonly]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Commit only the deterministically derived native hourly activity report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            python public/agent_crypto_erith_ia/tools/analyze_radar20_native_activity.py \
              --data-root public/agent_crypto_erith_ia/data/trader_flux \
              --out-file public/agent_crypto_erith_ia/data/trader_flux/radar20_regimes/native_activity.json
            git add -- public/agent_crypto_erith_ia/data/trader_flux/radar20_regimes/native_activity.json
            git diff --cached --check
            if git diff --cached --quiet; then
              echo 'NOOP: descriptive native hourly report unchanged'
              exit 0
            fi
            git commit -m 'Archive deterministic Radar20 native hourly volume and trade frequency research'
            if git push origin HEAD:main; then
              echo 'PUBLISHED: Radar20 native hourly activity'
              exit 0
            fi
            sleep "$((attempt * 3))"
          done
          echo 'Derived activity report not published; fail closed' >&2
          exit 1
