name: Agent Crypto audit unreachable CSS

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/agent-crypto-audit-unreachable-css.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Synchronize
        run: git pull --ff-only origin main
      - name: Audit CSS reachability
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json,re
          ROOT=Path('public/agent_crypto_erith_ia/administrator')
          SHELL=Path('runtime-shell.html')
          build=json.loads((ROOT/'build.json').read_text(encoding='utf-8'))
          if str(build.get('build'))!='40.6.124': raise SystemExit(f"Build drifted: {build.get('build')!r}")
          core=str(build.get('market_core') or build.get('engine') or '')
          if '38.15.11' not in core: raise SystemExit(f'Market Core drifted: {core!r}')

          CSS_REF=re.compile(r'(?P<ref>(?:\.\.?/|/)?[A-Za-z0-9_./-]+\.css)(?:\?[^"\'`\s)>]*)?',re.I)
          JS_REF=re.compile(r'(?P<ref>(?:\.\.?/|/)?js/[A-Za-z0-9_./-]+\.js)(?:\?[^"\'`\s)>]*)?',re.I)
          def clean(ref): return ref.split('?',1)[0].split('#',1)[0].replace('\\','/')
          def resolve(src,ref):
              c=clean(ref); out=[]
              if c.startswith('/'):
                  out.append(Path(c.lstrip('/')))
              elif c.startswith('./'):
                  out.append(Path(c[2:]))
                  try: out.append(((ROOT/src).parent/c).resolve().relative_to(ROOT.resolve()))
                  except Exception: pass
              elif c.startswith('../'):
                  try: out.append(((ROOT/src).parent/c).resolve().relative_to(ROOT.resolve()))
                  except Exception: pass
              else:
                  out.append(Path(c))
                  try: out.append(((ROOT/src).parent/c).resolve().relative_to(ROOT.resolve()))
                  except Exception: pass
              return {x for x in out if (ROOT/x).is_file()}

          # Reachable JS from the real shell, used to catch dynamically declared CSS paths.
          q=[SHELL]; reachable_code=set(); code_text={}
          while q:
              rel=q.pop(0)
              if rel in reachable_code: continue
              p=ROOT/rel
              if not p.is_file() or p.suffix.lower() not in {'.html','.js'}: continue
              try:t=p.read_text(encoding='utf-8')
              except UnicodeDecodeError: continue
              reachable_code.add(rel); code_text[rel]=t
              for m in JS_REF.finditer(t):
                  for x in resolve(rel,m.group('ref')):
                      if x.suffix.lower()=='.js' and x not in reachable_code:q.append(x)

          active_css=set(); active_sources={}
          for src,t in code_text.items():
              for m in CSS_REF.finditer(t):
                  for x in resolve(src,m.group('ref')):
                      if x.suffix.lower()=='.css':
                          active_css.add(x);active_sources.setdefault(x,set()).add(src)

          # Follow CSS @import chains from active stylesheets.
          cq=list(active_css)
          while cq:
              rel=cq.pop(0)
              p=ROOT/rel
              try:t=p.read_text(encoding='utf-8')
              except UnicodeDecodeError: continue
              for m in CSS_REF.finditer(t):
                  for x in resolve(rel,m.group('ref')):
                      if x.suffix.lower()=='.css' and x not in active_css:
                          active_css.add(x);active_sources.setdefault(x,set()).add(rel);cq.append(x)

          all_sources={}
          for p in ROOT.rglob('*'):
              if p.is_file() and p.suffix.lower() in {'.html','.js','.json','.css'}:
                  try:all_sources[p.relative_to(ROOT)]=p.read_text(encoding='utf-8')
                  except UnicodeDecodeError:pass

          current={Path('build.json'),Path('version.json'),Path('administrator-version.json'),Path('index.html'),Path('runtime-shell.html')}
          def protection(rel):
              s=str(rel).lower();name=rel.name.lower();r=[]
              if 'aether' in s:r.append('AETHER')
              if 'oracle' in s:r.append('ORACLE')
              if 'atlas' in s:r.append('ATLAS')
              if 'technical' in s or 'lecture' in s:r.append('LECTURE_TECHNIQUE')
              if 'market' in s or 'graph' in s or 'chart' in s:r.append('MARKET_OR_GRAPH')
              if 'classic' in s or 'classique' in s:r.append('WEB_CLASSIC')
              if 'visual-assets' in s:r.append('VISUAL_ASSETS_PROTECTED')
              return r
          def kind(src):
              s=str(src);name=src.name
              if src in current:return 'CURRENT_META_OR_ENTRY'
              if re.fullmatch(r'index-40\.\d+\.\d+\.html',name):return 'IMMUTABLE_INDEX'
              if s.startswith('architecture/'):return 'ARCH_HISTORY'
              if src in reachable_code:return 'ACTIVE_CODE'
              return 'OTHER'

          rows=[]
          for p in sorted(ROOT.rglob('*.css')):
              rel=p.relative_to(ROOT)
              if rel in active_css:continue
              inbound=[];literal=[]
              for src,t in all_sources.items():
                  found=False
                  for m in CSS_REF.finditer(t):
                      if rel in resolve(src,m.group('ref')):
                          found=True;break
                  if found and src!=rel:inbound.append(src)
                  if rel.name in t and src!=rel:literal.append(src)
              prot=protection(rel)
              kinds={}
              for src in inbound:
                  k=kind(src);kinds[k]=kinds.get(k,0)+1
              if prot:cls='PROTECTED_UNREACHABLE'
              elif any(kind(src)=='ACTIVE_CODE' for src in inbound):cls='ACTIVE_CODE_REVIEW'
              elif any(kind(src)=='CURRENT_META_OR_ENTRY' for src in inbound):cls='CURRENT_METADATA_REFERENCED'
              elif any(kind(src) in {'IMMUTABLE_INDEX','ARCH_HISTORY'} for src in inbound):cls='HISTORY_ONLY_REFERENCED'
              elif inbound:cls='OTHER_REFERENCED'
              else:cls='NEUTRAL_ZERO_INBOUND'
              rows.append({'path':str(rel),'bytes':p.stat().st_size,'lines':len(p.read_text(encoding='utf-8').splitlines()),'classification':cls,'protection':prot,'inbound_count':len(inbound),'literal_count':len(literal),'ref_kinds':kinds,'inbound_sample':[str(x) for x in sorted(inbound,key=str)[:12]]})
          counts={}
          for r in rows:counts[r['classification']]=counts.get(r['classification'],0)+1
          print(json.dumps({'build':build.get('build'),'market_core':core,'reachable_code_nodes':len(reachable_code),'total_css':len(list(ROOT.rglob('*.css'))),'active_css':len(active_css),'unreachable_css':len(rows),'counts':counts,'rows':rows,'mutation':'none'},indent=2,ensure_ascii=False))
          PY
      - name: Retire one-shot audit workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Seven Heaven Refactor'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/agent-crypto-audit-unreachable-css.yml
          git commit -m 'chore(agent-crypto): retire unreachable CSS audit tooling'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if ! git rebase origin/main; then git rebase --abort || true; exit 1; fi
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
