name: Seven Heaven PAPER Spot Lot Master and Trader integration

on:
  push:
    branches:
      - feature/paper-okx-lot-inventory-interface-master-20261113
    paths:
      - '.github/workflows/seven-heaven-paper-spot-lot-master-trader-integration.yml'
      - 'public/agent_crypto_erith_ia/administrator/index.html'
      - 'public/agent_crypto_erith_ia/administrator/js/market-microscope-paper-spot-*.js'
      - 'public/agent_crypto_erith_ia/administrator/tests/test-market-microscope-paper-spot-realism-comparison.cjs'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/seven-heaven-paper-spot-lot-master-trader-integration.yml'
      - 'public/agent_crypto_erith_ia/administrator/index.html'
      - 'public/agent_crypto_erith_ia/administrator/js/market-microscope-paper-spot-*.js'
      - 'public/agent_crypto_erith_ia/administrator/tests/test-market-microscope-paper-spot-realism-comparison.cjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-no-orders-merge-ready:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /public/agent_crypto_erith_ia/administrator/index.html
            /public/agent_crypto_erith_ia/administrator/js/market-microscope-paper-backtest-v5.js
            /public/agent_crypto_erith_ia/administrator/js/market-microscope-orderbook-paper-v6.js
            /public/agent_crypto_erith_ia/administrator/js/market-microscope-paper-spot-lot-inventory-adapter.js
            /public/agent_crypto_erith_ia/administrator/js/market-microscope-paper-spot-realism-comparison.js
            /public/agent_crypto_erith_ia/administrator/tests/test-market-microscope-paper-backtest-v5.cjs
            /public/agent_crypto_erith_ia/administrator/tests/test-market-microscope-orderbook-paper-v6.cjs
            /public/agent_crypto_erith_ia/administrator/tests/test-market-microscope-paper-spot-realism-comparison.cjs
            /public/agent_crypto_erith_ia/trader/trading-desk.html
            /public/agent_crypto_erith_ia/trader/trader-runtime-mirror.js
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and unchanged source regression
        run: |
          set -euo pipefail
          node --check public/agent_crypto_erith_ia/administrator/js/market-microscope-paper-spot-lot-inventory-adapter.js
          node --check public/agent_crypto_erith_ia/administrator/js/market-microscope-paper-spot-realism-comparison.js
          node --check public/agent_crypto_erith_ia/administrator/tests/test-market-microscope-paper-spot-realism-comparison.cjs
          node public/agent_crypto_erith_ia/administrator/tests/test-market-microscope-paper-backtest-v5.cjs
          node public/agent_crypto_erith_ia/administrator/tests/test-market-microscope-orderbook-paper-v6.cjs
      - name: Actual shared Administrator Trader UI read-only mathematical tests
        run: |
          set -euo pipefail
          node public/agent_crypto_erith_ia/administrator/tests/test-market-microscope-paper-spot-realism-comparison.cjs
      - name: No machine secrets, order endpoint or visible build spoofing
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          root=Path('public/agent_crypto_erith_ia/administrator')
          h=(root/'index.html').read_text()
          old='<script defer src="./js/market-microscope-orderbook-paper-v6.js?rev=book-depth-paper-v6-20261106-okx-taker-fee-and-fresh-compare-20261113"'
          a='./js/market-microscope-paper-spot-lot-inventory-adapter.js'
          b='./js/market-microscope-paper-spot-realism-comparison.js'
          assert h.index(old)<h.index(a)<h.index(b)
          assert h.count(a)==1 and h.count(b)==1
          assert 'Build 40.6.719' in h
          for p in [root/'js/market-microscope-paper-spot-lot-inventory-adapter.js',root/'js/market-microscope-paper-spot-realism-comparison.js']:
              t=p.read_text()
              assert not any(x in t for x in ['fetch(', '/api/v5/trade/', 'sendOrder(', 'localStorage.setItem('])
          trader=Path('public/agent_crypto_erith_ia/trader/trading-desk.html').read_text()
          assert 'src="../administrator/index.html?surface=trader"' in trader
          print('PASS: one shared UI, no order writer, existing build preserved')
          PY
