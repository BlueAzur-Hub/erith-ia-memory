name: Agent-Crypto DOM Global Cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/agent-crypto-dom-global-cleanup.yml'
      - '.github/scripts/agent_crypto_cleanup_dom_globals.py'

permissions:
  contents: write

concurrency:
  group: agent-crypto-dom-global-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Synchronize
        run: git pull --ff-only origin main

      - name: Canonicalize DOM and global identifiers
        run: python .github/scripts/agent_crypto_cleanup_dom_globals.py

      - name: Reconcile uniquely renamed runtime resources
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root=Path('public/agent_crypto_erith_ia/administrator')
          shell=root/'runtime-shell.html'
          text_suffixes={'.html','.js','.css','.json','.md','.txt'}
          ref_re=re.compile(r'(?:src|href)=["\'](\./[^"\']+)["\']',re.I)
          version_suffixes=(
              re.compile(r'^(?P<base>.+)-(?P<v>(?:39|40)\d{2,4})$'),
              re.compile(r'^(?P<base>.+)-(?P<v>40\.\d+\.\d+)$'),
          )

          def refs():
              text=shell.read_text(encoding='utf-8')
              return sorted(set(x.split('?',1)[0] for x in ref_re.findall(text)))

          renamed=[]
          for ref in refs():
              target=root/ref[2:]
              if target.exists():
                  continue
              candidates=[]
              for candidate in target.parent.glob('*'+target.suffix):
                  if candidate == target:
                      continue
                  for pattern in version_suffixes:
                      m=pattern.match(candidate.stem)
                      if m and m.group('base') == target.stem:
                          candidates.append(candidate)
                          break
              candidates=sorted(set(candidates))
              if len(candidates) != 1:
                  raise SystemExit(f'Cannot reconcile {ref}: candidates={[str(x.relative_to(root)) for x in candidates]}')
              old=candidates[0]
              old_rel=str(old.relative_to(root)).replace('\\','/')
              new_rel=str(target.relative_to(root)).replace('\\','/')
              old.rename(target)
              renamed.append((old_rel,new_rel,old.name,target.name))

          for path in root.rglob('*'):
              if not path.is_file() or path.suffix.lower() not in text_suffixes:
                  continue
              try:
                  text=path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              original=text
              for old_rel,new_rel,old_name,new_name in renamed:
                  text=text.replace('./'+old_rel,'./'+new_rel)
                  text=text.replace(old_rel,new_rel)
                  text=text.replace(old_name,new_name)
              if text != original:
                  path.write_text(text,encoding='utf-8')

          print(f'Reconciled resources: {len(renamed)}')
          for old_rel,new_rel,_,_ in renamed:
              print(f'  {old_rel} -> {new_rel}')
          PY

      - name: JavaScript syntax check
        run: |
          find public/agent_crypto_erith_ia/administrator -type f -name '*.js' -print0 \
            | xargs -0 -n1 node --check

      - name: Runtime reference sanity
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          root=Path('public/agent_crypto_erith_ia/administrator')
          shell=(root/'runtime-shell.html').read_text(encoding='utf-8')
          missing=[]
          for ref in re.findall(r'(?:src|href)=["\'](\./[^"\']+)["\']', shell):
              clean=ref.split('?',1)[0]
              if not (root/clean[2:]).exists():
                  missing.append(clean)
          if missing:
              raise SystemExit('Missing runtime references: '+', '.join(sorted(set(missing))))
          print('Runtime references OK')
          PY

      - name: Duplicate DOM id guard
        run: |
          python - <<'PY'
          from pathlib import Path
          import collections,re
          shell=Path('public/agent_crypto_erith_ia/administrator/runtime-shell.html').read_text(encoding='utf-8')
          ids=re.findall(r'\bid=["\']([^"\']+)["\']',shell,re.I)
          dup=[x for x,n in collections.Counter(ids).items() if n>1]
          if dup:
              raise SystemExit('Duplicate DOM ids: '+', '.join(sorted(dup)))
          print('DOM ids unique')
          PY

      - name: Commit cleanup and retire one-shot tooling
        run: |
          set -euo pipefail
          git config user.name 'Seven Heaven Refactor'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A public/agent_crypto_erith_ia/administrator
          git rm -f .github/workflows/agent-crypto-dom-global-cleanup.yml
          git rm -f .github/scripts/agent_crypto_cleanup_dom_globals.py
          git commit -m 'refactor(agent-crypto): canonicalize DOM and global identifiers'
          git push origin HEAD:main
