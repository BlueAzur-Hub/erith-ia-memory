name: Agent-Crypto Canonical Expression Dedupe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/agent-crypto-canonical-expression-dedupe.yml'
      - '.github/scripts/agent_crypto_dedupe_canonical_expressions.py'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git pull --ff-only origin main
      - name: Dedupe canonical expressions
        run: python .github/scripts/agent_crypto_dedupe_canonical_expressions.py
      - name: JavaScript syntax check
        run: |
          find public/agent_crypto_erith_ia/administrator -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Market Core lock guard
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('public/agent_crypto_erith_ia/administrator/build.json').read_text(encoding='utf-8'))
          e=str(d.get('engine_build') or d.get('engine') or d.get('market_core') or '')
          if '38.15.11' not in e: raise SystemExit(e)
          print('Market Core 38.15.11 locked')
          PY
      - name: Commit and retire one-shot tooling
        run: |
          set -euo pipefail
          git config user.name 'Seven Heaven Refactor'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A public/agent_crypto_erith_ia/administrator
          git rm -f .github/workflows/agent-crypto-canonical-expression-dedupe.yml
          git rm -f .github/scripts/agent_crypto_dedupe_canonical_expressions.py
          git commit -m 'refactor(agent-crypto): dedupe canonical expressions'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if ! git rebase origin/main; then git rebase --abort || true; exit 1; fi
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
