name: Agent-Crypto 40.4.219 Cache and Atlas Audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/agent-crypto-40-4-219-cache-atlas-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout canonical main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Audit loaded cache tokens and Atlas heartbeat owner
        run: python .github/scripts/_tmp_agent_crypto_404219_audit.py
