name: Agent-Crypto 40.4.219 Loaded Asset Integrity Release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/agent-crypto-40-4-219-cache-atlas-audit.yml'

permissions:
  contents: write

concurrency:
  group: agent-crypto-40-4-219-loaded-asset-integrity
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout canonical main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Execute bounded 40.4.219 release
        run: python .github/scripts/_tmp_agent_crypto_404219_release.py
