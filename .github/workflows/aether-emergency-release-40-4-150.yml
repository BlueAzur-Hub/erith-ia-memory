name: Aether Emergency Release 40.4.150

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/aether-emergency-release-40-4-150.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch 40.4.150 version truth only
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re, hashlib
          from datetime import datetime, timezone

          base = Path('public/agent_crypto_erith_ia/administrator')
          index_p = base / 'index.html'
          root_p = base / 'app.js'
          js_p = base / 'js/app.js'
          manifests = [base / 'version.json', base / 'administrator-version.json']

          BUILD = '40.4.150'
          PARENT = '40.4.149'
          RELEASE = 'VERSION TRUTH SINGLE OWNER · ATOMIC PUBLICATION LOCK'
          TOKEN = f'market-core-v2.0-alpha-build-{BUILD}'
          now = datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z')

          # INDEX: ONLY ACTIVE PUBLICATION IDENTITY / CACHE TOKENS.
          html = index_p.read_text(encoding='utf-8')
          html = re.sub(r'(<meta name="atlas-build" content=")[^"]+(" />)', rf'\g<1>{BUILD}\2', html, count=1)
          html = re.sub(r'(<meta name="administrator-build" content=")[^"]+(" />)', rf'\g<1>{BUILD}\2', html, count=1)
          html = re.sub(r'(<meta name="administrator-release" content=")[^"]+(" />)', rf'\g<1>{RELEASE}\2', html, count=1)
          html = re.sub(r'(<meta name="atlas-asset-token" content=")[^"]+(" />)', rf'\g<1>{TOKEN}\2', html, count=1)
          html = re.sub(r'(<title>Agent-Crypto @erith\.IA — Build )40\.4\.\d+( · Administrator</title>)', rf'\g<1>{BUILD}\2', html, count=1)
          html = re.sub(r'(\?v=administrator-build-)40\.4\.\d+', rf'\g<1>{BUILD}', html)
          index_p.write_text(html, encoding='utf-8', newline='\n')

          # ROOT RUNTIME: THE ACTUAL VERSION BADGE OWNER.
          root = root_p.read_text(encoding='utf-8')
          root2, n = re.subn(r'const ATLAS_BUILD = "40\.4\.\d+";', f'const ATLAS_BUILD = "{BUILD}";', root, count=1)
          if n != 1:
              raise SystemExit(f'ATLAS_BUILD owner replacement count={n}, expected 1')
          root_p.write_text(root2, encoding='utf-8', newline='\n')

          # MODULAR ADMIN IDENTITY.
          js = js_p.read_text(encoding='utf-8')
          js, n1 = re.subn(r'const ADMIN_BUILD = "40\.4\.\d+";', f'const ADMIN_BUILD = "{BUILD}";', js, count=1)
          js, n2 = re.subn(r'const ADMIN_RELEASE = "[^"]*";', f'const ADMIN_RELEASE = "{RELEASE}";', js, count=1)
          if n1 != 1 or n2 != 1:
              raise SystemExit(f'ADMIN owner replacement counts build={n1} release={n2}')
          js_p.write_text(js, encoding='utf-8', newline='\n')

          def sha(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()

          payload_hashes = {
              'index_sha256': sha(index_p),
              'root_app_sha256': sha(root_p),
              'js_app_sha256': sha(js_p),
          }

          for p in manifests:
              data = json.loads(p.read_text(encoding='utf-8'))
              data['build'] = BUILD
              data['release'] = RELEASE
              data['asset_token'] = TOKEN
              data['status'] = 'version_truth_single_owner_atomic_publication_lock'
              data['parent_build'] = PARENT
              data['prepared_at'] = now
              data['published_at'] = now
              v = data.setdefault('verification', {})
              if not isinstance(v, dict):
                  raise SystemExit(f'{p}: verification is not an object')
              v['version_truth_single_owner_404150'] = {
                  'build': BUILD,
                  'parent_build': PARENT,
                  'single_runtime_badge_owner': 'administrator/app.js::ATLAS_BUILD',
                  'modular_identity_owner': 'administrator/js/app.js::ADMIN_BUILD',
                  'static_identity_aligned': True,
                  'atomic_publication': True,
                  'root_app_sha256': payload_hashes['root_app_sha256'],
                  'js_app_sha256': payload_hashes['js_app_sha256'],
                  'index_sha256': payload_hashes['index_sha256'],
                  'market_core_changed': False,
                  'atlas_pipeline_changed': False,
                  'simulation_changed': False,
                  'kraken_changed': False,
                  'bridge_changed': False,
              }
              p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8', newline='\n')

          # HARD GATE: ALL ACTIVE AUTHORITIES MUST SAY 40.4.150.
          checks = {
              'index_atlas_meta': f'<meta name="atlas-build" content="{BUILD}" />' in index_p.read_text(encoding='utf-8'),
              'index_admin_meta': f'<meta name="administrator-build" content="{BUILD}" />' in index_p.read_text(encoding='utf-8'),
              'index_title': f'Build {BUILD} · Administrator' in index_p.read_text(encoding='utf-8'),
              'root_runtime': f'const ATLAS_BUILD = "{BUILD}";' in root_p.read_text(encoding='utf-8'),
              'modular_runtime': f'const ADMIN_BUILD = "{BUILD}";' in js_p.read_text(encoding='utf-8'),
          }
          for p in manifests:
              checks[p.name] = json.loads(p.read_text(encoding='utf-8')).get('build') == BUILD
          bad = [k for k,v in checks.items() if not v]
          if bad:
              raise SystemExit('VERSION TRUTH GATE FAILED: ' + ', '.join(bad))

          print('VERSION TRUTH GATE PASS', BUILD)
          for k,v in payload_hashes.items(): print(k, v)
          PY

          node --check public/agent_crypto_erith_ia/administrator/app.js
          node --check public/agent_crypto_erith_ia/administrator/js/app.js
          python -m json.tool public/agent_crypto_erith_ia/administrator/version.json >/dev/null
          python -m json.tool public/agent_crypto_erith_ia/administrator/administrator-version.json >/dev/null

      - name: Commit atomic 40.4.150 and retire one-shot workflow
        shell: bash
        run: |
          rm -f .github/workflows/aether-emergency-release-40-4-150.yml
          git config user.name 'Aether Release'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/agent_crypto_erith_ia/administrator/index.html \
                  public/agent_crypto_erith_ia/administrator/app.js \
                  public/agent_crypto_erith_ia/administrator/js/app.js \
                  public/agent_crypto_erith_ia/administrator/version.json \
                  public/agent_crypto_erith_ia/administrator/administrator-version.json \
                  .github/workflows/aether-emergency-release-40-4-150.yml
          git diff --cached --check
          git commit -m 'fix Agent-Crypto 40.4.150 lock single-owner version truth atomically'
          git push origin HEAD:main
