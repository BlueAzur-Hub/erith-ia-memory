name: Aether Diagnostic 40.4.228 Cockpit Parity

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/aether-diagnostic-40-4-228-cockpit-parity.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Inspect current owners
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, json
          base=Path('public/agent_crypto_erith_ia/administrator')
          js=(base/'js/parallel-markets.js').read_text(encoding='utf-8')
          idx=(base/'index.html').read_text(encoding='utf-8')
          css=(base/'parallel-markets.css').read_text(encoding='utf-8')
          manifest=json.loads((base/'version.json').read_text(encoding='utf-8'))
          print('MANIFEST', manifest['build'], manifest['engine']['reference_build'], manifest['engine']['status'])
          def block(text, start_pat, end_pat, label):
              s=text.find(start_pat)
              if s<0:
                  print(f'--- {label}: START NOT FOUND ---'); return
              e=text.find(end_pat,s+len(start_pat)) if end_pat else -1
              if e<0: e=min(len(text),s+16000)
              print(f'\n===== {label} =====\n{text[s:e]}\n===== END {label} =====')
          block(js,'  function ensureShell() {','  async function','PARALLEL ENSURE SHELL')
          block(js,'  function renderRail(','  function render','PARALLEL RAIL')
          # Find the next render function after renderRail more safely
          s=js.find('  function renderRail(')
          if s>=0:
              nxt=js.find('\n  function ',s+30)
              print('\n===== RENDER RAIL EXACT =====\n'+js[s:(nxt if nxt>0 else s+16000)]+'\n===== END RENDER RAIL EXACT =====')
          s=idx.find('id="atlasMetalsUnifiedToolbar"')
          if s>=0:
              print('\n===== METALS TOOLBAR HTML =====\n'+idx[max(0,s-500):s+6500]+'\n===== END METALS TOOLBAR HTML =====')
          s=idx.find('id="atlasCyclicMarketMirrorToolbar404168"')
          if s>=0:
              print('\n===== PARALLEL HOST HTML =====\n'+idx[max(0,s-800):s+5000]+'\n===== END PARALLEL HOST HTML =====')
          for pat in ['atlas-parallel-detail','atlas-parallel-depth','atlas-parallel-domain','atlas-parallel-math','atlas-parallel-rail']:
              hits=[m.start() for m in re.finditer(pat,css)]
              print('CSS HITS',pat,len(hits),hits[:12])
          # Metals-related runtime ownership candidates in shared app
          app=(base/'app.js').read_text(encoding='utf-8',errors='replace')
          for pat in ['atlasMetalsUnifiedToolbar','renderMetals','metalsChart','Metals Sentinel','atlasMetalsCanvas']:
              hits=[m.start() for m in re.finditer(re.escape(pat),app,re.I)]
              print('APP HITS',pat,len(hits),hits[:12])
              for pos in hits[:2]:
                  print('\n--- APP CONTEXT',pat,'---\n',app[max(0,pos-1400):pos+4200])
          PY
