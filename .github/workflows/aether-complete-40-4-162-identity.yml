name: Aether Complete 40.4.162 Identity

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/aether-complete-40-4-162-identity.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aether-complete-40-4-162-identity
  cancel-in-progress: false

jobs:
  complete:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Align HTML identity and cache tokens with canonical 40.4.162
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('public/agent_crypto_erith_ia/administrator/index.html')
          text=p.read_text(encoding='utf-8')
          required=[
            '<meta name="atlas-build" content="40.4.160" />',
            '<meta name="administrator-build" content="40.4.160" />',
            '<title>Agent-Crypto @erith.IA — Build 40.4.160 · Administrator</title>',
            'Agent-Crypto @erith.IA · Market Core · Build 40.4.160 · Version : Parker Lewis Can\'t Lose',
          ]
          missing=[x for x in required if x not in text]
          if missing:
            raise SystemExit(f'40.4.162 identity precondition failed: {missing}')
          text=text.replace('<meta name="atlas-build" content="40.4.160" />','<meta name="atlas-build" content="40.4.162" />',1)
          text=text.replace('<meta name="administrator-build" content="40.4.160" />','<meta name="administrator-build" content="40.4.162" />',1)
          text=text.replace('<meta name="administrator-release" content="ATLAS CURRENT TRUTH · AUTO READER PRESENTATION · END-OF-THREAD CHECKPOINT" />','<meta name="administrator-release" content="ADMINISTRATOR STATE TRUTH · OPERATOR FLOW & FAMILY PERSISTENCE" />',1)
          text=text.replace('market-core-v2.0-alpha-build-40.4.160','market-core-v2.0-alpha-build-40.4.162',1)
          text=text.replace('<title>Agent-Crypto @erith.IA — Build 40.4.160 · Administrator</title>','<title>Agent-Crypto @erith.IA — Build 40.4.162 · Administrator</title>',1)
          text=text.replace('Agent-Crypto @erith.IA · Market Core · Build 40.4.160 · Version : Parker Lewis Can\'t Lose','Agent-Crypto @erith.IA · Market Core · Build 40.4.162 · Version : State Truth + Persistence',1)
          text=text.replace('administrator-build-40.4.160','administrator-build-40.4.162')
          p.write_text(text,encoding='utf-8')
          if 'administrator-build-40.4.160' in text or 'Build 40.4.160 · Administrator' in text:
            raise SystemExit('stale 40.4.160 HTML identity remains')
          print('index.html canonical identity aligned to 40.4.162')
          PY
      - name: Commit and retire one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/aether-complete-40-4-162-identity.yml
          git add public/agent_crypto_erith_ia/administrator/index.html
          git commit -m "fix Agent-Crypto 40.4.162 canonical HTML identity"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git pull --rebase origin main
            sleep $((attempt * 2))
          done
          exit 1
