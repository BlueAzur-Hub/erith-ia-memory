name: Agent-Crypto 40.6.487 Validate Package and Publish ZIP

on:
  push:
    branches:
      - main
      - agent-crypto-406487-oracle-evidence-auto-archive-safety-gates
    paths:
      - '.github/workflows/agent-crypto-package-406487.yml'
      - '.github/scripts/agent_crypto_oracle_evidence_auto_archive_safety_test_406487.py'
      - '.github/workflows/agent-crypto-package-406486.yml'
      - 'public/agent_crypto_erith_ia/administrator/js/oracle-evidence-existing-bridge-integration.js'
      - 'public/agent_crypto_erith_ia/administrator/js/oracle-evidence-auto-archive-safety-gates.js'
      - 'public/agent_crypto_erith_ia/administrator/js/post-boot-runtime-loader.js'
      - 'public/agent_crypto_erith_ia/administrator/build.json'
      - 'public/agent_crypto_erith_ia/administrator/index.html'
      - 'public/agent_crypto_erith_ia/administrator/js/strategy-a-audit-demand-loader.js'
      - 'public/agent_crypto_erith_ia/administrator/RELEASE.md'
      - 'public/agent_crypto_erith_ia/administrator/HANDOFF.md'
      - 'public/agent_crypto_erith_ia/administrator/HANDOFF_FINAL_40.6.487.md'
      - 'public/agent_crypto_erith_ia/administrator/ORACLE_EVIDENCE_AUTO_ARCHIVE_SAFETY_GATES_40.6.487.md'
      - 'public/agent_crypto_erith_ia/administrator/PATCH_MANIFEST_40.6.487.txt'
  pull_request:
    paths:
      - '.github/workflows/agent-crypto-package-406487.yml'
      - '.github/scripts/agent_crypto_oracle_evidence_auto_archive_safety_test_406487.py'
      - '.github/workflows/agent-crypto-package-406486.yml'
      - 'public/agent_crypto_erith_ia/administrator/js/oracle-evidence-existing-bridge-integration.js'
      - 'public/agent_crypto_erith_ia/administrator/js/oracle-evidence-auto-archive-safety-gates.js'
      - 'public/agent_crypto_erith_ia/administrator/js/post-boot-runtime-loader.js'
      - 'public/agent_crypto_erith_ia/administrator/build.json'
      - 'public/agent_crypto_erith_ia/administrator/index.html'
      - 'public/agent_crypto_erith_ia/administrator/js/strategy-a-audit-demand-loader.js'
      - 'public/agent_crypto_erith_ia/administrator/RELEASE.md'
      - 'public/agent_crypto_erith_ia/administrator/HANDOFF.md'
      - 'public/agent_crypto_erith_ia/administrator/HANDOFF_FINAL_40.6.487.md'
      - 'public/agent_crypto_erith_ia/administrator/ORACLE_EVIDENCE_AUTO_ARCHIVE_SAFETY_GATES_40.6.487.md'
      - 'public/agent_crypto_erith_ia/administrator/PATCH_MANIFEST_40.6.487.txt'

permissions:
  contents: write

jobs:
  validate-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Validate 40.6.487 auto archive safety gates
        run: |
          set -euo pipefail
          ROOT="public/agent_crypto_erith_ia"
          node --check "$ROOT/administrator/js/oracle-evidence-existing-bridge-integration.js"
          node --check "$ROOT/administrator/js/oracle-evidence-auto-archive-safety-gates.js"
          node --check "$ROOT/administrator/js/post-boot-runtime-loader.js"
          python .github/scripts/agent_crypto_oracle_evidence_auto_archive_safety_test_406487.py
          python .github/scripts/agent_crypto_version_truth_guard_compat.py
          grep -F 'Build 40.6.487 · Administrator' "$ROOT/administrator/index.html"
          grep -F '"build": "40.6.487"' "$ROOT/administrator/build.json"
          grep -F 'oracle-evidence-auto-archive-safety-gates.js?v=40.6.487' "$ROOT/administrator/js/post-boot-runtime-loader.js"

      - name: Validate safety contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("public/agent_crypto_erith_ia/administrator/build.json").read_text(encoding="utf-8"))
          x=d["oracle_evidence_auto_archive_safety_gates_406487"]
          assert d["market_core"]=="38.15.11"
          assert d["strategy_a_modified"] is False
          assert d["oracle_math_changed"] is False
          assert d["storage_schema_changed"] is False
          assert d["retention_changed"] is False
          assert d["real_order"] is False
          assert x["bridge_enabled_required"] is True
          assert x["manual_mass_ingest_disabled"] is True
          assert x["exact_public_receipt_required"] is True
          assert x["chunk_rows"]==500
          assert x["sequential_only"] is True
          assert x["parallel_uploads"] is False
          assert x["wait_for_verified_before_next"] is True
          assert x["local_retention_allowed"] is False
          assert x["local_delete_api_exposed"] is False
          print("40.6.487 SAFETY CONTRACT PASS")
          PY

      - name: Mark test receipt PASS
        if: github.ref == 'refs/heads/main'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("public/agent_crypto_erith_ia/administrator/ORACLE_EVIDENCE_AUTO_ARCHIVE_SAFETY_TEST_40.6.487.json")
          d=json.loads(p.read_text(encoding="utf-8"))
          d["pass_pending_workflow"]=False
          d["pass"]=True
          d["cases"]={k:"PASS" for k in d["cases"]}
          p.write_text(json.dumps(d,indent=2,ensure_ascii=False)+"\n",encoding="utf-8")
          PY

      - name: Build ZIP
        if: github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          ROOT="public/agent_crypto_erith_ia/administrator"
          ZIP="$ROOT/AGENT_CRYPTO_ORACLE_EVIDENCE_AUTO_ARCHIVE_SAFETY_GATES_40.6.487.zip"
          rm -rf /tmp/ac487 "$ZIP" "$ZIP.sha256"
          mkdir -p /tmp/ac487
          cp --parents \
            .github/workflows/agent-crypto-package-406487.yml \
            .github/scripts/agent_crypto_oracle_evidence_auto_archive_safety_test_406487.py \
            .github/workflows/agent-crypto-package-406486.yml \
            "$ROOT/js/oracle-evidence-tiered-storage-foundation.js" \
            "$ROOT/js/oracle-evidence-existing-bridge-integration.js" \
            "$ROOT/js/oracle-evidence-auto-archive-safety-gates.js" \
            "$ROOT/js/post-boot-runtime-loader.js" \
            "$ROOT/js/strategy-a-audit-demand-loader.js" \
            "$ROOT/index.html" \
            "$ROOT/index-40.6.487.html" \
            "$ROOT/build.json" \
            "$ROOT/RELEASE.md" \
            "$ROOT/HANDOFF.md" \
            "$ROOT/HANDOFF_FINAL_40.6.487.md" \
            "$ROOT/ORACLE_EVIDENCE_AUTO_ARCHIVE_SAFETY_GATES_40.6.487.md" \
            "$ROOT/ORACLE_EVIDENCE_AUTO_ARCHIVE_SAFETY_TEST_40.6.487.json" \
            "$ROOT/PATCH_MANIFEST_40.6.487.txt" \
            /tmp/ac487/
          (cd /tmp/ac487 && zip -9 -r "$GITHUB_WORKSPACE/$ZIP" .)
          unzip -t "$ZIP"
          sha256sum "$ZIP" > "$ZIP.sha256"

      - name: Commit published ZIP
        if: github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          ROOT="public/agent_crypto_erith_ia/administrator"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            "$ROOT/ORACLE_EVIDENCE_AUTO_ARCHIVE_SAFETY_TEST_40.6.487.json" \
            "$ROOT/AGENT_CRYPTO_ORACLE_EVIDENCE_AUTO_ARCHIVE_SAFETY_GATES_40.6.487.zip" \
            "$ROOT/AGENT_CRYPTO_ORACLE_EVIDENCE_AUTO_ARCHIVE_SAFETY_GATES_40.6.487.zip.sha256"
          git commit -m "chore(package): publish Agent-Crypto 40.6.487 archive safety ZIP"
          git pull --rebase origin main
          git push origin HEAD:main
