name: Agent-Crypto 40.4.210 Market Asset Cache Truth Lock

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/agent-crypto-40-4-210-cache-truth.yml'

permissions:
  contents: write

concurrency:
  group: agent-crypto-40-4-210-cache-truth
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Synchronize and verify 40.4.209
        run: |
          git fetch origin main
          git reset --hard origin/main
          python .github/scripts/agent_crypto_version_truth_guard.py --expected-build 40.4.209
          grep -F './parallel-markets.css?v=40.4.204' public/agent_crypto_erith_ia/administrator/index.html
          grep -F './market-reading-depth.css?v=40.4.204' public/agent_crypto_erith_ia/administrator/index.html
          grep -F './js/parallel-markets.js?v=40.4.204' public/agent_crypto_erith_ia/administrator/index.html
          grep -F './js/market-reading-depth.js?v=administrator-build-40.4.204' public/agent_crypto_erith_ia/administrator/index.html
          grep -F 'const BUILD = "40.4.209";' public/agent_crypto_erith_ia/administrator/js/parallel-markets.js
          grep -F 'const BUILD = "40.4.209";' public/agent_crypto_erith_ia/administrator/js/market-reading-depth.js
          sha256sum \
            public/agent_crypto_erith_ia/administrator/js/parallel-markets.js \
            public/agent_crypto_erith_ia/administrator/parallel-markets.css \
            public/agent_crypto_erith_ia/administrator/js/market-reading-depth.js \
            public/agent_crypto_erith_ia/administrator/market-reading-depth.css \
            public/agent_crypto_erith_ia/administrator/js/market-stack.js \
            > /tmp/agent_crypto_404210_payload_hashes.txt

      - name: Apply bounded cache truth surgery
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          ROOT = Path('public/agent_crypto_erith_ia/administrator')
          INDEX = ROOT / 'index.html'
          BUILD_JSON = ROOT / 'build.json'
          PROMPT = Path('coordination/inter_ai_dialogues/agent_crypto/PROMPT_REPRISE_AETHER_AGENT_CRYPTO.md')
          LEDGER = Path('coordination/inter_ai_dialogues/agent_crypto/AGENT_CRYPTO_FIN_DE_FIL_AETHER.md')
          RELEASE_MANIFEST = Path('coordination/inter_ai_dialogues/agent_crypto/AGENT_CRYPTO_RELEASE_MANIFEST.md')
          RELEASE = 'MARKET ASSET CACHE TRUTH LOCK · VERSIONED MARKET PAYLOAD URL CONVERGENCE'
          STATUS = 'market_asset_cache_truth_lock_404210'

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'404210_FAIL {label}: expected 1 exact match, got {count}')
              return text.replace(old, new, 1)

          index = INDEX.read_text(encoding='utf-8')
          for old, new, label in (
              ('./parallel-markets.css?v=40.4.204', './parallel-markets.css?v=40.4.210', 'parallel CSS token'),
              ('./market-reading-depth.css?v=40.4.204', './market-reading-depth.css?v=40.4.210', 'reading CSS token'),
              ('./js/parallel-markets.js?v=40.4.204', './js/parallel-markets.js?v=40.4.210', 'parallel JS token'),
              ('./js/market-reading-depth.js?v=administrator-build-40.4.204', './js/market-reading-depth.js?v=administrator-build-40.4.210', 'reading JS token'),
          ):
              index = replace_once(index, old, new, label)
          INDEX.write_text(index, encoding='utf-8')

          build = json.loads(BUILD_JSON.read_text(encoding='utf-8'))
          if build.get('build') != '40.4.209' or build.get('engine') != '38.15.11':
              raise SystemExit(f"404210_FAIL unexpected build truth: {build.get('build')} / {build.get('engine')}")
          build['build'] = '40.4.210'
          build['release'] = RELEASE
          build['status'] = STATUS
          build['published'] = True
          BUILD_JSON.write_text(json.dumps(build, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          prompt = PROMPT.read_text(encoding='utf-8')
          prompt = replace_once(prompt, 'Version de reprise : **40.4.209**', 'Version de reprise : **40.4.210**', 'prompt build')
          anchor = '40.4.209 consolide la parité visuelle : identité couleur stable par actif, axe temporel réel, inspection historique, tableau permanent superposé sur Indices/Énergie/Cross, propagation couleur au rail, aux tableaux de lecture profonde et aux rôles leader/retard du Math Core.'
          addition = anchor + '\n\n40.4.210 est un verrou de **Cache Truth** : les quatre payloads marché effectivement modifiés par 40.4.205→40.4.209 (`parallel-markets.css`, `market-reading-depth.css`, `js/parallel-markets.js`, `js/market-reading-depth.js`) sont désormais appelés par des URL versionnées 40.4.210. Leur contenu fonctionnel reste inchangé ; `market-stack.js` et `version-truth.js` ne sont pas artificiellement republiés.'
          prompt = replace_once(prompt, anchor, addition, 'prompt cache truth note')
          PROMPT.write_text(prompt, encoding='utf-8')

          ledger = LEDGER.read_text(encoding='utf-8')
          ledger = replace_once(ledger, 'Version canonique de clôture : **40.4.209**', 'Version canonique de clôture : **40.4.210**', 'ledger build')
          ledger = replace_once(ledger, '## 1. Cascade finale 40.4.205 → 40.4.209', '## 1. Cascade finale 40.4.205 → 40.4.210', 'ledger cascade heading')
          bullet_209 = '- **40.4.209** — consolidation finale, Version Truth, cache-busting, contrat et reprise canonique.'
          bullet_210 = bullet_209 + '\n- **40.4.210** — Cache Truth lock : convergence explicite des URL versionnées des quatre payloads marché modifiés par la cascade 40.4.205→40.4.209 ; aucun changement de moteur, de données, de géométrie ou de contenu fonctionnel de ces payloads.'
          ledger = replace_once(ledger, bullet_209, bullet_210, 'ledger 210 bullet')
          protection_anchor = '- `agent_crypto_version_truth_guard.py` passé sur chaque build canonique.'
          protection_add = protection_anchor + '\n- 40.4.210 conserve à l’identique les hashes des payloads `parallel-markets.js/css`, `market-reading-depth.js/css` et `market-stack.js` ; seul leur adressage de cache utile converge, avec identité de release et manifestes synchronisés.'
          ledger = replace_once(ledger, protection_anchor, protection_add, 'ledger cache protection')
          LEDGER.write_text(ledger, encoding='utf-8')

          release_manifest = RELEASE_MANIFEST.read_text(encoding='utf-8')
          release_manifest = replace_once(release_manifest, 'Release courante : **40.4.209**', 'Release courante : **40.4.210**', 'release manifest build')
          release_manifest = replace_once(release_manifest, "commit final 40.4.209", "commit final 40.4.210", 'release manifest archive build')
          release_manifest += '\n40.4.210 est une release de **Cache Truth / publication identity** : elle ne change ni les données marché, ni les moteurs de graphique, ni la géométrie, ni le Market Core 38.15.11.\n'
          RELEASE_MANIFEST.write_text(release_manifest, encoding='utf-8')

          contract = {
              'kind': 'market_asset_cache_truth_lock',
              'build': '40.4.210',
              'parent_build': '40.4.209',
              'market_core': '38.15.11',
              'behavior_change': False,
              'data_change': False,
              'geometry_change': False,
              'payload_content_change': False,
              'cache_tokens': {
                  'parallel-markets.css': '40.4.210',
                  'market-reading-depth.css': '40.4.210',
                  'js/parallel-markets.js': '40.4.210',
                  'js/market-reading-depth.js': '40.4.210',
              },
              'intentionally_unchanged_tokens': ['js/market-stack.js', 'js/version-truth.js'],
          }
          Path('/tmp/agent_crypto_404210_contract.json').write_text(json.dumps(contract, ensure_ascii=False, indent=2), encoding='utf-8')
          PY

      - name: Publish canonical 40.4.210 identity
        run: |
          python .github/scripts/agent_crypto_release_driver.py \
            --build 40.4.210 \
            --parent 40.4.209 \
            --release 'MARKET ASSET CACHE TRUTH LOCK · VERSIONED MARKET PAYLOAD URL CONVERGENCE' \
            --status market_asset_cache_truth_lock_404210 \
            --lineage-note '40.4.210 market asset cache truth lock' \
            --contract-key market_asset_cache_truth_404210 \
            --contract-json /tmp/agent_crypto_404210_contract.json

      - name: Prove bounded release
        run: |
          python .github/scripts/agent_crypto_version_truth_guard.py \
            --expected-build 40.4.210 \
            --expected-release 'MARKET ASSET CACHE TRUTH LOCK · VERSIONED MARKET PAYLOAD URL CONVERGENCE'
          node --check public/agent_crypto_erith_ia/administrator/js/parallel-markets.js
          node --check public/agent_crypto_erith_ia/administrator/js/market-reading-depth.js
          sha256sum -c /tmp/agent_crypto_404210_payload_hashes.txt
          grep -F './parallel-markets.css?v=40.4.210' public/agent_crypto_erith_ia/administrator/index.html
          grep -F './market-reading-depth.css?v=40.4.210' public/agent_crypto_erith_ia/administrator/index.html
          grep -F './js/parallel-markets.js?v=40.4.210' public/agent_crypto_erith_ia/administrator/index.html
          grep -F './js/market-reading-depth.js?v=administrator-build-40.4.210' public/agent_crypto_erith_ia/administrator/index.html
          ! grep -F './parallel-markets.css?v=40.4.204' public/agent_crypto_erith_ia/administrator/index.html
          ! grep -F './market-reading-depth.css?v=40.4.204' public/agent_crypto_erith_ia/administrator/index.html
          ! grep -F './js/parallel-markets.js?v=40.4.204' public/agent_crypto_erith_ia/administrator/index.html
          ! grep -F './js/market-reading-depth.js?v=administrator-build-40.4.204' public/agent_crypto_erith_ia/administrator/index.html
          test -z "$(git status --porcelain -- public/agent_crypto_erith_ia/data)"

      - name: Commit release and retire temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/agent-crypto-40-4-210-cache-truth.yml
          python - <<'PY'
          import subprocess
          allowed = {
              '.github/workflows/agent-crypto-40-4-210-cache-truth.yml',
              'public/agent_crypto_erith_ia/administrator/index.html',
              'public/agent_crypto_erith_ia/administrator/app.js',
              'public/agent_crypto_erith_ia/administrator/js/app.js',
              'public/agent_crypto_erith_ia/administrator/version.json',
              'public/agent_crypto_erith_ia/administrator/administrator-version.json',
              'public/agent_crypto_erith_ia/administrator/build.json',
              'coordination/inter_ai_dialogues/agent_crypto/PROMPT_REPRISE_AETHER_AGENT_CRYPTO.md',
              'coordination/inter_ai_dialogues/agent_crypto/AGENT_CRYPTO_FIN_DE_FIL_AETHER.md',
              'coordination/inter_ai_dialogues/agent_crypto/AGENT_CRYPTO_RELEASE_MANIFEST.md',
          }
          changed = set(filter(None, subprocess.check_output(['git','diff','--name-only'], text=True).splitlines()))
          extra = sorted(changed - allowed)
          missing = sorted({
              'public/agent_crypto_erith_ia/administrator/index.html',
              'public/agent_crypto_erith_ia/administrator/app.js',
              'public/agent_crypto_erith_ia/administrator/js/app.js',
              'public/agent_crypto_erith_ia/administrator/version.json',
              'public/agent_crypto_erith_ia/administrator/administrator-version.json',
              'public/agent_crypto_erith_ia/administrator/build.json',
          } - changed)
          if extra or missing:
              raise SystemExit(f'404210_FAIL diff scope extra={extra} missing={missing}')
          print('404210_DIFF_SCOPE_PASS', sorted(changed))
          PY
          git add -A
          git commit -m 'release(agent-crypto): 40.4.210 market asset cache truth lock'
          git pull --rebase origin main
          python .github/scripts/agent_crypto_version_truth_guard.py \
            --expected-build 40.4.210 \
            --expected-release 'MARKET ASSET CACHE TRUTH LOCK · VERSIONED MARKET PAYLOAD URL CONVERGENCE'
          git push origin HEAD:main
