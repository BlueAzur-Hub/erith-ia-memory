name: Atlas Public Metals Archive

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */4 * * *"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/atlas-public-metals-archive.yml"
      - "public/agent_crypto_erith_ia/tools/collect_public_metals.py"

permissions:
  contents: write

concurrency:
  group: atlas-public-metals-archive-${{ github.ref }}
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install collector dependency
        run: python -m pip install --disable-pip-version-check requests==2.32.5

      - name: Collect public metals data
        run: >-
          python public/agent_crypto_erith_ia/tools/collect_public_metals.py
          --root public/agent_crypto_erith_ia
          --timeout 25

      - name: Validate public archive contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("public/agent_crypto_erith_ia/data/metals")
          status_path = root / "status.json"
          manifest_path = root / "collector_manifest.json"
          if not status_path.is_file() or not manifest_path.is_file():
              raise SystemExit("status.json or collector_manifest.json missing")

          status = json.loads(status_path.read_text(encoding="utf-8"))
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          if status.get("schema") != "agent_crypto_metals_collector_status_v1":
              raise SystemExit("invalid status schema")
          if status.get("security", {}).get("api_key_present_in_public_files") is not False:
              raise SystemExit("public security lock missing")
          if status.get("security", {}).get("manual_ryzen_publication_required") is not False:
              raise SystemExit("manual Ryzen publication lock missing")
          if manifest.get("integrity", {}).get("crypto_data_untouched") is not True:
              raise SystemExit("Crypto separation lock missing")

          state = status.get("status")
          if state == "ready":
              required = [
                  root / "latest.json",
                  root / "history" / "public_1y.json",
                  root / "history" / "index.json",
                  root / "fx" / "usd_eur.json",
              ]
              required += [root / "series" / f"{name}.json" for name in (
                  "gold", "silver", "platinum", "palladium", "copper"
              )]
              for path in required:
                  if not path.is_file():
                      raise SystemExit(f"missing generated file: {path}")
                  json.loads(path.read_text(encoding="utf-8"))

              latest = json.loads((root / "latest.json").read_text(encoding="utf-8"))
              history = json.loads((root / "history" / "public_1y.json").read_text(encoding="utf-8"))
              if latest.get("assets_count") != 5:
                  raise SystemExit("current basket is not 5/5")
              if {row.get("asset_id") for row in latest.get("quotes", [])} != {
                  "gold", "silver", "platinum", "palladium", "copper"
              }:
                  raise SystemExit("current basket IDs are invalid")
              if any(row.get("price_eur") is None for row in latest.get("quotes", [])):
                  raise SystemExit("EUR conversion missing")
              if history.get("count", 0) < 200:
                  raise SystemExit("one-year history is insufficient")
              if any(item.get("assets_count") != 5 for item in history.get("snapshots", [])):
                  raise SystemExit("history contains an incomplete basket")
              for name in ("gold", "silver", "platinum", "palladium", "copper"):
                  series = json.loads((root / "series" / f"{name}.json").read_text(encoding="utf-8"))
                  if series.get("points_count", 0) < 200:
                      raise SystemExit(f"series {name} is insufficient")
          elif state in {"degraded", "unavailable"}:
              fallback = status.get("fallback") or {}
              if fallback.get("invented_replacement_values") is not False:
                  raise SystemExit("degraded fallback integrity is invalid")
          else:
              raise SystemExit(f"unsupported collector state: {state}")

          forbidden = ("x-api-key", "authorization:", "bearer ", "github_token", "ghp_", "github_pat_")
          for path in root.rglob("*.json"):
              text = path.read_text(encoding="utf-8").lower()
              if any(token in text for token in forbidden):
                  raise SystemExit(f"forbidden secret marker in {path}")

          print({
              "status": state,
              "assets": status.get("assets_received"),
              "history": (status.get("history") or {}).get("snapshots"),
              "last_error": status.get("last_error"),
          })
          PY

      - name: Commit public metals archive
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/agent_crypto_erith_ia/data/metals
          if git diff --cached --quiet; then
            echo "No metals data change to commit."
            exit 0
          fi
          git commit -m "archive public metals market snapshot"
          git push
