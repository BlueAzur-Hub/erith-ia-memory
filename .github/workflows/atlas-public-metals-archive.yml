name: Atlas Public Metals Archive

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */4 * * *"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/atlas-public-metals-archive.yml"
      - "public/agent_crypto_erith_ia/tools/collect_public_metals.py"

permissions:
  contents: write

concurrency:
  group: atlas-public-metals-archive-${{ github.ref }}
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install collector dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          requests==2.32.5
          curl-cffi==0.15.0

      - name: Collect current quotes and independent history
        id: collect
        continue-on-error: true
        run: >-
          python public/agent_crypto_erith_ia/tools/collect_public_metals.py
          --root public/agent_crypto_erith_ia
          --timeout 25
          --pacing 1.6

      - name: Validate public archive contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("public/agent_crypto_erith_ia/data/metals")
          status_path = root / "status.json"
          manifest_path = root / "collector_manifest.json"
          if not status_path.is_file() or not manifest_path.is_file():
              raise SystemExit("status.json or collector_manifest.json missing")

          status = json.loads(status_path.read_text(encoding="utf-8"))
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          if status.get("schema") != "agent_crypto_metals_collector_status_v1":
              raise SystemExit("invalid status schema")
          if status.get("status") not in {"ready", "partial", "degraded", "unavailable"}:
              raise SystemExit("unsupported collector state")
          if status.get("security", {}).get("api_key_present_in_public_files") is not False:
              raise SystemExit("public security lock missing")
          if status.get("security", {}).get("manual_ryzen_publication_required") is not False:
              raise SystemExit("manual Ryzen publication lock missing")
          if status.get("integrity", {}).get("current_and_history_decoupled") is not True:
              raise SystemExit("current/history decoupling lock missing")
          if manifest.get("integrity", {}).get("crypto_data_untouched") is not True:
              raise SystemExit("Crypto separation lock missing")

          current_count = int(status.get("assets_received") or 0)
          if current_count:
              latest_path = root / "latest.json"
              if not latest_path.is_file():
                  raise SystemExit("latest.json missing while current quotes are available")
              latest = json.loads(latest_path.read_text(encoding="utf-8"))
              if int(latest.get("assets_count") or 0) != current_count:
                  raise SystemExit("current quote count mismatch")
              if latest.get("integrity", {}).get("no_invented_values") is not True:
                  raise SystemExit("current anti-invention lock missing")

          spot_path = root / "history" / "spot_48h.json"
          if not spot_path.is_file():
              raise SystemExit("spot_48h.json missing")
          spot = json.loads(spot_path.read_text(encoding="utf-8"))
          if spot.get("schema") != "agent_crypto_metals_spot_history_v1":
              raise SystemExit("invalid spot history schema")
          if spot.get("integrity", {}).get("fabricated_points_forbidden") is not True:
              raise SystemExit("spot anti-invention lock missing")
          if spot.get("integrity", {}).get("futures_mixing_forbidden") is not True:
              raise SystemExit("spot/futures separation lock missing")
          snapshots = spot.get("snapshots") or []
          if int(spot.get("count") or 0) != len(snapshots):
              raise SystemExit("spot history count mismatch")
          for item in snapshots:
              if int(item.get("assets_count") or 0) != 5:
                  raise SystemExit("incomplete basket in spot history")
              if item.get("provider_id") != "gold_api":
                  raise SystemExit("non-Gold API snapshot in spot history")
              quotes = item.get("quotes") or []
              if len(quotes) != 5 or any(row.get("instrument_type") != "spot_reference" for row in quotes):
                  raise SystemExit("invalid spot quote basket")

          intraday_path = root / "history" / "intraday_24h.json"
          if not intraday_path.is_file():
              raise SystemExit("intraday_24h.json missing")
          intraday = json.loads(intraday_path.read_text(encoding="utf-8"))
          if intraday.get("schema") != "agent_crypto_metals_intraday_history_v1":
              raise SystemExit("invalid intraday history schema")
          integrity = intraday.get("integrity") or {}
          if integrity.get("fabricated_points_forbidden") is not True:
              raise SystemExit("intraday anti-invention lock missing")
          if integrity.get("gold_api_current_quote_mixing_forbidden") is not True:
              raise SystemExit("intraday/current spot separation lock missing")
          series = intraday.get("series") or []
          if len(series) != 5 or int(intraday.get("series_count") or 0) != 5:
              raise SystemExit("intraday five-asset series missing")
          ids = set()
          for item in series:
              ids.add(item.get("asset_id"))
              if item.get("source_id") != "yahoo_finance":
                  raise SystemExit("non-Yahoo source in intraday history")
              if item.get("instrument_type") != "future_continuous":
                  raise SystemExit("non-Futures instrument in intraday history")
              if item.get("interval") != "5m":
                  raise SystemExit("unexpected intraday interval")
              points = item.get("points") or []
              if int(item.get("points_count") or 0) != len(points) or len(points) < 2:
                  raise SystemExit("insufficient intraday points")
              if any(not row.get("time") or not isinstance(row.get("close"), (int, float)) for row in points):
                  raise SystemExit("invalid intraday point")
          if ids != {"gold", "silver", "platinum", "palladium", "copper"}:
              raise SystemExit("intraday asset set mismatch")

          history = status.get("history") or {}
          if history.get("available") is True:
              required = [
                  root / "history" / "public_1y.json",
                  root / "history" / "index.json",
              ]
              required += [root / "series" / f"{name}.json" for name in (
                  "gold", "silver", "platinum", "palladium", "copper"
              )]
              for path in required:
                  if not path.is_file():
                      raise SystemExit(f"missing generated history file: {path}")
                  json.loads(path.read_text(encoding="utf-8"))
              public_history = json.loads((root / "history" / "public_1y.json").read_text(encoding="utf-8"))
              if int(public_history.get("count") or 0) < 200:
                  raise SystemExit("one-year history is insufficient")

          forbidden = ("x-api-key", "authorization:", "bearer ", "github_token", "ghp_", "github_pat_")
          for path in root.rglob("*.json"):
              text = path.read_text(encoding="utf-8").lower()
              if any(token in text for token in forbidden):
                  raise SystemExit(f"forbidden secret marker in {path}")

          print({
              "status": status.get("status"),
              "current_quotes": current_count,
              "history_available": history.get("available"),
              "history_preserved": history.get("preserved"),
              "spot_snapshots": len(snapshots),
              "spot_span_hours": spot.get("span_hours", 0),
              "last_error": status.get("last_error"),
          })
          PY

      - name: Write workflow summary
        if: always()
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          status = json.loads(Path("public/agent_crypto_erith_ia/data/metals/status.json").read_text(encoding="utf-8"))
          history = status.get("history") or {}
          intraday = status.get("intraday_24h") or {}
          spot = status.get("spot_history") or {}
          print("## Atlas Public Metals Archive · Build 28.2.67")
          print(f"- Current quotes: **{status.get('assets_received', 0)}/5**")
          print(f"- Current state: **{status.get('status')}**")
          print(f"- History available: **{bool(history.get('available'))}**")
          print(f"- History preserved: **{bool(history.get('preserved'))}**")
          print(f"- History snapshots: **{history.get('snapshots', 0)}**")
          print(f"- Intraday Futures ready: **{bool(intraday.get('available'))}**")
          print(f"- Intraday Futures assets: **{intraday.get('assets', 0)}/5**")
          print(f"- Intraday interval: **{intraday.get('interval', '—')}**")
          print(f"- Spot snapshots journal (48 h): **{spot.get('snapshots', 0)}**")
          print(f"- Spot coverage: **{float(spot.get('span_hours') or 0):.1f} h**")
          print(f"- 24 h complete: **{bool(spot.get('complete_24h'))}**")
          if status.get("last_error"):
              print(f"- Collector warning: `{status['last_error'][:1000]}`")
          PY

      - name: Commit public metals archive
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/agent_crypto_erith_ia/data/metals
          if git diff --cached --quiet; then
            echo "No metals data change to commit."
            exit 0
          fi
          git commit -m "archive public metals market snapshot"
          git push

      - name: Require five current public quotes
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          status = json.loads(Path("public/agent_crypto_erith_ia/data/metals/status.json").read_text(encoding="utf-8"))
          count = int(status.get("assets_received") or 0)
          if count != 5:
              raise SystemExit(f"Current metals basket incomplete: {count}/5")
          print(f"Current metals basket ready: {count}/5")
          history = status.get("history") or {}
          if history.get("available") is not True:
              print("History remains unavailable or preserved; current quotes are still published.")
          PY
