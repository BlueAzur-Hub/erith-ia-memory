name: Chronos functional de-versioning

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/agent-crypto-40607-chronos-owner-consolidation.yml'

permissions:
  contents: write

concurrency:
  group: chronos-functional-deversioning
  cancel-in-progress: false

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout canonical main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Remove version suffixes from live Chronos contracts
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path('public/agent_crypto_erith_ia/administrator')
          runtime_path = root / 'runtime-shell.html'
          index_path = root / 'index.html'

          runtime = runtime_path.read_text(encoding='utf-8')
          index = index_path.read_text(encoding='utf-8')

          replacements = [
              ('atlasDebtSettlement4055Runtime', 'atlasDebtSettlementRuntime', 1),
              ('[data-chrono40341="${key}"]', '[data-chrono="${key}"]', 1),
              ('__AGENT_CRYPTO_ASTROCYCLE_4055__', '__AGENT_CRYPTO_ASTROCYCLE__', 1),
              ('lastCelestialRole40288', 'lastCelestialRole', 3),
              ('lastMultiCollectorMinute40465', 'lastMultiCollectorMinute', 3),
              ('__AGENT_CRYPTO_CELESTIAL_CADENCE_40465__', '__AGENT_CRYPTO_CELESTIAL_CADENCE__', 1),
              ('const BUILD="40.3.14";', 'const BUILD=String(globalThis.AGENT_CRYPTO_EFFECTIVE_BUILD||globalThis.AGENT_CRYPTO_BUILD||"runtime");', 1),
              ('build:"40.4.94",open_cadence_ms', 'build:BUILD,open_cadence_ms', 1),
          ]

          for old, new, expected in replacements:
              count = runtime.count(old)
              if count != expected:
                  raise SystemExit(f'Expected {expected} runtime occurrence(s) for {old!r}, found {count}')
              runtime = runtime.replace(old, new)

          shim = '      out = out.replace(/data-chrono40341/g, "data-chrono");\n'
          if index.count(shim) != 1:
              raise SystemExit(f'Expected exactly one index Chronos shim, found {index.count(shim)}')
          index = index.replace(shim, '', 1)

          forbidden = (
              'data-chrono40341',
              'atlasDebtSettlement4055Runtime',
              '__AGENT_CRYPTO_ASTROCYCLE_4055__',
              'lastCelestialRole40288',
              'lastMultiCollectorMinute40465',
              '__AGENT_CRYPTO_CELESTIAL_CADENCE_40465__',
              'const BUILD="40.3.14";',
              'build:"40.4.94",open_cadence_ms',
          )
          for token in forbidden:
              if token in runtime:
                  raise SystemExit(f'Forbidden Chronos fossil remains in runtime: {token}')
          if 'data-chrono40341' in index:
              raise SystemExit('Chronos boot shim/fossil still present in index.html')

          required = (
              'span.dataset.chrono=key',
              '[data-chrono="${key}"]',
              'n.id="atlasCelestialClockHeader"',
              'day.dataset.planet=astroPlanetTone',
              'hour.dataset.planet=astroPlanetTone',
              '__AGENT_CRYPTO_ASTROCYCLE__',
              '__AGENT_CRYPTO_CELESTIAL_CADENCE__',
              'lastCelestialRole',
              'lastMultiCollectorMinute',
              'build:BUILD,open_cadence_ms',
          )
          for token in required:
              if token not in runtime:
                  raise SystemExit(f'Required stable Chronos contract missing: {token}')

          if '<meta name="agent-crypto-loaded-build" content="40.6.124" />' not in index:
              raise SystemExit('Loaded build 40.6.124 changed unexpectedly')
          if '<meta name="agent-crypto-engine-build" content="38.15.11" />' not in index:
              raise SystemExit('Market Core 38.15.11 changed unexpectedly')

          runtime_path.write_text(runtime, encoding='utf-8')
          index_path.write_text(index, encoding='utf-8')
          PY

      - name: Static proof
        shell: bash
        run: |
          set -euo pipefail
          runtime='public/agent_crypto_erith_ia/administrator/runtime-shell.html'
          index='public/agent_crypto_erith_ia/administrator/index.html'
          ! grep -Fq 'data-chrono40341' "$runtime"
          ! grep -Fq 'atlasDebtSettlement4055Runtime' "$runtime"
          ! grep -Fq '__AGENT_CRYPTO_ASTROCYCLE_4055__' "$runtime"
          ! grep -Fq 'lastCelestialRole40288' "$runtime"
          ! grep -Fq 'lastMultiCollectorMinute40465' "$runtime"
          ! grep -Fq '__AGENT_CRYPTO_CELESTIAL_CADENCE_40465__' "$runtime"
          ! grep -Fq 'data-chrono40341' "$index"
          grep -Fq '[data-chrono="${key}"]' "$runtime"
          grep -Fq '__AGENT_CRYPTO_ASTROCYCLE__' "$runtime"
          grep -Fq '__AGENT_CRYPTO_CELESTIAL_CADENCE__' "$runtime"
          grep -Fq 'agent-crypto-loaded-build" content="40.6.124"' "$index"
          grep -Fq 'agent-crypto-engine-build" content="38.15.11"' "$index"

      - name: Commit surgical Chronos cleanup and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'BlueAzur-Hub'
          git config user.email 'Blue.Azur@protonmail.com'
          git rm .github/workflows/agent-crypto-40607-chronos-owner-consolidation.yml
          git add \
            public/agent_crypto_erith_ia/administrator/runtime-shell.html \
            public/agent_crypto_erith_ia/administrator/index.html
          git commit -m 'refactor(chronos): remove versioned functional identifiers'
          git push origin main
