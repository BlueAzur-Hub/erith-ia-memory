name: Agent-Crypto 40.4.255 Technical Reading ownership audit

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/agent-crypto-404255-audit.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan Technical Reading ownership
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, json

          base=Path('public/agent_crypto_erith_ia/administrator')
          version=json.loads((base/'version.json').read_text(encoding='utf-8'))
          assert version['build']=='40.4.254', version['build']
          assert version['engine']['reference_build']=='38.15.11'

          targets=[
            '#detailPanel',
            'detail-project-visual',
            'admin-tech-portrait-r3',
            'atlas-tech-static-cycle',
            'atlas-tech-letterbox-fill-40230',
            'atlas-tech-frame-lock-40259',
            'atlas-classic-web-tech-40261',
            'atlas-tech-static-toolbar',
            'Agent-Crypto · Aerith-10',
            '--admin-tech-x',
            '--admin-tech-y',
            'object-fit',
          ]
          files=[]
          for ext in ('*.css','*.html','*.js'):
            files.extend(base.rglob(ext))
          files=sorted(set(files))
          out=[]
          out.append('# Agent-Crypto 40.4.255 pre-op Technical Reading ownership audit')
          out.append('')
          out.append(f'Build: {version["build"]} · Market Core: {version["engine"]["reference_build"]}')
          out.append('')
          for token in targets:
            matches=[]
            for p in files:
              text=p.read_text(encoding='utf-8',errors='replace')
              for i,line in enumerate(text.splitlines(),1):
                if token in line:
                  matches.append((str(p),i,line.strip()))
            out.append(f'## TOKEN {token!r} — {len(matches)} occurrence(s)')
            for p,i,line in matches:
              out.append(f'- {p}:{i}: {line}')
            out.append('')

          # Focused CSS/inline-style blocks containing Technical Reading selectors.
          block_re=re.compile(r'([^{}]*(?:#detailPanel|detail-project-visual|admin-tech-portrait-r3|atlas-tech-static-toolbar)[^{}]*)\{([^{}]*)\}',re.S)
          prop_names=('position','display','inset','top','right','bottom','left','width','height','min-width','min-height','max-width','max-height','margin','padding','flex','overflow','object-fit','object-position','transform','background','opacity','filter','z-index','isolation','pointer-events')
          out.append('# Focused CSS blocks')
          for p in files:
            if p.suffix not in ('.css','.html'): continue
            text=p.read_text(encoding='utf-8',errors='replace')
            found=0
            for m in block_re.finditer(text):
              selector=' '.join(m.group(1).split())[-500:]
              body=m.group(2)
              props=[]
              for name in prop_names:
                for pm in re.finditer(rf'(?<![-\w]){re.escape(name)}\s*:\s*([^;}}]+)',body,re.I):
                  props.append(f'{name}: {pm.group(1).strip()}')
              if props:
                if not found:
                  out.append(f'## {p}')
                  found=1
                line=text.count('\n',0,m.start())+1
                out.append(f'### line {line} · {selector}')
                out.extend(f'- {x}' for x in props)
          out.append('')

          # JS writers / ownership evidence.
          js_patterns=[
            r'\.src\s*=', r'setAttribute\(["\']src', r'classList\.add\([^\n]*atlas-tech',
            r'setProperty\(["\']--admin-tech-[xy]', r'adminTechnicalPrivateImageInput',
            r'AgentCryptoPrivateVisuals40269', r'function\s+ensurePortrait', r'function\s+ensureTechImg',
            r'function\s+setFraming', r'function\s+swapUrl',
          ]
          out.append('# JS ownership/writer scan')
          for p in files:
            if p.suffix not in ('.js','.html'): continue
            lines=p.read_text(encoding='utf-8',errors='replace').splitlines()
            hits=[]
            for i,line in enumerate(lines,1):
              if any(re.search(pat,line) for pat in js_patterns):
                hits.append((i,line.strip()))
            if hits:
              out.append(f'## {p} — {len(hits)} hit(s)')
              for i,line in hits:
                out.append(f'- {i}: {line[:900]}')

          report='\n'.join(out)+'\n'
          Path('/tmp/AGENT_CRYPTO_40_4_255_TECHNICAL_READING_OWNERSHIP_AUDIT.md').write_text(report,encoding='utf-8')
          print(report)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: AGENT_CRYPTO_40_4_255_TECHNICAL_READING_OWNERSHIP_AUDIT
          path: /tmp/AGENT_CRYPTO_40_4_255_TECHNICAL_READING_OWNERSHIP_AUDIT.md
          if-no-files-found: error
