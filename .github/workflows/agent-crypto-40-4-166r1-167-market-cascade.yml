name: Agent-Crypto Market Cascade 40.4.167

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/agent-crypto-40-4-166r1-167-market-cascade.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cascade:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build 40.4.166R1 truth seal
        run: |
          set -euo pipefail
          python .github/scripts/agent_crypto_40_4_166r1_167.py r1
          node --check public/agent_crypto_erith_ia/administrator/js/markets-domain-contract.js
          python .github/scripts/agent_crypto_40_4_166r1_167.py validate-r1
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/agent_crypto_erith_ia/administrator/js/markets-domain-contract.js
          git add public/agent_crypto_erith_ia/administrator/architecture/markets-domain-canonical.json
          git add public/agent_crypto_erith_ia/administrator/version.json
          git add public/agent_crypto_erith_ia/administrator/administrator-version.json
          git commit -m "fix Agent-Crypto 40.4.166R1 seal Parallel Markets truth"

      - name: Build 40.4.167 cascade and viewport fit
        run: |
          set -euo pipefail
          python .github/scripts/agent_crypto_40_4_166r1_167.py 167
          node --check public/agent_crypto_erith_ia/administrator/app.js
          node --check public/agent_crypto_erith_ia/administrator/js/app.js
          node --check public/agent_crypto_erith_ia/administrator/js/markets-domain-contract.js
          python .github/scripts/agent_crypto_40_4_166r1_167.py validate-167
          rm .github/scripts/agent_crypto_40_4_166r1_167.py
          rm .github/workflows/agent-crypto-40-4-166r1-167-market-cascade.yml
          git add -A
          git commit -m "release Agent-Crypto 40.4.167 Market Cascade Shell viewport fit"

      - name: Push cascade
        run: |
          set -euo pipefail
          git push origin HEAD:main
