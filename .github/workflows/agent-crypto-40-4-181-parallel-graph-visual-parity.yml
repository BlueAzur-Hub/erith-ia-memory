name: Agent-Crypto 40.4.181 Parallel Graph Visual Parity

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/agent-crypto-40-4-181-parallel-graph-visual-parity.yml'

permissions:
  contents: write

concurrency:
  group: agent-crypto-release-control
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebase latest main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main

      - name: Apply bounded parallel graph visual parity
        shell: bash
        run: |
          set -euo pipefail
          css='public/agent_crypto_erith_ia/administrator/parallel-markets.css'
          if grep -Fq '40.4.181 — PARALLEL GRAPH VISUAL PARITY' "$css"; then
            echo '40.4.181 CSS block already present'
          else
            cat >> "$css" <<'CSS'

/* =========================================================
   40.4.181 — PARALLEL GRAPH VISUAL PARITY
   Crypto remains the geometry and information-density master.
   Presentation only: no chart engine, data, Atlas, timer, fetch,
   storage, Market Core or financial behavior change.
   ========================================================= */
@media (min-width:901px){
  .atlas-parallel-live-shell{
    position:relative;
    grid-template-rows:auto minmax(0,1fr);
    gap:8px;
    overflow:hidden;
  }
  .atlas-parallel-live-stage{
    grid-row:2;
    min-height:0;
    height:100%;
    border-color:color-mix(in srgb,var(--cyclic-market-accent,#a9b9c7) 25%,rgba(120,180,210,.18));
    background:
      radial-gradient(circle at 76% 18%,color-mix(in srgb,var(--cyclic-market-accent,#a9b9c7) 10%,transparent),transparent 34%),
      linear-gradient(180deg,rgba(0,4,10,.60),rgba(0,11,18,.46));
  }
  #atlasParallelLiveCanvas404170{
    min-height:0;
    height:100%!important;
  }
  .atlas-parallel-live-summary{
    position:absolute;
    z-index:4;
    top:68px;
    left:24px;
    right:auto;
    width:auto;
    max-width:min(720px,calc(100% - 48px));
    min-height:34px;
    box-sizing:border-box;
    pointer-events:none;
    border-color:color-mix(in srgb,var(--cyclic-market-accent,#a9b9c7) 38%,rgba(255,255,255,.08));
    background:linear-gradient(90deg,color-mix(in srgb,var(--cyclic-market-accent,#a9b9c7) 14%,rgba(3,10,18,.91)),rgba(3,10,18,.86));
    box-shadow:0 8px 24px rgba(0,0,0,.20),inset 0 0 0 1px rgba(255,255,255,.02);
  }
  .atlas-parallel-live-summary b{
    color:color-mix(in srgb,var(--cyclic-market-accent,#a9b9c7) 78%,white);
  }
  .atlas-parallel-live-legend{
    position:absolute;
    z-index:4;
    top:112px;
    left:24px;
    right:24px;
    width:auto;
    max-width:calc(100% - 48px);
    pointer-events:none;
  }
  .atlas-parallel-live-legend span{
    background:rgba(3,10,18,.78);
    border-color:color-mix(in srgb,var(--cyclic-market-accent,#a9b9c7) 18%,rgba(255,255,255,.08));
    box-shadow:0 5px 14px rgba(0,0,0,.15);
  }
}

.atlas-parallel-periods button{
  border-radius:999px;
  min-height:28px;
  padding:5px 10px;
  letter-spacing:.02em;
}
.atlas-parallel-periods button.is-active{
  border-color:color-mix(in srgb,var(--cyclic-market-accent,#b9c7d3) 72%,rgba(255,255,255,.16));
  background:linear-gradient(180deg,color-mix(in srgb,var(--cyclic-market-accent,#b9c7d3) 24%,rgba(8,16,28,.82)),rgba(8,16,28,.84));
}
html[data-cyclic-market-mode="parallel"] #atlasCyclicMarketInertDetail404168{
  border-color:color-mix(in srgb,var(--cyclic-market-accent,#a9b9c7) 28%,rgba(255,255,255,.08))!important;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.018),0 14px 36px rgba(0,0,0,.16);
}
html[data-cyclic-market-mode="parallel"] #atlasCyclicMarketInertDetail404168 header strong{
  color:color-mix(in srgb,var(--cyclic-market-accent,#a9b9c7) 52%,#fff1d0)!important;
}

@media (max-width:900px){
  .atlas-parallel-live-shell{
    position:relative;
    grid-template-rows:auto minmax(360px,1fr) auto auto;
  }
  .atlas-parallel-live-summary,
  .atlas-parallel-live-legend{
    position:static;
    width:auto;
    max-width:none;
    pointer-events:auto;
  }
}
CSS
          fi
          grep -Fq '40.4.181 — PARALLEL GRAPH VISUAL PARITY' "$css"
          grep -Fq 'grid-template-rows:auto minmax(0,1fr)' "$css"
          grep -Fq 'position:absolute' "$css"

      - name: Align secondary market version truth
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          base=Path('public/agent_crypto_erith_ia/administrator')
          for rel in ('js/market-stack.js','js/parallel-markets.js'):
              path=base/rel
              text=path.read_text(encoding='utf-8')
              old='const BUILD = "40.4.180";'
              if text.count(old) != 1:
                  raise SystemExit(f'{rel}: expected one 40.4.180 BUILD, got {text.count(old)}')
              path.write_text(text.replace(old,'const BUILD = "40.4.181";',1),encoding='utf-8')
          index=base/'index.html'
          text=index.read_text(encoding='utf-8')
          old='administrator-build-40.4.180'
          # Four secondary market assets are outside the canonical release driver's two app tokens.
          # Replace every current token now; the release driver writes the same target for canonical assets.
          if text.count(old) < 6:
              raise SystemExit(f'index 40.4.180 asset token count unexpectedly low: {text.count(old)}')
          index.write_text(text.replace(old,'administrator-build-40.4.181'),encoding='utf-8')
          PY
          node --check public/agent_crypto_erith_ia/administrator/js/market-stack.js
          node --check public/agent_crypto_erith_ia/administrator/js/parallel-markets.js

      - name: Write canonical 40.4.181 identity
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/contract-404181.json <<'JSON'
          {
            "schema": "erith.admin.parallel-graph-visual-parity.v1",
            "build": "40.4.181",
            "parent_build": "40.4.180",
            "crypto_geometry_master": true,
            "single_cockpit_surface": true,
            "parallel_domains": ["indices", "energy", "cross-market"],
            "desktop_summary_overlay": true,
            "desktop_legend_overlay": true,
            "mobile_stacked_fallback": true,
            "domain_right_rail_preserved": true,
            "data_contract_changed": false,
            "chart_engine_changed": false,
            "market_core_modified": false,
            "atlas_runtime_modified": false,
            "new_timer": false,
            "new_observer": false,
            "new_fetch": false,
            "financial_execution_added": false
          }
          JSON
          python .github/scripts/agent_crypto_release_driver.py \
            --build 40.4.181 --parent 40.4.180 \
            --release 'PARALLEL GRAPH VISUAL PARITY · CRYPTO MASTER GRAMMAR' \
            --status parallel_graph_visual_parity_crypto_master_grammar \
            --contract-key parallel_graph_visual_parity_404181 \
            --contract-json /tmp/contract-404181.json \
            --lineage-note '40.4.181 Parallel Graph Visual Parity: Crypto geometry remains master; Indices, Energy and Cross preserve their real data engines while summary and legend move into a compact in-chart desktop grammar; mobile remains stacked.'

      - name: Validate release payload
        shell: bash
        run: |
          set -euo pipefail
          node --check public/agent_crypto_erith_ia/administrator/app.js
          node --check public/agent_crypto_erith_ia/administrator/js/app.js
          node --check public/agent_crypto_erith_ia/administrator/js/market-stack.js
          node --check public/agent_crypto_erith_ia/administrator/js/parallel-markets.js
          python .github/scripts/agent_crypto_version_truth_guard.py --expected-build 40.4.181 --expected-release 'PARALLEL GRAPH VISUAL PARITY · CRYPTO MASTER GRAMMAR'
          grep -Fq 'const BUILD = "40.4.181";' public/agent_crypto_erith_ia/administrator/js/market-stack.js
          grep -Fq 'const BUILD = "40.4.181";' public/agent_crypto_erith_ia/administrator/js/parallel-markets.js
          grep -Fq '40.4.181 — PARALLEL GRAPH VISUAL PARITY' public/agent_crypto_erith_ia/administrator/parallel-markets.css
          rm -rf .github/scripts/__pycache__
          echo 'REREAD_404181_PASS'

      - name: Commit release and retire one-shot
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/agent-crypto-40-4-181-parallel-graph-visual-parity.yml
          git add public/agent_crypto_erith_ia/administrator/parallel-markets.css \
                  public/agent_crypto_erith_ia/administrator/js/market-stack.js \
                  public/agent_crypto_erith_ia/administrator/js/parallel-markets.js \
                  public/agent_crypto_erith_ia/administrator/app.js \
                  public/agent_crypto_erith_ia/administrator/js/app.js \
                  public/agent_crypto_erith_ia/administrator/index.html \
                  public/agent_crypto_erith_ia/administrator/version.json \
                  public/agent_crypto_erith_ia/administrator/administrator-version.json
          git diff --cached --check
          git commit -m 'release Agent-Crypto 40.4.181 parallel graph visual parity'

      - name: Push with bounded race recovery
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            if git push origin HEAD:main; then
              RELEASE_SHA="$(git rev-parse HEAD)"
              echo "RELEASE_SHA=$RELEASE_SHA" >> "$GITHUB_ENV"
              echo "PUSH_404181_PASS $RELEASE_SHA"
              exit 0
            fi
            echo "main moved during graph release push; rebase attempt $attempt/6"
            git pull --rebase origin main
          done
          exit 1

      - name: Terminal release proof
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git merge-base --is-ancestor "$RELEASE_SHA" origin/main
          git checkout --detach "$RELEASE_SHA"
          python .github/scripts/agent_crypto_version_truth_guard.py --expected-build 40.4.181 --expected-release 'PARALLEL GRAPH VISUAL PARITY · CRYPTO MASTER GRAMMAR'
          test ! -e .github/workflows/agent-crypto-40-4-181-parallel-graph-visual-parity.yml
          grep -Fq '40.4.181 — PARALLEL GRAPH VISUAL PARITY' public/agent_crypto_erith_ia/administrator/parallel-markets.css
          echo "TERMINAL_404181_PASS $RELEASE_SHA"
