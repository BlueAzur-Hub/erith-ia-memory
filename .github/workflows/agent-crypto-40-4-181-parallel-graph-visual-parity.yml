name: Agent-Crypto 40.4.181 Parallel Graph Visual Parity

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/agent-crypto-40-4-181-parallel-graph-visual-parity.yml'
      - '.github/scripts/agent_crypto_release_404181.sh'

permissions:
  contents: write

concurrency:
  group: agent-crypto-release-control
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Release 40.4.181
        shell: bash
        run: bash .github/scripts/agent_crypto_release_404181.sh
