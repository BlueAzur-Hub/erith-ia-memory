name: Agent-Crypto Aether 40.6.83 Acceptance Runner

on:
  push:
    paths:
      - .github/workflows/agent-crypto-406083-runner3.yml

permissions:
  contents: write

jobs:
  final-cascade:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Execute cumulative cascade and final reread
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          git config user.name "BlueAzur-Hub"
          git config user.email "Blue.Azur@protonmail.com"

          python - <<'PY'
          from pathlib import Path
          import json
          root=Path('public/agent_crypto_erith_ia/administrator')
          data=json.loads((root/'build.json').read_text(encoding='utf-8'))
          assert data.get('build')=='40.6.77', data.get('build')
          assert data.get('engine')=='38.15.11', data.get('engine')

          source=Path('.github/workflows/agent-crypto-406083-aether-cascade.yml').read_text(encoding='utf-8')
          marker="          python - <<'PY'\n          from pathlib import Path\n          from datetime import datetime, timezone"
          start=source.index(marker)+len("          python - <<'PY'\n")
          end=source.index("\n          PY",start)
          block=source[start:end]
          lines=[line[10:] if line.startswith('          ') else line for line in block.splitlines()]
          script='\n'.join(lines)+'\n'

          replacements=[
            (
              "p=root/f'js/aether-v2-{build.replace(\".\",\"\")}.js'",
              "p=root/f'js/aether-v2-406{int(build.split(\".\")[-1]):03d}.js'"
            ),
            (
              "css81.write_text(css,encoding='utf-8')",
              "css=css.replace('\\\\n','\\n')\ncss81.write_text(css,encoding='utf-8')"
            ),
            (
              "if 'id=\"aetherLegacyCenterPreboot406083\"' not in html:",
              "preboot=preboot.replace('\\\\n','\\n')\nif 'id=\"aetherLegacyCenterPreboot406083\"' not in html:"
            ),
            (
              "assert 'MutationObserver' not in rt83.read_text(encoding='utf-8')",
              "assert 'new MutationObserver' not in rt83.read_text(encoding='utf-8')"
            )
          ]
          for old,new in replacements:
              if old not in script:
                  raise SystemExit(f'cascade reread signature missing: {old}')
              script=script.replace(old,new,1)

          Path('/tmp/aether_cascade_406083.py').write_text(script,encoding='utf-8')
          PY

          python /tmp/aether_cascade_406083.py

          python - <<'PY'
          from pathlib import Path
          import hashlib, json
          root=Path('public/agent_crypto_erith_ia/administrator')
          css=root/'aether-v2-406083.css'
          runtime=root/'js/aether-v2-406083.js'
          index=root/'index.html'
          manifest=root/'build.json'
          loader=root/'js/aether-role-visibility-406050.js'
          app=root/'js/app.js'
          core=root/'js/aether.js'
          png=root/'assets/aether/aether-observatory-master-v2-406074.png'

          css_text=css.read_text(encoding='utf-8')
          if '\\n' in css_text:
              css.write_text(css_text.replace('\\n','\n'),encoding='utf-8')
          html=index.read_text(encoding='utf-8')
          data=json.loads(manifest.read_text(encoding='utf-8'))
          load=loader.read_text(encoding='utf-8')
          js=runtime.read_text(encoding='utf-8')

          assert '<meta name="administrator-build" content="40.6.83" />' in html
          assert '<meta name="atlas-engine-build" content="38.15.11" />' in html
          assert '<meta name="administrator-revision" content="V18" />' in html
          assert 'Build 40.6.83 · Administrator' in html
          assert 'id="aetherLegacyCenterPreboot406083"' in html
          assert data.get('build')=='40.6.83' and data.get('engine')=='38.15.11'
          assert 'aether-v2-406083.css' in load and 'aether-v2-406083.js' in load
          assert 'aether-frame-406077.js?v=' not in load
          assert 'new MutationObserver' not in js
          assert 'setInterval(' not in js
          assert 'fetch(' not in js
          assert 'new WebSocket' not in js
          assert 'localStorage.setItem' not in js
          assert 'atlas_score' in js and 'score directionnel Atlas de -100 à +100' in js
          assert 'data-aether-weather-glyph' in css_text
          assert hashlib.sha256(png.read_bytes()).hexdigest()
          assert app.exists() and core.exists()
          PY

          node --check public/agent_crypto_erith_ia/administrator/js/aether-v2-406083.js

          # Fold final QA into the 40.6.83 product commit and remove all staging runners.
          git add public/agent_crypto_erith_ia/administrator/aether-v2-406083.css public/agent_crypto_erith_ia/administrator/index.html public/agent_crypto_erith_ia/administrator/build.json public/agent_crypto_erith_ia/administrator/js/aether-v2-406083.js public/agent_crypto_erith_ia/administrator/js/aether-role-visibility-406050.js public/agent_crypto_erith_ia/administrator/RELEASE_40_6_83.md
          git rm -f .github/workflows/agent-crypto-406083-runner.yml .github/workflows/agent-crypto-406083-runner2.yml .github/workflows/agent-crypto-406083-runner3.yml
          git commit --amend --no-edit
          git push origin HEAD:main

      - name: Package final Administrator clean copy
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          zip -qr dist/AGENT_CRYPTO_BUILD_40_6_83_AETHER_V2_FINAL_CLEAN_UPLOAD.zip public/agent_crypto_erith_ia/administrator
          sha256sum dist/AGENT_CRYPTO_BUILD_40_6_83_AETHER_V2_FINAL_CLEAN_UPLOAD.zip > dist/AGENT_CRYPTO_BUILD_40_6_83_AETHER_V2_FINAL_CLEAN_UPLOAD.sha256
          git log -10 --oneline > dist/AGENT_CRYPTO_BUILD_40_6_83_AETHER_V2_FINAL_COMMITS.txt

      - name: Upload final clean copy
        uses: actions/upload-artifact@v4
        with:
          name: AGENT_CRYPTO_BUILD_40_6_83_AETHER_V2_FINAL_CLEAN_UPLOAD
          path: dist/
          retention-days: 30
