name: Atlas Public Indices Archive

on:
  workflow_dispatch:
  schedule:
    - cron: "22 */4 * * *"

permissions:
  contents: write

concurrency:
  group: atlas-public-indices-archive-${{ github.ref }}
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install collector dependencies
        run: python -m pip install --disable-pip-version-check requests==2.32.5 curl-cffi==0.15.0
      - name: Collect Indices
        run: python public/agent_crypto_erith_ia/tools/collect_public_parallel_markets.py --root public/agent_crypto_erith_ia --domain indices --timeout 25 --pacing 1.5
      - name: Validate Source Truth
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("public/agent_crypto_erith_ia/data/indices/status.json")
          d=json.loads(p.read_text(encoding="utf-8"))
          assert d.get("status")=="ready", d
          assert int(d.get("assets_count") or 0)==5, d
          assert d.get("integrity",{}).get("no_invented_values", True) is True
          print(d)
          PY
      - name: Commit public archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/agent_crypto_erith_ia/data/indices
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "archive public indices market snapshot"
          git pull --rebase origin main
          git push origin HEAD:main
