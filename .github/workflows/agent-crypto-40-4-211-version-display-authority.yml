name: Agent-Crypto 40.4.211 Version Display Single Authority Lock

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/agent-crypto-40-4-211-version-display-authority.yml'

permissions:
  contents: write

concurrency:
  group: agent-crypto-40-4-211-version-display-authority
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prove canonical 40.4.210 baseline
        run: |
          git fetch origin main
          git reset --hard origin/main
          python .github/scripts/agent_crypto_version_truth_guard.py --expected-build 40.4.210
          python - <<'PY'
          from pathlib import Path
          root=Path('public/agent_crypto_erith_ia/administrator')
          index=(root/'index.html').read_text(encoding='utf-8')
          stack=(root/'js/market-stack.js').read_text(encoding='utf-8')
          parallel=(root/'js/parallel-markets.js').read_text(encoding='utf-8')
          checks={
            'market-stack module 204': 'const BUILD = "40.4.204";' in stack,
            'market-stack global badge write': 'atlasVersionControlText' in stack and 'text.textContent = `Build ${BUILD}`' in stack,
            'static badge 168': '<span id="atlasVersionControlText">Build 40.4.168</span>' in index,
            'static aria 168': 'Version Agent-Crypto installée : Build 40.4.168, mode Administrator' in index,
            'market-stack cache 204': './js/market-stack.js?v=40.4.204' in index,
            'version-truth cache 198': './js/version-truth.js?v=40.4.198' in index,
            'parallel module 209': 'const BUILD = "40.4.209";' in parallel,
            'parallel rail ambiguous Build': '<small>Build</small><b>${BUILD}</b>' in parallel,
          }
          bad=[k for k,v in checks.items() if not v]
          if bad: raise SystemExit('404211_BASELINE_FAIL '+repr(bad))
          print('404211_BASELINE_PASS', checks)
          PY
          sha256sum \
            public/agent_crypto_erith_ia/administrator/admin-windows.css \
            public/agent_crypto_erith_ia/administrator/js/market-reading-depth.js \
            public/agent_crypto_erith_ia/administrator/market-reading-depth.css \
            public/agent_crypto_erith_ia/administrator/parallel-markets.css \
            > /tmp/agent_crypto_404211_protected_hashes.txt

      - name: Apply bounded version authority surgery
        run: |
          python .github/scripts/agent_crypto_40_4_211_version_display_single_authority.py

      - name: Publish canonical 40.4.211 identity
        run: |
          python .github/scripts/agent_crypto_release_driver.py \
            --build 40.4.211 \
            --parent 40.4.210 \
            --release 'VERSION DISPLAY SINGLE AUTHORITY LOCK · GLOBAL RELEASE TRUTH OWNER CONSOLIDATION' \
            --status version_display_single_authority_lock_404211 \
            --lineage-note '40.4.211 version display single authority lock' \
            --contract-key version_display_single_authority_404211 \
            --contract-json /tmp/agent_crypto_404211_contract.json

      - name: Prove single authority and protected scope
        run: |
          python .github/scripts/agent_crypto_version_truth_guard.py \
            --expected-build 40.4.211 \
            --expected-release 'VERSION DISPLAY SINGLE AUTHORITY LOCK · GLOBAL RELEASE TRUTH OWNER CONSOLIDATION'
          node --check public/agent_crypto_erith_ia/administrator/js/market-stack.js
          node --check public/agent_crypto_erith_ia/administrator/js/parallel-markets.js
          node --check public/agent_crypto_erith_ia/administrator/js/version-truth.js
          sha256sum -c /tmp/agent_crypto_404211_protected_hashes.txt
          grep -F 'const BUILD = "40.4.211";' public/agent_crypto_erith_ia/administrator/js/market-stack.js
          grep -F 'dataset.marketStackBuild = BUILD' public/agent_crypto_erith_ia/administrator/js/market-stack.js
          ! grep -F 'atlasVersionControlText' public/agent_crypto_erith_ia/administrator/js/market-stack.js
          grep -F 'const BUILD = "40.4.211";' public/agent_crypto_erith_ia/administrator/js/parallel-markets.js
          grep -F '<small>Module</small><b>${BUILD}</b>' public/agent_crypto_erith_ia/administrator/js/parallel-markets.js
          grep -F '<span id="atlasVersionControlText">Build 40.4.211</span>' public/agent_crypto_erith_ia/administrator/index.html
          grep -F './js/market-stack.js?v=40.4.211' public/agent_crypto_erith_ia/administrator/index.html
          grep -F './js/parallel-markets.js?v=40.4.211' public/agent_crypto_erith_ia/administrator/index.html
          grep -F './js/version-truth.js?v=40.4.211' public/agent_crypto_erith_ia/administrator/index.html
          test -z "$(git status --porcelain -- public/agent_crypto_erith_ia/data)"

      - name: Commit release
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/scripts/agent_crypto_40_4_211_version_display_single_authority.py
          python - <<'PY'
          import subprocess
          allowed={
            '.github/scripts/agent_crypto_40_4_211_version_display_single_authority.py',
            '.github/scripts/agent_crypto_release_driver.py',
            '.github/scripts/agent_crypto_version_truth_guard.py',
            'public/agent_crypto_erith_ia/administrator/index.html',
            'public/agent_crypto_erith_ia/administrator/app.js',
            'public/agent_crypto_erith_ia/administrator/js/app.js',
            'public/agent_crypto_erith_ia/administrator/js/market-stack.js',
            'public/agent_crypto_erith_ia/administrator/js/parallel-markets.js',
            'public/agent_crypto_erith_ia/administrator/version.json',
            'public/agent_crypto_erith_ia/administrator/administrator-version.json',
            'public/agent_crypto_erith_ia/administrator/build.json',
            'coordination/inter_ai_dialogues/agent_crypto/PROMPT_REPRISE_AETHER_AGENT_CRYPTO.md',
            'coordination/inter_ai_dialogues/agent_crypto/AGENT_CRYPTO_FIN_DE_FIL_AETHER.md',
            'coordination/inter_ai_dialogues/agent_crypto/AGENT_CRYPTO_RELEASE_MANIFEST.md',
          }
          changed=set(filter(None,subprocess.check_output(['git','diff','--name-only'],text=True).splitlines()))
          extra=sorted(changed-allowed)
          required={
            '.github/scripts/agent_crypto_40_4_211_version_display_single_authority.py',
            '.github/scripts/agent_crypto_release_driver.py',
            '.github/scripts/agent_crypto_version_truth_guard.py',
            'public/agent_crypto_erith_ia/administrator/index.html',
            'public/agent_crypto_erith_ia/administrator/js/market-stack.js',
            'public/agent_crypto_erith_ia/administrator/js/parallel-markets.js',
            'public/agent_crypto_erith_ia/administrator/version.json',
            'public/agent_crypto_erith_ia/administrator/administrator-version.json',
            'public/agent_crypto_erith_ia/administrator/build.json',
          }
          missing=sorted(required-changed)
          if extra or missing: raise SystemExit(f'404211_DIFF_SCOPE_FAIL extra={extra} missing={missing}')
          print('404211_DIFF_SCOPE_PASS',sorted(changed))
          PY
          git add -A
          git commit -m 'release(agent-crypto): 40.4.211 version display single authority lock'
          git pull --rebase origin main
          python .github/scripts/agent_crypto_version_truth_guard.py \
            --expected-build 40.4.211 \
            --expected-release 'VERSION DISPLAY SINGLE AUTHORITY LOCK · GLOBAL RELEASE TRUTH OWNER CONSOLIDATION'
          git push origin HEAD:main
