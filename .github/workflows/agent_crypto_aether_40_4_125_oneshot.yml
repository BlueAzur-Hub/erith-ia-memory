name: Agent-Crypto Aether 40.4.125 one-shot publication

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/agent_crypto_aether_40_4_125_oneshot.yml"

permissions:
  contents: write

concurrency:
  group: agent-crypto-aether-40-4-125-publication
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply 40.4.125 canonical French News handoff
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, hashlib

          root = Path("public/agent_crypto_erith_ia/administrator")
          old = "40.4.124"
          new = "40.4.125"

          def read(rel):
              return (root / rel).read_text(encoding="utf-8")

          def write(rel, text):
              (root / rel).write_text(text, encoding="utf-8")

          def replace_once(text, before, after, label):
              count = text.count(before)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, got {count}")
              return text.replace(before, after, 1)

          def sha(rel):
              return hashlib.sha256((root / rel).read_bytes()).hexdigest()

          app = read("app.js")
          if f'const ATLAS_BUILD = "{old}";' not in app:
              raise SystemExit("40.4.125 guard refused: current app.js is not 40.4.124")

          aether = read("js/aether.js")
          aether = replace_once(
              aether,
              "  Build: 40.4.124\n  Revision: 40.4.124 French factual News fallback. 40.4.123 information-density, 40.4.122 information-only filtering and 40.4.121 constant-read-speed marquee are preserved; when a sourced headline has no French field, Aether renders a deterministic French factual summary instead of exposing raw English in the scarce operator ribbon.",
              "  Build: 40.4.125\n  Revision: 40.4.125 canonical French News handoff. News Sentinel headline_fr_display/headline_fr now owns the scarce Aether story text end-to-end: VEILLE, CONTEXTE and the compact INFO cell. 40.4.124 French fallback, 40.4.123 information-density and 40.4.121 constant-read-speed marquee are preserved.",
              "aether header"
          )
          aether = replace_once(
              aether,
              '    const facts=[];\n    const pushFact=value=>{const fact=qualified(value);if(fact&&!facts.includes(fact))facts.push(fact);};\n    pushFact(mechanism?`${mechanism}${direction?` · ${direction}`:""}`:"");',
              '    const facts=[];\n    const pushFact=value=>{const fact=qualified(value);if(fact&&!facts.includes(fact))facts.push(fact);};\n    // 40.4.125 — keep the translated News Sentinel fact visible through the paired CONTEXTE phase.\n    // Context enriches the story; it no longer replaces the story with mechanism-only telemetry.\n    pushFact(c.headline);\n    pushFact(mechanism?`${mechanism}${direction?` · ${direction}`:""}`:"");',
              "CONTEXTE headline owner"
          )
          aether = replace_once(
              aether,
              '      const headline=aetherNewsHeadlineFr40104(event,"");\n      return `Veille · ${scope}${impact?` ${impact}/100`:""} · ${aetherCompact4088(headline,70)}`;',
              '      const headline=aetherNewsHeadlineFr40104(event,"");\n      // 40.4.125 — information first: the French headline owns the visible prefix; scope/impact follow.\n      return `Veille · ${aetherCompact4088(headline,88)}${scope?` · ${scope}`:""}${impact?` ${impact}/100`:""}`;',
              "compact INFO headline first"
          )
          aether = replace_once(aether, '    build:"40.4.124",', '    build:"40.4.125",', "Aether API build")
          aether = replace_once(
              aether,
              '    news_translation_preferred:"headline_fr_display → headline_fr",\n    news_translation_fallback:"deterministic French factual summary → original only when already non-English",',
              '    news_translation_preferred:"headline_fr_display → headline_fr",\n    news_translation_story_owner:"News Sentinel French headline owns VEILLE + CONTEXTE + compact INFO",\n    news_translation_context_keeps_headline:true,\n    news_translation_compact_headline_first:true,\n    news_translation_fallback:"deterministic French factual summary → original only when already non-English",',
              "Aether French ownership flags"
          )
          write("js/aether.js", aether)

          index = read("index.html")
          if index.count(old) != 13:
              raise SystemExit(f"index build-token guard refused: expected 13, got {index.count(old)}")
          write("index.html", index.replace(old, new))
          write("app.js", replace_once(app, f'const ATLAS_BUILD = "{old}";', f'const ATLAS_BUILD = "{new}";', "ATLAS_BUILD"))
          jsapp = read("js/app.js")
          write("js/app.js", replace_once(jsapp, f'const ADMIN_BUILD = "{old}";', f'const ADMIN_BUILD = "{new}";', "ADMIN_BUILD"))

          changed_hashes = {rel: sha(rel) for rel in ["index.html", "app.js", "js/app.js", "js/aether.js"]}
          release = "AETHER CANONICAL FRENCH NEWS HANDOFF · STORY CONTINUITY LOCK"
          status = "candidate_aether_canonical_french_news_handoff_operator_validation_required"
          lineage_add = " → 40.4.125 Aether canonical French News handoff: translated News Sentinel headline stays first through VEILLE, paired CONTEXTE and compact INFO; 40.4.124 fallback and 40.4.121 constant marquee preserved."
          note = "40.4.125 — News Sentinel headline_fr_display/headline_fr becomes the visible story owner across VEILLE, CONTEXTE and compact INFO. CONTEXTE now enriches the same translated headline instead of replacing it; compact INFO places the French headline before scope/impact."
          release_note = "40.4.125: canonical French News handoff is presentation-only; headline_fr_display/headline_fr stays visible through VEILLE, CONTEXTE and compact INFO. No new fetch, translator, timer, marquee-speed, Graph, Oracle-engine, Math Core, Market Core, Bridge or Window Manager change."
          reason = "Aether presentation-only canonical French News handoff over 40.4.124: translated News Sentinel headline is kept as the story owner through VEILLE, CONTEXTE and compact INFO; deterministic French fallback remains last-resort only; marquee velocity, cadence, data engines and canonical originals remain unchanged."

          def update_manifest(rel):
              p = root / rel
              d = json.loads(p.read_text(encoding="utf-8"))
              if d.get("build") != old:
                  raise SystemExit(f"{rel}: expected build {old}, got {d.get('build')}")
              d["build"] = new
              d["release"] = release
              d["status"] = status
              d["prepared_at"] = "2026-08-31T06:55:00Z"
              d["published_at"] = None
              d["global_versioning"] = new
              d["asset_token"] = f"market-core-v2.0-alpha-build-{new}"
              d["parent_build"] = old
              if isinstance(d.get("lineage"), str) and "40.4.125 Aether canonical French News handoff" not in d["lineage"]:
                  d["lineage"] += lineage_add
              pub = d.setdefault("integrity", {}).setdefault("publication_identity", {})
              pub["build"] = new
              pub["asset_token"] = f"market-core-v2.0-alpha-build-{new}"
              if "app_sha256" in pub:
                  pub["app_sha256"] = changed_hashes["app.js"]
              notes = d.setdefault("notes", [])
              if note not in notes:
                  notes.append(note)
              notes2 = d.setdefault("release_notes", [])
              if release_note not in notes2:
                  notes2.append(release_note)
              d["publication_revision"] = new
              d["publication_revision_reason"] = reason
              d.setdefault("files", {}).update(changed_hashes)
              p.write_text(json.dumps(d, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          update_manifest("version.json")
          update_manifest("administrator-version.json")

          admin_sha = sha("administrator-version.json")
          vp = root / "version.json"
          vd = json.loads(vp.read_text(encoding="utf-8"))
          vpub = vd.setdefault("integrity", {}).setdefault("publication_identity", {})
          if "administrator_version_sha256" in vpub:
              vpub["administrator_version_sha256"] = admin_sha
          vp.write_text(json.dumps(vd, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          for rel in ["version.json", "administrator-version.json"]:
              d = json.loads((root / rel).read_text(encoding="utf-8"))
              assert d["build"] == new
              assert d["parent_build"] == old
              assert d["publication_revision"] == new
              for payload in ["index.html", "app.js", "js/app.js", "js/aether.js", "admin-ribbons.css"]:
                  expected = d["files"][payload]
                  actual = sha(payload)
                  if expected != actual:
                      raise SystemExit(f"{rel}: hash mismatch {payload}: {expected} != {actual}")

          final_aether = read("js/aether.js")
          assert "pushFact(c.headline);" in final_aether
          assert 'return `Veille · ${aetherCompact4088(headline,88)}' in final_aether
          print("40.4.125 PATCH PASS")
          PY

      - name: Static JavaScript validation
        run: |
          node --check public/agent_crypto_erith_ia/administrator/js/aether.js
          node --check public/agent_crypto_erith_ia/administrator/app.js
          node --check public/agent_crypto_erith_ia/administrator/js/app.js

      - name: Commit publication and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/agent_crypto_aether_40_4_125_oneshot.yml
          git add public/agent_crypto_erith_ia/administrator/index.html \
                  public/agent_crypto_erith_ia/administrator/app.js \
                  public/agent_crypto_erith_ia/administrator/admin-ribbons.css \
                  public/agent_crypto_erith_ia/administrator/js/aether.js \
                  public/agent_crypto_erith_ia/administrator/js/app.js \
                  public/agent_crypto_erith_ia/administrator/version.json \
                  public/agent_crypto_erith_ia/administrator/administrator-version.json
          git commit -m "feat Agent-Crypto 40.4.125 route canonical French News through Aether"
          git pull --rebase origin main
          git push origin HEAD:main
