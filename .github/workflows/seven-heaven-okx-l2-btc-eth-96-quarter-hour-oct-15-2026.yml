name: Seven Heaven OKX L2 BTC ETH 96 Quarter Hour October 2026

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/seven-heaven-okx-l2-btc-eth-96-quarter-hour-oct-15-2026.yml'
      - 'coordination/inter_ai_dialogues/agent_crypto/research/strategy_profiles/SEVEN_HEAVEN_OKX_L2_BTC_ETH_2026_10_15_96_QUARTER_HOUR_FULL_DAY_STREAMING_AUDIT.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: seven-heaven-okx-l2-btc-eth-96-quarter-hour-one-shot
  cancel-in-progress: false

jobs:
  stream-one-official-l2-day:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { pair: 'BTC-USDC', slug: 'btc_usdc' }
          - { pair: 'ETH-USDC', slug: 'eth_usdc' }
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            coordination/inter_ai_dialogues/agent_crypto/research/strategy_profiles
          sparse-checkout-cone-mode: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate syntax and synthetic snapshot/delta safety tests
        run: |
          set -euo pipefail
          script='coordination/inter_ai_dialogues/agent_crypto/research/strategy_profiles/SEVEN_HEAVEN_OKX_L2_BTC_ETH_2026_10_15_96_QUARTER_HOUR_FULL_DAY_STREAMING_AUDIT.py'
          python -m py_compile "$script"
          python "$script" --selftest
      - name: Stream complete pinned archive and measure 96 preregistered states
        run: |
          set -euo pipefail
          python coordination/inter_ai_dialogues/agent_crypto/research/strategy_profiles/SEVEN_HEAVEN_OKX_L2_BTC_ETH_2026_10_15_96_QUARTER_HOUR_FULL_DAY_STREAMING_AUDIT.py --repo-root . --pair '${{ matrix.pair }}'
      - name: Validate source SHA CRC all 96 fixed anchors and old four-anchor parity
        run: |
          set -euo pipefail
          PAIR='${{ matrix.pair }}' SLUG='${{ matrix.slug }}' python - <<'PY'
          import json,csv,pathlib,os
          root=pathlib.Path('coordination/inter_ai_dialogues/agent_crypto/research/strategy_profiles/okx_l2_96_quarter_hour_2026_10_15_evidence')/os.environ['SLUG']
          doc=json.loads((root/'SEVEN_HEAVEN_OKX_L2_96_STATES_SOURCE_PROOFS.json').read_text(encoding='utf8'))
          assert doc['read_only'] and not doc['orders_enabled']
          assert doc['pair']==os.environ['PAIR'] and doc['day_utc']=='2026-10-15'
          assert doc['status'] in ('full_archive_replayed_ninety_six_states','failed_quality_or_access_check')
          filename='SEVEN_HEAVEN_OKX_L2_96_STATES_SPREADS.csv'
          spreads=list(csv.DictReader((root/filename).open(encoding='utf8')))
          cost=list(csv.DictReader((root/'SEVEN_HEAVEN_OKX_L2_96_STATES_COSTS.csv').open(encoding='utf8')))
          snapshots=list(csv.DictReader((root/'SEVEN_HEAVEN_OKX_L2_96_REPORTED_SNAPSHOT_TIMES.csv').open(encoding='utf8')))
          if doc['status']=='full_archive_replayed_ninety_six_states':
              result=doc['result']
              market=result['market']
              assert result['archive_sha256'] and len(result['archive_sha256'])==64
              assert result['member_sha256'] and len(result['member_sha256'])==64
              assert result['gzip_read_to_eof_crc_checked']
              assert market['first_20_event_hashes_match_prior_proof']
              assert not market['global_logical_continuity_proven']
              assert len(doc['reference_four_checks'])==4 and all(x['verified'] for x in doc['reference_four_checks'])
              assert len(spreads)==96 and len(market['anchors'])==96 and len(cost)==960
              assert len(snapshots)==market['snapshots']
              assert len({s['anchor_utc'] for s in spreads})==96
              assert all(0<=int(s['offset_ms_after_anchor'])<=60000 for s in spreads)
              assert all(s['anchor_utc'][0:10]=='2026-10-15' for s in spreads)
              assert all(0<=float(s['spread_bps'])<10000 for s in spreads)
              assert doc['summary_96_stable_states']['n']==96
              print('PASS: full pinned archive, CRC+SHA, exactly 96 fixed anchors, 960 paper costs, all historical four anchor reference values')
          else:
              assert doc['no_results_invented'] and not doc['source_archive_fully_read']
              assert not spreads and not cost
              print('INCOMPLETE: no invented values:',doc.get('error'))
          PY
      - name: Preserve compact pair-day evidence
        uses: actions/upload-artifact@v4
        with:
          name: seven-heaven-okx-l2-96-states-${{ matrix.slug }}
          path: coordination/inter_ai_dialogues/agent_crypto/research/strategy_profiles/okx_l2_96_quarter_hour_2026_10_15_evidence/
          if-no-files-found: error
          retention-days: 90

  publish-verified-evidence:
    needs: stream-one-official-l2-day
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          sparse-checkout: |
            coordination/inter_ai_dialogues/agent_crypto/research/strategy_profiles
          sparse-checkout-cone-mode: true
      - name: Assemble compact two-asset result files
        uses: actions/download-artifact@v4
        with:
          pattern: seven-heaven-okx-l2-96-states-*
          path: coordination/inter_ai_dialogues/agent_crypto/research/strategy_profiles/okx_l2_96_quarter_hour_2026_10_15_evidence/
          merge-multiple: true
      - name: Record complete and incomplete pair status
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,pathlib
          root=pathlib.Path('coordination/inter_ai_dialogues/agent_crypto/research/strategy_profiles/okx_l2_96_quarter_hour_2026_10_15_evidence')
          report={'schema':'seven-heaven.okx-l2-quarter-hour-2026-10-15.v1','day_utc':'2026-10-15','results':[]}
          for pair in ('BTC-USDC','ETH-USDC'):
              file=root/pair.lower().replace('-','_')/'SEVEN_HEAVEN_OKX_L2_96_STATES_SOURCE_PROOFS.json'
              if not file.exists():
                  report['results'].append({'pair':pair,'status':'not_published'})
              else:
                  x=json.loads(file.read_text(encoding='utf8'))
                  report['results'].append({'pair':pair,'status':x['status'],
                      'anchors':len(x.get('result',{}).get('market',{}).get('anchors',[])),
                      'snapshots':x.get('result',{}).get('market',{}).get('snapshots'),
                      'archive_sha256':x.get('result',{}).get('archive_sha256')})
          report['complete']=sum(r['status']=='full_archive_replayed_ninety_six_states' for r in report['results'])
          (root/'SEVEN_HEAVEN_OKX_L2_96_QUARTER_HOUR_DELIVERY_INDEX.json').write_text(json.dumps(report,indent=2)+'\n',encoding='utf8')
          print(json.dumps(report,indent=2))
          PY
      - name: Publish evidence in shared inter-AI Coffre only, no source archive
        run: |
          set -euo pipefail
          target='coordination/inter_ai_dialogues/agent_crypto/research/strategy_profiles/okx_l2_96_quarter_hour_2026_10_15_evidence'
          git add -- "$target"
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'NOOP: evidence already committed'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'research: archive verified 96 quarter-hour BTC ETH L2 snapshots and depth statistics'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
