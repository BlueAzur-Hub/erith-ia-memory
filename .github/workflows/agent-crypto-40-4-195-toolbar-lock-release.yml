name: Agent-Crypto 40.4.195 Toolbar Lock Release

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/agent-crypto-40-4-195-toolbar-lock-release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch graph shell
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from datetime import datetime, timezone
          import re

          root = Path("public/agent_crypto_erith_ia/administrator")
          cssp = root / "parallel-markets.css"
          stackp = root / "js" / "market-stack.js"
          parp = root / "js" / "parallel-markets.js"
          release = "GRAPH TOOLBAR PARITY LOCK · AETHER NORMAL ALL MARKETS · STATIC SHELL"
          now = datetime.now(timezone.utc).isoformat(timespec="seconds").replace("+00:00", "Z")

          css = cssp.read_text(encoding="utf-8")
          a = "/* =========================================================\n   40.4.182 — METALS AETHER FEED MASK"
          b = "\n\n\n/* 40.4.185 — UNIFIED GRAPH SHELL */"
          if a not in css or b not in css:
              raise SystemExit("Metals Aether mask anchor missing")
          i, j = css.index(a), css.index(b, css.index(a))
          restore = "\n".join([
              "/* =========================================================",
              "   40.4.195 — AETHER NORMAL LANE RESTORE",
              "   All five graph domains use the canonical Aether/command lane again.",
              "   Geometry is already locked; this retires the Metals-only temporary mask.",
              "   Presentation only: no collector, Market Core, Atlas or Oracle mutation.",
              "   ========================================================= */",
          ])
          css = css[:i] + restore + css[j:]
          css = css.replace(
              '#analyste .chart-shell,.atlas-unified-domain-shell-404185,#detailPanel,.atlas-unified-domain-rail-404185{transition:transform 160ms cubic-bezier(.2,.72,.2,1),opacity 140ms ease,width 160ms ease,height 160ms ease!important;will-change:transform}',
              '#analyste .chart-shell,.atlas-unified-domain-shell-404185,#detailPanel,.atlas-unified-domain-rail-404185{transition:none!important;will-change:auto!important}'
          )
          css = css.replace(
              '#analyste.atlas-market-soft-transition-404185 .chart-shell,#analyste.atlas-market-soft-transition-404185 .atlas-unified-domain-shell-404185,#analyste.atlas-market-soft-transition-404185 #detailPanel,#analyste.atlas-market-soft-transition-404185 .atlas-unified-domain-rail-404185{opacity:.72!important}',
              '#analyste.atlas-market-soft-transition-404185 .chart-shell,#analyste.atlas-market-soft-transition-404185 .atlas-unified-domain-shell-404185,#analyste.atlas-market-soft-transition-404185 #detailPanel,#analyste.atlas-market-soft-transition-404185 .atlas-unified-domain-rail-404185{opacity:1!important}'
          )
          lock = "\n".join([
              "",
              "/* 40.4.195 — GRAPH TOOLBAR PARITY LOCK */",
              "@media (min-width:901px){",
              "html[data-cyclic-market-domain=\"metals\"] #atlasMetalsUnifiedToolbar,html[data-cyclic-market-mode=\"parallel\"] #atlasCyclicMarketMirrorToolbar404168{display:grid!important;grid-template-columns:54px 148px 148px 320px minmax(320px,1fr)!important;align-items:center!important;gap:0!important;width:100%!important;min-width:0!important;min-height:var(--atlas-market-master-toolbar-h,52px)!important;margin:0!important;padding:0 8px 0 0!important;box-sizing:border-box!important;overflow:visible!important}",
              "html[data-cyclic-market-domain=\"metals\"] #atlasMetalsUnifiedToolbar::before,html[data-cyclic-market-mode=\"parallel\"] #atlasCyclicMarketMirrorToolbar404168::before{content:\"LECTURE\"!important;grid-column:1!important;color:#9eb0bd!important;font:950 8px/1 system-ui,sans-serif!important;letter-spacing:.12em!important;white-space:nowrap!important}",
              "html[data-cyclic-market-domain=\"metals\"] #atlasMetalsUnifiedToolbar>.atlas-toolbar-view-404195,html[data-cyclic-market-mode=\"parallel\"] #atlasCyclicMarketMirrorToolbar404168>.atlas-toolbar-view-404195{grid-column:2!important;grid-row:1!important;display:grid!important;grid-template-columns:42px repeat(2,minmax(42px,1fr))!important;align-items:center!important;gap:4px!important;margin:0!important}",
              "html[data-cyclic-market-domain=\"metals\"] #atlasMetalsUnifiedToolbar>.atlas-toolbar-scale-404195,html[data-cyclic-market-mode=\"parallel\"] #atlasCyclicMarketMirrorToolbar404168>.atlas-toolbar-scale-404195{grid-column:3!important;grid-row:1!important;display:grid!important;grid-template-columns:52px repeat(2,minmax(38px,1fr))!important;align-items:center!important;gap:4px!important;margin:0!important}",
              "html[data-cyclic-market-domain=\"metals\"] #atlasMetalsUnifiedToolbar>.atlas-toolbar-section-404195,html[data-cyclic-market-mode=\"parallel\"] #atlasCyclicMarketMirrorToolbar404168>.atlas-toolbar-section-404195{grid-column:4!important;grid-row:1!important;display:flex!important;align-items:center!important;gap:5px!important;min-width:0!important;margin:0!important;overflow:hidden!important}",
              "html[data-cyclic-market-domain=\"metals\"] #atlasMetalsUnifiedToolbar>.atlas-toolbar-period-404195,html[data-cyclic-market-mode=\"parallel\"] #atlasCyclicMarketMirrorToolbar404168>.atlas-toolbar-period-404195{grid-column:5!important;grid-row:1!important;display:grid!important;grid-template-columns:52px repeat(6,minmax(34px,1fr))!important;align-items:center!important;gap:4px!important;min-width:0!important;margin:0!important}",
              "html[data-cyclic-market-domain=\"metals\"] #atlasMetalsUnifiedToolbar .atlas-toolbar-disabled-slot-404195 button,html[data-cyclic-market-mode=\"parallel\"] #atlasCyclicMarketMirrorToolbar404168 .atlas-toolbar-disabled-slot-404195 button,html[data-cyclic-market-mode=\"parallel\"] #atlasCyclicMarketMirrorToolbar404168 .atlas-toolbar-view-404195 button:disabled{opacity:.30!important;filter:saturate(.35)!important;cursor:default!important;pointer-events:none!important}",
              "}",
          ])
          if "40.4.195 — GRAPH TOOLBAR PARITY LOCK" not in css:
              css += lock
          cssp.write_text(css, encoding="utf-8")

          stack = stackp.read_text(encoding="utf-8")
          old = 't.innerHTML = `<span class="mirror-group"><small>VUE</small><b class="active">Base 100</b></span><span class="mirror-group atlas-parallel-periods"><small>PÉRIODE</small><button type="button" data-parallel-period="24h">24h</button><button type="button" data-parallel-period="7j">7j</button><button type="button" data-parallel-period="30j">30j</button><button type="button" data-parallel-period="90j">90j</button><button type="button" data-parallel-period="1a">1a</button></span><span class="mirror-group"><small>SECTION</small><b data-cyclic-market-toolbar-state>Source Truth publique</b></span>`;'
          new = 't.innerHTML = `<span class="mirror-group atlas-toolbar-view-404195"><small>VUE</small><button type="button" disabled aria-disabled="true">Prix</button><b class="active">Base 100</b></span><span class="mirror-group atlas-toolbar-scale-404195 atlas-toolbar-disabled-slot-404195"><small>ÉCHELLE</small><button type="button" disabled aria-disabled="true">Normale</button><button type="button" disabled aria-disabled="true">Log</button></span><span class="mirror-group atlas-toolbar-section-404195"><small>SECTION</small><b data-cyclic-market-toolbar-state>Source Truth publique</b></span><span class="mirror-group atlas-toolbar-period-404195 atlas-parallel-periods"><small>PÉRIODE</small><button type="button" data-parallel-period="24h">24h</button><button type="button" data-parallel-period="7j">7j</button><button type="button" data-parallel-period="30j">30j</button><button type="button" data-parallel-period="60j">60j</button><button type="button" data-parallel-period="90j">90j</button><button type="button" data-parallel-period="1a">1a</button></span>`;'
          if old not in stack:
              raise SystemExit("market-stack toolbar anchor missing")
          stack = stack.replace(old, new, 1)

          return_anchor = "    return true;\n  }\n\n  function setParallelPlaceholder(domain){"
          if return_anchor not in stack:
              raise SystemExit("market-stack ensureHosts return anchor missing")
          stack = stack.replace(return_anchor, "    ensureGraphToolbarParity404195();\n    return true;\n  }\n\n  function setParallelPlaceholder(domain){", 1)

          helper_anchor = "\n  function setParallelPlaceholder(domain){"
          helper = "\n".join([
              "",
              "  function ensureGraphToolbarParity404195(){",
              "    const metals=byId(\"atlasMetalsUnifiedToolbar\");",
              "    if(metals){",
              "      const groups=Array.from(metals.children).filter(n=>n instanceof Element&&n.matches('div[role=\"group\"]'));",
              "      const view=groups[0]||null;const period=groups.find(n=>n.querySelector('[data-metals-period]'))||groups[1]||null;const section=groups.find(n=>n.querySelector('[data-metals-section]'))||groups[2]||null;",
              "      view?.classList.add(\"atlas-toolbar-view-404195\");period?.classList.add(\"atlas-toolbar-period-404195\");section?.classList.add(\"atlas-toolbar-section-404195\");",
              "      if(!metals.querySelector(\".atlas-toolbar-scale-404195\")){const scale=document.createElement(\"div\");scale.className=\"atlas-toolbar-scale-404195 atlas-toolbar-disabled-slot-404195\";scale.setAttribute(\"role\",\"group\");scale.setAttribute(\"aria-label\",\"Échelle Métaux · non applicable\");scale.innerHTML='<span>ÉCHELLE</span><button type=\"button\" disabled aria-disabled=\"true\">Normale</button><button type=\"button\" disabled aria-disabled=\"true\">Log</button>';metals.insertBefore(scale,period||section||null);}",
              "      metals.dataset.graphToolbarParity404195=\"crypto-slot-lock\";",
              "    }",
              "    const mirror=byId(\"atlasCyclicMarketMirrorToolbar404168\");if(mirror)mirror.dataset.graphToolbarParity404195=\"crypto-slot-lock\";",
              "    document.documentElement.dataset.graphToolbarParity404195=\"ready\";",
              "  }",
          ])
          stack = stack.replace(helper_anchor, helper + helper_anchor, 1)
          stack = stack.replace('const BUILD = "40.4.194";', 'const BUILD = "40.4.195";', 1)
          stackp.write_text(stack, encoding="utf-8")

          par = parp.read_text(encoding="utf-8")
          oldp = '      bar.innerHTML = `\n        <span class="mirror-group"><small>VUE</small><b class="active">Base 100</b></span>\n        <span class="mirror-group atlas-parallel-periods"><small>PÉRIODE</small>${PERIODS.map(p => `<button type="button" data-parallel-period="${p}">${p}</button>`).join("")}</span>\n        <span class="mirror-group"><small>SECTION</small><b data-parallel-state>Source Truth</b></span>`;'
          newp = '      bar.innerHTML = `\n        <span class="mirror-group atlas-toolbar-view-404195"><small>VUE</small><button type="button" disabled aria-disabled="true">Prix</button><b class="active">Base 100</b></span>\n        <span class="mirror-group atlas-toolbar-scale-404195 atlas-toolbar-disabled-slot-404195"><small>ÉCHELLE</small><button type="button" disabled aria-disabled="true">Normale</button><button type="button" disabled aria-disabled="true">Log</button></span>\n        <span class="mirror-group atlas-toolbar-section-404195"><small>SECTION</small><b data-parallel-state>Source Truth</b></span>\n        <span class="mirror-group atlas-toolbar-period-404195 atlas-parallel-periods"><small>PÉRIODE</small>${PERIODS.map(p => `<button type="button" data-parallel-period="${p}">${p}</button>`).join("")}</span>`;'
          if oldp not in par:
              raise SystemExit("parallel-markets toolbar anchor missing")
          par = par.replace(oldp, newp, 1).replace('const BUILD = "40.4.194";', 'const BUILD = "40.4.195";', 1).replace('const DEPTH_LEVEL = 193;', 'const DEPTH_LEVEL = 195;', 1)
          parp.write_text(par, encoding="utf-8")

          for p in [root/"index.html",root/"app.js",root/"js"/"app.js"]:
              t=p.read_text(encoding="utf-8")
              if "40.4.194" not in t: raise SystemExit(f"build marker missing: {p}")
              t=t.replace("40.4.194","40.4.195")
              if p.name=="index.html": t=t.replace("AETHER COMMAND LANE RESTORE · METALS-ONLY FEED MASK · MULTI-MARKET DEPTH LOCK",release)
              p.write_text(t,encoding="utf-8")

          for p in [root/"version.json",root/"administrator-version.json"]:
              t=p.read_text(encoding="utf-8")
              t=t.replace('"build": "40.4.194"','"build": "40.4.195"',1).replace('market-core-v2.0-alpha-build-40.4.194','market-core-v2.0-alpha-build-40.4.195').replace('"global_versioning": "40.4.194"','"global_versioning": "40.4.195"')
              t=t.replace('"release": "MULTI-MARKET DEPTH HARMONIZATION LOCK · SHARED SHELL · DOMAIN OWNERSHIP"',f'"release": "{release}"',1).replace('"status": "multi_market_depth_harmonization_lock_404193"','"status": "graph_toolbar_parity_lock_404195"',1)
              t=re.sub(r'"prepared_at": "[^"]+"',f'"prepared_at": "{now}"',t,count=1);t=re.sub(r'"published_at": "[^"]+"',f'"published_at": "{now}"',t,count=1);t=t.replace('"parent_build": "40.4.192"','"parent_build": "40.4.194"',1)
              p.write_text(t,encoding="utf-8")

          assert 'html[data-cyclic-market-domain="metals"] body #atlasAetherRibbon4084' not in cssp.read_text(encoding="utf-8")
          assert 'atlas-toolbar-scale-404195' in stackp.read_text(encoding="utf-8")
          assert 'const DEPTH_LEVEL = 195;' in parp.read_text(encoding="utf-8")
          assert release in (root/"index.html").read_text(encoding="utf-8")
          print("40.4.195 patch validated")
          PY

      - name: Validate JavaScript
        run: |
          node --check public/agent_crypto_erith_ia/administrator/js/market-stack.js
          node --check public/agent_crypto_erith_ia/administrator/js/parallel-markets.js

      - name: Commit and publish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/agent_crypto_erith_ia/administrator/index.html public/agent_crypto_erith_ia/administrator/app.js public/agent_crypto_erith_ia/administrator/js/app.js public/agent_crypto_erith_ia/administrator/js/market-stack.js public/agent_crypto_erith_ia/administrator/js/parallel-markets.js public/agent_crypto_erith_ia/administrator/parallel-markets.css public/agent_crypto_erith_ia/administrator/version.json public/agent_crypto_erith_ia/administrator/administrator-version.json
          git rm -f .github/workflows/agent-crypto-40-4-195-graph-toolbar-parity-lock.yml .github/workflows/agent-crypto-40-4-195-toolbar-lock-release.yml
          git commit -m "release Agent-Crypto 40.4.195 graph toolbar parity lock"
          git pull --rebase origin main
          git push origin HEAD:main