name: Aether Release 40.4.159 Technical Reading RND 10

on:
  push:
    branches: [main]
    paths:
      - "public/agent_crypto_erith_ia/administrator/assets/visual/technical-reading/technical-random-10.png"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: agent-crypto-aether-release-40-4-159
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Guard parent and uploaded PNG
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, struct
          from pathlib import Path
          root=Path('public/agent_crypto_erith_ia/administrator')
          data=json.loads((root/'version.json').read_text(encoding='utf-8'))
          if data.get('build') != '40.4.158':
              raise SystemExit(f"Expected 40.4.158 parent, found {data.get('build')}")
          p=root/'assets/visual/technical-reading/technical-random-10.png'
          if not p.is_file():
              raise SystemExit('technical-random-10.png missing')
          raw=p.read_bytes()
          if len(raw)<24 or raw[:8] != b'\x89PNG\r\n\x1a\n':
              raise SystemExit('technical-random-10.png invalid PNG signature')
          w,h=struct.unpack('>II', raw[16:24])
          if w < 720 or h < 1280:
              raise SystemExit(f'Image too small: {w}x{h}')
          if not (0.54 <= w/h <= 0.59):
              raise SystemExit(f'Unexpected portrait ratio: {w}x{h}')
          print(f'Parent 40.4.158 + PNG {w}x{h} PASS')
          PY

      - name: Build 40.4.159
        run: python .github/scripts/aether_release_404159.py

      - name: Validate JavaScript JSON and RND contract
        shell: bash
        run: |
          set -euo pipefail
          node --check public/agent_crypto_erith_ia/administrator/js/layout-repair.js
          node --check public/agent_crypto_erith_ia/administrator/js/app.js
          node --check public/agent_crypto_erith_ia/administrator/app.js
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root=Path('public/agent_crypto_erith_ia/administrator')
          version=json.loads((root/'version.json').read_text(encoding='utf-8'))
          admin=json.loads((root/'administrator-version.json').read_text(encoding='utf-8'))
          index=(root/'index.html').read_text(encoding='utf-8')
          layout=(root/'js/layout-repair.js').read_text(encoding='utf-8')
          asset=root/'assets/visual/technical-reading/technical-random-10.png'
          assert version['build']=='40.4.159'
          assert admin['build']=='40.4.159'
          assert index.count('technical-random-10.png') == 1
          assert index.count('data-tech-random="1"') == 1
          assert '40.4.158 — GRAPH DIRECT-FLOAT BODY PORTAL REPAIR' in layout
          assert '40.4.156R1 — ORACLE DIRECT-FLOAT BODY PORTAL REPAIR' in layout
          digest=hashlib.sha256(asset.read_bytes()).hexdigest()
          assert version['files']['assets/visual/technical-reading/technical-random-10.png'] == digest
          print('40.4.159 validation PASS')
          PY

      - name: Commit 40.4.159 and canonical archive
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Aether Release"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            public/agent_crypto_erith_ia/administrator/index.html \
            public/agent_crypto_erith_ia/administrator/app.js \
            public/agent_crypto_erith_ia/administrator/js/app.js \
            public/agent_crypto_erith_ia/administrator/version.json \
            public/agent_crypto_erith_ia/administrator/administrator-version.json \
            public/agent_crypto_erith_ia/administrator/assets/visual/technical-reading/technical-random-10.png \
            coordination/inter_ai_dialogues/agent_crypto/AGENT_CRYPTO_BUILD_40_4_159_AUTO_CANONICAL.zip \
            coordination/inter_ai_dialogues/agent_crypto/AGENT_CRYPTO_BUILD_40_4_159_AUTO_CANONICAL.zip.sha256
          git commit -m "feat Agent-Crypto 40.4.159 add Aether office to Technical Reading RND"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              echo "40.4.159 published"
              break
            fi
            if [ "$attempt" -eq 5 ]; then exit 1; fi
            sleep $((attempt * 2))
          done

      - name: Cleanup temporary release driver
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git rebase origin/main
          git rm .github/scripts/aether_release_404159.py .github/workflows/aether-release-40-4-159.yml
          git commit -m "chore Agent-Crypto clean 40.4.159 release driver"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              echo "temporary 40.4.159 driver cleaned"
              exit 0
            fi
            if [ "$attempt" -eq 5 ]; then exit 1; fi
            sleep $((attempt * 2))
          done
