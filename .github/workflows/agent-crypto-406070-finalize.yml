name: Agent Crypto 40.6.70 Finalize

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/agent-crypto-406070-finalize.yml'

permissions:
  contents: write

env:
  BUILD: '40.6.70'
  PARENT: '40.6.69'
  ENGINE: '38.15.11'
  RELEASE: 'AETHER FIREFOX PERFORMANCE · DRAG PAINT BUDGET'
  STATUS: 'aether_firefox_performance_drag_paint_budget_406070'

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch publication truth and stylesheet load
        shell: bash
        run: |
          python3 - <<'PY'
          import json, hashlib
          from pathlib import Path
          from datetime import datetime, timezone

          root=Path('public/agent_crypto_erith_ia/administrator')
          build='40.6.70'; parent='40.6.69'; engine='38.15.11'
          release='AETHER FIREFOX PERFORMANCE · DRAG PAINT BUDGET'
          status='aether_firefox_performance_drag_paint_budget_406070'
          now=datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z')

          perf=root/'aether-performance-406070.css'
          notes=root/'RELEASE_40_6_70.md'
          assert perf.exists() and notes.exists()

          # Root publication identity + additive CSS load only.
          ip=root/'index.html'
          html=ip.read_text(encoding='utf-8')
          assert '<meta name="atlas-build" content="40.6.69" />' in html
          assert '<meta name="administrator-build" content="40.6.69" />' in html
          assert '<meta name="atlas-engine-build" content="38.15.11" />' in html
          assert 'aether-performance-406070.css' not in html
          html=html.replace('<meta name="atlas-build" content="40.6.69" />','<meta name="atlas-build" content="40.6.70" />',1)
          html=html.replace('<meta name="administrator-build" content="40.6.69" />','<meta name="administrator-build" content="40.6.70" />',1)
          html=html.replace('<meta name="administrator-release" content="AETHER × TRADUS SURFACE · PAPER CONTEXT BRIDGE" />',f'<meta name="administrator-release" content="{release}" />',1)
          html=html.replace('<meta name="atlas-asset-token" content="market-core-v2.0-alpha-build-40.6.69" />','<meta name="atlas-asset-token" content="market-core-v2.0-alpha-build-40.6.70" />',1)
          html=html.replace('<title>Agent-Crypto @erith.IA — Build 40.6.69 · Administrator</title>','<title>Agent-Crypto @erith.IA — Build 40.6.70 · Administrator</title>',1)
          needle='  <link rel="stylesheet" href="./admin-firefox-compositor.css" />'
          assert needle in html
          html=html.replace(needle, needle+'\n  <link rel="stylesheet" href="./aether-performance-406070.css?v=administrator-build-40.6.70" />',1)
          ip.write_text(html,encoding='utf-8')

          # Runtime truth.
          bp=root/'build.json'
          b=json.loads(bp.read_text(encoding='utf-8'))
          assert b['build']==parent and b['engine']==engine
          b.update({
            'build':build,'engine':engine,'release':release,'status':status,'parent_build':parent,
            'asset_token':f'market-core-v2.0-alpha-build-{build}','administrator_build':build,
            'build_label':f'Build {build} · Administrator','release_status':'aether_firefox_performance_drag_paint_budget',
            'timestamp':now
          })
          if isinstance(b.get('current_version_truth'),dict): b['current_version_truth']['loaded_build']=build
          b['cascade_40_6_70']={
            'parent_build':'40.6.69 R1',
            'release':release,
            'status':status,
            'owner':'aether-performance-406070.css',
            'scope':'Firefox Administrator compositor/presentation only',
            'root_aether_containment':True,
            'workbench_containment':True,
            'aether_drag_shadow_flattened':True,
            'aether_drag_descendant_decor_paused':True,
            'aether_drag_hit_testing_temporarily_disabled':True,
            'workbench_active_drag_shadow_flattened':True,
            'existing_global_backdrop_lock_preserved':True,
            'aether_backplate_preload_406052_preserved':True,
            'aether_geometry_modified':False,
            'aether_runtime_modified':False,
            'aether_tradus_bridge_406069_r1_modified':False,
            'workbench_runtime_modified':False,
            'window_manager_runtime_modified':False,
            'technical_reading_modified':False,
            'strategy_a_modified':False,
            'tradus_business_logic_modified':False,
            'market_core':'38.15.11',
            'market_core_modified':False,
            'new_timer':False,
            'new_observer':False,
            'new_network_owner':False,
            'new_storage_owner':False,
            'automatic_order':False,
            'real_order':False
          }
          bp.write_text(json.dumps(b,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          # Publication manifest.
          vp=root/'version.json'
          v=json.loads(vp.read_text(encoding='utf-8'))
          assert v['build']==parent and v['engine']==engine
          v.update({'build':build,'engine':engine,'release':release,'status':status,'parent_build':parent,
                    'asset_token':f'market-core-v2.0-alpha-build-{build}','prepared_at':now,'published_at':now})
          if isinstance(v.get('lineage'),str) and build not in v['lineage']:
            v['lineage']+=f' → {build} Firefox Aether drag paint budget; 40.6.69 R1 passive bridge preserved'
          files=v.setdefault('files',{})
          for rel in ['aether-performance-406070.css','RELEASE_40_6_70.md']:
            files[rel]=hashlib.sha256((root/rel).read_bytes()).hexdigest()
          if isinstance(v.get('integrity'),dict): v['integrity']['files']=len(files)
          vp.write_text(json.dumps(v,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          # Administrator mirror manifest.
          ap=root/'administrator-version.json'
          av=json.loads(ap.read_text(encoding='utf-8'))
          assert av['build']==parent
          av.update({'build':build,'release':release,'status':status,'prepared_at':now,'published_at':now,'global_versioning':build})
          av['aether_firefox_performance_406070']={
            'owner':'aether-performance-406070.css',
            'compositor_only':True,
            'aether_stationary_visual_contract':'unchanged',
            'aether_drag_visual_contract':'decorative paint temporarily flattened only while moving',
            'workbench_drag_visual_contract':'large shadow temporarily flattened only while titlebar active',
            'aether_runtime_modified':False,
            'window_manager_runtime_modified':False,
            'workbench_runtime_modified':False,
            'bridge_406069_r1_modified':False,
            'new_timer':False,'new_observer':False,'new_network_owner':False,'new_storage_owner':False,
            'market_core_modified':False,'real_order':False
          }
          ap.write_text(json.dumps(av,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY

      - name: Validate 40.6.70
        shell: bash
        run: |
          set -euo pipefail
          ROOT=public/agent_crypto_erith_ia/administrator
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('public/agent_crypto_erith_ia/administrator')
          build='40.6.70'; parent='40.6.69'; engine='38.15.11'
          b=json.loads((root/'build.json').read_text(encoding='utf-8'))
          v=json.loads((root/'version.json').read_text(encoding='utf-8'))
          av=json.loads((root/'administrator-version.json').read_text(encoding='utf-8'))
          html=(root/'index.html').read_text(encoding='utf-8')
          css=(root/'aether-performance-406070.css').read_text(encoding='utf-8')
          assert b['build']==build and b['parent_build']==parent and b['engine']==engine
          assert b['administrator_build']==build and b['current_version_truth']['loaded_build']==build
          assert v['build']==build and v['parent_build']==parent and v['engine']==engine
          assert av['build']==build and av['global_versioning']==build
          assert f'Build {build} · Administrator' in html
          assert 'aether-performance-406070.css?v=administrator-build-40.6.70' in html
          assert '#atlasAetherStatusPanel4084' in css
          assert '#atlasAetherWorkbench406039' in css
          assert '.admin-native-moving' in css
          assert 'animation-play-state: paused' in css
          assert b['cascade_40_6_70']['market_core_modified'] is False
          assert b['cascade_40_6_70']['aether_runtime_modified'] is False
          assert b['cascade_40_6_70']['window_manager_runtime_modified'] is False
          assert b['cascade_40_6_70']['new_observer'] is False
          assert b['cascade_40_6_70']['new_timer'] is False
          print('40.6.70 VERSION + PERFORMANCE OWNER LOCK PASS')
          PY
          # The new owner is CSS only: no JS execution surfaces.
          ! grep -q 'url(' "$ROOT/aether-performance-406070.css"
          ! grep -q '@keyframes' "$ROOT/aether-performance-406070.css"
          ! grep -q 'backdrop-filter:' "$ROOT/aether-performance-406070.css"
          echo '40.6.70 CSS-ONLY COMPOSITOR CONTRACT PASS'

      - name: Commit publication truth and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/agent_crypto_erith_ia/administrator/index.html \
                  public/agent_crypto_erith_ia/administrator/build.json \
                  public/agent_crypto_erith_ia/administrator/version.json \
                  public/agent_crypto_erith_ia/administrator/administrator-version.json
          git rm .github/workflows/agent-crypto-406070-finalize.yml
          git commit -m "perf(agent-crypto): reduce Aether Firefox drag paint cost 40.6.70"
          git pull --rebase origin main
          git push origin HEAD:main
