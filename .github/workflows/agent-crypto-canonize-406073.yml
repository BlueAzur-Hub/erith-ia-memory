name: Agent-Crypto canonize 40.6.73

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/agent-crypto-canonize-406073.yml'

permissions:
  contents: write

jobs:
  canonize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Canonize Administrator 40.6.73
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          from datetime import datetime, timezone

          root = Path('public/agent_crypto_erith_ia/administrator')
          old = '40.6.72'
          new = '40.6.73'
          release = 'CANONICAL CHECKPOINT · ADMINISTRATOR / OPERATOR SYNC BASE'
          status = 'canonical_checkpoint_administrator_operator_sync_base_406073'
          token = 'market-core-v2.0-alpha-build-40.6.73'
          now = datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z')

          p = root / 'build.json'
          data = json.loads(p.read_text(encoding='utf-8'))
          assert data.get('build') == old
          assert data.get('parent_build') == '40.6.71'
          assert data.get('engine') == '38.15.11'
          data['build'] = new
          data['release'] = release
          data['status'] = status
          data['parent_build'] = old
          data['asset_token'] = token
          data['administrator_build'] = new
          data['build_label'] = 'Build 40.6.73 · Administrator'
          data['release_status'] = 'canonical_checkpoint_administrator_operator_sync_base'
          data['timestamp'] = now
          data.setdefault('current_version_truth', {})['loaded_build'] = new
          data['cascade_40_6_73'] = {
            'parent_build': old,
            'release': release,
            'status': status,
            'scope': 'canonical_version_truth_and_operator_sync_baseline_only',
            'functional_change': False,
            'market_core_modified': False,
            'strategy_a_modified': False,
            'graph_modified': False,
            'aether_modified': False,
            'atlas_runtime_modified': False,
            'oracle_modified': False,
            'technical_reading_modified': False,
            'window_manager_modified': False,
            'forge_modified': False,
            'new_recurring_timer': False,
            'new_observer': False,
            'new_network_owner': False,
            'new_storage_owner': False,
            'automatic_order': False,
            'real_order': False
          }
          p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          p = root / 'version.json'
          data = json.loads(p.read_text(encoding='utf-8'))
          assert data.get('build') == old
          assert data.get('parent_build') == '40.6.71'
          assert data.get('engine') == '38.15.11'
          data['release'] = release
          data['build'] = new
          data['asset_token'] = token
          data['status'] = status
          data['prepared_at'] = now
          data['published_at'] = now
          data['parent_build'] = old
          p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          p = root / 'administrator-version.json'
          s = p.read_text(encoding='utf-8')
          prefix = s[:2000]
          pairs = [
            ('  "build": "40.6.72",', '  "build": "40.6.73",'),
            ('  "release": "LIFECYCLE / VERSION TRUTH CONSOLIDATION",', f'  "release": "{release}",'),
            ('  "status": "lifecycle_version_truth_consolidation_406072",', f'  "status": "{status}",'),
            ('  "global_versioning": "40.6.72",', '  "global_versioning": "40.6.73",'),
          ]
          for before, after in pairs:
            assert before in prefix, before
            s = s.replace(before, after, 1)
          s = s.replace('  "prepared_at": "2026-09-11T10:47:17Z",', f'  "prepared_at": "{now}",', 1)
          s = s.replace('  "published_at": "2026-09-11T10:47:17Z",', f'  "published_at": "{now}",', 1)
          p.write_text(s, encoding='utf-8')

          p = root / 'index.html'
          s = p.read_text(encoding='utf-8')
          pairs = [
            ('<meta name="atlas-build" content="40.6.72" />', '<meta name="atlas-build" content="40.6.73" />'),
            ('<meta name="administrator-build" content="40.6.72" />', '<meta name="administrator-build" content="40.6.73" />'),
            ('<meta name="administrator-release" content="LIFECYCLE / VERSION TRUTH CONSOLIDATION" />', f'<meta name="administrator-release" content="{release}" />'),
            ('<meta name="atlas-asset-token" content="market-core-v2.0-alpha-build-40.6.72" />', '<meta name="atlas-asset-token" content="market-core-v2.0-alpha-build-40.6.73" />'),
            ('<title>Agent-Crypto @erith.IA — Build 40.6.72 · Administrator</title>', '<title>Agent-Crypto @erith.IA — Build 40.6.73 · Administrator</title>'),
          ]
          for before, after in pairs:
            assert s.count(before) == 1, (before, s.count(before))
            s = s.replace(before, after, 1)
          p.write_text(s, encoding='utf-8')

          note = [
            '# Agent-Crypto 40.6.73 — Canonical Checkpoint', '',
            '**Parent:** 40.6.72  ', '**Market Core:** 38.15.11  ', f'**Release:** {release}', '',
            '## Purpose', '',
            'Freeze the user-validated 40.6.72 Administrator runtime as the canonical 40.6.73 distribution baseline before synchronizing the separate Yohan Operator repository.', '',
            '## Functional change', '', 'None. Version-truth and distribution checkpoint only.', '',
            '## Protected and unchanged', '',
            '- Market Core 38.15.11', '- Target Top 5 / Market Flow / Market Snapshot', '- Graph engine semantics',
            '- Aether Watch geometry/backplate and 40.6.70 performance pass', '- Atlas HOT / CURRENT-PENDING', '- Oracle',
            '- TRADUS / Paper behavior', '- Strategy A', '- Lecture Technique', '- Window Manager', '- Forge iframe/runtime', '',
            '## Validation contract', '',
            'Administrator keeps the authenticated owner mode on hard reload unless `?view=intermediate` is explicitly requested. No new timer, observer, polling loop, network owner, storage owner, wallet or real-order path is introduced.', ''
          ]
          (root / 'RELEASE_40_6_73.md').write_text('\n'.join(note), encoding='utf-8')

          b = json.loads((root/'build.json').read_text(encoding='utf-8'))
          v = json.loads((root/'version.json').read_text(encoding='utf-8'))
          assert b['build'] == new and b['engine'] == '38.15.11' and b['parent_build'] == old
          assert v['build'] == new and v['engine'] == '38.15.11' and v['parent_build'] == old
          assert '<meta name="administrator-build" content="40.6.73" />' in (root/'index.html').read_text(encoding='utf-8')
          PY

      - name: Commit canonical checkpoint and self-remove workflow
        shell: bash
        run: |
          rm -f .github/workflows/agent-crypto-canonize-406073.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/agent_crypto_erith_ia/administrator .github/workflows/agent-crypto-canonize-406073.yml
          git diff --cached --name-only
          git commit -m 'chore(agent-crypto): canonize administrator checkpoint 40.6.73'
          git push origin HEAD:main
