name: Agent-Crypto 40.4.228 Parallel Full Cockpit Parity

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/agent-crypto-40-4-228-parallel-full-cockpit-parity.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Parent guard
        shell: bash
        run: |
          git fetch origin main
          git checkout main
          git pull --ff-only origin main
          echo "BASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          python3 - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('public/agent_crypto_erith_ia/administrator/version.json').read_text(encoding='utf-8'))
          assert m['build']=='40.4.227', m['build']
          assert m['engine']['reference_build']=='38.15.11'
          assert m['engine']['status']=='protected'
          print('PARENT_PASS 40.4.227 / Market Core 38.15.11 PROTECTED')
          PY

      - name: Apply bounded cockpit patch
        shell: bash
        run: |
          python3 .github/scripts/aether_40_4_228_parallel_full_cockpit_patch.py
          node --check public/agent_crypto_erith_ia/administrator/js/parallel-markets.js
          git diff --check

      - name: Canonical release driver
        shell: bash
        run: |
          cat >/tmp/contract.json <<'JSON'
          {"state":"active","scope":"parallel_markets_full_cockpit_presentation","references":["crypto_dynamic_cockpit","metals_historical_structural_cockpit"],"domains":["indices","energy","cross-market"],"toolbar_useful_controls_only":true,"truth_strip":true,"memory_strip":true,"detail_rail_depth_exposed":true,"existing_math_reused":true,"base100_math_changed":false,"history_data_changed":false,"sources_changed":false,"periods_changed":false,"hover_point_truth_changed":false,"metals_runtime_changed":false,"crypto_runtime_changed":false,"market_core_modified":false,"new_chart_engine":false,"new_timer":false,"new_observer":false,"new_fetch":false,"new_websocket":false,"new_scheduler":false}
          JSON
          python3 .github/scripts/agent_crypto_release_driver.py --build 40.4.228 --parent 40.4.227 --release "PARALLEL MARKETS · FULL COCKPIT PARITY WITH CRYPTO + METALS" --status parallel_markets_full_cockpit_parity_404228 --contract-key parallel_markets_full_cockpit_parity_404228 --contract-json /tmp/contract.json --lineage-note "40.4.228 Parallel Markets full cockpit parity: Indices, Energy and Cross expose their existing historical truth through a Crypto/Metals-grade toolbar, context strip, memory strip, detail rail and analytical depth; engines, data, sources, Base 100 math, Metals runtime, Crypto runtime and Market Core unchanged"

      - name: Version Truth and scope proof
        shell: bash
        run: |
          node --check public/agent_crypto_erith_ia/administrator/js/parallel-markets.js
          node --check public/agent_crypto_erith_ia/administrator/app.js
          node --check public/agent_crypto_erith_ia/administrator/js/app.js
          python3 .github/scripts/agent_crypto_version_truth_guard.py --expected-build 40.4.228 --expected-release "PARALLEL MARKETS · FULL COCKPIT PARITY WITH CRYPTO + METALS"
          python3 - <<'PY'
          from pathlib import Path
          import json, subprocess
          base=Path('public/agent_crypto_erith_ia/administrator')
          js=(base/'js/parallel-markets.js').read_text(encoding='utf-8')
          css=(base/'parallel-markets.css').read_text(encoding='utf-8')
          idx=(base/'index.html').read_text(encoding='utf-8')
          m=json.loads((base/'version.json').read_text(encoding='utf-8'))
          assert m['build']=='40.4.228' and m['parent_build']=='40.4.227'
          assert m['engine']['reference_build']=='38.15.11' and m['engine']['status']=='protected'
          assert 'const BUILD = "40.4.228";' in js
          assert 'atlas-parallel-cockpit-status-404228' in js
          assert 'atlas-parallel-memory-strip-404228' in js
          assert 'atlas-parallel-rail-decision-404228' in js
          assert '40.4.228 — PARALLEL MARKETS / FULL COCKPIT PARITY WITH CRYPTO + METALS' in css
          assert './parallel-markets.css?v=40.4.228' in idx
          assert './js/parallel-markets.js?v=40.4.228' in idx
          old=subprocess.check_output(['git','show','HEAD:public/agent_crypto_erith_ia/administrator/js/parallel-markets.js'],text=True)
          primitives=('fetch(','setInterval(','setTimeout(','MutationObserver(','WebSocket(','requestAnimationFrame(')
          assert {p:old.count(p) for p in primitives} == {p:js.count(p) for p in primitives}
          allowed={
            'public/agent_crypto_erith_ia/administrator/js/parallel-markets.js',
            'public/agent_crypto_erith_ia/administrator/parallel-markets.css',
            'public/agent_crypto_erith_ia/administrator/index.html',
            'public/agent_crypto_erith_ia/administrator/js/views/system-presentation.js',
            'public/agent_crypto_erith_ia/administrator/app.js',
            'public/agent_crypto_erith_ia/administrator/js/app.js',
            'public/agent_crypto_erith_ia/administrator/version.json',
            'public/agent_crypto_erith_ia/administrator/administrator-version.json',
            'public/agent_crypto_erith_ia/administrator/build.json'
          }
          lines=subprocess.check_output(['git','status','--porcelain','-uall'],text=True).splitlines()
          paths={line[3:] for line in lines}
          required={
            'public/agent_crypto_erith_ia/administrator/js/parallel-markets.js',
            'public/agent_crypto_erith_ia/administrator/parallel-markets.css',
            'public/agent_crypto_erith_ia/administrator/version.json'
          }
          if not required<=paths: raise SystemExit(f'required diff missing: {sorted(paths)}')
          if paths-allowed: raise SystemExit(f'out of scope: {sorted(paths-allowed)}')
          print('SCOPE_PASS',sorted(paths))
          PY
          git diff --check

      - name: Commit canonical 40.4.228
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/agent_crypto_erith_ia/administrator/js/parallel-markets.js public/agent_crypto_erith_ia/administrator/parallel-markets.css public/agent_crypto_erith_ia/administrator/index.html public/agent_crypto_erith_ia/administrator/js/views/system-presentation.js public/agent_crypto_erith_ia/administrator/app.js public/agent_crypto_erith_ia/administrator/js/app.js public/agent_crypto_erith_ia/administrator/version.json public/agent_crypto_erith_ia/administrator/administrator-version.json public/agent_crypto_erith_ia/administrator/build.json
          git commit -m "agent-crypto: build 40.4.228 bring parallel markets to full cockpit parity"
          echo "RELEASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          git push origin main

      - name: Package changed files only
        shell: bash
        run: |
          PKG=/tmp/agent-crypto-40.4.228
          mkdir -p "$PKG"
          git diff --name-only "$BASE_SHA" "$RELEASE_SHA" > /tmp/changed.txt
          while IFS= read -r p; do mkdir -p "$PKG/$(dirname "$p")"; cp "$p" "$PKG/$p"; done < /tmp/changed.txt
          {
            echo "# Agent-Crypto 40.4.228 — fichiers modifiés"
            echo
            echo "Release: PARALLEL MARKETS · FULL COCKPIT PARITY WITH CRYPTO + METALS"
            echo "Parent: 40.4.227"
            echo "Market Core: 38.15.11 PROTECTED"
            echo "Canonical commit: $RELEASE_SHA"
            echo
            echo "## Fichiers"
            sed 's/^/- `/' /tmp/changed.txt | sed 's/$/`/'
            echo
            echo "## Verrous"
            echo "- Crypto remains the dynamic cockpit reference."
            echo "- Metals remains the historical/structural cockpit reference."
            echo "- Indices / Energy / Cross expose existing truth with full cockpit presentation parity."
            echo "- Useful controls only: no fake Price/Scale/Oracle controls."
            echo "- Existing Base 100 math, histories, sources, periods, hover truth and analytical depth preserved."
            echo "- Metals runtime and Crypto runtime unchanged."
            echo "- No new timer / observer / fetch / WebSocket / scheduler."
            echo "- Market Core unchanged."
          } > "$PKG/FILES_CHANGED_40.4.228.md"
          (cd "$PKG" && zip -qr "$GITHUB_WORKSPACE/AGENT_CRYPTO_BUILD_40_4_228_PARALLEL_MARKETS_FULL_COCKPIT_PARITY_CHANGED_FILES.zip" .)
          sha256sum AGENT_CRYPTO_BUILD_40_4_228_PARALLEL_MARKETS_FULL_COCKPIT_PARITY_CHANGED_FILES.zip
          unzip -l AGENT_CRYPTO_BUILD_40_4_228_PARALLEL_MARKETS_FULL_COCKPIT_PARITY_CHANGED_FILES.zip

      - name: Upload differential ZIP
        uses: actions/upload-artifact@v4
        with:
          name: AGENT_CRYPTO_BUILD_40_4_228_PARALLEL_MARKETS_FULL_COCKPIT_PARITY_CHANGED_FILES
          path: AGENT_CRYPTO_BUILD_40_4_228_PARALLEL_MARKETS_FULL_COCKPIT_PARITY_CHANGED_FILES.zip
          include-hidden-files: true
