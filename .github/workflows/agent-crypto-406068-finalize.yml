name: Agent Crypto 40.6.68 Finalize

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/agent-crypto-406068-finalize.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch version owners and load order
        shell: bash
        run: |
          python3 - <<'PY'
          import json, hashlib
          from pathlib import Path
          from datetime import datetime, timezone

          root=Path('public/agent_crypto_erith_ia/administrator')
          build='40.6.68'; parent='40.6.67'; engine='38.15.11'
          release='TRADUS PAPER OBSERVABILITY · DURABLE EVALUATION ARCHIVE'
          status='tradus_paper_observability_durable_evaluation_406068'
          now=datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z')
          assert (root/'js/tradus-paper-observability-406068.js').exists()
          assert (root/'RELEASE_40_6_68.md').exists()

          ip=root/'index.html'
          html=ip.read_text(encoding='utf-8')
          assert 'tradus-paper-shadow-406067.js' in html
          assert 'tradus-paper-observability-406068.js' not in html
          html=html.replace('40.6.67','40.6.68')
          html=html.replace('TRADUS PAPER SHADOW · INDEPENDENT PAPER LIFECYCLE',release)
          needle='<script defer src="./js/tradus-paper-shadow-406067.js?v=administrator-build-40.6.68"></script>'
          assert needle in html
          html=html.replace(needle, needle+'\n  <script defer src="./js/tradus-paper-observability-406068.js?v=administrator-build-40.6.68"></script>',1)
          ip.write_text(html,encoding='utf-8')

          bp=root/'build.json'; b=json.loads(bp.read_text(encoding='utf-8'))
          assert b['build']==parent and b['engine']==engine
          b.update({
            'build':build,'engine':engine,'release':release,'status':status,'parent_build':parent,
            'asset_token':f'market-core-v2.0-alpha-build-{build}','administrator_build':build,
            'build_label':f'Build {build} · Administrator','release_status':'tradus_paper_observability_durable_evaluation',
            'timestamp':now
          })
          if isinstance(b.get('current_version_truth'),dict): b['current_version_truth']['loaded_build']=build
          b['cascade_40_6_68']={
            'parent_build':parent,'release':release,'status':status,
            'tradus_signal_owner':'js/tradus-shadow-adapter-406066.js',
            'tradus_paper_lifecycle_owner':'js/tradus-paper-shadow-406067.js',
            'observability_owner':'js/tradus-paper-observability-406068.js',
            'closed_trade_archive':'bounded localStorage evaluation evidence only',
            'open_position_persistence_modified':False,'aether_geometry_modified':False,
            'technical_reading_modified':False,'strategy_a_modified':False,'market_core':'38.15.11',
            'market_core_modified':False,'automatic_order':False,'real_order':False,
            'new_recurring_timer':False,'new_network_owner':False,'credentials':False,'wallet':False
          }
          bp.write_text(json.dumps(b,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          vp=root/'version.json'; v=json.loads(vp.read_text(encoding='utf-8'))
          assert v['build']==parent and v['engine']==engine
          v.update({'build':build,'engine':engine,'release':release,'status':status,'parent_build':parent,
                    'asset_token':f'market-core-v2.0-alpha-build-{build}','prepared_at':now,'published_at':now})
          suffix=f' → {build} TRADUS Paper observability + durable closed-trade evaluation archive; 40.6.67 lifecycle owner preserved'
          if isinstance(v.get('lineage'),str) and build not in v['lineage']: v['lineage']+=suffix
          files=v.setdefault('files',{})
          for rel in ['js/tradus-paper-observability-406068.js','RELEASE_40_6_68.md']:
            files[rel]=hashlib.sha256((root/rel).read_bytes()).hexdigest()
          if isinstance(v.get('integrity'),dict): v['integrity']['files']=len(files)
          vp.write_text(json.dumps(v,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          ap=root/'administrator-version.json'; av=json.loads(ap.read_text(encoding='utf-8'))
          assert av['build']==parent
          av.update({'build':build,'release':release,'status':status,'prepared_at':now,'published_at':now,'global_versioning':build})
          av['tradus_paper_observability_406068']={
            'source_lifecycle_build':'40.6.67','source_lifecycle_modified':False,
            'persistent_scope':'closed PAPER evaluation trades only','max_archive_trades':500,
            'aether_contract':'non-visual stage dataset only','aether_geometry_modified':False,
            'strategy_a_modified':False,'market_core_modified':False,'real_order':False,
            'credentials':False,'wallet':False,'new_timer':False,'new_network_owner':False
          }
          ap.write_text(json.dumps(av,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY

      - name: Validate 40.6.68
        shell: bash
        run: |
          set -euo pipefail
          node --check public/agent_crypto_erith_ia/administrator/js/tradus-paper-observability-406068.js
          node - <<'NODE'
          require('./public/agent_crypto_erith_ia/administrator/js/tradus-paper-observability-406068.js');
          const r=globalThis.AgentCryptoTradusPaperObservability406068.self_test();
          if(!r.pass) throw new Error(JSON.stringify(r));
          if(r.real_orders!==false || r.network_owner!==false || r.recurring_timer!==false) throw new Error('safety contract failed');
          console.log('40.6.68 OBSERVABILITY SELF-TEST PASS', r);
          NODE
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('public/agent_crypto_erith_ia/administrator')
          expected='40.6.68'; parent='40.6.67'; engine='38.15.11'
          b=json.loads((root/'build.json').read_text(encoding='utf-8'))
          v=json.loads((root/'version.json').read_text(encoding='utf-8'))
          av=json.loads((root/'administrator-version.json').read_text(encoding='utf-8'))
          html=(root/'index.html').read_text(encoding='utf-8')
          assert b['build']==expected and b['parent_build']==parent and b['engine']==engine
          assert b['administrator_build']==expected and b['current_version_truth']['loaded_build']==expected
          assert v['build']==expected and v['parent_build']==parent and v['engine']==engine
          assert av['build']==expected and av['global_versioning']==expected
          assert f'Build {expected} · Administrator' in html
          assert f'market-core-v2.0-alpha-build-{expected}' in html
          assert html.index('tradus-paper-shadow-406067.js') < html.index('tradus-paper-observability-406068.js')
          print('40.6.68 VERSION + LOAD ORDER PASS')
          PY
          ! grep -q 'fetch(' public/agent_crypto_erith_ia/administrator/js/tradus-paper-observability-406068.js
          ! grep -q 'setInterval' public/agent_crypto_erith_ia/administrator/js/tradus-paper-observability-406068.js
          git diff --exit-code -- public/agent_crypto_erith_ia/administrator/js/tradus-paper-shadow-406067.js
          git diff --exit-code -- public/agent_crypto_erith_ia/administrator/js/aether.js
          git diff --exit-code -- public/agent_crypto_erith_ia/administrator/aether-406051.css
          echo 'PROTECTED OWNERS UNCHANGED PASS'

      - name: Commit feature and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/agent_crypto_erith_ia/administrator/index.html \
                  public/agent_crypto_erith_ia/administrator/build.json \
                  public/agent_crypto_erith_ia/administrator/version.json \
                  public/agent_crypto_erith_ia/administrator/administrator-version.json
          git rm .github/workflows/agent-crypto-406068-finalize.yml
          git commit -m "feat(agent-crypto): add TRADUS paper observability 40.6.68"
          git pull --rebase origin main
          git push origin main
