name: Agent-Crypto 40.4.180 Final Release Gate

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/agent-crypto-40-4-180-live-data-branch-foundation-retry.yml'

permissions:
  contents: write

concurrency:
  group: agent-crypto-release-control
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebase latest main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main

      - name: Prove qualified live-data foundation
        shell: bash
        run: |
          set -euo pipefail
          bash -n .github/scripts/agent_crypto_publish_live_data.sh
          grep -Fq 'bash .github/scripts/agent_crypto_publish_live_data.sh' .github/workflows/atlas-public-crypto-market.yml
          grep -Fq 'bash .github/scripts/agent_crypto_publish_live_data.sh' .github/workflows/atlas-public-crypto-extended.yml
          test "$(grep -c 'data/agent-crypto-live/public/agent_crypto_erith_ia/data/crypto/' .github/workflows/atlas-public-crypto-market-clock.yml)" -eq 2
          grep -Fq 'Atlas Public Crypto Market' .github/workflows/atlas-public-crypto-market-clock.yml
          grep -Fq 'Atlas Public Crypto Extended' .github/workflows/atlas-public-crypto-market-clock.yml
          grep -Fq 'Atlas Public Metals Archive' .github/workflows/atlas-public-crypto-market-clock.yml
          grep -Fq 'Atlas Public Indices Archive' .github/workflows/atlas-public-crypto-market-clock.yml
          grep -Fq 'Atlas Public Energy Archive' .github/workflows/atlas-public-crypto-market-clock.yml
          grep -Fq 'Atlas Public Cross Market Archive' .github/workflows/atlas-public-crypto-market-clock.yml
          git fetch origin data/agent-crypto-live
          for file in latest.json status.json extended.json extended_status.json; do
            git show "origin/data/agent-crypto-live:public/agent_crypto_erith_ia/data/crypto/$file" > "/tmp/$file"
            python -m json.tool "/tmp/$file" >/dev/null
          done
          python - <<'PY'
          import json
          from pathlib import Path
          for name in ('status.json','extended_status.json'):
              data=json.loads(Path('/tmp',name).read_text(encoding='utf-8'))
              if data.get('status') != 'ready':
                  raise SystemExit(f'{name}: not ready')
              if data.get('last_error') not in (None, ''):
                  raise SystemExit(f'{name}: last_error={data.get("last_error")}')
          print('LIVE_DATA_404180_QUALIFIED')
          PY

      - name: Align secondary market version truth
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          base=Path('public/agent_crypto_erith_ia/administrator')
          for rel in ('js/market-stack.js','js/parallel-markets.js'):
              path=base/rel
              text=path.read_text(encoding='utf-8')
              old='const BUILD = "40.4.174";'
              if text.count(old) != 1:
                  raise SystemExit(f'{rel}: expected one legacy BUILD, got {text.count(old)}')
              path.write_text(text.replace(old,'const BUILD = "40.4.180";',1),encoding='utf-8')
          index=base/'index.html'
          text=index.read_text(encoding='utf-8')
          old='administrator-build-40.4.175'
          if text.count(old) != 4:
              raise SystemExit(f'index secondary asset token count mismatch: {text.count(old)}')
          index.write_text(text.replace(old,'administrator-build-40.4.180'),encoding='utf-8')
          PY
          node --check public/agent_crypto_erith_ia/administrator/js/market-stack.js
          node --check public/agent_crypto_erith_ia/administrator/js/parallel-markets.js

      - name: Write canonical 40.4.180 identity
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/contract-404180.json <<'JSON'
          {
            "schema": "erith.admin.live-data-branch-foundation.v1",
            "build": "40.4.180",
            "parent_build": "40.4.179",
            "live_data_branch": "data/agent-crypto-live",
            "top250_publication": "dual_main_plus_live_data_branch",
            "extended_publication": "dual_main_plus_live_data_branch",
            "watchdog_read_authority": "data/agent-crypto-live",
            "aether_pacemaker": {
              "owner": "atlas-public-crypto-market-clock.yml",
              "native_schedule": "17,47 * * * *",
              "stale_top250_seconds": 1200,
              "stale_extended_seconds": 2700,
              "requires_no_active_producer": true,
              "workflow_run_cross_checks": true,
              "parallel_market_fallback_wakes": true,
              "external_scheduler_independent": false
            },
            "frontend_cutover": false,
            "main_publication_retired": false,
            "non_destructive_retry": true,
            "exact_owned_file_staging": true,
            "force_push": false,
            "market_core_modified": false,
            "collector_semantics_changed": false,
            "financial_execution_added": false
          }
          JSON
          python .github/scripts/agent_crypto_release_driver.py \
            --build 40.4.180 --parent 40.4.179 \
            --release 'LIVE DATA BRANCH FOUNDATION · DUAL-PUBLISH QUALIFICATION' \
            --status live_data_branch_foundation_dual_publish_qualification \
            --contract-key live_data_branch_foundation_404180 \
            --contract-json /tmp/contract-404180.json \
            --lineage-note '40.4.180 Live Data Branch Foundation: dedicated data/agent-crypto-live authority qualified; Top-250 and Extended dual-publish non-destructively; Aether watchdog strengthened as an internal idempotent pacemaker; frontend cutover intentionally deferred.'

      - name: Validate complete release payload
        shell: bash
        run: |
          set -euo pipefail
          node --check public/agent_crypto_erith_ia/administrator/app.js
          node --check public/agent_crypto_erith_ia/administrator/js/app.js
          node --check public/agent_crypto_erith_ia/administrator/js/market-stack.js
          node --check public/agent_crypto_erith_ia/administrator/js/parallel-markets.js
          python -m py_compile .github/scripts/agent_crypto_release_driver.py .github/scripts/agent_crypto_version_truth_guard.py
          python .github/scripts/agent_crypto_version_truth_guard.py --expected-build 40.4.180 --expected-release 'LIVE DATA BRANCH FOUNDATION · DUAL-PUBLISH QUALIFICATION'
          grep -Fq 'const BUILD = "40.4.180";' public/agent_crypto_erith_ia/administrator/js/market-stack.js
          grep -Fq 'const BUILD = "40.4.180";' public/agent_crypto_erith_ia/administrator/js/parallel-markets.js
          test "$(grep -c 'administrator-build-40.4.180' public/agent_crypto_erith_ia/administrator/index.html)" -ge 6
          rm -rf .github/scripts/__pycache__
          echo 'REREAD_404180_PASS'

      - name: Commit final release and retire failed one-shots
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/agent-crypto-40-4-180-live-data-branch-foundation.yml
          git rm .github/workflows/agent-crypto-40-4-180-live-data-branch-foundation-retry.yml
          git add .github/scripts/agent_crypto_publish_live_data.sh \
                  .github/workflows/atlas-public-crypto-market.yml \
                  .github/workflows/atlas-public-crypto-extended.yml \
                  .github/workflows/atlas-public-crypto-market-clock.yml \
                  public/agent_crypto_erith_ia/administrator/app.js \
                  public/agent_crypto_erith_ia/administrator/js/app.js \
                  public/agent_crypto_erith_ia/administrator/js/market-stack.js \
                  public/agent_crypto_erith_ia/administrator/js/parallel-markets.js \
                  public/agent_crypto_erith_ia/administrator/index.html \
                  public/agent_crypto_erith_ia/administrator/version.json \
                  public/agent_crypto_erith_ia/administrator/administrator-version.json
          git diff --cached --check
          git commit -m 'release Agent-Crypto 40.4.180 live data branch foundation'

      - name: Push release with bounded race recovery
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            if git push origin HEAD:main; then
              RELEASE_SHA="$(git rev-parse HEAD)"
              echo "RELEASE_SHA=$RELEASE_SHA" >> "$GITHUB_ENV"
              echo "PUSH_404180_PASS $RELEASE_SHA"
              exit 0
            fi
            echo "main moved during release push; rebase attempt $attempt/6"
            git pull --rebase origin main
          done
          echo '40.4.180 release push failed after bounded recovery' >&2
          exit 1

      - name: Terminal release proof
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main data/agent-crypto-live
          git merge-base --is-ancestor "$RELEASE_SHA" origin/main
          git checkout --detach "$RELEASE_SHA"
          python .github/scripts/agent_crypto_version_truth_guard.py --expected-build 40.4.180 --expected-release 'LIVE DATA BRANCH FOUNDATION · DUAL-PUBLISH QUALIFICATION'
          bash -n .github/scripts/agent_crypto_publish_live_data.sh
          test ! -e .github/workflows/agent-crypto-40-4-180-live-data-branch-foundation.yml
          test ! -e .github/workflows/agent-crypto-40-4-180-live-data-branch-foundation-retry.yml
          grep -Fq 'const BUILD = "40.4.180";' public/agent_crypto_erith_ia/administrator/js/market-stack.js
          grep -Fq 'const BUILD = "40.4.180";' public/agent_crypto_erith_ia/administrator/js/parallel-markets.js
          echo "TERMINAL_404180_PASS $RELEASE_SHA"
