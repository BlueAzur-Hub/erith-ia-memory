      - "public/agent_crypto_erith_ia/tools/ai-history-source-catalog.test.mjs"
      - "public/agent_crypto_erith_ia/tools/ai-verified-history-reader.test.mjs"
      - "public/agent_crypto_erith_ia/trader/ai-verified-history-reader.js"
