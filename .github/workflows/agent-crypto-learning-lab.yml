name: Agent Crypto Learning Lab Read Only
on:
  pull_request:
    paths:
      - "public/agent_crypto_erith_ia/administrator/index.html"
      - "public/agent_crypto_erith_ia/administrator/build.json"
      - "public/agent_crypto_erith_ia/administrator/js/learning-lab.js"
      - "public/agent_crypto_erith_ia/administrator/css/learning-lab.css"
      - "public/agent_crypto_erith_ia/trader/build.json"
      - "public/agent_crypto_erith_ia/trader/trading-desk.html"
      - "public/agent_crypto_erith_ia/trader/trader-runtime-mirror.js"
      - "public/agent_crypto_erith_ia/tools/learning-lab.test.mjs"
      - "public/agent_crypto_erith_ia/tools/ai-source-inventory.test.mjs"
      - "public/agent_crypto_erith_ia/tools/ai-history-source-catalog.test.mjs"
      - "public/agent_crypto_erith_ia/tools/ai-verified-history-reader.test.mjs"
      - "public/agent_crypto_erith_ia/trader/ai-verified-history-reader.js"
      - "public/agent_crypto_erith_ia/trader/verified-reader.html"
      - "public/agent_crypto_erith_ia/trader/trader-historical-panel.js"
      - "public/agent_crypto_erith_ia/tools/trader-historical-panel.test.mjs"
      - "public/agent_crypto_erith_ia/trader/ai-history-source-catalog.js"
      - "public/agent_crypto_erith_ia/trader/source-catalogue.html"
      - "public/agent_crypto_erith_ia/trader/ai-source-inventory.js"
      - "public/agent_crypto_erith_ia/trader/historical-inventory.html"
      - ".github/workflows/agent-crypto-learning-lab.yml"
  push:
    branches: [main]
    paths:
      - "public/agent_crypto_erith_ia/administrator/index.html"
      - "public/agent_crypto_erith_ia/administrator/build.json"
      - "public/agent_crypto_erith_ia/administrator/js/learning-lab.js"
      - "public/agent_crypto_erith_ia/administrator/css/learning-lab.css"
      - "public/agent_crypto_erith_ia/trader/build.json"
      - "public/agent_crypto_erith_ia/trader/trading-desk.html"
      - "public/agent_crypto_erith_ia/trader/trader-runtime-mirror.js"
      - "public/agent_crypto_erith_ia/tools/learning-lab.test.mjs"
      - "public/agent_crypto_erith_ia/tools/ai-source-inventory.test.mjs"
      - "public/agent_crypto_erith_ia/tools/ai-history-source-catalog.test.mjs"
      - "public/agent_crypto_erith_ia/tools/ai-verified-history-reader.test.mjs"
      - "public/agent_crypto_erith_ia/trader/ai-verified-history-reader.js"
      - "public/agent_crypto_erith_ia/trader/verified-reader.html"
      - "public/agent_crypto_erith_ia/trader/trader-historical-panel.js"
      - "public/agent_crypto_erith_ia/tools/trader-historical-panel.test.mjs"
      - "public/agent_crypto_erith_ia/trader/ai-history-source-catalog.js"
      - "public/agent_crypto_erith_ia/trader/source-catalogue.html"
      - "public/agent_crypto_erith_ia/trader/ai-source-inventory.js"
      - "public/agent_crypto_erith_ia/trader/historical-inventory.html"
      - ".github/workflows/agent-crypto-learning-lab.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  read-only-laboratory:
    runs-on: ubuntu-latest
    steps:
      # Git sparse source for tests: small original witnesses only, never the whole vault.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/agent-crypto-learning-lab.yml
            /.github/workflows/agent-crypto-historical-ohlcv-incremental-r4.yml
            /.github/workflows/agent-crypto-historical-partitions-r11.yml
            /public/agent_crypto_erith_ia/administrator/index.html
            /public/agent_crypto_erith_ia/administrator/app.js
            /public/agent_crypto_erith_ia/administrator/build.json
            /public/agent_crypto_erith_ia/administrator/js/learning-lab.js
            /public/agent_crypto_erith_ia/administrator/js/graph-native-usd-406520.js
            /public/agent_crypto_erith_ia/administrator/css/learning-lab.css
            /public/agent_crypto_erith_ia/trader/*.js
            /public/agent_crypto_erith_ia/trader/*.html
            /public/agent_crypto_erith_ia/trader/*.json
            /public/agent_crypto_erith_ia/laboratoire/*.md
            /public/agent_crypto_erith_ia/tools/*.test.mjs
            /public/agent_crypto_erith_ia/data/historical_archive_prototype/top250_multisource_coverage/index.json
            /public/agent_crypto_erith_ia/data/historical_archive_prototype/top250_multiresolution_sources/index.json
            /public/agent_crypto_erith_ia/data/historical_archive_prototype/verified_periods/
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check syntax and educational behavior
        run: |
          set -euo pipefail
          node --check public/agent_crypto_erith_ia/administrator/js/learning-lab.js
          node --check public/agent_crypto_erith_ia/trader/ai-source-inventory.js
          node --check public/agent_crypto_erith_ia/trader/ai-history-source-catalog.js
          node --check public/agent_crypto_erith_ia/trader/ai-verified-history-reader.js
          node --check public/agent_crypto_erith_ia/trader/trader-historical-panel.js
          node --test public/agent_crypto_erith_ia/tools/learning-lab.test.mjs public/agent_crypto_erith_ia/tools/ai-source-inventory.test.mjs public/agent_crypto_erith_ia/tools/ai-history-source-catalog.test.mjs public/agent_crypto_erith_ia/tools/ai-verified-history-reader.test.mjs public/agent_crypto_erith_ia/tools/trader-historical-panel.test.mjs
      - name: Validate 40.6.640 manifests and BTC panel restoration
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            git fetch origin main
            baseline="$(git merge-base HEAD origin/main)"
          else
            baseline="HEAD^"
          fi
          export BASELINE="$baseline"
          git diff --exit-code "$baseline" HEAD -- \
            public/agent_crypto_erith_ia/data/historical_archive_prototype/ \
            public/agent_crypto_erith_ia/core/ \
            public/agent_crypto_erith_ia/administrator/app.js
          python - <<'PY'
          import copy, json, os, pathlib, subprocess
          base=os.environ["BASELINE"]
          prefix="public/agent_crypto_erith_ia/"
          allowed={
            prefix+"trader/build.json",
            prefix+"trader/trading-desk.html",
            prefix+"trader/trader-runtime-mirror.js",
            prefix+"trader/trader-historical-panel.js",
            prefix+"trader/ai-source-inventory.js",
            prefix+"trader/historical-inventory.html",
            prefix+"trader/ai-history-source-catalog.js",
            prefix+"trader/source-catalogue.html",
            prefix+"trader/ai-verified-history-reader.js",
            prefix+"trader/verified-reader.html",
          }
          changed=set(subprocess.check_output(
            ["git","diff","--name-only",base,"HEAD","--",prefix+"trader/"],
            text=True).splitlines())
          assert changed <= allowed, f"Unauthorised Trader changes: {changed-allowed}"
          def previous(path):
            return subprocess.check_output(["git","show",base+":"+path],text=True)
          def current(path):
            return pathlib.Path(path).read_text(encoding="utf-8")
          def jsondiff(path,updates):
            original=json.loads(previous(path))
            actual=json.loads(current(path))
            expected=copy.deepcopy(original)
            for key,value in updates.items():
              if key=="delivery.zip":
                expected["delivery"]["zip"]=value
              else:
                expected[key]=value
            assert actual==expected, f"Unexpected fields changed in {path}"
            return actual
          admin=jsondiff(prefix+"administrator/build.json",{
            "build":"40.6.640","parent_build":"40.6.639",
            "administrator_build":"40.6.640",
            "build_label":"Build 40.6.640 · Administrator",
            "release":"COFFRE · HISTORIQUE VISIBLE ET CONTEXTE CT",
            "status":"TRADER_COFFRE_VISIBLE_CI_PENDING_FIREFOX",
            "new_observer":True,"new_storage_owner":True,
            "delivery.zip":"AGENT_CRYPTO_LABORATOIRE.zip (workflow artifact pending build and Firefox validation)",
          })
          trader=jsondiff(prefix+"trader/build.json",{
            "build":"40.6.640","parent_trader_build":"40.6.639",
            "administrator_base":"40.6.640",
            "release":"COFFRE · HISTORIQUE VISIBLE ET CONTEXTE CT",
            "status":"TRADER_COFFRE_VISIBLE_CI_PENDING_FIREFOX",
            "delivery.zip":"AGENT_CRYPTO_LABORATOIRE.zip (workflow artifact pending build and Firefox validation)",
          })
          for f in allowed-{prefix+"trader/build.json",prefix+"trader/trader-historical-panel.js",prefix+"trader/ai-source-inventory.js",prefix+"trader/historical-inventory.html",prefix+"trader/ai-history-source-catalog.js",prefix+"trader/source-catalogue.html",prefix+"trader/ai-verified-history-reader.js",prefix+"trader/verified-reader.html"}:
            if f==prefix+"trader/trader-runtime-mirror.js":
              expected=previous(f).replace("40.6.639","40.6.640").replace("trader-historical-panel.js?reader=top50-cohorts","trader-historical-panel.js?reader=visible-coffre")
            else:
              expected=previous(f).replace("40.6.639","40.6.640")
            assert current(f)==expected,f"Non-version Trader change: {f}"
          index=current(prefix+"administrator/index.html")
          assert admin["engine"]==trader["market_core"]=="38.15.11"
          assert admin["build"]==trader["build"]=="40.6.640"
          assert 'name="agent-crypto-loaded-build" content="40.6.640"' in index
          assert 'js/learning-lab.js?v=40.6.640' in index
          assert 'css/learning-lab.css?v=40.6.640' in index
          assert trader["real_orders"] is False and admin["real_order"] is False
          assert trader["terrain_verified"] is False
          print("Lab 40.6.640: manifests and protected fields OK")
          PY
      - name: Create and verify lightweight Laboratory source ZIP
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os, stat, zipfile
          from pathlib import Path
          root = Path("public/agent_crypto_erith_ia")
          files = [
              root/"administrator/index.html",
              root/"administrator/build.json",
              root/"administrator/js/learning-lab.js",
              root/"administrator/css/learning-lab.css",
              root/"trader/build.json",
              root/"trader/trading-desk.html",
              root/"trader/trader-runtime-mirror.js",
              root/"trader/trader-historical-panel.js",
              root/"trader/ai-source-inventory.js",
              root/"trader/historical-inventory.html",
              root/"trader/ai-history-source-catalog.js",
              root/"trader/source-catalogue.html",
              root/"trader/ai-verified-history-reader.js",
              root/"trader/verified-reader.html",
              root/"laboratoire/REPRISE_SEVEN_HEAVEN.md",
              root/"laboratoire/cas-ecole-concrete.md",
          ]
          denied={"data","assets","downloads","vault","archives","releases","evidence"}
          assert len(files)==len(set(files))==16
          assert all(not denied.intersection(p.parts) and p.suffix.lower() in (".html",".css",".js",".json",".md") for p in files)
          sources={}
          for path in files:
              assert path.is_file() and not path.is_symlink(), f"Source missing or unsafe: {path}"
              assert stat.S_ISREG(path.stat().st_mode) and path.stat().st_size <= 1500000, f"Unexpected Laboratory file: {path}"
              sources[path.as_posix()]=path.read_bytes()
          assert sum(map(len,sources.values())) <= 3000000, "Laboratory source package too large"
          manifest={
              "schema":"erith.ia.laboratoire.source-bundle.v1",
              "type":"selected-source-files-not-standalone",
              "source_commit":os.environ.get("GITHUB_SHA","unknown"),
              "requires_existing_trader_runtime":True,
              "includes_historical_data":False,
              "source_sha256":{name:hashlib.sha256(data).hexdigest() for name,data in sources.items()}
          }
          name="AGENT_CRYPTO_LABORATOIRE.zip"
          output=Path(os.environ["RUNNER_TEMP"])/"laboratoire-artifact"/name
          output.parent.mkdir(parents=True,exist_ok=True)
          with zipfile.ZipFile(output,"w",zipfile.ZIP_DEFLATED,compresslevel=9) as z:
              for pathname,payload in sources.items():
                  z.writestr(pathname,payload)
              z.writestr("LABORATOIRE_SOURCE_MANIFEST.json",json.dumps(manifest,sort_keys=True,indent=2))
          assert output.stat().st_size <= 1000000, "Laboratory ZIP exceeded 1MB budget"
          with zipfile.ZipFile(output) as z:
              assert z.testzip() is None
              assert set(z.namelist())==set(sources)|{"LABORATOIRE_SOURCE_MANIFEST.json"}
              assert all(hashlib.sha256(z.read(n)).hexdigest()==manifest["source_sha256"][n] for n in sources)
          digest=hashlib.sha256(output.read_bytes()).hexdigest()
          (output.parent/(name+".sha256")).write_text(digest+"  "+name+"\n",encoding="utf-8")
          print(f"LAB LIGHT: {len(sources)} sources, {output.stat().st_size} bytes ZIP, SHA-256 {digest}")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: AGENT_CRYPTO_LABORATOIRE
          path: |
            ${{ runner.temp }}/laboratoire-artifact/AGENT_CRYPTO_LABORATOIRE.zip
            ${{ runner.temp }}/laboratoire-artifact/AGENT_CRYPTO_LABORATOIRE.zip.sha256
          if-no-files-found: error
          retention-days: 14
