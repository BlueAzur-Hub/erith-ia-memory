      - "public/agent_crypto_erith_ia/trader/ai-history-source-catalog.js"
      - "public/agent_crypto_erith_ia/trader/source-catalogue.html"
      - "public/agent_crypto_erith_ia/trader/ai-source-inventory.js"
      - "public/agent_crypto_erith_ia/trader/historical-inventory.html"
      - ".github/workflows/agent-crypto-learning-lab.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  read-only-laboratory:
    runs-on: ubuntu-latest
    steps:
      # Git sparse source for tests: small original witnesses only, never the whole vault.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/agent-crypto-learning-lab.yml
            /.github/workflows/agent-crypto-historical-ohlcv-incremental-r4.yml
            /.github/workflows/agent-crypto-historical-partitions-r11.yml
            /public/agent_crypto_erith_ia/administrator/index.html
            /public/agent_crypto_erith_ia/administrator/app.js
            /public/agent_crypto_erith_ia/administrator/build.json
            /public/agent_crypto_erith_ia/administrator/js/learning-lab.js
            /public/agent_crypto_erith_ia/administrator/js/graph-native-usd-406520.js
            /public/agent_crypto_erith_ia/administrator/css/learning-lab.css
            /public/agent_crypto_erith_ia/trader/*.js
            /public/agent_crypto_erith_ia/trader/trader-order-entry.css
            /public/agent_crypto_erith_ia/trader/test-paper-decision.cjs
            /public/agent_crypto_erith_ia/trader/test-strategy-comparator.cjs
            /public/agent_crypto_erith_ia/data/trader_flux/radar20_portfolio/summary.json
            /public/agent_crypto_erith_ia/data/trader_flux/radar20_retro_stress/summary.json
            /public/agent_crypto_erith_ia/trader/*.html
            /public/agent_crypto_erith_ia/trader/*.json
            /public/agent_crypto_erith_ia/laboratoire/*.md
            /public/agent_crypto_erith_ia/tools/*.test.mjs
            /public/agent_crypto_erith_ia/data/historical_archive_prototype/top250_multisource_coverage/index.json
            /public/agent_crypto_erith_ia/data/historical_archive_prototype/top250_multiresolution_sources/index.json
            /public/agent_crypto_erith_ia/data/historical_archive_prototype/verified_periods/
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check syntax and educational behavior
        run: |
          set -euo pipefail
          node --check public/agent_crypto_erith_ia/administrator/js/learning-lab.js
          node --check public/agent_crypto_erith_ia/trader/ai-source-inventory.js
          node --check public/agent_crypto_erith_ia/trader/ai-history-source-catalog.js
          node --check public/agent_crypto_erith_ia/trader/ai-verified-history-reader.js
          node --check public/agent_crypto_erith_ia/trader/trader-historical-panel.js
          node --check public/agent_crypto_erith_ia/trader/strategy-comparator.js
          node public/agent_crypto_erith_ia/trader/test-strategy-comparator.cjs
          node --test public/agent_crypto_erith_ia/tools/learning-lab.test.mjs public/agent_crypto_erith_ia/tools/ai-source-inventory.test.mjs public/agent_crypto_erith_ia/tools/ai-history-source-catalog.test.mjs public/agent_crypto_erith_ia/tools/ai-verified-history-reader.test.mjs public/agent_crypto_erith_ia/tools/trader-historical-panel.test.mjs
      - name: Validate 40.6.640 manifests and BTC panel restoration
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            git fetch origin main
            baseline="$(git merge-base HEAD origin/main)"
          else
            baseline="HEAD^"
          fi
          export BASELINE="$baseline"
          git diff --exit-code "$baseline" HEAD -- \
            public/agent_crypto_erith_ia/data/historical_archive_prototype/ \
            public/agent_crypto_erith_ia/core/
          # Strict one-time subtraction of the abandoned Snapshot-only accessor.
          # All other app.js bytes must remain identical to the protected baseline.
          python - <<'PY'
          import os,pathlib,subprocess
          path="public/agent_crypto_erith_ia/administrator/app.js"
          before=subprocess.check_output(["git","show",os.environ["BASELINE"]+":"+path],text=True)
          after=pathlib.Path(path).read_text(encoding="utf-8")
          marker="/* Snapshot Analyse — canonical graph series in read-only memory."
          boundary="function atlasMarketExternalRowMarkup(rawQuery) {"
          if marker in before:
              assert before.count(marker)==1, "Unexpected duplicate Snapshot accessor"
              start=before.index(marker)
              end=before.index(boundary,start)
              removed=before[start:end]
              assert "function atlasPublishedChartSeriesRead()" in removed
              assert "globalThis.AgentCryptoPublishedSeries=Object.freeze({" in removed
              assert "read_only:true,fetches:0,storage_writes:0,real_orders:false" in removed
              expected=before[:start]+before[end:]
          else:
              expected=before
          # Historical baseline can already contain the merged Trader reader gate.
          # Strip it ONLY when absent from the baseline being compared.
          # Any unrelated app.js change must still fail this strict check.
          producer_policy = (
              "function atlasTraderPassiveReportSurface() {\n"
              "  // The Trader embeds the shared Administrator runtime but never owns CURRENT.\n"
              "  // Read URL only: do not mutate the Ryzen producer's shared localStorage role.\n"
              '  try { return new URLSearchParams(location.search).get("surface") === "trader"; }\n'
              "  catch (_) { return false; }\n"
              "}\n\n"
          )
          if producer_policy in after and producer_policy not in before:
              assert after.count(producer_policy)==1
              after=after.replace(producer_policy,"",1)
              statement="\n  if (atlasTraderPassiveReportSurface()) return false;"
              assert after.count(statement)==16, "Trader gate count changed"
              after=after.replace(statement,"")
          # Allow only the audited Market queue/HTTP timeout ordering change.
          # This is NOT a blanket exemption from Administrator byte-for-byte protection.
          queue_timer_before = "  const timer = setTimeout(() => controller.abort(), timeout);\n  const requestOptions = { ...options };\n"
          queue_timer_after = "  let timer = null;\n  const requestOptions = { ...options };\n"
          queue_fetch_before = "    if (networkKind) networkToken = await atlasAcquireNetwork(networkKind, externalSignal, networkWaitMs);\n    const response = await fetch(url, {\n"
          queue_fetch_after = "    if (networkKind) networkToken = await atlasAcquireNetwork(networkKind, externalSignal, networkWaitMs);\n    // A queued source must receive its full HTTP timeout after acquiring the network permit.\n    timer = setTimeout(() => controller.abort(), timeout);\n    const response = await fetch(url, {\n"
          if queue_timer_after in after and queue_fetch_after in after:
              if queue_timer_before in expected and queue_fetch_before in expected:
                  assert expected.count(queue_timer_before)==1 and expected.count(queue_fetch_before)==1
                  expected=expected.replace(queue_timer_before,queue_timer_after,1)
                  expected=expected.replace(queue_fetch_before,queue_fetch_after,1)
          assert after==expected, "Administrator core changed beyond exact Snapshot removal or audited Trader guard"
          PY
          python - <<'PY'
          import copy, json, os, pathlib, subprocess
          base=os.environ["BASELINE"]
          prefix="public/agent_crypto_erith_ia/"
          allowed={
            prefix+"trader/build.json",
            prefix+"trader/trading-desk.html",
            prefix+"trader/trader-runtime-mirror.js",
            prefix+"trader/trader-historical-panel.js",
            prefix+"trader/ai-source-inventory.js",
            prefix+"trader/historical-inventory.html",
            prefix+"trader/ai-history-source-catalog.js",
            prefix+"trader/source-catalogue.html",
            prefix+"trader/ai-verified-history-reader.js",
            prefix+"trader/verified-reader.html",
            prefix+"trader/math-core-external-guard.js",
            prefix+"trader/clear-external-selection-guard.js",
            prefix+"trader/trader-paper-lab-core.js",
            prefix+"trader/trader-paper-lab-view.js",
            prefix+"trader/test-paper-lab.cjs",
            # Seven Technical Reading DOM regression checks.
            prefix+"trader/test-ai-asset-reading-view.cjs",
            # Seven's Trader-only navigation, without changing Concrete CT.
            prefix+"trader/ai-asset-reading-view.js",
            prefix+"trader/trader-candles-minute-watch.js",
            # Explicitly reviewed, Trader-only, no order interfaces.
            prefix+"trader/trader-paper-decision-core.js",
            prefix+"trader/trader-paper-decision-view.js",
            prefix+"trader/test-paper-decision.cjs",
            # Option C: exactly two presentation-only, Trader-scoped files.
            prefix+"trader/trader-order-entry-view.js",
            prefix+"trader/trader-order-entry.css",
            # Narrow read-only comparator.
            prefix+"trader/strategy-comparator.js",
            prefix+"trader/test-strategy-comparator.cjs",
          }
          changed=set(subprocess.check_output(
            ["git","diff","--name-only",base,"HEAD","--",prefix+"trader/"],
            text=True).splitlines())
          assert changed <= allowed, f"Unauthorised Trader changes: {changed-allowed}"
          def previous(path):
            return subprocess.check_output(["git","show",base+":"+path],text=True)
          def current(path):
            return pathlib.Path(path).read_text(encoding="utf-8")
          def jsondiff(path,updates):
            original=json.loads(previous(path))
            actual=json.loads(current(path))
            expected=copy.deepcopy(original)
            for key,value in updates.items():
              if key=="delivery.zip":
                expected["delivery"]["zip"]=value
              else:
                expected[key]=value
            assert actual==expected, f"Unexpected fields changed in {path}"
            return actual
          admin=jsondiff(prefix+"administrator/build.json",{
            "build":"40.6.640","parent_build":"40.6.639",
            "administrator_build":"40.6.640",
            "build_label":"Build 40.6.640 · Administrator",
            "release":"COFFRE · HISTORIQUE VISIBLE ET CONTEXTE CT",
            "status":"TRADER_COFFRE_VISIBLE_CI_PENDING_FIREFOX",
            "new_observer":True,"new_storage_owner":True,
            "delivery.zip":"AGENT_CRYPTO_LABORATOIRE.zip (workflow artifact pending build and Firefox validation)",
          })
          trader=jsondiff(prefix+"trader/build.json",{
            "build":"40.6.640","parent_trader_build":"40.6.639",
            "administrator_base":"40.6.640",
            "release":"COFFRE · HISTORIQUE VISIBLE ET CONTEXTE CT",
            "status":"TRADER_COFFRE_VISIBLE_CI_PENDING_FIREFOX",
            "delivery.zip":"AGENT_CRYPTO_LABORATOIRE.zip (workflow artifact pending build and Firefox validation)",
          })
          for f in allowed-{prefix+"trader/build.json",prefix+"trader/trader-historical-panel.js",prefix+"trader/ai-source-inventory.js",prefix+"trader/historical-inventory.html",prefix+"trader/ai-history-source-catalog.js",prefix+"trader/source-catalogue.html",prefix+"trader/ai-verified-history-reader.js",prefix+"trader/verified-reader.html",prefix+"trader/math-core-external-guard.js",prefix+"trader/clear-external-selection-guard.js",prefix+"trader/trader-paper-lab-core.js",prefix+"trader/trader-paper-lab-view.js",prefix+"trader/test-paper-lab.cjs",prefix+"trader/test-ai-asset-reading-view.cjs",prefix+"trader/ai-asset-reading-view.js",prefix+"trader/trader-candles-minute-watch.js",prefix+"trader/trader-paper-decision-core.js",prefix+"trader/trader-paper-decision-view.js",prefix+"trader/test-paper-decision.cjs",prefix+"trader/trader-order-entry-view.js",prefix+"trader/trader-order-entry.css",prefix+"trader/strategy-comparator.js",prefix+"trader/test-strategy-comparator.cjs"}:
            if f==prefix+"trader/trader-runtime-mirror.js":
              expected=previous(f).replace("40.6.639","40.6.640").replace("trader-historical-panel.js?reader=top50-cohorts","trader-historical-panel.js?reader=visible-coffre")
              actual=current(f)
              # Subtract ONLY the new, separately tested read-only PAPER
              # diagnostic loader when it is absent from the protected base.
              addon="      // Add the optional public evidence reader to the EXISTING PAPER lab.\n"
              addon_end="      doc.head.appendChild(view);"
              if addon in actual and addon not in expected:
                assert actual.count(addon)==1
                front, tail=actual.split(addon,1)
                assert tail.count(addon_end)>=1
                removed, following=tail.split(addon_end,1)
                assert 'view.onload=()=>{' in removed
                assert 'trader-paper-decision-core.js' in removed
                assert 'trader-paper-decision-view.js' in removed
                assert 'spot-paper-order-engine.js' in removed
                assert '/trade/order' not in removed and '/withdraw' not in removed
                actual=front+addon_end+following
              first="  // Visible PAPER laboratory."
              last="  // Trader-only continuity, deliberately not loaded in the public Interface."
              if first in actual and first not in expected:
                assert actual.count(first)==1 and actual.count(last)==1
                head,tail=actual.split(first,1)
                paper,rest=tail.split(last,1)
                assert 'trader-paper-lab-core.js' in paper and 'trader-paper-lab-view.js' in paper
                assert '/trade/order' not in paper and '/withdraw' not in paper
                actual=head+last+rest
              # Strip only the approved visual order-entry asset loader.
              # The original PAPER core/Bridge read owner remains unchanged.
              visual_css=(
                '  // The order-entry stylesheet is scoped to #traderOkxTicket only.\n'
                '  if(!doc.getElementById("traderOrderEntryStyle")){\n'
                '    const sheet=doc.createElement("link");\n'
                '    sheet.id="traderOrderEntryStyle";sheet.rel="stylesheet";\n'
                '    sheet.href=new URL("../trader/trader-order-entry.css",doc.baseURI).href;\n'
                '    doc.head.appendChild(sheet);\n'
                '  }\n'
              )
              visual_chain=(
                '        const loadOrderEntry=()=>add("traderOrderEntryViewScript","trader-order-entry-view.js",mountDecision);\n'
                '        const loadDecision=()=>add("traderPaperDecisionCoreScript","trader-paper-decision-core.js",loadOrderEntry);'
              )
              original_chain='        const loadDecision=()=>add("traderPaperDecisionCoreScript","trader-paper-decision-core.js",mountDecision);'
              if visual_css in actual and visual_css not in expected:
                assert actual.count(visual_css)==1
                actual=actual.replace(visual_css,"",1)
              if visual_chain in actual and visual_chain not in expected:
                assert actual.count(visual_chain)==1
                actual=actual.replace(visual_chain,original_chain,1)
              # Exact, audited, Trader-only Seven bridge; no broad exemption.
              seven_loader="  // Trader-only Technical Reading owner. This script mounts the isolated\n  // Seven dossier itself; Concrete CT remains the independent private owner.\n  // The Administrator entrypoint must never import this Trader-only reader.\n  if(!doc.getElementById(\"traderTechnicalReadingSyncScript\")){\n    const script=doc.createElement(\"script\");\n    script.id=\"traderTechnicalReadingSyncScript\";\n    script.src=new URL(\"../trader/technical-reading-data-sync.js\",doc.baseURI).href;\n    script.onerror=()=>{\n      if(status){\n        status.textContent=\"Lecture Seven indisponible ; Concrete CT reste intact.\";\n        status.dataset.state=\"error\";\n      }\n    };\n    doc.head.appendChild(script);\n  }\n"
              if seven_loader in actual and seven_loader not in expected:
                assert actual.count(seven_loader)==1
                assert actual.index("traderAiCtContractScript") < actual.index(seven_loader)
                assert actual.index(seven_loader) < actual.index("  // Visible PAPER laboratory.")
                assert "/trade/order" not in seven_loader and "localStorage." not in seven_loader
                assert "indexedDB." not in seven_loader and "setInterval(" not in seven_loader
                actual=actual.replace(seven_loader,"",1)
              # Exact public-only loader, no blanket exception.
              strategy_loader=(
                '        // Lightweight read-only comparison: mounts next to the existing PAPER lab.\n'
                '        // Its two public reports are fetched ONLY if the operator opens it.\n'
                '        add("traderStrategyComparatorScript","strategy-comparator.js");\n'
              )
              if strategy_loader in actual and strategy_loader not in expected:
                assert actual.count(strategy_loader)==1
                assert actual.index(strategy_loader)<actual.index('        const mountDecision=')
                assert 'traderPaperLabCoreScript' in actual
                actual=actual.replace(strategy_loader,"",1)
              assert actual==expected,f"Non-version Trader change beyond PAPER extension: {f}"
              continue
            else:
              expected=previous(f).replace("40.6.639","40.6.640")
            assert current(f)==expected,f"Non-version Trader change: {f}"
          # A bounded navigation-only Seven addition; the original Concrete
          # owner and all protected Trader runtime bytes are still checked.
          seven_view=current(prefix+"trader/ai-asset-reading-view.js")
          assert "AgentCryptoNewListingsNativeCategory?.snapshot?.()" in seven_view
          assert "aiSevenToggle" in seven_view
          assert "quick.hidden=true" in seven_view
          assert "quick.textContent='IA · Seven · '+selection.symbol" in seven_view
          assert "panel.open=true" in seven_view
          assert "if(symbol==='CT'||graphBase==='CT')" in seven_view
          assert "privateButton.disabled=busy||!isNativeOkx" in seven_view
          for forbidden in ("localStorage.", "indexedDB.", "sessionStorage.",
                           "/api/v5/trade/order", "/trade/order", "/withdraw",
                           "setInterval(", "MutationObserver", "aiCtPanel.hidden",
                           "aiCtPanel.open"):
            assert forbidden not in seven_view, f"Seven navigation policy violation: {forbidden}"
          # Narrow safety review of the new public reader.
          strategy=current(prefix+"trader/strategy-comparator.js")
          strategy_test=current(prefix+"trader/test-strategy-comparator.cjs")
          assert 'AgentCryptoStrategyComparator' in strategy
          assert 'if(!node?.open||active)return' in strategy
          assert 'credentials:"omit"' in strategy
          assert 'strategy_certified!==false' in strategy
          assert 'realOrders:false,storage:false,privateAccount:false' in strategy
          assert 'qualifyReport' in strategy and 'compare' in strategy
          assert 'strategy-comparator.js' in strategy_test
          for forbidden in ("localStorage", "sessionStorage", "indexedDB",
                            "/api/v5/trade/order", "/trade/order", "/withdraw",
                            "setInterval(", "Authorization", "Bearer "):
            assert forbidden not in strategy, f"Strategy comparator forbidden behavior: {forbidden}"
          # Safety controls for existing modules remain unchanged.
          decision_core=current(prefix+"trader/trader-paper-decision-core.js")
          decision_view=current(prefix+"trader/trader-paper-decision-view.js")
          decision_test=current(prefix+"trader/test-paper-decision.cjs")
          order_entry=current(prefix+"trader/trader-order-entry-view.js")
          order_style=current(prefix+"trader/trader-order-entry.css")
          assert 'AgentCryptoTraderOrderEntryView' in order_entry
          assert 'realOrders:false,readOnly:true' in order_entry
          assert '#traderOkxTicket' in order_style and '@media' in order_style
          for forbidden in ('fetch(', 'XMLHttpRequest', 'localStorage', 'sessionStorage',
                            '/api/v5/trade/order', 'Authorization', 'Bearer', 'setInterval('):
            assert forbidden not in order_entry, f"Visual Trader safety violation: {forbidden}"
          assert 'trader-order-entry-view.js' in current(prefix+"trader/trader-runtime-mirror.js")
          assert 'trader-order-entry.css' in current(prefix+"trader/trader-runtime-mirror.js")
          assert 'realOrders:false,network:false,storage:false' in decision_core
          assert 'strategy_certified:false' in decision_core
          assert 'getElementById("traderPaperLab")' in decision_view
          assert 'AgentCryptoTraderPaperLab?.source' in decision_view
          assert 'no-store' in decision_view
          assert 'node:test' in decision_test
          for source in (decision_core,decision_view):
            assert '/trade/order' not in source and '/withdraw' not in source
            assert 'setInterval(' not in source and 'localStorage.' not in source
          assert 'fetch(' not in decision_core
          guard=current(prefix+"trader/math-core-external-guard.js")
          assert "AgentCryptoTraderExternalMathGuard" in guard
          assert 'real_orders:false' in guard
          assert "setInterval(" not in guard and "MutationObserver" not in guard
          clear_guard=current(prefix+"trader/clear-external-selection-guard.js")
          assert "AgentCryptoNewListingsNativeCategory" in clear_guard and "event.isTrusted !== true" in clear_guard
          assert "setInterval(" not in clear_guard and "MutationObserver" not in clear_guard
          index=current(prefix+"administrator/index.html")
          assert 'src="../trader/math-core-external-guard.js"' in index
          assert 'src="../trader/clear-external-selection-guard.js"' in index
          assert admin["engine"]==trader["market_core"]=="38.15.11"
          assert admin["build"]==trader["build"]=="40.6.640"
          assert 'name="agent-crypto-loaded-build" content="40.6.640"' in index
          assert 'js/learning-lab.js?v=40.6.640' in index
          assert 'css/learning-lab.css?v=40.6.640' in index
          assert trader["real_orders"] is False and admin["real_order"] is False
          assert trader["terrain_verified"] is False
          print("Lab 40.6.640: manifests and protected fields OK")
          PY
      - name: Create and verify lightweight Laboratory source ZIP
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os, stat, zipfile
          from pathlib import Path
          root = Path("public/agent_crypto_erith_ia")
          files = [
              root/"administrator/index.html",
              root/"administrator/build.json",
              root/"administrator/js/learning-lab.js",
              root/"administrator/css/learning-lab.css",
              root/"trader/build.json",
              root/"trader/trading-desk.html",
              root/"trader/trader-runtime-mirror.js",
              root/"trader/strategy-comparator.js",
              root/"trader/trader-historical-panel.js",
              root/"trader/ai-source-inventory.js",
              root/"trader/historical-inventory.html",
              root/"trader/ai-history-source-catalog.js",
              root/"trader/source-catalogue.html",
              root/"trader/ai-verified-history-reader.js",
              root/"trader/verified-reader.html",
              root/"laboratoire/REPRISE_SEVEN_HEAVEN.md",
              root/"laboratoire/cas-ecole-concrete.md",
          ]
          denied={"data","assets","downloads","vault","archives","releases","evidence"}
          assert len(files)==len(set(files))==17
          assert all(not denied.intersection(p.parts) and p.suffix.lower() in (".html",".css",".js",".json",".md") for p in files)
          sources={}
          for path in files:
              assert path.is_file() and not path.is_symlink(), f"Source missing or unsafe: {path}"
              assert stat.S_ISREG(path.stat().st_mode) and path.stat().st_size <= 1500000, f"Unexpected Laboratory file: {path}"
              sources[path.as_posix()]=path.read_bytes()
          assert sum(map(len,sources.values())) <= 3000000, "Laboratory source package too large"
          manifest={
              "schema":"erith.ia.laboratoire.source-bundle.v1",
              "type":"selected-source-files-not-standalone",
              "source_commit":os.environ.get("GITHUB_SHA","unknown"),
              "requires_existing_trader_runtime":True,
              "includes_historical_data":False,
              "source_sha256":{name:hashlib.sha256(data).hexdigest() for name,data in sources.items()}
          }
          name="AGENT_CRYPTO_LABORATOIRE.zip"
          output=Path(os.environ["RUNNER_TEMP"])/"laboratoire-artifact"/name
          output.parent.mkdir(parents=True,exist_ok=True)
          with zipfile.ZipFile(output,"w",zipfile.ZIP_DEFLATED,compresslevel=9) as z:
              for pathname,payload in sources.items():
                  z.writestr(pathname,payload)
              z.writestr("LABORATOIRE_SOURCE_MANIFEST.json",json.dumps(manifest,sort_keys=True,indent=2))
          assert output.stat().st_size <= 1000000, "Laboratory ZIP exceeded 1MB budget"
          with zipfile.ZipFile(output) as z:
              assert z.testzip() is None
              assert set(z.namelist())==set(sources)|{"LABORATOIRE_SOURCE_MANIFEST.json"}
              assert all(hashlib.sha256(z.read(n)).hexdigest()==manifest["source_sha256"][n] for n in sources)
          digest=hashlib.sha256(output.read_bytes()).hexdigest()
          (output.parent/(name+".sha256")).write_text(digest+"  "+name+"\n",encoding="utf-8")
          print(f"LAB LIGHT: {len(sources)} sources, {output.stat().st_size} bytes ZIP, SHA-256 {digest}")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: AGENT_CRYPTO_LABORATOIRE
          path: |
            ${{ runner.temp }}/laboratoire-artifact/AGENT_CRYPTO_LABORATOIRE.zip
            ${{ runner.temp }}/laboratoire-artifact/AGENT_CRYPTO_LABORATOIRE.zip.sha256
          if-no-files-found: error
          retention-days: 14
