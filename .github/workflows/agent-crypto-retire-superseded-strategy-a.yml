name: Agent-Crypto Retire Superseded Strategy A

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/agent-crypto-retire-superseded-strategy-a.yml'
      - '.github/scripts/agent_crypto_retire_superseded_strategy_a_modules.py'

permissions:
  contents: write

concurrency:
  group: agent-crypto-retire-superseded-strategy-a
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Synchronize
        run: git pull --ff-only origin main

      - name: Retire proven superseded Strategy A modules
        run: python .github/scripts/agent_crypto_retire_superseded_strategy_a_modules.py

      - name: JavaScript syntax check
        run: |
          find public/agent_crypto_erith_ia/administrator -type f -name '*.js' -print0 \
            | xargs -0 -n1 node --check

      - name: Runtime reference sanity
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          root=Path('public/agent_crypto_erith_ia/administrator')
          shell=(root/'runtime-shell.html').read_text(encoding='utf-8')
          missing=[]
          for ref in re.findall(r'(?:src|href)=["\'](\./[^"\']+)["\']', shell):
              clean=ref.split('?',1)[0]
              if not (root/clean[2:]).exists():
                  missing.append(clean)
          if missing:
              raise SystemExit('Missing runtime references: '+', '.join(sorted(set(missing))))
          print('Runtime references OK')
          PY

      - name: Duplicate shell DOM id guard
        run: |
          python - <<'PY'
          from pathlib import Path
          import collections,re
          shell=Path('public/agent_crypto_erith_ia/administrator/runtime-shell.html').read_text(encoding='utf-8')
          ids=re.findall(r'\bid=["\']([^"\']+)["\']',shell,re.I)
          dup=[x for x,n in collections.Counter(ids).items() if n>1]
          if dup:
              raise SystemExit('Duplicate shell DOM ids: '+', '.join(sorted(dup)))
          print('Shell DOM ids unique')
          PY

      - name: Strategy A compatibility chain guard
        run: |
          test -f public/agent_crypto_erith_ia/administrator/js/strategy-a-auto-session-continuity-406120.js
          test -f public/agent_crypto_erith_ia/administrator/js/strategy-a-auto-session-continuity-406121.js
          test -f public/agent_crypto_erith_ia/administrator/js/strategy-a-auto-owner-autostart-406124.js
          echo 'Strategy A compatibility chain preserved'

      - name: Market Core lock guard
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          data=json.loads(Path('public/agent_crypto_erith_ia/administrator/build.json').read_text(encoding='utf-8'))
          engine=str(data.get('engine_build') or data.get('engine') or data.get('market_core') or '')
          if '38.15.11' not in engine:
              raise SystemExit(f'Market Core lock violated: {engine!r}')
          print('Market Core 38.15.11 locked')
          PY

      - name: Commit cleanup and retire one-shot tooling
        run: |
          set -euo pipefail
          git config user.name 'Seven Heaven Refactor'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A public/agent_crypto_erith_ia/administrator
          git rm -f .github/workflows/agent-crypto-retire-superseded-strategy-a.yml
          git rm -f .github/scripts/agent_crypto_retire_superseded_strategy_a_modules.py
          if git diff --cached --quiet; then
            echo 'No proven superseded Strategy A modules to retire'
            exit 0
          fi
          git commit -m 'refactor(agent-crypto): retire superseded Strategy A modules'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo 'Rebase conflict; refusing force-push'
              exit 1
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          echo 'Push remained contested after safe retries'
          exit 1
