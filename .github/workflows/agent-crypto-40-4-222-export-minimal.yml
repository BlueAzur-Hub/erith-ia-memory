name: Agent-Crypto 40.4.222 Minimal Changed-Files Export

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/agent-crypto-40-4-222-export-minimal.yml'

permissions:
  contents: write

env:
  RELEASE_SHA: 'e6898cd1fbbd18099d0e33722b67fcc764b44d17'
  WORKFLOW: '.github/workflows/agent-crypto-40-4-222-export-minimal.yml'

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify canonical release
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "$RELEASE_SHA^{commit}"
          python - <<'PY'
          import json, subprocess
          sha='e6898cd1fbbd18099d0e33722b67fcc764b44d17'
          raw=subprocess.check_output(['git','show',f'{sha}:public/agent_crypto_erith_ia/administrator/version.json'],text=True)
          data=json.loads(raw)
          assert data['build']=='40.4.222', data.get('build')
          assert (data.get('engine') or {}).get('reference_build')=='38.15.11'
          PY

      - name: Build exact minimal package from release SHA
        shell: bash
        run: |
          set -euo pipefail
          PKG='release_package_404222'
          rm -rf "$PKG"
          mkdir -p "$PKG"
          git diff-tree --no-commit-id --name-only -r "$RELEASE_SHA" \
            | grep -v '^\.github/workflows/' \
            > /tmp/changed-404222.txt
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            if git cat-file -e "$RELEASE_SHA:$f" 2>/dev/null; then
              mkdir -p "$PKG/$(dirname "$f")"
              git show "$RELEASE_SHA:$f" > "$PKG/$f"
            fi
          done < /tmp/changed-404222.txt
          {
            echo '# Agent-Crypto 40.4.222 — fichiers modifiés'
            echo
            echo "Commit canonique : \`$RELEASE_SHA\`"
            echo 'Market Core : `38.15.11` — protégé'
            echo
            echo 'Paquet différentiel : uniquement les fichiers présents et modifiés par le commit canonique 40.4.222. Les workflows temporaires supprimés sont exclus.'
            echo
            echo '## Fichiers'
            while IFS= read -r f; do
              [ -n "$f" ] || continue
              if git cat-file -e "$RELEASE_SHA:$f" 2>/dev/null; then printf -- '- `%s`\n' "$f"; fi
            done < /tmp/changed-404222.txt
          } > "$PKG/FILES_CHANGED_40.4.222.md"
          test -s "$PKG/FILES_CHANGED_40.4.222.md"
          find "$PKG" -type f -print

      - name: Upload minimal 40.4.222 package
        uses: actions/upload-artifact@v4
        with:
          name: AGENT_CRYPTO_BUILD_40_4_222_SYSTEM_PRESENTATION_TRUTH_CHANGED_FILES
          path: release_package_404222/
          if-no-files-found: error
          retention-days: 30

      - name: Retire export workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Aether Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          rm -f "$WORKFLOW"
          git add -A
          git commit -m 'chore(agent-crypto): retire 40.4.222 export workflow'
          git pull --rebase origin main
          git push origin HEAD:main
