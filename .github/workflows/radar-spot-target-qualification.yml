name: Radar Spot Target Qualification
on:
  pull_request:
    paths:
      - 'public/agent_crypto_erith_ia/tools/qualify_radar_targets.py'
      - 'public/agent_crypto_erith_ia/tools/qualify_radar_spot_identity.py'
      - 'public/agent_crypto_erith_ia/tools/test_qualify_radar_spot_identity.py'
      - 'public/agent_crypto_erith_ia/trader/spot-paper-order-engine.js'
      - 'public/agent_crypto_erith_ia/laboratoire/radar-spot-paper.js'
      - 'public/agent_crypto_erith_ia/laboratoire/radar.html'
      - 'tests/radar_spot_paper_feasibility.test.cjs'
      - 'public/agent_crypto_erith_ia/tools/build_okx_hurdle_followups.cjs'
      - 'public/agent_crypto_erith_ia/tools/build_radar_signal_evidence.py'
      - 'public/agent_crypto_erith_ia/tools/test_build_radar_signal_evidence.py'
      - 'public/agent_crypto_erith_ia/tools/report_radar_automation_health.py'
      - 'public/agent_crypto_erith_ia/tools/test_report_radar_automation_health.py'
      - 'tests/okx_hurdle_followups.test.cjs'
      - 'tests/okx_paper_immediate_cost.test.cjs'
      - 'public/agent_crypto_erith_ia/tools/radar_spot_paper_forward.py'
      - 'public/agent_crypto_erith_ia/tools/test_radar_spot_paper_forward.py'
      - 'public/agent_crypto_erith_ia/tools/test_qualify_radar_targets.py'
      - 'public/agent_crypto_erith_ia/tools/build_radar_research_cohort.py'
      - 'public/agent_crypto_erith_ia/tools/test_build_radar_research_cohort.py'
      - '.github/workflows/radar-spot-target-qualification.yml'
  push:
    branches: [main]
    paths:
      - 'public/agent_crypto_erith_ia/tools/qualify_radar_targets.py'
      - 'public/agent_crypto_erith_ia/tools/qualify_radar_spot_identity.py'
      - 'public/agent_crypto_erith_ia/tools/test_qualify_radar_spot_identity.py'
      - 'public/agent_crypto_erith_ia/trader/spot-paper-order-engine.js'
      - 'public/agent_crypto_erith_ia/laboratoire/radar-spot-paper.js'
      - 'public/agent_crypto_erith_ia/laboratoire/radar.html'
      - 'tests/radar_spot_paper_feasibility.test.cjs'
      - 'public/agent_crypto_erith_ia/tools/build_okx_hurdle_followups.cjs'
      - 'public/agent_crypto_erith_ia/tools/build_radar_signal_evidence.py'
      - 'public/agent_crypto_erith_ia/tools/test_build_radar_signal_evidence.py'
      - 'public/agent_crypto_erith_ia/tools/report_radar_automation_health.py'
      - 'public/agent_crypto_erith_ia/tools/test_report_radar_automation_health.py'
      - 'tests/okx_hurdle_followups.test.cjs'
      - 'tests/okx_paper_immediate_cost.test.cjs'
      - 'public/agent_crypto_erith_ia/tools/radar_spot_paper_forward.py'
      - 'public/agent_crypto_erith_ia/tools/test_radar_spot_paper_forward.py'
      - 'public/agent_crypto_erith_ia/tools/test_qualify_radar_targets.py'
      - 'public/agent_crypto_erith_ia/tools/build_radar_research_cohort.py'
      - 'public/agent_crypto_erith_ia/tools/test_build_radar_research_cohort.py'
      - '.github/workflows/radar-spot-target-qualification.yml'
  workflow_dispatch:
  workflow_run:
    workflows: ["Seven Radar Opportunity History"]
    types: [completed]
    branches: [main]
  schedule:
    # Verify soon after the 07:31 UTC public archive; keep 14:31 UTC backup.
    - cron: '7 8 * * *'
    - cron: '31 14 * * *'
permissions:
  contents: write
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('radar-spot-qualification-pr-{0}', github.event.pull_request.number) || 'radar-spot-target-qualification' }}
  cancel-in-progress: false
jobs:
  qualification:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test pure Radar qualification; no external connection
        run: |
          python -m unittest discover -s public/agent_crypto_erith_ia/tools -p 'test_qualify_radar_targets.py' -v
          python -m unittest discover -s public/agent_crypto_erith_ia/tools -p 'test_qualify_radar_spot_identity.py' -v
          python -m unittest discover -s public/agent_crypto_erith_ia/tools -p 'test_radar_spot_paper_forward.py' -v
          python -m unittest discover -s public/agent_crypto_erith_ia/tools -p 'test_build_radar_research_cohort.py' -v
          python -m unittest discover -s public/agent_crypto_erith_ia/tools -p 'test_build_radar_signal_evidence.py' -v
          python -m unittest discover -s public/agent_crypto_erith_ia/tools -p 'test_report_radar_automation_health.py' -v
          node --test public/agent_crypto_erith_ia/trader/test-spot-paper-order-engine.cjs tests/radar_spot_paper_feasibility.test.cjs tests/okx_paper_immediate_cost.test.cjs tests/okx_hurdle_followups.test.cjs
      - name: Collect public evidence only (main push/schedule, not PR)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            python -m unittest discover -s public/agent_crypto_erith_ia/tools -p 'test_qualify_radar_targets.py' -q
            # Qualification follows successful Radar archival as soon as workflow_run
            # starts; it is separate from the 14:31 UTC fallback schedule.
            new_qualification=0
            if python public/agent_crypto_erith_ia/tools/qualify_radar_targets.py > /tmp/qualification-output.log 2>&1; then
              cat /tmp/qualification-output.log
              new_qualification=1
            else
              cat /tmp/qualification-output.log
              if grep -q 'Aucun snapshot Radar du jour' /tmp/qualification-output.log; then
                echo 'No dated Radar snapshot today; preserving old qualification.'
              elif grep -q 'Moins de vingt candidats Radar : qualification suspendue' /tmp/qualification-output.log; then
                echo 'RADAR_CANDIDATE_SHORTFALL: today's archive exists but has fewer than 20 real qualified candidates.'
                echo 'Preserve prior full qualification as historical only; publish a fresh incomplete health status.'
              else
                echo 'Real qualification failure, refusing silent fallback' >&2
                exit 1
              fi
            fi
            python public/agent_crypto_erith_ia/tools/build_radar_research_cohort.py
            if [ "$new_qualification" -eq 1 ]; then
              # Archive only the newly dated OKX PAPER cost basis and future bids;
              # missing candidates remain missing, never reconstructed as fills.
              node public/agent_crypto_erith_ia/tools/build_okx_hurdle_followups.cjs
              # A source outage must never become fabricated contract proof.
              if python public/agent_crypto_erith_ia/tools/qualify_radar_spot_identity.py; then
                python public/agent_crypto_erith_ia/tools/qualify_radar_spot_identity.py --check
                python public/agent_crypto_erith_ia/tools/radar_spot_paper_forward.py
              else
                echo 'Identity source missing: current candidates stay unproven; no older proof promoted.'
              fi
            fi
            # Audit the dated public signals; missing forward quotes remain missing.
            python public/agent_crypto_erith_ia/tools/build_radar_signal_evidence.py
            # A successful schedule is NOT proof of an archived daily observation.
            # When a fresh qualification exists, enforce the matching PAPER journal.
            if [ "$new_qualification" -eq 1 ]; then
              python public/agent_crypto_erith_ia/tools/report_radar_automation_health.py --require-ready
            else
              python public/agent_crypto_erith_ia/tools/report_radar_automation_health.py
            fi
            git add -- public/agent_crypto_erith_ia/data/crypto/radar-opportunities/qualification-latest.json public/agent_crypto_erith_ia/data/crypto/radar-opportunities/research-cohort.json
            git add -- public/agent_crypto_erith_ia/data/crypto/radar-opportunities/signal-evidence.json
            git add -- public/agent_crypto_erith_ia/data/crypto/radar-opportunities/radar-automation-health.json
            if [ -f public/agent_crypto_erith_ia/data/crypto/radar-opportunities/spot-identity-latest.json ]; then
              git add -- public/agent_crypto_erith_ia/data/crypto/radar-opportunities/spot-identity-latest.json
            fi
            if [ -f public/agent_crypto_erith_ia/data/crypto/radar-opportunities/okx-hurdle-followups.json ]; then
              git add -- public/agent_crypto_erith_ia/data/crypto/radar-opportunities/okx-hurdle-followups.json
            fi
            if [ -f public/agent_crypto_erith_ia/data/crypto/radar-opportunities/spot-paper-forward.json ]; then
              git add -- public/agent_crypto_erith_ia/data/crypto/radar-opportunities/spot-paper-forward.json
            fi
            if git diff --cached --quiet; then
              echo 'No fresh qualification to publish'
              exit 0
            fi
            git commit -m 'Archive Radar Spot research qualification (paper only)'
            if git push origin HEAD:main; then
              echo 'Research qualifications published'
              exit 0
            fi
            sleep "$((attempt*3))"
          done
          echo 'Publication failed, no unverified summary substituted' >&2
          exit 1
