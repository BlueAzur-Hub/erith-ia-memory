name: Agent-Crypto 40.4.196 Toolbar Semantic Parity Release

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/agent-crypto-40-4-196-toolbar-semantic-parity-release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch release
        run: python .github/scripts/agent_crypto_40_4_196_toolbar_semantic_parity.py
      - name: Validate
        run: |
          node --check public/agent_crypto_erith_ia/administrator/js/market-stack.js
          node --check public/agent_crypto_erith_ia/administrator/js/parallel-markets.js
          node --check public/agent_crypto_erith_ia/administrator/js/app.js
          python -m json.tool public/agent_crypto_erith_ia/administrator/version.json >/dev/null
          python -m json.tool public/agent_crypto_erith_ia/administrator/administrator-version.json >/dev/null
      - name: Commit release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/agent_crypto_erith_ia/administrator/index.html public/agent_crypto_erith_ia/administrator/js/app.js public/agent_crypto_erith_ia/administrator/js/market-stack.js public/agent_crypto_erith_ia/administrator/js/parallel-markets.js public/agent_crypto_erith_ia/administrator/parallel-markets.css public/agent_crypto_erith_ia/administrator/version.json public/agent_crypto_erith_ia/administrator/administrator-version.json
          git rm -f .github/workflows/agent-crypto-40-4-196-toolbar-semantic-parity.yml .github/workflows/agent-crypto-40-4-196-toolbar-semantic-parity-release.yml .github/scripts/agent_crypto_40_4_196_toolbar_semantic_parity.py
          git commit -m "release Agent-Crypto 40.4.196 toolbar semantic parity"
          git pull --rebase origin main
          git push origin HEAD:main
