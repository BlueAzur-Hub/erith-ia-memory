name: Agent-Crypto Runtime Resource Cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/agent-crypto-runtime-resource-cleanup.yml'
      - '.github/scripts/agent_crypto_cleanup_runtime_resources.py'

permissions:
  contents: write

concurrency:
  group: agent-crypto-runtime-resource-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Synchronize
        run: git pull --ff-only origin main

      - name: Canonicalize active runtime resources
        run: python .github/scripts/agent_crypto_cleanup_runtime_resources.py

      - name: JavaScript syntax check
        run: |
          find public/agent_crypto_erith_ia/administrator -type f -name '*.js' -print0 \
            | xargs -0 -n1 node --check

      - name: Market Core lock guard
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          p=Path('public/agent_crypto_erith_ia/administrator/build.json')
          data=json.loads(p.read_text(encoding='utf-8'))
          engine=str(data.get('engine') or data.get('market_core_build') or data.get('market_core') or '')
          if engine != '38.15.11':
              raise SystemExit(f'Market Core changed unexpectedly: {engine!r}')
          print('Market Core 38.15.11 preserved')
          PY

      - name: Active runtime reference guard
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          root=Path('public/agent_crypto_erith_ia/administrator')
          shell=(root/'runtime-shell.html').read_text(encoding='utf-8')
          missing=[]
          for ref in re.findall(r'(?:src|href)=["\'](\./[^"\']+)["\']',shell,re.I):
              clean=ref.split('?',1)[0].split('#',1)[0]
              if not (root/clean[2:]).exists():
                  missing.append(clean)
          if missing:
              raise SystemExit('Missing shell refs: '+', '.join(sorted(set(missing))))
          print('Shell references OK')
          PY

      - name: Commit cleanup and retire one-shot tooling
        run: |
          set -euo pipefail
          git config user.name 'Seven Heaven Refactor'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A public/agent_crypto_erith_ia/administrator
          git rm -f .github/workflows/agent-crypto-runtime-resource-cleanup.yml
          git rm -f .github/scripts/agent_crypto_cleanup_runtime_resources.py
          git commit -m 'refactor(agent-crypto): canonicalize active runtime resources'

          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              echo "Published resource cleanup on attempt ${attempt}"
              exit 0
            fi
            echo "main moved during publication; rebasing attempt ${attempt}"
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "Rebase conflict: refusing force-push"
              exit 1
            fi
          done
          echo "Publication race persisted after 5 attempts"
          exit 1
