name: Agent-Crypto 40.4.211 Arm Repair 2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/agent-crypto-40-4-211-arm-repair-2.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove stale protected path and rearm
        run: |
          git fetch origin main
          git reset --hard origin/main
          sed -i '/administrator\/admin-window-manager\.js/d' .github/workflows/agent-crypto-40-4-211-version-display-authority.yml
          grep -F 'admin-windows.css' .github/workflows/agent-crypto-40-4-211-version-display-authority.yml
          ! grep -F 'admin-window-manager.js' .github/workflows/agent-crypto-40-4-211-version-display-authority.yml
          git rm -f .github/workflows/agent-crypto-40-4-211-arm-repair.yml .github/workflows/agent-crypto-40-4-211-arm-repair-2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore(agent-crypto): rearm 40.4.211 version authority release'
          git pull --rebase origin main
          git push origin HEAD:main
