name: Agent-Crypto Package 40.6.446 Strategy Demand Loader Owner Fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/agent-crypto-package-406446.yml'

permissions:
  contents: write

jobs:
  validate-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate 40.6.446 owner fix
        shell: bash
        run: |
          set -euo pipefail
          ROOT="public/agent_crypto_erith_ia/administrator"
          node --check "$ROOT/js/strategy-a-audit-demand-loader.js"
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path("public/agent_crypto_erith_ia/administrator")
          loader=(root/"js/strategy-a-audit-demand-loader.js").read_text(encoding="utf-8")
          idx=(root/"index.html").read_text(encoding="utf-8")
          b=json.loads((root/"build.json").read_text(encoding="utf-8"))
          checks={
            "build": b.get("build")=="40.6.446",
            "owner_selector": 'details[data-collapse-key="simulation"]' in loader,
            "owner_query": "document.querySelector(SIMULATION_OWNER_SELECTOR)" in loader,
            "toggle_matches_owner": "target.matches(SIMULATION_OWNER_SELECTOR)" in loader,
            "old_toggle_id_removed": 'event?.target?.id==="simulation"' not in loader,
            "three_modules": all(x in loader for x in ["strategy-a-cost-wait-outcome-audit.js","strategy-a-oracle-cost-calibration-audit.js","strategy-a-execution-cost-truth.js"]),
            "entry_446": 'Build 40.6.446 · Administrator' in idx,
            "loader_cache_446": 'strategy-a-audit-demand-loader.js?v=40.6.446' in idx,
            "oracle_445_comment_preserved": "40.6.445 — ORACLE METRICS FINAL FIT" in idx,
            "market_core": b.get("market_core")=="38.15.11",
          }
          bad=[k for k,v in checks.items() if not v]
          if bad: raise SystemExit(f"40.6.446 validation failed: {bad}")
          print("40.6.446 STRATEGY DEMAND LOADER OWNER FIX STATIC PASS")
          PY

      - name: Build bounded ZIP
        shell: bash
        run: |
          set -euo pipefail
          ROOT="public/agent_crypto_erith_ia/administrator"
          ZIP="$ROOT/AGENT_CRYPTO_STRATEGY_DEMAND_LOADER_OWNER_FIX_40.6.446.zip"
          SHA="$ZIP.sha256"
          rm -f "$ZIP" "$SHA"
          rm -rf /tmp/agent-crypto-406446
          mkdir -p /tmp/agent-crypto-406446/administrator/js
          mkdir -p /tmp/agent-crypto-406446/administrator/views
          cp "$ROOT/index.html" /tmp/agent-crypto-406446/administrator/
          cp "$ROOT/index-40.6.446.html" /tmp/agent-crypto-406446/administrator/
          cp "$ROOT/build.json" /tmp/agent-crypto-406446/administrator/
          cp "$ROOT/RELEASE.md" /tmp/agent-crypto-406446/administrator/
          cp "$ROOT/HANDOFF.md" /tmp/agent-crypto-406446/administrator/
          cp "$ROOT/PATCH_MANIFEST_40.6.446.txt" /tmp/agent-crypto-406446/administrator/
          cp "$ROOT/js/strategy-a-audit-demand-loader.js" /tmp/agent-crypto-406446/administrator/js/
          cp "$ROOT/views/system.html" /tmp/agent-crypto-406446/administrator/views/
          (cd /tmp/agent-crypto-406446 && zip -9 -r "$GITHUB_WORKSPACE/$ZIP" .)
          unzip -t "$ZIP"
          sha256sum "$ZIP" > "$SHA"

      - name: Commit package
        shell: bash
        run: |
          set -euo pipefail
          ROOT="public/agent_crypto_erith_ia/administrator"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$ROOT/AGENT_CRYPTO_STRATEGY_DEMAND_LOADER_OWNER_FIX_40.6.446.zip" "$ROOT/AGENT_CRYPTO_STRATEGY_DEMAND_LOADER_OWNER_FIX_40.6.446.zip.sha256"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore(package): add Agent-Crypto 40.6.446 Strategy demand loader owner fix ZIP"
          git pull --rebase origin main
          git push origin HEAD:main
