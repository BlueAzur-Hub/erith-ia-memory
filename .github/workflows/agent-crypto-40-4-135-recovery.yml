name: Agent-Crypto 40.4.135 recovery

on:
  push:
    branches: [main]
    paths:
      - coordination/inter_ai_dialogues/agent_crypto/patches/40.4.135.request.json

permissions:
  contents: write

concurrency:
  group: agent-crypto-40-4-135-recovery
  cancel-in-progress: false

jobs:
  recover:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout canonical main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply bounded recovery
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from datetime import datetime, timezone
          import hashlib, json, re, zipfile

          ROOT=Path('public/agent_crypto_erith_ia/administrator')
          BUILD='40.4.135'; PARENT='40.4.134'
          RELEASE='ADMINISTRATION FIRST-CLICK RECOVERY · ATLAS RESIDENT MARKET REFRESH WATCHDOG LOCK'
          STATUS='candidate_admin_first_click_atlas_resident_recovery_operator_validation_required'
          REQ=Path('coordination/inter_ai_dialogues/agent_crypto/patches/40.4.135.request.json')

          def sha(p): return hashlib.sha256(p.read_bytes()).hexdigest()
          def rep(path, old, new, label):
              text=path.read_text(encoding='utf-8'); n=text.count(old)
              if n!=1: raise SystemExit(f'STOP {label}: expected 1, found {n}')
              path.write_text(text.replace(old,new,1),encoding='utf-8')
          def sub(path, pattern, replacement, label, flags=0):
              text=path.read_text(encoding='utf-8'); out,n=re.subn(pattern,replacement,text,count=1,flags=flags)
              if n!=1: raise SystemExit(f'STOP {label}: expected 1, found {n}')
              path.write_text(out,encoding='utf-8')

          req=json.loads(REQ.read_text(encoding='utf-8'))
          version=json.loads((ROOT/'version.json').read_text(encoding='utf-8'))
          if req.get('build')!=BUILD or req.get('parent_build')!=PARENT: raise SystemExit('STOP invalid request')
          if version.get('build')!=PARENT: raise SystemExit(f"STOP parent mismatch: {version.get('build')}")
          if str((version.get('engine') or {}).get('reference_build'))!='38.15.11': raise SystemExit('STOP Market Core mismatch')

          # 1) Administration: remove only the 40.4.134 capture blocker.
          index=ROOT/'index.html'
          text=index.read_text(encoding='utf-8')
          pattern=r'\n?\s*<script data-atlas-admin-active-role-lock-404134="true">.*?</script>\s*'
          text,n=re.subn(pattern,'\n',text,count=1,flags=re.S)
          if n!=1: raise SystemExit(f'STOP 40.4.134 admin blocker not uniquely found: {n}')
          if 'data-atlas-admin-first-click-intent-gate-40449="true"' not in text: raise SystemExit('STOP canonical 40.4.49 admin intent gate missing')
          index.write_text(text,encoding='utf-8')

          # 2) Atlas resident: the current R1 layer only changes eligibility and 40.4.133 only reacts after a refresh.
          # Add one watchdog that calls the EXISTING refreshMarketOnly owner after 5 minutes without an owner call.
          # It does not fetch latest.json itself and it does not create a second CURRENT controller.
          life=ROOT/'js/views/view-lifecycle.js'
          marker='atlasResidentInstall40133();\n\nconst DEFINITIONS=Object.freeze(['
          watchdog=r'''atlasResidentInstall40133();

/* 40.4.135 — resident market-refresh watchdog.
   Firefox operator evidence showed that a fresh canonical GitHub snapshot could exist
   while the already-open Administrator page remained on an old Market Memory frame.
   This watchdog does not fetch market data itself. It only re-invokes the existing
   refreshMarketOnly owner when that owner has not run for five minutes while visible.
   The existing refresh owner remains responsible for latest.json, Market Memory and
   atlasAfterLivecheck; the 40.4.133 resident CURRENT handoff remains the only CURRENT wake. */
const ATLAS_RESIDENT_REFRESH_40135=Object.freeze({build:"40.4.135",target_ms:300000,heartbeat_ms:15000,hidden_sleeps:true,existing_refresh_owner:"refreshMarketOnly",direct_fetch:false,second_current_controller:false});
const atlasResidentRefreshState40135={installed:false,last_owner_at:Date.now(),last_kick_at:0,kick_count:0,inflight:false,timer:null};
function atlasResidentRefreshKick40135(reason="resident-watchdog"){
  try{
    if(document.hidden===true||atlasResidentRefreshState40135.inflight)return false;
    const refresh=globalThis.refreshMarketOnly;
    if(typeof refresh!=="function")return false;
    atlasResidentRefreshState40135.inflight=true;
    atlasResidentRefreshState40135.last_kick_at=Date.now();
    atlasResidentRefreshState40135.last_owner_at=Date.now();
    atlasResidentRefreshState40135.kick_count+=1;
    Promise.resolve(refresh()).then(()=>{try{atlasResidentWake40133(`40135-${reason}`);}catch(_){};},()=>{}).finally(()=>{atlasResidentRefreshState40135.inflight=false;});
    return true;
  }catch(_){atlasResidentRefreshState40135.inflight=false;return false;}
}
function atlasResidentRefreshInstall40135(){
  if(atlasResidentRefreshState40135.installed)return true;
  const current=globalThis.refreshMarketOnly;
  if(typeof current==="function"&&current.__erithResidentRefresh40135!==true){
    const wrapped=function(...args){atlasResidentRefreshState40135.last_owner_at=Date.now();return current.apply(this,args);};
    try{Object.defineProperty(wrapped,"__erithResidentRefresh40135",{value:true});}catch(_){}
    globalThis.refreshMarketOnly=wrapped;
  }
  atlasResidentRefreshState40135.timer=setInterval(()=>{
    if(document.hidden===true)return;
    if(Date.now()-atlasResidentRefreshState40135.last_owner_at>=ATLAS_RESIDENT_REFRESH_40135.target_ms)atlasResidentRefreshKick40135("five-minute-stale");
  },ATLAS_RESIDENT_REFRESH_40135.heartbeat_ms);
  document.addEventListener("visibilitychange",()=>{
    if(document.hidden!==true&&Date.now()-atlasResidentRefreshState40135.last_owner_at>=ATLAS_RESIDENT_REFRESH_40135.target_ms)atlasResidentRefreshKick40135("visibility-resume");
  },{passive:true});
  atlasResidentRefreshState40135.installed=true;
  document.documentElement.dataset.atlasResidentRefresh40135="armed";
  return true;
}
globalThis.ErithAtlasResidentRefresh40135=Object.freeze({
  ...ATLAS_RESIDENT_REFRESH_40135,
  install:atlasResidentRefreshInstall40135,
  kick:atlasResidentRefreshKick40135,
  snapshot:()=>Object.freeze({...atlasResidentRefreshState40135,timer:Boolean(atlasResidentRefreshState40135.timer)})
});
atlasResidentRefreshInstall40135();

const DEFINITIONS=Object.freeze(['''
          rep(life,marker,watchdog,'Atlas resident refresh insertion')

          # 3) Build identity only; Aether behavior stays intact.
          rep(ROOT/'app.js','const ATLAS_BUILD = "40.4.134";','const ATLAS_BUILD = "40.4.135";','ATLAS_BUILD')
          rep(ROOT/'js/app.js','  const ADMIN_BUILD = "40.4.134";','  const ADMIN_BUILD = "40.4.135";','ADMIN_BUILD')
          aether=ROOT/'js/aether.js'
          rep(aether,'  Build: 40.4.134','  Build: 40.4.135','Aether header build')
          sub(aether,r'  Revision: 40\.4\.134[^\n]*','  Revision: 40.4.135 recovery lock. Aether Attention, source-original News, 12×18 s cadence and Maintenon five-day weather remain unchanged; Administration and Atlas resident recovery are external owners.','Aether revision')
          text=aether.read_text(encoding='utf-8')
          text=text.replace('build:"40.4.134"','build:"40.4.135"')
          aether.write_text(text,encoding='utf-8')

          text=index.read_text(encoding='utf-8')
          text=text.replace('40.4.134','40.4.135')
          text=text.replace('AETHER DETAIL DISCOVERABILITY · ADMIN ACTIVE-ROLE NO-LOGOUT LOCK',RELEASE)
          index.write_text(text,encoding='utf-8')

          # 4) Manifest truth + hashes.
          feature={
            'build':BUILD,
            'admin_404134_capture_blocker_removed':True,
            'admin_first_click_gate_40449_preserved':True,
            'atlas_resident_refresh_watchdog':True,
            'atlas_resident_refresh_target_seconds':300,
            'atlas_resident_refresh_heartbeat_seconds':15,
            'atlas_resident_refresh_calls_existing_owner':'refreshMarketOnly',
            'atlas_resident_direct_fetch':False,
            'atlas_resident_second_current_controller':False,
            'atlas_40133_current_handoff_preserved':True,
            'aether_attention_preserved':True,
            'aether_news_source_original_preserved':True,
            'aether_weather_5_day_preserved':True,
            'market_core_changed':False,
            'graph_changed':False,
            'oracle_engine_changed':False,
            'bridge_engine_changed':False
          }
          note='40.4.135 — recovery: remove the 40.4.134 Administration capture dead-click and arm a five-minute resident watchdog around the existing refreshMarketOnly owner so an already-open Firefox page can consume a fresh canonical snapshot; 40.4.133 CURRENT handoff, Aether, Graph, Oracle, Bridge and Market Core 38.15.11 remain protected.'
          def update_manifest(path,admin_sha=None):
            d=json.loads(path.read_text(encoding='utf-8'))
            d['build']=BUILD; d['release']=RELEASE; d['status']=STATUS; d['parent_build']=PARENT
            d['asset_token']=f'market-core-v2.0-alpha-build-{BUILD}'
            d['prepared_at']=datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z'); d['published_at']=None
            if 'global_versioning' in d: d['global_versioning']=BUILD
            d.setdefault('features',{})['admin_atlas_recovery_404135']=feature.copy()
            d.setdefault('integrity',{})['admin_atlas_recovery_404135']=feature.copy()
            pub=d.setdefault('integrity',{}).setdefault('publication_identity',{})
            pub['build']=BUILD; pub['asset_token']=f'market-core-v2.0-alpha-build-{BUILD}'; pub['status']=STATUS; pub['app_sha256']=sha(ROOT/'app.js')
            if admin_sha is not None: pub['administrator_version_sha256']=admin_sha
            notes=d.setdefault('release_notes',[])
            if not notes or notes[0]!=note: notes.insert(0,note)
            files=d.get('files') or {}
            for rel in list(files):
              target=ROOT/rel
              if not target.is_file(): raise SystemExit(f'STOP manifest file missing {rel}')
              files[rel]=sha(target)
            path.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          update_manifest(ROOT/'administrator-version.json')
          update_manifest(ROOT/'version.json',sha(ROOT/'administrator-version.json'))

          # 5) Hard validation.
          idx=index.read_text(encoding='utf-8')
          lc=life.read_text(encoding='utf-8')
          ae=aether.read_text(encoding='utf-8')
          if 'data-atlas-admin-active-role-lock-404134' in idx or 'adminActiveRoleLock404134' in idx: raise SystemExit('STOP dead-click blocker remains')
          if 'data-atlas-admin-first-click-intent-gate-40449="true"' not in idx: raise SystemExit('STOP canonical admin gate lost')
          if 'ErithAtlasResidentRefresh40135' not in lc or 'refreshMarketOnly' not in lc or 'target_ms:300000' not in lc: raise SystemExit('STOP resident refresh watchdog missing')
          if 'ErithAtlasResidentWake40133' not in lc: raise SystemExit('STOP 40.4.133 CURRENT handoff lost')
          for token in ('news_display_language:"source-original"','weather_forecast_days:5','aether_attention_operator_watch:true','veille_feed_pulse_seconds:18','veille_full_batch_before_system:true'):
            if token not in ae: raise SystemExit(f'STOP Aether contract lost: {token}')
          v=json.loads((ROOT/'version.json').read_text(encoding='utf-8'))
          if v.get('build')!=BUILD or str((v.get('engine') or {}).get('reference_build'))!='38.15.11': raise SystemExit('STOP version/Core identity')
          if (v.get('protected_base') or {}).get('market_core_modified') is not False: raise SystemExit('STOP Market Core protection')
          latest=json.loads(Path('public/agent_crypto_erith_ia/data/crypto/latest.json').read_text(encoding='utf-8'))
          if len(latest.get('coins') or []) < 200: raise SystemExit('STOP canonical Top-250 unusable')
          if str(latest.get('snapshot_id') or '')=='public-market-20260831T060513Z': raise SystemExit('STOP canonical producer still on known 08:05 stale frame')
          for name in ('administrator-version.json','version.json'):
            d=json.loads((ROOT/name).read_text(encoding='utf-8'))
            for rel,h in (d.get('files') or {}).items():
              if sha(ROOT/rel)!=h: raise SystemExit(f'STOP hash mismatch {name}: {rel}')

          out=Path('coordination/inter_ai_dialogues/agent_crypto/AGENT_CRYPTO_BUILD_40_4_135_AUTO_CANONICAL.zip')
          files=list((v.get('files') or {}).keys())
          for extra in ('version.json','administrator-version.json'):
            if extra not in files: files.append(extra)
          with zipfile.ZipFile(out,'w',zipfile.ZIP_DEFLATED,compresslevel=9) as z:
            for rel in files: z.write(ROOT/rel,arcname=(ROOT/rel).as_posix())
          digest=sha(out)
          Path(str(out)+'.sha256').write_text(f'{digest}  {out.name}\n',encoding='utf-8')
          print(f'PASS {BUILD} · canonical={latest.get("snapshot_id")} · zip={digest}')
          PY
          node --check public/agent_crypto_erith_ia/administrator/app.js
          node --check public/agent_crypto_erith_ia/administrator/js/app.js
          node --check public/agent_crypto_erith_ia/administrator/js/aether.js
          node --check public/agent_crypto_erith_ia/administrator/js/views/view-lifecycle.js
          git diff --check

      - name: Commit recovery atomically
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Aether Release"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/agent_crypto_erith_ia/administrator
          git add coordination/inter_ai_dialogues/agent_crypto/AGENT_CRYPTO_BUILD_40_4_135_AUTO_CANONICAL.zip
          git add coordination/inter_ai_dialogues/agent_crypto/AGENT_CRYPTO_BUILD_40_4_135_AUTO_CANONICAL.zip.sha256
          git rm coordination/inter_ai_dialogues/agent_crypto/patches/40.4.135.request.json
          git rm .github/workflows/agent-crypto-40-4-135-recovery.yml
          git commit -m "fix Agent-Crypto 40.4.135 restore Administration and Atlas resident refresh"
          git pull --rebase origin main
          git push origin HEAD:main
