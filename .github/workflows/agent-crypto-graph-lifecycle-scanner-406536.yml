name: Agent-Crypto 40.6.536 Graph Lifecycle Scanner

on:
  push:
    branches: [main]
    paths:
      - "public/agent_crypto_erith_ia/administrator/app.js"
      - "public/agent_crypto_erith_ia/administrator/index.html"
      - "public/agent_crypto_erith_ia/administrator/index-40.6.536.html"
      - "public/agent_crypto_erith_ia/administrator/build.json"
      - "public/agent_crypto_erith_ia/administrator/GRAPH_LIFECYCLE_SCANNER_40.6.536.md"
      - ".github/scripts/agent_crypto_graph_lifecycle_scanner_406536_guard.py"
      - ".github/workflows/agent-crypto-graph-lifecycle-scanner-406536.yml"
  pull_request:
    paths:
      - "public/agent_crypto_erith_ia/administrator/app.js"
      - "public/agent_crypto_erith_ia/administrator/index.html"
      - "public/agent_crypto_erith_ia/administrator/index-40.6.536.html"
      - "public/agent_crypto_erith_ia/administrator/build.json"
      - "public/agent_crypto_erith_ia/administrator/GRAPH_LIFECYCLE_SCANNER_40.6.536.md"
      - ".github/scripts/agent_crypto_graph_lifecycle_scanner_406536_guard.py"
      - ".github/workflows/agent-crypto-graph-lifecycle-scanner-406536.yml"

permissions:
  contents: read

jobs:
  guard-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify graph lifecycle and scanner responsiveness
        run: |
          python .github/scripts/agent_crypto_graph_lifecycle_scanner_406536_guard.py
          node --check public/agent_crypto_erith_ia/administrator/app.js
          python .github/scripts/agent_crypto_version_truth_guard_compat.py

      - name: Build compact patch ZIP
        id: patch
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile, os
          files=[
            Path("public/agent_crypto_erith_ia/administrator/app.js"),
            Path("public/agent_crypto_erith_ia/administrator/index.html"),
            Path("public/agent_crypto_erith_ia/administrator/index-40.6.536.html"),
            Path("public/agent_crypto_erith_ia/administrator/build.json"),
            Path("public/agent_crypto_erith_ia/administrator/GRAPH_LIFECYCLE_SCANNER_40.6.536.md"),
            Path(".github/scripts/agent_crypto_graph_lifecycle_scanner_406536_guard.py"),
            Path(".github/workflows/agent-crypto-graph-lifecycle-scanner-406536.yml"),
          ]
          missing=[str(p) for p in files if not p.exists()]
          if missing: raise SystemExit("Missing patch files: "+", ".join(missing))
          out=Path("dist/AGENT_CRYPTO_ADMINISTRATOR_40.6.536_GRAPH_LIFECYCLE_SCANNER_PATCH.zip")
          out.parent.mkdir(parents=True,exist_ok=True)
          with zipfile.ZipFile(out,"w",zipfile.ZIP_DEFLATED,compresslevel=9) as z:
              for p in files:z.write(p,p)
          with open(os.environ["GITHUB_OUTPUT"],"a",encoding="utf-8") as fh:
              print(f"zip={out.as_posix()}", file=fh)
          print(out, out.stat().st_size, "files", len(files))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: AGENT_CRYPTO_ADMINISTRATOR_40.6.536_GRAPH_LIFECYCLE_SCANNER_PATCH
          path: ${{ steps.patch.outputs.zip }}
          retention-days: 90
