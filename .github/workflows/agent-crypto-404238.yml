name: Agent-Crypto 40.4.238 Technical Reading backdrop restore

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/agent-crypto-404238.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch Technical Reading canonical letterbox fill
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          base = Path('public/agent_crypto_erith_ia/administrator')
          version = json.loads((base/'version.json').read_text(encoding='utf-8'))
          assert version['build'] == '40.4.237', version['build']
          assert version['engine']['reference_build'] == '38.15.11'

          index_path = base/'index.html'
          text = index_path.read_text(encoding='utf-8')

          # 40.2.30 already owns the correct visual contract: complete foreground
          # portrait + same resolved asset as cover backdrop behind letterbox areas.
          # Restore the missing runtime handoff instead of creating a new owner.
          marker = 'const actual=String(resolved.url);'
          assert text.count(marker) == 1, text.count(marker)
          replacement = marker + '''\n    const backdropPanel=panel();\n    if(backdropPanel){\n      const backdropUrl=String(actual).replaceAll('"','%22');\n      backdropPanel.style.setProperty("--atlas-tech-backdrop-image",`url("${backdropUrl}")`);\n      backdropPanel.dataset.techBackdropSource=source||resolved.source||"resolved";\n    }'''
          text = text.replace(marker, replacement, 1)

          old_pos = 'background-position:50% 50% !important;'
          new_pos = 'background-position:var(--admin-tech-x,50%) var(--admin-tech-y,50%) !important;'
          anchor = '<style id="atlasVisualContinuity40230">'
          start = text.index(anchor)
          end = text.index('</style>', start)
          block = text[start:end]
          assert old_pos in block
          block = block.replace(old_pos, new_pos, 1)
          text = text[:start] + block + text[end:]

          proof = '''\n  <style id="atlasTechnicalReadingBackdropRestore404238">\n    /* 40.4.238 — Technical Reading only.\n       Foreground keeps contain/full image. Letterbox areas reuse the SAME\n       already-resolved image URL through the 40.2.30 backdrop owner.\n       No second image request, no new crop owner, no graph/layout ownership. */\n    body.atlas-administrator-mirror #detailPanel.atlas-tech-letterbox-fill-40230 {\n      background-color:#06101d !important;\n    }\n  </style>\n'''
          insert_at = text.index('<style id="atlasVisualContinuity40230">')
          text = text[:insert_at] + proof + text[insert_at:]

          # Version-truth guard requires the canonical System lazy-loader cache
          # tokens to advance with every Administrator build. This is publication
          # identity only; System runtime/content is untouched.
          old_loader='system-presentation.js?v=administrator-build-40.4.237'
          new_loader='system-presentation.js?v=administrator-build-40.4.238'
          assert text.count(old_loader) == 1, text.count(old_loader)
          text = text.replace(old_loader,new_loader,1)
          index_path.write_text(text, encoding='utf-8')

          system_path=base/'js/views/system-presentation.js'
          system=system_path.read_text(encoding='utf-8')
          old_source='const SOURCE="./views/system.html?v=administrator-build-40.4.237";'
          new_source='const SOURCE="./views/system.html?v=administrator-build-40.4.238";'
          assert system.count(old_source) == 1, system.count(old_source)
          system_path.write_text(system.replace(old_source,new_source,1),encoding='utf-8')

          contract = {
            'build': '40.4.238',
            'parent': '40.4.237',
            'technical_reading_only': True,
            'complete_foreground_preserved': True,
            'foreground_fit': 'contain',
            'letterbox_backdrop_fill_restored': True,
            'backdrop_fit': 'cover',
            'backdrop_reuses_resolved_asset_url': True,
            'second_image_request_added': False,
            'new_css_owner_added': False,
            'rnd_library_changed': False,
            'private_image_storage_changed': False,
            'system_cache_token_only': True,
            'graph_changed': False,
            'parallel_markets_changed': False,
            'atlas_changed': False,
            'math_core_changed': False,
            'window_manager_changed': False,
            'market_core_changed': False,
            'protected_market_core': '38.15.11'
          }
          Path('/tmp/contract-404238.json').write_text(json.dumps(contract, ensure_ascii=False, indent=2), encoding='utf-8')
          PY

      - name: Release identity 40.4.238
        run: |
          python .github/scripts/agent_crypto_release_driver.py \
            --build 40.4.238 \
            --parent 40.4.237 \
            --release "TECHNICAL READING · COMPLETE PORTRAIT + LETTERBOX BACKDROP RESTORE LOCK" \
            --status "technical_reading_complete_portrait_backdrop_404238" \
            --contract-key "technical_reading_letterbox_backdrop_404238" \
            --contract-json /tmp/contract-404238.json \
            --lineage-note "40.4.238 Technical Reading complete portrait + same-asset letterbox backdrop restore; no crop owner, no second image request"

      - name: Technical Reading proof assertions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          base=Path('public/agent_crypto_erith_ia/administrator')
          index=(base/'index.html').read_text(encoding='utf-8')
          app=(base/'js/app.js').read_text(encoding='utf-8')
          system=(base/'js/views/system-presentation.js').read_text(encoding='utf-8')
          version=json.loads((base/'version.json').read_text(encoding='utf-8'))
          assert version['build']=='40.4.238'
          assert version['parent_build']=='40.4.237'
          assert version['engine']['reference_build']=='38.15.11'
          assert 'object-fit:contain!important' in index
          assert '--atlas-tech-backdrop-image' in index
          assert 'backdropPanel.style.setProperty("--atlas-tech-backdrop-image"' in index
          assert 'background-size:cover !important' in index
          assert 'background-position:var(--admin-tech-x,50%) var(--admin-tech-y,50%) !important' in index
          assert 'system-presentation.js?v=administrator-build-40.4.238' in index
          assert 'const SOURCE="./views/system.html?v=administrator-build-40.4.238";' in system
          assert 'const ADMIN_BUILD = "40.4.238";' in app
          assert 'const ENGINE_BUILD = "38.15.11";' in app
          PY
          python .github/scripts/agent_crypto_version_truth_guard.py \
            --expected-build 40.4.238 \
            --expected-release "TECHNICAL READING · COMPLETE PORTRAIT + LETTERBOX BACKDROP RESTORE LOCK"

      - name: Scope guard
        shell: bash
        run: |
          python - <<'PY'
          import subprocess
          allowed={
            'public/agent_crypto_erith_ia/administrator/administrator-version.json',
            'public/agent_crypto_erith_ia/administrator/app.js',
            'public/agent_crypto_erith_ia/administrator/build.json',
            'public/agent_crypto_erith_ia/administrator/index.html',
            'public/agent_crypto_erith_ia/administrator/js/app.js',
            'public/agent_crypto_erith_ia/administrator/js/views/system-presentation.js',
            'public/agent_crypto_erith_ia/administrator/version.json',
          }
          changed=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          extra=changed-allowed
          missing=allowed-changed
          assert not extra, f'out-of-scope: {sorted(extra)}'
          assert not missing, f'missing expected identity files: {sorted(missing)}'
          print('scope ok:', *sorted(changed), sep='\n- ')
          PY

      - name: Commit release
        run: |
          git config user.name "Aether Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/agent_crypto_erith_ia/administrator
          git commit -m "agent-crypto: build 40.4.238 restore Technical Reading complete portrait backdrop"
          git push origin HEAD:main

      - name: Build differential package
        shell: bash
        run: |
          mkdir -p /tmp/pkg
          git diff --name-only HEAD^ HEAD | while read f; do
            mkdir -p "/tmp/pkg/$(dirname "$f")"
            cp "$f" "/tmp/pkg/$f"
          done
          cat > /tmp/pkg/FILES_CHANGED_40.4.238.md <<'EOF'
          # Agent-Crypto 40.4.238 — changed files

          Technical Reading only: restore the canonical 40.2.30 full-portrait + same-asset letterbox backdrop contract.

          - Foreground portrait remains `object-fit: contain` so the complete non-explicit image is preserved.
          - Letterbox areas reuse the already resolved image URL as a `cover` backdrop.
          - No second image request.
          - System loader token advances for canonical version truth only.
          - No RND library, graph, Atlas, Math Core, Window Manager or Market Core change.
          EOF
          cd /tmp/pkg
          zip -qr /tmp/AGENT_CRYPTO_BUILD_40_4_238_TECHNICAL_READING_COMPLETE_PORTRAIT_BACKDROP_CHANGED_FILES.zip .
          sha256sum /tmp/AGENT_CRYPTO_BUILD_40_4_238_TECHNICAL_READING_COMPLETE_PORTRAIT_BACKDROP_CHANGED_FILES.zip

      - uses: actions/upload-artifact@v4
        with:
          name: AGENT_CRYPTO_BUILD_40_4_238_TECHNICAL_READING_COMPLETE_PORTRAIT_BACKDROP_CHANGED_FILES
          path: /tmp/AGENT_CRYPTO_BUILD_40_4_238_TECHNICAL_READING_COMPLETE_PORTRAIT_BACKDROP_CHANGED_FILES.zip
          if-no-files-found: error
