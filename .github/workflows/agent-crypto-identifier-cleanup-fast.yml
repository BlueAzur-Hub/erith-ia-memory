name: Agent-Crypto Identifier Cleanup Fast

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/agent-crypto-identifier-cleanup-fast.yml'
      - '.github/scripts/agent_crypto_cleanup_versioned_identifiers_fast.py'

permissions:
  contents: write

concurrency:
  group: agent-crypto-identifier-cleanup-fast
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Synchronize
        run: git pull --ff-only origin main

      - name: Remove unambiguous version suffixes from declared identifiers
        run: python .github/scripts/agent_crypto_cleanup_versioned_identifiers_fast.py

      - name: JavaScript syntax check
        run: |
          find public/agent_crypto_erith_ia/administrator -type f -name '*.js' -print0 \
            | xargs -0 -n1 node --check

      - name: Runtime reference sanity
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          root=Path('public/agent_crypto_erith_ia/administrator')
          shell=(root/'runtime-shell.html').read_text(encoding='utf-8')
          missing=[]
          for ref in re.findall(r'(?:src|href)=["\'](\./[^"\']+)["\']', shell):
              clean=ref.split('?',1)[0]
              if not (root/clean[2:]).exists():
                  missing.append(clean)
          if missing:
              raise SystemExit('Missing runtime references: '+', '.join(sorted(set(missing))))
          print('Runtime references OK')
          PY

      - name: Commit cleanup and retire one-shot tooling
        run: |
          set -euo pipefail
          git config user.name 'Seven Heaven Refactor'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A public/agent_crypto_erith_ia/administrator
          git rm -f .github/workflows/agent-crypto-identifier-cleanup-fast.yml
          git rm -f .github/scripts/agent_crypto_cleanup_versioned_identifiers_fast.py
          git rm -f .github/workflows/agent-crypto-identifier-cleanup.yml || true
          git rm -f .github/scripts/agent_crypto_cleanup_versioned_identifiers.py || true
          git commit -m 'refactor(agent-crypto): canonicalize versioned identifiers'
          git push origin HEAD:main
