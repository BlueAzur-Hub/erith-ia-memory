name: Agent-Crypto 40.4.216 Market Coverage Footer Parity

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/agent-crypto-40-4-216-footer-parity.yml

permissions:
  contents: write

concurrency:
  group: agent-crypto-40-4-216-footer-parity
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout canonical main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Execute bounded 40.4.216 release
        run: python .github/scripts/_tmp_agent_crypto_404216.py
