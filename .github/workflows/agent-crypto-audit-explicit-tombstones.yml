name: Agent Crypto audit explicit retired tombstones

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/agent-crypto-audit-explicit-tombstones.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Find explicit retired tombstones
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json,re
          ROOT=Path('public/agent_crypto_erith_ia/administrator')
          build=json.loads((ROOT/'build.json').read_text(encoding='utf-8'))
          if str(build.get('build'))!='40.6.124':raise SystemExit(f"Build drifted: {build.get('build')!r}")
          core=str(build.get('market_core') or build.get('engine') or '')
          if '38.15.11' not in core:raise SystemExit(f'Market Core drifted: {core!r}')

          pats=[
            re.compile(r'RETIRED\s+TOMBSTONE',re.I),
            re.compile(r'not\s+loaded\s+(?:or\s+imported\s+)?by\s+(?:the\s+)?(?:current|canonical)\s+Administrator',re.I),
            re.compile(r'retired\s+from\s+(?:the\s+)?canonical\s+runtime',re.I),
            re.compile(r'no\s+active\s+(?:presentation\s+)?ownership\s+remains',re.I),
            re.compile(r'current\s+index\s+does\s+not\s+load\s+this\s+file',re.I),
          ]
          protected_words={
            'aether':'AETHER','oracle':'ORACLE','atlas':'ATLAS','market-core':'MARKET_CORE',
            'lecture-technique':'LECTURE_TECHNIQUE','technical-reading':'LECTURE_TECHNIQUE',
            'web-classic':'WEB_CLASSIC','web-classique':'WEB_CLASSIC','strategy-a':'STRATEGY',
            'version-truth':'VERSION_TRUTH','graph':'GRAPH_REVIEW','chart':'GRAPH_REVIEW'
          }
          rows=[]
          exts={'.js','.css','.html','.json','.md','.txt'}
          for p in sorted(ROOT.rglob('*')):
              if not p.is_file() or p.suffix.lower() not in exts:continue
              try:text=p.read_text(encoding='utf-8')
              except UnicodeDecodeError:continue
              hits=[]
              for i,line in enumerate(text.splitlines(),1):
                  if any(rx.search(line) for rx in pats):hits.append({'line':i,'text':line.strip()[:300]})
              if not hits:continue
              rel=p.relative_to(ROOT)
              prot=[]
              low=str(rel).lower()
              for word,label in protected_words.items():
                  if word in low:prot.append(label)
              # Strong subject protection from nearby file content.
              head='\n'.join(text.splitlines()[:80]).lower()
              if not prot:
                  for word,label in [('aether','AETHER'),('oracle','ORACLE'),('atlas','ATLAS'),('strategy a','STRATEGY')]:
                      if word in head:prot.append(label)
              rows.append({'path':str(rel),'bytes':p.stat().st_size,'lines':len(text.splitlines()),'protected':sorted(set(prot)),'hits':hits[:12]})
          print(json.dumps({'build':build.get('build'),'market_core':core,'explicit_tombstone_files':len(rows),'rows':rows,'mutation':'none'},indent=2,ensure_ascii=False))
          PY

      - name: Retire one-shot audit workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Seven Heaven Refactor'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/agent-crypto-audit-explicit-tombstones.yml
          git commit -m 'chore(agent-crypto): retire explicit tombstone audit tooling'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if ! git rebase origin/main; then git rebase --abort || true; exit 1; fi
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
