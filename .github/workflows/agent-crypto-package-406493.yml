name: Agent-Crypto 40.6.493 Validate Package
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Scope historical 40.6.493 validator
        run: |
          set -euo pipefail
          CURRENT="$(python -c 'import json; print(json.load(open("public/agent_crypto_erith_ia/administrator/build.json", encoding="utf-8"))["build"])')"
          if [ "$CURRENT" != "40.6.493" ]; then
            echo "AGENT_CRYPTO_SKIP_406493=true" >> "$GITHUB_ENV"
            echo "Historical 40.6.493 validator skipped for build $CURRENT"
          fi
      - name: Validate syntax and micro-execution shadow contracts
        if: env.AGENT_CRYPTO_SKIP_406493 != 'true'
        run: |
          set -euo pipefail
          ROOT="public/agent_crypto_erith_ia/administrator"
          node --check "$ROOT/js/strategy-a-okx-micro-execution-shadow-truth.js"
          node --check "$ROOT/js/post-boot-runtime-loader.js"
          node -e "require('./$ROOT/js/strategy-a-okx-micro-execution-shadow-truth.js'); if(!global.AgentCryptoOkxMicroExecutionShadowTruth.self_test().pass) process.exit(1)"
          python .github/scripts/agent_crypto_okx_micro_execution_shadow_guard_406493.py
          python .github/scripts/agent_crypto_version_truth_guard_compat.py
      - name: Verify protected cold archive is not patched
        if: github.event_name == 'pull_request' && env.AGENT_CRYPTO_SKIP_406493 != 'true'
        run: |
          set -euo pipefail
          git fetch origin main
          git diff --exit-code origin/main...HEAD -- public/agent_crypto_erith_ia/data/oracle_evidence
      - name: Build delivery ZIP
        if: env.AGENT_CRYPTO_SKIP_406493 != 'true'
        run: |
          set -euo pipefail
          ROOT="public/agent_crypto_erith_ia/administrator"
          ZIP="AGENT_CRYPTO_OKX_MICRO_EXECUTION_SHADOW_40.6.493.zip"
          zip -j "$ZIP"             "$ROOT/index-40.6.493.html"             "$ROOT/build.json"             "$ROOT/js/post-boot-runtime-loader.js"             "$ROOT/js/strategy-a-okx-micro-execution-shadow-truth.js"             "$ROOT/OKX_MICRO_EXECUTION_SHADOW_TRUTH_40.6.493.md"             "$ROOT/HANDOFF_FINAL_40.6.493.md"             "$ROOT/PATCH_MANIFEST_40.6.493.txt"
          sha256sum "$ZIP" > "$ZIP.sha256"
          unzip -t "$ZIP"
      - uses: actions/upload-artifact@v4
        if: env.AGENT_CRYPTO_SKIP_406493 != 'true'
        with:
          name: agent-crypto-40.6.493-okx-micro-execution-shadow
          path: |
            AGENT_CRYPTO_OKX_MICRO_EXECUTION_SHADOW_40.6.493.zip
            AGENT_CRYPTO_OKX_MICRO_EXECUTION_SHADOW_40.6.493.zip.sha256
          if-no-files-found: error
