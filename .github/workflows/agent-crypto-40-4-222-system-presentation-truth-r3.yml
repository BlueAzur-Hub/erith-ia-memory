name: Agent-Crypto 40.4.222 System Presentation Truth Lock R3

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/agent-crypto-40-4-222-system-presentation-truth-r3.yml'

permissions:
  contents: write

env:
  BUILD: '40.4.222'
  PARENT: '40.4.221'
  RELEASE: 'SYSTEM PRESENTATION TRUTH · MEMORY / AGENTS / REPRISE STATUS LOCK'
  STATUS: 'system_presentation_truth_404222'
  WORKFLOW: '.github/workflows/agent-crypto-40-4-222-system-presentation-truth-r3.yml'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify canonical parent
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/agent_crypto_version_truth_guard.py --expected-build "$PARENT"
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('public/agent_crypto_erith_ia/administrator/version.json').read_text(encoding='utf-8'))
          assert data.get('build') == '40.4.221', data.get('build')
          market_core = data.get('market_core') or (data.get('engine') or {}).get('reference_build')
          assert market_core == '38.15.11', market_core
          PY

      - name: Apply bounded System presentation truth surgery
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          targets=[
              Path('public/agent_crypto_erith_ia/administrator/views/system.html'),
              Path('public/agent_crypto_erith_ia/administrator/js/views/system-presentation.js'),
          ]
          replacements=[
              ('prépare un export propre pour la future base locale.',
               'conserve automatiquement les archives vérifiées en mémoire locale et prépare des exports propres.'),
              ('<b>Future base locale</b>', '<b>Mémoire locale active</b>'),
              ('<span>Ton PC Ryzen 7 pourra stocker l’historique plus tard.</span>',
               '<span>IndexedDB conserve déjà les archives pédagogiques et observations marché vérifiées.</span>'),
              ('<span>LocalStorage navigateur · aucune clé · aucun wallet</span>',
               '<span>IndexedDB local · préférences locales · aucune clé · aucun wallet</span>'),
              ('<p class="eyebrow">AGENTS À VENIR</p>', '<p class="eyebrow">AGENTS LOCAUX ACTIFS</p>'),
              ('<h3>Atlas-10 Crypto + NØX Risk Auditor</h3>', '<h3>Atlas-10 Crypto + Aerith-10 Crypto + NØX</h3>'),
              ('<p>Préparation visuelle seulement : aucun agent autonome, aucun conseil financier, aucun trading réel.</p>',
               '<p>Analyse locale contrôlée : Atlas structure, NØX audite, Aerith synthétise ; aucune exécution financière automatique.</p>'),
              ('<span class="pill ok">Preview</span>', '<span class="pill ok">Actifs</span>'),
              ('<article><b>Validé</b><span>Mode école, mémoire, explorateur, plan de collecte.</span></article>',
               '<article><b>Validé</b><span>Mode école, mémoire automatique, explorateur et collecte locale.</span></article>'),
              ('<article><b>À faire</b><span>Créer un 3e snapshot plus tard, puis comparer.</span></article>',
               '<article><b>État</b><span>La reprise se reconstruit depuis les archives et observations réellement présentes.</span></article>'),
              ('<article><b>Suite</b><span>Préparer V1.2-local-plan après repos.</span></article>',
               '<article><b>Suite</b><span>La prochaine action vient de l’état courant ; aucun ancien objectif de snapshot n’est imposé.</span></article>'),
          ]

          def replace_one(text, old, new, path):
              if text.count(old) == 1:
                  return text.replace(old,new,1)
              if path.name == 'system-presentation.js':
                  old_escaped=old.replace('"','\\"')
                  new_escaped=new.replace('"','\\"')
                  if text.count(old_escaped) == 1:
                      return text.replace(old_escaped,new_escaped,1)
              raise SystemExit(f'STOP {path}: bounded target count raw={text.count(old)}: {old[:90]}')

          for path in targets:
              text=path.read_text(encoding='utf-8')
              for old,new in replacements:
                  text=replace_one(text,old,new,path)
              if path.name=='system-presentation.js':
                  old='SOURCE="./views/system.html?v=administrator-build-40.4.221"'
                  new='SOURCE="./views/system.html?v=administrator-build-40.4.222"'
                  if text.count(old) != 1:
                      raise SystemExit(f'STOP System SOURCE token count={text.count(old)}')
                  text=text.replace(old,new,1)
              path.write_text(text,encoding='utf-8')
          PY

      - name: Publish canonical 40.4.222 identity
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/agent_crypto_release_driver.py \
            --build "$BUILD" \
            --parent "$PARENT" \
            --release "$RELEASE" \
            --status "$STATUS" \
            --contract-key system_presentation_truth_404222 \
            --contract-json '{"presentation_only":true,"memory_schema_change":false,"agent_runtime_change":false,"simulation_engine_change":false,"data_change":false,"geometry_change":false,"market_core_change":false}' \
            --lineage-note '40.4.222 aligns System/Simulation copy with current IndexedDB memory, active local agents and dynamic reprise truth; no business/runtime owner change.'

      - name: Update canonical release notes and handoff
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          manifest=Path('coordination/inter_ai_dialogues/agent_crypto/AGENT_CRYPTO_RELEASE_MANIFEST.md')
          text=manifest.read_text(encoding='utf-8')
          if 'Release courante : **40.4.221**' not in text: raise SystemExit('STOP release manifest version anchor missing')
          text=text.replace('Release courante : **40.4.221**','Release courante : **40.4.222**',1)
          old="Le ZIP cumulatif fiable est l'archive GitHub du commit final 40.4.221 : il contient le dépôt complet et évite un paquet différentiel incomplet. La release ne modifie pas les archives de données automatiques pendant sa construction."
          new="Les livraisons opérateur redeviennent des ZIP différentiels « à l’ancienne » : uniquement les fichiers réellement modifiés par la version, accompagnés d’une liste et du commit canonique. Aucun dump complet du dépôt n’est requis pour une release de travail. La release ne modifie pas les archives de données automatiques pendant sa construction."
          if old not in text: raise SystemExit('STOP packaging paragraph missing')
          text=text.replace(old,new,1)
          text += "\n40.4.222 est une release de **System Presentation Truth** : les textes statiques de System/Simulation rejoignent la réalité déjà active — mémoire IndexedDB, agents locaux et reprise dynamique. Aucun schéma de mémoire, moteur de simulation, donnée marché, géométrie ou Market Core n’est modifié.\n"
          manifest.write_text(text,encoding='utf-8')

          prompt=Path('coordination/inter_ai_dialogues/agent_crypto/PROMPT_REPRISE_AETHER_AGENT_CRYPTO.md')
          text=prompt.read_text(encoding='utf-8')
          if 'Version de reprise : **40.4.221**' not in text: raise SystemExit('STOP prompt version anchor missing')
          text=text.replace('Version de reprise : **40.4.221**','Version de reprise : **40.4.222**',1)
          text += "\n40.4.222 verrouille la **vérité de présentation System/Simulation** : les cartes statiques ne parlent plus de future mémoire locale, d’agents seulement en preview, d’un troisième snapshot obligatoire ou d’un ancien plan V1.2. La mémoire IndexedDB et la reprise dynamique déjà actives restent les propriétaires de vérité. Le placeholder de synthèse d’un module neuf à 0/5 est conservé : il est correct tant que les preuves ne sont pas validées.\n\n### Livraison différentielle et images RND\n- Une version de travail se livre en ZIP minimal contenant uniquement ses fichiers modifiés + `FILES_CHANGED` + commit ; pas de ZIP géant du dépôt.\n- Les images RND sont préparées en séries et uploadées manuellement par Christophe dans `administrator/assets/visual/technical-reading/`. Ne référencer de nouveaux fichiers RND dans le runtime qu’après preuve qu’ils existent sur `main`.\n- Les thèmes temporels Aerith restent dominants pour la chronologie. Le futur thème **Glass** (extérieur transparent, sections/sous-sections sombres) est un chantier séparé : ne pas l’ouvrir sans demande explicite.\n"
          prompt.write_text(text,encoding='utf-8')

          ledger=Path('coordination/inter_ai_dialogues/agent_crypto/AGENT_CRYPTO_FIN_DE_FIL_AETHER.md')
          text=ledger.read_text(encoding='utf-8')
          if 'Version canonique de clôture : **40.4.221**' not in text: raise SystemExit('STOP ledger version anchor missing')
          text=text.replace('Version canonique de clôture : **40.4.221**','Version canonique de clôture : **40.4.222**',1)
          if '## 1. Cascade finale 40.4.205 → 40.4.221' not in text: raise SystemExit('STOP ledger cascade anchor missing')
          text=text.replace('## 1. Cascade finale 40.4.205 → 40.4.221','## 1. Cascade finale 40.4.205 → 40.4.222',1)
          anchor='- **40.4.221** — Simulation Dual Profile Surface Truth : reconnexion de la source System et de son shell parser aux deux profils déjà existants (École 100 € / Progression 1 000 €), aux valeurs dynamiques et aux libellés du Mode École ; moteur, journaux, IndexedDB, Kraken Paper et 11 modules protégés.\n'
          addition=anchor+'- **40.4.222** — System Presentation Truth : alignement des libellés statiques sur la mémoire IndexedDB déjà active, les agents locaux déjà actifs et la reprise dynamique ; aucun vieux objectif « 3e snapshot / V1.2 » n’est imposé. Le placeholder de synthèse 0/5 reste volontairement inchangé.\n'
          if anchor not in text: raise SystemExit('STOP ledger .221 anchor missing')
          text=text.replace(anchor,addition,1)
          text += "\n## 6. Livraison et RND\n\nLes paquets de travail sont désormais différentiels : fichiers modifiés de la version seulement, liste explicite et commit canonique. Les nouvelles images RND sont renommées en séries pour upload manuel ; leur enregistrement dans `RANDOM_LIBRARY` attend la présence vérifiée des fichiers sur `main`. Le thème temporel Aerith reste le thème chronologique courant ; Glass reste hors périmètre de cette clôture.\n"
          ledger.write_text(text,encoding='utf-8')
          PY

      - name: Prove bounded release
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/agent_crypto_version_truth_guard.py --expected-build "$BUILD"
          node --check public/agent_crypto_erith_ia/administrator/js/views/system-presentation.js
          grep -Fq 'Mémoire locale active' public/agent_crypto_erith_ia/administrator/views/system.html
          grep -Fq 'AGENTS LOCAUX ACTIFS' public/agent_crypto_erith_ia/administrator/views/system.html
          grep -Fq 'La prochaine action vient de l’état courant ; aucun ancien objectif de snapshot n’est imposé.' public/agent_crypto_erith_ia/administrator/views/system.html
          grep -Fq 'La synthèse automatique apparaîtra ici lorsque les preuves du module seront validées.' public/agent_crypto_erith_ia/administrator/views/system.html
          ! grep -Fq 'Future base locale' public/agent_crypto_erith_ia/administrator/views/system.html
          ! grep -Fq 'AGENTS À VENIR' public/agent_crypto_erith_ia/administrator/views/system.html
          ! grep -Fq 'Créer un 3e snapshot plus tard, puis comparer.' public/agent_crypto_erith_ia/administrator/views/system.html
          ! grep -Fq 'Préparer V1.2-local-plan après repos.' public/agent_crypto_erith_ia/administrator/views/system.html
          ! git diff --name-only | grep -q '^public/agent_crypto_erith_ia/data/'

      - name: Commit release and retire temporary workflows
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Aether Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          rm -f \
            '.github/workflows/agent-crypto-40-4-222-system-presentation-truth.yml' \
            '.github/workflows/agent-crypto-40-4-222-system-presentation-truth-r2.yml' \
            "$WORKFLOW"
          git add -A
          git commit -m 'release(agent-crypto): 40.4.222 system presentation truth lock'
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Build minimal changed-files package
        shell: bash
        run: |
          set -euo pipefail
          SHA="$(git rev-parse HEAD)"
          PKG='.release_package_404222'
          rm -rf "$PKG"
          mkdir -p "$PKG"
          git diff --name-only HEAD^ HEAD | grep -v '^\.github/workflows/' > /tmp/changed-404222.txt
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            [ -f "$f" ] || continue
            mkdir -p "$PKG/$(dirname "$f")"
            cp "$f" "$PKG/$f"
          done < /tmp/changed-404222.txt
          {
            echo '# Agent-Crypto 40.4.222 — fichiers modifiés'
            echo
            echo "Commit canonique : \`$SHA\`"
            echo 'Market Core : `38.15.11` — protégé'
            echo
            echo 'Paquet différentiel : uniquement les fichiers modifiés par 40.4.222. Les workflows temporaires auto-retirés sont exclus.'
            echo
            echo '## Fichiers'
            while IFS= read -r f; do [ -n "$f" ] && printf -- '- `%s`\n' "$f"; done < /tmp/changed-404222.txt
          } > "$PKG/FILES_CHANGED_40.4.222.md"

      - name: Upload minimal 40.4.222 package
        uses: actions/upload-artifact@v4
        with:
          name: AGENT_CRYPTO_BUILD_40_4_222_SYSTEM_PRESENTATION_TRUTH_CHANGED_FILES
          path: .release_package_404222/
          if-no-files-found: error
          retention-days: 30
