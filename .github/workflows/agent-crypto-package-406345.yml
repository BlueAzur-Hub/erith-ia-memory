name: Agent-Crypto 40.6.345 one-shot package

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/agent-crypto-package-406345.yml

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate and package differential release
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin main
          node --check public/agent_crypto_erith_ia/administrator/js/operator-dashboard-406345.js
          python - <<'PY'
          import json
          from pathlib import Path
          base=Path("public/agent_crypto_erith_ia/administrator")
          truth=json.loads((base/"build.json").read_text())
          assert truth["build"]=="40.6.345"
          assert truth["release"]=="OPERATOR DASHBOARD · MATH CORE + KILL SWITCH"
          index=(base/"index.html").read_text()
          assert index.count("operator-dashboard-406345.js")==1
          assert "KILL SWITCH" in (base/"js/operator-dashboard-406345.js").read_text()
          assert "MATH CORE" in (base/"js/operator-dashboard-406345.js").read_text()
          PY
          ZIP="coordination/inter_ai_dialogues/agent_crypto/AGENT_CRYPTO_40.6.345_OPERATOR_DASHBOARD_MATH_KILL_SWITCH.zip"
          rm -f "$ZIP"
          zip -9 "$ZIP"             public/agent_crypto_erith_ia/administrator/js/operator-dashboard-406345.js             public/agent_crypto_erith_ia/administrator/index.html             public/agent_crypto_erith_ia/administrator/build.json             coordination/inter_ai_dialogues/agent_crypto/HANDOFF_40.6.345_OPERATOR_DASHBOARD_MATH_KILL_SWITCH.md
          test -s "$ZIP"
          unzip -t "$ZIP"
          rm -f .github/workflows/agent-crypto-package-406345.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$ZIP" .github/workflows/agent-crypto-package-406345.yml
          git commit -m "chore(agent-crypto): package 40.6.345 operator dashboard ZIP"
          git push origin HEAD:main
