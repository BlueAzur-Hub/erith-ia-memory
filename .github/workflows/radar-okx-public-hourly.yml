name: Radar OKX EEA Public Hourly
on:
  pull_request:
    paths:
      - 'public/agent_crypto_erith_ia/tools/collect_okx_public_hourly.py'
      - 'public/agent_crypto_erith_ia/tools/build_okx_hourly_evidence.py'
      - 'public/agent_crypto_erith_ia/tools/test_build_okx_hourly_evidence.py'
      - 'public/agent_crypto_erith_ia/tools/test_collect_okx_public_hourly.py'
      - 'public/agent_crypto_erith_ia/tools/collect_irys_spot_history.py'
      - 'public/agent_crypto_erith_ia/tools/test_irys_spot_history.py'
      - 'public/agent_crypto_erith_ia/tools/collect_hype_spot_history.py'
      - 'public/agent_crypto_erith_ia/tools/test_hype_spot_history.py'
      - 'public/agent_crypto_erith_ia/tools/collect_okx_spot_universe_history.py'
      - 'public/agent_crypto_erith_ia/tools/test_okx_spot_universe_history.py'
      - 'public/agent_crypto_erith_ia/tools/collect_case_market_hourly.py'
      - 'public/agent_crypto_erith_ia/tools/test_collect_case_market_hourly.py'
      - 'public/agent_crypto_erith_ia/tools/collect_radar_okx_books.py'
      - 'public/agent_crypto_erith_ia/tools/test_collect_radar_okx_books.py'
      - 'public/agent_crypto_erith_ia/tools/collect_radar_verified_targets.py'
      - 'public/agent_crypto_erith_ia/tools/test_collect_radar_verified_targets.py'
      - 'public/agent_crypto_erith_ia/tools/audit_radar_target_coverage.py'
      - 'public/agent_crypto_erith_ia/tools/test_audit_radar_target_coverage.py'
      - 'public/agent_crypto_erith_ia/tools/test_radar_schedule_stagger.py'
      - '.github/workflows/atlas_market_collector.yml'
      - '.github/workflows/atlas_news_collector.yml'
      - '.github/workflows/atlas-public-crypto-market-clock.yml'
      - '.github/workflows/seven-priority-spot-paper.yml'
      - '.github/workflows/radar-okx-public-hourly.yml'
      - '.github/workflows/atlas-public-crypto-market-clock.yml'
  push:
    branches: [main]
    paths:
      - 'public/agent_crypto_erith_ia/tools/collect_okx_public_hourly.py'
      - 'public/agent_crypto_erith_ia/tools/build_okx_hourly_evidence.py'
      - 'public/agent_crypto_erith_ia/tools/test_build_okx_hourly_evidence.py'
      - 'public/agent_crypto_erith_ia/tools/test_collect_okx_public_hourly.py'
      - 'public/agent_crypto_erith_ia/tools/collect_irys_spot_history.py'
      - 'public/agent_crypto_erith_ia/tools/test_irys_spot_history.py'
      - 'public/agent_crypto_erith_ia/tools/collect_hype_spot_history.py'
      - 'public/agent_crypto_erith_ia/tools/test_hype_spot_history.py'
      - 'public/agent_crypto_erith_ia/tools/collect_okx_spot_universe_history.py'
      - 'public/agent_crypto_erith_ia/tools/test_okx_spot_universe_history.py'
      - 'public/agent_crypto_erith_ia/tools/collect_case_market_hourly.py'
      - 'public/agent_crypto_erith_ia/tools/test_collect_case_market_hourly.py'
      - 'public/agent_crypto_erith_ia/tools/collect_radar_okx_books.py'
      - 'public/agent_crypto_erith_ia/tools/test_collect_radar_okx_books.py'
      - 'public/agent_crypto_erith_ia/tools/collect_radar_verified_targets.py'
      - 'public/agent_crypto_erith_ia/tools/test_collect_radar_verified_targets.py'
      - 'public/agent_crypto_erith_ia/tools/audit_radar_target_coverage.py'
      - 'public/agent_crypto_erith_ia/tools/test_audit_radar_target_coverage.py'
      - 'public/agent_crypto_erith_ia/tools/test_radar_schedule_stagger.py'
      - '.github/workflows/atlas_market_collector.yml'
      - '.github/workflows/atlas_news_collector.yml'
      - '.github/workflows/atlas-public-crypto-market-clock.yml'
      - '.github/workflows/seven-priority-spot-paper.yml'
      - '.github/workflows/radar-okx-public-hourly.yml'
      - '.github/workflows/atlas-public-crypto-market-clock.yml'
  workflow_dispatch:
  schedule:
    - cron: '38 * * * *'
  # Independent fallback signal: GitHub cron may be delayed or dropped.
  # No second hourly scheduler and no reconstruction of missed order books.
  workflow_run:
    workflows: ["Agent Crypto Historical OHLCV R10 Synchronized Hourly Pilot"]
    types: [completed]
    branches: [main]
permissions:
  contents: write
concurrency:
  # Same lock as other public Radar writes to main; PR tests never block production.
  group: ${{ github.event_name == 'pull_request' && format('radar-okx-hourly-pr-{0}', github.event.pull_request.number) || 'radar-spot-target-qualification' }}
  cancel-in-progress: false
jobs:
  hourly_public_spot:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       (github.event.workflow_run.event == 'schedule' ||
        github.event.workflow_run.event == 'workflow_dispatch' ||
        github.event.workflow_run.event == 'workflow_run'))
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify bounded EEA public data and no orders (offline)
        run: |
          python -m py_compile public/agent_crypto_erith_ia/tools/collect_okx_public_hourly.py
          python -m py_compile public/agent_crypto_erith_ia/tools/collect_irys_spot_history.py
          python -m unittest discover -s public/agent_crypto_erith_ia/tools -p 'test_irys_spot_history.py' -v
          python -m py_compile public/agent_crypto_erith_ia/tools/collect_hype_spot_history.py
          python -m unittest discover -s public/agent_crypto_erith_ia/tools -p 'test_hype_spot_history.py' -v
          python -m py_compile public/agent_crypto_erith_ia/tools/collect_okx_spot_universe_history.py
          python -m unittest discover -s public/agent_crypto_erith_ia/tools -p 'test_okx_spot_universe_history.py' -v
          python -m unittest discover -s public/agent_crypto_erith_ia/tools -p 'test_collect_okx_public_hourly.py' -v
          python -m py_compile public/agent_crypto_erith_ia/tools/collect_case_market_hourly.py
          python -m unittest discover -s public/agent_crypto_erith_ia/tools -p 'test_collect_case_market_hourly.py' -v
          python -m py_compile public/agent_crypto_erith_ia/tools/collect_radar_okx_books.py
          python -m unittest discover -s public/agent_crypto_erith_ia/tools -p 'test_collect_radar_okx_books.py' -v
          python -m py_compile public/agent_crypto_erith_ia/tools/collect_radar_verified_targets.py
          python -m unittest discover -s public/agent_crypto_erith_ia/tools -p 'test_collect_radar_verified_targets.py' -v
          python -m py_compile public/agent_crypto_erith_ia/tools/audit_radar_target_coverage.py
          python -m unittest discover -s public/agent_crypto_erith_ia/tools -p 'test_audit_radar_target_coverage.py' -v
          python -m unittest discover -s public/agent_crypto_erith_ia/tools -p 'test_build_okx_hourly_evidence.py' -v
          python -m unittest discover -s public/agent_crypto_erith_ia/tools -p 'test_radar_schedule_stagger.py' -v
      - name: Capture genuine HYPE-USDC candles and one immutable hourly Spot book
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            if ! python public/agent_crypto_erith_ia/tools/collect_hype_spot_history.py; then
              echo 'WARN: OKX EEA HYPE-USDC native source unavailable; do not synthesize any book or OHLCV'
              exit 0
            fi
            git add -A -- public/agent_crypto_erith_ia/data/crypto/okx-hourly/hype-spot-candles.json public/agent_crypto_erith_ia/data/crypto/okx-hourly/hype-spot-books/
            if git diff --cached --quiet; then
              echo 'No new native HYPE proof to publish'
              exit 0
            fi
            git commit -m 'Archive authentic HYPE-USDC OKX native candles and dated Spot book'
            if git push origin HEAD:main; then
              echo 'New public HYPE evidence published: no private account, trade or fill'
              exit 0
            fi
            sleep "$((attempt*3))"
          done
          echo 'HYPE evidence collection finished locally but could not be published' >&2
          exit 1

      - name: Collect other verified OKX Spot USDC history (one archive per UTC day)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            # The script has a STRICT allowlist of pairs seen on the OKX Spot rankings.
            # It refuses mismatched/non-live instruments and archives no fabricated bars.
            if ! python public/agent_crypto_erith_ia/tools/collect_okx_spot_universe_history.py; then
              echo 'WARN: Not all observed Spot markets could be archived; retain verified existing data'
            fi
            git add -A -- public/agent_crypto_erith_ia/data/crypto/okx-hourly/spot-candles/
            if git diff --cached --quiet; then
              echo 'No new verified Spot candles to publish in this UTC day'
              exit 0
            fi
            git commit -m 'Archive bounded OKX native USDC OHLCV for observed Spot markets'
            if git push origin HEAD:main; then
              echo 'Published verified Spot candles; unverified markets remain missing'
              exit 0
            fi
            echo 'Concurrent data commit: retry only missing current-date archives'
            sleep "$((attempt*3))"
          done
          echo 'Could not publish verified Spot candles to main' >&2
          exit 1

      - name: Archive one immutable UTC hourly public snapshot
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          echo "Hourly observation trigger: ${{ github.event_name }}; actual UTC: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "Public-only observation of current UTC hour: skipped hours are never backfilled." >> "$GITHUB_STEP_SUMMARY"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            # Avoid repeating public API calls on multiple recovery triggers in one UTC hour.
            if python - <<'PY'
          import datetime, json, pathlib, sys
          root=pathlib.Path('public/agent_crypto_erith_ia/data/crypto')
          hour=datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%dT%HZ')
          expected=[('okx-hourly/latest.json','last_hour_utc'),
                    ('case-market-hourly/latest.json','last_hour_utc'),
                    ('radar-verified-target-hourly/latest.json','hour_utc')]
          ready=True
          for rel,key in expected:
              p=root/rel
              if not p.is_file():
                  ready=False
                  break
              try:
                  obj=json.loads(p.read_text(encoding='utf-8'))
              except (OSError,ValueError):
                  ready=False
                  break
              if obj.get(key)!=hour or obj.get('real_orders')!=0:
                  ready=False
                  break
          sys.exit(0 if ready else 1)
          PY
            then
              echo "All public Radar archives already present for this actual UTC hour; no second network collection"
              exit 0
            fi
            # Never backfill the missed hour with a newly observed current quote.
            python public/agent_crypto_erith_ia/tools/collect_okx_public_hourly.py
            python public/agent_crypto_erith_ia/tools/build_okx_hourly_evidence.py
            # Same hourly Radar: persist authentic closed IRYS-USDC candles; no backfill of books.
            if ! python public/agent_crypto_erith_ia/tools/collect_irys_spot_history.py; then
              echo 'WARN: IRYS-USDC historical OHLCV unavailable; preserve last verified file'
            fi
            # Use this already-scheduled hourly Radar; no second timer or service.
            # API outage is recorded as unavailable instead of a fictional quote.
            if ! python public/agent_crypto_erith_ia/tools/collect_case_market_hourly.py; then
              echo 'WARN: additional ZEC/AXIS public observation unavailable; core OKX archive retained'
            fi
            # Independent fixed pairs SAHARA/T/GRASS; reuse this already-scheduled UTC hour.
            if ! python public/agent_crypto_erith_ia/tools/collect_radar_okx_books.py; then
              echo 'WARN: OKX EEA three-pair books unavailable; do not create synthetic quotes'
            fi
            # Maximum 15 public Bitget calls for 3 contract-matched candidates.
            # Catalog or native mismatch = no invented target quote.
            if ! python public/agent_crypto_erith_ia/tools/collect_radar_verified_targets.py; then
              echo 'WARN: verified Radar target capture absent; no stale replacement'
            fi
            # Independent fail-closed coverage report; never alters the source archives.
            if [ -f public/agent_crypto_erith_ia/data/crypto/radar-verified-target-hourly/latest.json ]; then
              if ! python public/agent_crypto_erith_ia/tools/audit_radar_target_coverage.py; then
                echo 'WARN: coverage report skipped; original immutable market observations remain'
              fi
            fi
            git add -A -- public/agent_crypto_erith_ia/data/crypto/okx-hourly/
            if [ -d public/agent_crypto_erith_ia/data/crypto/case-market-hourly ]; then
              git add -A -- public/agent_crypto_erith_ia/data/crypto/case-market-hourly/
            fi
            if [ -d public/agent_crypto_erith_ia/data/crypto/radar-verified-target-hourly ]; then
              git add -A -- public/agent_crypto_erith_ia/data/crypto/radar-verified-target-hourly/
            fi
            if [ -d public/agent_crypto_erith_ia/data/crypto/radar-okx-book-hourly ]; then
              git add -A -- public/agent_crypto_erith_ia/data/crypto/radar-okx-book-hourly/
            fi
            if git diff --cached --quiet; then
              echo 'UTC hourly observation already archived; no duplicate or backfill'
              exit 0
            fi
            git commit -m 'Archive dated OKX EEA hourly public Spot snapshot (no orders)'
            if git push origin HEAD:main; then
              echo 'Hour archived: public prices and book evidence only'
              exit 0
            fi
            echo 'Repository moved; retrying on the newest main without overwriting snapshots'
            sleep "$((attempt*3))"
          done
          echo 'Could not publish snapshot to main; no fabricated market data' >&2
          exit 1

