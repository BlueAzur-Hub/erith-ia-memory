name: Agent-Crypto 40.6.8 Historical Functional Restore

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/agent-crypto-40608-historical-restore.yml

permissions:
  contents: write

concurrency:
  group: agent-crypto-40608-historical-restore
  cancel-in-progress: false

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout canonical main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply bounded historical restore
        run: python .github/scripts/agent_crypto_40608_restore.py

      - name: Syntax and JSON gates
        shell: bash
        run: |
          set -euo pipefail
          ROOT=public/agent_crypto_erith_ia/administrator
          node --check "$ROOT/js/version-truth.js"
          python -m json.tool "$ROOT/version.json" >/dev/null
          python -m json.tool "$ROOT/administrator-version.json" >/dev/null
          python -m json.tool "$ROOT/build.json" >/dev/null
          git diff --check

      - name: Commit restored build
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Seven Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/agent_crypto_erith_ia/administrator/index.html
          git add public/agent_crypto_erith_ia/administrator/admin-chronos.css
          git add public/agent_crypto_erith_ia/administrator/js/version-truth.js
          git add public/agent_crypto_erith_ia/administrator/build.json
          git add public/agent_crypto_erith_ia/administrator/administrator-version.json
          git add public/agent_crypto_erith_ia/administrator/version.json
          git add public/agent_crypto_erith_ia/administrator/RELEASE_40_6_8.md
          git add coordination/inter_ai_dialogues/agent_crypto/AGENT_CRYPTO_BUILD_40_6_8_HISTORICAL_FUNCTIONAL_RESTORE_CLEAN_UPLOAD_7_FILES.zip
          git add coordination/inter_ai_dialogues/agent_crypto/AGENT_CRYPTO_BUILD_40_6_8_HISTORICAL_FUNCTIONAL_RESTORE_CLEAN_UPLOAD_7_FILES.zip.sha256
          git diff --cached --quiet && { echo "STOP 40.6.8: no changes"; exit 1; }
          git commit -m "fix(agent-crypto): restore historical functional contracts 40.6.8"
          git push origin HEAD:main
