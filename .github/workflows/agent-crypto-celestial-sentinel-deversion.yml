name: Celestial Sentinel functional de-versioning

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/agent-crypto-celestial-sentinel-deversion.yml'

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout canonical main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: De-version active Celestial Sentinel contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          runtime = Path('public/agent_crypto_erith_ia/administrator/runtime-shell.html')
          freeze = Path('public/agent_crypto_erith_ia/administrator/js/architecture-freeze.js')
          old = '__AGENT_CRYPTO_CELESTIAL_SENTINEL_40268__'
          new = '__AGENT_CRYPTO_CELESTIAL_SENTINEL__'

          active = [runtime, freeze]
          for path in active:
              text = path.read_text(encoding='utf-8')
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: expected exactly one active old identifier, got {text.count(old)}')
              if text.count(new) != 0:
                  raise SystemExit(f'{path}: stable identifier already exists unexpectedly')

          runtime_text = runtime.read_text(encoding='utf-8').replace(old, new, 1)
          freeze_text = freeze.read_text(encoding='utf-8').replace(old, new, 1)

          required_runtime = (
              'span.dataset.chrono=key',
              '[data-chrono="${key}"]',
              'day.dataset.planet=astroPlanetTone',
              'hour.dataset.planet=astroPlanetTone',
              '__AGENT_CRYPTO_ASTROCYCLE__',
              '__AGENT_CRYPTO_CELESTIAL_CADENCE__',
          )
          for token in required_runtime:
              if token not in runtime_text:
                  raise SystemExit(f'Validated Chronos contract missing: {token}')

          required_freeze = 'const sentinel=globalThis.__AGENT_CRYPTO_CELESTIAL_SENTINEL__;'
          if required_freeze not in freeze_text:
              raise SystemExit('Architecture freeze did not migrate to stable Sentinel contract')

          runtime.write_text(runtime_text, encoding='utf-8')
          freeze.write_text(freeze_text, encoding='utf-8')
          print('Active Celestial Sentinel contract migrated in runtime + architecture freeze')
          PY

      - name: Static proof
        shell: bash
        run: |
          set -euo pipefail
          R='public/agent_crypto_erith_ia/administrator/runtime-shell.html'
          F='public/agent_crypto_erith_ia/administrator/js/architecture-freeze.js'
          ! grep -Fq '__AGENT_CRYPTO_CELESTIAL_SENTINEL_40268__' "$R"
          ! grep -Fq '__AGENT_CRYPTO_CELESTIAL_SENTINEL_40268__' "$F"
          test "$(grep -Fo '__AGENT_CRYPTO_CELESTIAL_SENTINEL__' "$R" | wc -l)" -eq 1
          test "$(grep -Fo '__AGENT_CRYPTO_CELESTIAL_SENTINEL__' "$F" | wc -l)" -eq 1
          grep -Fq 'data-chrono="${key}"' "$R"
          grep -Fq '__AGENT_CRYPTO_ASTROCYCLE__' "$R"
          grep -Fq '__AGENT_CRYPTO_CELESTIAL_CADENCE__' "$R"

      - name: Commit surgical cleanup and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'BlueAzur-Hub'
          git config user.email 'Blue.Azur@protonmail.com'
          git rm --ignore-unmatch '.github/workflows/agent-crypto-celestial-sentinel-deversion.yml'
          git add 'public/agent_crypto_erith_ia/administrator/runtime-shell.html' \
                  'public/agent_crypto_erith_ia/administrator/js/architecture-freeze.js'
          git diff --cached --check
          git commit -m 'refactor(celestial): stabilize Sentinel global contract'
          git push origin HEAD:main
