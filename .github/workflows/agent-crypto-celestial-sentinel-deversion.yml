name: Celestial Sentinel functional de-versioning

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/agent-crypto-celestial-sentinel-deversion.yml'

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout canonical main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: De-version Celestial Sentinel global contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path('.')
          runtime = Path('public/agent_crypto_erith_ia/administrator/runtime-shell.html')
          old = '__AGENT_CRYPTO_CELESTIAL_SENTINEL_40268__'
          new = '__AGENT_CRYPTO_CELESTIAL_SENTINEL__'

          # Repository-wide proof: the old token must have exactly one live occurrence.
          hits = []
          for p in root.rglob('*'):
              if not p.is_file() or '.git' in p.parts:
                  continue
              try:
                  text = p.read_text(encoding='utf-8')
              except Exception:
                  continue
              count = text.count(old)
              if count:
                  hits.append((str(p), count))

          total = sum(count for _, count in hits)
          if total != 1 or hits != [(str(runtime), 1)]:
              raise SystemExit(f'Expected exactly one repository-wide occurrence in runtime-shell.html, found {hits}')

          text = runtime.read_text(encoding='utf-8')
          if text.count(new) != 0:
              raise SystemExit(f'Stable target already exists unexpectedly: {new}')

          text = text.replace(old, new, 1)
          if old in text or text.count(new) != 1:
              raise SystemExit('Celestial Sentinel de-versioning proof failed after replacement')

          # Preserve the already-validated Chronos stable contracts.
          required = (
              'span.dataset.chrono=key',
              '[data-chrono="${key}"]',
              'day.dataset.planet=astroPlanetTone',
              'hour.dataset.planet=astroPlanetTone',
              '__AGENT_CRYPTO_ASTROCYCLE__',
              '__AGENT_CRYPTO_CELESTIAL_CADENCE__',
          )
          for token in required:
              if token not in text:
                  raise SystemExit(f'Validated Chronos contract missing: {token}')

          runtime.write_text(text, encoding='utf-8')
          print('Celestial Sentinel global contract:', old, '->', new)
          PY

      - name: Static proof
        shell: bash
        run: |
          set -euo pipefail
          R='public/agent_crypto_erith_ia/administrator/runtime-shell.html'
          ! grep -Fq '__AGENT_CRYPTO_CELESTIAL_SENTINEL_40268__' "$R"
          test "$(grep -Fo '__AGENT_CRYPTO_CELESTIAL_SENTINEL__' "$R" | wc -l)" -eq 1
          grep -Fq 'data-chrono="${key}"' "$R"
          grep -Fq '__AGENT_CRYPTO_ASTROCYCLE__' "$R"
          grep -Fq '__AGENT_CRYPTO_CELESTIAL_CADENCE__' "$R"

      - name: Commit surgical cleanup and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'BlueAzur-Hub'
          git config user.email 'Blue.Azur@protonmail.com'
          git rm --ignore-unmatch '.github/workflows/agent-crypto-celestial-sentinel-deversion.yml'
          git add 'public/agent_crypto_erith_ia/administrator/runtime-shell.html'
          git diff --cached --check
          git commit -m 'refactor(celestial): remove Sentinel versioned global identifier'
          git push origin HEAD:main
