name: Agent-Crypto 40.4.177 Version Truth CI Guard

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/agent-crypto-40-4-177-version-truth-ci-guard.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main

      - name: Patch 40.4.177 release atomicity lock
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, json
          from datetime import datetime, timezone

          base = Path('public/agent_crypto_erith_ia/administrator')
          build = '40.4.177'
          parent = '40.4.176'
          release = 'VERSION TRUTH CI GUARD · RELEASE ATOMICITY LOCK'
          status = 'version_truth_ci_guard_release_atomicity_lock'
          now = datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z')

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{p}: expected exactly 1 occurrence, got {count}: {old!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(base/'app.js', 'const ATLAS_BUILD = "40.4.176";', f'const ATLAS_BUILD = "{build}";')
          replace_once(base/'js/app.js', 'const ADMIN_BUILD = "40.4.176";', f'const ADMIN_BUILD = "{build}";')
          replace_once(base/'js/app.js', 'const ADMIN_RELEASE = "RUNTIME VERSION AUTHORITY LOCK · CACHE-BUSTED OWNERS";', f'const ADMIN_RELEASE = "{release}";')

          index = base/'index.html'
          text = index.read_text(encoding='utf-8')
          replacements = [
              ('<meta name="atlas-build" content="40.4.176" />', f'<meta name="atlas-build" content="{build}" />'),
              ('<meta name="administrator-build" content="40.4.176" />', f'<meta name="administrator-build" content="{build}" />'),
              ('<meta name="administrator-release" content="RUNTIME VERSION AUTHORITY LOCK · CACHE-BUSTED OWNERS" />', f'<meta name="administrator-release" content="{release}" />'),
              ('<meta name="atlas-asset-token" content="market-core-v2.0-alpha-build-40.4.176" />', f'<meta name="atlas-asset-token" content="market-core-v2.0-alpha-build-{build}" />'),
              ('<title>Agent-Crypto @erith.IA — Build 40.4.176 · Administrator</title>', f'<title>Agent-Crypto @erith.IA — Build {build} · Administrator</title>'),
              ('<script src="./app.js?v=administrator-build-40.4.176"></script>', f'<script src="./app.js?v=administrator-build-{build}"></script>'),
              ('<script src="./js/app.js?v=administrator-build-40.4.176"></script>', f'<script src="./js/app.js?v=administrator-build-{build}"></script>'),
              ("<span id=\"footerRelease\">Agent-Crypto @erith.IA · Market Core · Build 40.4.176 · Version : Parker Lewis Can't Lose</span>", f"<span id=\"footerRelease\">Agent-Crypto @erith.IA · Market Core · Build {build} · Version : Parker Lewis Can't Lose</span>"),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{index}: expected exactly 1 occurrence, got {count}: {old!r}')
              text = text.replace(old, new, 1)
          index.write_text(text, encoding='utf-8')

          vp = base/'version.json'
          manifest = json.loads(vp.read_text(encoding='utf-8'))
          if manifest.get('build') != parent:
              raise SystemExit(f'version.json parent mismatch: {manifest.get("build")} != {parent}')
          manifest['release'] = release
          manifest['build'] = build
          manifest['asset_token'] = f'market-core-v2.0-alpha-build-{build}'
          manifest['status'] = status
          manifest['prepared_at'] = now
          manifest['published_at'] = now
          manifest['parent_build'] = parent
          manifest['revision'] = 'V1'
          lineage = str(manifest.get('lineage') or '')
          if '40.4.177 Version Truth CI Guard' not in lineage:
              lineage += ' → 40.4.177 Version Truth CI Guard: permanent dynamic guard rejects split build identities, stale critical runtime cache tokens and manifest payload hash drift before publication.'
          manifest['lineage'] = lineage
          contract = {
              'schema': 'erith.admin.version-truth-ci-guard.v1',
              'build': build,
              'parent_build': parent,
              'persistent_guard': '.github/workflows/agent-crypto-version-truth-guard.yml',
              'guard_verified_on_parent': True,
              'checks': [
                  'index_meta_build', 'index_title_build', 'root_runtime_build',
                  'administrator_runtime_build', 'administrator_release',
                  'critical_runtime_cache_tokens', 'footer_build',
                  'version_manifest_build_token', 'administrator_manifest_build',
                  'market_core_38_15_11', 'manifest_payload_sha256'
              ],
              'market_core_modified': False,
              'business_semantics_changed': False,
              'new_runtime_network_owner': False,
              'new_runtime_timer': False,
              'new_runtime_observer': False,
              'new_runtime_storage_owner': False,
          }
          manifest.setdefault('contracts', {})['version_truth_ci_guard_404177'] = contract

          ap = base/'administrator-version.json'
          admin = json.loads(ap.read_text(encoding='utf-8'))
          if admin.get('build') != parent:
              raise SystemExit(f'administrator-version.json parent mismatch: {admin.get("build")} != {parent}')
          admin['build'] = build
          admin['global_versioning'] = build
          admin['release'] = release
          admin['status'] = status
          admin['prepared_at'] = now
          admin['published_at'] = now
          admin['parent_build'] = parent
          admin['revision'] = 'V1'
          admin.setdefault('contracts', {})['version_truth_ci_guard_404177'] = contract
          ap.write_text(json.dumps(admin, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          files = manifest.get('files')
          if not isinstance(files, dict) or not files:
              raise SystemExit('version.json files hash map missing')
          for rel in list(files):
              p = base/rel
              if not p.is_file():
                  raise SystemExit(f'manifest hash target missing: {rel}')
              files[rel] = hashlib.sha256(p.read_bytes()).hexdigest()
          vp.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Validate 40.4.177 before commit
        shell: bash
        run: |
          node --check public/agent_crypto_erith_ia/administrator/app.js
          node --check public/agent_crypto_erith_ia/administrator/js/app.js
          python - <<'PY'
          from pathlib import Path
          import hashlib, json
          base=Path('public/agent_crypto_erith_ia/administrator')
          build='40.4.177'
          release='VERSION TRUTH CI GUARD · RELEASE ATOMICITY LOCK'
          index=(base/'index.html').read_text(encoding='utf-8')
          root=(base/'app.js').read_text(encoding='utf-8')
          adminjs=(base/'js/app.js').read_text(encoding='utf-8')
          version=json.loads((base/'version.json').read_text(encoding='utf-8'))
          mirror=json.loads((base/'administrator-version.json').read_text(encoding='utf-8'))
          required=[
            f'<meta name="atlas-build" content="{build}" />',
            f'<meta name="administrator-build" content="{build}" />',
            f'<meta name="administrator-release" content="{release}" />',
            f'<meta name="atlas-asset-token" content="market-core-v2.0-alpha-build-{build}" />',
            f'<title>Agent-Crypto @erith.IA — Build {build} · Administrator</title>',
            f'./app.js?v=administrator-build-{build}',
            f'./js/app.js?v=administrator-build-{build}',
            f'Market Core · Build {build} · Version : Parker Lewis Can\'t Lose',
          ]
          if any(x not in index for x in required): raise SystemExit('index authority drift')
          if f'const ATLAS_BUILD = "{build}";' not in root: raise SystemExit('root runtime drift')
          if f'const ADMIN_BUILD = "{build}";' not in adminjs: raise SystemExit('admin runtime drift')
          if f'const ADMIN_RELEASE = "{release}";' not in adminjs: raise SystemExit('admin release drift')
          if version.get('build') != build or version.get('asset_token') != f'market-core-v2.0-alpha-build-{build}': raise SystemExit('canonical manifest drift')
          if mirror.get('build') != build or mirror.get('global_versioning') != build: raise SystemExit('mirror manifest drift')
          if version.get('engine',{}).get('reference_build') != '38.15.11': raise SystemExit('Market Core changed')
          if 'const ENGINE_BUILD = "38.15.11";' not in adminjs: raise SystemExit('admin engine identity changed')
          for rel,expected in version.get('files',{}).items():
              got=hashlib.sha256((base/rel).read_bytes()).hexdigest()
              if got != expected: raise SystemExit(f'hash drift {rel}')
          if not Path('.github/workflows/agent-crypto-version-truth-guard.yml').is_file(): raise SystemExit('persistent guard missing')
          PY

      - name: Commit release and retire one-shot
        shell: bash
        run: |
          git rm .github/workflows/agent-crypto-40-4-177-version-truth-ci-guard.yml
          git add public/agent_crypto_erith_ia/administrator/app.js \
                  public/agent_crypto_erith_ia/administrator/js/app.js \
                  public/agent_crypto_erith_ia/administrator/index.html \
                  public/agent_crypto_erith_ia/administrator/version.json \
                  public/agent_crypto_erith_ia/administrator/administrator-version.json
          git commit -m "release Agent-Crypto 40.4.177 version truth CI guard"
          git pull --rebase origin main
          git push origin main
