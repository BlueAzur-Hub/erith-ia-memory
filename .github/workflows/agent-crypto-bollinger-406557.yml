name: Agent-Crypto 40.6.557 Candles Bollinger
on:
  pull_request:
    paths:
      - "public/agent_crypto_erith_ia/administrator/js/market-microscope-candles-406498.js"
      - "public/agent_crypto_erith_ia/administrator/index.html"
      - "public/agent_crypto_erith_ia/administrator/index-40.6.557.html"
      - "public/agent_crypto_erith_ia/administrator/build.json"
      - "public/agent_crypto_erith_ia/administrator/CANDLES_BOLLINGER_40.6.557.md"
      - ".github/scripts/agent_crypto_bollinger_guard_406557.py"
      - ".github/workflows/agent-crypto-bollinger-406557.yml"
  push:
    branches: [main]
    paths:
      - "public/agent_crypto_erith_ia/administrator/js/market-microscope-candles-406498.js"
      - "public/agent_crypto_erith_ia/administrator/index.html"
      - "public/agent_crypto_erith_ia/administrator/index-40.6.557.html"
      - "public/agent_crypto_erith_ia/administrator/build.json"
      - "public/agent_crypto_erith_ia/administrator/CANDLES_BOLLINGER_40.6.557.md"
      - ".github/scripts/agent_crypto_bollinger_guard_406557.py"
      - ".github/workflows/agent-crypto-bollinger-406557.yml"
  workflow_dispatch:
permissions: {contents: read}
jobs:
  validate-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node --check public/agent_crypto_erith_ia/administrator/js/market-microscope-candles-406498.js
      - run: |
          node - <<'NODE'
          require('./public/agent_crypto_erith_ia/administrator/js/market-microscope-candles-406498.js');
          const r=global.AgentCryptoMarketMicroscope.self_test(); console.log(JSON.stringify(r,null,2));
          if(!r.pass||!r.checks.bollinger_method||!r.checks.bollinger_values||!r.checks.bollinger_default_off)process.exit(1);
          NODE
      - run: python .github/scripts/agent_crypto_bollinger_guard_406557.py
      - run: python .github/scripts/agent_crypto_version_truth_guard_compat.py
      - name: Package compact patch
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,zipfile
          r=Path("public/agent_crypto_erith_ia/administrator");o=Path("AGENT_CRYPTO_ADMINISTRATOR_40.6.557_BOLLINGER_PATCH.zip")
          fs=[r/"index.html",r/"index-40.6.557.html",r/"build.json",r/"js/market-microscope-candles-406498.js",r/"CANDLES_BOLLINGER_40.6.557.md"]
          with zipfile.ZipFile(o,"w",zipfile.ZIP_DEFLATED) as z:
            for p in fs:z.write(p,p.as_posix())
          h=hashlib.sha256(o.read_bytes()).hexdigest();Path("BOLLINGER_40.6.557_SHA256.txt").write_text(f"{h}  {o.name}\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: AGENT_CRYPTO_ADMINISTRATOR_40.6.557_BOLLINGER_PATCH
          path: |
            AGENT_CRYPTO_ADMINISTRATOR_40.6.557_BOLLINGER_PATCH.zip
            BOLLINGER_40.6.557_SHA256.txt
