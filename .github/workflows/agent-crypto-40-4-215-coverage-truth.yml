name: Agent-Crypto 40.4.215 Market Coverage Truth

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/agent-crypto-40-4-215-coverage-truth.yml'

permissions:
  contents: write

concurrency:
  group: agent-crypto-40-4-215-coverage-truth
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout canonical main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prove 40.4.214 baseline
        run: python .github/scripts/agent_crypto_version_truth_guard.py --expected-build 40.4.214

      - name: Apply bounded coverage-truth surgery
        run: python .github/scripts/_tmp_agent_crypto_404215.py

      - name: Publish canonical 40.4.215 identity
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/agent_crypto_release_driver.py \
            --build 40.4.215 \
            --parent 40.4.214 \
            --release 'MARKET COVERAGE TRUTH · PROVIDER RANK SEMANTICS LOCK' \
            --status 'market_coverage_truth_404215_operator_validation_required' \
            --contract-key market_coverage_truth_404215 \
            --contract-json /tmp/contract404215.json \
            --lineage-note '40.4.215 separates provider-rank caps from exact row cardinality; tied CoinGecko ranks stay truthful and unique IDs remain row authority.'

      - name: Prove 40.4.215 invariants
        shell: bash
        run: |
          set -euo pipefail
          ROOT='public/agent_crypto_erith_ia/administrator'
          node --check "$ROOT/app.js"
          node --check "$ROOT/js/app.js"
          python -m py_compile .github/scripts/agent_crypto_version_truth_guard.py .github/scripts/agent_crypto_release_driver.py
          python .github/scripts/agent_crypto_version_truth_guard.py --expected-build 40.4.215
          python - <<'PY'
          from pathlib import Path
          import json
          root=Path('public/agent_crypto_erith_ia/administrator')
          app=(root/'app.js').read_text(encoding='utf-8')
          assert '40.4.215 — MARKET COVERAGE TRUTH' in app
          assert 'atlasMarketUniverseCoverageTruth404215' in app
          assert 'rank_cap_is_not_exact_cardinality:true' in app
          assert 'Univers rang ≤ ${limit}' in app
          assert 'Univers cumulé ${limit} : ${logical.length}/${limit} actifs' not in app
          version=json.loads((root/'version.json').read_text(encoding='utf-8'))
          build=json.loads((root/'build.json').read_text(encoding='utf-8'))
          mirror=json.loads((root/'administrator-version.json').read_text(encoding='utf-8'))
          assert version['build']==build['build']==mirror['build']=='40.4.215'
          assert version['engine']['reference_build']=='38.15.11' and build['engine']=='38.15.11'
          contract=version['contracts']['market_coverage_truth_404215']
          assert contract['rank_cap_is_not_exact_cardinality'] is True
          assert contract['provider_rank_ties_preserved'] is True
          assert contract['unique_asset_id_is_row_authority'] is True
          assert contract['synthetic_rank_backfill'] is False
          audit=contract['release_audit']
          assert audit['unique_ids']==audit['core_rows']+audit['extended_rows']
          assert audit['duplicate_rank_positions']>0
          print({'build':version['build'],'core':audit['core_rows'],'extended':audit['extended_rows'],'unique_ids':audit['unique_ids'],'unique_ranks':audit['unique_ranks'],'duplicate_rank_positions':audit['duplicate_rank_positions'],'max_rank':audit['max_rank']})
          PY
          if git diff --name-only | grep '^public/agent_crypto_erith_ia/data/'; then
            echo 'STOP data files changed during 40.4.215' >&2
            exit 1
          fi
          git diff --check

      - name: Commit cumulative 40.4.215
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Aether Release'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/scripts/agent_crypto_version_truth_guard.py
          git add public/agent_crypto_erith_ia/administrator/app.js
          git add public/agent_crypto_erith_ia/administrator/js/app.js
          git add public/agent_crypto_erith_ia/administrator/index.html
          git add public/agent_crypto_erith_ia/administrator/version.json
          git add public/agent_crypto_erith_ia/administrator/administrator-version.json
          git add public/agent_crypto_erith_ia/administrator/build.json
          git add coordination/inter_ai_dialogues/agent_crypto/AGENT_CRYPTO_RELEASE_MANIFEST.md
          git add coordination/inter_ai_dialogues/agent_crypto/PROMPT_REPRISE_AETHER_AGENT_CRYPTO.md
          git add coordination/inter_ai_dialogues/agent_crypto/AGENT_CRYPTO_FIN_DE_FIL_AETHER.md
          git commit -m 'release(agent-crypto): 40.4.215 market coverage truth lock'
          git pull --rebase origin main
          python .github/scripts/agent_crypto_version_truth_guard.py --expected-build 40.4.215
          git push origin HEAD:main
