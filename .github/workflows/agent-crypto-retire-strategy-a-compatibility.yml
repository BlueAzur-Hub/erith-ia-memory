name: Agent-Crypto Retire Strategy A Compatibility

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/agent-crypto-retire-strategy-a-compatibility.yml'
      - '.github/scripts/agent_crypto_retire_strategy_a_compatibility_chain.py'

permissions:
  contents: write

concurrency:
  group: agent-crypto-retire-strategy-a-compatibility
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Synchronize
        run: git pull --ff-only origin main

      - name: Retire superseded Strategy A compatibility chain
        run: python .github/scripts/agent_crypto_retire_strategy_a_compatibility_chain.py

      - name: JavaScript syntax check
        run: |
          find public/agent_crypto_erith_ia/administrator -type f -name '*.js' -print0 \
            | xargs -0 -n1 node --check

      - name: Runtime stable registry guard
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('public/agent_crypto_erith_ia/administrator/js/runtime-modules.js')
          t=p.read_text(encoding='utf-8')
          required=['./js/strategy-a-auto-start.js','versioned_filenames: false']
          missing=[x for x in required if x not in t]
          if missing: raise SystemExit('Runtime registry guard failed: '+', '.join(missing))
          print('Runtime stable registry OK')
          PY

      - name: Runtime reference sanity
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          root=Path('public/agent_crypto_erith_ia/administrator')
          shell=(root/'runtime-shell.html').read_text(encoding='utf-8')
          missing=[]
          for ref in re.findall(r'(?:src|href)=["\'](\./[^"\']+)["\']', shell):
              clean=ref.split('?',1)[0]
              if not (root/clean[2:]).exists(): missing.append(clean)
          if missing: raise SystemExit('Missing runtime references: '+', '.join(sorted(set(missing))))
          print('Runtime references OK')
          PY

      - name: Duplicate shell DOM id guard
        run: |
          python - <<'PY'
          from pathlib import Path
          import collections,re
          shell=Path('public/agent_crypto_erith_ia/administrator/runtime-shell.html').read_text(encoding='utf-8')
          ids=re.findall(r'\bid=["\']([^"\']+)["\']',shell,re.I)
          dup=[x for x,n in collections.Counter(ids).items() if n>1]
          if dup: raise SystemExit('Duplicate shell DOM ids: '+', '.join(sorted(dup)))
          print('Shell DOM ids unique')
          PY

      - name: Market Core lock guard
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          data=json.loads(Path('public/agent_crypto_erith_ia/administrator/build.json').read_text(encoding='utf-8'))
          engine=str(data.get('engine') or data.get('market_core') or '')
          if '38.15.11' not in engine: raise SystemExit(f'Market Core lock violated: {engine!r}')
          if str(data.get('build'))!='40.6.124': raise SystemExit(f'Build drifted during cleanup: {data.get("build")!r}')
          print('Build 40.6.124 unchanged · Market Core 38.15.11 locked')
          PY

      - name: Commit cleanup and retire one-shot tooling
        run: |
          set -euo pipefail
          git config user.name 'Seven Heaven Refactor'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A public/agent_crypto_erith_ia/administrator
          git rm -f .github/workflows/agent-crypto-retire-strategy-a-compatibility.yml
          git rm -f .github/scripts/agent_crypto_retire_strategy_a_compatibility_chain.py
          git commit -m 'refactor(agent-crypto): retire Strategy A compatibility chain'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo 'Rebase conflict; refusing force-push'
              exit 1
            fi
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          echo 'Push remained contested after safe retries'
          exit 1
