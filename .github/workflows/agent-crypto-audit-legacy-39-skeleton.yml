name: Agent Crypto audit legacy 39 module skeleton

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/agent-crypto-audit-legacy-39-skeleton.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Synchronize
        run: git pull --ff-only origin main

      - name: Prove legacy 39 skeleton is detached
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json, re

          ROOT=Path('public/agent_crypto_erith_ia/administrator')
          ENTRY=Path('runtime-shell.html')
          TARGETS=[
            Path('js/core/admin-layout.js'),
            Path('js/core/event-bus.js'),
            Path('js/core/module-manager.js'),
            Path('js/modules/analysis.js'),
            Path('js/modules/analytical-memory.js'),
            Path('js/modules/decision-board.js'),
            Path('js/modules/erith.js'),
            Path('js/modules/market-memory.js'),
            Path('js/modules/market.js'),
            Path('js/modules/observability.js'),
            Path('js/modules/simulation.js'),
            Path('js/modules/system.js'),
            Path('js/modules/module-utils.js'),
          ]
          HTML_JS_RE=re.compile(r'(?:src|href)=["\'](?P<ref>[^"\']+\.js(?:\?[^"\']*)?)["\']',re.I)
          JS_PATH_RE=re.compile(r'(?P<ref>(?:\.\.?/|/)?js/[A-Za-z0-9_./-]+\.js)(?:\?[^"\'`\s)]*)?',re.I)
          REL_JS_RE=re.compile(r'(?P<ref>\.\.?/[A-Za-z0-9_./-]+\.js)(?:\?[^"\'`\s)]*)?',re.I)

          def stripq(ref): return ref.split('?',1)[0].split('#',1)[0]
          def resolve(src,ref):
            clean=stripq(ref).replace('\\','/')
            c=[]
            if clean.startswith('/'): c.append(Path(clean.lstrip('/')))
            elif clean.startswith('js/'): c.append(Path(clean))
            elif clean.startswith('./js/'):
              c.append(Path(clean[2:]))
              try:c.append(((ROOT/src).parent/clean).resolve().relative_to(ROOT.resolve()))
              except Exception:pass
            elif clean.startswith(('./','../')):
              try:c.append(((ROOT/src).parent/clean).resolve().relative_to(ROOT.resolve()))
              except Exception:pass
              if clean.startswith('./'): c.append(Path(clean[2:]))
            return {x for x in c if (ROOT/x).is_file()}
          def refs(text):
            out=[m.group('ref') for m in HTML_JS_RE.finditer(text)]
            out += [m.group('ref') for m in JS_PATH_RE.finditer(text)]
            out += [m.group('ref') for m in REL_JS_RE.finditer(text)]
            return list(dict.fromkeys(out))
          def runtime_graph():
            q=[ENTRY]; seen=set(); edges={}; texts={}
            while q:
              rel=q.pop(0)
              if rel in seen: continue
              p=ROOT/rel
              if not p.is_file() or p.suffix.lower() not in {'.html','.js'}: continue
              try:t=p.read_text(encoding='utf-8')
              except UnicodeDecodeError:continue
              seen.add(rel);texts[rel]=t
              tg=set()
              for ref in refs(t):tg.update(resolve(rel,ref))
              edges[rel]=tg
              for x in sorted(tg,key=str):
                if x.suffix.lower() in {'.html','.js'} and x not in seen:q.append(x)
            return seen,edges,texts

          build=json.loads((ROOT/'build.json').read_text(encoding='utf-8'))
          if str(build.get('build'))!='40.6.124':raise SystemExit(f"Build drifted: {build.get('build')!r}")
          core=str(build.get('market_core') or build.get('engine') or '')
          if '38.15.11' not in core:raise SystemExit(f'Market Core drifted: {core!r}')
          reachable,edges,texts=runtime_graph()
          if len(reachable)!=101:raise SystemExit(f'Runtime graph drifted: {len(reachable)}')

          all_text={}
          for p in ROOT.rglob('*'):
            if p.is_file() and p.suffix.lower() in {'.js','.html','.json'}:
              try:all_text[p.relative_to(ROOT)]=p.read_text(encoding='utf-8')
              except UnicodeDecodeError:pass

          report=[]
          target_set=set(TARGETS)
          for target in TARGETS:
            p=ROOT/target
            if not p.is_file():raise SystemExit(f'Missing target: {target}')
            inbound_runtime=sorted(str(src) for src,tg in edges.items() if target in tg and src not in target_set)
            inbound_external=[]
            exact_literal_external=[]
            for src,t in all_text.items():
              if src in target_set:continue
              found=False
              for ref in refs(t):
                if target in resolve(src,ref):
                  found=True;break
              if found:inbound_external.append(str(src))
              if str(target) in t or target.name in t:
                exact_literal_external.append(str(src))
            report.append({
              'path':str(target),
              'reachable':target in reachable,
              'inbound_runtime_external':inbound_runtime,
              'inbound_external':sorted(set(inbound_external)),
              'literal_external':sorted(set(exact_literal_external))[:50],
              'bytes':p.stat().st_size,
              'lines':len(p.read_text(encoding='utf-8').splitlines()),
            })
            if target in reachable or inbound_runtime or inbound_external:
              raise SystemExit('Legacy target still dependency-reachable: '+json.dumps(report[-1],ensure_ascii=False))

          # Search reachable code for dynamic module loading patterns that can escape static path parsing.
          dynamic=[]
          patterns=[
            re.compile(r'\bimport\s*\('),
            re.compile(r'js/modules/\s*["\'`]?\s*\$\{',re.I),
            re.compile(r'js/core/\s*["\'`]?\s*\$\{',re.I),
            re.compile(r'(?:modules|core)/\s*["\'`]?\s*\+',re.I),
            re.compile(r'new\s+URL\s*\([^\n]*(?:modules|core)/',re.I),
          ]
          for src,t in texts.items():
            for i,line in enumerate(t.splitlines(),1):
              if any(p.search(line) for p in patterns):
                dynamic.append({'source':str(src),'line':i,'text':line.strip()[:500]})
          if dynamic:
            raise SystemExit('Dynamic loader patterns require manual review: '+json.dumps(dynamic,ensure_ascii=False))

          # Confirm the module set itself identifies as static/skeleton and does not perform network/trading.
          semantic={}
          for target in TARGETS:
            t=(ROOT/target).read_text(encoding='utf-8')
            semantic[str(target)]={
              'mentions_39_skeleton': bool(re.search(r'39\.0|squelette',t,re.I)),
              'has_import_export_module_syntax': bool(re.search(r'\b(?:import|export)\b',t)),
              'contains_fetch': 'fetch(' in t,
              'contains_websocket': 'WebSocket' in t,
              'contains_order_endpoint': bool(re.search(r'order.{0,20}(?:submit|endpoint)|submit.{0,20}order',t,re.I)),
            }

          print(json.dumps({
            'build':build.get('build'),'market_core':core,'runtime_nodes':len(reachable),
            'targets_count':len(TARGETS),'targets':report,
            'dynamic_loader_hits':dynamic,
            'semantic':semantic,'mutation':'none'
          },indent=2,ensure_ascii=False))
          PY

      - name: Retire one-shot audit workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Seven Heaven Refactor'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/agent-crypto-audit-legacy-39-skeleton.yml
          git commit -m 'chore(agent-crypto): retire legacy 39 skeleton audit tooling'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo 'Rebase conflict; refusing force-push'
              exit 1
            fi
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*2))
          done
          echo 'Push remained contested after safe retries'
          exit 1
