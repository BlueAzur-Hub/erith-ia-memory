name: Agent-Crypto 40.4.272 Strategy A V2 Cost-Aware Patient Exit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/agent-crypto-404272-strategy-a-v2-cost-patient-exit.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build 40.4.272
        run: python .github/scripts/agent_crypto_404272_strategy_a_v2_cost_patient_exit.py

      - name: Publish canonical release
        run: |
          git config user.name 'Seven Heaven Release'
          git config user.email 'actions@users.noreply.github.com'
          git add public/agent_crypto_erith_ia/administrator coordination/inter_ai_dialogues/agent_crypto
          git rm .github/scripts/agent_crypto_404272_strategy_a_v2_cost_patient_exit.py
          git rm .github/workflows/agent-crypto-404272-strategy-a-v2-cost-patient-exit.yml
          git commit -m 'agent-crypto: build 40.4.272 strategy a v2 cost-aware patient-exit operator results lock'
          git push origin main

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: AGENT_CRYPTO_40_4_272_STRATEGY_A_V2_COST_AWARE_PATIENT_EXIT
          path: |
            coordination/inter_ai_dialogues/agent_crypto/AGENT_CRYPTO_40_4_272_STRATEGY_A_V2_COST_AWARE_PATIENT_EXIT.zip
            coordination/inter_ai_dialogues/agent_crypto/AGENT_CRYPTO_40_4_272_STRATEGY_A_V2_COST_AWARE_PATIENT_EXIT_SHA256.txt
            coordination/inter_ai_dialogues/agent_crypto/AGENT_CRYPTO_40_4_272_STRATEGY_A_V2_COST_AWARE_PATIENT_EXIT_REPORT.md
