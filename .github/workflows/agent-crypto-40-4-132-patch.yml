name: Agent-Crypto 40.4.132 guarded patch

on:
  push:
    branches: [main]
    paths:
      - coordination/inter_ai_dialogues/agent_crypto/patches/40.4.132.request.json

permissions:
  contents: write

concurrency:
  group: agent-crypto-40-4-132-guarded-patch
  cancel-in-progress: false

jobs:
  deploy:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout canonical main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply and validate 40.4.132
        shell: bash
        run: |
          set -euo pipefail
          python coordination/inter_ai_dialogues/agent_crypto/patches/40.4.132.py
          ROOT="public/agent_crypto_erith_ia/administrator"
          node --check "$ROOT/app.js"
          node --check "$ROOT/js/app.js"
          node --check "$ROOT/js/aether.js"
          git diff --check

      - name: Commit validated 40.4.132 atomically
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Aether Release"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/agent_crypto_erith_ia/administrator
          git add coordination/inter_ai_dialogues/agent_crypto/AGENT_CRYPTO_BUILD_40_4_132_AUTO_CANONICAL.zip
          git add coordination/inter_ai_dialogues/agent_crypto/AGENT_CRYPTO_BUILD_40_4_132_AUTO_CANONICAL.zip.sha256
          git rm coordination/inter_ai_dialogues/agent_crypto/patches/40.4.132.py
          git rm coordination/inter_ai_dialogues/agent_crypto/patches/40.4.132.request.json
          git rm .github/workflows/agent-crypto-40-4-132-patch.yml
          git commit -m "fix Agent-Crypto 40.4.132 restore canonical translated News stories"
          git pull --rebase origin main
          git push origin HEAD:main
