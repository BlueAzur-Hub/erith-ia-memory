name: Agent-Crypto 40.6.539 New Listings Identity Logos

on:
  push:
    branches: [main]
    paths:
      - "public/agent_crypto_erith_ia/administrator/js/new-listings-native-category.js"
      - "public/agent_crypto_erith_ia/administrator/index.html"
      - "public/agent_crypto_erith_ia/administrator/index-40.6.539.html"
      - "public/agent_crypto_erith_ia/administrator/build.json"
      - "public/agent_crypto_erith_ia/administrator/NEW_LISTINGS_IDENTITY_LOGOS_40.6.539.md"
      - ".github/scripts/agent_crypto_new_listings_identity_406539_guard.py"
      - ".github/workflows/agent-crypto-new-listings-identity-406539.yml"
  pull_request:
    paths:
      - "public/agent_crypto_erith_ia/administrator/js/new-listings-native-category.js"
      - "public/agent_crypto_erith_ia/administrator/index.html"
      - "public/agent_crypto_erith_ia/administrator/index-40.6.539.html"
      - "public/agent_crypto_erith_ia/administrator/build.json"
      - "public/agent_crypto_erith_ia/administrator/NEW_LISTINGS_IDENTITY_LOGOS_40.6.539.md"
      - ".github/scripts/agent_crypto_new_listings_identity_406539_guard.py"
      - ".github/workflows/agent-crypto-new-listings-identity-406539.yml"

permissions:
  contents: read

jobs:
  guard-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify bounded identity enrichment
        run: |
          python .github/scripts/agent_crypto_new_listings_identity_406539_guard.py
          node --check public/agent_crypto_erith_ia/administrator/js/new-listings-native-category.js
          python .github/scripts/agent_crypto_version_truth_guard_compat.py

      - name: Build compact patch ZIP
        id: patch
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile, os
          files=[
            Path("public/agent_crypto_erith_ia/administrator/js/new-listings-native-category.js"),
            Path("public/agent_crypto_erith_ia/administrator/index.html"),
            Path("public/agent_crypto_erith_ia/administrator/index-40.6.539.html"),
            Path("public/agent_crypto_erith_ia/administrator/build.json"),
            Path("public/agent_crypto_erith_ia/administrator/NEW_LISTINGS_IDENTITY_LOGOS_40.6.539.md"),
            Path(".github/scripts/agent_crypto_new_listings_identity_406539_guard.py"),
            Path(".github/workflows/agent-crypto-new-listings-identity-406539.yml"),
          ]
          out=Path("dist/AGENT_CRYPTO_ADMINISTRATOR_40.6.539_NEW_LISTINGS_IDENTITY_LOGOS_PATCH.zip")
          out.parent.mkdir(parents=True,exist_ok=True)
          with zipfile.ZipFile(out,"w",zipfile.ZIP_DEFLATED,compresslevel=9) as z:
              for p in files:
                  if not p.exists(): raise SystemExit(f"Missing patch file: {p}")
                  z.write(p,p)
          with open(os.environ["GITHUB_OUTPUT"],"a",encoding="utf-8") as fh:
              print(f"zip={out.as_posix()}",file=fh)
          print(out,out.stat().st_size,"files",len(files))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: AGENT_CRYPTO_ADMINISTRATOR_40.6.539_NEW_LISTINGS_IDENTITY_LOGOS_PATCH
          path: ${{ steps.patch.outputs.zip }}
          retention-days: 90
