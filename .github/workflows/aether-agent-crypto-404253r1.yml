name: Aether Agent-Crypto 40.4.253R1 Technical Reading Label Hotfix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/aether-agent-crypto-404253r1.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "Aether Release Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Patch Technical Reading project label owner
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          css_path = Path('public/agent_crypto_erith_ia/administrator/admin-visual-assets.css')
          css = css_path.read_text(encoding='utf-8')
          anchor = '  border-radius:999px!important;\n}\n\nbody.atlas-administrator-mirror #detailPanel .detail-project-visual.admin-tech-r3::after,'
          replacement = '  border-radius:999px!important;\n  /* 40.4.253R1: neutralize the obsolete 40.2.84 vertical drift after restoring the Classic 136px host. */\n  transform:none!important;\n}\n\nbody.atlas-administrator-mirror #detailPanel .detail-project-visual.admin-tech-r3::after,'
          owner = 'body.atlas-administrator-mirror #detailPanel .detail-project-visual.admin-tech-r3 > span{'
          owner_pos = css.rfind(owner)
          if owner_pos < 0:
              raise SystemExit('FAIL: canonical Technical Reading label owner not found')
          tail = css[owner_pos:]
          if anchor not in tail:
              raise SystemExit('FAIL: canonical label anchor not found after owner')
          tail = tail.replace(anchor, replacement, 1)
          css_path.write_text(css[:owner_pos] + tail, encoding='utf-8')

          index_path = Path('public/agent_crypto_erith_ia/administrator/index.html')
          index = index_path.read_text(encoding='utf-8')
          old = './admin-visual-assets.css?v=administrator-build-40.4.253'
          new = './admin-visual-assets.css?v=administrator-build-40.4.253R1'
          if old not in index and new not in index:
              raise SystemExit('FAIL: Technical Reading CSS cache token not found')
          if old in index:
              index = index.replace(old, new, 1)
          index_path.write_text(index, encoding='utf-8')
          PY

      - name: Static gates
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          css = Path('public/agent_crypto_erith_ia/administrator/admin-visual-assets.css').read_text(encoding='utf-8')
          index = Path('public/agent_crypto_erith_ia/administrator/index.html').read_text(encoding='utf-8')
          build = Path('public/agent_crypto_erith_ia/administrator/build.json').read_text(encoding='utf-8')
          owner = css[css.rfind('body.atlas-administrator-mirror #detailPanel .detail-project-visual.admin-tech-r3 > span{'):]
          assert 'top:156px!important;' in owner
          assert 'transform:none!important;' in owner
          assert 'height:136px!important;' in css
          assert 'flex:0 0 136px!important;' in css
          assert 'overflow:visible!important;' in css
          assert 'object-fit:cover!important;' in css
          assert './admin-visual-assets.css?v=administrator-build-40.4.253R1' in index
          assert '"build": "40.4.253"' in build
          assert '"engine": "38.15.11"' in build
          print('PASS: Technical Reading label drift fixed; Classic 136px host and Market Core preserved.')
          PY

      - name: Commit release
        shell: bash
        run: |
          git add public/agent_crypto_erith_ia/administrator/admin-visual-assets.css public/agent_crypto_erith_ia/administrator/index.html
          git commit -m "agent-crypto: hotfix 40.4.253R1 restore Technical Reading label breathing zone"
          for try in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && break
            test "$try" = 3 && exit 1
            sleep 2
          done

      - name: Remove one-shot driver
        shell: bash
        run: |
          rm .github/workflows/aether-agent-crypto-404253r1.yml
          git add .github/workflows/aether-agent-crypto-404253r1.yml
          git commit -m "chore: disarm Aether Technical Reading label hotfix 40.4.253R1"
          for try in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && break
            test "$try" = 3 && exit 1
            sleep 2
          done
