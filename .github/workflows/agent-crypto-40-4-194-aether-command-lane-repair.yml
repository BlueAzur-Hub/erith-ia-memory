name: Agent-Crypto 40.4.194 Aether Command Lane Repair

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/agent-crypto-40-4-194-aether-command-lane-repair.yml"

permissions:
  contents: write

concurrency:
  group: agent-crypto-40-4-194-aether-command-lane-repair-${{ github.ref }}
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repair Aether / command lane and bump build
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          root = Path("public/agent_crypto_erith_ia/administrator")
          css_path = root / "parallel-markets.css"
          css = css_path.read_text(encoding="utf-8")

          bad = 'html[data-cyclic-market-domain="metals"] #atlasAetherRibbon4084,html[data-cyclic-market-domain="indices"] #atlasAetherRibbon4084,html[data-cyclic-market-domain="energy"] #atlasAetherRibbon4084,html[data-cyclic-market-domain="cross-market"] #atlasAetherRibbon4084{display:none!important}'
          if bad not in css:
              raise SystemExit("40.4.185 generalized Aether mask not found; refusing blind patch")

          css = css.replace(
              bad,
              '/* 40.4.194 — AETHER / COMMAND LANE REPAIR.\n'
              '   The 40.4.182 contract remains authoritative: Aether is masked only on Metals,\n'
              '   where native command controls are forced visible. Indices, Energy and Cross\n'
              '   keep the normal 270 s command/Aether shared-lane cycle, preventing a blank row. */'
          )
          css_path.write_text(css, encoding="utf-8")

          files = [
              root / "index.html",
              root / "app.js",
              root / "js" / "app.js",
              root / "js" / "market-stack.js",
              root / "js" / "parallel-markets.js",
              root / "version.json",
              root / "administrator-version.json",
          ]
          for path in files:
              text = path.read_text(encoding="utf-8")
              if "40.4.193" not in text:
                  raise SystemExit(f"expected 40.4.193 marker missing in {path}")
              path.write_text(text.replace("40.4.193", "40.4.194"), encoding="utf-8")

          # Release wording is informational only, but make the repaired contract explicit.
          index = root / "index.html"
          text = index.read_text(encoding="utf-8")
          text = text.replace(
              'MULTI-MARKET DEPTH HARMONIZATION LOCK · SHARED SHELL · DOMAIN OWNERSHIP',
              'AETHER COMMAND LANE RESTORE · METALS-ONLY FEED MASK · MULTI-MARKET DEPTH LOCK'
          )
          index.write_text(text, encoding="utf-8")

          # Static validation of the exact regression.
          css = css_path.read_text(encoding="utf-8")
          assert bad not in css
          assert 'html[data-cyclic-market-domain="metals"] body #atlasAetherRibbon4084' in css
          assert 'html[data-cyclic-market-domain="indices"] #atlasAetherRibbon4084' not in css
          assert 'html[data-cyclic-market-domain="energy"] #atlasAetherRibbon4084' not in css
          assert 'html[data-cyclic-market-domain="cross-market"] #atlasAetherRibbon4084' not in css
          assert 'id="atlasAetherRibbon4084"' in index.read_text(encoding="utf-8")
          assert '40.4.194' in index.read_text(encoding="utf-8")
          print("40.4.194 UI lane repair validated")
          PY

      - name: Commit repaired build
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            public/agent_crypto_erith_ia/administrator/index.html \
            public/agent_crypto_erith_ia/administrator/app.js \
            public/agent_crypto_erith_ia/administrator/js/app.js \
            public/agent_crypto_erith_ia/administrator/js/market-stack.js \
            public/agent_crypto_erith_ia/administrator/js/parallel-markets.js \
            public/agent_crypto_erith_ia/administrator/parallel-markets.css \
            public/agent_crypto_erith_ia/administrator/version.json \
            public/agent_crypto_erith_ia/administrator/administrator-version.json
          git rm -f .github/workflows/agent-crypto-40-4-194-aether-command-lane-repair.yml
          git commit -m "release Agent-Crypto 40.4.194 restore Aether command lane"
          git pull --rebase origin main
          git push origin HEAD:main
