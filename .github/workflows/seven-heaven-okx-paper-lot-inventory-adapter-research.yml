name: Seven Heaven OKX PAPER Lot and Inventory Adapter Research

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/seven-heaven-okx-paper-lot-inventory-adapter-research.yml'
      - 'coordination/inter_ai_dialogues/agent_crypto/research/strategy_profiles/SEVEN_HEAVEN_OKX_SPOT_PAPER_LOT_MINIMUM_INVENTORY_ADAPTER_2026_11_13.cjs'
      - 'coordination/inter_ai_dialogues/agent_crypto/research/strategy_profiles/SEVEN_HEAVEN_OKX_SPOT_PAPER_LOT_MINIMUM_INVENTORY_ADAPTER_TESTS_2026_11_13.cjs'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: seven-heaven-okx-paper-precision-lab-2026-11-13
  cancel-in-progress: false

jobs:
  read-only-model-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out public research and unchanged Administrator source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up isolated Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate existing V5 regression suite
        run: node public/agent_crypto_erith_ia/administrator/tests/test-market-microscope-paper-backtest-v5.cjs
      - name: Validate existing V6 regression suite
        run: node public/agent_crypto_erith_ia/administrator/tests/test-market-microscope-orderbook-paper-v6.cjs
      - name: Validate research adapter and record exact-lot fixed-point evidence
        run: node coordination/inter_ai_dialogues/agent_crypto/research/strategy_profiles/SEVEN_HEAVEN_OKX_SPOT_PAPER_LOT_MINIMUM_INVENTORY_ADAPTER_TESTS_2026_11_13.cjs
      - name: Preserve traceable test evidence
        uses: actions/upload-artifact@v4
        with:
          name: seven-heaven-okx-paper-lot-inventory-adapter-proof
          path: 'coordination/inter_ai_dialogues/agent_crypto/research/strategy_profiles/seven_heaven_okx_spot_paper_adapter_evidence/'
          if-no-files-found: error
          retention-days: 90
      - name: Commit shared research proof ONLY, never the production engines
        run: |
          set -euo pipefail
          folder='coordination/inter_ai_dialogues/agent_crypto/research/strategy_profiles/seven_heaven_okx_spot_paper_adapter_evidence'
          git add -- "$folder"
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'All immutable proof files already shared'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'research: archive isolated OKX PAPER quantity and inventory adapter results'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
