name: Agent-Crypto 40.6.492 Validate Package
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Validate syntax and OKX orderbook contracts
        run: |
          set -euo pipefail
          ROOT="public/agent_crypto_erith_ia/administrator"
          node --check "$ROOT/js/strategy-a-execution-cost-truth.js"
          node --check "$ROOT/js/post-boot-runtime-loader.js"
          python .github/scripts/agent_crypto_okx_orderbook_depth_guard_406492.py
          python .github/scripts/agent_crypto_version_truth_guard_compat.py
      - name: Verify protected cold archive is not patched
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          git fetch origin main
          git diff --exit-code origin/main...HEAD -- public/agent_crypto_erith_ia/data/oracle_evidence
      - name: Build delivery ZIP
        run: |
          set -euo pipefail
          ROOT="public/agent_crypto_erith_ia/administrator"
          ZIP="AGENT_CRYPTO_OKX_ORDERBOOK_DEPTH_TRUTH_40.6.492.zip"
          zip -j "$ZIP"             "$ROOT/index-40.6.492.html"             "$ROOT/build.json"             "$ROOT/architecture/private-backend-sources.json"             "$ROOT/js/post-boot-runtime-loader.js"             "$ROOT/js/strategy-a-execution-cost-truth.js"             "$ROOT/OKX_ORDERBOOK_DEPTH_TRUTH_40.6.492.md"             "$ROOT/PRIVATE_BACKEND_V1.4.3_OKX_ORDERBOOK_DEPTH_REQUIREMENT.md"             "$ROOT/HANDOFF_FINAL_40.6.492.md"             "$ROOT/PATCH_MANIFEST_40.6.492.txt"
          sha256sum "$ZIP" > "$ZIP.sha256"
          unzip -t "$ZIP"
      - uses: actions/upload-artifact@v4
        with:
          name: agent-crypto-40.6.492-okx-orderbook-depth
          path: |
            AGENT_CRYPTO_OKX_ORDERBOOK_DEPTH_TRUTH_40.6.492.zip
            AGENT_CRYPTO_OKX_ORDERBOOK_DEPTH_TRUTH_40.6.492.zip.sha256
          if-no-files-found: error
