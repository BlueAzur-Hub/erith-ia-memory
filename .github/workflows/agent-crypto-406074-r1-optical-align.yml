name: Agent-Crypto 40.6.74 R1 Aether Optical Alignment

on:
  push:
    paths:
      - '.github/workflows/agent-crypto-406074-r1-optical-align.yml'

permissions:
  contents: write

jobs:
  align:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fold R1 optical alignment into canonical V2 owner
        shell: python
        run: |
          from pathlib import Path

          path = Path('public/agent_crypto_erith_ia/administrator/aether-v2-406074.css')
          text = path.read_text(encoding='utf-8')
          marker = '40.6.74 R1 — OPTICAL TEXT ALIGNMENT / C5 LESSON RESTORED'
          if marker in text:
              raise SystemExit('R1 optical alignment already present')

          block = r'''
          /* ==========================================================================
             40.6.74 R1 — OPTICAL TEXT ALIGNMENT / C5 LESSON RESTORED

             Firefox field validation showed that canonical consolidation kept the enlarged
             V2 capsule geometry but accidentally dropped C5's vertical breathing rule.
             Result: live facts cling to the top edge while the painted capsules leave an
             obvious empty lower half. Restore the validated optical centering only for
             non-streaming cells. Market and Recent Events keep their dense top flow.
             Presentation only: no data, geometry, storage, network or Market Core owner.
             ========================================================================== */
          html[data-aether-backplate-v2-406074="ready"] .aether46-card {
            box-sizing:border-box !important;
          }

          html[data-aether-backplate-v2-406074="ready"] .aether46-card[data-aether-card-406046="system"],
          html[data-aether-backplate-v2-406074="ready"] .aether46-card[data-aether-card-406046="sources"],
          html[data-aether-backplate-v2-406074="ready"] .aether46-card[data-aether-card-406046="atlas"],
          html[data-aether-backplate-v2-406074="ready"] .aether46-card[data-aether-card-406046="convergence"],
          html[data-aether-backplate-v2-406074="ready"] .aether46-card[data-aether-card-406046="divergence"],
          html[data-aether-backplate-v2-406074="ready"] .aether46-card[data-aether-card-406046="oracle"],
          html[data-aether-backplate-v2-406074="ready"] .aether46-card[data-aether-card-406046="weather"] {
            display:flex !important;
            flex-direction:column !important;
            justify-content:center !important;
          }

          html[data-aether-backplate-v2-406074="ready"] .aether46-card[data-aether-card-406046="system"] {
            padding:1.05% 1.05% .92% 5.15% !important;
          }
          html[data-aether-backplate-v2-406074="ready"] .aether46-card[data-aether-card-406046="sources"] {
            padding:1.06% 1.00% .94% 5.00% !important;
          }
          html[data-aether-backplate-v2-406074="ready"] .aether46-card[data-aether-card-406046="atlas"] {
            padding:1.05% 1.00% .92% 5.05% !important;
          }
          html[data-aether-backplate-v2-406074="ready"] .aether46-card[data-aether-card-406046="convergence"] {
            padding:1.02% 1.12% .90% 5.80% !important;
          }
          html[data-aether-backplate-v2-406074="ready"] .aether46-card[data-aether-card-406046="divergence"] {
            padding:1.04% 1.05% .90% 5.20% !important;
          }
          html[data-aether-backplate-v2-406074="ready"] .aether46-card[data-aether-card-406046="oracle"] {
            padding:.92% 1.00% .82% 5.30% !important;
          }
          html[data-aether-backplate-v2-406074="ready"] .aether46-card[data-aether-card-406046="weather"] {
            padding:.92% 1.00% .82% 5.20% !important;
          }

          html[data-aether-backplate-v2-406074="ready"] .aether46-card header {
            gap:clamp(4px,.34cqw,7px) !important;
            margin:0 0 clamp(4px,.36cqw,7px) !important;
          }
          html[data-aether-backplate-v2-406074="ready"] .aether46-card footer {
            margin-top:clamp(3px,.34cqw,6px) !important;
          }
          html[data-aether-backplate-v2-406074="ready"] .aether46-system-metrics {
            margin:.04cqw 0 .08cqw !important;
          }
          html[data-aether-backplate-v2-406074="ready"] .aether46-source-metrics {
            margin:.04cqw 0 .05cqw !important;
          }
          html[data-aether-backplate-v2-406074="ready"] .aether46-atlas-main {
            margin-top:.02cqw !important;
          }
          html[data-aether-backplate-v2-406074="ready"] .aether46-atlas-sub {
            margin-top:.44cqw !important;
          }
          html[data-aether-backplate-v2-406074="ready"] .aether46-convergence-main {
            margin-top:.02cqw !important;
          }
          html[data-aether-backplate-v2-406074="ready"] .aether46-card[data-aether-card-406046="divergence"] p {
            margin:.02cqw 0 0 !important;
          }
          '''

          path.write_text(text.rstrip() + '\n\n' + block.strip() + '\n', encoding='utf-8')

          final = path.read_text(encoding='utf-8')
          for token in (
              marker,
              'justify-content:center !important;',
              'data-aether-card-406046="oracle"',
              'data-aether-card-406046="weather"',
          ):
              if token not in final:
                  raise SystemExit(f'post-write check failed: {token}')

      - name: Self-remove one-shot workflow
        run: git rm .github/workflows/agent-crypto-406074-r1-optical-align.yml

      - name: Commit canonical R1 alignment
        run: |
          git config user.name "BlueAzur-Hub"
          git config user.email "Blue.Azur@protonmail.com"
          git add public/agent_crypto_erith_ia/administrator/aether-v2-406074.css
          git commit -m "fix(agent-crypto): restore Aether V2 optical alignment in 40.6.74 R1"
          git push origin HEAD:main
