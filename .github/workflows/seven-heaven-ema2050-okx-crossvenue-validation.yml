name: Seven Heaven - Independent OKX Bitcoin trend validation
on:
  pull_request:
    paths:
      - '.github/workflows/seven-heaven-ema2050-okx-crossvenue-validation.yml'
      - 'coordination/inter_ai_dialogues/agent_crypto/research/strategy_profiles/SEVEN_HEAVEN_EMA2050_INDEPENDENT_OKX_VALIDATION_2026_11_10.py'
permissions:
  contents: read
jobs:
  public-readonly-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Check syntax and validate on two historical price sources
        run: |
          set -euo pipefail
          SCRIPT=coordination/inter_ai_dialogues/agent_crypto/research/strategy_profiles/SEVEN_HEAVEN_EMA2050_INDEPENDENT_OKX_VALIDATION_2026_11_10.py
          python3 -m py_compile "$SCRIPT"
          python3 "$SCRIPT"
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/seven_independent_okx_ema_validation.json'))
          assert x['status']=='VERIFIED_NO_LIVE_ORDERS'
          assert x['meta']['instrument']=='BTC-USDC' and x['meta']['bar']=='1Dutc'
          assert x['meta']['closed_candles']>=446
          assert len(x['results'])==15
          for row in x['results']:
            assert row['trades']==row['wins']+row['losses']
            assert row['max_drawdown_pct']<=0
            assert 0<=row['exposure_pct']<=100
            assert row['days'] in [183,40,223]
          assert x['methodology']['blind_future_out_of_sample'] is False
          print('SEVEN_INDEPENDENT_OKX_VALIDATION_ASSERTIONS_PASSED')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: seven-heaven-btc-okx-ema-external-validation-evidence
          path: /tmp/seven_independent_okx_ema_validation.json
          retention-days: 60
