name: Seven Heaven - verify official OKX historical candlestick archive dates

on:
  pull_request:
    paths:
      - '.github/workflows/seven-heaven-okx-official-bulk-candlestick-audit.yml'
      - 'coordination/inter_ai_dialogues/agent_crypto/research/strategy_profiles/SEVEN_HEAVEN_OKX_BTC_USDC_OFFICIAL_BULK_ARCHIVE_DISCOVERY_2026_11_10.mjs'
      - 'coordination/inter_ai_dialogues/agent_crypto/research/strategy_profiles/SEVEN_HEAVEN_OKX_BTC_USDC_ARCHIVE_UTC_NORMALIZER.py'
      - 'coordination/inter_ai_dialogues/agent_crypto/research/strategy_profiles/SEVEN_HEAVEN_OKX_BTC_USDC_ARCHIVE_UTC_VERIFIED_SAMPLE_RESULTS_2026_11_10.json'
      - 'coordination/inter_ai_dialogues/agent_crypto/research/strategy_profiles/SEVEN_HEAVEN_OKX_BTC_USDC_ARCHIVE_NORMALIZATION_REPAIR_REPORT_2026_11_10.md'
      - 'coordination/inter_ai_dialogues/agent_crypto/research/strategy_profiles/SEVEN_HEAVEN_OKX_BTC_USDC_OFFICIAL_BULK_ARCHIVE_FINDINGS_2026_11_10.md'

permissions:
  contents: read

jobs:
  inspect-public-archive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inspect official OKX public bulk-history availability
        run: |
          set -euo pipefail
          script=coordination/inter_ai_dialogues/agent_crypto/research/strategy_profiles/SEVEN_HEAVEN_OKX_BTC_USDC_OFFICIAL_BULK_ARCHIVE_DISCOVERY_2026_11_10.mjs
          node --check "$script"
          node "$script"
      - name: Audit research-only responses and date coverage
        run: |
          node - <<'NODE'
          const fs=require('node:fs'),assert=require('node:assert/strict');
          const r=JSON.parse(fs.readFileSync('/tmp/seven_okx_bulk_archive_discovery.json','utf8'));
          assert.equal(r.ordersEnabled,false);
          assert.equal(r.readOnly,true);
          assert.equal(r.checkedInstrument,'BTC-USDC');
          assert.equal(r.module,'2');
          assert.equal(r.files.length,8);
          assert.deepEqual(r.files.map(x=>x.date),['2022-06-15','2022-06-16','2023-10-15','2023-10-16','2024-06-15','2024-06-16','2025-02-15','2025-02-16']);
          assert(r.files.every(x=>x.zipVerified===true),'Official ZIP missing or invalid; cannot normalize');
          console.log('PUBLIC_BULK_DISCOVERY_AUDITED');
          NODE
      - name: Inspect downloaded historical OHLC ZIP contents and coverage
        run: |
          python - <<'PY'
          import glob, csv, collections, datetime, io, json, os, zipfile
          facts=[]
          for path in sorted(glob.glob('/tmp/seven_okx_sample_*.zip')):
              date=os.path.basename(path).removeprefix('seven_okx_sample_').removesuffix('.zip')
              with zipfile.ZipFile(path) as archive:
                  files=[]
                  for name in archive.namelist()[:5]:
                      info=archive.getinfo(name)
                      if info.file_size>3_000_000:
                          raise ValueError('Uncompressed file exceeds sample limit')
                      content=archive.read(name).decode('utf-8-sig',errors='replace')
                      lines=list(csv.DictReader(io.StringIO(content)))
                      times=[int(x['open_time']) for x in lines]
                      counted=collections.Counter(times)
                      uniqueRows={}
                      conflicting=0
                      for row in lines:
                          stamp=int(row['open_time'])
                          key=tuple(row.get(v) for v in ['open','high','low','close','vol'])
                          if stamp in uniqueRows and uniqueRows[stamp]!=key: conflicting+=1
                          uniqueRows[stamp]=key
                      flags=dict(collections.Counter(x['confirm'] for x in lines))
                      badOHLC=0
                      for row in lines:
                          o,h,l,c=(float(row[x]) for x in ['open','high','low','close'])
                          if not (0<l<=min(o,c)<=max(o,c)<=h):badOHLC+=1
                      span=(max(times)-min(times))//60000+1 if times else 0
                      files.append({
                          'filename':name,'rows':len(lines),'uniqueTimestamps':len(counted),
                          'duplicateRows':len(lines)-len(counted),'conflictingDuplicateRows':conflicting,
                          'missingMinutesInTimeSpan':span-len(counted),
                          'confirmCounts':flags,'badOHLC':badOHLC,
                          'minTimestampUTC':datetime.datetime.fromtimestamp(min(times)/1000,datetime.timezone.utc).isoformat() if times else None,
                          'maxTimestampUTC':datetime.datetime.fromtimestamp(max(times)/1000,datetime.timezone.utc).isoformat() if times else None,
                          'firstCandle':{k:lines[0].get(k) for k in ['open','high','low','close','vol','confirm']} if lines else None
                      })
                  facts.append({'date':date,'files':files})
          print('OFFICIAL_ARCHIVE_SAMPLE_AUDIT '+json.dumps(facts,ensure_ascii=False))
          with open('/tmp/seven_okx_sample_structure.json','w') as f:
              json.dump(facts,f,indent=2,ensure_ascii=False)
          PY
      - name: Test canonicalizer on synthetic duplicates, conflicts and UTC day boundaries
        run: |
          set -euo pipefail
          python3 coordination/inter_ai_dialogues/agent_crypto/research/strategy_profiles/SEVEN_HEAVEN_OKX_BTC_USDC_ARCHIVE_UTC_NORMALIZER.py --self-test
      - name: Normalize real OKX archive minute candles into fail-closed UTC days
        run: |
          set -euo pipefail
          # The download probe uses a temporary prefix. Restore the official
          # ZIP basename so the canonicalizer can match its inner CSV securely.
          for archive in /tmp/seven_okx_sample_*.zip; do
            date=${archive##*/seven_okx_sample_}
            cp "$archive" "/tmp/BTC-USDC-candlesticks-$date"
          done
          python3 coordination/inter_ai_dialogues/agent_crypto/research/strategy_profiles/SEVEN_HEAVEN_OKX_BTC_USDC_ARCHIVE_UTC_NORMALIZER.py \
            /tmp/BTC-USDC-candlesticks-*.zip \
            --output /tmp/seven_okx_normalized_utc_evidence.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/seven_okx_normalized_utc_evidence.json'))
          assert d['orders_enabled'] is False
          assert d['summary']['files_checked']==8
          assert d['summary']['duplicate_minutes_removed'] >= 1440
          for day in d['utc_days']:
              assert day['used_for_backtest'] is False, 'Normalizer does not execute trading backtests'
              assert day['eligible_as_backtest_input'] == (day['status']=='VALIDATED')
              if day['status'] != 'VALIDATED':
                  assert 'ohlcv' not in day, 'Cannot publish unconfirmed OHLC as validated'
          from pathlib import Path
          ref=Path('coordination/inter_ai_dialogues/agent_crypto/research/strategy_profiles/SEVEN_HEAVEN_OKX_BTC_USDC_ARCHIVE_UTC_VERIFIED_SAMPLE_RESULTS_2026_11_10.json')
          pinned=json.loads(ref.read_text(encoding='utf-8'))
          assert pinned['summary']==d['summary'], 'Summary differs from pinned research evidence'
          assert pinned['research_readiness']==d['research_readiness'], 'Readiness status differs from pinned evidence'
          assert d['research_readiness']['ready_for_two_year_comparison'] is False
          assert d['research_readiness']['longest_contiguous_confirmed_utc_days']==1
          assert pinned['utc_day_evidence']==d['utc_days'], 'Live archive replay differs from pinned UTC daily evidence'
          latest=json.load(open('/tmp/seven_okx_bulk_archive_discovery.json'))
          actual_hashes={x['date']:x['zipSha256'] for x in latest['files']}
          for f in pinned['archives']:
              assert f['date'] in actual_hashes
              assert f['sha256']==actual_hashes[f['date']], 'Historical source ZIP changed; review before use'
          print('CANONICAL_UTC_OKX_VALIDATION_PASSED',d['summary'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: seven-heaven-okx-btc-usdc-bulk-archive-discovery
          path: |
            /tmp/seven_okx_bulk_archive_discovery.json
            /tmp/seven_okx_sample_structure.json
            /tmp/seven_okx_normalized_utc_evidence.json
          retention-days: 30
          if-no-files-found: error
