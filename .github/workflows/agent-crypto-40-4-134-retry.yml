name: Agent-Crypto 40.4.134 guarded retry

on:
  push:
    branches: [main]
    paths:
      - coordination/inter_ai_dialogues/agent_crypto/patches/40.4.134.retry.json

permissions:
  contents: write

concurrency:
  group: agent-crypto-40-4-134-guarded-retry
  cancel-in-progress: false

jobs:
  deploy:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout canonical main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply bounded surgery with corrected footer guard
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from datetime import datetime, timezone
          import hashlib, json, re, zipfile

          R=Path('public/agent_crypto_erith_ia/administrator')
          Q=Path('coordination/inter_ai_dialogues/agent_crypto/patches/40.4.134.retry.json')
          B='40.4.134'; P='40.4.133'
          REL='AETHER DETAIL DISCOVERABILITY · ADMIN ACTIVE-ROLE NO-LOGOUT LOCK'
          STATUS='candidate_aether_detail_admin_role_operator_validation_required'
          def sha(p): return hashlib.sha256(p.read_bytes()).hexdigest()
          def once(text, old, new, label):
              n=text.count(old)
              if n!=1: raise SystemExit(f'STOP {label}: {n}')
              return text.replace(old,new,1)
          def regex_once(text, pat, repl, label):
              out,n=re.subn(pat,repl,text,count=1)
              if n!=1: raise SystemExit(f'STOP {label}: {n}')
              return out

          q=json.loads(Q.read_text(encoding='utf-8'))
          v=json.loads((R/'version.json').read_text(encoding='utf-8'))
          if q.get('build')!=B or q.get('parent_build')!=P or v.get('build')!=P:
              raise SystemExit('STOP parent/request mismatch')
          if str((v.get('engine') or {}).get('reference_build'))!='38.15.11':
              raise SystemExit('STOP Market Core 38.15.11 identity')

          root=R/'app.js'; admin=R/'js/app.js'; aether=R/'js/aether.js'; index=R/'index.html'
          if root.read_text(encoding='utf-8').count('const ATLAS_BUILD = "40.4.133";')!=1: raise SystemExit('STOP root build')
          if admin.read_text(encoding='utf-8').count('  const ADMIN_BUILD = "40.4.133";')!=1: raise SystemExit('STOP admin build')
          at=aether.read_text(encoding='utf-8'); ix=index.read_text(encoding='utf-8')
          timers_before=at.count('setInterval(')
          for needle,label in [('function aetherWeatherForecast40133(payload)','weather owner'),('forecast_days=${AETHER_WEATHER_4086.days}','weather 5d'),('id="atlasAetherSystem4086"','compact band'),('id="atlasAetherStatusToggle4084"','detail toggle')]:
              hay=at if label.startswith('weather') else ix
              if needle not in hay: raise SystemExit('STOP '+label)

          at=once(at,'  Build: 40.4.133','  Build: 40.4.134','aether header')
          at=regex_once(at,r'  Revision: 40\.4\.133[^\n]*','  Revision: 40.4.134 discoverability lock. Existing Aether Attention, Maintenon five-day weather and Atlas AUTO owners preserved; the visible system band opens the existing detailed panel.','aether revision')
          marker='    window.addEventListener("erith:operator-priority-release",()=>{renderAether4084();renderAetherSystem4086();renderAetherVeille4087();},{passive:true});'
          insert='''    const quickPanel=document.getElementById("atlasAetherSystem4086");
              if(quickPanel&&quickPanel.dataset.aetherDetailBound404134!=="1"){
                quickPanel.dataset.aetherDetailBound404134="1";
                quickPanel.setAttribute("role","button");
                quickPanel.setAttribute("tabindex","0");
                quickPanel.setAttribute("aria-label","Ouvrir Aether : météo Maintenon 5 jours, risque météo, système et Atlas AUTO");
                quickPanel.setAttribute("title","Ouvrir Aether · météo 5 j · risque · système · Atlas AUTO");
                quickPanel.style.cursor="pointer";
                const openDetail404134=()=>aetherPanelSet4084(true);
                quickPanel.addEventListener("click",openDetail404134);
                quickPanel.addEventListener("keydown",event=>{if(event.key==="Enter"||event.key===" "){event.preventDefault();openDetail404134();}});
              }
          '''
          at=once(at,marker,insert+marker,'Aether detail opener')
          at=once(at,'    build:"40.4.133",','    build:"40.4.134",','Aether API build')
          aether.write_text(at,encoding='utf-8')

          guard='''  <script data-atlas-admin-active-role-lock-404134="true">
            /* 40.4.134 — repeated click on the already-active Administration role is idempotent. */
            (() => {
              const keepActive = event => {
                if (event?.isTrusted !== true) return;
                const target = event.target instanceof Element ? event.target.closest("#btnAdminAccountToggle") : null;
                if (!target) return;
                const root = document.documentElement;
                if (root.dataset.atlasRole !== "administrator" || root.dataset.atlasView !== "advanced") return;
                event.preventDefault();
                event.stopImmediatePropagation();
                root.dataset.adminActiveRoleLock404134 = "stay-advanced";
                target.setAttribute("aria-pressed","true");
              };
              document.addEventListener("click", keepActive, true);
            })();
          </script>
          '''
          ix=once(ix,'  <link rel="stylesheet" href="./style.css" />',guard+'  <link rel="stylesheet" href="./style.css" />','Admin active-role guard')
          for pat,repl,label in [
            (r'(<meta name="atlas-build" content=")[^"]+("\s*/>)',rf'\g<1>{B}\2','meta atlas'),
            (r'(<meta name="administrator-build" content=")[^"]+("\s*/>)',rf'\g<1>{B}\2','meta admin'),
            (r'(<meta name="administrator-release" content=")[^"]+("\s*/>)',rf'\g<1>{REL}\2','meta release'),
            (r'(<meta name="atlas-asset-token" content="market-core-v2\.0-alpha-build-)[^"]+("\s*/>)',rf'\g<1>{B}\2','meta token'),
            (r'(<title>Agent-Crypto @erith\.IA — Build )[^<]+( · Administrator</title>)',rf'\g<1>{B}\2','title'),
            (r'(data-administrator-build=")[^"]+(")',rf'\g<1>{B}\2','data build'),
            (r'(aria-label="Version Agent-Crypto installée : Build )[^"]+(, mode Administrator")',rf'\g<1>{B}\2','aria build'),
            (r'(<span id="atlasVersionControlText">Build )[^<]+(</span>)',rf'\g<1>{B}\2','build badge'),
            (r'(<span id="atlasV2ReleaseBadge">Agent-Crypto @erith\.IA · Build )[^<]+( · Administrator</span>)',rf'\g<1>{B}\2','release badge'),
            (r'(<span id="footerRelease">Agent-Crypto @erith\.IA · Market Core · Build )[^<]+( · Version : Parker Lewis Can\'t Lose</span>)',rf'\g<1>{B}\2','footer build')
          ]: ix=regex_once(ix,pat,repl,label)
          ix=ix.replace('market-core-v2.0-alpha-build-40.4.133',f'market-core-v2.0-alpha-build-{B}')
          ix=ix.replace('administrator-build-40.4.133',f'administrator-build-{B}')
          index.write_text(ix,encoding='utf-8')

          rt=root.read_text(encoding='utf-8'); root.write_text(once(rt,'const ATLAS_BUILD = "40.4.133";','const ATLAS_BUILD = "40.4.134";','root build bump'),encoding='utf-8')
          jt=admin.read_text(encoding='utf-8'); admin.write_text(once(jt,'  const ADMIN_BUILD = "40.4.133";','  const ADMIN_BUILD = "40.4.134";','admin build bump'),encoding='utf-8')

          note='40.4.134 — Aether detail discoverability + Administration active-role idempotence: the visible CPU/GPU/RAM/Maintenon/BTC band opens the existing five-day Aether panel; clicking Administration while already Administrator stays Administrator instead of invoking the legacy lock branch. First-entry door and protected runtime owners remain unchanged.'
          feat={'build':B,'aether_compact_band_opens_detail':True,'weather_forecast_days':5,'administrator_active_role_reclick_idempotent':True,'administrator_first_entry_door_preserved':True,'auth_owner_changed':False,'storage_write_added':False,'timer_added':False,'market_core_changed':False,'oracle_engine_changed':False,'atlas_current_changed':False,'bridge_engine_changed':False}
          def update_manifest(path, admin_sha=None):
              d=json.loads(path.read_text(encoding='utf-8'))
              d.update({'build':B,'release':REL,'status':STATUS,'prepared_at':datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z'),'published_at':None,'parent_build':P,'asset_token':f'market-core-v2.0-alpha-build-{B}'})
              if 'global_versioning' in d: d['global_versioning']=B
              if d.get('source')==P: d['source']=B
              lineage=str(d.get('lineage') or '')
              entry=f'{B} Aether detail discoverability + Administrator active-role no-logout lock'
              if entry not in lineage: d['lineage']=(lineage+' → '+entry).strip(' →')
              d.setdefault('features',{})['aether_detail_admin_role_404134']=feat.copy()
              integ=d.setdefault('integrity',{}); integ['aether_detail_admin_role_404134']=feat.copy()
              pub=integ.setdefault('publication_identity',{}); pub.update({'build':B,'asset_token':f'market-core-v2.0-alpha-build-{B}','status':STATUS,'app_sha256':sha(root)})
              if admin_sha: pub['administrator_version_sha256']=admin_sha
              notes=d.get('release_notes')
              if isinstance(notes,list):
                  if not notes or notes[0]!=note: notes.insert(0,note)
              else: d['release_notes']=[note]
              for rel in list((d.get('files') or {})):
                  f=R/rel
                  if not f.is_file(): raise SystemExit('STOP manifest missing '+rel)
                  d['files'][rel]=sha(f)
              path.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          am=R/'administrator-version.json'; vm=R/'version.json'
          update_manifest(am); update_manifest(vm,sha(am))

          at=aether.read_text(encoding='utf-8'); ix=index.read_text(encoding='utf-8')
          if at.count('setInterval(')!=timers_before: raise SystemExit('STOP timer count changed')
          for needle,label in [('aetherDetailBound404134','Aether opener'),('aetherPanelSet4084(true)','Aether detail action'),('function aetherWeatherForecast40133(payload)','weather owner'),('forecast_days=${AETHER_WEATHER_4086.days}','weather 5d')]:
              if needle not in at: raise SystemExit('STOP '+label)
          for needle,label in [('data-atlas-admin-active-role-lock-404134="true"','Admin guard'),('adminActiveRoleLock404134 = "stay-advanced"','Admin state')]:
              if needle not in ix: raise SystemExit('STOP '+label)
          if json.loads(vm.read_text(encoding='utf-8')).get('build')!=B: raise SystemExit('STOP manifest build')

          files=list((json.loads(vm.read_text(encoding='utf-8')).get('files') or {}).keys())
          for req in ('version.json','administrator-version.json'):
              if req not in files: files.append(req)
          missing=[x for x in files if not (R/x).is_file()]
          if missing: raise SystemExit('STOP archive missing '+', '.join(missing))
          outdir=Path('coordination/inter_ai_dialogues/agent_crypto'); outdir.mkdir(parents=True,exist_ok=True)
          out=outdir/f'AGENT_CRYPTO_BUILD_{B.replace(".","_")}_AUTO_CANONICAL.zip'
          with zipfile.ZipFile(out,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=9) as z:
              for rel in files: z.write(R/rel,arcname=(Path('public/agent_crypto_erith_ia/administrator')/rel).as_posix())
          digest=sha(out); Path(str(out)+'.sha256').write_text(f'{digest}  {out.name}\n',encoding='utf-8')
          print('BUILD',B); print('SHA256',digest)
          PY
          node --check public/agent_crypto_erith_ia/administrator/js/aether.js
          node --check public/agent_crypto_erith_ia/administrator/js/app.js
          node --check public/agent_crypto_erith_ia/administrator/app.js

      - name: Commit validated 40.4.134 atomically
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Aether Release"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/agent-crypto-40-4-134-patch.yml \
                    .github/workflows/agent-crypto-40-4-134-retry.yml \
                    coordination/inter_ai_dialogues/agent_crypto/patches/40.4.134.request.json \
                    coordination/inter_ai_dialogues/agent_crypto/patches/40.4.134.retry.json
          git add public/agent_crypto_erith_ia/administrator \
                  coordination/inter_ai_dialogues/agent_crypto/AGENT_CRYPTO_BUILD_40_4_134_AUTO_CANONICAL.zip \
                  coordination/inter_ai_dialogues/agent_crypto/AGENT_CRYPTO_BUILD_40_4_134_AUTO_CANONICAL.zip.sha256
          git diff --cached --check
          git commit -m "fix Agent-Crypto 40.4.134 Aether detail and Administration active-role lock"
          git push origin HEAD:main
