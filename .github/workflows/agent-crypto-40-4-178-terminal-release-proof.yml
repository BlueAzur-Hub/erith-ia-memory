name: Agent-Crypto 40.4.178 Terminal Release Proof

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/agent-crypto-40-4-178-terminal-release-proof.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main

      - name: Patch 40.4.178 terminal release proof
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, json
          from datetime import datetime, timezone

          base = Path('public/agent_crypto_erith_ia/administrator')
          build = '40.4.178'
          parent = '40.4.177'
          release = 'CANONICAL VERSION VALIDATOR · TERMINAL RELEASE PROOF'
          status = 'canonical_version_validator_terminal_release_proof'
          now = datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z')

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{p}: expected exactly 1 occurrence, got {count}: {old!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(base/'app.js', 'const ATLAS_BUILD = "40.4.177";', f'const ATLAS_BUILD = "{build}";')
          replace_once(base/'js/app.js', 'const ADMIN_BUILD = "40.4.177";', f'const ADMIN_BUILD = "{build}";')
          replace_once(base/'js/app.js', 'const ADMIN_RELEASE = "VERSION TRUTH CI GUARD · RELEASE ATOMICITY LOCK";', f'const ADMIN_RELEASE = "{release}";')

          index = base/'index.html'
          text = index.read_text(encoding='utf-8')
          replacements = [
              ('<meta name="atlas-build" content="40.4.177" />', f'<meta name="atlas-build" content="{build}" />'),
              ('<meta name="administrator-build" content="40.4.177" />', f'<meta name="administrator-build" content="{build}" />'),
              ('<meta name="administrator-release" content="VERSION TRUTH CI GUARD · RELEASE ATOMICITY LOCK" />', f'<meta name="administrator-release" content="{release}" />'),
              ('<meta name="atlas-asset-token" content="market-core-v2.0-alpha-build-40.4.177" />', f'<meta name="atlas-asset-token" content="market-core-v2.0-alpha-build-{build}" />'),
              ('<title>Agent-Crypto @erith.IA — Build 40.4.177 · Administrator</title>', f'<title>Agent-Crypto @erith.IA — Build {build} · Administrator</title>'),
              ('<script src="./app.js?v=administrator-build-40.4.177"></script>', f'<script src="./app.js?v=administrator-build-{build}"></script>'),
              ('<script src="./js/app.js?v=administrator-build-40.4.177"></script>', f'<script src="./js/app.js?v=administrator-build-{build}"></script>'),
              ("<span id=\"footerRelease\">Agent-Crypto @erith.IA · Market Core · Build 40.4.177 · Version : Parker Lewis Can't Lose</span>", f"<span id=\"footerRelease\">Agent-Crypto @erith.IA · Market Core · Build {build} · Version : Parker Lewis Can't Lose</span>"),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{index}: expected exactly 1 occurrence, got {count}: {old!r}')
              text = text.replace(old, new, 1)
          index.write_text(text, encoding='utf-8')

          vp = base/'version.json'
          manifest = json.loads(vp.read_text(encoding='utf-8'))
          if manifest.get('build') != parent:
              raise SystemExit(f'version.json parent mismatch: {manifest.get("build")} != {parent}')
          manifest['release'] = release
          manifest['build'] = build
          manifest['asset_token'] = f'market-core-v2.0-alpha-build-{build}'
          manifest['status'] = status
          manifest['prepared_at'] = now
          manifest['published_at'] = now
          manifest['parent_build'] = parent
          manifest['revision'] = 'V1'
          lineage = str(manifest.get('lineage') or '')
          if '40.4.178 Canonical Version Validator' not in lineage:
              lineage += ' → 40.4.178 Canonical Version Validator + Terminal Release Proof: one shared validator executes before commit and after push; release SHA must be on or below origin/main.'
          manifest['lineage'] = lineage
          contract = {
              'schema': 'erith.admin.terminal-release-proof.v1',
              'build': build,
              'parent_build': parent,
              'canonical_validator': '.github/scripts/agent_crypto_version_truth_guard.py',
              'pre_commit_validation': True,
              'post_push_validation': True,
              'origin_main_ancestor_proof': True,
              'one_shot_retired_in_release_commit': True,
              'pages_terminal_proof_external': True,
              'market_core_modified': False,
              'business_semantics_changed': False,
              'new_runtime_network_owner': False,
              'new_runtime_timer': False,
              'new_runtime_observer': False,
              'new_runtime_storage_owner': False,
          }
          manifest.setdefault('contracts', {})['terminal_release_proof_404178'] = contract

          ap = base/'administrator-version.json'
          mirror = json.loads(ap.read_text(encoding='utf-8'))
          if mirror.get('build') != parent:
              raise SystemExit(f'administrator-version.json parent mismatch: {mirror.get("build")} != {parent}')
          mirror['build'] = build
          mirror['global_versioning'] = build
          mirror['release'] = release
          mirror['status'] = status
          mirror['prepared_at'] = now
          mirror['published_at'] = now
          mirror['parent_build'] = parent
          mirror['revision'] = 'V1'
          mirror.setdefault('contracts', {})['terminal_release_proof_404178'] = contract
          ap.write_text(json.dumps(mirror, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          files = manifest.get('files')
          if not isinstance(files, dict) or not files:
              raise SystemExit('version.json files hash map missing')
          for rel in list(files):
              p = base/rel
              if not p.is_file():
                  raise SystemExit(f'manifest hash target missing: {rel}')
              files[rel] = hashlib.sha256(p.read_bytes()).hexdigest()
          vp.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Canonical pre-commit validation
        run: |
          node --check public/agent_crypto_erith_ia/administrator/app.js
          node --check public/agent_crypto_erith_ia/administrator/js/app.js
          python .github/scripts/agent_crypto_version_truth_guard.py \
            --expected-build 40.4.178 \
            --expected-release 'CANONICAL VERSION VALIDATOR · TERMINAL RELEASE PROOF'

      - name: Commit release and retire one-shot
        shell: bash
        run: |
          git rm .github/workflows/agent-crypto-40-4-178-terminal-release-proof.yml
          git add public/agent_crypto_erith_ia/administrator/app.js \
                  public/agent_crypto_erith_ia/administrator/js/app.js \
                  public/agent_crypto_erith_ia/administrator/index.html \
                  public/agent_crypto_erith_ia/administrator/version.json \
                  public/agent_crypto_erith_ia/administrator/administrator-version.json
          git commit -m "release Agent-Crypto 40.4.178 terminal release proof"
          git pull --rebase origin main
          RELEASE_SHA="$(git rev-parse HEAD)"
          echo "RELEASE_SHA=$RELEASE_SHA" >> "$GITHUB_ENV"
          git push origin main

      - name: Terminal post-push proof
        shell: bash
        run: |
          test -n "$RELEASE_SHA"
          node --check public/agent_crypto_erith_ia/administrator/app.js
          node --check public/agent_crypto_erith_ia/administrator/js/app.js
          python .github/scripts/agent_crypto_version_truth_guard.py \
            --expected-build 40.4.178 \
            --expected-release 'CANONICAL VERSION VALIDATOR · TERMINAL RELEASE PROOF'
          if git cat-file -e "$RELEASE_SHA:.github/workflows/agent-crypto-40-4-178-terminal-release-proof.yml" 2>/dev/null; then
            echo 'one-shot still present in release commit' >&2
            exit 1
          fi
          git fetch origin main
          git merge-base --is-ancestor "$RELEASE_SHA" origin/main
          echo "TERMINAL_RELEASE_PROOF_PASS release=$RELEASE_SHA origin_main=$(git rev-parse origin/main)"
