name: Agent-Crypto Aether 40.4.128 representative news publication

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/agent_crypto_aether_40_4_128_oneshot.yml"

permissions:
  contents: write

concurrency:
  group: agent-crypto-aether-40-4-128-publication
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply 40.4.128 representative News and no-clip ribbon recovery
        run: python .github/scripts/agent_crypto_40_4_128_patch.py

      - name: Static JavaScript validation
        run: |
          node --check public/agent_crypto_erith_ia/administrator/js/aether.js
          node --check public/agent_crypto_erith_ia/administrator/app.js
          node --check public/agent_crypto_erith_ia/administrator/js/app.js

      - name: Commit publication and remove one-shot files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/agent_crypto_aether_40_4_128_oneshot.yml
          git rm .github/scripts/agent_crypto_40_4_128_patch.py
          git add public/agent_crypto_erith_ia/administrator/index.html \
                  public/agent_crypto_erith_ia/administrator/app.js \
                  public/agent_crypto_erith_ia/administrator/admin-ribbons.css \
                  public/agent_crypto_erith_ia/administrator/js/aether.js \
                  public/agent_crypto_erith_ia/administrator/js/app.js \
                  public/agent_crypto_erith_ia/administrator/version.json \
                  public/agent_crypto_erith_ia/administrator/administrator-version.json
          git commit -m "feat Agent-Crypto 40.4.128 diversify Aether News and restore ribbon fit"
          git pull --rebase origin main
          git push origin HEAD:main
