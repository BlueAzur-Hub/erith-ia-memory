name: Agent-Crypto 40.4.255 Technical Reading legacy CSS owner retirement

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/agent-crypto-404255.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Retire obsolete Technical Reading CSS owner
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re, hashlib

          base = Path('public/agent_crypto_erith_ia/administrator')
          version = json.loads((base/'version.json').read_text(encoding='utf-8'))
          assert version['build'] == '40.4.254', version['build']
          assert version['engine']['reference_build'] == '38.15.11'
          assert version['engine']['status'] == 'protected'

          css_path = base/'admin-visual-assets.css'
          cache_css_path = base/'admin-visual-cache.css'
          css = css_path.read_text(encoding='utf-8')
          cache_sha_before = hashlib.sha256(cache_css_path.read_bytes()).hexdigest()

          start = '''/* ------------------------------------------------------------\n   TECHNICAL READING — Classic principle:\n'''
          end = '''/* Remove every R1/R2 decorative strip/tool. */'''
          assert css.count(start) == 1, css.count(start)
          assert css.count(end) == 1, css.count(end)
          a = css.index(start)
          b = css.index(end)
          assert a < b

          retired = '''/* ------------------------------------------------------------\n   40.4.255 — TECHNICAL READING LEGACY 39.4.5R4 OWNER RETIRED\n\n   The obsolete 39.4.5R4 Technical Reading panel/host/portrait/cartouche/reset\n   declarations were still present above the canonical owner. Their geometry\n   had mostly been neutralized by later releases, but they remained a competing\n   visual authority. The validated rendering is now owned explicitly by:\n   - TECHNICAL_READING_CANONICAL_OWNER_404253 below: geometry + portrait frame;\n   - admin-visual-cache.css 40.3.38: opacity + contrast;\n   - the existing 40.2.69 / 40.2.88 runtime: source, RND, private picker + framing.\n\n   No graph, market, Atlas, Oracle, Math, RND asset or storage behavior changes.\n   ------------------------------------------------------------ */\n\n'''
          css = css[:a] + retired + css[b:]

          # The old owner also supplied three non-geometric cartouche primitives
          # that were still part of the computed 40.4.254 appearance. Move those
          # exact primitives into the canonical cartouche rule before retiring it.
          needle = '''  padding:4px 7px!important;\n  border-radius:999px!important;\n  /* 40.4.253R2'''
          replacement = '''  padding:4px 7px!important;\n  border:1px solid rgba(255,215,130,.28)!important;\n  border-radius:999px!important;\n  color:#ffe2a0!important;\n  font-size:9px!important;\n  /* 40.4.253R2'''
          assert css.count(needle) == 1, css.count(needle)
          css = css.replace(needle, replacement, 1)

          # Update the canonical owner description: no surviving legacy geometry owner.
          css = css.replace(
              'owned by admin-visual-cache.css and the surviving visual-only historical rules.',
              'owned by admin-visual-cache.css 40.3.38; no legacy Technical Reading geometry owner survives here.',
              1,
          )
          css_path.write_text(css, encoding='utf-8')

          # Force Firefox/Pages to load the cleaned owner stylesheet.
          index_path = base/'index.html'
          index = index_path.read_text(encoding='utf-8')
          index, count = re.subn(
              r'admin-visual-assets\.css\?v=administrator-build-[^"\']+',
              'admin-visual-assets.css?v=administrator-build-40.4.255',
              index,
              count=1,
          )
          assert count == 1, count

          # Keep System view cache identity aligned with release truth guard only.
          index, count = re.subn(
              r'<script src="\./js/views/system-presentation\.js\?v=administrator-build-[^"]+"></script>',
              '<script src="./js/views/system-presentation.js?v=administrator-build-40.4.255"></script>',
              index,
              count=1,
          )
          assert count == 1, count
          index_path.write_text(index, encoding='utf-8')

          system_path = base/'js/views/system-presentation.js'
          system = system_path.read_text(encoding='utf-8')
          system, count = re.subn(
              r'const SOURCE="\./views/system\.html\?v=administrator-build-[^"]+";',
              'const SOURCE="./views/system.html?v=administrator-build-40.4.255";',
              system,
              count=1,
          )
          assert count == 1, count
          system_path.write_text(system, encoding='utf-8')

          # Proof that opacity owner was not touched.
          cache_sha_after = hashlib.sha256(cache_css_path.read_bytes()).hexdigest()
          assert cache_sha_before == cache_sha_after

          contract = {
            'build': '40.4.255',
            'parent': '40.4.254',
            'technical_reading_legacy_css_owner_retired': True,
            'retired_owner': '39.4.5R4 Technical Reading visual block in admin-visual-assets.css',
            'canonical_geometry_owner': 'TECHNICAL_READING_CANONICAL_OWNER_404253',
            'canonical_opacity_owner': 'admin-visual-cache.css 40.3.38',
            'runtime_source_owner_preserved': '40.2.69 / 40.2.88 inline Technical Reading runtime',
            'validated_host_px': 136,
            'portrait_fit': 'cover',
            'identity_cartouche_position_preserved': True,
            'technical_reading_cache_generation_changed': False,
            'technical_reading_runtime_changed': False,
            'rnd_library_changed': False,
            'rnd_assets_changed': False,
            'private_visual_storage_changed': False,
            'graph_changed': False,
            'parallel_markets_changed': False,
            'atlas_changed': False,
            'oracle_changed': False,
            'math_core_changed': False,
            'window_manager_changed': False,
            'market_core_changed': False,
            'protected_market_core': '38.15.11'
          }
          Path('/tmp/contract-404255.json').write_text(json.dumps(contract, ensure_ascii=False, indent=2), encoding='utf-8')
          PY

      - name: Release identity 40.4.255
        shell: bash
        run: |
          python .github/scripts/agent_crypto_release_driver.py \
            --build 40.4.255 \
            --parent 40.4.254 \
            --release "TECHNICAL READING · LEGACY CSS OWNER RETIREMENT LOCK" \
            --status "technical_reading_legacy_css_owner_retirement_404255" \
            --contract-key "technical_reading_legacy_css_owner_retirement_404255" \
            --contract-json /tmp/contract-404255.json \
            --lineage-note "40.4.255 retires the obsolete 39.4.5R4 Technical Reading visual owner instead of stacking another patch; the validated 136px host, full-panel cover portrait, R2 cartouche position, 40.3.38 opacity owner, RND/private runtime and 40.4.254 visual cache generation are preserved"

      - name: Static ownership proof
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re

          base = Path('public/agent_crypto_erith_ia/administrator')
          css = (base/'admin-visual-assets.css').read_text(encoding='utf-8')
          cache_css = (base/'admin-visual-cache.css').read_text(encoding='utf-8')
          index = (base/'index.html').read_text(encoding='utf-8')
          system = (base/'js/views/system-presentation.js').read_text(encoding='utf-8')
          version = json.loads((base/'version.json').read_text(encoding='utf-8'))
          build = json.loads((base/'build.json').read_text(encoding='utf-8'))

          assert version['build'] == '40.4.255'
          assert version['parent_build'] == '40.4.254'
          assert version['engine']['reference_build'] == '38.15.11'
          assert version['engine']['status'] == 'protected'
          assert build['build'] == '40.4.255'
          assert build['engine'] == '38.15.11'

          assert 'TECHNICAL READING — Classic principle:' not in css
          assert '40.4.255 — TECHNICAL READING LEGACY 39.4.5R4 OWNER RETIRED' in css
          assert css.count('TECHNICAL_READING_CANONICAL_OWNER_404253') == 1
          assert 'position:static!important;' in css
          assert 'height:136px!important;' in css
          assert 'min-height:136px!important;' in css
          assert 'max-height:136px!important;' in css
          assert 'flex:0 0 136px!important;' in css
          assert 'overflow:visible!important;' in css
          assert 'position:absolute!important;\n  inset:0!important;\n  width:100%!important;\n  height:100%!important;' in css
          assert 'object-fit:cover!important;' in css
          assert 'object-position:var(--admin-tech-x,50%) var(--admin-tech-y,50%)!important;' in css
          assert 'top:156px!important;' in css
          assert 'transform:translateY(52px)!important;' in css
          assert 'border:1px solid rgba(255,215,130,.28)!important;' in css
          assert 'color:#ffe2a0!important;' in css
          assert 'font-size:9px!important;' in css
          assert 'overflow-y:auto!important;' in css

          # Opacity owner remains canonical and untouched in content contract.
          assert '40.3.38 TECHNICAL READING — METALLIC DEPTH OPACITY' in cache_css
          assert '--atlas-tr-depth-kpi: rgba(2,9,18,.78);' in cache_css
          assert '.detail-project-visual.admin-tech-r3 > span' in cache_css

          # Runtime remains exactly present: RND/private/source authority is not consolidated in this release.
          assert 'const RANDOM_LIBRARY=Object.freeze([' in index
          assert index.count('technical-random-') >= 20
          assert 'AgentCryptoPrivateVisuals40269' in index
          assert 'atlas-tech-letterbox-fill-40230' in index
          assert 'atlas-tech-frame-lock-40259' in index

          assert 'admin-visual-assets.css?v=administrator-build-40.4.255' in index
          assert '<script src="./js/views/system-presentation.js?v=administrator-build-40.4.255"></script>' in index
          assert 'const SOURCE="./views/system.html?v=administrator-build-40.4.255";' in system
          PY

          node --check public/agent_crypto_erith_ia/administrator/app.js
          node --check public/agent_crypto_erith_ia/administrator/js/app.js
          python .github/scripts/agent_crypto_version_truth_guard.py \
            --expected-build 40.4.255 \
            --expected-release "TECHNICAL READING · LEGACY CSS OWNER RETIREMENT LOCK"

      - name: Scope guard
        shell: bash
        run: |
          python - <<'PY'
          import subprocess
          allowed = {
            'public/agent_crypto_erith_ia/administrator/admin-visual-assets.css',
            'public/agent_crypto_erith_ia/administrator/administrator-version.json',
            'public/agent_crypto_erith_ia/administrator/app.js',
            'public/agent_crypto_erith_ia/administrator/build.json',
            'public/agent_crypto_erith_ia/administrator/index.html',
            'public/agent_crypto_erith_ia/administrator/js/app.js',
            'public/agent_crypto_erith_ia/administrator/js/views/system-presentation.js',
            'public/agent_crypto_erith_ia/administrator/version.json',
          }
          changed=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          extra=changed-allowed
          missing=allowed-changed
          assert not extra, f'out-of-scope: {sorted(extra)}'
          assert not missing, f'missing expected release files: {sorted(missing)}'
          print('scope ok:', *sorted(changed), sep='\n- ')
          PY

      - name: Commit release
        shell: bash
        run: |
          git config user.name "Aether Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/agent_crypto_erith_ia/administrator
          git commit -m "agent-crypto: build 40.4.255 retire legacy Technical Reading CSS owner"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Build differential package
        shell: bash
        run: |
          rm -rf /tmp/pkg /tmp/out
          mkdir -p /tmp/pkg /tmp/out
          git diff --name-only HEAD^ HEAD -- public/agent_crypto_erith_ia/administrator | while read f; do
            mkdir -p "/tmp/pkg/$(dirname "$f")"
            cp "$f" "/tmp/pkg/$f"
          done
          cat > /tmp/pkg/FILES_CHANGED_40.4.255.md <<'EOF'
          # Agent-Crypto 40.4.255 — Technical Reading legacy CSS owner retirement

          Architectural consolidation only. Visual target is intentionally identical to accepted 40.4.254.

          - Removes the obsolete 39.4.5R4 Technical Reading visual owner from `admin-visual-assets.css`.
          - Preserves the three still-effective identity-cartouche primitives inside the canonical owner before removing the legacy block.
          - Keeps the canonical 136 px in-flow host and full-panel absolute `cover` portrait unchanged.
          - Keeps the validated `Agent-Crypto · Aerith-10` R2 position unchanged.
          - Keeps `admin-visual-cache.css` 40.3.38 as opacity/contrast owner.
          - Keeps RND, private picker, IndexedDB, 40.4.254 visual cache generation and runtime source/framing logic unchanged.
          - Graph, parallel markets, Atlas, Oracle, Math Core, Window Manager and Market Core are untouched.
          - Market Core 38.15.11 remains protected.
          EOF
          (cd /tmp/pkg && zip -qr /tmp/out/AGENT_CRYPTO_BUILD_40_4_255_TECHNICAL_READING_LEGACY_CSS_OWNER_RETIREMENT_LOCK_CHANGED_FILES.zip .)
          sha256sum /tmp/out/*.zip | tee /tmp/out/AGENT_CRYPTO_BUILD_40_4_255_SHA256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: AGENT_CRYPTO_BUILD_40_4_255_TECHNICAL_READING_LEGACY_CSS_OWNER_RETIREMENT_LOCK
          path: /tmp/out/*
          if-no-files-found: error
