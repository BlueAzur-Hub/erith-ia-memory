name: Agent-Crypto Aether 40.6.78-40.6.83 Runner

on:
  push:
    paths:
      - .github/workflows/agent-crypto-406083-runner.yml

permissions:
  contents: write

jobs:
  cascade:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Run cumulative cascade
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          git config user.name "BlueAzur-Hub"
          git config user.email "Blue.Azur@protonmail.com"
          python - <<'PY'
          from pathlib import Path
          import json

          root=Path('public/agent_crypto_erith_ia/administrator')
          data=json.loads((root/'build.json').read_text(encoding='utf-8'))
          assert data.get('build')=='40.6.77', data.get('build')
          assert data.get('engine')=='38.15.11', data.get('engine')

          source=Path('.github/workflows/agent-crypto-406083-aether-cascade.yml').read_text(encoding='utf-8')
          marker="          python - <<'PY'\n          from pathlib import Path\n          from datetime import datetime, timezone"
          start=source.index(marker)+len("          python - <<'PY'\n")
          end=source.index("\n          PY",start)
          block=source[start:end]
          lines=[]
          for line in block.splitlines():
              lines.append(line[10:] if line.startswith('          ') else line)
          script='\n'.join(lines)+'\n'

          # Reread correction 1: canonical zero-padded runtime filenames.
          old="    p=root/f'js/aether-v2-{build.replace(\".\",\"\")}.js'"
          new="    suffix=f'406{int(build.split(\".\")[-1]):03d}'\n    p=root/f'js/aether-v2-{suffix}.js'"
          if old not in script:
              raise SystemExit('runtime filename generator signature missing')
          script=script.replace(old,new,1)

          # Reread correction 2: checkpoints .81/.82 must contain real CSS newlines,
          # not literal backslash-n separators.
          old="css81.write_text(css,encoding='utf-8')"
          new="css=css.replace('\\\\n','\\n')\ncss81.write_text(css,encoding='utf-8')"
          if old not in script:
              raise SystemExit('CSS .81 write signature missing')
          script=script.replace(old,new,1)

          # Reread correction 3: final .83 preboot is real HTML/JS before commit.
          old="if 'id=\"aetherLegacyCenterPreboot406083\"' not in html:"
          new="preboot=preboot.replace('\\\\n','\\n')\nif 'id=\"aetherLegacyCenterPreboot406083\"' not in html:"
          if old not in script:
              raise SystemExit('preboot insertion signature missing')
          script=script.replace(old,new,1)

          Path('/tmp/aether_cascade_406083.py').write_text(script,encoding='utf-8')
          PY

          python /tmp/aether_cascade_406083.py

          # Final reread after the cumulative script. Amend .83 instead of adding
          # another patch/version if formatting or acceptance metadata needs cleanup.
          python - <<'PY'
          from pathlib import Path
          import json

          root=Path('public/agent_crypto_erith_ia/administrator')
          css=root/'aether-v2-406083.css'
          runtime=root/'js/aether-v2-406083.js'
          index=root/'index.html'
          manifest=root/'build.json'
          role=root/'js/aether-role-visibility-406050.js'

          text=css.read_text(encoding='utf-8')
          if '\\n' in text:
              text=text.replace('\\n','\n')
              css.write_text(text,encoding='utf-8')

          html=index.read_text(encoding='utf-8')
          data=json.loads(manifest.read_text(encoding='utf-8'))
          loader=role.read_text(encoding='utf-8')
          js=runtime.read_text(encoding='utf-8')

          assert 'id="aetherLegacyCenterPreboot406083"' in html
          assert '<meta name="administrator-build" content="40.6.83" />' in html
          assert '<meta name="atlas-engine-build" content="38.15.11" />' in html
          assert 'Build 40.6.83 · Administrator' in html
          assert data.get('build')=='40.6.83'
          assert data.get('engine')=='38.15.11'
          assert 'aether-v2-406083.css' in loader
          assert 'aether-v2-406083.js' in loader
          assert 'aether-frame-406077.js?v=' not in loader
          assert 'setInterval' not in js
          assert 'MutationObserver' not in js
          assert 'fetch(' not in js
          assert 'WebSocket' not in js
          PY

          node --check public/agent_crypto_erith_ia/administrator/js/aether-v2-406083.js
          git add public/agent_crypto_erith_ia/administrator/aether-v2-406083.css public/agent_crypto_erith_ia/administrator/index.html public/agent_crypto_erith_ia/administrator/build.json public/agent_crypto_erith_ia/administrator/js/aether-v2-406083.js public/agent_crypto_erith_ia/administrator/js/aether-role-visibility-406050.js public/agent_crypto_erith_ia/administrator/RELEASE_40_6_83.md
          git rm .github/workflows/agent-crypto-406083-runner.yml
          git commit --amend --no-edit
          git push origin HEAD:main

      - name: Package final Administrator copy
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          zip -qr dist/AGENT_CRYPTO_BUILD_40_6_83_AETHER_V2_FINAL_CLEAN_UPLOAD.zip public/agent_crypto_erith_ia/administrator
          sha256sum dist/AGENT_CRYPTO_BUILD_40_6_83_AETHER_V2_FINAL_CLEAN_UPLOAD.zip > dist/AGENT_CRYPTO_BUILD_40_6_83_AETHER_V2_FINAL_CLEAN_UPLOAD.sha256
          git log -8 --oneline > dist/AGENT_CRYPTO_BUILD_40_6_83_AETHER_V2_FINAL_COMMITS.txt

      - name: Upload final clean copy
        uses: actions/upload-artifact@v4
        with:
          name: AGENT_CRYPTO_BUILD_40_6_83_AETHER_V2_FINAL_CLEAN_UPLOAD
          path: dist/
          retention-days: 30
