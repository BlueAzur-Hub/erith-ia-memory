name: Seven Heaven BTC swing research - method audit

on:
  pull_request:
    paths:
      - '.github/workflows/seven-heaven-btc-swing-real-methods-research.yml'
      - 'coordination/inter_ai_dialogues/agent_crypto/research/strategy_profiles/SEVEN_HEAVEN_BTC_SWING_THREE_METHODS_WALK_FORWARD_RESEARCH_2026_11_10.cjs'
      - 'coordination/inter_ai_dialogues/agent_crypto/research/strategy_profiles/SEVEN_HEAVEN_BTC_SWING_EVIDENCE_BASED_REASSESSMENT_2026_11_10.md'

permissions:
  contents: read

jobs:
  independent-research:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Replay daily history without exchange connection
        run: |
          set -euo pipefail
          script=coordination/inter_ai_dialogues/agent_crypto/research/strategy_profiles/SEVEN_HEAVEN_BTC_SWING_THREE_METHODS_WALK_FORWARD_RESEARCH_2026_11_10.cjs
          node --check "$script"
          node "$script" > /tmp/seven_swing_research.json
      - name: Verify exact year split, results and no real orders
        run: |
          node - <<'NODE'
          const fs=require('node:fs'),assert=require('node:assert/strict');
          const d=JSON.parse(fs.readFileSync('/tmp/seven_swing_research.json','utf8'));
          assert.equal(d.ordersEnabled,false);
          assert.equal(d.researchOnly,true);
          assert.equal(d.source.rows,3075);
          assert.equal(d.source.pair,'BTCUSDT');
          assert.equal(d.annual.length,3*2*7);
          assert.equal(d.stress.length,3);
          const names=new Set(d.annual.map(x=>x.method));
          assert.deepEqual([...names].sort(),['BREAKOUT','PULLBACK','REBOUND']);
          for(const y of d.annual){
            assert(y.year>=2020&&y.year<=2026);
            assert(y.trades>=0 && y.wins+y.losses===y.trades);
            assert(Number.isFinite(y.final) && y.final>0);
            assert(Number.isFinite(y.buyHoldMatchedFinal) && y.buyHoldMatchedFinal>0);
            assert(y.maxDrawdownPct<=0 && y.maxDrawdownPct>=-100);
            assert(y.exposurePct>=0&&y.exposurePct<=100);
            assert(y.tradeLog.every(t=>t.entry>=y.from&&t.exit<=y.to));
          }
          // The matched Buy & Hold return is identical across methods at
          // a given year and allocation: no hidden benchmark change.
          for(const year of [2020,2021,2022,2023,2024,2025,2026]){
            for(const cap of [25,100]){
              const v=d.annual.filter(x=>x.year===year&&x.capitalCapPct===cap);
              assert.equal(v.length,3);
              assert(v.every(x=>Math.abs(x.buyHoldMatchedFinal-v[0].buyHoldMatchedFinal)<1e-7));
            }
          }
          console.log('STUDY_VERIFIED', JSON.stringify(d.summary));
          console.log('DOUBLE_COST_STRESS', JSON.stringify(d.stress));
          console.log('ANNUAL_100_PCT',JSON.stringify(d.annual.filter(x=>x.capitalCapPct===100).map(x=>({method:x.method,year:x.year,returnPct:+x.returnPct.toFixed(3),drawdownPct:+x.maxDrawdownPct.toFixed(3),trades:x.trades,wins:x.wins,holdPct:+x.buyHoldMatchedPct.toFixed(3)}))));
          NODE
