name: One-shot Administrator 40.6.711 verified release and Pages dispatch
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp_administrator_711_release.yml'
permissions:
  contents: write
  actions: write
concurrency:
  group: administrator-711-release
  cancel-in-progress: false
jobs:
  verify-package-publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Verify parent SHA and patch exact production sources
        run: python3 .github/scripts/tmp_administrator_711_patch.py
      - name: Verify JavaScript and complete repository integrations
        shell: bash
        run: |
          set -euo pipefail
          cp .github/scripts/tmp_administrator_711_test.cjs public/agent_crypto_erith_ia/tools/verify_administrator_network_latency.cjs
          node --check public/agent_crypto_erith_ia/administrator/app.js
          node --check public/agent_crypto_erith_ia/administrator/js/graph-native-usd-406520.js
          for name in annual_usd_integrity canonical_top5_integrity currency_integrity history_cache scanner_window_integrity top5_restore network_latency; do
            node "public/agent_crypto_erith_ia/tools/verify_administrator_$name.cjs"
          done
      - name: Prepare required buttons alignment specification and delivery package
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import zipfile,hashlib
          root=Path(".")
          shared=root/"coordination/inter_ai_dialogues/agent_crypto"
          shared.mkdir(parents=True,exist_ok=True)
          brief=shared/"AGENT_CRYPTO_UI_ALIGNMENT_REQUIREMENT.md"
          brief.write_text("""# Agent Crypto — Atlas Math Core / Redivider alignment requirement
          
          Status: UI requirement for a future explicitly scoped version. NOT implemented in Administrator 40.6.711.
          
          Evidence: Firefox screenshots supplied 2026-10-30 09:21 of the normal dashboard with right-side Technical Reading and the maximized graph where the sidebar is collapsed. Math Core circular control appears at bottom-left; Redivider circular control shifts vertically at bottom-right and lacks a shared baseline.
          
          Acceptance criteria:
          - Atlas Math Core at bottom-left of the chart shell and Redivider at bottom-right.
          - Both controls visually harmonized: identical bottom reference line, coherent visual sizes/margins, no overlap with chart legend, axis, footer, status strips, or each other.
          - Alignment remains stable when right Technical Reading is expanded, collapsed or hidden; when graph enlarges; and at supported Firefox desktop sizes. Respect safe padding and responsive behavior.
          - Control remains clickable, keyboard-accessible, focusable, and preserves current positioning of draggable panels and real historical data.
          - Screenshot validation in both layouts required. No speculative positioning patch or change to graph code in this release.
          
          Owner: Administrator presentation; protect Trader and Operator. Requirement recorded from user screenshots.
          """,encoding="utf-8")
          handoff=shared/"AGENT_CRYPTO_ADMINISTRATOR_HANDOFF.md"
          handoff.write_text("""# Administrator 40.6.711 — bounded network and verified USD cache-first

          Parent: 40.6.710. Engine Market Core: 38.15.11 unchanged.
          Changes: 2 concurrent chart permits plus 1 reserved non-chart permit in the existing network governor; queued HTTP timeout starts after obtaining permit; abort removal maintained. Native USD comparison cache consulted first only when the stored series passes the existing native USD integrity and freshness gates. HTTP still used for expired, absent, or wrong-currency data.
          Protected: canonical Top 5 BTC/ETH/BNB/XRP/SOL, full five-series atomic rendering, EUR acquisition, live market sources, Trader, Operator, real trading safety. No fabricated or relabeled EUR/USDT/USDC series.
          Verified: node --check and six existing tests plus the new network/cache regression test on the complete GitHub repository before code commit. Browser performance and Top5 EUR/USD are NOT Firefox-verified at commit time.
          Deferred UI requirement: AGENT_CRYPTO_UI_ALIGNMENT_REQUIREMENT.md (Math Core lower-left, Redivider lower-right with common baseline; no UI change in this release).
          Release path: one code commit, ZIP + SHA-256 in shared folder, explicit GitHub Pages workflow_dispatch publish=true, then independently verify Pages status. Firefox loaded-build and functional verification are separate.
          """,encoding="utf-8")
          base=root/"public/agent_crypto_erith_ia"
          files=[
            handoff,brief,
            base/"administrator/app.js",base/"administrator/index.html",
            base/"administrator/build.json",
            base/"administrator/js/graph-native-usd-406520.js",
          ]
          for name in ["annual_usd_integrity","canonical_top5_integrity","currency_integrity","history_cache","scanner_window_integrity","top5_restore","network_latency"]:
            files.append(base/"tools"/("verify_administrator_"+name+".cjs"))
          assert len(files)==13
          archive=shared/"AGENT_CRYPTO_ADMINISTRATOR_40.6.711_BOUNDED_NETWORK_USD_CACHE_FIRST_13_FILES.zip"
          if archive.exists():raise RuntimeError("STOP: archive exists — do not overwrite canonical ZIP")
          with zipfile.ZipFile(archive,"w",zipfile.ZIP_DEFLATED,compresslevel=9) as z:
            for file in files:z.write(file,arcname=file.as_posix())
          with zipfile.ZipFile(archive) as z:
            assert len(z.namelist())==13 and z.testzip() is None
          sha=hashlib.sha256(archive.read_bytes()).hexdigest()
          (shared/(archive.name+".sha256")).write_text(sha+"  "+archive.name+"\n",encoding="utf-8")
          print("ARCHIVE",archive,"SHA256",sha)
          PY
      - name: Commit verified release and handoff without temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/agent_crypto_erith_ia/administrator/app.js
          git add public/agent_crypto_erith_ia/administrator/index.html
          git add public/agent_crypto_erith_ia/administrator/build.json
          git add public/agent_crypto_erith_ia/administrator/js/graph-native-usd-406520.js
          git add public/agent_crypto_erith_ia/tools/verify_administrator_*.cjs
          git add coordination/inter_ai_dialogues/agent_crypto/AGENT_CRYPTO_ADMINISTRATOR_HANDOFF.md
          git add coordination/inter_ai_dialogues/agent_crypto/AGENT_CRYPTO_UI_ALIGNMENT_REQUIREMENT.md
          git add coordination/inter_ai_dialogues/agent_crypto/AGENT_CRYPTO_ADMINISTRATOR_40.6.711_BOUNDED_NETWORK_USD_CACHE_FIRST_13_FILES.zip*
          git rm .github/scripts/tmp_administrator_711_patch.py
          git rm .github/scripts/tmp_administrator_711_test.cjs
          git rm .github/workflows/tmp_administrator_711_release.yml
          git commit -m "Release Administrator 40.6.711 bounded charts and verified USD cache"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Explicitly dispatch Pages for bot-authored production commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/agent-crypto-runtime-pages.yml/dispatches" \
            -d '{"ref":"main","inputs":{"publish":"true"}}'
          echo "Pages publish=true workflow_dispatch accepted; final Pages status must be checked independently."
