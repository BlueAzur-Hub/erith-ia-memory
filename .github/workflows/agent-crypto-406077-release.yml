name: Agent-Crypto 40.6.77 Aether Pre-Reveal Position Release

on:
  push:
    paths:
      - '.github/workflows/agent-crypto-406077-release.yml'

permissions:
  contents: write

env:
  ADMIN: public/agent_crypto_erith_ia/administrator

jobs:
  release:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Synchronize main before surgery
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Build canonical 40.6.77
        run: |
          python - <<'PY'
          from pathlib import Path
          from datetime import datetime, timezone
          import hashlib, json

          root = Path('public/agent_crypto_erith_ia/administrator')
          index = root / 'index.html'
          manifest = root / 'build.json'
          role = root / 'js/aether-role-visibility-406050.js'
          frame76 = root / 'js/aether-frame-406076.js'
          frame77 = root / 'js/aether-frame-406077.js'
          css = root / 'aether-v2-406075.css'
          app = root / 'js/app.js'
          release = root / 'RELEASE_40_6_77.md'

          css_sha = hashlib.sha256(css.read_bytes()).hexdigest()
          app_sha = hashlib.sha256(app.read_bytes()).hexdigest()

          # Build 40.6.77 from the validated 40.6.76 bridge, changing only lifecycle ownership.
          frame = frame76.read_text(encoding='utf-8')
          frame = frame.replace('Build 40.6.76', 'Build 40.6.77', 1)
          frame = frame.replace('AETHER WATCH V2 — NATIVE POSITION LOCK', 'AETHER WATCH V2 — PRE-REVEAL POSITION LOCK', 1)
          frame = frame.replace('const BUILD = "40.6.76";', 'const BUILD = "40.6.77";', 1)
          frame = frame.replace('let migrationChecked = false;', 'let migrationResolved = false;', 1)
          frame = frame.replace('if (migrationChecked) return false;', 'if (migrationResolved) return false;', 1)
          old_guard = 'if (win.hidden || win.minimized || win.maximized || saved?.floating !== true) return false;'
          new_guard = 'if (win.minimized || win.maximized || saved?.minimized === true || saved?.maximized === true) return false;\n    if (saved?.floating !== true && win?.floating !== true) return false;'
          if old_guard not in frame:
            raise SystemExit('40.6.76 guard not found')
          frame = frame.replace(old_guard, new_guard, 1)
          old_resolution = '    migrationChecked = true;\n\n    if (!looksLegacyAutoCentered(geometry)) {\n      root.dataset.aetherNativePosition406076 = "operator-position-preserved";'
          new_resolution = '    if (!looksLegacyAutoCentered(geometry)) {\n      migrationResolved = true;\n      root.dataset.aetherPreRevealPosition406077 = "operator-position-preserved";'
          if old_resolution not in frame:
            raise SystemExit('legacy resolution block not found')
          frame = frame.replace(old_resolution, new_resolution, 1)
          old_apply = '    manager.applySnapshot({\n      schema: snapshot.schema || "erith.admin.workspace.window-state.v1",'
          new_apply = '    const hidden = win.hidden === true || saved?.hidden === true;\n\n    manager.applySnapshot({\n      schema: snapshot.schema || "erith.admin.workspace.window-state.v1",'
          if old_apply not in frame:
            raise SystemExit('applySnapshot anchor not found')
          frame = frame.replace(old_apply, new_apply, 1)
          frame = frame.replace('          hidden: false,', '          hidden,', 1)
          old_done = '    root.dataset.aetherNativePosition406076 = `legacy-center-migrated:${reason}`;\n    return true;'
          new_done = '    migrationResolved = true;\n    root.dataset.aetherPreRevealPosition406077 = `legacy-center-migrated:${reason}:${hidden ? "hidden" : "visible"}`;\n    return true;'
          if old_done not in frame:
            raise SystemExit('migration completion block not found')
          frame = frame.replace(old_done, new_done, 1)
          frame = frame.replace('queueMicrotask(() => migrateLegacyCenter("operator-open"));', 'migrateLegacyCenter("operator-pre-open");', 1)
          old_install = '  const warm = warmBackplate();\n  document.addEventListener("click", captureAetherOpen, true);'
          new_install = '  const warm = warmBackplate();\n  migrateLegacyCenter("frame-load");\n  window.addEventListener("erith:administrator-mirror-ready", () => migrateLegacyCenter("window-manager-ready"), { once: true });\n  document.addEventListener("click", captureAetherOpen, true);'
          if old_install not in frame:
            raise SystemExit('install anchor not found')
          frame = frame.replace(old_install, new_install, 1)
          frame = frame.replace('mode: "native-position-lock",', 'mode: "pre-reveal-position-lock",', 1)
          frame = frame.replace('legacy_center_migration_only: true,', 'hidden_migration_supported: true,\n    legacy_center_migration_only: true,', 1)
          frame = frame.replace('root.dataset.aetherNativePosition406076 || "idle"', 'root.dataset.aetherPreRevealPosition406077 || "idle"', 1)
          frame = frame.replace('globalThis.ErithAetherFrame406076 = api;', 'globalThis.ErithAetherFrame406077 = api;\n  globalThis.ErithAetherFrame406076 = api;', 1)
          frame77.write_text(frame, encoding='utf-8')

          # Runtime loader/version truth. Visual owner remains .75 unchanged.
          js = role.read_text(encoding='utf-8')
          replacements = [
            ('40.6.50 + Build 40.6.76 canonical Aether integration', '40.6.50 + Build 40.6.77 canonical Aether integration'),
            ('BUILD 40.6.76 — AETHER V2 NATIVE POSITION LOCK', 'BUILD 40.6.77 — AETHER V2 PRE-REVEAL POSITION LOCK'),
            ('const BUILD = "40.6.76";', 'const BUILD = "40.6.77";'),
            ('const REVISION = "V11";', 'const REVISION = "V12";'),
            ('const RELEASE = "AETHER V2 · NATIVE POSITION LOCK";', 'const RELEASE = "AETHER V2 · PRE-REVEAL POSITION LOCK";'),
            ('const SCRIPT_ID = "aetherFrame406076Canonical";', 'const SCRIPT_ID = "aetherFrame406077Canonical";'),
            ('const SCRIPT_SRC = "./js/aether-frame-406076.js?v=administrator-build-40.6.76";', 'const SCRIPT_SRC = "./js/aether-frame-406077.js?v=administrator-build-40.6.77";'),
            ('setMeta("administrator-revision", "V11");', 'setMeta("administrator-revision", "V12");'),
            ('setMeta("atlas-asset-token", "market-core-v2.0-alpha-build-40.6.76");', 'setMeta("atlas-asset-token", "market-core-v2.0-alpha-build-40.6.77");'),
            ('document.documentElement.dataset.aetherV2406074 = "canonical-40.6.76";', 'document.documentElement.dataset.aetherV2406074 = "canonical-40.6.77";'),
            ('script.dataset.aether406074 = "native-position-40.6.76";', 'script.dataset.aether406074 = "pre-reveal-position-40.6.77";'),
            ('document.documentElement.dataset.aetherFrameLoader406074 = "ready-40.6.76";', 'document.documentElement.dataset.aetherFrameLoader406074 = "ready-40.6.77";'),
          ]
          for old, new in replacements:
            count = js.count(old)
            if count != 1:
              raise SystemExit(f'role replacement count {count}: {old}')
            js = js.replace(old, new, 1)
          role.write_text(js, encoding='utf-8')

          # Static entry point truth before runtime JS.
          html = index.read_text(encoding='utf-8')
          replacements = [
            ('<meta name="atlas-build" content="40.6.76" />', '<meta name="atlas-build" content="40.6.77" />'),
            ('<meta name="administrator-build" content="40.6.76" />', '<meta name="administrator-build" content="40.6.77" />'),
            ('<meta name="administrator-revision" content="V11" />', '<meta name="administrator-revision" content="V12" />'),
            ('<meta name="administrator-release" content="AETHER V2 · NATIVE POSITION LOCK" />', '<meta name="administrator-release" content="AETHER V2 · PRE-REVEAL POSITION LOCK" />'),
            ('<meta name="atlas-asset-token" content="market-core-v2.0-alpha-build-40.6.76" />', '<meta name="atlas-asset-token" content="market-core-v2.0-alpha-build-40.6.77" />'),
            ('<title>Agent-Crypto @erith.IA — Build 40.6.76 · Administrator</title>', '<title>Agent-Crypto @erith.IA — Build 40.6.77 · Administrator</title>'),
            ('administrator-build-40.6.76', 'administrator-build-40.6.77'),
          ]
          for old, new in replacements:
            if old not in html:
              raise SystemExit(f'index replacement missing: {old}')
            html = html.replace(old, new)
          index.write_text(html, encoding='utf-8')

          # Published manifest: Safe Refresh must see .77 without Ctrl+F5.
          data = json.loads(manifest.read_text(encoding='utf-8'))
          data.update({
            'build': '40.6.77',
            'engine': '38.15.11',
            'release': 'AETHER V2 · PRE-REVEAL POSITION LOCK',
            'published': True,
            'status': 'aether_v2_pre_reveal_position_lock_406077',
            'parent_build': '40.6.76',
            'asset_token': 'market-core-v2.0-alpha-build-40.6.77',
            'administrator_build': '40.6.77',
            'build_label': 'Build 40.6.77 · Administrator',
            'release_status': 'aether_v2_pre_reveal_position_lock',
            'timestamp': datetime.now(timezone.utc).isoformat(timespec='seconds').replace('+00:00', 'Z'),
          })
          if isinstance(data.get('current_version_truth'), dict):
            data['current_version_truth']['loaded_build'] = '40.6.77'
          data['cascade_40_6_77'] = {
            'parent_build': '40.6.76',
            'release': 'AETHER V2 · PRE-REVEAL POSITION LOCK',
            'owner': 'js/aether-frame-406077.js',
            'scope': 'aether_window_first_paint_position_only',
            'visual_owner': 'aether-v2-406075.css',
            'visual_owner_modified': False,
            'hidden_legacy_center_migration': True,
            'migration_before_reveal': True,
            'operator_position_preserved': True,
            'window_manager_core_modified': False,
            'market_core_modified': False,
            'graph_modified': False,
            'technical_reading_modified': False,
            'new_recurring_timer': False,
            'new_observer': False,
            'new_network_owner': False,
            'new_storage_owner': False,
          }
          manifest.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          lines = [
            '# Agent-Crypto Administrator — 40.6.77',
            '',
            '## Aether Watch V2 — Pre-Reveal Position Lock',
            '',
            'Canonical parent: **40.6.76**. Engine: **Market Core 38.15.11** unchanged.',
            '',
            '### Field defect corrected',
            '',
            '40.6.76 retired forced centering for new/manual positions, but its legacy-center migration rejected Aether while hidden. The Window Manager could therefore reveal one frame at the old centered geometry before the later migration.',
            '',
            '40.6.77 performs the same migration before reveal. Hidden is preserved instead of treated as an abort condition.',
            '',
            '### Canonical behavior',
            '',
            '- historical auto-centered geometry migrates to `x = 12` while Aether may still be hidden;',
            '- the hidden flag is preserved during migration;',
            '- operator-owned x/y/size is preserved when it is not the legacy center;',
            '- first-open fallback in `js/app.js` remains native-left;',
            '- maximize / restore remains owned by the canonical Window Manager;',
            '- no resize reframe, pageshow reframe, timer or MutationObserver.',
            '',
            '### Visual lock',
            '',
            'The field-validated visual owner is unchanged: `aether-v2-406075.css`.',
            f'SHA-256: `{css_sha}`.',
            '',
            '`js/app.js` is unchanged in this release.',
            f'SHA-256: `{app_sha}`.',
            '',
            '### Protected',
            '',
            '- Market Core **38.15.11** unchanged;',
            '- V2 PNG unchanged;',
            '- Aether cells and typography unchanged;',
            '- Administrator Window Manager core unchanged;',
            '- Graphique and Lecture Technique unchanged;',
            '- Atlas / Oracle / Sources data owners unchanged;',
            '- Operator / Yohan unchanged.',
            '',
            '### Acceptance',
            '',
            'Reload Administrator, then open Aether. It must appear directly at its stored/native position without one centered paint first. Manually moved positions remain authoritative across close/reopen and reload.',
          ]
          release.write_text('\n'.join(lines) + '\n', encoding='utf-8')

          # Freeze assertions.
          if hashlib.sha256(css.read_bytes()).hexdigest() != css_sha:
            raise SystemExit('visual owner drifted')
          if hashlib.sha256(app.read_bytes()).hexdigest() != app_sha:
            raise SystemExit('app.js drifted')
          checks = {
            frame77: ['const BUILD = "40.6.77";', 'hidden_migration_supported: true', 'migrateLegacyCenter("frame-load")', 'operator-pre-open'],
            role: ['const BUILD = "40.6.77";', 'const REVISION = "V12";', 'aether-frame-406077.js?v=administrator-build-40.6.77'],
            index: ['content="40.6.77"', 'content="V12"', 'Build 40.6.77 · Administrator', 'administrator-build-40.6.77'],
            manifest: ['"build": "40.6.77"', '"parent_build": "40.6.76"', '"cascade_40_6_77"'],
          }
          for path, tokens in checks.items():
            body = path.read_text(encoding='utf-8')
            for token in tokens:
              if token not in body:
                raise SystemExit(f'validation failed: {path} missing {token}')
          PY

      - name: Validate release diff
        run: |
          git diff --check
          git status --short

      - name: Build exact release ZIP
        run: |
          rm -f AGENT_CRYPTO_BUILD_40_6_77_AETHER_PRE_REVEAL_POSITION_LOCK.zip
          zip -9 AGENT_CRYPTO_BUILD_40_6_77_AETHER_PRE_REVEAL_POSITION_LOCK.zip \
            "$ADMIN/index.html" \
            "$ADMIN/build.json" \
            "$ADMIN/aether-v2-406075.css" \
            "$ADMIN/js/app.js" \
            "$ADMIN/js/aether-role-visibility-406050.js" \
            "$ADMIN/js/aether-frame-406077.js" \
            "$ADMIN/RELEASE_40_6_77.md"
          sha256sum AGENT_CRYPTO_BUILD_40_6_77_AETHER_PRE_REVEAL_POSITION_LOCK.zip | tee AGENT_CRYPTO_BUILD_40_6_77_AETHER_PRE_REVEAL_POSITION_LOCK.sha256

      - name: Remove one-shot workflow and commit one canonical build
        run: |
          git rm .github/workflows/agent-crypto-406077-release.yml
          git config user.name "BlueAzur-Hub"
          git config user.email "Blue.Azur@protonmail.com"
          git add \
            "$ADMIN/index.html" \
            "$ADMIN/build.json" \
            "$ADMIN/js/aether-role-visibility-406050.js" \
            "$ADMIN/js/aether-frame-406077.js" \
            "$ADMIN/RELEASE_40_6_77.md"
          git diff --cached --check
          git commit -m "release(agent-crypto): promote Administrator 40.6.77 Aether pre-reveal position lock"
          git push origin HEAD:main

      - name: Upload exact 40.6.77 ZIP
        uses: actions/upload-artifact@v4
        with:
          name: AGENT_CRYPTO_BUILD_40_6_77_AETHER_PRE_REVEAL_POSITION_LOCK
          path: |
            AGENT_CRYPTO_BUILD_40_6_77_AETHER_PRE_REVEAL_POSITION_LOCK.zip
            AGENT_CRYPTO_BUILD_40_6_77_AETHER_PRE_REVEAL_POSITION_LOCK.sha256
          if-no-files-found: error
          retention-days: 30
