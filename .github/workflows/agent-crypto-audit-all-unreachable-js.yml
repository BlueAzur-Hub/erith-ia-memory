name: Agent Crypto audit all unreachable JavaScript

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/agent-crypto-audit-all-unreachable-js.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Synchronize
        run: git pull --ff-only origin main

      - name: Audit complete JavaScript reachability
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json, re

          ROOT = Path('public/agent_crypto_erith_ia/administrator')
          ENTRY = Path('runtime-shell.html')
          HTML_JS_RE = re.compile(r'(?:src|href)=["\'](?P<ref>[^"\']+\.js(?:\?[^"\']*)?)["\']', re.I)
          JS_PATH_RE = re.compile(r'(?P<ref>(?:\.\.?/|/)?js/[A-Za-z0-9_./-]+\.js)(?:\?[^"\'`\s)]*)?', re.I)
          REL_JS_RE = re.compile(r'(?P<ref>\.\.?/[A-Za-z0-9_./-]+\.js)(?:\?[^"\'`\s)]*)?', re.I)

          def strip_query(ref): return ref.split('?',1)[0].split('#',1)[0]

          def resolve(source_rel, ref):
              clean=strip_query(ref).replace('\\','/')
              candidates=[]
              if clean.startswith('/'):
                  candidates.append(Path(clean.lstrip('/')))
              elif clean.startswith('js/'):
                  candidates.append(Path(clean))
              elif clean.startswith('./js/'):
                  candidates.append(Path(clean[2:]))
                  try: candidates.append(((ROOT/source_rel).parent/clean).resolve().relative_to(ROOT.resolve()))
                  except Exception: pass
              elif clean.startswith(('./','../')):
                  try: candidates.append(((ROOT/source_rel).parent/clean).resolve().relative_to(ROOT.resolve()))
                  except Exception: pass
                  if clean.startswith('./'): candidates.append(Path(clean[2:]))
              return {rel for rel in candidates if (ROOT/rel).is_file()}

          def refs(text):
              out=[m.group('ref') for m in HTML_JS_RE.finditer(text)]
              out += [m.group('ref') for m in JS_PATH_RE.finditer(text)]
              out += [m.group('ref') for m in REL_JS_RE.finditer(text)]
              return list(dict.fromkeys(out))

          # Runtime graph from the real shell.
          queue=[ENTRY]
          reachable=set(); runtime_edges={}; runtime_texts={}
          while queue:
              rel=queue.pop(0)
              if rel in reachable: continue
              full=ROOT/rel
              if not full.is_file() or full.suffix.lower() not in {'.html','.js'}: continue
              try: text=full.read_text(encoding='utf-8')
              except UnicodeDecodeError: continue
              reachable.add(rel); runtime_texts[rel]=text
              targets=set()
              for ref in refs(text): targets.update(resolve(rel,ref))
              runtime_edges[rel]=targets
              for target in sorted(targets,key=str):
                  if target.suffix.lower() in {'.html','.js'} and target not in reachable:
                      queue.append(target)

          # Full administrator textual dependency graph, including unreachable/history files.
          all_sources={}
          for path in sorted(ROOT.rglob('*')):
              if not path.is_file() or path.suffix.lower() not in {'.html','.js','.json'}: continue
              try: all_sources[path.relative_to(ROOT)] = path.read_text(encoding='utf-8')
              except UnicodeDecodeError: pass

          full_edges={}
          for src,text in all_sources.items():
              targets=set()
              for ref in refs(text): targets.update(resolve(src,ref))
              full_edges[src]=targets

          build=json.loads((ROOT/'build.json').read_text(encoding='utf-8'))
          if str(build.get('build'))!='40.6.124': raise SystemExit(f"Build drifted: {build.get('build')!r}")
          market_core=str(build.get('market_core') or build.get('engine') or '')
          if '38.15.11' not in market_core: raise SystemExit(f'Market Core drifted: {market_core!r}')
          if len(reachable)!=101: raise SystemExit(f'Runtime graph drifted: {len(reachable)}')

          def protection(rel):
              s=str(rel).lower()
              name=rel.name.lower()
              reasons=[]
              if 'aether' in name: reasons.append('AETHER')
              if name.startswith('oracle-') or '/oracle' in s: reasons.append('ORACLE')
              if 'market-core' in name: reasons.append('MARKET_CORE')
              if 'lecture-technique' in name: reasons.append('LECTURE_TECHNIQUE')
              if name.startswith('atlas-') or '/atlas' in s: reasons.append('ATLAS')
              if 'web-classic' in name or 'web-classique' in name: reasons.append('WEB_CLASSIC')
              if 'graph' in name and ('market' in name or 'chart' in name): reasons.append('GRAPH')
              return reasons

          rows=[]
          all_js=sorted(path.relative_to(ROOT) for path in ROOT.rglob('*.js'))
          for rel in all_js:
              inbound_all=sorted(str(src) for src,targets in full_edges.items() if rel in targets and src!=rel)
              inbound_runtime=sorted(str(src) for src,targets in runtime_edges.items() if rel in targets and src!=rel)
              literal_runtime=sorted(str(src) for src,text in runtime_texts.items() if rel.name in text and src!=rel)
              prot=protection(rel)
              if rel in reachable:
                  cls='active_runtime'
              elif prot:
                  cls='unreachable_protected'
              elif inbound_all:
                  cls='unreachable_referenced_history_or_chain'
              else:
                  cls='unreachable_neutral_no_inbound'
              path=ROOT/rel
              rows.append({
                  'path':str(rel),
                  'bytes':path.stat().st_size,
                  'lines':len(path.read_text(encoding='utf-8').splitlines()),
                  'classification':cls,
                  'protection':prot,
                  'inbound_runtime':inbound_runtime,
                  'literal_runtime':literal_runtime,
                  'inbound_all_count':len(inbound_all),
                  'inbound_all':inbound_all[:20],
              })

          counts={}
          for row in rows: counts[row['classification']]=counts.get(row['classification'],0)+1
          neutral=[r for r in rows if r['classification']=='unreachable_neutral_no_inbound']
          history=[r for r in rows if r['classification']=='unreachable_referenced_history_or_chain']
          protected=[r for r in rows if r['classification']=='unreachable_protected']

          print(json.dumps({
              'build':build.get('build'),
              'market_core':market_core,
              'runtime_nodes':len(reachable),
              'total_js_files':len(all_js),
              'counts':counts,
              'unreachable_neutral_no_inbound_count':len(neutral),
              'unreachable_neutral_no_inbound':neutral,
              'unreachable_referenced_history_or_chain_count':len(history),
              'unreachable_referenced_history_or_chain':history,
              'unreachable_protected_count':len(protected),
              'unreachable_protected':protected,
              'mutation':'none'
          },indent=2,ensure_ascii=False))
          PY

      - name: Retire one-shot audit workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Seven Heaven Refactor'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/agent-crypto-audit-all-unreachable-js.yml
          git commit -m 'chore(agent-crypto): retire full JS reachability audit tooling'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo 'Rebase conflict; refusing force-push'
              exit 1
            fi
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*2))
          done
          echo 'Push remained contested after safe retries'
          exit 1
