name: Agent-Crypto 40.6.131 versioning recovery

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/agent-crypto-versioning-recovery-406131.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: agent-crypto-versioning-recovery-406131
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Repair canonical entry and release routes
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin main
          python - <<'PY'
          from pathlib import Path
          import json, datetime, re

          root = Path('public/agent_crypto_erith_ia/administrator')
          index = root / 'index.html'
          build_path = root / 'build.json'
          releases = root / 'releases'

          # Guard: repair only the known broken lineage.
          d = json.loads(build_path.read_text(encoding='utf-8'))
          if d.get('build') != '40.6.130':
              raise SystemExit(f"STOP expected 40.6.130, found {d.get('build')}")
          if d.get('engine') != '38.15.11':
              raise SystemExit(f"STOP Market Core drift: {d.get('engine')}")

          # 1) Canonical Administrator entry must resolve the published build from build.json.
          s = index.read_text(encoding='utf-8')
          old_meta = '<meta name="agent-crypto-loaded-build" content="40.6.124" />'
          if old_meta not in s:
              raise SystemExit('STOP canonical index no longer matches 40.6.124 broken entry')
          s = s.replace(old_meta, '<meta name="agent-crypto-loaded-build" content="" />', 1)
          s = s.replace('''    /* VERSIONECTOMY 40.6.124\n       Loaded build and published build are deliberately separate truths.\n       This entry owns only the build actually being executed.\n       build.json is never consulted to decide the loaded build. */''', '''    /* CANONICAL ENTRY 40.6.131\n       The canonical Administrator URL resolves the published build from build.json\n       before runtime-shell is executed. Historical release entries stay immutable. */''', 1)
          s = s.replace('const LOADED_BUILD = meta("agent-crypto-loaded-build");', 'let LOADED_BUILD = meta("agent-crypto-loaded-build");', 1)
          marker = '    const BUILD_RE = /^\\d+\\.\\d+\\.\\d+$/;\n'
          if marker not in s:
              raise SystemExit('STOP BUILD_RE marker missing')
          addition = marker + '''    const MANIFEST_URL = meta("agent-crypto-published-manifest") || "./build.json";\n\n    async function canonicalIdentity() {\n      const separator = MANIFEST_URL.includes("?") ? "&" : "?";\n      const response = await fetch(`${MANIFEST_URL}${separator}t=${Date.now()}`, {\n        cache: "no-store", credentials: "same-origin"\n      });\n      if (!response.ok) throw new Error(`build.json: HTTP ${response.status}`);\n      const manifest = await response.json();\n      const build = String(manifest?.build || "").trim();\n      const engine = String(manifest?.engine || ENGINE || "").trim();\n      if (!BUILD_RE.test(build)) throw new Error("published build invalide");\n      if (!engine) throw new Error("Market Core absent du manifeste");\n      LOADED_BUILD = build;\n      return Object.freeze({ build, loaded_build: build, engine, source: "canonical-build.json" });\n    }\n'''
          s = s.replace(marker, addition, 1)
          needle = '        const truth = requireReleaseIdentity();'
          if s.count(needle) != 1:
              raise SystemExit(f'STOP canonical truth call count={s.count(needle)}')
          s = s.replace(needle, '        const truth = await canonicalIdentity();', 1)
          index.write_text(s, encoding='utf-8')

          # 2) Historical release entries live two levels below Administrator.
          # Their shell fetch was incorrectly relative to the release directory.
          repaired = []
          if releases.exists():
              for idx in sorted(releases.glob('*/index.html')):
                  text = idx.read_text(encoding='utf-8')
                  broken = 'const SHELL_URL = "./runtime-shell.html";'
                  if broken in text and not (idx.parent / 'runtime-shell.html').exists():
                      text = text.replace(broken, 'const SHELL_URL = "../../runtime-shell.html";', 1)
                      idx.write_text(text, encoding='utf-8')
                      repaired.append(idx.parent.name)

          # 3) Publish 40.6.131 as the recovery checkpoint.
          src = releases / '40.6.130' / 'index.html'
          dst = releases / '40.6.131' / 'index.html'
          if not src.is_file():
              raise SystemExit('STOP 40.6.130 release entry missing')
          dst.parent.mkdir(parents=True, exist_ok=True)
          text = src.read_text(encoding='utf-8').replace('40.6.130', '40.6.131')
          text = text.replace('const SHELL_URL = "./runtime-shell.html";', 'const SHELL_URL = "../../runtime-shell.html";')
          dst.write_text(text, encoding='utf-8')

          # 4) Canonical update target is Administrator root, never a release subfolder.
          d.update({
              'build': '40.6.131',
              'engine': '38.15.11',
              'release': 'VERSIONING RECOVERY',
              'published': True,
              'status': 'versioning_recovery_406131',
              'parent_build': '40.6.130',
              'asset_token': 'market-core-v2.0-alpha-build-40.6.131',
              'administrator_build': '40.6.131',
              'build_label': 'Build 40.6.131 · Administrator',
              'release_status': 'versioning_recovery_406131',
              'market_core': '38.15.11',
              'market_core_modified': False,
              'web_classic_modified': False,
              'aether_modified': False,
              'atlas_current_modified': False,
              'oracle_modified': False,
              'lecture_technique_modified': False,
              'strategy_a_modified': False,
              'automatic_order': False,
              'real_order': False,
              'new_recurring_timer': False,
              'new_observer': False,
              'new_storage_owner': False,
              'entry': './',
              'released_at': datetime.datetime.now(datetime.timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z')
          })
          cvt = d.setdefault('current_version_truth', {})
          cvt.update({
              'published_truth_source': 'build.json',
              'loaded_build_authority': 'administrator/index.html resolves build.json before runtime-shell execution',
              'boot_owner': 'administrator/index.html',
              'runtime_owner': 'js/version-truth.js',
              'runtime_owner_name': 'version-truth',
              'single_visible_owner': True,
              'current_build_hardcoded_in_runtime': False,
              'release_navigation_target': 'canonical administrator root',
              'release_subfolder_required_for_update': False,
              'recurring_timer': False,
              'observer': False,
              'storage_write': False
          })
          d['versioning_recovery'] = {
              'introduced_in': '40.6.131',
              'root_cause': '40.6.124 immutable-entry conversion left canonical index pinned to 40.6.124 while later manifests pointed update navigation at release directories whose bootstrap fetched a missing local runtime-shell.html',
              'canonical_entry_dynamic': True,
              'canonical_entry_source': 'build.json',
              'published_entry': './',
              'historical_release_shell_path': '../../runtime-shell.html',
              'historical_release_entries_repaired': repaired,
              'market_core_changed': False,
              'graph_changed': False,
              'lecture_technique_changed': False,
              'aether_changed': False,
              'oracle_changed': False,
              'strategy_a_changed': False,
              'tradus_changed': False,
              'automatic_order': False,
              'real_order': False
          }
          lineage = d.setdefault('recent_validated_lineage', [])
          label = '40.6.131 VERSIONING RECOVERY'
          if label not in lineage:
              lineage.append(label)
          build_path.write_text(json.dumps(d, ensure_ascii=False, separators=(',', ':')) + '\n', encoding='utf-8')

          # Static proofs: no new feature surgery, only version transport/boot.
          root_index = index.read_text(encoding='utf-8')
          release_131 = dst.read_text(encoding='utf-8')
          final = json.loads(build_path.read_text(encoding='utf-8'))
          assert '<meta name="agent-crypto-loaded-build" content="" />' in root_index
          assert 'await canonicalIdentity()' in root_index
          assert 'build.json is never consulted to decide the loaded build' not in root_index
          assert final['build'] == '40.6.131'
          assert final['entry'] == './'
          assert final['market_core'] == '38.15.11'
          assert 'const SHELL_URL = "../../runtime-shell.html";' in release_131
          print('VERSIONING_RECOVERY_STATIC_PASS', repaired, final['build'], final['entry'])
          PY

          git diff --check
          git add public/agent_crypto_erith_ia/administrator
          git commit -m "release(agent-crypto): publish 40.6.131 versioning recovery"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Final summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('public/agent_crypto_erith_ia/administrator/build.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          print('BUILD', d['build'])
          print('ENTRY', d.get('entry'))
          print('ENGINE', d['engine'])
          print('STATUS', d['status'])
          PY
