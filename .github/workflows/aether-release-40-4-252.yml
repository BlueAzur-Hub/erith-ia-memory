name: Aether Agent-Crypto 40.4.252 recovery

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/aether-release-40-4-252.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Recover Technical Reading 40.4.252
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json, hashlib, re

          root = Path('public/agent_crypto_erith_ia/administrator')
          OLD='40.4.251'
          NEW='40.4.252'
          RELEASE='TECHNICAL READING 40.4.250 RUNTIME RESTORE · CHRONOS 40.4.251 HOLD'
          STATUS='technical_reading_404250_runtime_restore_chronos_hold_404252'

          current=json.loads((root/'version.json').read_text(encoding='utf-8'))
          if current.get('build') != OLD:
              raise SystemExit(f'STOP: expected {OLD}, got {current.get("build")}')
          if str((current.get('engine') or {}).get('reference_build')) != '38.15.11':
              raise SystemExit('STOP: Market Core drift')

          p=root/'index.html'
          t=p.read_text(encoding='utf-8')
          t=t.replace('<meta name="atlas-build" content="40.4.251" />','<meta name="atlas-build" content="40.4.252" />')
          t=t.replace('<meta name="administrator-build" content="40.4.251" />','<meta name="administrator-build" content="40.4.252" />')
          t=t.replace('<meta name="administrator-release" content="TECHNICAL READING FRAMING · CHRONOS CENTER TRUTH LOCK" />',f'<meta name="administrator-release" content="{RELEASE}" />')
          t=t.replace('market-core-v2.0-alpha-build-40.4.251','market-core-v2.0-alpha-build-40.4.252')
          t=t.replace('Agent-Crypto @erith.IA — Build 40.4.251 · Administrator','Agent-Crypto @erith.IA — Build 40.4.252 · Administrator')
          t=t.replace('Version Agent-Crypto installée : Build 40.4.251, mode Administrator','Version Agent-Crypto installée : Build 40.4.252, mode Administrator')
          t=t.replace('>Build 40.4.251</span>','>Build 40.4.252</span>')
          t=t.replace('Agent-Crypto @erith.IA · Market Core · Build 40.4.251 · Version : Parker Lewis Can\'t Lose','Agent-Crypto @erith.IA · Market Core · Build 40.4.252 · Version : Parker Lewis Can\'t Lose')
          t=t.replace('./parallel-markets.css?v=40.4.251','./parallel-markets.css?v=40.4.252')
          t=t.replace('./js/views/system-presentation.js?v=administrator-build-40.4.251','./js/views/system-presentation.js?v=administrator-build-40.4.252')
          t=t.replace('./app.js?v=administrator-build-40.4.251','./app.js?v=administrator-build-40.4.252')
          t=t.replace('./js/parallel-markets.js?v=40.4.251','./js/parallel-markets.js?v=40.4.252')
          t=t.replace('./js/version-truth.js?v=40.4.251','./js/version-truth.js?v=40.4.252')
          t=t.replace('./admin-chronos.css?v=administrator-build-40.4.251','./admin-chronos.css?v=administrator-build-40.4.252')

          block='''  /* 40.4.251 — FRAMING TRUTH LOCK. Historical 50/12 private fallback\n     is interpreted as centered without rewriting operator IndexedDB. */\n  function normalizePrivateFraming404251(framing){\n    const rawX=Number.parseFloat(framing?.x),rawY=Number.parseFloat(framing?.y);\n    const x=Number.isFinite(rawX)?Math.min(100,Math.max(0,rawX)):50;\n    let y=Number.isFinite(rawY)?Math.min(100,Math.max(0,rawY)):50;\n    if(Math.abs(x-50)<.001&&Math.abs(y-12)<.001)y=50;\n    return {x,y};\n  }\n'''
          if block not in t:
              raise SystemExit('STOP: .251 framing block not found')
          t=t.replace(block,'',1)

          old='framing:normalizePrivateFraming404251(null),updated_at:new Date().toISOString()'
          new='framing:{x:50,y:12},updated_at:new Date().toISOString()'
          if old not in t: raise SystemExit('STOP: .251 picker framing not found')
          t=t.replace(old,new,1)

          old='setFraming(theme,normalizePrivateFraming404251(framing));'
          new='setFraming(theme,framing||{x:50,y:12});'
          if old not in t: raise SystemExit('STOP: .251 private framing call not found')
          t=t.replace(old,new,1)

          old='p.classList.add("atlas-tech-static-cycle","atlas-classic-web-tech-40261");p.classList.remove("atlas-tech-letterbox-fill-40230","atlas-tech-frame-lock-40259");'
          new='p.classList.add("atlas-tech-static-cycle","atlas-tech-letterbox-fill-40230","atlas-tech-frame-lock-40259","atlas-classic-web-tech-40261");'
          if old not in t: raise SystemExit('STOP: .251 class-removal owner not found')
          t=t.replace(old,new,1)
          p.write_text(t,encoding='utf-8')

          for rel in ['app.js','js/app.js']:
              p=root/rel
              s=p.read_text(encoding='utf-8')
              s=s.replace(OLD,NEW).replace('TECHNICAL READING FRAMING · CHRONOS CENTER TRUTH LOCK',RELEASE)
              p.write_text(s,encoding='utf-8')

          contract={
            'build':NEW,
            'parent':OLD,
            'scope':'technical_reading_404250_runtime_restore_after_404251_regression',
            'regression_confirmed_by_firefox':True,
            'regression_cause':'40.4.251 ensureToolbar removed atlas-tech-letterbox-fill-40230 and atlas-tech-frame-lock-40259 after legacy continuity bootstrap',
            'restored_runtime_classes':['atlas-tech-letterbox-fill-40230','atlas-tech-frame-lock-40259'],
            'private_framing_behavior':'40.4.250 exact x50/y12 fallback restored',
            'admin_visual_assets_404245_changed':False,
            'chronos_404251_preserved':True,
            'chronos_css_changed':False,
            'rnd_library_changed':False,
            'market_graph_changed':False,
            'atlas_changed':False,
            'market_core_changed':False,
            'protected_market_core':'38.15.11',
            'firefox_operator_validation_required':True
          }

          for name in ['build.json','version.json','administrator-version.json']:
              p=root/name
              d=json.loads(p.read_text(encoding='utf-8'))
              d['build']=NEW; d['release']=RELEASE; d['status']=STATUS
              if name=='build.json':
                  d['published']=False
              else:
                  d['asset_token']=f'market-core-v2.0-alpha-build-{NEW}'
                  d['parent_build']=OLD
                  if name=='administrator-version.json': d['global_versioning']=NEW
                  d.setdefault('contracts',{})['technical_reading_regression_recovery_404252']=contract
                  note='40.4.252 — Firefox recovery: exact 40.4.250 Technical Reading runtime/class contract restored after 40.4.251 blank-panel regression; 40.4.245 geometry and 40.4.251 Chronos centering preserved.'
                  if isinstance(d.get('release_notes'),list) and note not in d['release_notes']:
                      d['release_notes'].insert(0,note)
                  if isinstance(d.get('lineage'),str) and '40.4.252' not in d['lineage']:
                      d['lineage'] += ' → 40.4.252 restores the exact 40.4.250 Technical Reading runtime/class contract after the 40.4.251 blank-panel regression while preserving 40.4.245 geometry and 40.4.251 Chronos centering'
              p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          vp=root/'version.json'; v=json.loads(vp.read_text(encoding='utf-8'))
          for rel in ['index.html','app.js','js/app.js','build.json','administrator-version.json']:
              if rel in v.get('files',{}):
                  v['files'][rel]=hashlib.sha256((root/rel).read_bytes()).hexdigest()
          vp.write_text(json.dumps(v,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          idx=(root/'index.html').read_text(encoding='utf-8')
          chron=(root/'admin-chronos.css').read_text(encoding='utf-8')
          visual=(root/'admin-visual-assets.css').read_text(encoding='utf-8')
          assert 'normalizePrivateFraming404251' not in idx
          assert 'framing:{x:50,y:12}' in idx
          assert 'setFraming(theme,framing||{x:50,y:12});' in idx
          assert 'p.classList.add("atlas-tech-static-cycle","atlas-tech-letterbox-fill-40230","atlas-tech-frame-lock-40259","atlas-classic-web-tech-40261");' in idx
          assert 'p.classList.remove("atlas-tech-letterbox-fill-40230","atlas-tech-frame-lock-40259")' not in idx
          assert 'display:grid !important;' in chron
          assert 'grid-template-columns:minmax(0,1fr) !important;' in chron
          assert 'justify-content:center !important;' in chron
          assert 'TECHNICAL_READING_CANONICAL_OWNER_404245' in visual
          assert 'height:136px!important;' in visual and 'flex:0 0 136px!important;' in visual
          assert 'object-fit:cover!important;' in visual
          v=json.loads((root/'version.json').read_text(encoding='utf-8'))
          assert v['build']==NEW and v['parent_build']==OLD
          assert v['engine']['reference_build']=='38.15.11' and v['engine']['status']=='protected'
          for rel,expected in (v.get('files') or {}).items():
              fp=root/rel
              if not fp.is_file(): raise SystemExit(f'STOP: manifest file missing {rel}')
              actual=hashlib.sha256(fp.read_bytes()).hexdigest()
              if actual!=expected: raise SystemExit(f'STOP: hash mismatch {rel}')
          ids=re.findall(r'\bid=["\']([^"\']+)["\']',idx)
          if len(ids)!=len(set(ids)): raise SystemExit('STOP: duplicate HTML IDs')
          PY

      - name: JavaScript syntax gates
        shell: bash
        run: |
          set -euo pipefail
          ROOT=public/agent_crypto_erith_ia/administrator
          node --check "$ROOT/app.js"
          node --check "$ROOT/js/app.js"
          python - <<'PY'
          from pathlib import Path
          import re, subprocess
          t=Path('public/agent_crypto_erith_ia/administrator/index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',t,flags=re.S|re.I)
          for i,s in enumerate(scripts):
              if not s.strip(): continue
              p=Path('/tmp')/f'inline_{i}.js'; p.write_text(s,encoding='utf-8')
              subprocess.run(['node','--check',str(p)],check=True)
          PY

      - name: Build recovery ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/release
          python - <<'PY'
          from pathlib import Path
          import zipfile, hashlib
          root=Path('public/agent_crypto_erith_ia/administrator')
          out=Path('/tmp/release/AGENT_CRYPTO_BUILD_40_4_252_TECHNICAL_READING_404250_RUNTIME_RESTORE_CHRONOS_404251_HOLD_CLEAN_UPLOAD.zip')
          files=['build.json','version.json','administrator-version.json','index.html','app.js','js/app.js','admin-chronos.css','admin-visual-assets.css']
          with zipfile.ZipFile(out,'w',zipfile.ZIP_DEFLATED,compresslevel=9) as z:
              for rel in files:
                  z.write(root/rel, f'public/agent_crypto_erith_ia/administrator/{rel}')
          print('ZIP_SHA256='+hashlib.sha256(out.read_bytes()).hexdigest())
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: AGENT_CRYPTO_BUILD_40_4_252_TECHNICAL_READING_404250_RUNTIME_RESTORE_CHRONOS_404251_HOLD_CLEAN_UPLOAD
          path: /tmp/release/AGENT_CRYPTO_BUILD_40_4_252_TECHNICAL_READING_404250_RUNTIME_RESTORE_CHRONOS_404251_HOLD_CLEAN_UPLOAD.zip
          retention-days: 30

      - name: Commit release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Aether Release Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/agent_crypto_erith_ia/administrator
          git commit -m "agent-crypto: build 40.4.252 restore Technical Reading 40.4.250 runtime"
          git push origin HEAD:main
