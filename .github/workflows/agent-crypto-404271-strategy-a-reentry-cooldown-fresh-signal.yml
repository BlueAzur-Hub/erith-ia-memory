name: Agent-Crypto 40.4.271 Strategy A Re-entry Cooldown Fresh-Signal

on:
  push:
    branches: [ main ]
    paths:
      - '.github/scripts/agent_crypto_404271_strategy_a_reentry_cooldown_fresh_signal.py'
      - '.github/workflows/agent-crypto-404271-strategy-a-reentry-cooldown-fresh-signal.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configure release identity
        run: |
          git config user.name "Seven Heaven Release"
          git config user.email "actions@users.noreply.github.com"

      - name: Rebase on current main
        run: git pull --rebase origin main

      - name: Build validate and package 40.4.271
        run: python .github/scripts/agent_crypto_404271_strategy_a_reentry_cooldown_fresh_signal.py

      - name: Commit release and retire temporary tooling
        run: |
          git rm .github/scripts/agent_crypto_404271_strategy_a_reentry_cooldown_fresh_signal.py
          git rm .github/workflows/agent-crypto-404271-strategy-a-reentry-cooldown-fresh-signal.yml
          git add public/agent_crypto_erith_ia/administrator coordination/inter_ai_dialogues/agent_crypto
          git commit -m "agent-crypto: build 40.4.271 strategy a re-entry cooldown fresh-signal lock"
          git push origin HEAD:main

      - name: Upload differential release artifact
        uses: actions/upload-artifact@v4
        with:
          name: AGENT_CRYPTO_40_4_271_STRATEGY_A_REENTRY_COOLDOWN_FRESH_SIGNAL
          path: |
            coordination/inter_ai_dialogues/agent_crypto/AGENT_CRYPTO_40_4_271_STRATEGY_A_REENTRY_COOLDOWN_FRESH_SIGNAL.zip
            coordination/inter_ai_dialogues/agent_crypto/AGENT_CRYPTO_40_4_271_STRATEGY_A_REENTRY_COOLDOWN_FRESH_SIGNAL_SHA256.txt
            coordination/inter_ai_dialogues/agent_crypto/AGENT_CRYPTO_40_4_271_STRATEGY_A_REENTRY_COOLDOWN_FRESH_SIGNAL_REPORT.md
          if-no-files-found: error
