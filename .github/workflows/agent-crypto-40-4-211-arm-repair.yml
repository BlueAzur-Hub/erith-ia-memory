name: Agent-Crypto 40.4.211 Arm Repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/agent-crypto-40-4-211-arm-repair.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Repair protected hash preflight and rearm
        run: |
          git fetch origin main
          git reset --hard origin/main
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/agent-crypto-40-4-211-version-display-authority.yml')
          s=p.read_text(encoding='utf-8')
          old='            public/agent_crypto_erith_ia/administrator/admin-window-manager.js \\\n'
          if old not in s:
              raise SystemExit('404211_ARM_REPAIR_FAIL missing stale protected path')
          p.write_text(s.replace(old,'',1),encoding='utf-8')
          PY
          git rm .github/workflows/agent-crypto-40-4-211-arm-repair.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore(agent-crypto): rearm 40.4.211 after preflight path repair'
          git pull --rebase origin main
          git push origin HEAD:main
