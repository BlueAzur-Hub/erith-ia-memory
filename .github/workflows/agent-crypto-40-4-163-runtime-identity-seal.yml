name: Agent-Crypto 40.4.163 Runtime Identity Seal

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/agent-crypto-40-4-163-runtime-identity-seal.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: agent-crypto-40-4-163-runtime-identity-seal
  cancel-in-progress: false

jobs:
  seal:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Seal loaded runtime identity and synchronize hashes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, re

          root = Path('public/agent_crypto_erith_ia/administrator')
          app = root/'app.js'
          jsapp = root/'js/app.js'
          index = root/'index.html'
          rnd10 = root/'assets/visual/technical-reading/technical-random-10.png'

          text = app.read_text(encoding='utf-8')
          old = 'const ATLAS_BUILD = "40.4.160";'
          new = 'const ATLAS_BUILD = "40.4.163";'
          if old in text:
              text = text.replace(old, new, 1)
              app.write_text(text, encoding='utf-8')
          elif new not in text:
              raise SystemExit('ATLAS_BUILD owner not found at expected identity surface')

          # Guard canonical public identity surfaces.
          if 'const ADMIN_BUILD = "40.4.163";' not in jsapp.read_text(encoding='utf-8'):
              raise SystemExit('js/app.js ADMIN_BUILD is not 40.4.163')
          html = index.read_text(encoding='utf-8')
          if '<meta name="administrator-build" content="40.4.163"' not in html:
              raise SystemExit('index.html administrator-build is not 40.4.163')
          if not rnd10.is_file():
              raise SystemExit('RND10 missing')

          def sha(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()

          hashes = {
              'app.js': sha(app),
              'js/app.js': sha(jsapp),
              'index.html': sha(index),
              'assets/visual/technical-reading/technical-random-10.png': sha(rnd10),
          }

          def update_hash_maps(node):
              if isinstance(node, dict):
                  for k, v in list(node.items()):
                      if k in ('files',) and isinstance(v, dict):
                          for rel, digest in hashes.items():
                              if rel in v:
                                  v[rel] = digest
                      if k == 'app_sha256' and isinstance(v, str):
                          node[k] = hashes['app.js']
                      update_hash_maps(v)
              elif isinstance(node, list):
                  for item in node:
                      update_hash_maps(item)

          admin_path = root/'administrator-version.json'
          admin = json.loads(admin_path.read_text(encoding='utf-8'))
          if str(admin.get('build')) != '40.4.163':
              raise SystemExit(f'administrator-version build is {admin.get("build")}')
          update_hash_maps(admin)
          admin_path.write_text(json.dumps(admin, ensure_ascii=False, indent=2)+'\n', encoding='utf-8')
          admin_sha = sha(admin_path)

          version_path = root/'version.json'
          version = json.loads(version_path.read_text(encoding='utf-8'))
          if str(version.get('build')) != '40.4.163':
              raise SystemExit(f'version build is {version.get("build")}')
          update_hash_maps(version)
          # Synchronize administrator-version reference wherever already declared.
          def sync_admin_ref(node):
              if isinstance(node, dict):
                  for k, v in list(node.items()):
                      if k == 'administrator-version.json' and isinstance(v, str):
                          node[k] = admin_sha
                      else:
                          sync_admin_ref(v)
              elif isinstance(node, list):
                  for item in node:
                      sync_admin_ref(item)
          sync_admin_ref(version)
          version_path.write_text(json.dumps(version, ensure_ascii=False, indent=2)+'\n', encoding='utf-8')

          print({'build':'40.4.163','atlas_build_owner':'app.js','hashes':hashes})
          PY

      - name: Validate sealed runtime identity
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'const ATLAS_BUILD = "40.4.163";' public/agent_crypto_erith_ia/administrator/app.js >/dev/null
          grep -F 'const ADMIN_BUILD = "40.4.163";' public/agent_crypto_erith_ia/administrator/js/app.js >/dev/null
          grep -F '<meta name="administrator-build" content="40.4.163"' public/agent_crypto_erith_ia/administrator/index.html >/dev/null
          python -m json.tool public/agent_crypto_erith_ia/administrator/version.json >/dev/null
          python -m json.tool public/agent_crypto_erith_ia/administrator/administrator-version.json >/dev/null

      - name: Commit seal and retire one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/agent-crypto-40-4-163-runtime-identity-seal.yml
          git add public/agent_crypto_erith_ia/administrator/app.js \
                  public/agent_crypto_erith_ia/administrator/version.json \
                  public/agent_crypto_erith_ia/administrator/administrator-version.json
          git commit -m "fix Agent-Crypto 40.4.163 loaded runtime identity"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git pull --rebase origin main
            sleep $((attempt * 2))
          done
          exit 1
