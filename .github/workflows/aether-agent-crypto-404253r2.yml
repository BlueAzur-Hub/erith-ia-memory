name: Aether Agent-Crypto 40.4.253R2 Technical Reading Cartouche Hotfix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/aether-agent-crypto-404253r2.yml

permissions:
  contents: write

env:
  BUILD: 40.4.253
  HOTFIX: 40.4.253R2

concurrency:
  group: aether-agent-crypto-404253r2
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "Aether Release Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Restore historical Technical Reading cartouche breathing zone
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          css_path = Path('public/agent_crypto_erith_ia/administrator/admin-visual-assets.css')
          css = css_path.read_text(encoding='utf-8')

          old = '''  /* 40.4.253R1: neutralize the obsolete 40.2.84 vertical drift after restoring the Classic 136px host. */\n  transform:none!important;'''
          new = '''  /* 40.4.253R2 — historical 40.2.83 contract: the Agent-Crypto · Aerith-10 cartouche\n     must sit in the breathing zone immediately above ACTIF / PRIX / DECISION / 24H.\n     The current 136px Classic host already absorbs the later geometry shift, so restore\n     only the historical minimum descent (52px), without moving the four cards. */\n  transform:translateY(52px)!important;'''

          if css.count(old) != 1:
              raise SystemExit(f'FAIL: expected exactly one R1 cartouche owner, got {css.count(old)}')
          css = css.replace(old, new, 1)
          css_path.write_text(css, encoding='utf-8')

          index_path = Path('public/agent_crypto_erith_ia/administrator/index.html')
          index = index_path.read_text(encoding='utf-8')
          old_token = './admin-visual-assets.css?v=administrator-build-40.4.253R1'
          new_token = './admin-visual-assets.css?v=administrator-build-40.4.253R2'
          if index.count(old_token) != 1:
              raise SystemExit(f'FAIL: expected one R1 cache token, got {index.count(old_token)}')
          index_path.write_text(index.replace(old_token, new_token, 1), encoding='utf-8')
          PY

      - name: Static gates
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          css = Path('public/agent_crypto_erith_ia/administrator/admin-visual-assets.css').read_text(encoding='utf-8')
          index = Path('public/agent_crypto_erith_ia/administrator/index.html').read_text(encoding='utf-8')
          build = Path('public/agent_crypto_erith_ia/administrator/build.json').read_text(encoding='utf-8')

          assert 'height:136px!important;' in css
          assert 'flex:0 0 136px!important;' in css
          assert 'overflow:visible!important;' in css
          assert 'object-fit:cover!important;' in css
          assert 'top:156px!important;' in css
          assert 'transform:translateY(52px)!important;' in css
          assert 'transform:none!important;' not in css[css.find('body.atlas-administrator-mirror #detailPanel .detail-project-visual.admin-tech-r3 > span{'):css.find('body.atlas-administrator-mirror #detailPanel .detail-project-visual.admin-tech-r3::after,')]
          assert './admin-visual-assets.css?v=administrator-build-40.4.253R2' in index
          assert '"build": "40.4.253"' in build
          assert '"engine": "38.15.11"' in build
          print('PASS: historical cartouche breathing zone restored; cards/image/136px host untouched.')
          PY

      - name: Build hotfix ZIP
        shell: bash
        run: |
          mkdir -p dist
          zip -j "dist/AGENT_CRYPTO_BUILD_40_4_253R2_TECHNICAL_READING_CARTOUCHE_BREATHING_ZONE_HOTFIX.zip" \
            public/agent_crypto_erith_ia/administrator/admin-visual-assets.css \
            public/agent_crypto_erith_ia/administrator/index.html \
            public/agent_crypto_erith_ia/administrator/build.json \
            public/agent_crypto_erith_ia/administrator/version.json \
            public/agent_crypto_erith_ia/administrator/administrator-version.json
          sha256sum dist/*.zip | tee dist/SHA256.txt

      - name: Upload hotfix artifact
        uses: actions/upload-artifact@v4
        with:
          name: AGENT_CRYPTO_BUILD_40_4_253R2_TECHNICAL_READING_CARTOUCHE_BREATHING_ZONE_HOTFIX
          path: dist/*
          if-no-files-found: error

      - name: Commit hotfix
        shell: bash
        run: |
          git add public/agent_crypto_erith_ia/administrator/admin-visual-assets.css \
                  public/agent_crypto_erith_ia/administrator/index.html
          git commit -m "agent-crypto: hotfix 40.4.253R2 restore Technical Reading cartouche breathing zone"
          for try in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && break
            test "$try" = 3 && exit 1
            sleep 2
          done

      - name: Remove one-shot driver
        shell: bash
        run: |
          rm .github/workflows/aether-agent-crypto-404253r2.yml
          git add .github/workflows/aether-agent-crypto-404253r2.yml
          git commit -m "chore: disarm Aether Technical Reading cartouche hotfix 40.4.253R2"
          for try in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && break
            test "$try" = 3 && exit 1
            sleep 2
          done
