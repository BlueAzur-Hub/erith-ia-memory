name: Agent-Crypto 40.4.227 Parallel Markets Crypto Canvas Visual Grammar

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: agent-crypto-40-4-227-parallel-canvas
  cancel-in-progress: false

jobs:
  release:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebase and parent guard
        shell: bash
        run: |
          git fetch origin main
          git checkout main
          git pull --ff-only origin main
          echo "BASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          python3 - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('public/agent_crypto_erith_ia/administrator/version.json').read_text(encoding='utf-8'))
          assert m['build']=='40.4.226', m['build']
          assert m['engine']['reference_build']=='38.15.11'
          assert m['engine']['status']=='protected'
          print('PARENT_PASS 40.4.226 / Market Core 38.15.11 PROTECTED')
          PY

      - name: Apply bounded parallel canvas visual grammar
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          base=Path('public/agent_crypto_erith_ia/administrator')
          js_p=base/'js/parallel-markets.js'
          css_p=base/'parallel-markets.css'
          idx_p=base/'index.html'
          sys_p=base/'js/views/system-presentation.js'
          js=js_p.read_text(encoding='utf-8')
          css=css_p.read_text(encoding='utf-8')
          idx=idx_p.read_text(encoding='utf-8')
          system=sys_p.read_text(encoding='utf-8')

          primitives=('fetch(','setInterval(','setTimeout(','MutationObserver(','WebSocket(','requestAnimationFrame(')
          before={t:js.count(t) for t in primitives}

          def one(old,new,label):
              global js
              if js.count(old)!=1:
                  raise SystemExit(f'{label}: expected 1, got {js.count(old)}')
              js=js.replace(old,new,1)

          one('const BUILD = "40.4.211";','const BUILD = "40.4.227";','parallel BUILD')
          one('const pad = {l:54,r:24,t:24,b:42}, w = width-pad.l-pad.r, h=height-pad.t-pad.b;',
              'const pad = {l:62,r:24,t:24,b:42}, w = width-pad.l-pad.r, h=height-pad.t-pad.b;',
              'canvas padding')
          one('let min = Math.min(...all), max = Math.max(...all); if (!Number.isFinite(min)||!Number.isFinite(max)) return;\n    const span = Math.max(.1,max-min); min -= span*.08; max += span*.08;',
              'let min = Math.min(100,...all), max = Math.max(100,...all); if (!Number.isFinite(min)||!Number.isFinite(max)) return;\n    const span = Math.max(.4,max-min); const visualPad = Math.max(.18,span*.10); min -= visualPad; max += visualPad;',
              'base100 y-range')
          one('ctx.font = "11px system-ui"; ctx.fillStyle = "rgba(197,215,226,.72)";\n    for (let i=0;i<=5;i++){ const v=max-(max-min)*(i/5); ctx.fillText(v.toFixed(1),8,pad.t+(h/5)*i+4); }',
              'ctx.font = "700 10px system-ui"; ctx.fillStyle = "rgba(197,215,226,.72)"; ctx.textAlign = "right";\n    for (let i=0;i<=5;i++){ const v=max-(max-min)*(i/5); ctx.fillText(v.toFixed(1),pad.l-9,pad.t+(h/5)*i+4); }\n    if (100>=min && 100<=max) { const y100=pad.t+(1-((100-min)/(max-min)))*h; ctx.save(); ctx.setLineDash([6,5]); ctx.strokeStyle="rgba(238,214,142,.42)"; ctx.lineWidth=1.15; ctx.beginPath(); ctx.moveTo(pad.l,y100); ctx.lineTo(width-pad.r,y100); ctx.stroke(); ctx.setLineDash([]); ctx.textAlign="left"; ctx.fillStyle="rgba(255,232,164,.82)"; ctx.font="900 9px system-ui"; ctx.fillText("BASE 100",pad.l+7,Math.max(pad.t+10,y100-9)); ctx.restore(); }',
              'base100 reference')
          one('[0,.5,1].forEach((ratio,index) => {',
              '[0,.2,.4,.6,.8,1].forEach((ratio,index) => {',
              'time density')
          one('ctx.textAlign = index===0 ? "left" : index===2 ? "right" : "center";',
              'ctx.textAlign = index===0 ? "left" : index===5 ? "right" : "center";',
              'time alignment')
          one('ctx.textAlign = "left"; ctx.fillStyle = accent || "#dce5ec"; ctx.font = "800 10px system-ui"; ctx.fillText(`BASE 100 · ${period.toUpperCase()}`, pad.l, height-7);',
              'ctx.textAlign = "left"; ctx.fillStyle = accent || "#dce5ec"; ctx.font = "900 9px system-ui"; ctx.fillText(`BASE 100 · ${period.toUpperCase()} · HISTORIQUE RÉEL`, pad.l, height-7); ctx.textAlign = "right"; ctx.fillStyle = "rgba(132,159,175,.76)"; ctx.font = "800 8px system-ui"; ctx.fillText("SURVOL = POINT RÉEL LE PLUS PROCHE", width-pad.r, height-7);',
              'bottom truth labels')

          after={t:js.count(t) for t in primitives}
          if before!=after:
              raise SystemExit(f'primitive drift {before}->{after}')
          marker='40.4.227 — PARALLEL MARKETS / CRYPTO CANVAS VISUAL GRAMMAR LOCK'
          if marker in css:
              raise SystemExit('40.4.227 CSS already present')
          css += (
              '\n\n/* =========================================================\n'
              '   40.4.227 — PARALLEL MARKETS / CRYPTO CANVAS VISUAL GRAMMAR LOCK\n'
              '   Presentation only. Crypto remains geometry master. Real histories,\n'
              '   Base 100 normalization, sources, periods and hover point truth unchanged.\n'
              '   ========================================================= */\n'
              'html[data-cyclic-market-mode="parallel"] .atlas-parallel-live-stage{border-radius:12px;border-color:color-mix(in srgb,var(--cyclic-market-accent,#a9b9c7) 27%,rgba(116,190,218,.18));background:radial-gradient(circle at 74% 16%,color-mix(in srgb,var(--cyclic-market-accent,#a9b9c7) 8%,transparent),transparent 35%),linear-gradient(180deg,rgba(2,10,18,.72),rgba(2,15,23,.58));box-shadow:inset 0 0 0 1px rgba(255,255,255,.018),inset 0 0 30px rgba(53,162,205,.035)}\n'
              'html[data-cyclic-market-mode="parallel"] .atlas-parallel-live-stage::after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;box-shadow:inset 0 1px rgba(255,255,255,.025),inset 0 -1px rgba(87,188,218,.035)}\n'
              'html[data-cyclic-market-mode="parallel"] .atlas-parallel-live-summary{border-radius:11px;background:linear-gradient(100deg,rgba(4,17,28,.93),rgba(7,22,31,.87));border-color:color-mix(in srgb,var(--cyclic-market-accent,#a9b9c7) 35%,rgba(255,255,255,.08))}\n'
              'html[data-cyclic-market-mode="parallel"] .atlas-parallel-live-legend span{border-radius:999px;background:rgba(3,12,21,.84)}\n'
          )
          js_p.write_text(js,encoding='utf-8')
          css_p.write_text(css,encoding='utf-8')

          cache_changes={
              './parallel-markets.css?v=40.4.210':'./parallel-markets.css?v=40.4.227',
              './js/parallel-markets.js?v=40.4.211':'./js/parallel-markets.js?v=40.4.227',
              'system-presentation.js?v=administrator-build-40.4.226':'system-presentation.js?v=administrator-build-40.4.227'
          }
          for old,new in cache_changes.items():
              if idx.count(old)!=1:
                  raise SystemExit(f'index cache drift {old}: {idx.count(old)}')
              idx=idx.replace(old,new,1)
          idx_p.write_text(idx,encoding='utf-8')

          old_source='const SOURCE="./views/system.html?v=administrator-build-40.4.226";'
          if system.count(old_source)!=1:
              raise SystemExit(f'System SOURCE drift: {system.count(old_source)}')
          sys_p.write_text(system.replace(old_source,'const SOURCE="./views/system.html?v=administrator-build-40.4.227";',1),encoding='utf-8')
          print('PARALLEL_CANVAS_VISUAL_GRAMMAR_PASS')
          PY
          node --check public/agent_crypto_erith_ia/administrator/js/parallel-markets.js
          git diff --check

      - name: Canonical release driver
        shell: bash
        run: |
          cat >/tmp/contract.json <<'JSON'
          {"state":"active","scope":"parallel_market_canvas_presentation_only","crypto_geometry_master":true,"domains":["indices","energy","cross-market"],"metals_native_unchanged":true,"base100_math_changed":false,"history_data_changed":false,"sources_changed":false,"periods_changed":false,"hover_point_truth_changed":false,"market_core_modified":false,"new_chart_engine":false,"new_timer":false,"new_observer":false,"new_fetch":false,"new_websocket":false,"new_scheduler":false}
          JSON
          python3 .github/scripts/agent_crypto_release_driver.py --build 40.4.227 --parent 40.4.226 --release "PARALLEL MARKETS · CRYPTO CANVAS VISUAL GRAMMAR LOCK" --status parallel_market_crypto_canvas_visual_grammar_404227 --contract-key parallel_market_crypto_canvas_visual_grammar_404227 --contract-json /tmp/contract.json --lineage-note "40.4.227 Parallel Markets canvas presentation: Indices, Energy and Cross adopt Crypto-like grid, Base 100 reference and denser real-time axis grammar; real histories, sources, periods, hover truth, Metals native renderer and Market Core unchanged"

      - name: Version Truth and scope proof
        shell: bash
        run: |
          node --check public/agent_crypto_erith_ia/administrator/js/parallel-markets.js
          node --check public/agent_crypto_erith_ia/administrator/app.js
          node --check public/agent_crypto_erith_ia/administrator/js/app.js
          python3 .github/scripts/agent_crypto_version_truth_guard.py --expected-build 40.4.227 --expected-release "PARALLEL MARKETS · CRYPTO CANVAS VISUAL GRAMMAR LOCK"
          python3 - <<'PY'
          from pathlib import Path
          import json, subprocess
          base=Path('public/agent_crypto_erith_ia/administrator')
          js=(base/'js/parallel-markets.js').read_text(encoding='utf-8')
          css=(base/'parallel-markets.css').read_text(encoding='utf-8')
          idx=(base/'index.html').read_text(encoding='utf-8')
          m=json.loads((base/'version.json').read_text(encoding='utf-8'))
          assert m['build']=='40.4.227' and m['parent_build']=='40.4.226'
          assert m['engine']['reference_build']=='38.15.11' and m['engine']['status']=='protected'
          assert 'const BUILD = "40.4.227";' in js
          assert 'BASE 100 · ${period.toUpperCase()} · HISTORIQUE RÉEL' in js
          assert 'SURVOL = POINT RÉEL LE PLUS PROCHE' in js
          assert '40.4.227 — PARALLEL MARKETS / CRYPTO CANVAS VISUAL GRAMMAR LOCK' in css
          assert './parallel-markets.css?v=40.4.227' in idx
          assert './js/parallel-markets.js?v=40.4.227' in idx
          allowed={
            'public/agent_crypto_erith_ia/administrator/js/parallel-markets.js',
            'public/agent_crypto_erith_ia/administrator/parallel-markets.css',
            'public/agent_crypto_erith_ia/administrator/index.html',
            'public/agent_crypto_erith_ia/administrator/js/views/system-presentation.js',
            'public/agent_crypto_erith_ia/administrator/app.js',
            'public/agent_crypto_erith_ia/administrator/js/app.js',
            'public/agent_crypto_erith_ia/administrator/version.json',
            'public/agent_crypto_erith_ia/administrator/administrator-version.json',
            'public/agent_crypto_erith_ia/administrator/build.json'
          }
          lines=subprocess.check_output(['git','status','--porcelain','-uall'],text=True).splitlines()
          paths={line[3:] for line in lines}
          required={
            'public/agent_crypto_erith_ia/administrator/js/parallel-markets.js',
            'public/agent_crypto_erith_ia/administrator/parallel-markets.css',
            'public/agent_crypto_erith_ia/administrator/version.json'
          }
          if not required<=paths:
              raise SystemExit(f'required diff missing: {sorted(paths)}')
          if paths-allowed:
              raise SystemExit(f'out of scope: {sorted(paths-allowed)}')
          print('SCOPE_PASS',sorted(paths))
          PY
          git diff --check

      - name: Commit canonical 40.4.227
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/agent_crypto_erith_ia/administrator/js/parallel-markets.js public/agent_crypto_erith_ia/administrator/parallel-markets.css public/agent_crypto_erith_ia/administrator/index.html public/agent_crypto_erith_ia/administrator/js/views/system-presentation.js public/agent_crypto_erith_ia/administrator/app.js public/agent_crypto_erith_ia/administrator/js/app.js public/agent_crypto_erith_ia/administrator/version.json public/agent_crypto_erith_ia/administrator/administrator-version.json public/agent_crypto_erith_ia/administrator/build.json
          git commit -m "agent-crypto: build 40.4.227 harmonize parallel market canvas grammar"
          echo "RELEASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          git push origin main

      - name: Package changed files only
        shell: bash
        run: |
          PKG=/tmp/agent-crypto-40.4.227
          mkdir -p "$PKG"
          git diff --name-only "$BASE_SHA" "$RELEASE_SHA" > /tmp/changed.txt
          while IFS= read -r p; do mkdir -p "$PKG/$(dirname "$p")"; cp "$p" "$PKG/$p"; done < /tmp/changed.txt
          {
            echo "# Agent-Crypto 40.4.227 — fichiers modifiés"
            echo
            echo "Release: PARALLEL MARKETS · CRYPTO CANVAS VISUAL GRAMMAR LOCK"
            echo "Parent: 40.4.226"
            echo "Market Core: 38.15.11 PROTECTED"
            echo "Canonical commit: $RELEASE_SHA"
            echo
            echo "## Fichiers"
            sed 's/^/- `/' /tmp/changed.txt | sed 's/$/`/'
            echo
            echo "## Verrous"
            echo "- Crypto remains geometry master."
            echo "- Indices / Energy / Cross: presentation-only canvas grammar harmonization."
            echo "- Real histories, Base 100 math, sources, periods and hover point truth unchanged."
            echo "- Metals native renderer unchanged."
            echo "- No new chart engine / timer / observer / fetch / WebSocket / scheduler."
            echo "- Market Core unchanged."
          } > "$PKG/FILES_CHANGED_40.4.227.md"
          (cd "$PKG" && zip -qr "$GITHUB_WORKSPACE/AGENT_CRYPTO_BUILD_40_4_227_PARALLEL_MARKETS_CRYPTO_CANVAS_VISUAL_GRAMMAR_CHANGED_FILES.zip" .)
          sha256sum AGENT_CRYPTO_BUILD_40_4_227_PARALLEL_MARKETS_CRYPTO_CANVAS_VISUAL_GRAMMAR_CHANGED_FILES.zip
          unzip -l AGENT_CRYPTO_BUILD_40_4_227_PARALLEL_MARKETS_CRYPTO_CANVAS_VISUAL_GRAMMAR_CHANGED_FILES.zip

      - name: Upload differential ZIP
        uses: actions/upload-artifact@v4
        with:
          name: AGENT_CRYPTO_BUILD_40_4_227_PARALLEL_MARKETS_CRYPTO_CANVAS_VISUAL_GRAMMAR_CHANGED_FILES
          path: AGENT_CRYPTO_BUILD_40_4_227_PARALLEL_MARKETS_CRYPTO_CANVAS_VISUAL_GRAMMAR_CHANGED_FILES.zip
          include-hidden-files: true
