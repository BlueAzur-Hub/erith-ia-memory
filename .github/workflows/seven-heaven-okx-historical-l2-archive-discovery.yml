name: Seven Heaven OKX Historical L2 Archive Discovery

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/seven-heaven-okx-historical-l2-archive-discovery.yml'
      - 'coordination/inter_ai_dialogues/agent_crypto/research/strategy_profiles/SEVEN_HEAVEN_OKX_HISTORICAL_L2_ARCHIVE_METADATA_DISCOVERY_2026_11_12.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: seven-heaven-okx-historical-l2-metadata-once
  cancel-in-progress: false

jobs:
  public-metadata-only:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax and unit safety checks
        run: |
          set -euo pipefail
          script='coordination/inter_ai_dialogues/agent_crypto/research/strategy_profiles/SEVEN_HEAVEN_OKX_HISTORICAL_L2_ARCHIVE_METADATA_DISCOVERY_2026_11_12.py'
          python -m py_compile "$script"
          python "$script" --selftest
      - name: Inspect official public October 15 historical L2 metadata for two USDC pairs
        run: |
          set -euo pipefail
          python coordination/inter_ai_dialogues/agent_crypto/research/strategy_profiles/SEVEN_HEAVEN_OKX_HISTORICAL_L2_ARCHIVE_METADATA_DISCOVERY_2026_11_12.py
      - name: Verify no archive downloads and source integrity
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,pathlib
          root=pathlib.Path('coordination/inter_ai_dialogues/agent_crypto/research/strategy_profiles/okx_historical_l2_archive_discovery_2026_11_12_evidence')
          data=json.loads((root/'SEVEN_HEAVEN_OKX_HISTORICAL_L2_DISCOVERY_EVIDENCE.json').read_text(encoding='utf8'))
          assert data['schema']=='seven-heaven.okx-historical-l2-archive-discovery.v1'
          assert data['read_only'] and not data['orders_enabled']
          assert not data['archive_downloads_performed'] and not data['l2_market_depth_analysed']
          assert data['status'] in ('links_listed','metadata_only','unavailable')
          assert len(data['results'])==2
          assert [r['pair'] for r in data['results']]==['BTC-USDC','ETH-USDC']
          for r in data['results']:
              if 'response' in r:
                  b=(root/r['response']['raw_file']).read_bytes()
                  assert hashlib.sha256(b).hexdigest()==r['response']['raw_sha256']
                  assert len(b)<=500000
          assert (root/'SEVEN_HEAVEN_OKX_HISTORICAL_L2_DISCOVERY_REPORT.md').exists()
          print('PASS: metadata discovery, no archive downloads, SHA-256 and two intended instruments')
          PY
      - name: Preserve read-only metadata evidence
        uses: actions/upload-artifact@v4
        with:
          name: seven-heaven-okx-historical-l2-metadata-discovery
          path: coordination/inter_ai_dialogues/agent_crypto/research/strategy_profiles/okx_historical_l2_archive_discovery_2026_11_12_evidence/
          retention-days: 90
          if-no-files-found: error
      - name: Publish ONLY research metadata to inter-AI Coffre
        run: |
          set -euo pipefail
          target='coordination/inter_ai_dialogues/agent_crypto/research/strategy_profiles/okx_historical_l2_archive_discovery_2026_11_12_evidence'
          git add -- "$target"
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'NOOP: identical metadata already stored'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'research: archive official OKX L2 historical metadata discovery evidence'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
