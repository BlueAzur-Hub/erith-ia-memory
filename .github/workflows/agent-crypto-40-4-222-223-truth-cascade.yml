name: Agent-Crypto 40.4.222-223 Truth Cascade

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/agent-crypto-40-4-222-223-truth-cascade.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify canonical base
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          base=Path('public/agent_crypto_erith_ia/administrator')
          v=json.loads((base/'version.json').read_text())
          b=json.loads((base/'build.json').read_text())
          assert v['build']=='40.4.221', v['build']
          assert (v.get('engine') or {}).get('reference_build')=='38.15.11'
          assert b.get('engine')=='38.15.11'
          print('BASE_OK', v['build'], b['engine'])
          PY
      - name: Trace current learning archive owner
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          p=Path('public/agent_crypto_erith_ia/administrator/app.js')
          lines=p.read_text(encoding='utf-8').splitlines()
          decl=[]
          for i,l in enumerate(lines):
            if re.search(r'function\s+\w*(?:Learning|learning|Foundation|foundation)\w*',l) and re.search(r'archiv|histor|complete|finish|save|load|journal|memory|carnet|snapshot',l,re.I):
              decl.append((i,l.strip()))
          print('FUNCTIONS')
          for i,l in decl:
            print(f'{i+1}: {l}')
          needles=['Session archivée','archivée','conclusion conservée','Carnet IndexedDB','completed_at','foundationNotebookParts','notes_free','auto_summary']
          for needle in needles:
            hits=[i for i,l in enumerate(lines) if needle in l]
            print(f'NEEDLE {needle!r} HITS {len(hits)}')
            for i in hits[:24]:
              lo=max(0,i-18); hi=min(len(lines),i+28)
              print(f'--- {lo+1}:{hi} ---')
              print('\n'.join(f'{j+1}: {lines[j]}' for j in range(lo,hi)))
          # explicit current cockpit continuation
          lo=33355-1; hi=min(len(lines),33580)
          print('--- COCKPIT_CONTINUATION ---')
          print('\n'.join(f'{j+1}: {lines[j]}' for j in range(lo,hi)))
          PY
