name: Agent-Crypto 40.4.222-223 Truth Cascade

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/agent-crypto-40-4-222-223-truth-cascade.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify canonical base
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          base=Path('public/agent_crypto_erith_ia/administrator')
          v=json.loads((base/'version.json').read_text())
          b=json.loads((base/'build.json').read_text())
          assert v['build']=='40.4.221', v['build']
          assert (v.get('engine') or {}).get('reference_build')=='38.15.11'
          assert b.get('engine')=='38.15.11'
          print('BASE_OK', v['build'], b['engine'])
          PY
      - name: Inspect archive and notebook state owners
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('public/agent_crypto_erith_ia/administrator/app.js')
          lines=p.read_text(encoding='utf-8').splitlines()
          needles=[
            'function restoreReopenedArchivedLearningSession',
            'function archiveLearning',
            'function completeLearning',
            'function finishLearning',
            'learningCompletionAction',
            'completed_at',
            'loadLearningHistory',
            'saveLearningHistory',
            'takeaway',
          ]
          printed=set()
          for needle in needles:
            hits=[i for i,l in enumerate(lines) if needle in l]
            print(f'NEEDLE {needle!r} HITS {len(hits)}')
            for i in hits[:12]:
              # Wider only for named function declarations, narrower for common fields.
              radius=80 if needle.startswith('function ') else 24
              lo=max(0,i-radius); hi=min(len(lines),i+radius+1)
              key=(lo,hi)
              if key in printed: continue
              printed.add(key)
              print(f'--- CONTEXT {lo+1}:{hi} ---')
              print('\n'.join(f'{j+1}: {lines[j]}' for j in range(lo,hi)))
          PY
