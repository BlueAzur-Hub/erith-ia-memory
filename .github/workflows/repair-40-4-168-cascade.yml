name: Repair Agent-Crypto 40.4.168 Cascade

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-40-4-168-cascade.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Repair one-shot and re-arm
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/agent-crypto-40-4-168-skeleton-mirror.yml')
          s=p.read_text(encoding='utf-8')
          s=s.replace("for manifest in [root/'version.json', root/'data/version.json']:", "for manifest in [m for m in [root/'version.json', root/'data/version.json'] if m.exists()]:")
          s=s.replace("python -m json.tool public/agent_crypto_erith_ia/administrator/data/version.json >/dev/null", "test ! -f public/agent_crypto_erith_ia/administrator/data/version.json || python -m json.tool public/agent_crypto_erith_ia/administrator/data/version.json >/dev/null")
          s=s.replace("public/agent_crypto_erith_ia/administrator/version.json public/agent_crypto_erith_ia/administrator/data/version.json", "public/agent_crypto_erith_ia/administrator/version.json")
          p.write_text(s,encoding='utf-8')
          PY
          git rm .github/workflows/repair-40-4-168-cascade.yml
          git add .github/workflows/agent-crypto-40-4-168-skeleton-mirror.yml
          git commit -m "fix Agent-Crypto 40.4.168 cascade current manifest truth"
          git push origin HEAD:main
