name: Agent-Crypto 40.6.24 Internet Research Panel

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/agent-crypto-40624-internet-research-panel.yml

permissions:
  contents: write

concurrency:
  group: agent-crypto-40624-internet-research-panel
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout canonical main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply bounded Internet Research panel
        run: python .github/scripts/agent_crypto_40624_internet_research_panel.py

      - name: Syntax and anti-destruction gates
        shell: bash
        run: |
          set -euo pipefail
          ROOT=public/agent_crypto_erith_ia/administrator
          python -m json.tool "$ROOT/build.json" >/dev/null
          python -m json.tool "$ROOT/administrator-version.json" >/dev/null
          python -m json.tool "$ROOT/version.json" >/dev/null
          node --check "$ROOT/js/internet-research-406024.js"
          git diff --check

          git diff --exit-code -- \
            "$ROOT/admin-chronos.css" \
            "$ROOT/js/version-truth.js" \
            "$ROOT/oracle-presentation-405010.css" \
            "$ROOT/oracle-fx-406013.css" \
            "$ROOT/js/oracle-fx-406013.js" \
            "$ROOT/parallel-markets.css" \
            "$ROOT/market-reading-depth.css" \
            "$ROOT/js/core/admin-window-manager.js" \
            "$ROOT/js/strategy-a-paper-lifecycle-404295.js" \
            "$ROOT/js/app.js" \
            "$ROOT/js/aerith10-workspace-bridge-406021.js" \
            "$ROOT/salon-partage-406022.css" \
            "$ROOT/js/salon-partage-406022.js" \
            "$ROOT/aerith10-portal-406023.css"

          grep -q 'id="internet-research"' "$ROOT/views/atlas.html"
          grep -q 'id="internet-research"' "$ROOT/js/views/atlas-presentation.js"
          grep -q 'data-internet-engine="google"' "$ROOT/views/atlas.html"
          grep -q 'data-internet-engine="bing"' "$ROOT/views/atlas.html"
          grep -q 'data-internet-engine="duckduckgo"' "$ROOT/views/atlas.html"
          grep -q 'page_fetch:false' "$ROOT/js/internet-research-406024.js"
          grep -q 'result_ingestion:false' "$ROOT/js/internet-research-406024.js"
          grep -q '"build": "40.6.24"' "$ROOT/build.json"
          grep -q '"engine": "38.15.11"' "$ROOT/build.json"

          python - <<'PY'
          import subprocess
          allowed={
            'public/agent_crypto_erith_ia/administrator/index.html',
            'public/agent_crypto_erith_ia/administrator/views/atlas.html',
            'public/agent_crypto_erith_ia/administrator/js/views/atlas-presentation.js',
            'public/agent_crypto_erith_ia/administrator/internet-research-406024.css',
            'public/agent_crypto_erith_ia/administrator/js/internet-research-406024.js',
            'public/agent_crypto_erith_ia/administrator/build.json',
            'public/agent_crypto_erith_ia/administrator/administrator-version.json',
            'public/agent_crypto_erith_ia/administrator/version.json',
            'public/agent_crypto_erith_ia/administrator/RELEASE_40_6_24.md',
            'coordination/inter_ai_dialogues/agent_crypto/AGENT_CRYPTO_BUILD_40_6_24_INTERNET_RESEARCH_PANEL_CLEAN_UPLOAD_9_FILES.zip',
            'coordination/inter_ai_dialogues/agent_crypto/AGENT_CRYPTO_BUILD_40_6_24_INTERNET_RESEARCH_PANEL_CLEAN_UPLOAD_9_FILES.zip.sha256',
          }
          out=subprocess.check_output(['git','status','--porcelain=v1','--untracked-files=all'],text=True)
          changed=set()
          for line in out.splitlines():
            if not line.strip():continue
            p=line[3:]
            if ' -> ' in p:p=p.split(' -> ',1)[1]
            changed.add(p)
          extra=changed-allowed;missing=allowed-changed
          if extra:raise SystemExit(f'STOP 40.6.24 unexpected files: {sorted(extra)}')
          if missing:raise SystemExit(f'STOP 40.6.24 missing files: {sorted(missing)}')
          print('40.6.24 bounded diff OK')
          PY

      - name: Commit released build
        shell: bash
        run: |
          set -euo pipefail
          ROOT=public/agent_crypto_erith_ia/administrator
          git config user.name "Seven Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add "$ROOT/index.html" "$ROOT/views/atlas.html" "$ROOT/js/views/atlas-presentation.js" "$ROOT/internet-research-406024.css" "$ROOT/js/internet-research-406024.js" "$ROOT/build.json" "$ROOT/administrator-version.json" "$ROOT/version.json" "$ROOT/RELEASE_40_6_24.md"
          git add coordination/inter_ai_dialogues/agent_crypto/AGENT_CRYPTO_BUILD_40_6_24_INTERNET_RESEARCH_PANEL_CLEAN_UPLOAD_9_FILES.zip
          git add coordination/inter_ai_dialogues/agent_crypto/AGENT_CRYPTO_BUILD_40_6_24_INTERNET_RESEARCH_PANEL_CLEAN_UPLOAD_9_FILES.zip.sha256
          git diff --cached --quiet && { echo 'STOP 40.6.24: no changes'; exit 1; }
          git commit -m "feat(agent-crypto): add source-aware Internet Research panel 40.6.24"
          git pull --rebase origin main
          git push origin HEAD:main
