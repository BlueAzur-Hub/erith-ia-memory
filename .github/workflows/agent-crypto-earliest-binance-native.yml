name: Agent Crypto Verified Earliest Binance Native Months
on:
  pull_request:
    paths:
      - '.github/workflows/agent-crypto-earliest-binance-native.yml'
      - 'public/agent_crypto_erith_ia/tools/backfill_earlier_native_months.py'
      - 'public/agent_crypto_erith_ia/tools/backfill_earlier_native_months_test.py'
      - 'public/agent_crypto_erith_ia/tools/collect_retired_binance_months.py'
      - 'public/agent_crypto_erith_ia/tools/collect_retired_binance_months_test.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/agent-crypto-earliest-binance-native.yml'
      - 'public/agent_crypto_erith_ia/tools/backfill_earlier_native_months.py'
      - 'public/agent_crypto_erith_ia/tools/backfill_earlier_native_months_test.py'
      - 'public/agent_crypto_erith_ia/tools/collect_retired_binance_months.py'
      - 'public/agent_crypto_erith_ia/tools/collect_retired_binance_months_test.py'
  workflow_dispatch:
  schedule:
    # Reuse the same small, source-verified 2-month pilot every two hours;
    # immutable Releases and a serial lock prevent duplicate writes.
    - cron: '7 * * * *'
permissions:
  contents: write
concurrency:
  group: agent-crypto-earliest-binance-verified-backfill
  cancel-in-progress: false
jobs:
  extend-original-months:
    runs-on: ubuntu-latest
    timeout-minutes: 27
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify immutable Binance ZIP import and no coin-genesis claims
        run: |
          set -euo pipefail
          python -m py_compile public/agent_crypto_erith_ia/tools/backfill_earlier_native_months.py
          python public/agent_crypto_erith_ia/tools/backfill_earlier_native_months_test.py
          python public/agent_crypto_erith_ia/tools/backfill_earlier_native_months.py --plan
          python public/agent_crypto_erith_ia/tools/collect_retired_binance_months_test.py
          python public/agent_crypto_erith_ia/tools/collect_retired_binance_months.py --plan
      - name: PR only - inspect first official March 2023 Spot close-timestamp discrepancy
        if: github.event_name == 'pull_request'
        run: |
          python - <<'PY'
          import sys,io,csv,zipfile
          sys.path.insert(0,'public/agent_crypto_erith_ia/tools')
          import import_historical_bulk as b
          for pair in ('BTCUSDT','XMRUSDT'):
              month='2023-03'
              name,url=b.url_for(pair,month,'1m')
              z=b.download(url)
              check=b.download(url+'.CHECKSUM',cap=8192).decode().strip().split()[0]
              assert b.sha256(z)==check
              first=None
              with zipfile.ZipFile(io.BytesIO(z)) as arc:
                  with arc.open(name[:-4]+'.csv') as stream:
                      reader=csv.reader(io.TextIOWrapper(stream,encoding='utf-8-sig',newline=''))
                      for n,fields in enumerate(reader,1):
                          opened=int(fields[0])
                          closed=int(fields[6])
                          if not (opened+59999<=closed<opened+60000):
                              first={'row':n,'opened':opened,'closed':closed,
                                     'delta_ms':closed-opened,
                                     'open_price':fields[1],'close_price':fields[4]}
                              break
              print('BINANCE 2023-03 VERIFIED SHA SOURCE FIRST TIMESTAMP MISMATCH',
                    pair,check,first,flush=True)
          PY
      - name: Acquire four older fully certified Binance native 1m months
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          python public/agent_crypto_erith_ia/tools/backfill_earlier_native_months.py --collect --months 4
      - name: PR only - verify original December 2023 XMR Spot ZIP and official CHECKSUM
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          python public/agent_crypto_erith_ia/tools/collect_retired_binance_months.py --probe
      - name: Collect up to twelve pre-delisting Monero full months (no new bot)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          python public/agent_crypto_erith_ia/tools/collect_retired_binance_months.py --collect --months 12
      - name: Assert original archives and protected trading code untouched
        if: always()
        run: |
          set -euo pipefail
          git diff --exit-code -- \
            public/agent_crypto_erith_ia/trader/ \
            public/agent_crypto_erith_ia/administrator/ \
            public/agent_crypto_erith_ia/core/ \
            public/agent_crypto_erith_ia/data/historical_archive_prototype/top250_history_catalog/ \
            public/agent_crypto_erith_ia/data/historical_archive_prototype/shared_hourly_views/ \
            public/agent_crypto_erith_ia/data/historical_archive_prototype/shared_monthly_views/ \
            public/agent_crypto_erith_ia/data/historical_archive_prototype/calendar_year_hourly_shards/
