name: Agent-Crypto 40.4.221 Simulation Dual Profile Surface Release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/agent-crypto-40-4-221-simulation-release.yml'

permissions:
  contents: write

concurrency:
  group: agent-crypto-40-4-221-simulation-dual-profile-surface
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout canonical main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Execute final bounded 40.4.221 release
        run: python .github/scripts/_tmp_agent_crypto_404221_runner.py
