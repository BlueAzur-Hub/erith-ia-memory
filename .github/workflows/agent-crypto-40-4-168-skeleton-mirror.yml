          html[data-cyclic-market-mode="inert"] #detailPanel.atlas-market-force-hidden-404167r3,html[data-cyclic-market-mode="inert"] #atlasMetalsDetailPanel.atlas-market-force-hidden-404167r3,html[data-cyclic-market-mode="inert"] #atlasMetalsUnifiedToolbar.atlas-market-force-hidden-404167r3,html[data-cyclic-market-mode="inert"] #analyste .chart-v2-toolbar.atlas-market-force-hidden-404167r3{display:none!important}
          html[data-cyclic-market-domain="metals"] #atlasParallelMarketFoundation{width:100%!important;max-width:100%!important;min-width:0!important;margin:0!important;padding:10px!important;border-radius:18px!important;box-sizing:border-box!important}
