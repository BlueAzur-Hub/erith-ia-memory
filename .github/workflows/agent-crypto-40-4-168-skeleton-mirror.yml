          html[data-cyclic-market-domain="metals"] #atlasMetalsChartCanvas{width:100%!important;max-width:100%!important}
          html[data-cyclic-market-domain="metals"] #atlasMetalsDetailPanel{min-width:0!important;max-width:100%!important;min-height:640px!important;box-sizing:border-box!important}
          .atlas-cyclic-market-mirror-toolbar-404167r3{display:none;align-items:center;gap:10px;min-width:0;width:100%;height:100%;padding:0 8px;box-sizing:border-box}
          .atlas-cyclic-market-mirror-toolbar-404167r3 .mirror-group{display:flex;align-items:center;gap:5px;min-width:0}.atlas-cyclic-market-mirror-toolbar-404167r3 small{color:#7f95a8;font-size:8px;font-weight:900;letter-spacing:.11em}.atlas-cyclic-market-mirror-toolbar-404167r3 b{padding:6px 9px;border:1px solid rgba(150,170,190,.18);border-radius:9px;color:#8599aa;background:rgba(8,16,28,.65);font-size:9px;white-space:nowrap}.atlas-cyclic-market-mirror-toolbar-404167r3 b.active{color:var(--cyclic-market-accent,#b9c7d3);border-color:color-mix(in srgb,var(--cyclic-market-accent,#b9c7d3) 40%,transparent)}
          .atlas-cyclic-market-inert-stage-404167r3{display:none!important;position:absolute;inset:0;z-index:29;padding:14px;border-radius:15px;box-sizing:border-box;background:linear-gradient(180deg,rgba(4,12,22,.992),rgba(7,18,30,.985));border:1px solid color-mix(in srgb,var(--cyclic-market-accent,#a9b9c7) 32%,transparent);overflow:hidden}.atlas-cyclic-market-inert-grid-404167r3{display:grid;grid-template-rows:minmax(0,1fr) auto auto;gap:12px;height:100%;min-height:0}.atlas-cyclic-market-inert-hero-404167r3{display:grid;place-content:center;justify-items:center;text-align:center;min-height:0;padding:30px;border:1px solid rgba(255,255,255,.055);border-radius:16px;background:radial-gradient(circle at 50% 46%,color-mix(in srgb,var(--cyclic-market-accent,#a9b9c7) 13%,transparent),transparent 43%),linear-gradient(180deg,rgba(255,255,255,.018),rgba(255,255,255,.005));overflow:hidden}.atlas-cyclic-market-inert-hero-404167r3 small{font-size:9px;letter-spacing:.18em;font-weight:900;color:#7892a8}.atlas-cyclic-market-inert-hero-404167r3 h3{margin:10px 0 8px;font-size:28px;color:#f0f3f5}.atlas-cyclic-market-inert-hero-404167r3 p{max-width:680px;margin:0;color:#9db0c0;font-size:12px;line-height:1.55}.atlas-cyclic-market-inert-line-404167r3{width:min(520px,76%);height:2px;margin-top:28px;background:linear-gradient(90deg,transparent,var(--cyclic-market-accent,#a9b9c7),transparent)}
