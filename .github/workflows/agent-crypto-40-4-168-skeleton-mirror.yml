          html[data-cyclic-market-mode="inert"] #analyste .chart-shell>*:not(#atlasCyclicMarketInertStage404167R3){display:none!important}html[data-cyclic-market-mode="inert"] #atlasCyclicMarketInertStage404167R3{display:block!important}html[data-cyclic-market-mode="inert"] #atlasCyclicMarketMirrorToolbar404167R3{display:flex!important}html[data-cyclic-market-mode="inert"] #atlasCyclicMarketInertDetail404167R3{display:block!important}html[data-cyclic-market-mode="inert"] #market-workspace,html[data-cyclic-market-mode="inert"] #atlasMetalsMathHost,html[data-cyclic-market-mode="inert"] #atlasMetalsMarketArea,html[data-cyclic-market-mode="inert"] #atlasMetalsAnalysisFoundation,html[data-cyclic-market-mode="inert"] .atlas-metals-public-report,html[data-cyclic-market-mode="inert"] .atlas-metals-report{display:none!important}
          @media(max-width:900px){#atlasFixedMarketAnchorSlot404167R3{left:16px!important}.atlas-cyclic-market-inert-gates-404167r3{grid-template-columns:1fr 1fr}}
          @media(max-width:620px){body.atlas-administrator-mirror .shell{width:calc(100% - 12px)!important;max-width:calc(100% - 12px)!important}#atlasFixedMarketAnchorSlot404167R3{left:10px!important;width:132px!important}#atlasMarketDomainSwitch.atlas-fixed-market-anchor-button-404167r3{width:132px!important;min-width:132px!important;max-width:132px!important}#analyste .chart-v2-recovery-line,#atlasMetalsUnifiedToolbar{padding-left:150px!important}.atlas-cyclic-market-inert-gates-404167r3{grid-template-columns:1fr}}
          '''

          js.write_text(js_r3, encoding='utf-8')
          css.write_text(css_r3, encoding='utf-8')

          html = index.read_text(encoding='utf-8')
          html = re.sub(r'(<meta name="administrator-revision" content=")[^"]*(" />)', r'\1R3\2', html, count=1)
          html = re.sub(r'(<meta name="administrator-release" content=")[^"]*(" />)', r'\1FIXED MARKET ANCHOR · DOMAIN PRESENTATION TRUTH\2', html, count=1)
          html = re.sub(r'market-cascade\.css(?:\?[^"\']*)?', 'market-cascade.css?v=404167r3', html)
          html = re.sub(r'js/market-stack\.js(?:\?[^"\']*)?', 'js/market-stack.js?v=404167r3', html)
          index.write_text(html, encoding='utf-8')

          for manifest in [root/'version.json', root/'data/version.json']:
              data = json.loads(manifest.read_text(encoding='utf-8'))
              data['build'] = '40.4.167'
              data['release'] = 'FIXED MARKET ANCHOR · DOMAIN PRESENTATION TRUTH'
              data['status'] = 'fixed_market_anchor_domain_presentation_truth'
              data['parent_build'] = '40.4.167R2'
              data['revision'] = 'R3'
              data['fixed_market_anchor'] = {'contract':'fixed_market_anchor_404167r3','position':'single_common_anchor','cycle':['crypto','metals','indices','energy','cross-market'],'new_data_owner':False}
              manifest.write_text(json.dumps(data, ensure_ascii=False, indent=2)+'\n', encoding='utf-8')
          PY
          node --check public/agent_crypto_erith_ia/administrator/js/market-stack.js
          python -m json.tool public/agent_crypto_erith_ia/administrator/version.json >/dev/null
          python -m json.tool public/agent_crypto_erith_ia/administrator/data/version.json >/dev/null
          git add public/agent_crypto_erith_ia/administrator/js/market-stack.js public/agent_crypto_erith_ia/administrator/market-cascade.css public/agent_crypto_erith_ia/administrator/index.html public/agent_crypto_erith_ia/administrator/version.json public/agent_crypto_erith_ia/administrator/data/version.json
          git commit -m "fix Agent-Crypto 40.4.167R3 fixed market anchor"
          git push origin HEAD:main

      - name: Rebase before 40.4.168
        run: git pull --rebase origin main

      - name: Build 40.4.168 Crypto Skeleton Mirror
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re

          root = Path('public/agent_crypto_erith_ia/administrator')
          js = root/'js/market-stack.js'
          css = root/'market-cascade.css'
          index = root/'index.html'

          js_168 = r'''(() => {
            "use strict";

            const BUILD = "40.4.168";
            const REVISION = "V1";
            const CONTRACT = "CRYPTO_SKELETON_MIRROR_404168";
            const ORDER = Object.freeze([
              Object.freeze({ id:"crypto", label:"CRYPTO", title:"Crypto", inert:false, native:"crypto" }),
              Object.freeze({ id:"metals", label:"MÉTAUX", title:"Métaux précieux et industriels", inert:false, native:"metals" }),
