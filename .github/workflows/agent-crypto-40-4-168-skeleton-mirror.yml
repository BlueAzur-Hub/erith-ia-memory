          #atlasMarketDomainSwitch.atlas-fixed-market-anchor-button-404167r3{width:146px!important;min-width:146px!important;max-width:146px!important;height:38px!important;min-height:38px!important;margin:0!important;justify-content:center!important;box-sizing:border-box!important;white-space:nowrap!important}
          #analyste .chart-v2-recovery-line,#atlasMetalsUnifiedToolbar{min-height:52px!important;padding-left:178px!important;box-sizing:border-box!important}
