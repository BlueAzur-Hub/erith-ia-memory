name: Agent-Crypto New Listings Package

on:
  push:
    branches: [main]
    paths:
      - "public/agent_crypto_erith_ia/administrator/app.js"
      - "public/agent_crypto_erith_ia/administrator/js/new-listings-native-category.js"
      - "public/agent_crypto_erith_ia/administrator/data/new-listings-identities.json"
      - "public/agent_crypto_erith_ia/administrator/js/aether-role-visibility.js"
      - "public/agent_crypto_erith_ia/administrator/NEW_LISTINGS_IDENTITY_FICHE_STABILITY_40.6.543.md"
      - ".github/scripts/agent_crypto_new_listings_identity_fiche_stability_406543_guard.py"
      - ".github/scripts/agent_crypto_fiche_dock_stability_406543_test.cjs"
      - "public/agent_crypto_erith_ia/administrator/NEW_LISTINGS_GITHUB_IDENTITY_MEMORY_40.6.542.md"
      - ".github/scripts/agent_crypto_new_listings_github_identity_memory_406542_guard.py"
      - "public/agent_crypto_erith_ia/administrator/js/new-listings-live-asset-406529.js"
      - "public/agent_crypto_erith_ia/administrator/js/market-microscope-candles-406498.js"
      - "public/agent_crypto_erith_ia/administrator/js/okx-microstructure-406499.js"
      - "public/agent_crypto_erith_ia/administrator/index.html"
      - "public/agent_crypto_erith_ia/administrator/build.json"
      - ".github/scripts/agent_crypto_new_listings_guard.py"
      - ".github/workflows/agent-crypto-new-listings-package.yml"
  pull_request:
    paths:
      - "public/agent_crypto_erith_ia/administrator/app.js"
      - "public/agent_crypto_erith_ia/administrator/js/new-listings-native-category.js"
      - "public/agent_crypto_erith_ia/administrator/data/new-listings-identities.json"
      - "public/agent_crypto_erith_ia/administrator/js/aether-role-visibility.js"
      - "public/agent_crypto_erith_ia/administrator/NEW_LISTINGS_IDENTITY_FICHE_STABILITY_40.6.543.md"
      - ".github/scripts/agent_crypto_new_listings_identity_fiche_stability_406543_guard.py"
      - ".github/scripts/agent_crypto_fiche_dock_stability_406543_test.cjs"
      - "public/agent_crypto_erith_ia/administrator/NEW_LISTINGS_GITHUB_IDENTITY_MEMORY_40.6.542.md"
      - ".github/scripts/agent_crypto_new_listings_github_identity_memory_406542_guard.py"
      - "public/agent_crypto_erith_ia/administrator/index.html"
      - "public/agent_crypto_erith_ia/administrator/build.json"
      - ".github/scripts/agent_crypto_new_listings_guard.py"
      - ".github/workflows/agent-crypto-new-listings-package.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate canonical owner
        run: |
          python .github/scripts/agent_crypto_new_listings_guard.py
          node --check public/agent_crypto_erith_ia/administrator/app.js
          node --check public/agent_crypto_erith_ia/administrator/js/new-listings-native-category.js
          node --check public/agent_crypto_erith_ia/administrator/js/new-listings-live-asset-406529.js
          node --check public/agent_crypto_erith_ia/administrator/js/market-microscope-candles-406498.js
          node --check public/agent_crypto_erith_ia/administrator/js/okx-microstructure-406499.js

      - name: Build compact patch ZIP
        id: patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, zipfile, os

          admin=Path("public/agent_crypto_erith_ia/administrator")
          build=json.loads((admin/"build.json").read_text(encoding="utf-8"))["build"]
          lifecycle_note=admin/f"NEW_LISTINGS_LIFECYCLE_{build}.md"
          logo_cache_truth_note=admin/f"NEW_LISTINGS_LOGO_CACHE_TRUTH_{build}.md"
          fiche_restore_note=admin/f"NEW_FICHE_NATIVE_LATERAL_RESTORE_{build}.md"
          real_logo_note=admin/f"NEW_LISTINGS_REAL_LOGO_ASSETS_{build}.md"
          identity_fiche_note=admin/f"NEW_LISTINGS_IDENTITY_FICHE_STABILITY_{build}.md"
          github_identity_note=admin/f"NEW_LISTINGS_GITHUB_IDENTITY_MEMORY_{build}.md"
          batched_identity_note=admin/f"NEW_LISTINGS_BATCHED_IDENTITY_{build}.md"
          canonical_note=admin/f"NEW_LISTINGS_CANONICAL_OWNER_{build}.md"
          if logo_cache_truth_note.exists():
            files=[
              admin/"index.html",
              admin/f"index-{build}.html",
              admin/"build.json",
              admin/"js/new-listings-native-category.js",
              admin/"data/new-listings-identities.json",
              admin/"assets/crypto/new-listings/concrete.png",
              admin/"assets/crypto/new-listings/magic-hash.png",
              admin/"assets/crypto/new-listings/marscat-token.png",
              admin/"assets/crypto/new-listings/pons.png",
              admin/"assets/crypto/new-listings/canopy.png",
              logo_cache_truth_note,
            ]
            package_kind="NEW_LISTINGS_LOGO_CACHE_TRUTH_PATCH"
          elif fiche_restore_note.exists():
            files=[
              admin/"index.html",
              admin/f"index-{build}.html",
              admin/"build.json",
              admin/"js/aether-role-visibility.js",
              fiche_restore_note,
              Path(".github/scripts/agent_crypto_fiche_native_lateral_restore_406545_guard.py"),
              Path(".github/scripts/agent_crypto_fiche_native_lateral_restore_406545_test.cjs"),
              Path(".github/workflows/agent-crypto-fiche-native-lateral-restore-406545.yml"),
            ]
            package_kind="FICHE_NATIVE_LATERAL_RESTORE_PATCH"
          elif real_logo_note.exists():
            files=[
              admin/"index.html",
              admin/f"index-{build}.html",
              admin/"build.json",
              admin/"js/new-listings-native-category.js",
              admin/"data/new-listings-identities.json",
              admin/"assets/crypto/new-listings/concrete.png",
              admin/"assets/crypto/new-listings/magic-hash.png",
              admin/"assets/crypto/new-listings/marscat-token.png",
              admin/"assets/crypto/new-listings/pons.png",
              admin/"assets/crypto/new-listings/canopy.png",
              real_logo_note,
              Path(".github/scripts/agent_crypto_new_listings_real_logo_assets_406544_guard.py"),
              Path(".github/scripts/agent_crypto_real_logo_assets_406544_test.cjs"),
              Path(".github/workflows/agent-crypto-new-listings-real-logo-assets-406544.yml"),
            ]
            package_kind="NEW_LISTINGS_REAL_LOGO_ASSETS_PATCH"
          elif identity_fiche_note.exists():
            # 40.6.543: valid GitHub logo payloads + native Fiche dock stability.
            files=[
              admin/"index.html",
              admin/f"index-{build}.html",
              admin/"build.json",
              admin/"js/new-listings-native-category.js",
              admin/"js/aether-role-visibility.js",
              admin/"data/new-listings-identities.json",
              identity_fiche_note,
              Path(".github/scripts/agent_crypto_new_listings_identity_fiche_stability_406543_guard.py"),
              Path(".github/scripts/agent_crypto_fiche_dock_stability_406543_test.cjs"),
              Path(".github/workflows/agent-crypto-new-listings-identity-fiche-stability-406543.yml"),
            ]
            package_kind="NEW_LISTINGS_IDENTITY_FICHE_STABILITY_PATCH"
          elif github_identity_note.exists():
            # 40.6.542 GitHub identity memory: runtime + registry + proof payload only.
            files=[
              admin/"index.html",
              admin/f"index-{build}.html",
              admin/"build.json",
              admin/"js/new-listings-native-category.js",
              admin/"data/new-listings-identities.json",
              github_identity_note,
              Path(".github/scripts/agent_crypto_new_listings_github_identity_memory_406542_guard.py"),
              Path(".github/workflows/agent-crypto-new-listings-github-identity-memory-406542.yml"),
            ]
            package_kind="NEW_LISTINGS_GITHUB_IDENTITY_MEMORY_PATCH"
          elif batched_identity_note.exists():
            # 40.6.541 identity release: compact runtime + proof payload only.
            files=[
              admin/"index.html",
              admin/f"index-{build}.html",
              admin/"build.json",
              admin/"js/new-listings-native-category.js",
              batched_identity_note,
              Path(".github/scripts/agent_crypto_new_listings_batched_identity_406541_guard.py"),
              Path(".github/workflows/agent-crypto-new-listings-batched-identity-406541.yml"),
            ]
            package_kind="NEW_LISTINGS_BATCHED_IDENTITY_PATCH"
          elif lifecycle_note.exists():
            # Lifecycle release: package only its runtime/proof payload.
            files=[
              admin/"index.html",
              admin/f"index-{build}.html",
              admin/"build.json",
              admin/"js/new-listings-live-asset-406529.js",
              admin/"js/new-listings-native-category.js",
              lifecycle_note,
              Path(".github/scripts/agent_crypto_new_listings_lifecycle_test.cjs"),
              Path(".github/workflows/agent-crypto-new-listings-lifecycle.yml"),
            ]
            package_kind="NEW_LISTINGS_LIFECYCLE_PATCH"
          elif canonical_note.exists():
            # Historical canonical-owner packages retain their original contract.
            files=[
              admin/"index.html",
              admin/"app.js",
              admin/f"index-{build}.html",
              admin/"build.json",
              admin/"js/new-listings.js",
              admin/"js/new-listings-live-asset-406529.js",
              admin/"js/new-listings-native-category.js",
              admin/"js/market-microscope-candles-406498.js",
              admin/"js/okx-microstructure-406499.js",
              admin/"js/okx-local-backend-transport.js",
              admin/"js/post-boot-runtime-loader.js",
              admin/"views/atlas.html",
              admin/f"NEW_LISTINGS_CANONICAL_OWNER_{build}.md",
              admin/f"PATCH_MANIFEST_{build}.txt",
              admin/f"SEVEN_HANDOFF_{build}.md",
              Path(".github/scripts/agent_crypto_new_listings_guard.py"),
              Path(".github/workflows/agent-crypto-new-listings-guard.yml"),
              Path(".github/workflows/agent-crypto-new-listings-package.yml"),
            ]
            package_kind="NEW_LISTINGS_CANONICAL_PATCH"
          else:
            # This workflow is path-triggered by shared Administrator files too.
            # A non-New-Listings build must not fail by inventing release notes.
            with open(os.environ["GITHUB_OUTPUT"],"a",encoding="utf-8") as fh:
              fh.write("packaged=false\n")
            print(f"SKIP: {build} is not a New Listings release")
            raise SystemExit(0)
          missing=[str(p) for p in files if not p.exists()]
          if missing:
            raise SystemExit("Missing package files: "+", ".join(missing))
          out=Path("dist")/f"AGENT_CRYPTO_ADMINISTRATOR_{build}_{package_kind}.zip"
          out.parent.mkdir(parents=True,exist_ok=True)
          with zipfile.ZipFile(out,"w",zipfile.ZIP_DEFLATED,compresslevel=9) as z:
            for p in files:
              z.write(p,p)
          with open(os.environ["GITHUB_OUTPUT"],"a",encoding="utf-8") as fh:
            fh.write(f"build={build}\n")
            fh.write(f"zip={out.as_posix()}\n")
            fh.write(f"artifact=AGENT_CRYPTO_ADMINISTRATOR_{build}_{package_kind}\n")
            fh.write("packaged=true\n")
          print(out, out.stat().st_size, "files", len(files))
          PY

      - uses: actions/upload-artifact@v4
        if: steps.patch.outputs.packaged == 'true'
        with:
          name: ${{ steps.patch.outputs.artifact }}
          path: ${{ steps.patch.outputs.zip }}
          if-no-files-found: error
          retention-days: 90
