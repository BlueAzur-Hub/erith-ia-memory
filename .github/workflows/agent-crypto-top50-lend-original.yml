name: Agent Crypto Top50 Original LEND before AAVE Token Migration
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/agent-crypto-top50-lend-original.yml'
      - 'public/agent_crypto_erith_ia/tools/archive_top50_lend_predecessor.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: agent-crypto-top50-original-lend-market-2020
  cancel-in-progress: false
jobs:
  certify-original-lend:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: crypto-top50-original-lend-before-aave-2020
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prove canonical AAVE rank and the source LEND original market
        run: |
          set -euo pipefail
          python -m py_compile public/agent_crypto_erith_ia/tools/archive_top50_lend_predecessor.py
          python public/agent_crypto_erith_ia/tools/archive_top50_lend_predecessor.py --self-test
      - name: Fetch 2020 original LENDUSDT Binance Spot native 1m, ZIP, CHECKSUM and OHLCV SQLite
        run: |
          set -euo pipefail
          python public/agent_crypto_erith_ia/tools/archive_top50_lend_predecessor.py \
            --batch 2020-lend --output "$RUNNER_TEMP/lend-original"
      - name: Verify SHA-256, old token identity, legitimate sources, gaps and separate listing
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,pathlib,hashlib
          base=pathlib.Path(os.environ["RUNNER_TEMP"])/"lend-original"
          j=json.loads((base/"manifest.json").read_text())
          assert j["schema"]=="seven.crypto.top50-lend-aave-predecessor-source.v1"
          assert j["original_market_symbol"]=="LENDUSDT" and j["post_swap_market_symbol"]=="AAVEUSDT"
          assert j["official_token_swap_ratio"]=="100 LEND = 1 AAVE"
          assert j["official_new_market_start_utc"]=="2020-10-15T03:00:00Z"
          assert j["original_prices_not_converted_or_automatically_spliced"]
          assert j["target_month_pairs"]==9 and len(j["records"])==9
          assert j["source_verified_month_pairs"]>0 and j["no_synthetic_bars"]
          assert j["source_verified_month_pairs"]+j["pre_pair_listing_month_pairs"]+j["unavailable_or_unverified_month_pairs"]==9
          files={"manifest.json"}
          for r in j["records"]:
              assert r["pair"]=="LENDUSDT" and r["quote"]=="USDT"
              assert "2020-01"<=r["month"]<="2020-09"
              if r["status"] in ("native_1m_complete","native_1m_partial","original_timestamp_quarantine"):
                  assert r["native_rows"]>0
                  for field in ("source_zip","official_checksum","sqlite"):
                      d=r[field];f=base/d["name"]
                      assert d["name"] not in files and f.is_file()
                      assert f.stat().st_size==d["bytes"]
                      assert hashlib.sha256(f.read_bytes()).hexdigest()==d["sha256"]
                      files.add(d["name"])
                  if r["strict_utc_aligned"]:
                      assert r["native_rows"]+r["missing_1m_minutes"]==r["calendar_minutes"]
                      assert sum(x["missing_minutes"] for x in r["missing_intervals"])==r["missing_1m_minutes"]
                  else: assert r["excluded_from_utc_1m_calendar"]
              else: assert r["native_rows"]==0
          assert {f.name for f in base.iterdir()}==files
          print("LEND AUTHENTIC ORIGINAL SPOT SOURCE",j["source_verified_month_pairs"],j["strict_utc_aligned_native_rows"])
          PY
      - name: Publish original ZIP CHECKSUM and SQLite to immutable GitHub Release
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/lend-original"
          root=public/agent_crypto_erith_ia/data/historical_archive_prototype
          git fetch origin main
          for rel in top250_multisource_coverage/index.json top50_historical_expansion/index.json;do
            a=$(sha256sum "$root/$rel"|cut -d' ' -f1)
            b=$(git show "origin/main:$root/$rel"|sha256sum|cut -d' ' -f1)
            test "$a" = "$b" || { echo "::error::Original market ownership changed";exit 1; }
          done
          if gh release view "$TAG" --json tagName >/dev/null 2>"$RUNNER_TEMP/no-release.txt";then
            mkdir -p "$RUNNER_TEMP/existing"
            gh release download "$TAG" --pattern manifest.json --dir "$RUNNER_TEMP/existing"
            cmp "$RUNNER_TEMP/existing/manifest.json" "$dir/manifest.json" || {
              echo "::error::Original source release differs"; exit 1;
            }
          else
            if ! grep -Eqi 'release not found|HTTP 404|not found' "$RUNNER_TEMP/no-release.txt"; then
              cat "$RUNNER_TEMP/no-release.txt"; exit 1
            fi
            gh release create "$TAG" "$dir"/* --target "$GITHUB_SHA" \
              --title "Original LEND/USDT Binance Spot before AAVE 100:1 token swap" \
              --notes "Authentic native Binance Spot monthly original 1m ZIP, official CHECKSUM and SQLite. Original LENDUSDT quoted in USDT, NOT automatically converted into AAVEUSDT across October 2020 token migration. Source gaps retained." \
              --latest=false
          fi
          gh release view "$TAG" --json assets,isDraft,url > "$RUNNER_TEMP/existing-release.json"
          python - <<'PY'
          import json,os,pathlib
          base=pathlib.Path(os.environ["RUNNER_TEMP"])
          j=json.loads((base/"existing-release.json").read_text())
          src={f.name:f.stat().st_size for f in (base/"lend-original").iterdir()}
          dst={a["name"]:a["size"] for a in j["assets"]}
          assert not j["isDraft"] and src==dst
          print("LEND ORIGINAL SOURCE RELEASE",j["url"],len(src))
          PY
      - name: Publish only lineage source manifest into the Top50 Vault
        run: |
          set -euo pipefail
          root=public/agent_crypto_erith_ia/data/historical_archive_prototype
          out="$root/top50_historical_expansion/lend_pre_aave/index.json"
          for attempt in 1 2 3;do
            git fetch origin main
            for rel in top250_multisource_coverage/index.json top50_historical_expansion/index.json;do
              a=$(sha256sum "$root/$rel"|cut -d' ' -f1)
              b=$(git show "origin/main:$root/$rel"|sha256sum|cut -d' ' -f1)
              test "$a" = "$b" || { echo "::error::Canonical rank ownership changed"; exit 1; }
            done
            git reset --hard origin/main
            mkdir -p "$(dirname "$out")"
            cp "$RUNNER_TEMP/lend-original/manifest.json" "$out"
            git add -- "$out"
            git diff --cached --check
            if git diff --cached --quiet;then exit 0;fi
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Coffre: preserve original LENDUSDT Spot archives before AAVE token migration'
            if git push origin HEAD:main;then exit 0;fi
          done
          exit 1
      - name: Enforce Trader and previous source catalog intact
        if: always()
        run: |
          git diff --exit-code -- \
            public/agent_crypto_erith_ia/trader/ \
            public/agent_crypto_erith_ia/administrator/ \
            public/agent_crypto_erith_ia/data/historical_archive_prototype/top250_multisource_coverage/
