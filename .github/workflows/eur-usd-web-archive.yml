name: EUR-USD Administrator - GitHub root 2-file ZIP
on:
  push:
    branches:
      - test/eur-usd-unified-historical-quotes
    paths:
      - '.github/workflows/eur-usd-web-archive.yml'
permissions:
  contents: read
jobs:
  package-two-files:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch only two corrected JavaScript files
        uses: actions/checkout@v4
        with:
          ref: test/eur-usd-unified-historical-quotes
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /public/agent_crypto_erith_ia/administrator/app.js
            /public/agent_crypto_erith_ia/administrator/js/graph-native-usd-406520.js
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Package ONLY two changed files, preserving web paths
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          import subprocess,hashlib
          base=Path('public/agent_crypto_erith_ia')
          files={
           'administrator/app.js':'edd211448c1babc6c5f13838dadaa735a2e1b8e3',
           'administrator/js/graph-native-usd-406520.js':'76cf098509c4ebb295bca3d38392b74acf91396b',
          }
          dest=Path('AGENT_CRYPTO_EUR_USD_GITHUB_ROOT_2_FILES.zip')
          with ZipFile(dest,'w',ZIP_DEFLATED,compresslevel=9) as z:
            for name,digest in files.items():
              src=base/name
              assert src.is_file(),name
              subprocess.run(['node','--check',str(src)],check=True)
              blob=subprocess.check_output(['git','hash-object',str(src)],text=True).strip()
              assert blob==digest,(name,blob)
              z.write(src,arcname='public/agent_crypto_erith_ia/'+name)
          with ZipFile(dest) as z:
            assert set(z.namelist())=={'public/agent_crypto_erith_ia/'+n for n in files},z.namelist()
            assert len(z.namelist())==2
            assert z.testzip() is None
          print('ZIP_FILE_COUNT=2')
          print('ZIP_BYTES='+str(dest.stat().st_size))
          print('ZIP_SHA256='+hashlib.sha256(dest.read_bytes()).hexdigest())
          print('NO_PRODUCTION_DEPLOY=true')
          PY
      - name: Archive two-file GitHub-root patch - not full Administrator
        uses: actions/upload-artifact@v4
        with:
          name: AGENT_CRYPTO_EUR_USD_GITHUB_ROOT_2_FILES
          path: AGENT_CRYPTO_EUR_USD_GITHUB_ROOT_2_FILES.zip
          retention-days: 30
          if-no-files-found: error
