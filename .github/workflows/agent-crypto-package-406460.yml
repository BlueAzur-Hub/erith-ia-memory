name: Agent-Crypto Package 40.6.460 Durable Evidence Reconciliation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/agent-crypto-package-406460.yml'

permissions:
  contents: write

jobs:
  validate-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Validate 40.6.460
        shell: bash
        run: |
          set -euo pipefail
          ROOT="public/agent_crypto_erith_ia/administrator"
          node --check "$ROOT/js/strategy-a-durable-evidence-reconciliation-truth.js"
          node --check "$ROOT/js/strategy-a-audit-demand-loader.js"

          node <<'NODE'
          const fs=require('fs');
          const s=fs.readFileSync('public/agent_crypto_erith_ia/administrator/js/strategy-a-durable-evidence-reconciliation-truth.js','utf8');
          Function(s)();
          const t=globalThis.AgentCryptoStrategyADurableEvidenceReconciliation.self_test();
          if(!t.pass) throw new Error(JSON.stringify(t));
          if(globalThis.AgentCryptoStrategyADurableEvidenceReconciliation.certifies_g1!==false) throw new Error('G1 certification forbidden');
          if(globalThis.AgentCryptoStrategyADurableEvidenceReconciliation.certifies_g8!==false) throw new Error('G8 certification forbidden');
          console.log('40.6.460 RECONCILIATION HARNESS PASS');
          NODE

          python - <<'PY'
          import json
          from pathlib import Path
          r=Path('public/agent_crypto_erith_ia/administrator')
          idx=(r/'index.html').read_text(encoding='utf-8')
          audit=(r/'js/strategy-a-audit-demand-loader.js').read_text(encoding='utf-8')
          b=json.loads((r/'build.json').read_text(encoding='utf-8'))
          receipt=json.loads((r/'DURABLE_EVIDENCE_RECONCILIATION_TEST_40.6.460.json').read_text(encoding='utf-8'))
          checks={
            'build':b.get('build')=='40.6.460',
            'release':b.get('release')=='STRATEGY A DURABLE EVIDENCE RECONCILIATION TRUTH',
            'market_core':b.get('market_core')=='38.15.11',
            'entry':'Build 40.6.460 · Administrator' in idx,
            'audit_delivery':'strategy-a-audit-demand-loader.js?v=40.6.460' in idx,
            'module_delivery':'strategy-a-durable-evidence-reconciliation-truth.js?v=40.6.460' in audit,
            'execution_cost_459_preserved':'strategy-a-execution-cost-truth.js?v=40.6.459' in audit,
            'source_loader_457_preserved':'post-boot-runtime-loader.js?v=40.6.457' in idx,
            'receipt':receipt.get('pass') is True,
          }
          bad=[k for k,v in checks.items() if not v]
          if bad: raise SystemExit('40.6.460 failed: '+str(bad))
          print('40.6.460 STATIC PASS')
          PY

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          ROOT="public/agent_crypto_erith_ia/administrator"
          ZIP="$ROOT/AGENT_CRYPTO_STRATEGY_A_DURABLE_EVIDENCE_RECONCILIATION_40.6.460.zip"
          rm -f "$ZIP" "$ZIP.sha256"
          rm -rf /tmp/ac460
          mkdir -p /tmp/ac460/administrator/js
          cp "$ROOT/index.html" /tmp/ac460/administrator/
          cp "$ROOT/index-40.6.460.html" /tmp/ac460/administrator/
          cp "$ROOT/build.json" /tmp/ac460/administrator/
          cp "$ROOT/RELEASE.md" /tmp/ac460/administrator/
          cp "$ROOT/HANDOFF.md" /tmp/ac460/administrator/
          cp "$ROOT/PATCH_MANIFEST_40.6.460.txt" /tmp/ac460/administrator/
          cp "$ROOT/DURABLE_EVIDENCE_RECONCILIATION_TEST_40.6.460.json" /tmp/ac460/administrator/
          cp "$ROOT/js/strategy-a-durable-evidence-reconciliation-truth.js" /tmp/ac460/administrator/js/
          cp "$ROOT/js/strategy-a-audit-demand-loader.js" /tmp/ac460/administrator/js/
          (cd /tmp/ac460 && zip -9 -r "$GITHUB_WORKSPACE/$ZIP" .)
          unzip -t "$ZIP"
          sha256sum "$ZIP" > "$ZIP.sha256"

      - name: Commit package
        shell: bash
        run: |
          set -euo pipefail
          ROOT="public/agent_crypto_erith_ia/administrator"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$ROOT/AGENT_CRYPTO_STRATEGY_A_DURABLE_EVIDENCE_RECONCILIATION_40.6.460.zip" "$ROOT/AGENT_CRYPTO_STRATEGY_A_DURABLE_EVIDENCE_RECONCILIATION_40.6.460.zip.sha256"
          git commit -m "chore(package): add Agent-Crypto 40.6.460 Durable Evidence ZIP"
          git pull --rebase origin main
          git push origin HEAD:main
