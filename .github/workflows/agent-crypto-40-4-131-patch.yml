name: Agent-Crypto 40.4.131 guarded patch

on:
  push:
    branches: [main]
    paths:
      - coordination/inter_ai_dialogues/agent_crypto/patches/40.4.131.request.json

permissions:
  contents: write

concurrency:
  group: agent-crypto-40-4-131-guarded-patch
  cancel-in-progress: false

jobs:
  deploy:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout canonical main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard parent and apply bounded 40.4.131 surgery
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json, re

          root = Path('public/agent_crypto_erith_ia/administrator')
          request = Path('coordination/inter_ai_dialogues/agent_crypto/patches/40.4.131.request.json')
          req = json.loads(request.read_text(encoding='utf-8'))
          if req.get('build') != '40.4.131' or req.get('parent_build') != '40.4.130':
              raise SystemExit('STOP: requête 40.4.131 invalide')

          current = json.loads((root / 'version.json').read_text(encoding='utf-8'))
          if current.get('build') != '40.4.130':
              raise SystemExit(f"STOP: parent build attendu 40.4.130, trouvé {current.get('build')}")

          def replace_once(path, old, new, label):
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'STOP: {label} attendu 1 occurrence, trouvé {count}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          ribbons = root / 'admin-ribbons.css'
          replace_once(
              ribbons,
              '''/* ============================================================================\n   40.4.114 — AETHER INFORMATION PULSE · NEWS FRENCH QUALITY PIPELINE LOCK\n\n   NORMAL -> INFO -> VEILLE/CONTEXTE -> SYSTEM -> NORMAL in ONE physical lane.\n   Outer cadence remains 30 s NORMAL · 15 s INFO · 36 s FEED · 9 s SYSTEM = 90 s.\n   Inside the 36 s FEED phase, the 40.4.112 9 s CSS pulse is preserved unchanged.\n   40.4.114 changes News French production quality only; Aether cadence and geometry are untouched.\n   No recurring JavaScript timer is added; News loading remains owned by News Sentinel.\n   Native Decision / Sources / Chronos geometry is never restyled here.\n   ============================================================================ */''',
              '''/* ============================================================================\n   40.4.131 — AETHER 12-STORY READING FLOW · SYSTEM AFTER BATCH LOCK\n\n   NORMAL -> INFO -> 12 NEWS -> SYSTEM -> NORMAL in ONE physical lane.\n   Cadence: 30 s NORMAL · 15 s INFO · 216 s VEILLE (12 × 18 s) · 9 s SYSTEM = 270 s.\n   The first pulse at VEILLE entry establishes visibility and never advances the story.\n   CPU/GPU/RAM therefore cannot interrupt the twelve-story reading batch.\n   No recurring JavaScript timer is added; News loading remains owned by News Sentinel.\n   Native Decision / Sources / Chronos geometry is never restyled here.\n   ============================================================================ */''',
              'Aether cadence comment'
          )
          replace_once(
              ribbons,
              '''@keyframes atlasStatusNativePhase{\n  0%,33.332%{opacity:1;visibility:visible}\n  33.333%,100%{opacity:0;visibility:hidden}\n}\n@keyframes atlasAetherBandPhase{\n  0%,33.332%{opacity:0;visibility:hidden}\n  33.333%,100%{opacity:1;visibility:visible}\n}\n@keyframes atlasAetherInfoPhase{\n  0%,33.332%{opacity:0;visibility:hidden}\n  33.333%,49.999%{opacity:1;visibility:visible}\n  50%,100%{opacity:0;visibility:hidden}\n}\n@keyframes atlasAetherVeillePhase{\n  0%,49.999%{opacity:0;visibility:hidden}\n  50%,89.999%{opacity:1;visibility:visible}\n  90%,100%{opacity:0;visibility:hidden}\n}\n@keyframes atlasAetherSystemPhase{\n  0%,89.999%{opacity:0;visibility:hidden}\n  90%,100%{opacity:1;visibility:visible}\n}''',
              '''@keyframes atlasStatusNativePhase{\n  0%,11.110%{opacity:1;visibility:visible}\n  11.111%,100%{opacity:0;visibility:hidden}\n}\n@keyframes atlasAetherBandPhase{\n  0%,11.110%{opacity:0;visibility:hidden}\n  11.111%,100%{opacity:1;visibility:visible}\n}\n@keyframes atlasAetherInfoPhase{\n  0%,11.110%{opacity:0;visibility:hidden}\n  11.111%,16.666%{opacity:1;visibility:visible}\n  16.667%,100%{opacity:0;visibility:hidden}\n}\n@keyframes atlasAetherVeillePhase{\n  0%,16.666%{opacity:0;visibility:hidden}\n  16.667%,96.666%{opacity:1;visibility:visible}\n  96.667%,100%{opacity:0;visibility:hidden}\n}\n@keyframes atlasAetherSystemPhase{\n  0%,96.666%{opacity:0;visibility:hidden}\n  96.667%,100%{opacity:1;visibility:visible}\n}''',
              'Aether phase keyframes'
          )
          replace_once(ribbons, 'The FEED pulse stays at 9 s; short overflows stay still.', 'The VEILLE pulse is 18 s; short overflows stay still.', 'marquee pulse comment')
          for old, new, label in (
              ('animation:atlasStatusNativePhase 90s steps(1,end) infinite!important;', 'animation:atlasStatusNativePhase 270s steps(1,end) infinite!important;', 'native 270s'),
              ('animation:atlasAetherBandPhase 90s steps(1,end) infinite!important;', 'animation:atlasAetherBandPhase 270s steps(1,end) infinite!important;', 'band 270s'),
              ('animation:atlasAetherInfoPhase 90s steps(1,end) infinite!important;', 'animation:atlasAetherInfoPhase 270s steps(1,end) infinite!important;', 'info 270s'),
              ('atlasAetherVeillePhase 90s steps(1,end) infinite,\n      atlasAetherFeedPulse40112 9s 4.5s steps(1,end) infinite!important;', 'atlasAetherVeillePhase 270s steps(1,end) infinite,\n      atlasAetherFeedPulse40112 18s 9s steps(1,end) infinite!important;', 'veille 12-story phase'),
              ('animation:atlasAetherSystemPhase 90s steps(1,end) infinite!important;', 'animation:atlasAetherSystemPhase 270s steps(1,end) infinite!important;', 'system 270s'),
          ):
              replace_once(ribbons, old, new, label)

          aether = root / 'js/aether.js'
          replace_once(aether, '  Build: 40.4.130\n  Revision: 40.4.130 Aether semantic-lane recovery. The rejected 40.4.129 global INFO marquee is retired. INFO returns to fixed semantic owners Atlas / Oracle / Sources / Book in the same physical lane; VEILLE alone owns long scrolling News text. 40.4.121 constant-read-speed VEILLE, 40.4.125 canonical French News, 40.4.127 canonical deduplication, 40.4.128 representative family selection and 40.4.129 continuous 12-story cursor are preserved.', '  Build: 40.4.131\n  Revision: 40.4.131 Aether 12-story reading-flow lock. NORMAL 30 s -> INFO 15 s -> VEILLE 12 × 18 s -> SYSTEM 9 s. The entry pulse only arms VEILLE visibility; the next eleven pulses advance through the remaining eleven stories, so CPU/GPU/RAM cannot interrupt the batch. 40.4.130 semantic INFO owners and the constant-speed News marquee are preserved.', 'aether header')
          replace_once(
              aether,
              '''        if(visible){\n          aetherVeilleState4087.feedWasVisible=true;\n          aetherVeilleAdvance4087();\n        }else if(aetherVeilleState4087.feedWasVisible){''',
              '''        if(visible){\n          // 40.4.131 — the first visible pulse arms the 12-story batch; it must not consume story 1.\n          if(!aetherVeilleState4087.feedWasVisible){\n            aetherVeilleState4087.feedWasVisible=true;\n            return;\n          }\n          aetherVeilleAdvance4087();\n        }else if(aetherVeilleState4087.feedWasVisible){''',
              'first visible pulse guard'
          )
          replace_once(aether, '    build:"40.4.130",', '    build:"40.4.131",', 'Aether API build')
          replace_once(aether, '    veille_feed_pulse_seconds:9,', '    veille_feed_pulse_seconds:18,', 'Aether pulse API')
          replace_once(aether, '    cadence_seconds:90,', '    cadence_seconds:270,', 'Aether cadence API')
          replace_once(aether, '    veille_seconds:36,', '    veille_seconds:216,', 'Aether veille API')
          replace_once(aether, '    system_seconds:9,', '    system_seconds:9,\n    veille_full_batch_before_system:true,\n    veille_first_visible_pulse_advances:false,', 'Aether batch contract')

          # Version truth owners used by the visible Administrator shell.
          replace_once(root / 'app.js', 'const ATLAS_BUILD = "40.4.130";', 'const ATLAS_BUILD = "40.4.131";', 'ATLAS_BUILD')
          replace_once(root / 'js/app.js', '  const ADMIN_BUILD = "40.4.130";', '  const ADMIN_BUILD = "40.4.131";', 'ADMIN_BUILD')

          index = root / 'index.html'
          for old, new, label in (
              ('<meta name="atlas-build" content="40.4.130" />', '<meta name="atlas-build" content="40.4.131" />', 'index atlas-build'),
              ('<meta name="administrator-build" content="40.4.130" />', '<meta name="administrator-build" content="40.4.131" />', 'index administrator-build'),
              ('<meta name="administrator-release" content="AETHER INFORMATION ONLY · NO DISCLAIMER RIBBON · CONTEXT LABEL DEDUP · VERSION TRUTH LOCK" />', '<meta name="administrator-release" content="AETHER 12-STORY READING FLOW · SYSTEM AFTER BATCH · RESPONSIVE AUTH TRUTH PANEL LOCK" />', 'index release'),
              ('<meta name="atlas-asset-token" content="market-core-v2.0-alpha-build-40.4.130" />', '<meta name="atlas-asset-token" content="market-core-v2.0-alpha-build-40.4.131" />', 'index asset token'),
              ('<title>Agent-Crypto @erith.IA — Build 40.4.130 · Administrator</title>', '<title>Agent-Crypto @erith.IA — Build 40.4.131 · Administrator</title>', 'index title'),
              ('./admin-ribbons.css?v=administrator-build-40.4.130', './admin-ribbons.css?v=administrator-build-40.4.131', 'ribbons cache token'),
          ):
              replace_once(index, old, new, label)

          text = index.read_text(encoding='utf-8')
          pattern = re.compile(
              r'@media \(max-width:1180px\)\{\s*'
              r'\.atlas-access-portal-grid-40380\{inset:78px 24px 74px;grid-template-columns:minmax\(330px,44%\) 1fr\}'
              r'\.atlas-access-truth-panel-40380\{display:none\}'
              r'\.atlas-access-system-signals-40382>span:first-child\{display:none\}'
              r'\.atlas-access-modules-40382\{left:24px;right:24px;bottom:16px;grid-template-columns:repeat\(5,minmax\(0,1fr\)\)\}'
              r'\.atlas-access-modules-40382 span:nth-child\(n\+6\)\{display:none\}'
              r'\.atlas-access-portal-shade-40380\{background:linear-gradient\(90deg,rgba\(1,8,14,.93\) 0 43%,rgba\(1,8,14,.06\) 58% 100%\),linear-gradient\(180deg,rgba\(1,6,10,.34\),transparent 22% 78%,rgba\(1,6,10,.54\)\)\}\s*'
              r'\}'
          )
          replacement = '''@media (max-width:1180px){
      .atlas-access-portal-grid-40380{inset:78px 24px 74px;grid-template-columns:minmax(330px,1.08fr) minmax(278px,.92fr);gap:18px}
      .atlas-access-live-panel-40380{grid-column:1;min-width:0}
      .atlas-access-door-clearance-40380{display:none!important}
      .atlas-access-truth-panel-40380{display:grid!important;grid-column:2;align-self:center;margin:0;min-width:0}
      .atlas-access-system-signals-40382>span:first-child{display:none}
      .atlas-access-modules-40382{left:24px;right:24px;bottom:16px;grid-template-columns:repeat(5,minmax(0,1fr))}
      .atlas-access-modules-40382 span:nth-child(n+6){display:none}
      .atlas-access-portal-shade-40380{background:linear-gradient(90deg,rgba(1,8,14,.93) 0 44%,rgba(1,8,14,.16) 56% 66%,rgba(1,8,14,.88) 79% 100%),linear-gradient(180deg,rgba(1,6,10,.34),transparent 22% 78%,rgba(1,6,10,.54))}
    }'''
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'STOP: responsive auth owner attendu 1 occurrence, trouvé {count}')
          index.write_text(text, encoding='utf-8')
          PY

      - name: Synchronize 40.4.131 manifests from actual bytes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from datetime import datetime, timezone
          import hashlib, json

          root = Path('public/agent_crypto_erith_ia/administrator')
          build='40.4.131'; parent='40.4.130'
          release='AETHER 12-STORY READING FLOW · SYSTEM AFTER BATCH · RESPONSIVE AUTH TRUTH PANEL LOCK'
          status='candidate_aether_12_story_reading_flow_responsive_auth_operator_validation_required'
          prepared=datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z')
          def sha(path): return hashlib.sha256(path.read_bytes()).hexdigest()

          feature={
            'build':build,
            'normal_seconds':30,
            'info_seconds':15,
            'veille_story_count':12,
            'veille_seconds_per_story':18,
            'veille_seconds_total':216,
            'system_seconds':9,
            'cadence_seconds':270,
            'first_visible_pulse_advances':False,
            'system_interrupts_story_batch':False,
            'marquee_constant_speed_px_s':72,
            'responsive_auth_truth_panel_hidden_at_1180':False,
            'responsive_auth_layout_1180':'two-column auth + truth; decorative door column released',
            'mobile_truth_panel_preserved':True,
            'market_core_changed':False,
            'graph_changed':False,
            'atlas_current_changed':False,
            'oracle_changed':False,
            'bridge_changed':False,
            'news_source_pipeline_changed':False,
            'new_recurring_timer':False,
            'new_observer':False,
            'new_network_owner':False
          }
          note=('40.4.131 — AETHER 12-STORY READING FLOW · SYSTEM AFTER BATCH · RESPONSIVE AUTH TRUTH PANEL LOCK: '
                'VEILLE now keeps one complete twelve-story batch at 18 seconds per story before the 9-second System phase; '
                'the first visible CSS pulse only arms the feed and does not consume story 1. At <=1180 CSS px the authentication sas becomes two-column '
                'Auth + Vérité opérateur, releasing only the decorative door column instead of hiding the truth panel. Market Core 38.15.11, graph, CURRENT, Atlas, Oracle, Bridge and News source pipeline are unchanged.')

          changed_app_sha=sha(root/'app.js')

          def update_manifest(path, admin_hash=None):
              d=json.loads(path.read_text(encoding='utf-8'))
              d['build']=build
              d['release']=release
              d['status']=status
              d['prepared_at']=prepared
              d['published_at']=None
              d['global_versioning']=build
              d['asset_token']=f'market-core-v2.0-alpha-build-{build}'
              d['parent_build']=parent
              suffix='40.4.131 Aether 12-story reading flow + System-after-batch + responsive auth truth panel lock'
              if isinstance(d.get('lineage'),str) and suffix not in d['lineage']:
                  d['lineage'] += ' → ' + suffix
              integrity=d.setdefault('integrity',{})
              pi=integrity.setdefault('publication_identity',{})
              pi['build']=build
              pi['asset_token']=f'market-core-v2.0-alpha-build-{build}'
              pi['status']=status
              pi['app_sha256']=changed_app_sha
              if admin_hash is not None:
                  pi['administrator_version_sha256']=admin_hash
              integrity['aether_12_story_reading_flow_responsive_auth_404131']=feature.copy()
              d.setdefault('features',{})['aether_12_story_reading_flow_responsive_auth_404131']=feature.copy()
              files=d.setdefault('files',{})
              for rel in list(files):
                  target=root/rel
                  if not target.is_file():
                      raise SystemExit(f'STOP: fichier manifest absent {rel}')
                  files[rel]=sha(target)
              notes=d.setdefault('release_notes',[])
              if not notes or notes[0] != note:
                  notes.insert(0,note)
              validation=d.setdefault('validation',{})
              validation.update({
                'aether_12_story_batch_404131_required':True,
                'aether_story_read_seconds_404131_expected':18,
                'aether_system_after_full_batch_404131_expected':True,
                'auth_truth_panel_visible_under_1180_404131_expected':True,
                'market_core_38_15_11_non_regression_404131_required':True
              })
              path.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          admin=root/'administrator-version.json'
          update_manifest(admin)
          update_manifest(root/'version.json', sha(admin))
          PY

      - name: Professional validation gates
        shell: bash
        run: |
          set -euo pipefail
          ROOT="public/agent_crypto_erith_ia/administrator"
          node --check "$ROOT/app.js"
          node --check "$ROOT/js/app.js"
          node --check "$ROOT/js/aether.js"
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, re

          root=Path('public/agent_crypto_erith_ia/administrator')
          css=(root/'admin-ribbons.css').read_text(encoding='utf-8')
          js=(root/'js/aether.js').read_text(encoding='utf-8')
          idx=(root/'index.html').read_text(encoding='utf-8')
          app=(root/'app.js').read_text(encoding='utf-8')
          admin_js=(root/'js/app.js').read_text(encoding='utf-8')

          required_css=(
            'atlasStatusNativePhase 270s',
            'atlasAetherBandPhase 270s',
            'atlasAetherInfoPhase 270s',
            'atlasAetherVeillePhase 270s',
            'atlasAetherFeedPulse40112 18s 9s',
            'atlasAetherSystemPhase 270s',
            '16.667%,96.666%{opacity:1;visibility:visible}',
            '96.667%,100%{opacity:1;visibility:visible}'
          )
          if not all(token in css for token in required_css):
              raise SystemExit('STOP: contrat cadence CSS 40.4.131 incomplet')
          if 'veille_feed_pulse_seconds:18' not in js or 'veille_seconds:216' not in js or 'cadence_seconds:270' not in js:
              raise SystemExit('STOP: contrat runtime Aether 40.4.131 incomplet')
          if 'if(!aetherVeilleState4087.feedWasVisible)' not in js or 'veille_first_visible_pulse_advances:false' not in js:
              raise SystemExit('STOP: first-pulse guard absent')
          if '.atlas-access-truth-panel-40380{display:grid!important;grid-column:2' not in idx:
              raise SystemExit('STOP: Vérité opérateur responsive absente')
          if 'inset:78px 24px 74px;grid-template-columns:minmax(330px,44%) 1fr}.atlas-access-truth-panel-40380{display:none}' in idx:
              raise SystemExit('STOP: ancien masquage Vérité opérateur encore actif')
          if 'const ATLAS_BUILD = "40.4.131";' not in app:
              raise SystemExit('STOP: ATLAS_BUILD faux')
          if 'const ADMIN_BUILD = "40.4.131";' not in admin_js:
              raise SystemExit('STOP: ADMIN_BUILD faux')
          if '<meta name="atlas-build" content="40.4.131" />' not in idx or 'administrator-build-40.4.131' not in idx:
              raise SystemExit('STOP: index version truth faux')

          ids=re.findall(r'\bid=["\']([^"\']+)["\']',idx)
          if len(ids) != len(set(ids)):
              raise SystemExit('STOP: IDs HTML dupliqués')

          for fn in ('administrator-version.json','version.json'):
              d=json.loads((root/fn).read_text(encoding='utf-8'))
              if d.get('build') != '40.4.131': raise SystemExit(f'STOP: build faux {fn}')
              if d.get('asset_token') != 'market-core-v2.0-alpha-build-40.4.131': raise SystemExit(f'STOP: asset token faux {fn}')
              engine=d.get('engine') or {}
              if str(engine.get('reference_build')) != '38.15.11': raise SystemExit('STOP: Market Core modifié')
              for rel,expected in (d.get('files') or {}).items():
                  p=root/rel
                  if not p.is_file(): raise SystemExit(f'STOP: fichier manifest absent {rel}')
                  actual=hashlib.sha256(p.read_bytes()).hexdigest()
                  if actual != expected: raise SystemExit(f'STOP: hash faux {rel}')
          vd=json.loads((root/'version.json').read_text(encoding='utf-8'))
          admin_sha=hashlib.sha256((root/'administrator-version.json').read_bytes()).hexdigest()
          if vd['integrity']['publication_identity'].get('administrator_version_sha256') != admin_sha:
              raise SystemExit('STOP: chaîne administrator-version SHA incorrecte')
          print('PASS 40.4.131 · 12-story reading flow · System after batch · responsive auth truth panel')
          PY
          git diff --check

      - name: Build canonical 40.4.131 archive
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, zipfile
          root=Path('public/agent_crypto_erith_ia/administrator')
          manifest=json.loads((root/'version.json').read_text(encoding='utf-8'))
          build=manifest['build']
          files=list((manifest.get('files') or {}).keys())
          for required in ('version.json','administrator-version.json'):
              if required not in files: files.append(required)
          outdir=Path('coordination/inter_ai_dialogues/agent_crypto'); outdir.mkdir(parents=True,exist_ok=True)
          out=outdir/f"AGENT_CRYPTO_BUILD_{build.replace('.','_')}_AUTO_CANONICAL.zip"
          with zipfile.ZipFile(out,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=9) as zf:
              for rel in files:
                  src=root/rel
                  if not src.is_file(): raise SystemExit(f'STOP: archive source absente {rel}')
                  zf.write(src,arcname=(Path('public/agent_crypto_erith_ia/administrator')/rel).as_posix())
          digest=hashlib.sha256(out.read_bytes()).hexdigest()
          sha_path=Path(str(out)+'.sha256')
          sha_path.write_text(f'{digest}  {out.name}\n',encoding='utf-8')
          print(out); print(digest)
          PY

      - name: Commit validated 40.4.131 atomically
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Aether Release"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            public/agent_crypto_erith_ia/administrator/admin-ribbons.css \
            public/agent_crypto_erith_ia/administrator/app.js \
            public/agent_crypto_erith_ia/administrator/index.html \
            public/agent_crypto_erith_ia/administrator/js/aether.js \
            public/agent_crypto_erith_ia/administrator/js/app.js \
            public/agent_crypto_erith_ia/administrator/administrator-version.json \
            public/agent_crypto_erith_ia/administrator/version.json \
            coordination/inter_ai_dialogues/agent_crypto/AGENT_CRYPTO_BUILD_40_4_131_AUTO_CANONICAL.zip \
            coordination/inter_ai_dialogues/agent_crypto/AGENT_CRYPTO_BUILD_40_4_131_AUTO_CANONICAL.zip.sha256
          git rm coordination/inter_ai_dialogues/agent_crypto/patches/40.4.131.request.json
          git commit -m "fix Agent-Crypto 40.4.131 extend News reading flow and preserve auth truth panel"
          git pull --rebase origin main
          git push origin HEAD:main
