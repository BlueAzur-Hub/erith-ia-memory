name: Agent-Crypto 40.4.254 Technical Reading visual cache revision lock

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/agent-crypto-404254.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refresh visual cache generation only
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re

          base = Path('public/agent_crypto_erith_ia/administrator')
          version = json.loads((base/'version.json').read_text(encoding='utf-8'))
          assert version['build'] == '40.4.253', version['build']
          assert version['engine']['reference_build'] == '38.15.11'
          assert version['engine']['status'] == 'protected'

          cache_path = base/'js/admin-visual-cache.js'
          cache = cache_path.read_text(encoding='utf-8')
          assert 'const BUILD = "40.3.86";' in cache
          assert 'const GENERATION = "administrator-visuals-2026-08-23-v1";' in cache
          assert 'cache: "force-cache"' in cache
          assert 'const DB_NAME = "agent_crypto_visual_cache_v1";' in cache
          assert 'const DB_VERSION = 1;' in cache

          cache = cache.replace('const BUILD = "40.3.86";', 'const BUILD = "40.4.254";', 1)
          cache = cache.replace('const GENERATION = "administrator-visuals-2026-08-23-v1";', 'const GENERATION = "administrator-visuals-2026-09-05-404254-v2";', 1)
          cache = cache.replace('cache: "force-cache"', 'cache: "reload"', 1)
          cache_path.write_text(cache, encoding='utf-8')

          index_path = base/'index.html'
          index = index_path.read_text(encoding='utf-8')
          old = '<script src="./js/admin-visual-cache.js"></script>'
          new = '<script src="./js/admin-visual-cache.js?v=administrator-build-40.4.254"></script>'
          assert old in index
          assert new not in index
          index = index.replace(old, new, 1)
          index, count = re.subn(
              r'<script src="\./js/views/system-presentation\.js\?v=administrator-build-[^"]+"></script>',
              '<script src="./js/views/system-presentation.js?v=administrator-build-40.4.254"></script>',
              index,
              count=1,
          )
          assert count == 1, count
          index_path.write_text(index, encoding='utf-8')

          system_path = base/'js/views/system-presentation.js'
          system = system_path.read_text(encoding='utf-8')
          new_source = 'const SOURCE="./views/system.html?v=administrator-build-40.4.254";'
          system, count = re.subn(r'const SOURCE="\./views/system\.html\?v=administrator-build-[^"]+";', new_source, system, count=1)
          assert count == 1, count
          system_path.write_text(system, encoding='utf-8')

          contract = {
            'build': '40.4.254',
            'parent': '40.4.253',
            'technical_reading_cache_only': True,
            'visual_cache_database': 'agent_crypto_visual_cache_v1',
            'visual_cache_db_version': 1,
            'previous_generation': 'administrator-visuals-2026-08-23-v1',
            'generation': 'administrator-visuals-2026-09-05-404254-v2',
            'stale_generation_reused': False,
            'network_cache_mode_on_generation_miss': 'reload',
            'script_cache_buster': 'administrator-build-40.4.254',
            'database_global_purge': False,
            'private_visual_database_rewritten': False,
            'technical_reading_css_changed': False,
            'technical_reading_geometry_changed': False,
            'technical_reading_title_position_changed': False,
            'rnd_library_changed': False,
            'rnd_assets_changed': False,
            'graph_changed': False,
            'parallel_markets_changed': False,
            'atlas_changed': False,
            'oracle_changed': False,
            'math_core_changed': False,
            'window_manager_changed': False,
            'market_core_changed': False,
            'protected_market_core': '38.15.11',
            'new_timer': False,
            'new_observer': False,
            'new_websocket': False,
            'new_scheduler': False
          }
          Path('/tmp/contract-404254.json').write_text(json.dumps(contract, ensure_ascii=False, indent=2), encoding='utf-8')
          PY

      - name: Release identity 40.4.254
        shell: bash
        run: |
          python .github/scripts/agent_crypto_release_driver.py \
            --build 40.4.254 \
            --parent 40.4.253 \
            --release "TECHNICAL READING · VISUAL CACHE REVISION LOCK" \
            --status "technical_reading_visual_cache_revision_lock_404254" \
            --contract-key "technical_reading_visual_cache_revision_404254" \
            --contract-json /tmp/contract-404254.json \
            --lineage-note "40.4.254 rotates the persistent visual-cache generation after the corrected 1080x1920 Technical Reading RND assets, forces one network revalidation on generation miss, and cache-busts the cache runtime without changing CSS, geometry or image assets"

      - name: Visual cache proof assertions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          base = Path('public/agent_crypto_erith_ia/administrator')
          cache = (base/'js/admin-visual-cache.js').read_text(encoding='utf-8')
          index = (base/'index.html').read_text(encoding='utf-8')
          system = (base/'js/views/system-presentation.js').read_text(encoding='utf-8')
          version = json.loads((base/'version.json').read_text(encoding='utf-8'))
          build = json.loads((base/'build.json').read_text(encoding='utf-8'))

          assert version['build'] == '40.4.254'
          assert version['parent_build'] == '40.4.253'
          assert version['engine']['reference_build'] == '38.15.11'
          assert version['engine']['status'] == 'protected'
          assert build['build'] == '40.4.254'
          assert build['engine'] == '38.15.11'

          assert 'const BUILD = "40.4.254";' in cache
          assert 'const GENERATION = "administrator-visuals-2026-09-05-404254-v2";' in cache
          assert 'const DB_NAME = "agent_crypto_visual_cache_v1";' in cache
          assert 'const DB_VERSION = 1;' in cache
          assert 'cache: "reload"' in cache
          assert 'cache: "force-cache"' not in cache.split('/* ==========================================================================', 1)[0]
          assert 'void bootChartBackground();' in cache
          assert '<script src="./js/admin-visual-cache.js?v=administrator-build-40.4.254"></script>' in index
          assert '<script src="./js/views/system-presentation.js?v=administrator-build-40.4.254"></script>' in index
          assert 'admin-visual-assets.css?v=administrator-build-40.4.253R2' in index
          assert '<meta name="atlas-build" content="40.4.254"' in index
          assert '<meta name="administrator-build" content="40.4.254"' in index
          assert 'const SOURCE="./views/system.html?v=administrator-build-40.4.254";' in system
          PY

          node --check public/agent_crypto_erith_ia/administrator/js/admin-visual-cache.js
          node --check public/agent_crypto_erith_ia/administrator/app.js
          node --check public/agent_crypto_erith_ia/administrator/js/app.js
          python .github/scripts/agent_crypto_version_truth_guard.py \
            --expected-build 40.4.254 \
            --expected-release "TECHNICAL READING · VISUAL CACHE REVISION LOCK"

      - name: Scope guard
        shell: bash
        run: |
          python - <<'PY'
          import subprocess
          allowed = {
            'public/agent_crypto_erith_ia/administrator/administrator-version.json',
            'public/agent_crypto_erith_ia/administrator/app.js',
            'public/agent_crypto_erith_ia/administrator/build.json',
            'public/agent_crypto_erith_ia/administrator/index.html',
            'public/agent_crypto_erith_ia/administrator/js/admin-visual-cache.js',
            'public/agent_crypto_erith_ia/administrator/js/app.js',
            'public/agent_crypto_erith_ia/administrator/js/views/system-presentation.js',
            'public/agent_crypto_erith_ia/administrator/version.json',
          }
          changed=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          extra=changed-allowed
          missing=allowed-changed
          assert not extra, f'out-of-scope: {sorted(extra)}'
          assert not missing, f'missing expected release files: {sorted(missing)}'
          print('scope ok:', *sorted(changed), sep='\n- ')
          PY

      - name: Commit release
        shell: bash
        run: |
          git config user.name "Aether Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/agent_crypto_erith_ia/administrator
          git commit -m "agent-crypto: build 40.4.254 refresh Technical Reading visual cache generation"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Build differential package
        shell: bash
        run: |
          rm -rf /tmp/pkg /tmp/out
          mkdir -p /tmp/pkg /tmp/out
          git diff --name-only HEAD^ HEAD -- public/agent_crypto_erith_ia/administrator | while read f; do
            mkdir -p "/tmp/pkg/$(dirname "$f")"
            cp "$f" "/tmp/pkg/$f"
          done
          cat > /tmp/pkg/FILES_CHANGED_40.4.254.md <<'EOF'
          # Agent-Crypto 40.4.254 — changed files

          Technical Reading visual cache revision lock only.

          - Rotates the persistent visual cache generation from the August generation to a September 40.4.254 generation.
          - Keeps the same IndexedDB database and schema; no global purge is executed.
          - A stale-generation blob is ignored naturally and replaced only when that asset is requested again.
          - Uses `cache: reload` for the one network acquisition required after a generation miss.
          - Cache-busts `js/admin-visual-cache.js` itself with the 40.4.254 build token.
          - Does not change Technical Reading CSS, geometry, title position, RND library, RND image files, Graph, parallel markets, Atlas, Oracle, Math Core, Window Manager or Market Core.
          - Market Core 38.15.11 remains protected.
          EOF
          (cd /tmp/pkg && zip -qr /tmp/out/AGENT_CRYPTO_BUILD_40_4_254_TECHNICAL_READING_VISUAL_CACHE_REVISION_LOCK_CHANGED_FILES.zip .)
          sha256sum /tmp/out/*.zip | tee /tmp/out/AGENT_CRYPTO_BUILD_40_4_254_SHA256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: AGENT_CRYPTO_BUILD_40_4_254_TECHNICAL_READING_VISUAL_CACHE_REVISION_LOCK
          path: /tmp/out/*
          if-no-files-found: error
