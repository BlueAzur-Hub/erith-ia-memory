name: Agent Crypto HYPE Missing Bitget Spot Month
on:
  pull_request:
    paths:
      - '.github/workflows/agent-crypto-hype-missing-spot-month.yml'
      - 'public/agent_crypto_erith_ia/tools/collect_native_bitget_month.py'
      - 'public/agent_crypto_erith_ia/tools/native_bitget_month_test.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/agent-crypto-hype-missing-spot-month.yml'
  workflow_dispatch:
# A reviewed update to this exact workflow triggers a one-time main-only
# acquisition of the verified, previously absent June 2026 HYPE Spot month.
# Pull-request runs validate up to 300 native rows and never publish.
permissions:
  contents: write
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('hype-source-probe-pr-{0}', github.event.pull_request.number) || 'agent-crypto-bitget-immutable-native-month' }}
  cancel-in-progress: false
jobs:
  genuine-june-source:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regression tests for exact native minute boundaries and ZIP checks
        run: |
          set -euo pipefail
          python -m py_compile public/agent_crypto_erith_ia/tools/collect_native_bitget_month.py
          python public/agent_crypto_erith_ia/tools/native_bitget_month_test.py
      - name: Prove historical Bitget Spot June source exists, do not generate bars
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,sys
          from pathlib import Path
          root=Path("public/agent_crypto_erith_ia")
          base=root/"data/historical_archive_prototype"
          sys.path.insert(0,str(root/"tools"))
          import collect_native_bitget_month as native
          month="2026-06"
          fed=json.loads((base/"top250_multisource_coverage/index.json").read_text())
          bit=json.loads((base/"bitget_verified_views/index.json").read_text())
          a=next(x for x in fed["assets"] if x["id"]=="hyperliquid")
          b=next(x for x in bit["assets"] if x["id"]=="hyperliquid")
          assert a["id"]==b["id"]=="hyperliquid" and a["symbol"]==b["symbol"]=="HYPE"
          assert a["quote"]==b["quote"]=="USDT" and b["pair"]=="HYPEUSDT"
          assert a["source"]=="Bitget Spot native 1m HTTPS"
          assert month not in b["months"] and month not in {"2025-01","2026-02","2026-07","2026-08","2026-09"}
          start,end,expected=native.bounds(month)
          assert expected==43200
          # At most 300 genuine minute candles inspected, strictly source-read-only.
          for point in (start,start+14*86400000,end-100*native.STEP):
              rows,sha=native.fetch_history_page("HYPEUSDT",point,point+100*native.STEP,100)
              native.verify_page(rows,point,100)
              assert len(sha)==64
              print("HYPE JUNE NATIVE SPOT SAMPLE",point,"rows",len(rows),
                    "response_sha256",sha,flush=True)
          print("HYPE JUNE 2026 SOURCE SAMPLE VERIFIED; NO RELEASE PUBLISHED",flush=True)
          PY
      - name: Publish original complete HYPE June 2026 1m native month only
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,subprocess,sys,tempfile
          from pathlib import Path
          root=Path("public/agent_crypto_erith_ia")
          base=root/"data/historical_archive_prototype"
          sys.path.insert(0,str(root/"tools"))
          import collect_native_bitget_month as native
          fed=json.loads((base/"top250_multisource_coverage/index.json").read_text())
          bit=json.loads((base/"bitget_verified_views/index.json").read_text())
          a=next(x for x in fed["assets"] if x["id"]=="hyperliquid")
          b=next(x for x in bit["assets"] if x["id"]=="hyperliquid")
          assert a["id"]=="hyperliquid" and a["symbol"]=="HYPE" and a["quote"]=="USDT"
          assert a["source"]=="Bitget Spot native 1m HTTPS"
          assert b["id"]==a["id"] and b["symbol"]==a["symbol"] and b["pair"]=="HYPEUSDT"
          asset={"id":"hyperliquid","rank":a["rank"],"name":a["name"],
                 "symbol":"HYPE","pair":"HYPEUSDT","venue":"bitget","quote":"USDT"}
          month="2026-06"
          tag=native.release_tag(asset,month)
          present=subprocess.run(["gh","release","view",tag,"--json","tagName"],
                                 capture_output=True,text=True,timeout=45)
          if present.returncode==0:
              print("ALREADY ARCHIVED",tag,flush=True)
              sys.exit(0)
          assert ("not found" in present.stderr.lower() or "http 404" in present.stderr.lower()),(
              "Refuse release inventory transport error: "+present.stderr[:120])
          with tempfile.TemporaryDirectory(prefix="seven-hype-real-june-") as td:
              folder=Path(td)
              manifest=native.execute_one(asset,month,folder,delay=0.08)
              assert manifest["verified"]==1 and manifest["candles"]==43200
              assert manifest["no_synthetic_candles"] is True
              assert manifest["assets"][0]["asset_id"]=="hyperliquid"
              assert manifest["assets"][0]["pair"]=="HYPEUSDT"
              tag=native.publish(asset,month,folder,manifest)
              print("NEW GENUINE SPOT DATA",json.dumps({
                "coin_id":asset["id"],"pair":asset["pair"],"month":month,
                "native_ohlcv_rows":manifest["candles"],"tag":tag,
                "sha256":manifest["assets"][0]["sha256"],
                "not_exchange_signed":manifest["not_exchange_signed"]
              },sort_keys=True),flush=True)
          PY
      - name: Assert no mutation to the Trader, Administrator or source indexes
        if: always()
        run: |
          set -euo pipefail
          git diff --exit-code -- public/agent_crypto_erith_ia/administrator/ \
            public/agent_crypto_erith_ia/trader/ \
            public/agent_crypto_erith_ia/core/ \
            public/agent_crypto_erith_ia/data/historical_archive_prototype/ \
            public/agent_crypto_erith_ia/data/crypto/
