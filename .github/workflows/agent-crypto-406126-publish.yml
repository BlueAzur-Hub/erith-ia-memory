name: Agent-Crypto 40.6.126 publish

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/agent-crypto-406126-publish.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify bounded 40.6.126 surgery
        shell: bash
        run: |
          set -euo pipefail
          ROOT='public/agent_crypto_erith_ia/administrator'
          test -f "$ROOT/js/current-final-state-rebind.js"
          test -f "$ROOT/releases/40.6.126/index.html"
          test -f "$ROOT/releases/40.6.126/runtime-shell.html"
          test -f "$ROOT/releases/40.6.126/js/version-truth.js"
          grep -F 'ATLAS FINAL STATE REBIND' "$ROOT/js/current-final-state-rebind.js"
          grep -F 'atlasAutomation341SetRestStatus' "$ROOT/js/current-final-state-rebind.js"
          grep -F 'atlasCanonicalCurrentUiTruth389' "$ROOT/js/current-final-state-rebind.js"
          grep -F './js/current-final-state-rebind.js' "$ROOT/js/runtime-modules.js"
          grep -F 'content="40.6.126"' "$ROOT/releases/40.6.126/index.html"
          node --check "$ROOT/js/current-final-state-rebind.js"
          node --check "$ROOT/js/runtime-modules.js"

      - name: Publish build truth 40.6.126
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from datetime import datetime, timezone
          import json

          path = Path('public/agent_crypto_erith_ia/administrator/build.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          if data.get('build') != '40.6.125' or data.get('engine') != '38.15.11':
              raise SystemExit(f"STOP build truth drift: {data.get('build')} / {data.get('engine')}")

          data.update({
              'build': '40.6.126',
              'release': 'ATLAS FINAL STATE REBIND',
              'status': 'atlas_final_state_rebind_406126',
              'parent_build': '40.6.125',
              'asset_token': 'market-core-v2.0-alpha-build-40.6.126',
              'administrator_build': '40.6.126',
              'build_label': 'Build 40.6.126 · Administrator',
              'release_status': 'atlas_final_state_rebind_406126',
              'entry': './releases/40.6.126/',
              'released_at': datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00', 'Z'),
              'market_core_modified': False,
              'web_classic_modified': False,
              'aether_modified': False,
              'atlas_current_modified': False,
              'oracle_modified': False,
              'lecture_technique_modified': False,
              'strategy_a_modified': False,
              'automatic_order': False,
              'real_order': False,
              'new_recurring_timer': False,
              'new_observer': False,
              'new_storage_owner': False,
          })

          data['current_final_state_rebind'] = {
              'introduced_in': '40.6.126',
              'scope': 'event-driven presentation convergence after canonical CURRENT closure; removes F5 dependency for the final local dialogue state',
              'runtime_patch': 'js/current-final-state-rebind.js',
              'loader': 'js/runtime-modules.js',
              'canonical_rest_boundary': 'atlasAutomation341SetRestStatus',
              'fallback_current_memory_boundary': 'atlasCurrentMemoryReconcile384',
              'canonical_ui_truth_reused': 'atlasCanonicalCurrentUiTruth389',
              'presentation_owner_reused': 'AgentCryptoLocalDialoguePresentation.sync',
              'finalization_event': 'agentcrypto:current-finalized',
              'bounded_double_animation_frame': True,
              'analytical_mutation': False,
              'market_data_changed': False,
              'market_core_changed': False,
              'graph_changed': False,
              'lecture_technique_changed': False,
              'aether_changed': False,
              'oracle_changed': False,
              'strategy_a_changed': False,
              'tradus_changed': False,
              'trading_changed': False,
              'wallet_changed': False,
              'fetch': False,
              'recurring_timer': False,
              'observer': False,
              'storage_write': False,
              'firefox_terrain_proof': 'pending: next natural CURRENT must converge to CURRENT VALIDÉ / REPOS and final elegant panel without F5'
          }

          cleanup = data.setdefault('versioning_cleanup', {})
          files = list(cleanup.get('canonical_active_files') or [])
          if 'js/current-final-state-rebind.js' not in files:
              files.append('js/current-final-state-rebind.js')
          cleanup['canonical_active_files'] = files
          cleanup['current_final_state_rebind_runtime_owner'] = 'js/current-final-state-rebind.js'

          lineage = list(data.get('recent_validated_lineage') or [])
          for item in (
              '40.6.124 STRATEGY A OWNER API AUTO-START',
              '40.6.125 LOCAL DIALOGUE PLACEMENT LOCK',
              '40.6.126 ATLAS FINAL STATE REBIND',
          ):
              if item not in lineage:
                  lineage.append(item)
          data['recent_validated_lineage'] = lineage

          history = data.setdefault('history', {})
          history.update({
              'authority': 'git',
              'previous_full_manifest_build': '40.6.125',
              'previous_full_manifest_blob': 'c3d1f540af7549fce1922182c636f89af1b64b3a',
              'do_not_duplicate_release_history_in_active_manifest': True,
          })

          path.write_text(json.dumps(data, ensure_ascii=False, separators=(',', ':')) + '\n', encoding='utf-8')
          PY

          python - <<'PY'
          from pathlib import Path
          import json
          p = Path('public/agent_crypto_erith_ia/administrator/build.json')
          d = json.loads(p.read_text(encoding='utf-8'))
          assert d['build'] == '40.6.126'
          assert d['parent_build'] == '40.6.125'
          assert d['engine'] == '38.15.11'
          assert d['entry'] == './releases/40.6.126/'
          c = d['current_final_state_rebind']
          assert c['runtime_patch'] == 'js/current-final-state-rebind.js'
          assert c['recurring_timer'] is False
          assert c['observer'] is False
          assert c['storage_write'] is False
          print('40.6.126 MANIFEST PASS')
          PY

      - name: Commit published manifest and self-clean
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Aether Release'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/agent-crypto-406126-publish.yml
          git add public/agent_crypto_erith_ia/administrator/build.json
          git diff --cached --check
          git commit -m 'release(agent-crypto): publish 40.6.126 final-state rebind'
          git pull --rebase origin main
          git push origin HEAD:main
