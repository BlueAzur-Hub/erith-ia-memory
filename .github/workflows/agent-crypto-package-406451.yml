name: Agent-Crypto Package 40.6.451 Execution Cost Table Layout

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/agent-crypto-package-406451.yml'

permissions:
  contents: write

jobs:
  validate-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Validate 40.6.451
        shell: bash
        run: |
          set -euo pipefail
          ROOT="public/agent_crypto_erith_ia/administrator"
          python - <<'PY'
          import json,re
          from pathlib import Path
          root=Path("public/agent_crypto_erith_ia/administrator")
          css=(root/"strategy-human-readability.css").read_text(encoding="utf-8")
          idx=(root/"index.html").read_text(encoding="utf-8")
          b=json.loads((root/"build.json").read_text(encoding="utf-8"))
          receipt=json.loads((root/"EXECUTION_COST_TABLE_LAYOUT_TEST_40.6.451.json").read_text(encoding="utf-8"))
          checks={
            "build":b.get("build")=="40.6.451",
            "market_core":b.get("market_core")=="38.15.11",
            "css_token":'strategy-human-readability.css?v=40.6.451' in idx,
            "css_in_head":idx.find("strategy-human-readability.css") < idx.find("</head>"),
            "no_markup_literal_newline":re.search(r'>\\n\s*<',idx) is None,
            "table_min_zero":'#strategyAExecutionCostTruth table {' in css and 'min-width:0;' in css,
            "fixed_layout":'table-layout:fixed;' in css,
            "wrap":'overflow-wrap:anywhere;' in css,
            "column_34":'td:nth-child(4) {width:34%}' in css,
            "receipt":receipt.get("pass") is True and receipt.get("representative_layout",{}).get("candidate",{}).get("overflow_px")==0,
          }
          bad=[k for k,v in checks.items() if not v]
          if bad: raise SystemExit(f"40.6.451 validation failed: {bad}")
          print("40.6.451 EXECUTION COST TABLE LAYOUT STATIC PASS")
          PY

          if git diff --name-only HEAD^ HEAD -- "$ROOT/js" | grep -q .; then
            echo "Unexpected JS change in presentation-only 40.6.451" >&2
            git diff --name-only HEAD^ HEAD -- "$ROOT/js" >&2
            exit 1
          fi

      - name: Build bounded ZIP
        shell: bash
        run: |
          set -euo pipefail
          ROOT="public/agent_crypto_erith_ia/administrator"
          ZIP="$ROOT/AGENT_CRYPTO_EXECUTION_COST_TABLE_LAYOUT_40.6.451.zip"
          SHA="$ZIP.sha256"
          rm -f "$ZIP" "$SHA"
          rm -rf /tmp/agent-crypto-406451
          mkdir -p /tmp/agent-crypto-406451/administrator
          cp "$ROOT/index.html" /tmp/agent-crypto-406451/administrator/
          cp "$ROOT/index-40.6.451.html" /tmp/agent-crypto-406451/administrator/
          cp "$ROOT/build.json" /tmp/agent-crypto-406451/administrator/
          cp "$ROOT/RELEASE.md" /tmp/agent-crypto-406451/administrator/
          cp "$ROOT/HANDOFF.md" /tmp/agent-crypto-406451/administrator/
          cp "$ROOT/PATCH_MANIFEST_40.6.451.txt" /tmp/agent-crypto-406451/administrator/
          cp "$ROOT/EXECUTION_COST_TABLE_LAYOUT_TEST_40.6.451.json" /tmp/agent-crypto-406451/administrator/
          cp "$ROOT/strategy-human-readability.css" /tmp/agent-crypto-406451/administrator/
          (cd /tmp/agent-crypto-406451 && zip -9 -r "$GITHUB_WORKSPACE/$ZIP" .)
          unzip -t "$ZIP"
          sha256sum "$ZIP" > "$SHA"

      - name: Commit package
        shell: bash
        run: |
          set -euo pipefail
          ROOT="public/agent_crypto_erith_ia/administrator"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$ROOT/AGENT_CRYPTO_EXECUTION_COST_TABLE_LAYOUT_40.6.451.zip" "$ROOT/AGENT_CRYPTO_EXECUTION_COST_TABLE_LAYOUT_40.6.451.zip.sha256"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore(package): add Agent-Crypto 40.6.451 Execution Cost table layout ZIP"
          git pull --rebase origin main
          git push origin HEAD:main
