name: Agent-Crypto 40.4.241 Technical Reading frame geometry lock

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/agent-crypto-404241.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace Technical Reading wrapper geometry owner
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re, textwrap

          base = Path('public/agent_crypto_erith_ia/administrator')
          version = json.loads((base/'version.json').read_text(encoding='utf-8'))
          assert version['build'] == '40.4.240', version['build']
          assert version['engine']['reference_build'] == '38.15.11'
          assert version['engine']['status'] == 'protected'

          index_path = base/'index.html'
          text = index_path.read_text(encoding='utf-8')
          assert text.count('atlasTechnicalReadingSinglePortraitOwner404240') == 1
          assert 'atlasTechnicalReadingFrameGeometry404241' not in text

          owner = textwrap.dedent(r'''
            <style id="atlasTechnicalReadingFrameGeometry404241">
              /* 40.4.241 — TECHNICAL READING FRAME GEOMETRY LOCK
                 Parent-wrapper correction only. The portrait wrapper itself is the
                 single full-panel background owner: absolute inset 0, no historical
                 136px preview reservation, no bottom dead zone. RND, local picker,
                 storage, focal x/y, HUD semantics and all market runtimes are untouched. */
              body.atlas-administrator-mirror
              #analyste.champagne-clean-lens:not(.detail-collapsed)
              #detailPanel.atlas-tech-static-cycle.atlas-classic-web-tech-40261 {
                position: relative !important;
                overflow: hidden !important;
              }

              body.atlas-administrator-mirror
              #analyste.champagne-clean-lens:not(.detail-collapsed)
              #detailPanel.atlas-tech-static-cycle.atlas-classic-web-tech-40261::before,
              body.atlas-administrator-mirror
              #analyste.champagne-clean-lens:not(.detail-collapsed)
              #detailPanel.atlas-tech-static-cycle.atlas-classic-web-tech-40261::after {
                content: none !important;
                display: none !important;
                background: none !important;
                opacity: 0 !important;
              }

              body.atlas-administrator-mirror
              #analyste.champagne-clean-lens:not(.detail-collapsed)
              #detailPanel.atlas-tech-static-cycle.atlas-classic-web-tech-40261
              .detail-project-visual.admin-tech-r3 {
                position: absolute !important;
                inset: 0 !important;
                top: 0 !important;
                right: 0 !important;
                bottom: 0 !important;
                left: 0 !important;
                display: block !important;
                width: 100% !important;
                height: 100% !important;
                min-width: 0 !important;
                min-height: 0 !important;
                max-width: none !important;
                max-height: none !important;
                margin: 0 !important;
                padding: 0 !important;
                flex: none !important;
                aspect-ratio: auto !important;
                overflow: hidden !important;
                background: transparent !important;
                border: 0 !important;
                border-radius: 0 !important;
                box-shadow: none !important;
                z-index: 0 !important;
              }

              body.atlas-administrator-mirror
              #analyste.champagne-clean-lens:not(.detail-collapsed)
              #detailPanel.atlas-tech-static-cycle.atlas-classic-web-tech-40261
              .detail-project-visual.admin-tech-r3 > .admin-tech-portrait-r3 {
                position: absolute !important;
                inset: 0 !important;
                top: 0 !important;
                right: 0 !important;
                bottom: 0 !important;
                left: 0 !important;
                width: 100% !important;
                height: 100% !important;
                min-width: 100% !important;
                min-height: 100% !important;
                max-width: none !important;
                max-height: none !important;
                margin: 0 !important;
                padding: 0 !important;
                object-fit: cover !important;
                object-position: var(--admin-tech-x,50%) var(--admin-tech-y,50%) !important;
                opacity: 1 !important;
                filter: none !important;
                transform: none !important;
                z-index: 0 !important;
                pointer-events: none !important;
              }

              body.atlas-administrator-mirror
              #analyste.champagne-clean-lens:not(.detail-collapsed)
              #detailPanel.atlas-tech-static-cycle.atlas-classic-web-tech-40261 > .detail-panel-toggle,
              body.atlas-administrator-mirror
              #analyste.champagne-clean-lens:not(.detail-collapsed)
              #detailPanel.atlas-tech-static-cycle.atlas-classic-web-tech-40261 > .atlas-tech-static-toolbar,
              body.atlas-administrator-mirror
              #analyste.champagne-clean-lens:not(.detail-collapsed)
              #detailPanel.atlas-tech-static-cycle.atlas-classic-web-tech-40261 > .detail-panel-body {
                position: relative !important;
                z-index: 3 !important;
              }

              body.atlas-administrator-mirror
              #analyste.champagne-clean-lens:not(.detail-collapsed)
              #detailPanel.atlas-tech-static-cycle.atlas-classic-web-tech-40261 > .detail-panel-body {
                min-height: 0 !important;
                background: transparent !important;
              }
            </style>
          ''')

          old_owner = re.compile(
              r'\n?<style id="atlasTechnicalReadingSinglePortraitOwner404240">.*?</style>\n?',
              re.S,
          )
          text, count = old_owner.subn('\n\n' + owner + '\n', text, count=1)
          assert count == 1, count
          assert 'atlasTechnicalReadingSinglePortraitOwner404240' not in text
          assert text.count('atlasTechnicalReadingFrameGeometry404241') == 1

          old_script = '<script src="./js/views/system-presentation.js?v=administrator-build-40.4.240"></script>'
          new_script = '<script src="./js/views/system-presentation.js?v=administrator-build-40.4.241"></script>'
          assert old_script in text
          assert new_script not in text
          text = text.replace(old_script, new_script, 1)
          index_path.write_text(text, encoding='utf-8')

          system_path = base/'js/views/system-presentation.js'
          system = system_path.read_text(encoding='utf-8')
          old_source = 'const SOURCE="./views/system.html?v=administrator-build-40.4.240";'
          new_source = 'const SOURCE="./views/system.html?v=administrator-build-40.4.241";'
          assert old_source in system
          assert new_source not in system
          system_path.write_text(system.replace(old_source, new_source, 1), encoding='utf-8')

          contract = {
            'build': '40.4.241',
            'parent': '40.4.240',
            'visual_only': True,
            'technical_reading_only': True,
            'user_screenshot_contract': 'portrait_wrapper_fills_complete_technical_reading_panel_without_bottom_dead_zone',
            'single_wrapper_owner': True,
            'wrapper_position': 'absolute',
            'wrapper_inset': '0',
            'wrapper_width': '100%',
            'wrapper_height': '100%',
            'legacy_preview_height_reservation_retired': True,
            'portrait_fit': 'cover',
            'object_position_variables_preserved': True,
            'foreground_hud_z_order_preserved': True,
            'system_source_cache_token_synced': True,
            'system_presentation_script_cache_token_synced': True,
            'rnd_library_changed': False,
            'rnd_assets_changed': False,
            'local_upload_changed': False,
            'private_image_storage_changed': False,
            'graph_changed': False,
            'parallel_markets_changed': False,
            'atlas_changed': False,
            'math_core_changed': False,
            'window_manager_changed': False,
            'market_core_changed': False,
            'protected_market_core': '38.15.11',
            'new_timer': False,
            'new_observer': False,
            'new_fetch': False,
            'new_websocket': False,
            'new_scheduler': False
          }
          Path('/tmp/contract-404241.json').write_text(
              json.dumps(contract, ensure_ascii=False, indent=2), encoding='utf-8'
          )
          PY

      - name: Release identity 40.4.241
        run: |
          python .github/scripts/agent_crypto_release_driver.py \
            --build 40.4.241 \
            --parent 40.4.240 \
            --release "TECHNICAL READING · FRAME GEOMETRY OWNER LOCK" \
            --status "technical_reading_frame_geometry_owner_404241" \
            --contract-key "technical_reading_frame_geometry_owner_404241" \
            --contract-json /tmp/contract-404241.json \
            --lineage-note "40.4.241 Technical Reading parent-wrapper geometry lock; historical 136px preview reservation retired and wrapper promoted to absolute full-panel owner"

      - name: Technical Reading frame proof assertions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          base=Path('public/agent_crypto_erith_ia/administrator')
          index=(base/'index.html').read_text(encoding='utf-8')
          app=(base/'js/app.js').read_text(encoding='utf-8')
          system=(base/'js/views/system-presentation.js').read_text(encoding='utf-8')
          version=json.loads((base/'version.json').read_text(encoding='utf-8'))

          assert version['build']=='40.4.241'
          assert version['parent_build']=='40.4.240'
          assert version['engine']['reference_build']=='38.15.11'
          assert version['engine']['status']=='protected'
          assert 'atlasTechnicalReadingSinglePortraitOwner404240' not in index
          assert index.count('atlasTechnicalReadingFrameGeometry404241') == 1

          start=index.index('<style id="atlasTechnicalReadingFrameGeometry404241">')
          end=index.index('</style>', start)
          owner=index[start:end]
          for proof in (
              '.detail-project-visual.admin-tech-r3 {',
              'position: absolute !important;',
              'inset: 0 !important;',
              'width: 100% !important;',
              'height: 100% !important;',
              'min-height: 0 !important;',
              'max-height: none !important;',
              'flex: none !important;',
              'object-fit: cover !important;',
              'object-position: var(--admin-tech-x,50%) var(--admin-tech-y,50%) !important;',
              'z-index: 3 !important;',
          ):
              assert proof in owner, proof

          assert '<script src="./js/views/system-presentation.js?v=administrator-build-40.4.241"></script>' in index
          assert 'const ADMIN_BUILD = "40.4.241";' in app
          assert 'const ENGINE_BUILD = "38.15.11";' in app
          assert 'const SOURCE="./views/system.html?v=administrator-build-40.4.241";' in system
          for name in ('technical-random-11.png','technical-random-12.png','technical-random-16.png'):
              assert name in index, name
          PY

          python .github/scripts/agent_crypto_version_truth_guard.py \
            --expected-build 40.4.241 \
            --expected-release "TECHNICAL READING · FRAME GEOMETRY OWNER LOCK"

      - name: Scope guard
        shell: bash
        run: |
          python - <<'PY'
          import subprocess
          allowed={
            'public/agent_crypto_erith_ia/administrator/administrator-version.json',
            'public/agent_crypto_erith_ia/administrator/app.js',
            'public/agent_crypto_erith_ia/administrator/build.json',
            'public/agent_crypto_erith_ia/administrator/index.html',
            'public/agent_crypto_erith_ia/administrator/js/app.js',
            'public/agent_crypto_erith_ia/administrator/js/views/system-presentation.js',
            'public/agent_crypto_erith_ia/administrator/version.json',
          }
          changed=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          extra=changed-allowed
          missing=allowed-changed
          assert not extra, f'out-of-scope: {sorted(extra)}'
          assert not missing, f'missing expected identity files: {sorted(missing)}'
          print('scope ok:', *sorted(changed), sep='\n- ')
          PY

      - name: Commit release
        shell: bash
        run: |
          git config user.name "Aether Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/agent_crypto_erith_ia/administrator
          git commit -m "agent-crypto: build 40.4.241 lock Technical Reading frame geometry owner"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Build differential package
        shell: bash
        run: |
          mkdir -p /tmp/pkg
          git diff --name-only HEAD^ HEAD | while read f; do
            mkdir -p "/tmp/pkg/$(dirname "$f")"
            cp "$f" "/tmp/pkg/$f"
          done
          cat > /tmp/pkg/FILES_CHANGED_40.4.241.md <<'EOF'
          # Agent-Crypto 40.4.241 — changed files

          Technical Reading only: parent-wrapper geometry correction.

          - Replaces the 40.4.240 portrait owner instead of stacking another competing owner.
          - The `.detail-project-visual.admin-tech-r3` wrapper is now absolute `inset: 0`, `100% × 100%`.
          - Historical 136px preview-strip height/min-height/max-height/flex reservation is neutralized by the final owner.
          - Portrait remains `object-fit: cover` with existing `--admin-tech-x/y` focal variables.
          - HUD/title/temporal/RND controls/detail body remain foreground layers.
          - RND library/assets, local upload/storage, Graph, Parallel Markets, Atlas, Math Core, Window Manager and Market Core are unchanged.
          EOF
          cd /tmp/pkg
          zip -qr /tmp/AGENT_CRYPTO_BUILD_40_4_241_TECHNICAL_READING_FRAME_GEOMETRY_OWNER_CHANGED_FILES.zip .
          sha256sum /tmp/AGENT_CRYPTO_BUILD_40_4_241_TECHNICAL_READING_FRAME_GEOMETRY_OWNER_CHANGED_FILES.zip

      - uses: actions/upload-artifact@v4
        with:
          name: AGENT_CRYPTO_BUILD_40_4_241_TECHNICAL_READING_FRAME_GEOMETRY_OWNER_CHANGED_FILES
          path: /tmp/AGENT_CRYPTO_BUILD_40_4_241_TECHNICAL_READING_FRAME_GEOMETRY_OWNER_CHANGED_FILES.zip
          if-no-files-found: error
