name: Agent-Crypto 40.4.176 Runtime Version Authority Lock

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/agent-crypto-40-4-176-runtime-version-authority-lock.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main

      - name: Patch 40.4.176 runtime version authority
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, json
          from datetime import datetime, timezone

          base = Path('public/agent_crypto_erith_ia/administrator')
          build = '40.4.176'
          parent = '40.4.175'
          release = 'RUNTIME VERSION AUTHORITY LOCK · CACHE-BUSTED OWNERS'
          status = 'runtime_version_authority_lock_cache_busted_owners'
          now = datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z')

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{p}: expected exactly 1 occurrence, got {count}: {old!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # Shared 3 MB runtime: this is the version-awareness owner used by the top badge.
          replace_once(base/'app.js', 'const ATLAS_BUILD = "40.4.167";', f'const ATLAS_BUILD = "{build}";')

          # Administrator runtime identity owner.
          replace_once(base/'js/app.js', 'const ADMIN_BUILD = "40.4.174";', f'const ADMIN_BUILD = "{build}";')
          replace_once(base/'js/app.js', 'const ADMIN_RELEASE = "DOMAIN SKELETON MIRROR · CRYPTO MASTER";', f'const ADMIN_RELEASE = "{release}";')

          # HTML publication identity + critical runtime cache busting + first-paint footer truth.
          index = base/'index.html'
          text = index.read_text(encoding='utf-8')
          replacements = [
              ('<meta name="atlas-build" content="40.4.175" />', f'<meta name="atlas-build" content="{build}" />'),
              ('<meta name="administrator-build" content="40.4.175" />', f'<meta name="administrator-build" content="{build}" />'),
              ('<meta name="administrator-release" content="VERSION TRUTH LOCK · DOMAIN SKELETON MIRROR" />', f'<meta name="administrator-release" content="{release}" />'),
              ('<meta name="atlas-asset-token" content="market-core-v2.0-alpha-build-40.4.175" />', f'<meta name="atlas-asset-token" content="market-core-v2.0-alpha-build-{build}" />'),
              ('<title>Agent-Crypto @erith.IA — Build 40.4.175 · Administrator</title>', f'<title>Agent-Crypto @erith.IA — Build {build} · Administrator</title>'),
              ('<script src="./app.js?v=administrator-build-40.4.168R1"></script>', f'<script src="./app.js?v=administrator-build-{build}"></script>'),
              ('<script src="./js/app.js?v=administrator-build-40.4.173"></script>', f'<script src="./js/app.js?v=administrator-build-{build}"></script>'),
              ('<span id="footerRelease">Agent-Crypto @erith.IA · Market Core · Build 40.4.167 · Version : PARALLEL MARKETS ROUTER · CRYPTO + METALS DOMAIN SEPARATION LOCK</span>', f'<span id="footerRelease">Agent-Crypto @erith.IA · Market Core · Build {build} · Version : Parker Lewis Can\'t Lose</span>'),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{index}: expected exactly 1 occurrence, got {count}: {old!r}')
              text = text.replace(old, new, 1)
          index.write_text(text, encoding='utf-8')

          # Canonical public manifest.
          vp = base/'version.json'
          manifest = json.loads(vp.read_text(encoding='utf-8'))
          if manifest.get('build') != parent:
              raise SystemExit(f'version.json parent mismatch: {manifest.get("build")} != {parent}')
          manifest['release'] = release
          manifest['build'] = build
          manifest['asset_token'] = f'market-core-v2.0-alpha-build-{build}'
          manifest['status'] = status
          manifest['prepared_at'] = now
          manifest['published_at'] = now
          manifest['parent_build'] = parent
          manifest['revision'] = 'V1'
          lineage = str(manifest.get('lineage') or '')
          if '40.4.175 Version Truth Lock' not in lineage:
              lineage += ' → 40.4.175 Version Truth Lock: index/manifests advanced but runtime owners remained stale; superseded by 40.4.176.'
          if '40.4.176 Runtime Version Authority Lock' not in lineage:
              lineage += ' → 40.4.176 Runtime Version Authority Lock: root app.js + js/app.js + critical cache URLs + footer + manifest hashes converged.'
          manifest['lineage'] = lineage
          contracts = manifest.setdefault('contracts', {})
          contracts['runtime_version_authority_404176'] = {
              'schema': 'erith.admin.runtime-version-authority.v1',
              'build': build,
              'parent_build': parent,
              'root_runtime_owner': 'app.js::ATLAS_BUILD',
              'administrator_runtime_owner': 'js/app.js::ADMIN_BUILD',
              'html_meta_owner': 'index.html::meta[atlas-build]',
              'manifest_owner': 'version.json::build',
              'administrator_manifest_owner': 'administrator-version.json::build',
              'critical_runtime_cache_busting': True,
              'static_footer_matches_runtime': True,
              'payload_hashes_recomputed': True,
              'market_core_modified': False,
              'business_semantics_changed': False,
              'new_network_owner': False,
              'new_timer': False,
              'new_observer': False,
              'new_storage_owner': False,
          }

          # Recompute every manifest-owned payload hash from the final working tree.
          files = manifest.get('files')
          if not isinstance(files, dict) or not files:
              raise SystemExit('version.json files hash map missing')
          for rel in list(files):
              p = base/rel
              if not p.is_file():
                  raise SystemExit(f'manifest hash target missing: {rel}')
              files[rel] = hashlib.sha256(p.read_bytes()).hexdigest()
          vp.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          # Administrator mirror manifest.
          ap = base/'administrator-version.json'
          admin = json.loads(ap.read_text(encoding='utf-8'))
          if admin.get('build') != parent:
              raise SystemExit(f'administrator-version.json parent mismatch: {admin.get("build")} != {parent}')
          admin['build'] = build
          admin['global_versioning'] = build
          admin['release'] = release
          admin['status'] = status
          admin['prepared_at'] = now
          admin['published_at'] = now
          admin['parent_build'] = parent
          admin['revision'] = 'V1'
          admin.setdefault('contracts', {})['runtime_version_authority_404176'] = contracts['runtime_version_authority_404176']
          ap.write_text(json.dumps(admin, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Validate 40.4.176 version truth
        shell: bash
        run: |
          node --check public/agent_crypto_erith_ia/administrator/app.js
          node --check public/agent_crypto_erith_ia/administrator/js/app.js
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, re
          base = Path('public/agent_crypto_erith_ia/administrator')
          build = '40.4.176'
          index = (base/'index.html').read_text(encoding='utf-8')
          root = (base/'app.js').read_text(encoding='utf-8')
          adminjs = (base/'js/app.js').read_text(encoding='utf-8')
          version = json.loads((base/'version.json').read_text(encoding='utf-8'))
          mirror = json.loads((base/'administrator-version.json').read_text(encoding='utf-8'))

          checks = {
              'meta_atlas': f'<meta name="atlas-build" content="{build}" />' in index,
              'meta_admin': f'<meta name="administrator-build" content="{build}" />' in index,
              'root_runtime': f'const ATLAS_BUILD = "{build}";' in root,
              'admin_runtime': f'const ADMIN_BUILD = "{build}";' in adminjs,
              'root_cache_url': f'./app.js?v=administrator-build-{build}' in index,
              'admin_cache_url': f'./js/app.js?v=administrator-build-{build}' in index,
              'static_footer': f'Market Core · Build {build} · Version : Parker Lewis Can\'t Lose' in index,
              'manifest_build': version.get('build') == build,
              'manifest_token': version.get('asset_token') == f'market-core-v2.0-alpha-build-{build}',
              'mirror_build': mirror.get('build') == build,
              'mirror_global': mirror.get('global_versioning') == build,
              'engine_protected': version.get('engine',{}).get('reference_build') == '38.15.11',
          }
          bad = [k for k,v in checks.items() if not v]
          if bad:
              raise SystemExit('version truth failed: ' + ', '.join(bad))

          for rel, expected in version.get('files', {}).items():
              actual = hashlib.sha256((base/rel).read_bytes()).hexdigest()
              if actual != expected:
                  raise SystemExit(f'hash mismatch {rel}: {expected} != {actual}')

          # Critical stale identities must be gone from active owners / first paint.
          if 'const ATLAS_BUILD = "40.4.167";' in root:
              raise SystemExit('stale root runtime build 40.4.167 remains')
          if 'const ADMIN_BUILD = "40.4.174";' in adminjs:
              raise SystemExit('stale admin runtime build 40.4.174 remains')
          if 'id="footerRelease">Agent-Crypto @erith.IA · Market Core · Build 40.4.167' in index:
              raise SystemExit('stale static footer 40.4.167 remains')
          PY

      - name: Commit release and retire one-shot
        shell: bash
        run: |
          git rm .github/workflows/agent-crypto-40-4-176-runtime-version-authority-lock.yml
          git add public/agent_crypto_erith_ia/administrator/app.js \
                  public/agent_crypto_erith_ia/administrator/js/app.js \
                  public/agent_crypto_erith_ia/administrator/index.html \
                  public/agent_crypto_erith_ia/administrator/version.json \
                  public/agent_crypto_erith_ia/administrator/administrator-version.json
          git commit -m "release Agent-Crypto 40.4.176 runtime version authority lock"
          git pull --rebase origin main
          git push origin main
