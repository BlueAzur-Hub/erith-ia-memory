name: Agent-Crypto 40.4.225 Module 01 Explained View R3

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/agent-crypto-40-4-225-module01-r3.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebase and parent guard
        shell: bash
        run: |
          git fetch origin main
          git checkout main
          git pull --ff-only origin main
          echo "BASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          python3 - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('public/agent_crypto_erith_ia/administrator/version.json').read_text(encoding='utf-8'))
          assert m['build']=='40.4.224'
          assert m['engine']['reference_build']=='38.15.11' and m['engine']['status']=='protected'
          print('PARENT_PASS 40.4.224 / Market Core 38.15.11 PROTECTED')
          PY

      - name: Apply bounded Module 01 presentation repair
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,re,shutil
          base=Path('public/agent_crypto_erith_ia/administrator')
          app_p=base/'app.js'; css_p=base/'admin-learning-journey.css'; idx_p=base/'index.html'; sys_p=base/'js/views/system-presentation.js'
          src=Path('public/agent_crypto_erith_ia/web/assets/learning/module_01_market_visual_recap.png'); dst=base/'assets/learning/module_01_market_visual_recap.png'
          for p in (app_p,css_p,idx_p,sys_p,src):
              if not p.is_file(): raise SystemExit(f'missing {p}')
          app=app_p.read_text(encoding='utf-8')
          tokens=('fetch(','setInterval(','setTimeout(','MutationObserver(','WebSocket(','requestAnimationFrame(')
          before={t:app.count(t) for t in tokens}
          s=app.find('function foundationMarketVisualRecapMarkup(summary)'); e=app.find('\nfunction marketModule01AutoBlockText',s)
          if s<0 or e<0: raise SystemExit('Module 01 visual recap owner missing')
          block=app[s:e]
          if '<li><b>Heure :</b>' in block: block=block.replace('<li><b>Heure :</b>','<li><b>Heure / fraîcheur :</b>',1)
          if '<li><b>Heure / fraîcheur :</b>' not in block: raise SystemExit('freshness label missing')
          block=block.replace('source et heure des données.','source et heure ou fraîcheur des données.',1)
          if 'Observation ≠ prédiction.' not in block:
              block,n=re.subn(r'<div class="foundation-visual-callout">[\s\S]*?</div>','<div class="foundation-visual-callout"><b>Observation ≠ prédiction.</b> Ces cinq preuves décrivent ce qui est affiché et quand cela a été relevé. Elles ne disent pas ce que le prix fera ensuite.</div>',block,count=1)
              if n!=1: raise SystemExit(f'callout count={n}')
          app=app[:s]+block+app[e:]
          ls=app.find('function foundationMarketLab(cockpit)'); le=app.find('\nfunction ',ls+20); lab=app[ls:le]
          if ls<0 or le<0: raise SystemExit('foundationMarketLab owner missing')
          if 'marketFoundationVisualRecap' not in lab:
              anchor='<article data-foundation-stage="5"'
              if lab.count(anchor)!=1: raise SystemExit(f'stage5 count={lab.count(anchor)}')
              lab=lab.replace(anchor,'${cockpit.steps.verify && summary.ready ? `<div class="foundation-lab-wide">${foundationMarketVisualRecapMarkup(summary)}</div>` : ""}\n      '+anchor,1)
              app=app[:ls]+lab+app[le:]
          after={t:app.count(t) for t in tokens}
          if before!=after: raise SystemExit(f'primitive drift {before}->{after}')
          app_p.write_text(app,encoding='utf-8')
          css=css_p.read_text(encoding='utf-8')
          if '.foundation-visual-recap {' not in css:
              css += '''\n\n/* 40.4.225 — MODULE 01 MARKET SNAPSHOT EXPLAINED VIEW · presentation only */\n.foundation-visual-recap {display:grid;grid-template-columns:minmax(0,1.35fr) minmax(280px,.95fr);gap:16px;margin-top:14px;padding:14px;border:1px solid rgba(111,235,173,.24);border-radius:14px;background:linear-gradient(180deg,rgba(10,33,28,.74),rgba(3,16,27,.72));}\n.foundation-visual-recap-media {display:grid;gap:8px;align-content:start;}\n.foundation-visual-recap-media img {display:block;width:100%;height:auto;border-radius:12px;border:1px solid rgba(111,235,173,.24);box-shadow:0 14px 32px rgba(0,0,0,.24);background:rgba(0,0,0,.12);}\n.foundation-visual-recap-media small {color:rgba(177,211,220,.78);font-size:11.5px;line-height:1.5;}\n.foundation-visual-recap-copy {display:grid;gap:10px;align-content:start;}\n.foundation-visual-recap-copy h5 {margin:0;color:#f5feff;font-size:15px;}\n.foundation-visual-points {margin:0;padding-left:1.15rem;color:rgba(227,244,247,.9);display:grid;gap:7px;font-size:12.6px;line-height:1.55;}\n.foundation-visual-points li::marker {color:#76e0c0;}\n.foundation-visual-callout {padding:12px 13px;border-left:3px solid rgba(111,235,173,.7);border-radius:10px;background:rgba(27,88,72,.22);color:rgba(238,251,252,.92);font-size:12.6px;line-height:1.55;}\n@media (max-width:960px){.foundation-visual-recap{grid-template-columns:1fr;}}\n'''
              css_p.write_text(css,encoding='utf-8')
          dst.parent.mkdir(parents=True,exist_ok=True); shutil.copy2(src,dst)
          if hashlib.sha256(src.read_bytes()).hexdigest()!=hashlib.sha256(dst.read_bytes()).hexdigest(): raise SystemExit('asset SHA mismatch')
          idx=idx_p.read_text(encoding='utf-8')
          idx,n=re.subn(r'href="\./admin-learning-journey\.css(?:\?v=[^"]+)?"','href="./admin-learning-journey.css?v=administrator-build-40.4.225"',idx,count=1)
          if n!=1: raise SystemExit(f'learning CSS cache count={n}')
          old='system-presentation.js?v=administrator-build-40.4.224'
          if old not in idx: raise SystemExit('index System token parent drift')
          idx_p.write_text(idx.replace(old,'system-presentation.js?v=administrator-build-40.4.225',1),encoding='utf-8')
          system=sys_p.read_text(encoding='utf-8'); old='const SOURCE="./views/system.html?v=administrator-build-40.4.224";'
          if old not in system: raise SystemExit('System SOURCE token parent drift')
          sys_p.write_text(system.replace(old,'const SOURCE="./views/system.html?v=administrator-build-40.4.225";',1),encoding='utf-8')
          print('MODULE01_PATCH_PASS',hashlib.sha256(dst.read_bytes()).hexdigest())
          PY
          node --check public/agent_crypto_erith_ia/administrator/app.js
          git diff --check

      - name: Canonical release driver
        shell: bash
        run: |
          cat >/tmp/contract.json <<'JSON'
          {"state":"active","scope":"learning_presentation_only","visual_asset":"assets/learning/module_01_market_visual_recap.png","dynamic_proofs":["Prix","24 h","7 j","Source","Heure / fraîcheur"],"observation_not_prediction":true,"indexeddb_schema_changed":false,"learning_state_reset":false,"simulation_changed":false,"market_core_modified":false,"new_timer":false,"new_observer":false,"new_fetch":false,"new_websocket":false,"new_scheduler":false}
          JSON
          python3 .github/scripts/agent_crypto_release_driver.py --build 40.4.225 --parent 40.4.224 --release "MODULE 01 MARKET SNAPSHOT EXPLAINED VIEW · VISUAL RECAP TRUTH LOCK" --status module_01_market_snapshot_explained_view_404225 --contract-key module_01_market_snapshot_explained_404225 --contract-json /tmp/contract.json --lineage-note "40.4.225 Module 01 Market Snapshot explained view: Price / 24 h / 7 j / Source / freshness; observation != prediction; Learning storage and Market Core unchanged"

      - name: Version Truth and scope proof
        shell: bash
        run: |
          node --check public/agent_crypto_erith_ia/administrator/app.js
          node --check public/agent_crypto_erith_ia/administrator/js/app.js
          python3 .github/scripts/agent_crypto_version_truth_guard.py --expected-build 40.4.225 --expected-release "MODULE 01 MARKET SNAPSHOT EXPLAINED VIEW · VISUAL RECAP TRUTH LOCK"
          python3 - <<'PY'
          from pathlib import Path
          import json,subprocess
          base=Path('public/agent_crypto_erith_ia/administrator'); app=(base/'app.js').read_text(encoding='utf-8'); css=(base/'admin-learning-journey.css').read_text(encoding='utf-8')
          m=json.loads((base/'version.json').read_text(encoding='utf-8'))
          assert m['build']=='40.4.225' and m['parent_build']=='40.4.224' and m['engine']['reference_build']=='38.15.11' and m['engine']['status']=='protected'
          for marker in ('Heure / fraîcheur :','Observation ≠ prédiction.','id="marketFoundationVisualRecap"'): assert marker in app,marker
          assert '.foundation-visual-recap {' in css
          allowed={'public/agent_crypto_erith_ia/administrator/app.js','public/agent_crypto_erith_ia/administrator/admin-learning-journey.css','public/agent_crypto_erith_ia/administrator/assets/learning/module_01_market_visual_recap.png','public/agent_crypto_erith_ia/administrator/index.html','public/agent_crypto_erith_ia/administrator/js/views/system-presentation.js','public/agent_crypto_erith_ia/administrator/js/app.js','public/agent_crypto_erith_ia/administrator/version.json','public/agent_crypto_erith_ia/administrator/administrator-version.json','public/agent_crypto_erith_ia/administrator/build.json'}
          lines=subprocess.check_output(['git','status','--porcelain','-uall'],text=True).splitlines(); paths={line[3:] for line in lines}
          required={'public/agent_crypto_erith_ia/administrator/app.js','public/agent_crypto_erith_ia/administrator/assets/learning/module_01_market_visual_recap.png','public/agent_crypto_erith_ia/administrator/version.json'}
          if not required<=paths: raise SystemExit(f'required diff missing: {sorted(paths)}')
          if paths-allowed: raise SystemExit(f'out of scope: {sorted(paths-allowed)}')
          print('SCOPE_PASS',sorted(paths))
          PY
          git diff --check

      - name: Commit canonical 40.4.225
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/agent_crypto_erith_ia/administrator/app.js public/agent_crypto_erith_ia/administrator/admin-learning-journey.css public/agent_crypto_erith_ia/administrator/assets/learning/module_01_market_visual_recap.png public/agent_crypto_erith_ia/administrator/index.html public/agent_crypto_erith_ia/administrator/js/views/system-presentation.js public/agent_crypto_erith_ia/administrator/js/app.js public/agent_crypto_erith_ia/administrator/version.json public/agent_crypto_erith_ia/administrator/administrator-version.json public/agent_crypto_erith_ia/administrator/build.json
          git commit -m "agent-crypto: build 40.4.225 module 01 Market Snapshot explained view truth lock"
          echo "RELEASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          git push origin main

      - name: Package changed files only
        shell: bash
        run: |
          PKG=/tmp/agent-crypto-40.4.225; mkdir -p "$PKG"
          git diff --name-only "$BASE_SHA" "$RELEASE_SHA" > /tmp/changed.txt
          while IFS= read -r p; do mkdir -p "$PKG/$(dirname "$p")"; cp "$p" "$PKG/$p"; done < /tmp/changed.txt
          {
            echo "# Agent-Crypto 40.4.225 — fichiers modifiés"; echo
            echo "Release: MODULE 01 MARKET SNAPSHOT EXPLAINED VIEW · VISUAL RECAP TRUTH LOCK"
            echo "Parent: 40.4.224"; echo "Market Core: 38.15.11 PROTECTED"; echo "Canonical commit: $RELEASE_SHA"; echo
            echo "## Fichiers"; sed 's/^/- `/' /tmp/changed.txt | sed 's/$/`/'; echo
            echo "## Verrous"; echo "- Prix / 24 h / 7 j / Source / Heure-fraîcheur."; echo "- Observation ≠ prédiction."; echo "- IndexedDB / Learning non réinitialisés."; echo "- Aucun nouveau timer / observer / fetch / WebSocket / scheduler."; echo "- Market Core inchangé."
          } > "$PKG/FILES_CHANGED_40.4.225.md"
          (cd "$PKG" && zip -qr "$GITHUB_WORKSPACE/AGENT_CRYPTO_BUILD_40_4_225_MODULE_01_MARKET_SNAPSHOT_EXPLAINED_VIEW_CHANGED_FILES.zip" .)
          sha256sum AGENT_CRYPTO_BUILD_40_4_225_MODULE_01_MARKET_SNAPSHOT_EXPLAINED_VIEW_CHANGED_FILES.zip
          unzip -l AGENT_CRYPTO_BUILD_40_4_225_MODULE_01_MARKET_SNAPSHOT_EXPLAINED_VIEW_CHANGED_FILES.zip

      - name: Upload differential ZIP
        uses: actions/upload-artifact@v4
        with:
          name: AGENT_CRYPTO_BUILD_40_4_225_MODULE_01_MARKET_SNAPSHOT_EXPLAINED_VIEW_CHANGED_FILES
          path: AGENT_CRYPTO_BUILD_40_4_225_MODULE_01_MARKET_SNAPSHOT_EXPLAINED_VIEW_CHANGED_FILES.zip
          include-hidden-files: true
          if-no-files-found: error
