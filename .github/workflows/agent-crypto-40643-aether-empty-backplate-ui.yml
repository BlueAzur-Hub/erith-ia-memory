name: Agent-Crypto 40.6.43 Aether Empty Backplate Live UI

on:
  push:
    branches:
      - aether-40643-reconstruction
    paths:
      - .github/workflows/agent-crypto-40643-aether-empty-backplate-ui.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout reconstruction branch
        uses: actions/checkout@v4
        with:
          ref: aether-40643-reconstruction
          fetch-depth: 0

      - name: Configure release identity
        run: |
          git config user.name "Seven Release Bot"
          git config user.email "actions@users.noreply.github.com"

      - name: Apply guarded 40.6.43 release
        run: python .github/scripts/agent_crypto_40643_release.py

      - name: Validate Aether reconstruction gates
        shell: bash
        run: |
          set -euo pipefail
          test "$(python - <<'PY'
          import json
          print(json.load(open('public/agent_crypto_erith_ia/administrator/build.json'))['build'])
          PY
          )" = "40.6.43"
          grep -Fq "40.6.43 — AETHER EMPTY BACKPLATE · LIVE UI RECONSTRUCTION" public/agent_crypto_erith_ia/administrator/admin-ribbons.css
          grep -Fq "aether-observatory-empty-ui-406043.webp" public/agent_crypto_erith_ia/administrator/admin-ribbons.css
          test -s public/agent_crypto_erith_ia/administrator/assets/aether/aether-observatory-empty-ui-406043.webp
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, zipfile
          root=Path('public/agent_crypto_erith_ia/administrator')
          asset=root/'assets/aether/aether-observatory-empty-ui-406043.webp'
          assert hashlib.sha256(asset.read_bytes()).hexdigest()=='fa073142c956a92144f7bc39e69d8401cd9a2a5a2d0cd20c5a0517ddba0466a5'
          css=(root/'admin-ribbons.css').read_text()
          assert css.count('{')==css.count('}')
          assert json.loads((root/'build.json').read_text())['engine']=='38.15.11'
          z=Path('coordination/inter_ai_dialogues/agent_crypto/AGENT_CRYPTO_BUILD_40_6_43_AETHER_EMPTY_BACKPLATE_LIVE_UI_RECONSTRUCTION_CLEAN_UPLOAD_7_FILES.zip')
          with zipfile.ZipFile(z) as f:
              assert len(f.namelist())==7
              assert len(set(f.namelist()))==7
              assert f.testzip() is None
          print('40.6.43 gates: OK')
          PY

      - name: Commit released build and clean upload
        shell: bash
        run: |
          set -euo pipefail
          git add \
            public/agent_crypto_erith_ia/administrator/index.html \
            public/agent_crypto_erith_ia/administrator/admin-ribbons.css \
            public/agent_crypto_erith_ia/administrator/build.json \
            public/agent_crypto_erith_ia/administrator/administrator-version.json \
            public/agent_crypto_erith_ia/administrator/version.json \
            public/agent_crypto_erith_ia/administrator/assets/aether/aether-observatory-empty-ui-406043.webp \
            public/agent_crypto_erith_ia/administrator/RELEASE_40_6_43.md \
            coordination/inter_ai_dialogues/agent_crypto/AGENT_CRYPTO_BUILD_40_6_43_AETHER_EMPTY_BACKPLATE_LIVE_UI_RECONSTRUCTION_CLEAN_UPLOAD_7_FILES.zip \
            coordination/inter_ai_dialogues/agent_crypto/AGENT_CRYPTO_BUILD_40_6_43_AETHER_EMPTY_BACKPLATE_LIVE_UI_RECONSTRUCTION_CLEAN_UPLOAD_7_FILES.zip.sha256
          git diff --cached --check
          git commit -m "feat(agent-crypto): Aether empty backplate live UI 40.6.43"
          git push origin HEAD:aether-40643-reconstruction

      - name: Upload clean 7-file artifact
        uses: actions/upload-artifact@v4
        with:
          name: AGENT_CRYPTO_BUILD_40_6_43_AETHER_EMPTY_BACKPLATE_LIVE_UI_RECONSTRUCTION_CLEAN_UPLOAD_7_FILES
          path: coordination/inter_ai_dialogues/agent_crypto/AGENT_CRYPTO_BUILD_40_6_43_AETHER_EMPTY_BACKPLATE_LIVE_UI_RECONSTRUCTION_CLEAN_UPLOAD_7_FILES.zip
          if-no-files-found: error
          retention-days: 30
