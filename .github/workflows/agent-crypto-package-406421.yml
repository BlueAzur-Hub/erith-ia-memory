name: Agent-Crypto Package 40.6.421

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/agent-crypto-package-406421.yml'

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build clean ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP="public/agent_crypto_erith_ia/administrator/AGENT_CRYPTO_NEWS_TAXONOMY_TRUTH_40.6.421.zip"
          rm -f "$ZIP"
          rm -rf /tmp/agent-crypto-406421
          mkdir -p /tmp/agent-crypto-406421/administrator /tmp/agent-crypto-406421/tools /tmp/agent-crypto-406421/workflows /tmp/agent-crypto-406421/coordination
          cp public/agent_crypto_erith_ia/administrator/index.html /tmp/agent-crypto-406421/administrator/
          cp public/agent_crypto_erith_ia/administrator/index-40.6.421.html /tmp/agent-crypto-406421/administrator/
          cp public/agent_crypto_erith_ia/administrator/build.json /tmp/agent-crypto-406421/administrator/
          cp public/agent_crypto_erith_ia/administrator/RELEASE.md /tmp/agent-crypto-406421/administrator/
          cp public/agent_crypto_erith_ia/administrator/HANDOFF.md /tmp/agent-crypto-406421/administrator/
          cp public/agent_crypto_erith_ia/tools/atlas_news_collector.py /tmp/agent-crypto-406421/tools/
          cp .github/workflows/atlas_news_collector.yml /tmp/agent-crypto-406421/workflows/
          cp coordination/inter_ai_dialogues/agent_crypto/HANDOFF_40.6.421_NEWS_TAXONOMY_TRUTH.md /tmp/agent-crypto-406421/coordination/
          cp coordination/inter_ai_dialogues/agent_crypto/PROMPT_REPRISE_SEVEN_AGENT_CRYPTO_40.6.421.md /tmp/agent-crypto-406421/coordination/
          cp coordination/inter_ai_dialogues/agent_crypto/PACKAGE_MANIFEST_40.6.421.txt /tmp/agent-crypto-406421/PATCH_MANIFEST.txt
          (cd /tmp/agent-crypto-406421 && zip -9 -r "$GITHUB_WORKSPACE/$ZIP" .)
          unzip -t "$ZIP"
          unzip -l "$ZIP"

      - name: Commit package
        shell: bash
        run: |
          set -euo pipefail
          ZIP="public/agent_crypto_erith_ia/administrator/AGENT_CRYPTO_NEWS_TAXONOMY_TRUTH_40.6.421.zip"
          git config user.name "github-actions[bot]"
          git config user.email "41898242+github-actions[bot]@users.noreply.github.com"
          git add "$ZIP"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore(package): add clean Agent-Crypto 40.6.421 ZIP"
          git pull --rebase origin main
          git push origin HEAD:main
