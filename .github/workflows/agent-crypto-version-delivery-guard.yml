name: Agent-Crypto Version Delivery Guard

on:
  push:
    branches: [main]
    paths:
      - 'public/agent_crypto_erith_ia/administrator/index.html'
      - 'public/agent_crypto_erith_ia/administrator/runtime-shell.html'
      - 'public/agent_crypto_erith_ia/administrator/build.json'
      - 'public/agent_crypto_erith_ia/administrator/js/boot.js'
      - 'public/agent_crypto_erith_ia/administrator/js/version-truth.js'
      - 'public/agent_crypto_erith_ia/administrator/js/runtime-modules.js'
      - 'public/agent_crypto_erith_ia/administrator/js/generated-report-version-truth.js'
      - 'public/agent_crypto_erith_ia/administrator/js/pedagogy-version-truth.js'
      - 'public/agent_crypto_erith_ia/administrator/js/current-final-state-rebind.js'
      - 'public/agent_crypto_erith_ia/administrator/js/tradus-canonical-strategy-reader.js'
      - 'public/agent_crypto_erith_ia/administrator/js/strategy-a-auto-start.js'
      - 'public/agent_crypto_erith_ia/administrator/js/tradus-autonomous-refresh.js'
      - '.github/scripts/agent_crypto_version_truth_guard_compat.py'
      - '.github/workflows/agent-crypto-version-delivery-guard.yml'
  pull_request:
    paths:
      - 'public/agent_crypto_erith_ia/administrator/index.html'
      - 'public/agent_crypto_erith_ia/administrator/runtime-shell.html'
      - 'public/agent_crypto_erith_ia/administrator/build.json'
      - 'public/agent_crypto_erith_ia/administrator/js/boot.js'
      - 'public/agent_crypto_erith_ia/administrator/js/version-truth.js'
      - 'public/agent_crypto_erith_ia/administrator/js/runtime-modules.js'
      - 'public/agent_crypto_erith_ia/administrator/js/current-final-state-rebind.js'
      - '.github/scripts/agent_crypto_version_truth_guard_compat.py'
      - '.github/workflows/agent-crypto-version-delivery-guard.yml'

permissions:
  contents: read

jobs:
  version-delivery:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Canonical JavaScript syntax
        run: |
          node --check public/agent_crypto_erith_ia/administrator/js/boot.js
          node --check public/agent_crypto_erith_ia/administrator/js/version-truth.js
          node --check public/agent_crypto_erith_ia/administrator/js/runtime-modules.js
          node --check public/agent_crypto_erith_ia/administrator/js/generated-report-version-truth.js
          node --check public/agent_crypto_erith_ia/administrator/js/pedagogy-version-truth.js
          node --check public/agent_crypto_erith_ia/administrator/js/current-final-state-rebind.js
          node --check public/agent_crypto_erith_ia/administrator/js/tradus-canonical-strategy-reader.js
          node --check public/agent_crypto_erith_ia/administrator/js/strategy-a-auto-start.js
          node --check public/agent_crypto_erith_ia/administrator/js/tradus-autonomous-refresh.js

      - name: Clean-room delivery contract
        run: python .github/scripts/agent_crypto_version_truth_guard_compat.py
