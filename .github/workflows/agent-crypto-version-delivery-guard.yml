name: Agent-Crypto Version Delivery Guard

on:
  push:
    branches: [main]
    paths:
      - 'public/agent_crypto_erith_ia/administrator/index.html'
      - 'public/agent_crypto_erith_ia/administrator/index-*.html'
      - 'public/agent_crypto_erith_ia/administrator/build.json'
      - 'public/agent_crypto_erith_ia/administrator/js/version-truth-406086-authority-lock.js'
      - 'public/agent_crypto_erith_ia/administrator/js/version-truth-entry-authority-v2.js'
      - '.github/scripts/agent_crypto_version_truth_guard_compat.py'
      - '.github/workflows/agent-crypto-version-delivery-guard.yml'
  pull_request:
    paths:
      - 'public/agent_crypto_erith_ia/administrator/index.html'
      - 'public/agent_crypto_erith_ia/administrator/index-*.html'
      - 'public/agent_crypto_erith_ia/administrator/build.json'
      - 'public/agent_crypto_erith_ia/administrator/js/version-truth-406086-authority-lock.js'
      - 'public/agent_crypto_erith_ia/administrator/js/version-truth-entry-authority-v2.js'
      - '.github/scripts/agent_crypto_version_truth_guard_compat.py'
      - '.github/workflows/agent-crypto-version-delivery-guard.yml'

permissions:
  contents: read

jobs:
  version-delivery:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Version owner JavaScript syntax
        run: |
          node --check public/agent_crypto_erith_ia/administrator/js/version-truth-406086-authority-lock.js
          node --check public/agent_crypto_erith_ia/administrator/js/version-truth-entry-authority-v2.js

      - name: Bootstrap to Entry Authority V2 contract
        run: python .github/scripts/agent_crypto_version_truth_guard_compat.py
