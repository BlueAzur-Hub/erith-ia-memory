name: Package Agent-Crypto 40.6.268

on:
  push:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@v4
        with:
          ref: 97abaedb2de2f8381df28471c29a0ac3eef06de1
          fetch-depth: 0

      - name: Build exact release ZIP
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=zip             --output=AGENT_CRYPTO_40.6.268_EXACT_97abaedb.zip             97abaedb2de2f8381df28471c29a0ac3eef06de1
          sha256sum AGENT_CRYPTO_40.6.268_EXACT_97abaedb.zip             > AGENT_CRYPTO_40.6.268_EXACT_97abaedb.zip.sha256

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: AGENT_CRYPTO_40.6.268_EXACT_97abaedb
          path: |
            AGENT_CRYPTO_40.6.268_EXACT_97abaedb.zip
            AGENT_CRYPTO_40.6.268_EXACT_97abaedb.zip.sha256
          if-no-files-found: error
          retention-days: 7
