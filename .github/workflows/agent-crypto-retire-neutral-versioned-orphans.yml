name: Agent Crypto retire neutral versioned orphans

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/agent-crypto-retire-neutral-versioned-orphans.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Synchronize
        run: git pull --ff-only origin main

      - name: Revalidate full graph and retire proven neutral orphans
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json, re

          ROOT = Path('public/agent_crypto_erith_ia/administrator')
          ENTRY = Path('runtime-shell.html')
          HTML_JS_RE = re.compile(r'(?:src|href)=["\'](?P<ref>[^"\']+\.js(?:\?[^"\']*)?)["\']', re.I)
          JS_PATH_RE = re.compile(r'(?P<ref>(?:\.\.?/|/)?js/[A-Za-z0-9_./-]+\.js)(?:\?[^"\'`\s)]*)?', re.I)
          REL_JS_RE = re.compile(r'(?P<ref>\.\.?/[A-Za-z0-9_./-]+\.js)(?:\?[^"\'`\s)]*)?', re.I)

          selected = {
              Path('js/footer-version-truth-406025.js'): Path('js/footer-version-truth.js'),
              Path('js/generated-report-version-truth-406103.js'): Path('js/generated-report-version-truth.js'),
              Path('js/local-ai-contract-consistency-406106.js'): Path('js/local-ai-contract-consistency.js'),
              Path('js/local-dialogue-presentation-406108.js'): Path('js/local-dialogue-presentation.js'),
              Path('js/pedagogy-version-truth-406104.js'): Path('js/pedagogy-version-truth.js'),
          }

          def strip_query(ref):
              return ref.split('?', 1)[0].split('#', 1)[0]

          def resolve_candidates(source_rel, ref):
              clean = strip_query(ref).replace('\\', '/')
              out = set()
              if clean.startswith('/'):
                  rel = Path(clean.lstrip('/'))
                  if (ROOT / rel).is_file(): out.add(rel)
                  return out
              if clean.startswith('js/'):
                  rel = Path(clean)
                  if (ROOT / rel).is_file(): out.add(rel)
                  return out
              if clean.startswith('./js/'):
                  root_rel = Path(clean[2:])
                  if (ROOT / root_rel).is_file(): out.add(root_rel)
                  try:
                      src_rel = ((ROOT / source_rel).parent / clean).resolve().relative_to(ROOT.resolve())
                      if (ROOT / src_rel).is_file(): out.add(src_rel)
                  except Exception:
                      pass
                  return out
              if clean.startswith(('./', '../')):
                  try:
                      src_rel = ((ROOT / source_rel).parent / clean).resolve().relative_to(ROOT.resolve())
                      if (ROOT / src_rel).is_file(): out.add(src_rel)
                  except Exception:
                      pass
                  if clean.startswith('./'):
                      root_rel = Path(clean[2:])
                      if (ROOT / root_rel).is_file(): out.add(root_rel)
              return out

          def refs(text):
              out = [m.group('ref') for m in HTML_JS_RE.finditer(text)]
              out += [m.group('ref') for m in JS_PATH_RE.finditer(text)]
              out += [m.group('ref') for m in REL_JS_RE.finditer(text)]
              return list(dict.fromkeys(out))

          def graph():
              queue = [ENTRY]
              seen, edges, texts = set(), {}, {}
              while queue:
                  rel = queue.pop(0)
                  if rel in seen: continue
                  full = ROOT / rel
                  if not full.is_file() or full.suffix.lower() not in {'.html', '.js'}: continue
                  try: text = full.read_text(encoding='utf-8')
                  except UnicodeDecodeError: continue
                  seen.add(rel); texts[rel] = text
                  targets = set()
                  for ref in refs(text): targets.update(resolve_candidates(rel, ref))
                  edges[rel] = targets
                  for target in sorted(targets, key=str):
                      if target.suffix.lower() in {'.html', '.js'} and target not in seen:
                          queue.append(target)
              return seen, edges, texts

          build = json.loads((ROOT / 'build.json').read_text(encoding='utf-8'))
          if str(build.get('build')) != '40.6.124':
              raise SystemExit(f"Build drifted: {build.get('build')!r}")
          market_core = str(build.get('market_core') or build.get('engine') or '')
          if '38.15.11' not in market_core:
              raise SystemExit(f'Market Core drifted: {market_core!r}')

          reachable_before, edges_before, texts_before = graph()
          report = []
          for old, canonical in selected.items():
              old_path, canonical_path = ROOT / old, ROOT / canonical
              if not old_path.is_file(): raise SystemExit(f'Expected candidate missing: {old}')
              if not canonical_path.is_file(): raise SystemExit(f'Canonical successor missing: {canonical}')
              inbound = sorted(str(src) for src, targets in edges_before.items() if old in targets)
              literals = sorted(str(src) for src, text in texts_before.items() if old.name in text)
              proven = old not in reachable_before and canonical in reachable_before and not inbound and not literals
              if not proven:
                  raise SystemExit(f'Candidate no longer proven orphan: {old}; reachable={old in reachable_before}; canonical_reachable={canonical in reachable_before}; inbound={inbound}; literals={literals}')
              report.append({
                  'retired': str(old),
                  'canonical': str(canonical),
                  'old_bytes': old_path.stat().st_size,
                  'canonical_bytes': canonical_path.stat().st_size,
              })

          for old in selected:
              (ROOT / old).unlink()

          reachable_after, _, _ = graph()
          if len(reachable_after) != len(reachable_before):
              raise SystemExit(f'Runtime graph changed: {len(reachable_before)} -> {len(reachable_after)}')
          for canonical in selected.values():
              if canonical not in reachable_after:
                  raise SystemExit(f'Canonical successor lost reachability after cleanup: {canonical}')

          print(json.dumps({
              'build': build.get('build'),
              'market_core': market_core,
              'runtime_nodes_before': len(reachable_before),
              'runtime_nodes_after': len(reachable_after),
              'retired_count': len(report),
              'retired': report,
              'protected_not_touched': [
                  'Aether versioned siblings',
                  'js/oracle-fx-406012.js',
                  'js/dex-exclusion-diagnostics-406098.js'
              ]
          }, indent=2, ensure_ascii=False))
          PY

      - name: JavaScript syntax check
        run: |
          find public/agent_crypto_erith_ia/administrator -type f -name '*.js' -print0 \
            | xargs -0 -n1 node --check

      - name: Runtime shell direct reference sanity
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          root = Path('public/agent_crypto_erith_ia/administrator')
          shell = (root / 'runtime-shell.html').read_text(encoding='utf-8')
          missing = []
          for ref in re.findall(r'(?:src|href)=["\'](\./[^"\']+)["\']', shell):
              clean = ref.split('?', 1)[0]
              if not (root / clean[2:]).exists(): missing.append(clean)
          if missing: raise SystemExit('Missing runtime references: ' + ', '.join(sorted(set(missing))))
          print('Runtime shell references OK')
          PY

      - name: Duplicate shell DOM id guard
        run: |
          python - <<'PY'
          from pathlib import Path
          import collections, re
          shell = Path('public/agent_crypto_erith_ia/administrator/runtime-shell.html').read_text(encoding='utf-8')
          ids = re.findall(r'\bid=["\']([^"\']+)["\']', shell, re.I)
          dup = [x for x, n in collections.Counter(ids).items() if n > 1]
          if dup: raise SystemExit('Duplicate shell DOM ids: ' + ', '.join(sorted(dup)))
          print('Shell DOM ids unique')
          PY

      - name: Build and Market Core lock guard
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          d = json.loads(Path('public/agent_crypto_erith_ia/administrator/build.json').read_text(encoding='utf-8'))
          if str(d.get('build')) != '40.6.124': raise SystemExit(f'Build drifted: {d.get("build")!r}')
          e = str(d.get('market_core') or d.get('engine') or '')
          if '38.15.11' not in e: raise SystemExit(f'Market Core drifted: {e!r}')
          print('Build 40.6.124 unchanged · Market Core 38.15.11 locked')
          PY

      - name: Commit cleanup and retire one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Seven Heaven Refactor'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A public/agent_crypto_erith_ia/administrator
          git rm -f .github/workflows/agent-crypto-retire-neutral-versioned-orphans.yml
          git commit -m 'refactor(agent-crypto): retire proven neutral versioned orphans'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo 'Rebase conflict; refusing force-push'
              exit 1
            fi
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*2))
          done
          echo 'Push remained contested after safe retries'
          exit 1
