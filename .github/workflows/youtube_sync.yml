name: Sync Seven Heaven YouTube data

on:
  workflow_dispatch:
  schedule:
    - cron: "15 */6 * * *"

permissions:
  contents: write

jobs:
  sync-youtube:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install YouTube dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-api-python-client google-auth google-auth-oauthlib google-auth-httplib2

      - name: Generate Seven Heaven JSON data
        env:
          YOUTUBE_CLIENT_SECRET_JSON: ${{ secrets.YOUTUBE_CLIENT_SECRET_JSON }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: |
          python - <<'PY'
          from pathlib import Path
          from datetime import datetime, timedelta, timezone
          import json, os

          from google.oauth2.credentials import Credentials
          from google.auth.transport.requests import Request
          from googleapiclient.discovery import build

          OUT = Path("assets/SEVEN_PORTABLE_TERMINAL/data")
          OUT.mkdir(parents=True, exist_ok=True)

          SCOPES = [
              "https://www.googleapis.com/auth/youtube.readonly",
              "https://www.googleapis.com/auth/yt-analytics.readonly",
          ]

          token_raw = os.environ.get("YOUTUBE_TOKEN_JSON", "").strip()
          client_raw = os.environ.get("YOUTUBE_CLIENT_SECRET_JSON", "").strip()

          if not client_raw:
              raise RuntimeError("Missing secret: YOUTUBE_CLIENT_SECRET_JSON")
          if not token_raw:
              raise RuntimeError("Missing secret: YOUTUBE_TOKEN_JSON")

          token_info = json.loads(token_raw)
          creds = Credentials.from_authorized_user_info(token_info, SCOPES)

          if creds.expired and creds.refresh_token:
              creds.refresh(Request())

          youtube = build("youtube", "v3", credentials=creds)
          analytics = build("youtubeAnalytics", "v2", credentials=creds)

          def safe_int(value):
              try:
                  return int(float(value or 0))
              except Exception:
                  return 0

          def classify_family(title):
              t = (title or "").lower()
              rules = [
                  ("Zelda", ["zelda", "link", "hyrule", "breath of the wild", "tears of the kingdom", "botw", "totk", "linkle"]),
                  ("Final Fantasy", ["final fantasy", "ff7", "ff vii", "remake", "rebirth", "cloud", "tifa", "aerith", "rochey"]),
                  ("ERITH.IA", ["erith", "seven heaven", "seven portable", "aerith ia", "ia"]),
                  ("GTA", ["gta", "grand theft auto"]),
                  ("ComfyUI / IA", ["comfyui", "wan", "runninghub", "stable diffusion", "prompt"]),
              ]
              for name, keys in rules:
                  if any(k in t for k in keys):
                      return name
              return "Autre"

          def fetch_channel():
              res = youtube.channels().list(
                  part="snippet,statistics,contentDetails",
                  mine=True
              ).execute()

              items = res.get("items", [])
              if not items:
                  raise RuntimeError("No YouTube channel found for this token")

              item = items[0]
              return {
                  "id": item.get("id"),
                  "title": item.get("snippet", {}).get("title"),
                  "customUrl": item.get("snippet", {}).get("customUrl"),
                  "statistics": item.get("statistics", {}),
                  "uploadsPlaylistId": item.get("contentDetails", {}).get("relatedPlaylists", {}).get("uploads"),
              }

          def fetch_popular_video_ids(channel_id, limit=50):
              ids = []
              page_token = None

              while len(ids) < limit:
                  res = youtube.search().list(
                      part="id",
                      channelId=channel_id,
                      type="video",
                      order="viewCount",
                      maxResults=min(50, limit - len(ids)),
                      pageToken=page_token
                  ).execute()

                  for item in res.get("items", []):
                      vid = item.get("id", {}).get("videoId")
                      if vid and vid not in ids:
                          ids.append(vid)

                  page_token = res.get("nextPageToken")
                  if not page_token:
                      break

              return ids

          def fetch_video_details(video_ids):
              videos = []

              for i in range(0, len(video_ids), 50):
                  res = youtube.videos().list(
                      part="snippet,statistics,contentDetails",
                      id=",".join(video_ids[i:i+50])
                  ).execute()

                  for item in res.get("items", []):
                      snippet = item.get("snippet", {})
                      stats = item.get("statistics", {})
                      thumbs = snippet.get("thumbnails", {})
                      thumb = thumbs.get("maxres") or thumbs.get("high") or thumbs.get("medium") or thumbs.get("default") or {}
                      vid = item.get("id")
                      title = snippet.get("title", "")

                      videos.append({
                          "videoId": vid,
                          "title": title,
                          "description": snippet.get("description", ""),
                          "publishedAt": snippet.get("publishedAt"),
                          "thumbnail": thumb.get("url"),
                          "url": "https://www.youtube.com/watch?v=" + vid,
                          "memoryFamily": classify_family(title),
                          "publicStats": {
                              "views": safe_int(stats.get("viewCount")),
                              "likes": safe_int(stats.get("likeCount")),
                              "comments": safe_int(stats.get("commentCount")),
                          },
                          "duration": item.get("contentDetails", {}).get("duration"),
                      })

              return sorted(videos, key=lambda v: safe_int(v.get("publicStats", {}).get("views")), reverse=True)

          def enrich_analytics(videos):
              if not videos:
                  return videos

              end = datetime.now(timezone.utc).date() - timedelta(days=1)
              start = end - timedelta(days=27)
              filters = ",".join("video==" + v["videoId"] for v in videos)
              by_id = {v["videoId"]: v for v in videos}

              try:
                  res = analytics.reports().query(
                      ids="channel==MINE",
                      startDate=str(start),
                      endDate=str(end),
                      metrics="views,estimatedMinutesWatched,averageViewDuration,likes,comments,shares",
                      dimensions="video",
                      filters=filters,
                      maxResults=200,
                      sort="-views"
                  ).execute()

                  headers = [h["name"] for h in res.get("columnHeaders", [])]
                  for row in res.get("rows", []):
                      data = dict(zip(headers, row))
                      video = by_id.get(data.get("video"))
                      if not video:
                          continue
                      video["analytics"] = {
                          "views": safe_int(data.get("views")),
                          "estimatedMinutesWatched": safe_int(data.get("estimatedMinutesWatched")),
                          "averageViewDuration": safe_int(data.get("averageViewDuration")),
                          "likes": safe_int(data.get("likes")),
                          "comments": safe_int(data.get("comments")),
                          "shares": safe_int(data.get("shares")),
                      }

              except Exception as exc:
                  print("Analytics unavailable, fallback to public stats:", exc)

              for video in videos:
                  public = video.get("publicStats", {})
                  video.setdefault("analytics", {
                      "views": safe_int(public.get("views")),
                      "estimatedMinutesWatched": 0,
                      "averageViewDuration": 0,
                      "likes": safe_int(public.get("likes")),
                      "comments": safe_int(public.get("comments")),
                      "shares": 0,
                  })

              return videos

          def build_families(videos):
              fams = {}

              for video in videos:
                  family = video.get("memoryFamily") or "Autre"
                  public = video.get("publicStats", {})
                  analytics_data = video.get("analytics", {})

                  views = safe_int(public.get("views"))
                  watch = safe_int(analytics_data.get("estimatedMinutesWatched"))
                  likes = safe_int(public.get("likes"))
                  comments = safe_int(public.get("comments"))
                  shares = safe_int(analytics_data.get("shares"))

                  bucket = fams.setdefault(family, {
                      "views": 0,
                      "estimatedMinutesWatched": 0,
                      "likes": 0,
                      "comments": 0,
                      "shares": 0,
                      "videos": [],
                  })

                  bucket["views"] += views
                  bucket["estimatedMinutesWatched"] += watch
                  bucket["likes"] += likes
                  bucket["comments"] += comments
                  bucket["shares"] += shares
                  bucket["videos"].append({
                      "videoId": video.get("videoId"),
                      "title": video.get("title"),
                      "url": video.get("url"),
                      "views": views,
                      "estimatedMinutesWatched": watch,
                  })

              return dict(sorted(fams.items(), key=lambda x: x[1]["views"], reverse=True))

          def make_brief(channel, videos, fams):
              top = videos[0] if videos else None
              top_family = next(iter(fams.keys()), "Aucune")

              lines = [
                  "# Seven Heaven — YouTube Memory Brief",
                  "",
                  "Generated: " + datetime.now(timezone.utc).isoformat(),
                  "Channel: " + str(channel.get("title") or "Unknown"),
                  "Mode: popular videos by global view count",
                  "",
                  "## Signal principal",
                  "",
                  "- Famille dominante : " + top_family,
              ]

              if top:
                  public = top.get("publicStats", {})
                  analytics_data = top.get("analytics", {})
                  lines += [
                      "- Vidéo locomotive : " + str(top.get("title")),
                      "- URL : " + str(top.get("url")),
                      "- Vues publiques : " + str(safe_int(public.get("views"))),
                      "- Watchtime 28 jours : " + str(safe_int(analytics_data.get("estimatedMinutesWatched"))) + " minutes",
                  ]
              else:
                  lines.append("- Aucune vidéo trouvée.")

              lines += [
                  "",
                  "## Action Aerith",
                  "",
                  "Étudier les vidéos populaires historiques de la chaîne, puis proposer une suite ou une vidéo satellite reliée à la famille dominante.",
              ]

              return "\n".join(lines)

          channel = fetch_channel()
          video_ids = fetch_popular_video_ids(channel["id"], limit=50)
          videos = fetch_video_details(video_ids)
          videos = enrich_analytics(videos)

          top_videos = videos[:25]
          families = build_families(top_videos)
          brief = make_brief(channel, top_videos, families)

          (OUT / "top_videos.json").write_text(
              json.dumps(top_videos, ensure_ascii=False, indent=2),
              encoding="utf-8"
          )

          (OUT / "memory_families.json").write_text(
              json.dumps(families, ensure_ascii=False, indent=2),
              encoding="utf-8"
          )

          (OUT / "brief.json").write_text(
              json.dumps({
                  "brief": brief,
                  "generatedAt": datetime.now(timezone.utc).isoformat(),
                  "channel": channel,
                  "mode": "popular_videos_by_view_count"
              }, ensure_ascii=False, indent=2),
              encoding="utf-8"
          )

          print("Generated Seven Heaven YouTube JSON data from popular videos.")
          PY

      - name: Commit generated data
        run: |
          git config user.name "Seven Heaven Bot"
          git config user.email "actions@github.com"
          git add assets/SEVEN_PORTABLE_TERMINAL/data/top_videos.json
          git add assets/SEVEN_PORTABLE_TERMINAL/data/memory_families.json
          git add assets/SEVEN_PORTABLE_TERMINAL/data/brief.json
          git diff --cached --quiet && echo "No data changes" || git commit -m "Update Seven Heaven YouTube popular data"
          git push
