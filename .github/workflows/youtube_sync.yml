name: Sync Seven Heaven YouTube data

on:
  workflow_dispatch:
  schedule:
    - cron: "15 */6 * * *"

permissions:
  contents: write

jobs:
  sync-youtube:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install YouTube dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-api-python-client google-auth google-auth-oauthlib google-auth-httplib2

      - name: Generate Seven Heaven JSON data
        env:
          YOUTUBE_CLIENT_SECRET_JSON: ${{ secrets.YOUTUBE_CLIENT_SECRET_JSON }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: |
          python - <<'PY'
          from pathlib import Path
          from datetime import datetime, timedelta, timezone
          import json, os
          from google.oauth2.credentials import Credentials
          from google.auth.transport.requests import Request
          from googleapiclient.discovery import build

          OUT = Path("assets/SEVEN_PORTABLE_TERMINAL/data")
          OUT.mkdir(parents=True, exist_ok=True)

          SCOPES = [
              "https://www.googleapis.com/auth/youtube.readonly",
              "https://www.googleapis.com/auth/yt-analytics.readonly",
          ]

          token_raw = os.environ.get("YOUTUBE_TOKEN_JSON", "").strip()
          client_raw = os.environ.get("YOUTUBE_CLIENT_SECRET_JSON", "").strip()

          if not client_raw:
              raise RuntimeError("Missing secret: YOUTUBE_CLIENT_SECRET_JSON")
          if not token_raw:
              raise RuntimeError("Missing secret: YOUTUBE_TOKEN_JSON")

          token_info = json.loads(token_raw)
          creds = Credentials.from_authorized_user_info(token_info, SCOPES)

          if creds.expired and creds.refresh_token:
              creds.refresh(Request())

          youtube = build("youtube", "v3", credentials=creds)
          analytics = build("youtubeAnalytics", "v2", credentials=creds)

          def safe_int(value):
              try:
                  return int(float(value or 0))
              except Exception:
                  return 0

          def family(title):
              t = (title or "").lower()
              rules = [
                  ("Zelda", ["zelda", "link", "hyrule", "breath of the wild", "tears of the kingdom"]),
                  ("Final Fantasy", ["final fantasy", "ff7", "ff vii", "remake", "rebirth", "cloud", "tifa", "aerith"]),
                  ("ERITH.IA", ["erith", "seven heaven", "seven portable", "aerith ia", "ia"]),
                  ("GTA", ["gta", "grand theft auto"]),
                  ("ComfyUI / IA", ["comfyui", "wan", "runninghub", "stable diffusion", "prompt"]),
              ]
              for name, keys in rules:
                  if any(k in t for k in keys):
                      return name
              return "Autre"

          def fetch_channel():
              res = youtube.channels().list(part="snippet,statistics,contentDetails", mine=True).execute()
              items = res.get("items", [])
              if not items:
                  raise RuntimeError("No YouTube channel found for this token")
              item = items[0]
              return {
                  "id": item.get("id"),
                  "title": item.get("snippet", {}).get("title"),
                  "customUrl": item.get("snippet", {}).get("customUrl"),
                  "statistics": item.get("statistics", {}),
                  "uploadsPlaylistId": item.get("contentDetails", {}).get("relatedPlaylists", {}).get("uploads"),
              }

          def fetch_uploads(playlist_id, limit=50):
              videos, page_token = [], None
              while len(videos) < limit:
                  res = youtube.playlistItems().list(
                      part="snippet,contentDetails",
                      playlistId=playlist_id,
                      maxResults=min(50, limit - len(videos)),
                      pageToken=page_token
                  ).execute()
                  for item in res.get("items", []):
                      sn = item.get("snippet", {})
                      vid = item.get("contentDetails", {}).get("videoId")
                      if not vid:
                          continue
                      thumbs = sn.get("thumbnails", {})
                      thumb = thumbs.get("maxres") or thumbs.get("high") or thumbs.get("medium") or thumbs.get("default") or {}
                      title = sn.get("title", "")
                      videos.append({
                          "videoId": vid,
                          "title": title,
                          "description": sn.get("description", ""),
                          "publishedAt": sn.get("publishedAt"),
                          "thumbnail": thumb.get("url"),
                          "url": "https://www.youtube.com/watch?v=" + vid,
                          "memoryFamily": family(title),
                      })
                  page_token = res.get("nextPageToken")
                  if not page_token:
                      break
              return videos

          def public_stats(videos):
              by_id = {v["videoId"]: v for v in videos}
              ids = list(by_id)
              for i in range(0, len(ids), 50):
                  res = youtube.videos().list(part="statistics,contentDetails", id=",".join(ids[i:i+50])).execute()
                  for item in res.get("items", []):
                      v = by_id.get(item.get("id"))
                      if not v:
                          continue
                      s = item.get("statistics", {})
                      v["publicStats"] = {
                          "views": safe_int(s.get("viewCount")),
                          "likes": safe_int(s.get("likeCount")),
                          "comments": safe_int(s.get("commentCount")),
                      }
                      v["duration"] = item.get("contentDetails", {}).get("duration")
              return videos

          def analytics_stats(videos):
              if not videos:
                  return videos
              end = datetime.now(timezone.utc).date() - timedelta(days=1)
              start = end - timedelta(days=27)
              filters = ",".join("video==" + v["videoId"] for v in videos)
              by_id = {v["videoId"]: v for v in videos}
              try:
                  res = analytics.reports().query(
                      ids="channel==MINE",
                      startDate=str(start),
                      endDate=str(end),
                      metrics="views,estimatedMinutesWatched,averageViewDuration,likes,comments,shares",
                      dimensions="video",
                      filters=filters,
                      maxResults=200,
                      sort="-views"
                  ).execute()
                  headers = [h["name"] for h in res.get("columnHeaders", [])]
                  for row in res.get("rows", []):
                      data = dict(zip(headers, row))
                      v = by_id.get(data.get("video"))
                      if not v:
                          continue
                      v["analytics"] = {
                          "views": safe_int(data.get("views")),
                          "estimatedMinutesWatched": safe_int(data.get("estimatedMinutesWatched")),
                          "averageViewDuration": safe_int(data.get("averageViewDuration")),
                          "likes": safe_int(data.get("likes")),
                          "comments": safe_int(data.get("comments")),
                          "shares": safe_int(data.get("shares")),
                      }
              except Exception as exc:
                  print("Analytics unavailable, fallback to public stats:", exc)

              for v in videos:
                  ps = v.get("publicStats", {})
                  v.setdefault("analytics", {
                      "views": safe_int(ps.get("views")),
                      "estimatedMinutesWatched": 0,
                      "averageViewDuration": 0,
                      "likes": safe_int(ps.get("likes")),
                      "comments": safe_int(ps.get("comments")),
                      "shares": 0,
                  })
              return videos

          def build_families(videos):
              fams = {}
              for v in videos:
                  f = v.get("memoryFamily") or "Autre"
                  a = v.get("analytics", {})
                  b = fams.setdefault(f, {
                      "views": 0,
                      "estimatedMinutesWatched": 0,
                      "likes": 0,
                      "comments": 0,
                      "shares": 0,
                      "videos": [],
                  })
                  views = safe_int(a.get("views"))
                  watch = safe_int(a.get("estimatedMinutesWatched"))
                  b["views"] += views
                  b["estimatedMinutesWatched"] += watch
                  b["likes"] += safe_int(a.get("likes"))
                  b["comments"] += safe_int(a.get("comments"))
                  b["shares"] += safe_int(a.get("shares"))
                  b["videos"].append({
                      "videoId": v.get("videoId"),
                      "title": v.get("title"),
                      "url": v.get("url"),
                      "views": views,
                      "estimatedMinutesWatched": watch,
                  })
              return dict(sorted(fams.items(), key=lambda x: x[1]["views"], reverse=True))

          def make_brief(channel, videos, fams):
              top = videos[0] if videos else None
              top_family = next(iter(fams.keys()), "Aucune")
              lines = [
                  "# Seven Heaven — YouTube Memory Brief",
                  "",
                  "Generated: " + datetime.now(timezone.utc).isoformat(),
                  "Channel: " + str(channel.get("title") or "Unknown"),
                  "",
                  "## Signal principal",
                  "",
                  "- Famille dominante : " + top_family,
              ]
              if top:
                  a = top.get("analytics", {})
                  lines += [
                      "- Vidéo locomotive : " + str(top.get("title")),
                      "- URL : " + str(top.get("url")),
                      "- Vues : " + str(safe_int(a.get("views"))),
                      "- Watchtime : " + str(safe_int(a.get("estimatedMinutesWatched"))) + " minutes",
                  ]
              else:
                  lines.append("- Aucune vidéo trouvée.")
              lines += [
                  "",
                  "## Action Aerith",
                  "",
                  "Préparer une vidéo satellite à partir du signal dominant et relier le sujet à une famille mémoire exploitable.",
              ]
              return "\n".join(lines)

          channel = fetch_channel()
          videos = fetch_uploads(channel["uploadsPlaylistId"], 50)
          videos = public_stats(videos)
          videos = analytics_stats(videos)
          videos = sorted(videos, key=lambda v: safe_int(v.get("analytics", {}).get("views")), reverse=True)
          top_videos = videos[:25]
          fams = build_families(videos)
          brief = make_brief(channel, top_videos, fams)

          (OUT / "top_videos.json").write_text(json.dumps(top_videos, ensure_ascii=False, indent=2), encoding="utf-8")
          (OUT / "memory_families.json").write_text(json.dumps(fams, ensure_ascii=False, indent=2), encoding="utf-8")
          (OUT / "brief.json").write_text(json.dumps({
              "brief": brief,
              "generatedAt": datetime.now(timezone.utc).isoformat(),
              "channel": channel,
          }, ensure_ascii=False, indent=2), encoding="utf-8")

          print("Generated Seven Heaven YouTube JSON data.")
          PY

      - name: Commit generated data
        run: |
          git config user.name "Seven Heaven Bot"
          git config user.email "actions@github.com"
          git add assets/SEVEN_PORTABLE_TERMINAL/data/top_videos.json
          git add assets/SEVEN_PORTABLE_TERMINAL/data/memory_families.json
          git add assets/SEVEN_PORTABLE_TERMINAL/data/brief.json
          git diff --cached --quiet && echo "No data changes" || git commit -m "Update Seven Heaven YouTube data"
          git push
