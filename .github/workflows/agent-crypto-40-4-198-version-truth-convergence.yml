name: Agent-Crypto 40.4.198 Version Truth Convergence

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/agent_crypto_40_4_198_version_truth_convergence.py'
      - '.github/workflows/agent-crypto-40-4-198-version-truth-convergence.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  converge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply 40.4.198 Version Truth convergence
        run: python .github/scripts/agent_crypto_40_4_198_version_truth_convergence.py

      - name: JSON and JavaScript gates
        shell: bash
        run: |
          python -m json.tool public/agent_crypto_erith_ia/administrator/version.json >/dev/null
          python -m json.tool public/agent_crypto_erith_ia/administrator/administrator-version.json >/dev/null
          python -m json.tool public/agent_crypto_erith_ia/administrator/build.json >/dev/null
          node --check public/agent_crypto_erith_ia/administrator/js/version-truth.js
          git diff --check

      - name: Retire one-shot files
        shell: bash
        run: |
          rm -f .github/scripts/agent_crypto_40_4_198_version_truth_convergence.py
          rm -f .github/workflows/agent-crypto-40-4-198-version-truth-convergence.yml

      - name: Commit convergence lock
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix Agent-Crypto 40.4.198 version truth convergence lock'
          git push
