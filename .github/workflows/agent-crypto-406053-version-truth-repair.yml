name: Agent-Crypto 40.6.53 Version Truth Repair

on:
  push:
    branches: [agent-crypto-406053-version-truth-fix]
    paths:
      - '.github/workflows/agent-crypto-406053-version-truth-repair.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: agent-crypto-406053-version-truth-fix
          fetch-depth: 1

      - name: Align 40.6.53 version truth owners only
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import re

          base = Path('public/agent_crypto_erith_ia/administrator')
          index_path = base / 'index.html'
          root_app_path = base / 'app.js'
          version_path = base / 'version.json'
          index = index_path.read_text(encoding='utf-8')
          root_app = root_app_path.read_text(encoding='utf-8')

          index_replacements = (
              ('<script src="./app.js?v=administrator-build-40.5.23"></script>', '<script src="./app.js?v=administrator-build-40.6.53"></script>'),
              ('<script src="./js/app.js?v=administrator-build-40.6.40"></script>', '<script src="./js/app.js?v=administrator-build-40.6.53"></script>'),
              ('<script src="./js/version-truth.js?v=40.6.8"></script>', '<script src="./js/version-truth.js?v=40.6.53"></script>'),
              ('<span id="atlasVersionTruthText">Build 40.6.24</span>', '<span id="atlasVersionTruthText">Build 40.6.53</span>'),
              ('aria-label="Version Agent-Crypto installée : Build 40.6.24, mode Administrator"', 'aria-label="Version Agent-Crypto installée : Build 40.6.53, mode Administrator"'),
              ("<span id=\"footerRelease\">Administrator 40.6.26 · Market Core 38.15.11 · Web Classic · vérification… · Version : Parker Lewis Can't Lose</span>", "<span id=\"footerRelease\">Administrator 40.6.53 · Market Core 38.15.11 · Web Classic · vérification… · Version : Parker Lewis Can't Lose</span>"),
          )

          for old, new in index_replacements:
              count = index.count(old)
              if count != 1:
                  raise SystemExit(f'REPAIR_FAIL: expected exactly one index occurrence: {old!r}; got {count}')
              index = index.replace(old, new, 1)

          old_runtime = 'const ATLAS_BUILD = "40.5.9";'
          new_runtime = 'const ATLAS_BUILD = "40.6.53";'
          runtime_count = root_app.count(old_runtime)
          if runtime_count != 1:
              raise SystemExit(f'REPAIR_FAIL: ATLAS_BUILD owner count={runtime_count}')
          root_app = root_app.replace(old_runtime, new_runtime, 1)

          index_path.write_text(index, encoding='utf-8')
          root_app_path.write_text(root_app, encoding='utf-8')

          index_digest = hashlib.sha256(index_path.read_bytes()).hexdigest()
          app_digest = hashlib.sha256(root_app_path.read_bytes()).hexdigest()
          manifest = version_path.read_text(encoding='utf-8')

          for rel, digest in (('index.html', index_digest), ('app.js', app_digest)):
              pattern = rf'("{re.escape(rel)}"\s*:\s*")[0-9a-f]{{64}}("\s*,)'
              manifest, count = re.subn(pattern, lambda m, d=digest: m.group(1) + d + m.group(2), manifest, count=1)
              if count != 1:
                  raise SystemExit(f'REPAIR_FAIL: version.json hash owner {rel!r} count={count}')

          version_path.write_text(manifest, encoding='utf-8')
          print('REPAIR_OK index_sha256=' + index_digest)
          print('REPAIR_OK app_sha256=' + app_digest)
          PY

      - name: JavaScript syntax
        run: |
          node --check public/agent_crypto_erith_ia/administrator/app.js
          node --check public/agent_crypto_erith_ia/administrator/js/app.js

      - name: Canonical version truth
        run: python .github/scripts/agent_crypto_version_truth_guard_compat.py

      - name: Commit bounded repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/agent_crypto_erith_ia/administrator/app.js public/agent_crypto_erith_ia/administrator/index.html public/agent_crypto_erith_ia/administrator/version.json
          git diff --cached --quiet && exit 0
          git commit -m "fix(agent-crypto): align 40.6.53 version truth owners"
          git push origin HEAD:agent-crypto-406053-version-truth-fix
