name: Agent-Crypto 40.4.221 Simulation Focus Audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/agent-crypto-40-4-221-simulation-focus.yml'
      - '.github/scripts/_tmp_agent_crypto_404221_simulation_focus.py'

permissions:
  contents: write

concurrency:
  group: agent-crypto-40-4-221-simulation-focus
  cancel-in-progress: false

jobs:
  focus:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout canonical main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run focused owner audit v2
        run: python .github/scripts/_tmp_agent_crypto_404221_simulation_focus.py > .github/_tmp_agent_crypto_404221_simulation_focus.txt
      - name: Publish temporary focused report
        run: |
          git config user.name "Aether Audit"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/_tmp_agent_crypto_404221_simulation_focus.txt
          git commit -m "chore(agent-crypto): refresh temporary 40.4.221 focused simulation report"
          git pull --rebase origin main
          git push origin HEAD:main
