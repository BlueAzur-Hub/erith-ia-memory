name: Agent Crypto Top250 Exact Coin Identity - Bounded Proof
on:
  pull_request:
    paths:
      - '.github/workflows/agent-crypto-top250-identity.yml'
      - 'public/agent_crypto_erith_ia/tools/verify_historical_top250_identity.py'
      - 'public/agent_crypto_erith_ia/tools/historical_top250_identity_test.py'
      - 'public/agent_crypto_erith_ia/data/historical_archive_prototype/top250-identity-bootstrap.json'
  push:
    branches: [main]
    paths:
      - '.github/workflows/agent-crypto-top250-identity.yml'
      - 'public/agent_crypto_erith_ia/tools/verify_historical_top250_identity.py'
      - 'public/agent_crypto_erith_ia/tools/historical_top250_identity_test.py'
      - 'public/agent_crypto_erith_ia/data/historical_archive_prototype/top250-identity-bootstrap.json'
  workflow_dispatch:
  schedule:
    - cron: '9,24,39,54 * * * *'
permissions:
  contents: write
concurrency:
  group: agent-crypto-top250-exact-identity-ledger
  cancel-in-progress: false
jobs:
  identity:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Local identity proof tests and source audit sanity
        run: |
          set -euo pipefail
          python -m py_compile public/agent_crypto_erith_ia/tools/verify_historical_top250_identity.py
          python public/agent_crypto_erith_ia/tools/historical_top250_identity_test.py
          python public/agent_crypto_erith_ia/tools/verify_historical_top250_identity.py --plan
      - name: Qualify exact CoinGecko IDs using bounded official Binance-exchange tickers
        run: |
          set -euo pipefail
          base=public/agent_crypto_erith_ia/data/historical_archive_prototype
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            python public/agent_crypto_erith_ia/tools/verify_historical_top250_identity.py --probe \
              --batch-size 4 --sleep 15 --output "$RUNNER_TEMP/top250-identity-evidence.json"
          else
            python public/agent_crypto_erith_ia/tools/verify_historical_top250_identity.py --probe \
              --batch-size 8 --sleep 15 --output "$base/top250-identity-evidence.json"
            cp "$base/top250-identity-evidence.json" "$RUNNER_TEMP/top250-identity-evidence.json"
          fi
          python - <<'PY'
          import json,os,pathlib
          r=json.loads((pathlib.Path(os.environ["RUNNER_TEMP"])/"top250-identity-evidence.json").read_text())
          assert r["schema"]=="aerith.public.ohlcv.spot.coingecko-binance-identity-evidence.v1"
          assert r["total_market_ranked"]==250
          assert 0<=r["approved_count"]<=r["checked_count"]<=r["candidate_count"]<=250
          if os.environ["GITHUB_EVENT_NAME"]=="pull_request":
            baseline_path=pathlib.Path("public/agent_crypto_erith_ia/data/historical_archive_prototype/top250-identity-evidence.json")
            baseline=json.loads(baseline_path.read_text())
            expected=min(r["candidate_count"],baseline["checked_count"]+4)
            assert r["checked_count"]==expected, f"Expected {expected} checked candidates after bounded PR probe"
            old_ids={x["id"] for x in baseline["results"]}
            checked_new=[x for x in r["results"] if x["id"] not in old_ids]
            if checked_new:
              assert any(x["status"]!="source_unavailable" for x in checked_new), "CoinGecko source unavailable for entire PR batch"
          print("TOP250 EXACT-ID",json.dumps({k:r[k] for k in ("candidate_count","checked_count","approved_count")},sort_keys=True))
          PY
      - name: Approve persistence only on original marker addition
        id: permit
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          marker=public/agent_crypto_erith_ia/data/historical_archive_prototype/top250-identity-bootstrap.json
          status=$(git diff --name-status HEAD^ HEAD -- "$marker" | cut -f1)
          if [[ "$status" != A ]]; then
            echo "approved=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('public/agent_crypto_erith_ia/data/historical_archive_prototype/top250-identity-bootstrap.json')
          d=json.loads(p.read_text())
          assert d["schema"]=="aerith.public.ohlcv.spot.top250.identity.bootstrap.v1"
          assert d["action"]=="record_proven_coin_id_evidence_once"
          assert d["candidates"]==96 and d["max_hourly_batch"]==4
          assert d["no_symbol_only_approvals"] is True
          PY
          echo "approved=true" >> "$GITHUB_OUTPUT"
      - name: Confirm old source owners and UI unmodified
        run: |
          set -euo pipefail
          git diff --exit-code -- \
            public/agent_crypto_erith_ia/administrator/ \
            public/agent_crypto_erith_ia/trader/ \
            public/agent_crypto_erith_ia/data/crypto/ \
            public/agent_crypto_erith_ia/data/historical_archive_prototype/universe/ \
            public/agent_crypto_erith_ia/data/historical_archive_prototype/ohlcv_spot_pilot/ \
            public/agent_crypto_erith_ia/core/
      - name: Commit only identity evidence ledger (never OHLCV files)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && steps.permit.outputs.approved == 'true')
        run: |
          set -euo pipefail
          target=public/agent_crypto_erith_ia/data/historical_archive_prototype/top250-identity-evidence.json
          git add -- "$target"
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "NOOP: no new identities were checked"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Refresh exact-ID CoinGecko / Binance Spot Top250 identity proofs"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Evidence artifact for independent review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: top250-exact-identity-proofs
          path: ${{ runner.temp }}/top250-identity-evidence.json
          if-no-files-found: error
          retention-days: 30
