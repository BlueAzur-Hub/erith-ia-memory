  binance-historical-incident-month-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: seven_heaven_strategy_lab
    steps:
      - name: Checkout Strategy Lab research branch
        uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /seven_heaven_strategy_lab/

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Probe three historically reported Binance months
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/binance-incident-month-probe"
          mkdir -p "$root"
          base="https://data.binance.vision/data/spot/monthly/klines/BTCUSDT/1h"
          for month in 2019-03 2020-03 2021-04; do
            file="BTCUSDT-1h-$month.zip"
            curl --fail --location --retry 2 --connect-timeout 10 --max-time 45               "$base/$file" -o "$root/$file"
            curl --fail --location --retry 2 --connect-timeout 10 --max-time 20               "$base/$file.CHECKSUM" -o "$root/$file.CHECKSUM"
          done

          PILOT_ROOT="$root" python - <<'PY'
          import calendar, csv, hashlib, io, json, os, zipfile
          from collections import Counter
          from datetime import datetime, timezone
          from pathlib import Path
          from tools.certify_binance_history import certify_directory

          root = Path(os.environ["PILOT_ROOT"])
          out = certify_directory(root)
          expected_months = {"2019-03", "2020-03", "2021-04"}
          observed_months = {m["month"] for m in out["months"]} | {m["month"] for m in out["rejected"]}
          assert out["months_seen"] == 3
          assert observed_months == expected_months
          print(json.dumps(out, indent=2, ensure_ascii=False, sort_keys=True))

          diagnostics = []
          for label in sorted(expected_months):
              year, month = map(int, label.split("-"))
              name = f"BTCUSDT-1h-{label}"
              archive = (root / f"{name}.zip").read_bytes()
              checksum = (root / f"{name}.zip.CHECKSUM").read_text(encoding="ascii").strip()
              published = checksum.split()[0].lower()
              observed = hashlib.sha256(archive).hexdigest()
              assert observed == published
              with zipfile.ZipFile(io.BytesIO(archive)) as z:
                  rows = list(csv.reader(io.StringIO(z.read(f"{name}.csv").decode("utf-8"))))
              factor = 1000
              first = int(datetime(year, month, 1, tzinfo=timezone.utc).timestamp())
              count = calendar.monthrange(year, month)[1] * 24
              expected = {first + i * 3600 for i in range(count)}
              stamps = [int(r[0]) // factor for r in rows if r and r[0].isdigit()]
              counts = Counter(stamps)
              actual = set(stamps)
              missing = sorted(expected - actual)
              outside = sorted(actual - expected)
              duplicates = sorted(t for t, n in counts.items() if n > 1)
              unordered = sum(1 for a, b in zip(stamps, stamps[1:]) if b <= a)
              close_bad = []
              for row in rows:
                  if len(row) >= 7 and row[0].isdigit() and row[6].isdigit():
                      open_raw = int(row[0])
                      expected_close = open_raw + 3_600_000 - 1
                      if int(row[6]) != expected_close:
                          close_bad.append((open_raw // factor, int(row[6]), expected_close))
              diagnostics.append({
                  "month": label,
                  "archive_sha256": observed,
                  "rows": len(rows),
                  "expected_rows": count,
                  "missing_count": len(missing),
                  "missing_utc_sample": [datetime.fromtimestamp(t, timezone.utc).isoformat() for t in missing[:12]],
                  "duplicate_count": len(duplicates),
                  "duplicate_utc_sample": [datetime.fromtimestamp(t, timezone.utc).isoformat() for t in duplicates[:12]],
                  "outside_month_count": len(outside),
                  "unordered_or_duplicate_transitions": unordered,
                  "close_time_mismatch_count": len(close_bad),
                  "close_time_mismatch_open_utc_sample": [
                      datetime.fromtimestamp(t[0], timezone.utc).isoformat() for t in close_bad[:12]
                  ],
              })
          print("INCIDENT_DIAGNOSTICS")
          print(json.dumps(diagnostics, indent=2, ensure_ascii=False, sort_keys=True))
          PY

      - name: Prove incident probe stayed ephemeral
        run: |
          set -euo pipefail
          test ! -e workspace
          echo "PASS incident probe used runner-temp only; repository workspace untouched"



  binance-2019-2021-full-month-inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: seven_heaven_strategy_lab
    steps:
      - name: Checkout Strategy Lab research branch
        uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /seven_heaven_strategy_lab/

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Inventory all official Binance BTCUSDT 1h months from 2019 through 2021
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/binance-2019-2021-inventory"
          mkdir -p "$root"
          base="https://data.binance.vision/data/spot/monthly/klines/BTCUSDT/1h"
          total_bytes=0
          for year in 2019 2020 2021; do
            for mm in $(seq -w 1 12); do
              file="BTCUSDT-1h-$year-$mm.zip"
              curl --silent --show-error --fail --location --retry 2 --connect-timeout 10 --max-time 45                 "$base/$file" -o "$root/$file"
              curl --silent --show-error --fail --location --retry 2 --connect-timeout 10 --max-time 20                 "$base/$file.CHECKSUM" -o "$root/$file.CHECKSUM"
              bytes=$(stat -c%s "$root/$file")
              if [ "$bytes" -le 0 ] || [ "$bytes" -gt 8000000 ]; then
                echo "Unexpected archive size for $file: $bytes" >&2
                exit 1
              fi
              total_bytes=$((total_bytes + bytes))
            done
          done
          if [ "$total_bytes" -gt 20000000 ]; then
            echo "Bounded pilot exceeded 20 MB: $total_bytes" >&2
            exit 1
          fi

          INVENTORY_ROOT="$root" python - <<'PY'
          import json, os
          from pathlib import Path
          from tools.certify_binance_history import certify_directory
          out = certify_directory(Path(os.environ["INVENTORY_ROOT"]))
          assert out["months_seen"] == 36
          certified = [
              {
                  "month": m["month"],
                  "rows": m["rows"],
                  "archive_sha256": m["archive_sha256"],
                  "normalized_csv_sha256": m["normalized_csv_sha256"],
                  "historical_incident_reported": m["historical_incident_reported"],
              }
              for m in out["months"]
          ]
          summary = {
              "schema": out["schema"],
              "certified_at_utc": out["certified_at_utc"],
              "months_seen": out["months_seen"],
              "months_certified": out["months_certified"],
              "months_rejected": out["months_rejected"],
              "certified": certified,
              "rejected": out["rejected"],
              "safety": out["safety"],
          }
          print("FULL_2019_2021_INVENTORY")
          print(json.dumps(summary, indent=2, ensure_ascii=False, sort_keys=True))
          PY

      - name: Run preregistered Donchian 55-20 on certified 2019-2021 segments
        run: |
          set -euo pipefail
          INVENTORY_ROOT="$RUNNER_TEMP/binance-2019-2021-inventory" python - <<'PY'
          import json, os, shutil
          from pathlib import Path
          from tools.certify_binance_history import load_certified_contiguous_block
          from tools.experimental_donchian import simulate_donchian
          from src.observatory import aggregate_bars

          root = Path(os.environ["INVENTORY_ROOT"])
          blocks = {
              "A_2019_01_02": ["2019-01", "2019-02"],
              "B_2019_09_10": ["2019-09", "2019-10"],
              "C_2020_07_10": ["2020-07", "2020-08", "2020-09", "2020-10"],
              "D_2021_05_07": ["2021-05", "2021-06", "2021-07"],
              "E_2021_10_11": ["2021-10", "2021-11"],
          }
          selected_root = root / "_selected_segments"
          selected_root.mkdir(exist_ok=True)
          out = {}

          for label, months in blocks.items():
              block_dir = selected_root / label
              block_dir.mkdir()
              for month in months:
                  name = f"BTCUSDT-1h-{month}.zip"
                  shutil.copy2(root / name, block_dir / name)
                  shutil.copy2(root / f"{name}.CHECKSUM", block_dir / f"{name}.CHECKSUM")

              hourly = load_certified_contiguous_block(block_dir)
              bars = aggregate_bars(hourly, "4h", source_timeframe="1h")
              base = simulate_donchian(bars, fee=0.001, slippage=0.0005)
              ideal = simulate_donchian(bars, fee=0.0, slippage=0.0)
              stress = simulate_donchian(bars, fee=0.002, slippage=0.001)
              out[label] = {
                  "months": months,
                  "hourly_candles": len(hourly),
                  "candles_4h": len(bars),
                  "base": base["results"],
                  "zero_friction": ideal["results"],
                  "double_cost": stress["results"],
                  "safety": base["safety"],
              }
              assert base["safety"]["orders_real"] == 0
              assert base["safety"]["runtime_integration"] is False

          print("DONCHIAN_55_20_4H_SEGMENTED_2019_2021_RESULTS")
          print(json.dumps(out, indent=2, ensure_ascii=False, sort_keys=True))
          PY

      - name: Prove full inventory stayed ephemeral
        run: |
          set -euo pipefail
          test ! -e workspace
          echo "PASS 36-month inventory used runner-temp only; repository workspace untouched"



  binance-daily-gap-recovery-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: seven_heaven_strategy_lab
    steps:
      - name: Checkout Strategy Lab research branch
        uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /seven_heaven_strategy_lab/

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Probe official daily archives around monthly gaps
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/binance-daily-gap-probe"
          mkdir -p "$root"
          base="https://data.binance.vision/data/spot/daily/klines/BTCUSDT/1h"
          for day in 2019-03-12 2020-03-04 2021-04-20 2021-04-25; do
            file="BTCUSDT-1h-$day.zip"
            curl --silent --show-error --fail --location --retry 2 --connect-timeout 10 --max-time 45               "$base/$file" -o "$root/$file"
            curl --silent --show-error --fail --location --retry 2 --connect-timeout 10 --max-time 20               "$base/$file.CHECKSUM" -o "$root/$file.CHECKSUM"
          done

          DAILY_ROOT="$root" python - <<'PY'
          import csv, hashlib, io, json, os, zipfile
          from datetime import datetime, timezone
          from pathlib import Path

          root = Path(os.environ["DAILY_ROOT"])
          reports = []
          for zip_path in sorted(root.glob("*.zip")):
              label = zip_path.stem.removeprefix("BTCUSDT-1h-")
              checksum_path = zip_path.with_name(zip_path.name + ".CHECKSUM")
              checksum = checksum_path.read_text(encoding="ascii").strip()
              expected_sha = checksum.split()[0].lower()
              archive = zip_path.read_bytes()
              observed_sha = hashlib.sha256(archive).hexdigest()
              assert observed_sha == expected_sha
              csv_name = zip_path.stem + ".csv"
              with zipfile.ZipFile(io.BytesIO(archive)) as z:
                  rows = list(csv.reader(io.StringIO(z.read(csv_name).decode("utf-8"))))
              start = int(datetime.fromisoformat(label).replace(tzinfo=timezone.utc).timestamp())
              expected = [start + i * 3600 for i in range(24)]
              stamps = [int(row[0]) // 1000 for row in rows]
              missing = [t for t in expected if t not in set(stamps)]
              close_bad = []
              for row in rows:
                  opened = int(row[0])
                  if int(row[6]) != opened + 3_600_000 - 1:
                      close_bad.append(opened // 1000)
              reports.append({
                  "day": label,
                  "archive_sha256": observed_sha,
                  "rows": len(rows),
                  "expected_rows": 24,
                  "missing_utc": [datetime.fromtimestamp(t, timezone.utc).isoformat() for t in missing],
                  "close_time_mismatch_open_utc": [
                      datetime.fromtimestamp(t, timezone.utc).isoformat() for t in close_bad
                  ],
                  "complete_strict_day": len(rows) == 24 and stamps == expected and not close_bad,
              })
          assert len(reports) == 4
          print("DAILY_GAP_RECOVERY_DIAGNOSTICS")
          print(json.dumps(reports, indent=2, ensure_ascii=False, sort_keys=True))
          PY

      - name: Prove daily gap probe stayed ephemeral
        run: |
          set -euo pipefail
          test ! -e workspace
          echo "PASS daily gap probe used runner-temp only; repository workspace untouched"



