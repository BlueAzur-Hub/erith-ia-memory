name: Seven Heaven Strategy Lab V4.6.2 PAPER validation

on:
  push:
    branches:
      - maintenance/strategy-lab-v4-6-2-ci-20261116
      - main
    paths:
      - 'seven_heaven_strategy_lab/**'
      - '.github/workflows/seven-heaven-strategy-lab-portable-paper-validation.yml'
  pull_request:
    branches: [main]
    paths:
      - 'seven_heaven_strategy_lab/**'
      - '.github/workflows/seven-heaven-strategy-lab-portable-paper-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-python-313:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    defaults:
      run:
        working-directory: seven_heaven_strategy_lab
    steps:
      - name: Checkout Strategy Lab only
        uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /seven_heaven_strategy_lab/
            /.github/workflows/seven-heaven-strategy-lab-portable-paper-validation.yml

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Static syntax
        run: |
          set -euo pipefail
          python -m compileall -q src tests
          node --check web/app.js
          node --check web/microscope.js
          node --check web/forensics.js
          node --check web/strategy_research.js
          docker compose config --quiet

      - name: Full PAPER unit suite
        run: |
          set -euo pipefail
          python -m unittest discover -v -s tests -p 'test_*.py'

      - name: V4.6.2 local API contract smoke
        env:
          SEVEN_LAB_WORKSPACE: ${{ runner.temp }}/seven-lab-v462/workspace
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path
          from src.reference_data import install_reference
          root=Path(os.environ["SEVEN_LAB_WORKSPACE"])
          status=install_reference(root)
          assert status["available"] is True
          assert status["rows_expected"]==44640
          print("PASS reference source installed in isolated runner workspace")
          PY

          python -m src.server > "$RUNNER_TEMP/seven-lab-v462.log" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT

          python - <<'PY'
          import json,time,urllib.request,urllib.error
          base="http://127.0.0.1:8777"

          def req(path,data=None):
              payload=None if data is None else json.dumps(data).encode()
              r=urllib.request.Request(
                  base+path,
                  data=payload,
                  headers={"Content-Type":"application/json"} if data is not None else {},
              )
              with urllib.request.urlopen(r,timeout=20) as res:
                  return json.loads(res.read())

          for _ in range(50):
              try:
                  health=req("/api/health")
                  break
              except Exception:
                  time.sleep(.2)
          else:
              raise RuntimeError("V4.6.2 local server did not start")

          assert health["version"]=="4.6.2"
          assert health["live_trading"] is False
          assert health["strategy_creator_enabled"] is True
          assert health["market_microscope_enabled"] is True
          assert health["walk_forward_research_enabled"] is True
          assert health["paper_trade_forensics_enabled"] is True
          assert health["controlled_filter_research_enabled"] is True

          datasets=req("/api/datasets")
          assert datasets["datasets"][0]["available"] is True

          run=req("/api/run",{"params":{"kind":"EMA_CROSS","timeframe":"1h","capital":1000,"fee":0.001,"slippage":0.0005}})
          assert run["report"]["run"]["safety"]["orders_real"]==0

          scientific=req("/api/robustness",{"params":{"kind":"EMA_CROSS","timeframe":"1h","capital":1000,"fee":0.001,"slippage":0.0005}})
          s=scientific["research"]
          assert s["status"]=="CHRONOLOGICAL_PAPER_RESEARCH_EXPLICIT_NO_TRADE_WARMUP_NOT_UNTOUCHED_BLIND_OOS"
          assert s["safety"]["orders_real"]==0
          assert all(f["warmup"]["fills_allowed_during_warmup"]==0 for f in s["folds"])

          filters=req("/api/filters-study",{"params":{
              "kind":"CUSTOM_RULES","timeframe":"1h","capital":1000,
              "entry_rule":"EMA_CROSS_UP","exit_rule":"EMA_CROSS_DOWN",
              "filter_rule":"NONE","fee":0.001,"slippage":0.0005
          }})
          f=filters["research"]
          assert f["status"]=="NONBLIND_PREDECLARED_TRAIN_ONLY_SELECTION_LATER_HOLDOUTS_EXPLICIT_NO_TRADE_WARMUP"
          assert f["safety"]["orders_real"]==0
          assert f["methodology"]["warmup_fills_allowed"] is False

          print("PASS V4.6.2 local API / Scientific / Research PAPER contracts")
          PY

  okx-public-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: seven_heaven_strategy_lab
    steps:
      - name: Checkout Strategy Lab only
        uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /seven_heaven_strategy_lab/

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Verify public OKX source remains PAPER-only and continuous
        run: |
          set -euo pipefail
          python - <<'PY'
          import tempfile
          from pathlib import Path
          from src.okx_public import collect,read_source
          with tempfile.TemporaryDirectory() as d:
              root=Path(d)
              meta=collect(root,"BTC-USDC")
              manifest,bars=read_source(root,meta["id"])
              assert len(bars)==240
              assert meta["status"]=="COMPLETE_CLOSED_240_1H_CANDLES"
              assert meta["live_orders"]==0
              assert all(bars[i][0]-bars[i-1][0]==3600 for i in range(1,len(bars)))
              print("PASS real public OKX BTC-USDC 240 closed 1h candles; zero orders")
          PY


  binance-long-history-real-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: seven_heaven_strategy_lab
    steps:
      - name: Checkout Strategy Lab research branch
        uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /seven_heaven_strategy_lab/

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Certify three fixed official Binance monthly samples
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/binance-long-history-pilot"
          mkdir -p "$root"
          base="https://data.binance.vision/data/spot/monthly/klines/BTCUSDT/1h"
          for month in 2019-01 2020-01 2021-05; do
            file="BTCUSDT-1h-$month.zip"
            curl --fail --location --retry 2 --connect-timeout 10 --max-time 45               "$base/$file" -o "$root/$file"
            curl --fail --location --retry 2 --connect-timeout 10 --max-time 20               "$base/$file.CHECKSUM" -o "$root/$file.CHECKSUM"
            bytes=$(stat -c%s "$root/$file")
            if [ "$bytes" -le 0 ] || [ "$bytes" -gt 8000000 ]; then
              echo "Unexpected archive size for $file: $bytes" >&2
              exit 1
            fi
            echo "Downloaded bounded official sample: $file ($bytes bytes)"
          done

          python -m tools.certify_binance_history "$root"

      - name: Prove no pilot files entered repository workspace
        run: |
          set -euo pipefail
          test ! -e workspace
          echo "PASS runner-temp only; repository workspace untouched"


  windows-python-313-double-click:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Strategy Lab only
        uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /seven_heaven_strategy_lab/
            /.github/workflows/seven-heaven-strategy-lab-portable-paper-validation.yml

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Run full PAPER unit suite on Windows
        shell: pwsh
        working-directory: seven_heaven_strategy_lab
        run: |
          py -3.13 --version
          py -3.13 -m unittest discover -v -s tests -p 'test_*.py'
          if (-not (Test-Path "START_SEVEN_HEAVEN_STRATEGY_LAB_PYTHON_WINDOWS.cmd")) {
            throw "Missing Windows double-click launcher"
          }

      - name: Launch actual Windows CMD and verify V4.6.2
        shell: pwsh
        run: |
          $env:SEVEN_LAB_OPEN_BROWSER = "0"
          $env:SEVEN_LAB_WORKSPACE = Join-Path $env:RUNNER_TEMP "seven-lab-v462-workspace"

          Push-Location "seven_heaven_strategy_lab"
          py -3.13 -c "from pathlib import Path; import os; from src.reference_data import install_reference; s=install_reference(Path(os.environ['SEVEN_LAB_WORKSPACE'])); assert s['available']"
          Pop-Location

          $process = Start-Process -FilePath "cmd.exe" -ArgumentList '/c START_SEVEN_HEAVEN_STRATEGY_LAB_PYTHON_WINDOWS.cmd' -WorkingDirectory "seven_heaven_strategy_lab" -PassThru
          try {
            $ready = $false
            for ($i = 0; $i -lt 60; $i++) {
              try {
                $health = Invoke-RestMethod -Uri "http://127.0.0.1:8777/api/health" -TimeoutSec 2
                if ($health.name -eq "Seven Heaven Strategy Lab" -and $health.live_trading -eq $false) {
                  $ready = $true
                  break
                }
              } catch { }
              Start-Sleep -Milliseconds 250
            }
            if (-not $ready) { throw "Python CMD launcher failed to start V4.6.2 loopback PAPER server" }
            if ($health.version -ne "4.6.2") { throw "Expected V4.6.2 health contract" }

            $page = Invoke-WebRequest -Uri "http://127.0.0.1:8777/" -UseBasicParsing -TimeoutSec 5
            if ($page.StatusCode -ne 200 -or -not $page.Content.Contains("SEVEN HEAVEN")) {
              throw "Local UI was not served"
            }
            Write-Host "PASS actual Windows CMD launched V4.6.2 PAPER UI"
          } finally {
            taskkill.exe /PID $process.Id /T /F 2>$null | Out-Null
          }
