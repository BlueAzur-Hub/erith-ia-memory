name: Seven Heaven ETH Bitstamp Native Research

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/seven-heaven-eth-bitstamp-native-research.yml'
      - 'coordination/inter_ai_dialogues/agent_crypto/research/strategy_profiles/SEVEN_HEAVEN_ETH_BITSTAMP_NATIVE_REPLAY_2026_11_12.py'
      - 'coordination/inter_ai_dialogues/agent_crypto/research/strategy_profiles/test_seven_heaven_eth_bitstamp_native_replay.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: seven-heaven-eth-bitstamp-native-once
  cancel-in-progress: false

jobs:
  read-only-native-eth-research:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Confirm Python syntax and offline safety contract
        run: |
          set -euo pipefail
          SCRIPT='coordination/inter_ai_dialogues/agent_crypto/research/strategy_profiles/SEVEN_HEAVEN_ETH_BITSTAMP_NATIVE_REPLAY_2026_11_12.py'
          python -m py_compile "$SCRIPT"
          python "$SCRIPT" --selftest
          python -m unittest -v coordination/inter_ai_dialogues/agent_crypto/research/strategy_profiles/test_seven_heaven_eth_bitstamp_native_replay.py
      - name: Download native Bitstamp public ETH USD candles and replay fixed EMA
        run: |
          set -euo pipefail
          python coordination/inter_ai_dialogues/agent_crypto/research/strategy_profiles/SEVEN_HEAVEN_ETH_BITSTAMP_NATIVE_REPLAY_2026_11_12.py --repo-root .
      - name: Verify source, result, checksum and safety state
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv,hashlib,json,pathlib
          root=pathlib.Path('coordination/inter_ai_dialogues/agent_crypto/research/strategy_profiles/native_bitstamp_eth_2024_2026_evidence')
          p=root/'eth_ema_bitstamp_native_proofs.json'
          doc=json.loads(p.read_text(encoding='utf8'))
          assert doc['schema']=='seven-heaven.bitstamp-eth-usd-daily-ema-native-v1'
          assert doc['status']=='NATIVE_API_REPLAY_EXECUTED'
          assert doc['orders_enabled'] is False
          assert doc['daily_source_count']==1310 and doc['test_days']==1035
          assert doc['comparison']['daily_signal_agree']+doc['comparison']['daily_signal_disagree']==1035
          assert doc['comparison']['daily_return_pairs']==1034
          raw=(root/'bitstamp_ethusd_daily_2023_2026.csv').read_bytes()
          assert hashlib.sha256(raw).hexdigest()==doc['source_sha256']
          assert len(list(csv.DictReader(raw.decode('utf8').splitlines())))==1310
          for n in ('SEVEN_HEAVEN_ETH_BITSTAMP_NATIVE_2024_2026_REPLAY_REPORT.md',
                    'eth_ema_binance_bitstamp_disagreements.csv'):
              assert (root/n).exists()
          print('PASS: 1,310 native ETH daily candles, 1,035 fixed-policy PAPER days')
          PY
      - name: Archive immutable evidence as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: seven-heaven-eth-bitstamp-native-research
          path: coordination/inter_ai_dialogues/agent_crypto/research/strategy_profiles/native_bitstamp_eth_2024_2026_evidence/
          if-no-files-found: error
          retention-days: 90
      - name: Publish evidence ONLY inside shared inter-AI research directory
        run: |
          set -euo pipefail
          target='coordination/inter_ai_dialogues/agent_crypto/research/strategy_profiles/native_bitstamp_eth_2024_2026_evidence'
          git add -- "$target"
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'NOOP: identical research evidence already published'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'research: archive native Bitstamp ETH USD 2024-2026 EMA evidence'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
