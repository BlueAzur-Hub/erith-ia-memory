name: Agent-Crypto 40.4.246-248 Market control cascade R2

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/agent-crypto-404246-248-r2.yml

permissions:
  contents: write

jobs:
  cascade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build validate publish package cascade
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,re,subprocess,zipfile,hashlib

          BASE=Path('public/agent_crypto_erith_ia/administrator')
          ART=Path('/tmp/aether-cascade-artifacts'); ART.mkdir(parents=True,exist_ok=True)
          PROTECTED='38.15.11'
          IDENTITY=['administrator-version.json','app.js','build.json','index.html','js/app.js','js/views/system-presentation.js','version.json']
          MARKET=IDENTITY+['js/parallel-markets.js','parallel-markets.css']

          def run(*args): subprocess.run(list(args),check=True)
          def version(): return json.loads((BASE/'version.json').read_text(encoding='utf-8'))
          def assert_protected():
              v=version(); assert v['engine']['reference_build']==PROTECTED and v['engine']['status']=='protected'
              vis=(BASE/'admin-visual-assets.css').read_text(encoding='utf-8')
              assert 'TECHNICAL_READING_CANONICAL_OWNER_404245' in vis
              assert 'height:136px!important;' in vis and 'flex:0 0 136px!important;' in vis and 'object-fit:cover!important;' in vis
          def sync_cache(build):
              ip=BASE/'index.html'; s=ip.read_text(encoding='utf-8')
              s,n1=re.subn(r'parallel-markets\.css\?v=[^"\']+','parallel-markets.css?v='+build,s,count=1)
              s,n2=re.subn(r'js/parallel-markets\.js\?v=[^"\']+','js/parallel-markets.js?v='+build,s,count=1)
              s,n3=re.subn(r'js/views/system-presentation\.js\?v=administrator-build-[^"\']+','js/views/system-presentation.js?v=administrator-build-'+build,s,count=1)
              assert (n1,n2,n3)==(1,1,1),(n1,n2,n3)
              ip.write_text(s,encoding='utf-8')
              sp=BASE/'js/views/system-presentation.js'; t=sp.read_text(encoding='utf-8')
              t,n4=re.subn(r'const SOURCE="\./views/system\.html\?v=administrator-build-[^"]+";',f'const SOURCE="./views/system.html?v=administrator-build-{build}";',t,count=1)
              assert n4==1,n4
              sp.write_text(t,encoding='utf-8')
          def release(build,parent,title,status,key,contract,lineage):
              p=Path('/tmp')/f'{key}.json'; p.write_text(json.dumps(contract,ensure_ascii=False,indent=2),encoding='utf-8')
              run('python','.github/scripts/agent_crypto_release_driver.py','--build',build,'--parent',parent,'--release',title,'--status',status,'--contract-key',key,'--contract-json',str(p),'--lineage-note',lineage)
              run('node','--check',str(BASE/'js/parallel-markets.js'))
              run('python','.github/scripts/agent_crypto_version_truth_guard.py','--expected-build',build,'--expected-release',title)
              v=version(); assert v['build']==build and v['parent_build']==parent
              assert_protected()
          def commit_push(msg):
              run('git','add',str(BASE)); run('git','commit','-m',msg); run('git','pull','--rebase','origin','main'); run('git','push','origin','HEAD:main')
              return subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          def package(build,label,files):
              z=ART/f'AGENT_CRYPTO_BUILD_{build.replace(".","_")}_{label}.zip'
              with zipfile.ZipFile(z,'w',zipfile.ZIP_DEFLATED,compresslevel=9) as out:
                  for rel in files:
                      p=BASE/rel; assert p.is_file(),p
                      out.write(p,arcname=str(Path('public/agent_crypto_erith_ia/administrator')/rel))
                  out.writestr(f'FILES_CHANGED_{build}.md',f'# Agent-Crypto {build}\n\n{label.replace("_"," ")}\n')
              sha=hashlib.sha256(z.read_bytes()).hexdigest()
              (ART/(z.stem+'_SHA256.txt')).write_text(sha+'  '+z.name+'\n',encoding='utf-8')
              print(z.name,sha)

          run('git','config','user.name','Aether Release Bot'); run('git','config','user.email','actions@users.noreply.github.com')
          assert_protected(); current=version()['build']; assert current in {'40.4.245','40.4.246','40.4.247','40.4.248'},current

          if current=='40.4.245':
              js_p=BASE/'js/parallel-markets.js'; css_p=BASE/'parallel-markets.css'
              js=js_p.read_text(encoding='utf-8'); css=css_p.read_text(encoding='utf-8')
              assert 'const BUILD = "40.4.237";' in js; js=js.replace('const BUILD = "40.4.237";','const BUILD = "40.4.246";',1)
              old='''        <span class="mirror-group atlas-toolbar-view-404228"><small>VUE</small><b class="active">Base 100</b></span>\n        <span class="mirror-group atlas-toolbar-period-404228 atlas-parallel-periods"><small>PÉRIODE</small>${PERIODS.map(p => `<button type="button" data-parallel-period="${p}">${p}</button>`).join("")}${LONG_PERIODS.map(p => `<button type="button" data-parallel-long-period="${p}" title="Historique long chargé uniquement à la demande">${p === "max" ? "MAX" : p}</button>`).join("")}</span>\n        <span class="mirror-group atlas-toolbar-inspection-404228"><small>INSPECTION</small><b class="active">Survol</b><span>Valeurs réelles</span></span>`;'''
              new='''        <span class="mirror-group atlas-toolbar-view-404228" role="group" aria-label="Vue"><small>VUE</small><b class="active">Base 100</b></span>\n        <span class="mirror-group atlas-toolbar-history-404246 atlas-parallel-history" role="group" aria-label="Historique long"><small>HISTORIQUE</small>${LONG_PERIODS.map(p => `<button type="button" data-parallel-long-period="${p}" title="Historique long chargé uniquement à la demande">${p === "max" ? "MAX" : p}</button>`).join("")}</span>\n        <span class="mirror-group atlas-toolbar-inspection-404228" role="group" aria-label="Inspection"><small>INSPECTION</small><b class="active">Survol</b><span>Valeurs réelles</span></span>\n        <span class="mirror-group atlas-toolbar-period-404228 atlas-parallel-periods" role="group" aria-label="Période standard"><small>PÉRIODE</small>${PERIODS.map(p => `<button type="button" data-parallel-period="${p}">${p}</button>`).join("")}</span>`;'''
              assert old in js; js=js.replace(old,new,1)
              marker='40.4.237 — PARALLEL CANONICAL OWNER CONSOLIDATION'; pos=css.index(marker); head,owner=css[:pos],css[pos:]
              assert '.atlas-toolbar-history-404246' not in owner
              view='''  html[data-cyclic-market-mode="parallel"] #atlasCyclicMarketMirrorToolbar404168 .atlas-toolbar-view-404228{\n    grid-column:2!important;display:grid!important;grid-template-columns:42px minmax(72px,1fr)!important;align-items:center!important;gap:4px!important;\n  }\n'''
              hist='''  html[data-cyclic-market-mode="parallel"] #atlasCyclicMarketMirrorToolbar404168 .atlas-toolbar-history-404246{\n    grid-column:3!important;display:grid!important;grid-template-columns:58px repeat(3,minmax(38px,1fr))!important;align-items:center!important;gap:4px!important;min-width:0!important;\n  }\n'''
              assert view in owner; owner=owner.replace(view,view+hist,1)
              oldp='grid-column:5!important;display:grid!important;grid-template-columns:52px repeat(9,minmax(31px,1fr))!important;align-items:center!important;gap:4px!important;min-width:0!important;'
              newp='grid-column:5!important;display:grid!important;grid-template-columns:52px repeat(6,minmax(34px,1fr))!important;align-items:center!important;gap:4px!important;min-width:0!important;'
              assert oldp in owner; owner=owner.replace(oldp,newp,1); css=head+owner
              js_p.write_text(js,encoding='utf-8'); css_p.write_text(css,encoding='utf-8'); sync_cache('40.4.246')
              c={'build':'40.4.246','parent':'40.4.245','scope':'parallel_market_control_grammar','canonical_parallel_owner':'parallel-markets.css#40.4.237','canonical_owner_edited_in_place':True,'new_final_stylesheet':False,'standard_periods':['24h','7j','30j','60j','90j','1a'],'long_history_controls':['5a','10a','max'],'long_history_dedicated_slot':True,'graph_geometry_changed':False,'rail_geometry_changed':False,'technical_reading_locked':'40.4.245','technical_reading_changed':False,'market_core_changed':False,'protected_market_core':PROTECTED,'new_timer':False,'new_observer':False,'new_fetch':False,'new_websocket':False}
              release('40.4.246','40.4.245','MARKETS · PARALLEL CONTROL GRAMMAR CONVERGENCE','parallel_market_control_grammar_404246','parallel_market_control_grammar_404246',c,'40.4.246 separates standard horizons from lazy long-history controls inside the existing 40.4.237 canonical owner; graph and rail geometry remain unchanged')
              css=(BASE/'parallel-markets.css').read_text(encoding='utf-8'); js=(BASE/'js/parallel-markets.js').read_text(encoding='utf-8')
              assert css.count(marker)==1 and '.atlas-toolbar-history-404246' in css and 'repeat(6,minmax(34px,1fr))' in css[css.index(marker):]
              assert 'atlas-toolbar-history-404246 atlas-parallel-history' in js
              sha246=commit_push('agent-crypto: build 40.4.246 converge parallel market control grammar'); package('40.4.246','PARALLEL_CONTROL_GRAMMAR_CHANGED_FILES',MARKET)
              current='40.4.246'; print('PUBLISHED 40.4.246',sha246)

          if current=='40.4.246':
              js_p=BASE/'js/parallel-markets.js'; css_p=BASE/'parallel-markets.css'
              js=js_p.read_text(encoding='utf-8'); css=css_p.read_text(encoding='utf-8')
              assert 'const BUILD = "40.4.246";' in js; js=js.replace('const BUILD = "40.4.246";','const BUILD = "40.4.247";',1)
              old='''    const buttons = toolbar()?.querySelectorAll("[data-parallel-period]") || [];\n    buttons.forEach(b => { const p=b.getAttribute("data-parallel-period"); b.classList.toggle("is-active", p===period); b.disabled = domain==="cross-market" && p==="24h"; });\n    const longButtons = toolbar()?.querySelectorAll("[data-parallel-long-period]") || [];'''
              new='''    const activeToolbar = toolbar();\n    if (activeToolbar) {\n      activeToolbar.dataset.activePeriod = period;\n      activeToolbar.dataset.activePeriodKind = isLongPeriod(period) ? "history" : "standard";\n      activeToolbar.setAttribute("aria-label", `${cfg.title} · période active ${period.toUpperCase()}`);\n    }\n    const buttons = activeToolbar?.querySelectorAll("[data-parallel-period]") || [];\n    buttons.forEach(b => {\n      const p=b.getAttribute("data-parallel-period"); const active=p===period;\n      b.classList.toggle("is-active", active); b.disabled = domain==="cross-market" && p==="24h";\n      b.setAttribute("aria-pressed", active ? "true" : "false");\n    });\n    const longButtons = activeToolbar?.querySelectorAll("[data-parallel-long-period]") || [];'''
              assert old in js; js=js.replace(old,new,1)
              oldl='''      b.classList.toggle("is-active", available && p === period);\n      b.disabled = !available;\n      b.setAttribute("aria-disabled", available ? "false" : "true");'''
              newl='''      const active = available && p === period;\n      b.classList.toggle("is-active", active); b.disabled = !available;\n      b.setAttribute("aria-disabled", available ? "false" : "true");\n      b.setAttribute("aria-pressed", active ? "true" : "false");'''
              assert oldl in js; js=js.replace(oldl,newl,1)
              marker='40.4.237 — PARALLEL CANONICAL OWNER CONSOLIDATION'; pos=css.index(marker); head,owner=css[:pos],css[pos:]
              assert 'button:focus-visible' not in owner
              anchor='''  html[data-cyclic-market-mode="parallel"] #atlasCyclicMarketMirrorToolbar404168 .atlas-toolbar-inspection-404228>span{'''
              focus='''  html[data-cyclic-market-mode="parallel"] #atlasCyclicMarketMirrorToolbar404168 button:focus-visible{\n    outline:2px solid color-mix(in srgb,var(--cyclic-market-accent,#a9b9c7) 72%,white)!important;outline-offset:2px!important;\n  }\n'''
              assert anchor in owner; owner=owner.replace(anchor,focus+anchor,1); css=head+owner
              js_p.write_text(js,encoding='utf-8'); css_p.write_text(css,encoding='utf-8'); sync_cache('40.4.247')
              c={'build':'40.4.247','parent':'40.4.246','scope':'parallel_active_horizon_truth','active_period_dataset':True,'active_period_kind_dataset':True,'aria_pressed_periods':True,'keyboard_focus_visible':True,'graph_geometry_changed':False,'rail_geometry_changed':False,'technical_reading_locked':'40.4.245','technical_reading_changed':False,'market_core_changed':False,'protected_market_core':PROTECTED,'new_timer':False,'new_observer':False,'new_fetch':False,'new_websocket':False}
              release('40.4.247','40.4.246','MARKETS · ACTIVE HORIZON TRUTH + KEYBOARD SEMANTICS','parallel_active_horizon_truth_404247','parallel_active_horizon_truth_404247',c,'40.4.247 makes the active parallel-market horizon explicit in DOM and ARIA and adds keyboard focus visibility without changing market data or geometry')
              assert 'dataset.activePeriod = period' in (BASE/'js/parallel-markets.js').read_text(encoding='utf-8')
              assert 'button:focus-visible' in (BASE/'parallel-markets.css').read_text(encoding='utf-8')
              sha247=commit_push('agent-crypto: build 40.4.247 lock active parallel market horizon truth'); package('40.4.247','ACTIVE_HORIZON_TRUTH_CHANGED_FILES',MARKET)
              current='40.4.247'; print('PUBLISHED 40.4.247',sha247)

          if current=='40.4.247':
              sync_cache('40.4.248')
              c={'build':'40.4.248','parent':'40.4.247','scope':'five_market_static_freeze_candidate','functional_delta':False,'cascade_from':'40.4.245','parallel_control_grammar':'40.4.246','active_horizon_truth':'40.4.247','technical_reading_reference':'40.4.245_LOCKED','firefox_operator_validation_required':True,'firefox_operator_validation_claimed':False,'required_operator_cycle':['crypto','metals','indices','energy','cross-market','crypto'],'market_core_changed':False,'protected_market_core':PROTECTED,'technical_reading_changed':False,'new_timer':False,'new_observer':False,'new_fetch':False,'new_websocket':False}
              release('40.4.248','40.4.247','MARKETS · FIVE-MARKET STATIC FREEZE CANDIDATE','five_market_static_freeze_candidate_404248','five_market_static_freeze_candidate_404248',c,'40.4.248 is the no-functional-delta static checkpoint after 40.4.246/247; Firefox operator validation remains required before field acceptance')
              v=version(); assert v['contracts']['five_market_static_freeze_candidate_404248']['firefox_operator_validation_claimed'] is False
              sha248=commit_push('agent-crypto: build 40.4.248 freeze five-market static candidate'); package('40.4.248','FIVE_MARKET_STATIC_FREEZE_CANDIDATE_CHANGED_FILES',IDENTITY); package('40.4.248','MARKET_CONTROL_CASCADE_CUMULATIVE_CHANGED_FILES',MARKET)
              current='40.4.248'; print('PUBLISHED 40.4.248',sha248)

          assert version()['build']=='40.4.248'; assert_protected(); print('CASCADE COMPLETE 40.4.245 -> 40.4.248')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: AGENT_CRYPTO_BUILD_40_4_246_PARALLEL_CONTROL_GRAMMAR_CHANGED_FILES
          path: /tmp/aether-cascade-artifacts/AGENT_CRYPTO_BUILD_40_4_246_PARALLEL_CONTROL_GRAMMAR_CHANGED_FILES*
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: AGENT_CRYPTO_BUILD_40_4_247_ACTIVE_HORIZON_TRUTH_CHANGED_FILES
          path: /tmp/aether-cascade-artifacts/AGENT_CRYPTO_BUILD_40_4_247_ACTIVE_HORIZON_TRUTH_CHANGED_FILES*
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: AGENT_CRYPTO_BUILD_40_4_248_FIVE_MARKET_STATIC_FREEZE_CANDIDATE_CHANGED_FILES
          path: /tmp/aether-cascade-artifacts/AGENT_CRYPTO_BUILD_40_4_248_FIVE_MARKET_STATIC_FREEZE_CANDIDATE_CHANGED_FILES*
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: AGENT_CRYPTO_BUILD_40_4_248_MARKET_CONTROL_CASCADE_CUMULATIVE_CHANGED_FILES
          path: /tmp/aether-cascade-artifacts/AGENT_CRYPTO_BUILD_40_4_248_MARKET_CONTROL_CASCADE_CUMULATIVE_CHANGED_FILES*
          if-no-files-found: error

      - name: Cleanup temporary release workflows
        if: success()
        shell: bash
        run: |
          git config user.name "Aether Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git rm -f .github/workflows/agent-crypto-404246-248.yml .github/workflows/agent-crypto-404246-248-r2.yml
          git commit -m "agent-crypto: cleanup 40.4.246-248 temporary release tools"
          git pull --rebase origin main
          git push origin HEAD:main
