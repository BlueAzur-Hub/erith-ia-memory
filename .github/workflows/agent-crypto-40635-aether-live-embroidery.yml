name: Agent-Crypto 40.6.35 Aether Live Embroidery
# retry 2: metadata engine gate corrected; precise embroidery patch staged

on:
  push:
    paths:
      - '.github/workflows/agent-crypto-40635-aether-live-embroidery.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout canonical main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Build guarded 40.6.35
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile .github/scripts/agent_crypto_40635_release.py
          python3 .github/scripts/agent_crypto_40635_release.py

      - name: Final anti-destruction gates
        shell: bash
        run: |
          set -euo pipefail
          ROOT=public/agent_crypto_erith_ia/administrator
          ZIP=coordination/inter_ai_dialogues/agent_crypto/AGENT_CRYPTO_BUILD_40_6_35_AETHER_LIVE_EMBROIDERY_BACKGROUND_FIRST_UI_CLEAN_UPLOAD_7_FILES.zip
          SHA="$ZIP.sha256"
          node --check "$ROOT/js/aether.js"
          python3 -m json.tool "$ROOT/build.json" >/dev/null
          python3 -m json.tool "$ROOT/administrator-version.json" >/dev/null
          python3 -m json.tool "$ROOT/version.json" >/dev/null
          grep -q '<meta name="administrator-build" content="40.6.35"' "$ROOT/index.html"
          grep -q 'admin-ribbons.css?v=administrator-build-40.6.35' "$ROOT/index.html"
          grep -q '40.6.35 — AETHER LIVE EMBROIDERY' "$ROOT/admin-ribbons.css"
          grep -q '40.6.34 — AETHER SINGLE STAGE 16:9' "$ROOT/admin-ribbons.css"
          grep -q '"engine": "38.15.11"' "$ROOT/build.json"
          grep -q '"build": "40.6.35"' "$ROOT/build.json"
          printf '5c4d61e9410d4a701372e2d30640d6523938dfe603f65902d493b354c5f2e7b2  %s\n' "$ROOT/assets/aether/aether-observatory-background-406032.webp" | sha256sum -c -
          printf '2620262676958c0e4c10f6f70427f353624e35cf6ed2794bea32a33bb13cf87d  %s\n' "$ROOT/js/aether.js" | sha256sum -c -
          test -f "$ZIP"
          test -f "$SHA"
          (cd "$(dirname "$ZIP")" && sha256sum -c "$(basename "$SHA")")
          git diff --check
          python3 - <<'PY'
          from zipfile import ZipFile
          p='coordination/inter_ai_dialogues/agent_crypto/AGENT_CRYPTO_BUILD_40_6_35_AETHER_LIVE_EMBROIDERY_BACKGROUND_FIRST_UI_CLEAN_UPLOAD_7_FILES.zip'
          with ZipFile(p) as z:
              files=[n for n in z.namelist() if not n.endswith('/')]
              assert len(files)==7, files
              assert z.testzip() is None
          print('40.6.35 ZIP 7 files PASS')
          PY

      - name: Commit and publish 40.6.35
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Seven Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/agent_crypto_erith_ia/administrator/admin-ribbons.css \
                  public/agent_crypto_erith_ia/administrator/index.html \
                  public/agent_crypto_erith_ia/administrator/build.json \
                  public/agent_crypto_erith_ia/administrator/administrator-version.json \
                  public/agent_crypto_erith_ia/administrator/version.json \
                  public/agent_crypto_erith_ia/administrator/RELEASE_40_6_35.md \
                  coordination/inter_ai_dialogues/agent_crypto/AGENT_CRYPTO_BUILD_40_6_35_AETHER_LIVE_EMBROIDERY_BACKGROUND_FIRST_UI_CLEAN_UPLOAD_7_FILES.zip \
                  coordination/inter_ai_dialogues/agent_crypto/AGENT_CRYPTO_BUILD_40_6_35_AETHER_LIVE_EMBROIDERY_BACKGROUND_FIRST_UI_CLEAN_UPLOAD_7_FILES.zip.sha256
          git commit -m "feat(agent-crypto): embroider live Aether UI over artwork 40.6.35"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Upload clean ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: AGENT_CRYPTO_BUILD_40_6_35_AETHER_LIVE_EMBROIDERY_BACKGROUND_FIRST_UI_CLEAN_UPLOAD_7_FILES
          path: coordination/inter_ai_dialogues/agent_crypto/AGENT_CRYPTO_BUILD_40_6_35_AETHER_LIVE_EMBROIDERY_BACKGROUND_FIRST_UI_CLEAN_UPLOAD_7_FILES.zip
          if-no-files-found: error
          compression-level: 0
