name: Agent-Crypto 40.4.229 Market Reading Depth Geometry Lock

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/agent-crypto-40-4-229-market-reading-depth-geometry-lock.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Parent guard
        shell: bash
        run: |
          git fetch origin main
          git checkout main
          git pull --ff-only origin main
          echo "BASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          python3 - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('public/agent_crypto_erith_ia/administrator/version.json').read_text(encoding='utf-8'))
          assert m['build']=='40.4.228', m['build']
          assert m['engine']['reference_build']=='38.15.11'
          assert m['engine']['status']=='protected'
          print('PARENT_PASS 40.4.228 / Market Core 38.15.11 PROTECTED')
          PY

      - name: Apply bounded Reading Depth geometry patch
        shell: bash
        run: |
          python3 .github/scripts/aether_40_4_229_market_reading_depth_geometry_patch.py
          node --check public/agent_crypto_erith_ia/administrator/js/market-reading-depth.js
          git diff --check

      - name: Canonical release driver
        shell: bash
        run: |
          cat >/tmp/contract.json <<'JSON'
          {"state":"active","scope":"market_reading_depth_viewport_geometry","reproduced_from_user_screenshots":true,"prior_geometry_debt_reused":true,"grid_stretch_removed":true,"viewport_body_cap":true,"internal_scroll_only_when_needed":true,"build_token_aligned":true,"window_manager_changed":false,"renderer_changed":false,"data_changed":false,"history_changed":false,"sources_changed":false,"math_changed":false,"parallel_markets_changed":false,"metals_runtime_changed":false,"crypto_runtime_changed":false,"market_core_modified":false,"new_timer":false,"new_observer":false,"new_fetch":false,"new_websocket":false,"new_scheduler":false}
          JSON
          python3 .github/scripts/agent_crypto_release_driver.py --build 40.4.229 --parent 40.4.228 --release "MARKET READING DEPTH · VIEWPORT GEOMETRY LOCK" --status market_reading_depth_viewport_geometry_404229 --contract-key market_reading_depth_viewport_geometry_404229 --contract-json /tmp/contract.json --lineage-note "40.4.229 Market Reading Depth viewport geometry lock: reproduced oversized deep-reading subsections are content-height, no longer grid-stretched, and the expanded body is viewport-bounded with internal overflow; build/cache identity aligned; Window Manager, data, histories, sources, Math, Crypto, Metals, Parallel Markets and Market Core unchanged"

      - name: Version Truth and scope proof
        shell: bash
        run: |
          node --check public/agent_crypto_erith_ia/administrator/js/market-reading-depth.js
          node --check public/agent_crypto_erith_ia/administrator/app.js
          node --check public/agent_crypto_erith_ia/administrator/js/app.js
          python3 .github/scripts/agent_crypto_version_truth_guard.py --expected-build 40.4.229 --expected-release "MARKET READING DEPTH · VIEWPORT GEOMETRY LOCK"
          python3 - <<'PY'
          from pathlib import Path
          import json, subprocess
          base=Path('public/agent_crypto_erith_ia/administrator')
          css=(base/'market-reading-depth.css').read_text(encoding='utf-8')
          js=(base/'js/market-reading-depth.js').read_text(encoding='utf-8')
          idx=(base/'index.html').read_text(encoding='utf-8')
          m=json.loads((base/'version.json').read_text(encoding='utf-8'))
          assert m['build']=='40.4.229' and m['parent_build']=='40.4.228'
          assert m['engine']['reference_build']=='38.15.11' and m['engine']['status']=='protected'
          assert 'const BUILD = "40.4.229";' in js
          assert '40.4.229 — MARKET READING DEPTH VIEWPORT GEOMETRY LOCK' in css
          assert 'align-items:start!important' in css
          assert 'max-height:min(620px,62vh)!important' in css
          assert './market-reading-depth.css?v=40.4.229' in idx
          assert './js/market-reading-depth.js?v=administrator-build-40.4.229' in idx
          allowed={
            'public/agent_crypto_erith_ia/administrator/market-reading-depth.css',
            'public/agent_crypto_erith_ia/administrator/js/market-reading-depth.js',
            'public/agent_crypto_erith_ia/administrator/index.html',
            'public/agent_crypto_erith_ia/administrator/js/views/system-presentation.js',
            'public/agent_crypto_erith_ia/administrator/app.js',
            'public/agent_crypto_erith_ia/administrator/js/app.js',
            'public/agent_crypto_erith_ia/administrator/version.json',
            'public/agent_crypto_erith_ia/administrator/administrator-version.json',
            'public/agent_crypto_erith_ia/administrator/build.json'
          }
          lines=subprocess.check_output(['git','status','--porcelain','-uall'],text=True).splitlines()
          paths={line[3:] for line in lines}
          required={
            'public/agent_crypto_erith_ia/administrator/market-reading-depth.css',
            'public/agent_crypto_erith_ia/administrator/js/market-reading-depth.js',
            'public/agent_crypto_erith_ia/administrator/version.json'
          }
          if not required<=paths: raise SystemExit(f'required diff missing: {sorted(paths)}')
          if paths-allowed: raise SystemExit(f'out of scope: {sorted(paths-allowed)}')
          print('SCOPE_PASS',sorted(paths))
          PY
          git diff --check

      - name: Commit canonical 40.4.229
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/agent_crypto_erith_ia/administrator/market-reading-depth.css public/agent_crypto_erith_ia/administrator/js/market-reading-depth.js public/agent_crypto_erith_ia/administrator/index.html public/agent_crypto_erith_ia/administrator/js/views/system-presentation.js public/agent_crypto_erith_ia/administrator/app.js public/agent_crypto_erith_ia/administrator/js/app.js public/agent_crypto_erith_ia/administrator/version.json public/agent_crypto_erith_ia/administrator/administrator-version.json public/agent_crypto_erith_ia/administrator/build.json
          git commit -m "agent-crypto: build 40.4.229 lock Reading Depth viewport geometry"
          echo "RELEASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          git push origin main

      - name: Package changed files only
        shell: bash
        run: |
          PKG=/tmp/agent-crypto-40.4.229
          mkdir -p "$PKG"
          git diff --name-only "$BASE_SHA" "$RELEASE_SHA" > /tmp/changed.txt
          while IFS= read -r p; do mkdir -p "$PKG/$(dirname "$p")"; cp "$p" "$PKG/$p"; done < /tmp/changed.txt
          {
            echo "# Agent-Crypto 40.4.229 — fichiers modifiés"
            echo
            echo "Release: MARKET READING DEPTH · VIEWPORT GEOMETRY LOCK"
            echo "Parent: 40.4.228"
            echo "Market Core: 38.15.11 PROTECTED"
            echo "Canonical commit: $RELEASE_SHA"
            echo
            echo "## Fichiers"
            sed 's/^/- `/' /tmp/changed.txt | sed 's/$/`/'
            echo
            echo "## Verrous"
            echo "- Reading Depth cards use content height; no paired-grid vertical stretching."
            echo "- Expanded Reading Depth body is viewport-bounded and scrolls internally only when needed."
            echo "- Window Manager unchanged."
            echo "- Renderer, data, histories, sources and Math unchanged."
            echo "- Crypto / Metals / Parallel Markets runtimes unchanged."
            echo "- No new timer / observer / fetch / WebSocket / scheduler."
            echo "- Market Core unchanged."
          } > "$PKG/FILES_CHANGED_40.4.229.md"
          (cd "$PKG" && zip -qr "$GITHUB_WORKSPACE/AGENT_CRYPTO_BUILD_40_4_229_MARKET_READING_DEPTH_VIEWPORT_GEOMETRY_CHANGED_FILES.zip" .)
          sha256sum AGENT_CRYPTO_BUILD_40_4_229_MARKET_READING_DEPTH_VIEWPORT_GEOMETRY_CHANGED_FILES.zip
          unzip -l AGENT_CRYPTO_BUILD_40_4_229_MARKET_READING_DEPTH_VIEWPORT_GEOMETRY_CHANGED_FILES.zip

      - name: Upload differential ZIP
        uses: actions/upload-artifact@v4
        with:
          name: AGENT_CRYPTO_BUILD_40_4_229_MARKET_READING_DEPTH_VIEWPORT_GEOMETRY_CHANGED_FILES
          path: AGENT_CRYPTO_BUILD_40_4_229_MARKET_READING_DEPTH_VIEWPORT_GEOMETRY_CHANGED_FILES.zip
          include-hidden-files: true
