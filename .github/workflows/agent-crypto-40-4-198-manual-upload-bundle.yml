name: Agent-Crypto 40.4.198 Manual Upload Bundle

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/agent-crypto-40-4-198-manual-upload-bundle.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact 40.4.198 release
        uses: actions/checkout@v4
        with:
          ref: 53ea62ce25108407f7c77d8103ffff8983a53ef9

      - name: Build clean manual upload ZIP
        shell: bash
        run: |
          set -euo pipefail
          ROOT='AGENT_CRYPTO_BUILD_40_4_198_LAZY_COMMODITY_HISTORY_CLEAN_UPLOAD'
          mkdir -p "$ROOT"

          files=(
            '.github/workflows/atlas-public-commodity-historical-depth.yml'
            'public/agent_crypto_erith_ia/administrator/app.js'
            'public/agent_crypto_erith_ia/administrator/build.json'
            'public/agent_crypto_erith_ia/administrator/index.html'
            'public/agent_crypto_erith_ia/administrator/js/market-stack.js'
            'public/agent_crypto_erith_ia/administrator/js/parallel-markets.js'
            'public/agent_crypto_erith_ia/administrator/js/version-truth.js'
            'public/agent_crypto_erith_ia/data/energy/history/5a.json'
            'public/agent_crypto_erith_ia/data/energy/history/10a.json'
            'public/agent_crypto_erith_ia/data/energy/history/max.json'
            'public/agent_crypto_erith_ia/data/energy/history/status.json'
            'public/agent_crypto_erith_ia/data/metals/history_long/5a.json'
            'public/agent_crypto_erith_ia/data/metals/history_long/10a.json'
            'public/agent_crypto_erith_ia/data/metals/history_long/max.json'
            'public/agent_crypto_erith_ia/data/metals/history_long/status.json'
            'public/agent_crypto_erith_ia/tools/collect_public_commodity_historical_depth.py'
          )

          for f in "${files[@]}"; do
            test -f "$f"
            mkdir -p "$ROOT/$(dirname "$f")"
            cp "$f" "$ROOT/$f"
          done

          cat > "$ROOT/UPLOAD_INSTRUCTIONS.txt" <<'EOF'
          AGENT-CRYPTO 40.4.198 · MANUAL CLEAN UPLOAD

          Source commit:
          53ea62ce25108407f7c77d8103ffff8983a53ef9

          Engine protected:
          Market Core 38.15.11

          Purpose:
          - Lazy historical depth 5a / 10a / MAX for Energy and Metals.
          - Version Truth reader.
          - No historical long payload at boot.
          - Futures-continuous Source Truth preserved for Metals/Energy long history.

          Manual upload:
          1. Extract this ZIP locally.
          2. Open the extracted root folder.
          3. Upload/replace the files in the repository while PRESERVING THE EXACT PATHS.
          4. Do not upload any __pycache__, release scripts or diagnostics.
          5. Commit the upload, then wait for GitHub Pages deployment.

          Important:
          This is a delta bundle relative to 40.4.197. It is not a full repository backup.
          EOF

          python - <<'PY'
          from pathlib import Path
          import hashlib
          root=Path('AGENT_CRYPTO_BUILD_40_4_198_LAZY_COMMODITY_HISTORY_CLEAN_UPLOAD')
          rows=[]
          for p in sorted(x for x in root.rglob('*') if x.is_file() and x.name != 'SHA256SUMS.txt'):
              h=hashlib.sha256(p.read_bytes()).hexdigest()
              rows.append(f'{h}  {p.relative_to(root).as_posix()}')
          (root/'SHA256SUMS.txt').write_text('\n'.join(rows)+'\n', encoding='utf-8')
          PY

          zip -r -9 "${ROOT}.zip" "$ROOT" >/dev/null
          ls -lh "${ROOT}.zip"

      - name: Upload clean bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: AGENT_CRYPTO_BUILD_40_4_198_LAZY_COMMODITY_HISTORY_CLEAN_UPLOAD
          path: AGENT_CRYPTO_BUILD_40_4_198_LAZY_COMMODITY_HISTORY_CLEAN_UPLOAD.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
