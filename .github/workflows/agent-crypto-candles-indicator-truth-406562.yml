name: Agent-Crypto 40.6.562 Candles Indicator Truth

on:
  pull_request:
    paths:
      - "public/agent_crypto_erith_ia/administrator/js/market-microscope-candles-406498.js"
      - "public/agent_crypto_erith_ia/administrator/index.html"
      - "public/agent_crypto_erith_ia/administrator/index-40.6.562.html"
      - "public/agent_crypto_erith_ia/administrator/build.json"
      - "public/agent_crypto_erith_ia/administrator/CANDLES_INDICATOR_TRUTH_40.6.562.md"
      - ".github/scripts/agent_crypto_candles_indicator_truth_guard_406562.py"
      - ".github/workflows/agent-crypto-candles-indicator-truth-406562.yml"
  push:
    branches: [main]
    paths:
      - "public/agent_crypto_erith_ia/administrator/js/market-microscope-candles-406498.js"
      - "public/agent_crypto_erith_ia/administrator/index.html"
      - "public/agent_crypto_erith_ia/administrator/index-40.6.562.html"
      - "public/agent_crypto_erith_ia/administrator/build.json"
      - "public/agent_crypto_erith_ia/administrator/CANDLES_INDICATOR_TRUTH_40.6.562.md"
      - ".github/scripts/agent_crypto_candles_indicator_truth_guard_406562.py"
      - ".github/workflows/agent-crypto-candles-indicator-truth-406562.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JavaScript syntax
        run: node --check public/agent_crypto_erith_ia/administrator/js/market-microscope-candles-406498.js

      - name: Deterministic indicator self-test
        run: |
          node - <<'NODE'
          require('./public/agent_crypto_erith_ia/administrator/js/market-microscope-candles-406498.js');
          const r=global.AgentCryptoMarketMicroscope.self_test();
          console.log(JSON.stringify(r,null,2));
          const c=r.checks||{};
          if(
            !r.pass ||
            !c.ma_ema_full_history_projection ||
            !c.supertrend_reference_10x3 ||
            !c.bollinger_reference_20x2 ||
            !c.sar_reference_002_020 ||
            !c.vwap_reference_window ||
            !c.volume_profile_reference_24_bins ||
            !c.support_resistance_last_levels_clear_when_disabled ||
            !c.support_resistance_distance_signature ||
            !c.support_resistance_historical_reference_label ||
            !c.vwap_label_window
          ) process.exit(1);
          NODE

      - name: Indicator truth guard
        run: python .github/scripts/agent_crypto_candles_indicator_truth_guard_406562.py

      - name: Version truth
        run: python .github/scripts/agent_crypto_version_truth_guard_compat.py

      - name: Package compact patch
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, zipfile
          root=Path("public/agent_crypto_erith_ia/administrator")
          out=Path("AGENT_CRYPTO_ADMINISTRATOR_40.6.562_INDICATOR_TRUTH_PATCH.zip")
          files=[
            root/"index.html",
            root/"index-40.6.562.html",
            root/"build.json",
            root/"js/market-microscope-candles-406498.js",
            root/"CANDLES_INDICATOR_TRUTH_40.6.562.md",
          ]
          with zipfile.ZipFile(out,"w",zipfile.ZIP_DEFLATED) as z:
            for p in files:
              z.write(p,p.as_posix())
          h=hashlib.sha256(out.read_bytes()).hexdigest()
          Path("INDICATOR_TRUTH_40.6.562_SHA256.txt").write_text(f"{h}  {out.name}\n",encoding="utf-8")
          print(out, out.stat().st_size, h)
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: AGENT_CRYPTO_ADMINISTRATOR_40.6.562_INDICATOR_TRUTH_PATCH
          path: |
            AGENT_CRYPTO_ADMINISTRATOR_40.6.562_INDICATOR_TRUTH_PATCH.zip
            INDICATOR_TRUTH_40.6.562_SHA256.txt
