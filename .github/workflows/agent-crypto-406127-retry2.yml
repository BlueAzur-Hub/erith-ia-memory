name: Agent-Crypto 40.6.127 retry2 publish

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/agent-crypto-406127-retry2.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply verify and publish 40.6.127
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from datetime import datetime, timezone
          import json, shutil
          root=Path('public/agent_crypto_erith_ia/administrator')
          guard=root/'js/dex-freshness-guard.js'
          manifest=root/'build.json'
          src=root/'releases/40.6.126'
          dst=root/'releases/40.6.127'
          d=json.loads(manifest.read_text(encoding='utf-8'))
          if d.get('build')!='40.6.126' or d.get('engine')!='38.15.11': raise SystemExit('STOP build drift')
          t=guard.read_text(encoding='utf-8')
          if 'const RELEASE = "40.6.111";' not in t: raise SystemExit('STOP release marker drift')
          if 'provider.observed_at,\n      provider.fetched_at,' not in t: raise SystemExit('STOP provider contract drift')
          if 'provider?.meta?.observed_at,\n      provider?.meta?.fetched_at,' not in t: raise SystemExit('STOP meta contract drift')
          t=t.replace('const RELEASE = "40.6.111";','const RELEASE = "40.6.127";',1)
          t=t.replace('      provider.observed_at,\n      provider.fetched_at,','      provider.observed_at,\n      provider.observed_at_utc,\n      provider.fetched_at,',1)
          t=t.replace('      provider?.meta?.observed_at,\n      provider?.meta?.fetched_at,','      provider?.meta?.observed_at,\n      provider?.meta?.observed_at_utc,\n      provider?.meta?.fetched_at,',1)
          old='{ asset: "BTC", dexscreener: { status: "ok", updated_at: fresh }, geckoterminal: { status: "ok", updated_at: fresh }, identity: { atlas_eligible: true } },\n        { asset: "ETH", dexscreener: { status: "ok", updated_at: stale }, geckoterminal: { status: "ok", updated_at: fresh }, identity: { atlas_eligible: true } },'
          new='{ asset: "BTC", dexscreener: { status: "ok", observed_at_utc: fresh }, geckoterminal: { status: "ok", observed_at_utc: fresh }, identity: { atlas_eligible: true } },\n        { asset: "ETH", dexscreener: { status: "ok", observed_at_utc: stale }, geckoterminal: { status: "ok", observed_at_utc: fresh }, identity: { atlas_eligible: true } },'
          if old not in t: raise SystemExit('STOP self-test drift')
          guard.write_text(t.replace(old,new,1),encoding='utf-8')
          if dst.exists(): shutil.rmtree(dst)
          shutil.copytree(src,dst)
          idx=dst/'index.html'; idx.write_text(idx.read_text(encoding='utf-8').replace('40.6.126','40.6.127'),encoding='utf-8')
          d.update({'build':'40.6.127','release':'DEX FRESHNESS CONTRACT LOCK','status':'dex_freshness_contract_lock_406127','parent_build':'40.6.126','asset_token':'market-core-v2.0-alpha-build-40.6.127','administrator_build':'40.6.127','build_label':'Build 40.6.127 · Administrator','release_status':'dex_freshness_contract_lock_406127','entry':'./releases/40.6.127/','released_at':datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z'),'market_core_modified':False,'web_classic_modified':False,'aether_modified':False,'atlas_current_modified':False,'oracle_modified':False,'lecture_technique_modified':False,'strategy_a_modified':False,'automatic_order':False,'real_order':False,'new_recurring_timer':False,'new_observer':False,'new_storage_owner':False})
          d.setdefault('dex_freshness_fail_closed',{}).update({'repaired_in':'40.6.127','runtime_patch':'js/dex-freshness-guard.js','fallback_max_age_seconds':600,'observed_at_utc_supported':True,'source_intelligence_contract_aligned':True,'unknown_freshness_is_eligible':False,'stale_observation_is_eligible':False,'canonical_price_changed':False,'fetch':False,'recurring_timer':False,'observer':False,'storage_write':False})
          d['dex_freshness_contract_lock']={'introduced_in':'40.6.127','scope':'align DEX freshness parser with Source Intelligence observed_at_utc without weakening fail-closed semantics','runtime_patch':'js/dex-freshness-guard.js','source_contract':'js/views/private-backend-sources.js','accepted_utc_field':'observed_at_utc','accepted_meta_utc_field':'meta.observed_at_utc','threshold_seconds_unchanged':600,'fresh_observation_keeps_atlas_eligibility':True,'stale_or_missing_freshness_remains_fail_closed':True,'self_test_observed_at_utc':True,'market_core_changed':False,'graph_changed':False,'lecture_technique_changed':False,'aether_changed':False,'oracle_changed':False,'atlas_current_algorithm_changed':False,'strategy_a_changed':False,'tradus_changed':False,'canonical_price_changed':False,'trading_changed':False,'wallet_changed':False,'fetch':False,'recurring_timer':False,'observer':False,'storage_write':False,'firefox_terrain_proof':'pending: Sources/DEX diagnostics must show fresh observed_at_utc without FRESHNESS_UNKNOWN'}
          lineage=list(d.get('recent_validated_lineage') or [])
          if '40.6.127 DEX FRESHNESS CONTRACT LOCK' not in lineage: lineage.append('40.6.127 DEX FRESHNESS CONTRACT LOCK')
          d['recent_validated_lineage']=lineage
          d.setdefault('history',{}).update({'authority':'git','previous_full_manifest_build':'40.6.126','do_not_duplicate_release_history_in_active_manifest':True})
          manifest.write_text(json.dumps(d,ensure_ascii=False,separators=(',',':'))+'\n',encoding='utf-8')
          PY
          ROOT='public/agent_crypto_erith_ia/administrator'
          node --check "$ROOT/js/dex-freshness-guard.js"
          grep -F 'provider.observed_at_utc' "$ROOT/js/dex-freshness-guard.js"
          grep -F 'provider?.meta?.observed_at_utc' "$ROOT/js/dex-freshness-guard.js"
          grep -F 'observed_at_utc: fresh' "$ROOT/js/dex-freshness-guard.js"
          grep -F 'content="40.6.127"' "$ROOT/releases/40.6.127/index.html"
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('public/agent_crypto_erith_ia/administrator/build.json').read_text(encoding='utf-8'))
          assert d['build']=='40.6.127' and d['parent_build']=='40.6.126' and d['engine']=='38.15.11'
          assert d['dex_freshness_contract_lock']['threshold_seconds_unchanged']==600
          print('40.6.127 PASS')
          PY
          git config user.name 'Aether Release'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/agent_crypto_erith_ia/administrator/js/dex-freshness-guard.js public/agent_crypto_erith_ia/administrator/build.json public/agent_crypto_erith_ia/administrator/releases/40.6.127
          git commit -m 'release(agent-crypto): publish 40.6.127 dex freshness contract lock'
          git push origin HEAD:main
