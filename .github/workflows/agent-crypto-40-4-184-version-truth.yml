name: Agent-Crypto 40.4.184 Version Truth Repair

on:
  push:
    paths:
      - '.github/workflows/agent-crypto-40-4-184-version-truth.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: agent-crypto-40-4-184-version-truth
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repair 40.4.184 publication identity
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, re
          from datetime import datetime, timezone

          root = Path('public/agent_crypto_erith_ia/administrator')
          build = '40.4.184'
          parent = '40.4.183'
          release = 'VERSION TRUTH · MANIFEST HASH SYNC · 40.4.183 CYCLER PRESERVED'
          stamp = datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z')

          def sub_one(text, pattern, repl, label, flags=0):
              out, n = re.subn(pattern, repl, text, count=1, flags=flags)
              if n != 1:
                  raise SystemExit(f'{label}: expected 1 match, got {n}')
              return out

          def sub_optional_one(text, pattern, repl, label, flags=0):
              out, n = re.subn(pattern, repl, text, count=1, flags=flags)
              if n > 1:
                  raise SystemExit(f'{label}: expected <=1 match, got {n}')
              return out

          def sha256(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()

          # Shared runtime: loaded-build owner used by the publication verifier.
          p = root / 'app.js'
          s = p.read_text(encoding='utf-8')
          s = sub_one(
              s,
              r'^const ATLAS_BUILD = "40\.4\.\d+";',
              f'const ATLAS_BUILD = "{build}";',
              'ATLAS_BUILD',
              re.M
          )
          s = sub_optional_one(
              s,
              r'^const ATLAS_ASSET_TOKEN = "market-core-v2\.0-alpha-build-40\.4\.\d+";',
              f'const ATLAS_ASSET_TOKEN = "market-core-v2.0-alpha-build-{build}";',
              'ATLAS_ASSET_TOKEN',
              re.M
          )
          p.write_text(s, encoding='utf-8')

          # Administrator runtime identity.
          p = root / 'js/app.js'
          s = p.read_text(encoding='utf-8')
          s = sub_one(
              s,
              r'^  const ADMIN_BUILD = "40\.4\.\d+";',
              f'  const ADMIN_BUILD = "{build}";',
              'ADMIN_BUILD',
              re.M
          )
          s = sub_one(
              s,
              r'^  const ADMIN_RELEASE = ".*?";',
              f'  const ADMIN_RELEASE = "{release}";',
              'ADMIN_RELEASE',
              re.M
          )
          p.write_text(s, encoding='utf-8')

          # Preserve 40.4.183 market cycler behavior, advance only its identity.
          p = root / 'js/market-stack.js'
          s = p.read_text(encoding='utf-8')
          s = sub_one(
              s,
              r'^  const BUILD = "40\.4\.\d+";',
              f'  const BUILD = "{build}";',
              'market-stack BUILD',
              re.M
          )
          p.write_text(s, encoding='utf-8')

          # HTML truth + cache identity.
          p = root / 'index.html'
          s = p.read_text(encoding='utf-8')
          s = sub_one(s, r'<meta name="atlas-build" content="40\.4\.\d+" />',
                      f'<meta name="atlas-build" content="{build}" />', 'index atlas build')
          s = sub_one(s, r'<meta name="administrator-build" content="40\.4\.\d+" />',
                      f'<meta name="administrator-build" content="{build}" />', 'index admin build')
          s = sub_one(s, r'<meta name="administrator-revision" content="[^"]+" />',
                      '<meta name="administrator-revision" content="V3" />', 'index revision')
          s = sub_one(s, r'<meta name="administrator-release" content="[^"]+" />',
                      f'<meta name="administrator-release" content="{release}" />', 'index release')
          s = sub_one(s, r'<meta name="atlas-asset-token" content="market-core-v2\.0-alpha-build-40\.4\.\d+" />',
                      f'<meta name="atlas-asset-token" content="market-core-v2.0-alpha-build-{build}" />', 'index token')
          s = sub_one(s, r'<title>Agent-Crypto @erith\.IA — Build 40\.4\.\d+ · Administrator</title>',
                      f'<title>Agent-Crypto @erith.IA — Build {build} · Administrator</title>', 'index title')
          s = sub_one(
              s,
              r'<span id="footerRelease">Agent-Crypto @erith\.IA · Market Core · Build 40\.4\.\d+ · Version : Parker Lewis Can\'t Lose</span>',
              f'<span id="footerRelease">Agent-Crypto @erith.IA · Market Core · Build {build} · Version : Parker Lewis Can\'t Lose</span>',
              'footer truth'
          )

          # 40.4.183 was still asking Firefox for the 40.4.182 asset generation.
          asset_refs = [
              ('href', './market-cascade.css'),
              ('href', './parallel-markets.css'),
              ('src', './app.js'),
              ('src', './js/app.js'),
              ('src', './js/market-stack.js'),
              ('src', './js/parallel-markets.js'),
          ]
          for attr, asset in asset_refs:
              pattern = rf'({attr}="{re.escape(asset)}\?v=administrator-build-)[^"]+(")'
              replacement = rf'\g<1>{build}\g<2>'
              s2, n = re.subn(pattern, replacement, s)
              if n != 1:
                  raise SystemExit(f'cache token {asset}: expected 1 match, got {n}')
              s = s2
          p.write_text(s, encoding='utf-8')

          # Canonical version manifest.
          vp = root / 'version.json'
          v = json.loads(vp.read_text(encoding='utf-8'))
          v.update(
              release=release,
              build=build,
              asset_token=f'market-core-v2.0-alpha-build-{build}',
              status='version_truth_manifest_hash_sync_404184',
              prepared_at=stamp,
              published_at=stamp,
              parent_build=parent,
          )
          note = ('40.4.184 version truth: loaded runtime, cache identities, footer and '
                  'manifest payload hashes synchronized; 40.4.183 single physical market cycler preserved.')
          if note not in v.get('lineage', ''):
              v['lineage'] = v.get('lineage', '') + ' → ' + note

          # Same cure as 40.4.149: hashes must describe the payload actually published.
          files = v.setdefault('files', {})
          hash_owners = (
              'index.html',
              'app.js',
              'js/app.js',
              'js/market-stack.js',
              'market-cascade.css',
              'parallel-markets.css',
              'js/parallel-markets.js',
          )
          for rel in hash_owners:
              if rel in files:
                  files[rel] = sha256(root / rel)
          vp.write_text(json.dumps(v, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          # Administrator mirror: one current build authority.
          ap = root / 'administrator-version.json'
          av = json.loads(ap.read_text(encoding='utf-8'))
          for key in ('build', 'administrator_build', 'primary_build', 'global_versioning'):
              if key in av:
                  av[key] = build
          av['build'] = build
          av['administrator_build'] = build
          av['global_versioning'] = build
          av['build_label'] = f'Build {build}'
          av['release'] = release
          av['status'] = 'version_truth_manifest_hash_sync_404184'
          av['release_status'] = 'Publication identity synchronized; 40.4.183 market cycler behavior preserved.'
          av['prepared_at'] = stamp
          av['published_at'] = stamp
          av['timestamp'] = stamp
          if 'parent_build' in av:
              av['parent_build'] = parent
          if 'asset_token' in av:
              av['asset_token'] = f'market-core-v2.0-alpha-build-{build}'
          ap.write_text(json.dumps(av, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          # Static proof.
          idx = (root/'index.html').read_text(encoding='utf-8')
          app = (root/'app.js').read_text(encoding='utf-8')
          admin = (root/'js/app.js').read_text(encoding='utf-8')
          stack = (root/'js/market-stack.js').read_text(encoding='utf-8')
          v = json.loads((root/'version.json').read_text(encoding='utf-8'))
          av = json.loads((root/'administrator-version.json').read_text(encoding='utf-8'))

          assert f'const ATLAS_BUILD = "{build}";' in app
          assert f'const ADMIN_BUILD = "{build}";' in admin
          assert f'const BUILD = "{build}";' in stack
          assert f'Build {build} · Version : Parker Lewis Can\'t Lose' in idx
          assert '<meta name="atlas-engine-build" content="38.15.11" />' in idx
          assert 'const ENGINE_BUILD = "38.15.11";' in admin
          assert v['build'] == build
          assert v['parent_build'] == parent
          assert v['engine']['reference_build'] == '38.15.11'
          assert av['build'] == build
          assert av['global_versioning'] == build

          for rel in hash_owners:
              if rel in v['files']:
                  assert v['files'][rel] == sha256(root/rel), rel

          for asset in (
              'market-cascade.css',
              'parallel-markets.css',
              'app.js',
              'js/app.js',
              'js/market-stack.js',
              'js/parallel-markets.js',
          ):
              assert f'{asset}?v=administrator-build-{build}' in idx, asset

          print('40.4.184 VERSION TRUTH STATIC PASS')
          PY

      - name: JavaScript syntax gate
        run: |
          node --check public/agent_crypto_erith_ia/administrator/app.js
          node --check public/agent_crypto_erith_ia/administrator/js/app.js
          node --check public/agent_crypto_erith_ia/administrator/js/market-stack.js

      - name: Commit canonical repair and retire one-shot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/agent-crypto-40-4-184-version-truth.yml
          git add public/agent_crypto_erith_ia/administrator/index.html \
                  public/agent_crypto_erith_ia/administrator/app.js \
                  public/agent_crypto_erith_ia/administrator/js/app.js \
                  public/agent_crypto_erith_ia/administrator/js/market-stack.js \
                  public/agent_crypto_erith_ia/administrator/version.json \
                  public/agent_crypto_erith_ia/administrator/administrator-version.json
          git commit -m 'fix Agent-Crypto 40.4.184 restore version truth and cache identity'

          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 3))
          done
          exit 1
