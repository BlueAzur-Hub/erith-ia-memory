name: Agent-Crypto 40.4.265 Auto Paper Runner V1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/agent-crypto-404265-auto-paper-runner.yml'

permissions:
  contents: write

concurrency:
  group: agent-crypto-404265-auto-paper-runner
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Rebase on current main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main

      - name: Synchronize System presentation tokens
        shell: bash
        run: python .github/scripts/agent_crypto_404265_sync_system_tokens.py

      - name: Build and validate 40.4.265
        shell: bash
        run: |
          set +e
          python .github/scripts/agent_crypto_404265_auto_paper_runner.py > /tmp/agent_crypto_404265.log 2>&1
          code=$?
          cat /tmp/agent_crypto_404265.log
          if [ "$code" -ne 0 ]; then
            mkdir -p coordination/inter_ai_dialogues/agent_crypto
            cp /tmp/agent_crypto_404265.log coordination/inter_ai_dialogues/agent_crypto/AGENT_CRYPTO_40_4_265_FAILURE_DIAGNOSTIC.txt
            exit "$code"
          fi
          unzip -t coordination/inter_ai_dialogues/agent_crypto/AGENT_CRYPTO_40_4_265_STRATEGY_A_AUTO_PAPER_RUNNER_V1.zip

      - name: Publish diagnostic only if build failed
        if: failure()
        shell: bash
        run: |
          if [ ! -f coordination/inter_ai_dialogues/agent_crypto/AGENT_CRYPTO_40_4_265_FAILURE_DIAGNOSTIC.txt ]; then exit 0; fi
          cp coordination/inter_ai_dialogues/agent_crypto/AGENT_CRYPTO_40_4_265_FAILURE_DIAGNOSTIC.txt /tmp/AGENT_CRYPTO_40_4_265_FAILURE_DIAGNOSTIC.txt
          git reset --hard HEAD
          cp /tmp/AGENT_CRYPTO_40_4_265_FAILURE_DIAGNOSTIC.txt coordination/inter_ai_dialogues/agent_crypto/AGENT_CRYPTO_40_4_265_FAILURE_DIAGNOSTIC.txt
          git add coordination/inter_ai_dialogues/agent_crypto/AGENT_CRYPTO_40_4_265_FAILURE_DIAGNOSTIC.txt
          git commit -m 'diagnostic: capture Agent-Crypto 40.4.265 release failure'
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Commit release and retire temporary tooling
        if: success()
        shell: bash
        run: |
          git rm .github/workflows/agent-crypto-404265-auto-paper-runner.yml
          git rm .github/scripts/agent_crypto_404265_auto_paper_runner.py
          git rm .github/scripts/agent_crypto_404265_sync_system_tokens.py
          git rm -f --ignore-unmatch coordination/inter_ai_dialogues/agent_crypto/AGENT_CRYPTO_40_4_265_FAILURE_DIAGNOSTIC.txt
          git add public/agent_crypto_erith_ia/administrator
          git add coordination/inter_ai_dialogues/agent_crypto/AGENT_CRYPTO_40_4_265_STRATEGY_A_AUTO_PAPER_RUNNER_V1.zip
          git add coordination/inter_ai_dialogues/agent_crypto/AGENT_CRYPTO_40_4_265_STRATEGY_A_AUTO_PAPER_RUNNER_V1_SHA256.txt
          git commit -m 'agent-crypto: build 40.4.265 strategy a auto paper runner v1 session-local lock'
          git pull --rebase origin main
          node --check public/agent_crypto_erith_ia/administrator/app.js
          python .github/scripts/agent_crypto_version_truth_guard.py --expected-build 40.4.265 --expected-release 'STRATEGY A · AUTO PAPER RUNNER V1 SESSION-LOCAL LOCK'
          git push origin HEAD:main

      - name: Upload differential release artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AGENT_CRYPTO_40_4_265_STRATEGY_A_AUTO_PAPER_RUNNER_V1
          path: |
            coordination/inter_ai_dialogues/agent_crypto/AGENT_CRYPTO_40_4_265_STRATEGY_A_AUTO_PAPER_RUNNER_V1.zip
            coordination/inter_ai_dialogues/agent_crypto/AGENT_CRYPTO_40_4_265_STRATEGY_A_AUTO_PAPER_RUNNER_V1_SHA256.txt
          if-no-files-found: error
          retention-days: 30
