name: Agent-Crypto Audit Remaining Versioned JS

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/agent-crypto-audit-remaining-versioned-js.yml'
      - '.github/scripts/agent_crypto_audit_remaining_versioned_js.py'

permissions:
  contents: write

concurrency:
  group: agent-crypto-audit-remaining-versioned-js
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Synchronize
        run: git pull --ff-only origin main
      - name: Audit remaining versioned JS siblings
        run: python .github/scripts/agent_crypto_audit_remaining_versioned_js.py
      - name: Retire one-shot audit tooling
        run: |
          set -euo pipefail
          git config user.name 'Seven Heaven Refactor'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/agent-crypto-audit-remaining-versioned-js.yml
          git rm -f .github/scripts/agent_crypto_audit_remaining_versioned_js.py
          git commit -m 'chore(agent-crypto): retire versioned JS audit tooling'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo 'Rebase conflict; refusing force-push'
              exit 1
            fi
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
