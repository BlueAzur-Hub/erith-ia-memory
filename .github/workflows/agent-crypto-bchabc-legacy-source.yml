name: Agent Crypto Top25 Authenticated BCHABC Pre-Rename Spot
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/agent-crypto-bchabc-legacy-source.yml'
      - 'public/agent_crypto_erith_ia/tools/archive_top25_bchabc_predecessor.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: agent-crypto-bchabc-2019-original-before-rename
  cancel-in-progress: false
jobs:
  verify-original-legacy-spot:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_TAG: crypto-top25-original-bchabc-pre-rename-2019
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify frozen BCH identity and exact original market pair
        run: |
          set -euo pipefail
          python -m py_compile public/agent_crypto_erith_ia/tools/archive_top25_bchabc_predecessor.py
          python public/agent_crypto_erith_ia/tools/archive_top25_bchabc_predecessor.py --self-test
      - name: Read ten original BCHABCUSDT 2019 source ZIPs, preserve every genuine price/volume
        run: |
          set -euo pipefail
          python public/agent_crypto_erith_ia/tools/archive_top25_bchabc_predecessor.py \
            --batch 2019-bchabc \
            --output "$RUNNER_TEMP/bchabc-legacy-original"
      - name: Validate all original Binance ZIP checksums and quote identity
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,pathlib,hashlib
          base=pathlib.Path(os.environ["RUNNER_TEMP"])/"bchabc-legacy-original"
          j=json.loads((base/"manifest.json").read_text())
          assert j["schema"]=="seven.crypto.top25-bchabc-predecessor-source.v1"
          assert j["original_market_symbol"]=="BCHABCUSDT" and j["later_market_symbol"]=="BCHUSDT"
          assert j["rename_official_time_utc"]=="2019-11-28T10:00:00Z"
          assert j["target_month_pairs"]==10 and j["no_synthetic_bars"]
          files={"manifest.json"}
          for r in j["records"]:
              assert r["pair"]=="BCHABCUSDT" and r["quote"]=="USDT" and r["no_synthetic_ohlcv"]
              assert r["month"] < "2019-11"
              if r["status"] in ("native_1m_complete","native_1m_partial","original_timestamp_quarantine"):
                  assert r["native_rows"]>0
                  for key in ("source_zip","official_checksum","sqlite"):
                      f=r[key];file=base/f["name"]
                      assert f["name"] not in files
                      assert file.stat().st_size==f["bytes"]
                      assert hashlib.sha256(file.read_bytes()).hexdigest()==f["sha256"]
                      files.add(f["name"])
                  if r["strict_utc_aligned"]:
                      assert r["native_rows"]+r["missing_1m_minutes"]==r["calendar_minutes"]
                  else:
                      assert r["excluded_from_utc_1m_calendar"]
              else: assert r["native_rows"]==0
          assert {f.name for f in base.iterdir()}==files
          print("BCHABC ORIGINAL SPOT SOURCE CERTIFIED",j["source_verified_month_pairs"],j["original_native_ohlcv_rows"])
          PY
      - name: Preserve immutable BCHABC 2019 ZIP, official CHECKSUM and native SQLite
        run: |
          set -euo pipefail
          source="$RUNNER_TEMP/bchabc-legacy-original"
          root=public/agent_crypto_erith_ia/data/historical_archive_prototype
          git fetch origin main
          for path in top250_multisource_coverage/index.json top25_historical_expansion/index.json; do
            a=$(sha256sum "$root/$path"|cut -d' ' -f1)
            b=$(git show "origin/main:$root/$path"|sha256sum|cut -d' ' -f1)
            test "$a" = "$b" || { echo "::error::Market identity source changed";exit 1; }
          done
          if gh release view "$SOURCE_TAG" --json tagName >/dev/null 2>"$RUNNER_TEMP/err.txt"; then
            mkdir -p "$RUNNER_TEMP/existing"
            gh release download "$SOURCE_TAG" --pattern manifest.json --dir "$RUNNER_TEMP/existing"
            cmp "$RUNNER_TEMP/existing/manifest.json" "$source/manifest.json" || {
              echo "::error::Previously published historical source differs";exit 1;
            }
          else
            if ! grep -Eqi 'release not found|HTTP 404|not found' "$RUNNER_TEMP/err.txt";then
              cat "$RUNNER_TEMP/err.txt";exit 1
            fi
            gh release create "$SOURCE_TAG" "$source"/* --target "$GITHUB_SHA" \
              --title "Original BCHABCUSDT Spot 2019 before official BCH rename" \
              --notes "Separate original Binance Spot BCHABCUSDT ZIP + CHECKSUM + SQLite (not relabelled as BCHUSDT). Binance 28 Nov 2019 10:00 UTC 1 BCHABC to 1 BCH official rename. Missing months and source anomalies remain explicit." \
              --latest=false
          fi
          gh release view "$SOURCE_TAG" --json assets,isDraft,url > "$RUNNER_TEMP/release.json"
          python - <<'PY'
          import json,pathlib,os
          base=pathlib.Path(os.environ["RUNNER_TEMP"])
          p=json.loads((base/"release.json").read_text())
          expected={f.name:f.stat().st_size for f in (base/"bchabc-legacy-original").iterdir()}
          actual={f["name"]:f["size"] for f in p["assets"]}
          assert not p["isDraft"] and expected==actual
          print("BCHABC ORIGINAL RELEASE",p["url"],len(actual))
          PY
      - name: Publish historical predecessor index ONLY, never silently change BCH spot history
        run: |
          set -euo pipefail
          root=public/agent_crypto_erith_ia/data/historical_archive_prototype
          file="$root/top25_historical_expansion/bchabc_pre_rename/index.json"
          for attempt in 1 2 3; do
            git fetch origin main
            a=$(sha256sum "$root/top25_historical_expansion/index.json"|cut -d' ' -f1)
            b=$(git show "origin/main:$root/top25_historical_expansion/index.json"|sha256sum|cut -d' ' -f1)
            test "$a" = "$b" || { echo "::error::Top25 frozen universe drift"; exit 1; }
            git reset --hard origin/main
            mkdir -p "$(dirname "$file")"
            cp "$RUNNER_TEMP/bchabc-legacy-original/manifest.json" "$file"
            git add -- "$file"
            git diff --cached --check
            if git diff --cached --quiet;then exit 0;fi
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Coffre: preserve authentic original BCHABCUSDT before BCH market rename'
            if git push origin HEAD:main;then exit 0;fi
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bchabc-original-source-manifest
          path: ${{ runner.temp }}/bchabc-legacy-original/manifest.json
          retention-days: 30
          if-no-files-found: ignore
      - name: Refuse original Trader and historical vault mutation
        if: always()
        run: |
          git diff --exit-code -- \
            public/agent_crypto_erith_ia/trader/ \
            public/agent_crypto_erith_ia/administrator/ \
            public/agent_crypto_erith_ia/data/historical_archive_prototype/top250_multisource_coverage/ \
            public/agent_crypto_erith_ia/data/historical_archive_prototype/top5_earlier_source_vault/
