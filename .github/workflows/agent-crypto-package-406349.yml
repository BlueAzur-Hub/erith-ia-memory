name: Agent-Crypto 40.6.349 one-shot package

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/agent-crypto-package-406349.yml

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build differential ZIP and self-remove workflow
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin main
          ZIP="coordination/inter_ai_dialogues/agent_crypto/AGENT_CRYPTO_40.6.349_OPERATOR_DASHBOARD_LIGHTER_GLASS_CLEAN_MATH.zip"
          rm -f "$ZIP"
          zip -9 "$ZIP"             public/agent_crypto_erith_ia/administrator/js/operator-dashboard-406349.js             public/agent_crypto_erith_ia/administrator/index.html             public/agent_crypto_erith_ia/administrator/build.json             coordination/inter_ai_dialogues/agent_crypto/HANDOFF_40.6.349_OPERATOR_DASHBOARD_LIGHTER_GLASS_CLEAN_MATH.md
          test -s "$ZIP"
          unzip -t "$ZIP"
          rm -f .github/workflows/agent-crypto-package-406349.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$ZIP" .github/workflows/agent-crypto-package-406349.yml
          git commit -m "chore(agent-crypto): package 40.6.349 lighter glass clean Math ZIP"
          git push origin HEAD:main
