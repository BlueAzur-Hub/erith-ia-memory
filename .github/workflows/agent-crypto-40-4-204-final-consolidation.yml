name: Agent-Crypto 40.4.204 Final Consolidation

on:
  push:
    paths:
      - '.github/workflows/agent-crypto-40-4-204-final-consolidation.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: agent-crypto-40-4-204-final-consolidation
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply final consolidation
        run: python3 .github/scripts/agent_crypto_40_4_204_final_consolidation.py

      - name: Validate runtimes
        shell: bash
        run: |
          set -euo pipefail
          node --check public/agent_crypto_erith_ia/administrator/app.js
          node --check public/agent_crypto_erith_ia/administrator/js/app.js
          node --check public/agent_crypto_erith_ia/administrator/js/market-stack.js
          node --check public/agent_crypto_erith_ia/administrator/js/parallel-markets.js
          node --check public/agent_crypto_erith_ia/administrator/js/market-reading-depth.js
          python3 - <<'PY'
          from pathlib import Path
          stack=Path('public/agent_crypto_erith_ia/administrator/js/market-stack.js').read_text(encoding='utf-8')
          css=Path('public/agent_crypto_erith_ia/administrator/parallel-markets.css').read_text(encoding='utf-8')
          reading=Path('public/agent_crypto_erith_ia/administrator/js/market-reading-depth.js').read_text(encoding='utf-8')
          assert 'syncMetalsSemanticTruth404204' in stack
          assert 'domain_semantic_truth_404204:true' in stack
          assert '40.4.204 — DOMAIN SEMANTIC TRUTH' in css
          assert '#atlasParallelMarketFoundation' in css
          assert ':not(#atlasParallelDomainRailHost404189)' in css
          assert 'visibility:hidden!important' in css
          assert 'const BUILD = "40.4.204";' in reading
          assert 'setInterval(' not in reading
          assert 'new MutationObserver' not in reading
          assert 'localStorage.setItem' not in reading
          print('FINAL_SEMANTIC_LAZY_GATE_PASS')
          PY

      - name: Version Truth Guard
        run: >-
          python3 .github/scripts/agent_crypto_version_truth_guard.py
          --expected-build 40.4.204
          --expected-release 'FINAL MARKET OBSERVATORY CONSOLIDATION · DOMAIN SEMANTIC TRUTH · LAZY/MATH LOCK'

      - name: Cleanup one-shot publication debt and publish
        shell: bash
        run: |
          set -euo pipefail
          git rm -f .github/workflows/agent-crypto-40-4-199-203-market-reading-cascade.yml || true
          git rm -f .github/scripts/__pycache__/agent_crypto_40_4_198_release.cpython-312.pyc || true
          git rm -f .github/scripts/agent_crypto_40_4_204_final_consolidation.py
          git rm -f .github/workflows/agent-crypto-40-4-204-final-consolidation.yml
          git add \
            public/agent_crypto_erith_ia/administrator \
            coordination/inter_ai_dialogues/agent_crypto/AGENT_CRYPTO_FIN_DE_FIL_AETHER.md \
            coordination/inter_ai_dialogues/agent_crypto/PROMPT_REPRISE_AETHER_AGENT_CRYPTO.md \
            .github/scripts .github/workflows
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'release Agent-Crypto 40.4.204 final market observatory consolidation'
          git pull --rebase origin main
          python3 .github/scripts/agent_crypto_version_truth_guard.py \
            --expected-build 40.4.204 \
            --expected-release 'FINAL MARKET OBSERVATORY CONSOLIDATION · DOMAIN SEMANTIC TRUTH · LAZY/MATH LOCK'
          git push origin HEAD:main
