name: Agent-Crypto 40.4.218 Version Observer Retirement Release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/agent-crypto-40-4-218-version-writer-audit.yml'

permissions:
  contents: write

concurrency:
  group: agent-crypto-40-4-218-version-observer-retirement
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout canonical main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Execute bounded 40.4.218 release
        run: python .github/scripts/_tmp_agent_crypto_404218_release.py
