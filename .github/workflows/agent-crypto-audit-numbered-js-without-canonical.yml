name: Agent Crypto audit numbered JS without canonical sibling

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/agent-crypto-audit-numbered-js-without-canonical.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Synchronize
        run: git pull --ff-only origin main

      - name: Audit remaining numbered JavaScript
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json, re

          ROOT = Path('public/agent_crypto_erith_ia/administrator')
          JS = ROOT / 'js'
          ENTRY = Path('runtime-shell.html')
          VERSIONED = re.compile(r'^(?P<base>.+?)-(?P<num>\d{6,})(?P<tail>(?:-[A-Za-z0-9_]+)*)\.js$', re.I)
          HTML_JS_RE = re.compile(r'(?:src|href)=["\'](?P<ref>[^"\']+\.js(?:\?[^"\']*)?)["\']', re.I)
          JS_PATH_RE = re.compile(r'(?P<ref>(?:\.\.?/|/)?js/[A-Za-z0-9_./-]+\.js)(?:\?[^"\'`\s)]*)?', re.I)
          REL_JS_RE = re.compile(r'(?P<ref>\.\.?/[A-Za-z0-9_./-]+\.js)(?:\?[^"\'`\s)]*)?', re.I)

          def strip_query(ref): return ref.split('?',1)[0].split('#',1)[0]

          def resolve(source_rel, ref):
              clean = strip_query(ref).replace('\\','/')
              out = set()
              candidates = []
              if clean.startswith('/'):
                  candidates.append(Path(clean.lstrip('/')))
              elif clean.startswith('js/'):
                  candidates.append(Path(clean))
              elif clean.startswith('./js/'):
                  candidates.append(Path(clean[2:]))
                  try: candidates.append(((ROOT/source_rel).parent/clean).resolve().relative_to(ROOT.resolve()))
                  except Exception: pass
              elif clean.startswith(('./','../')):
                  try: candidates.append(((ROOT/source_rel).parent/clean).resolve().relative_to(ROOT.resolve()))
                  except Exception: pass
                  if clean.startswith('./'): candidates.append(Path(clean[2:]))
              for rel in candidates:
                  if (ROOT/rel).is_file(): out.add(rel)
              return out

          def refs(text):
              out=[m.group('ref') for m in HTML_JS_RE.finditer(text)]
              out += [m.group('ref') for m in JS_PATH_RE.finditer(text)]
              out += [m.group('ref') for m in REL_JS_RE.finditer(text)]
              return list(dict.fromkeys(out))

          queue=[ENTRY]; reachable=set(); edges={}; texts={}
          while queue:
              rel=queue.pop(0)
              if rel in reachable: continue
              full=ROOT/rel
              if not full.is_file() or full.suffix.lower() not in {'.html','.js'}: continue
              try: text=full.read_text(encoding='utf-8')
              except UnicodeDecodeError: continue
              reachable.add(rel); texts[rel]=text
              targets=set()
              for ref in refs(text): targets.update(resolve(rel,ref))
              edges[rel]=targets
              for target in sorted(targets,key=str):
                  if target.suffix.lower() in {'.html','.js'} and target not in reachable: queue.append(target)

          build=json.loads((ROOT/'build.json').read_text(encoding='utf-8'))
          if str(build.get('build'))!='40.6.124': raise SystemExit(f"Build drifted: {build.get('build')!r}")
          market_core=str(build.get('market_core') or build.get('engine') or '')
          if '38.15.11' not in market_core: raise SystemExit(f'Market Core drifted: {market_core!r}')

          rows=[]
          for path in sorted(JS.rglob('*.js')):
              m=VERSIONED.match(path.name)
              if not m: continue
              rel=path.relative_to(ROOT)
              canonical=path.with_name(m.group('base')+'.js')
              # This pass is specifically for numbered files without a same-directory canonical sibling.
              if canonical.is_file(): continue
              inbound=sorted(str(src) for src,targets in edges.items() if rel in targets)
              literal_sources=sorted(str(src) for src,text in texts.items() if path.name in text)
              name=path.name.lower()
              protected = (
                  name.startswith('aether-') or name.startswith('oracle-') or
                  'market-core' in name or 'lecture-technique' in name or
                  name.startswith('atlas-')
              )
              if rel in reachable:
                  cls='active_runtime'
              elif inbound or literal_sources:
                  cls='referenced_from_runtime_graph'
              else:
                  cls='unreachable_no_canonical_sibling'
              rows.append({
                  'path':str(rel),
                  'bytes':path.stat().st_size,
                  'classification':cls,
                  'protected_family':protected,
                  'inbound_from':inbound,
                  'active_literal_sources':literal_sources,
              })

          counts={}
          for row in rows: counts[row['classification']]=counts.get(row['classification'],0)+1
          unprotected_orphans=[r for r in rows if r['classification']=='unreachable_no_canonical_sibling' and not r['protected_family']]
          protected_orphans=[r for r in rows if r['classification']=='unreachable_no_canonical_sibling' and r['protected_family']]
          print(json.dumps({
              'build':build.get('build'),
              'market_core':market_core,
              'runtime_nodes':len(reachable),
              'numbered_without_canonical_count':len(rows),
              'counts':counts,
              'unprotected_orphan_count':len(unprotected_orphans),
              'protected_orphan_count':len(protected_orphans),
              'unprotected_orphans':unprotected_orphans,
              'protected_orphans':protected_orphans,
              'all_rows':rows,
              'mutation':'none'
          },indent=2,ensure_ascii=False))
          PY

      - name: Retire one-shot audit workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Seven Heaven Refactor'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/agent-crypto-audit-numbered-js-without-canonical.yml
          git commit -m 'chore(agent-crypto): retire numbered JS audit tooling'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo 'Rebase conflict; refusing force-push'
              exit 1
            fi
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*2))
          done
          echo 'Push remained contested after safe retries'
          exit 1
