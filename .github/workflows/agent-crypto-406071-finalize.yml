name: Agent Crypto 40.6.71 Finalize

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/agent-crypto-406071-finalize.yml'

permissions:
  contents: write

env:
  BUILD: '40.6.71'
  PARENT: '40.6.70'
  ENGINE: '38.15.11'
  RELEASE: 'TRADUS DATA / UI DECOUPLING · BOOT TRUTH'
  STATUS: 'tradus_data_ui_decoupling_boot_truth_406071'

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch publication truth and runtime load
        shell: bash
        run: |
          python3 - <<'PY'
          import json, hashlib
          from pathlib import Path
          from datetime import datetime, timezone

          root=Path('public/agent_crypto_erith_ia/administrator')
          build='40.6.71'; parent='40.6.70'; engine='38.15.11'
          release='TRADUS DATA / UI DECOUPLING · BOOT TRUTH'
          status='tradus_data_ui_decoupling_boot_truth_406071'
          now=datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z')

          runtime=root/'js/tradus-data-ui-decoupling-406071.js'
          notes=root/'RELEASE_40_6_71.md'
          assert runtime.exists() and notes.exists()

          # Root publication identity + one additive deferred runtime load.
          ip=root/'index.html'
          html=ip.read_text(encoding='utf-8')
          assert '<meta name="atlas-build" content="40.6.70" />' in html
          assert '<meta name="administrator-build" content="40.6.70" />' in html
          assert '<meta name="atlas-engine-build" content="38.15.11" />' in html
          assert 'tradus-data-ui-decoupling-406071.js' not in html
          html=html.replace('<meta name="atlas-build" content="40.6.70" />','<meta name="atlas-build" content="40.6.71" />',1)
          html=html.replace('<meta name="administrator-build" content="40.6.70" />','<meta name="administrator-build" content="40.6.71" />',1)
          html=html.replace('<meta name="administrator-release" content="AETHER FIREFOX PERFORMANCE · DRAG PAINT BUDGET" />',f'<meta name="administrator-release" content="{release}" />',1)
          html=html.replace('<meta name="atlas-asset-token" content="market-core-v2.0-alpha-build-40.6.70" />','<meta name="atlas-asset-token" content="market-core-v2.0-alpha-build-40.6.71" />',1)
          html=html.replace('<title>Agent-Crypto @erith.IA — Build 40.6.70 · Administrator</title>','<title>Agent-Crypto @erith.IA — Build 40.6.71 · Administrator</title>',1)
          needle='  <script defer src="./js/aether-tradus-bridge-406069.js?v=administrator-build-40.6.69"></script>'
          assert needle in html
          html=html.replace(needle, needle+'\n  <script defer src="./js/tradus-data-ui-decoupling-406071.js?v=administrator-build-40.6.71"></script>',1)
          ip.write_text(html,encoding='utf-8')

          # Runtime truth.
          bp=root/'build.json'
          b=json.loads(bp.read_text(encoding='utf-8'))
          assert b['build']==parent and b['engine']==engine
          b.update({
            'build':build,'engine':engine,'release':release,'status':status,'parent_build':parent,
            'asset_token':f'market-core-v2.0-alpha-build-{build}','administrator_build':build,
            'build_label':f'Build {build} · Administrator','release_status':'tradus_data_ui_decoupling_boot_truth',
            'timestamp':now
          })
          if isinstance(b.get('current_version_truth'),dict): b['current_version_truth']['loaded_build']=build
          b['cascade_40_6_71']={
            'parent_build':parent,
            'release':release,
            'status':status,
            'owner':'js/tradus-data-ui-decoupling-406071.js',
            'scope':'TRADUS PAPER boot truth and Aether missing-data semantics only',
            'publish_truth_without_visual_mount':True,
            'pageshow_truth_refresh':True,
            'visual_mount_best_effort_secondary':True,
            'waiting_semantic':'TRADUS · EN ATTENTE',
            'unavailable_semantic':'TRADUS · INDISPONIBLE',
            'observed_label_owner':'40.6.69 R1',
            'paper_lifecycle_owner':'40.6.67',
            'observability_archive_owner':'40.6.68',
            'aether_bridge_owner':'40.6.69 R1',
            'aether_performance_406070_preserved':True,
            'aether_geometry_modified':False,
            'aether_artwork_modified':False,
            'workbench_runtime_modified':False,
            'technical_reading_modified':False,
            'strategy_a_modified':False,
            'paper_lifecycle_modified':False,
            'market_core':'38.15.11',
            'market_core_modified':False,
            'new_market_polling':False,
            'new_recurring_timer':False,
            'new_mutation_observer':False,
            'new_global_dom_observer':False,
            'new_network_owner':False,
            'new_storage_owner':False,
            'automatic_order':False,
            'real_order':False
          }
          bp.write_text(json.dumps(b,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          # Publication manifest.
          vp=root/'version.json'
          v=json.loads(vp.read_text(encoding='utf-8'))
          assert v['build']==parent and v['engine']==engine
          v.update({'build':build,'engine':engine,'release':release,'status':status,'parent_build':parent,
                    'asset_token':f'market-core-v2.0-alpha-build-{build}','prepared_at':now,'published_at':now})
          if isinstance(v.get('lineage'),str) and build not in v['lineage']:
            v['lineage']+=f' → {build} TRADUS data/UI boot truth decoupling; 40.6.70 Aether performance preserved'
          files=v.setdefault('files',{})
          for rel in ['js/tradus-data-ui-decoupling-406071.js','RELEASE_40_6_71.md']:
            files[rel]=hashlib.sha256((root/rel).read_bytes()).hexdigest()
          if isinstance(v.get('integrity'),dict): v['integrity']['files']=len(files)
          vp.write_text(json.dumps(v,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          # Administrator mirror manifest.
          ap=root/'administrator-version.json'
          av=json.loads(ap.read_text(encoding='utf-8'))
          assert av['build']==parent
          av.update({'build':build,'release':release,'status':status,'prepared_at':now,'published_at':now,'global_versioning':build})
          av['tradus_data_ui_decoupling_406071']={
            'owner':'js/tradus-data-ui-decoupling-406071.js',
            'publish_truth_without_visual_mount':True,
            'visual_mount_secondary':True,
            'waiting_semantic':'TRADUS · EN ATTENTE',
            'unavailable_semantic':'TRADUS · INDISPONIBLE',
            'observed_label_owner':'40.6.69 R1',
            'aether_performance_406070_preserved':True,
            'aether_geometry_modified':False,
            'strategy_a_modified':False,
            'paper_lifecycle_modified':False,
            'new_market_polling':False,'new_recurring_timer':False,
            'new_mutation_observer':False,'new_global_dom_observer':False,
            'new_network_owner':False,'new_storage_owner':False,
            'market_core_modified':False,'real_order':False
          }
          ap.write_text(json.dumps(av,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY

      - name: Validate 40.6.71
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('public/agent_crypto_erith_ia/administrator')
          build='40.6.71'; parent='40.6.70'; engine='38.15.11'
          b=json.loads((root/'build.json').read_text(encoding='utf-8'))
          v=json.loads((root/'version.json').read_text(encoding='utf-8'))
          av=json.loads((root/'administrator-version.json').read_text(encoding='utf-8'))
          html=(root/'index.html').read_text(encoding='utf-8')
          js=(root/'js/tradus-data-ui-decoupling-406071.js').read_text(encoding='utf-8')
          assert b['build']==v['build']==av['build']==build
          assert b['engine']==v['engine']==engine
          assert f'<meta name="administrator-build" content="{build}" />' in html
          assert 'tradus-data-ui-decoupling-406071.js?v=administrator-build-40.6.71' in html
          assert html.index('aether-tradus-bridge-406069.js') < html.index('tradus-data-ui-decoupling-406071.js')
          assert 'publishTruth("boot")' in js
          assert 'TRADUS · EN ATTENTE' in js
          assert 'TRADUS · INDISPONIBLE' in js
          assert 'MutationObserver' in js and 'recurring_timer:false' in js
          assert b['cascade_40_6_71']['strategy_a_modified'] is False
          assert b['cascade_40_6_71']['market_core_modified'] is False
          assert b['cascade_40_6_71']['real_order'] is False
          print('40.6.71 validation: PASS')
          PY

      - name: Remove one-shot finalizer and commit
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/agent-crypto-406071-finalize.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(agent-crypto): decouple TRADUS data truth from UI mount 40.6.71'
          git push origin HEAD:main
