name: Agent Crypto Official Spot Instrument Census
on:
  pull_request:
    paths:
      - '.github/workflows/agent-crypto-official-spot-instruments.yml'
      - 'public/agent_crypto_erith_ia/tools/audit_historical_spot_instruments.py'
      - 'public/agent_crypto_erith_ia/tools/historical_spot_instruments_test.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/agent-crypto-official-spot-instruments.yml'
      - 'public/agent_crypto_erith_ia/tools/audit_historical_spot_instruments.py'
      - 'public/agent_crypto_erith_ia/tools/historical_spot_instruments_test.py'
  workflow_dispatch:
  schedule:
    - cron: '17 8 * * *'
permissions:
  contents: write
concurrency:
  group: agent-crypto-official-spot-instrument-census
  cancel-in-progress: false
jobs:
  spot-census:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate official venue parsers and protected ranked Top250
        run: |
          set -euo pipefail
          python -m py_compile public/agent_crypto_erith_ia/tools/audit_historical_spot_instruments.py
          python public/agent_crypto_erith_ia/tools/historical_spot_instruments_test.py
          python public/agent_crypto_erith_ia/tools/audit_historical_spot_instruments.py --plan
      - name: Read exactly two official public Spot instrument inventories
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          python public/agent_crypto_erith_ia/tools/audit_historical_spot_instruments.py --probe
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('public/agent_crypto_erith_ia/data/historical_archive_prototype/top250-official-spot-instruments.json')
          r=json.loads(p.read_text())
          assert r['schema']=='aerith.public.ohlcv.spot.top250.official-instrument-candidates.v1'
          assert r['ranked']==250 and r['candidate_count']==250-r['archived_assets_at_audit']
          assert r['no_orders'] is True and r['no_synthetic_candles'] is True
          assert len(r['assets'])==r['candidate_count']
          assert any(v['status']=='success' for v in r['markets'].values())
          for asset in r['assets']:
              assert asset['archived'] is False
              assert asset['coin_id_confirmed'] is False
              assert asset['native_1m_month_confirmed'] is False
              for instrument in asset['instruments']:
                  assert instrument['exchange_instrument_confirmed'] is True
                  assert instrument['coin_id_confirmed'] is False
                  assert instrument['native_1m_month_confirmed'] is False
          print('OFFICIAL SPOT SYMBOL-CANDIDATES',r['with_spot_instrument'],flush=True)
          PY
      - name: Commit only venue instrument metadata
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          path=public/agent_crypto_erith_ia/data/historical_archive_prototype/top250-official-spot-instruments.json
          git add -- "$path"
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'NOOP: public Spot instrument audit unchanged'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Publish official Spot pair candidates without fabricating identities'
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Protect source archives, Trader, Bridge and Core
        if: always()
        run: |
          set -euo pipefail
          git diff --exit-code -- \
            public/agent_crypto_erith_ia/administrator/ \
            public/agent_crypto_erith_ia/trader/ \
            public/agent_crypto_erith_ia/core/ \
            public/agent_crypto_erith_ia/data/crypto/ \
            public/agent_crypto_erith_ia/data/historical_archive_prototype/shared_monthly_views/ \
            public/agent_crypto_erith_ia/data/historical_archive_prototype/shared_hourly_views/
