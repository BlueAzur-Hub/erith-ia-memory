name: Agent Crypto Official Spot Instrument Census
on:
  pull_request:
    paths:
      - '.github/workflows/agent-crypto-official-spot-instruments.yml'
      - 'public/agent_crypto_erith_ia/tools/audit_spot_instruments.py'
      - 'public/agent_crypto_erith_ia/tools/spot_instrument_audit_test.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/agent-crypto-official-spot-instruments.yml'
      - 'public/agent_crypto_erith_ia/tools/audit_spot_instruments.py'
      - 'public/agent_crypto_erith_ia/tools/spot_instrument_audit_test.py'
  workflow_dispatch:
  schedule:
    - cron: '17 8 * * *'
permissions:
  contents: write
concurrency:
  group: agent-crypto-official-spot-instrument-census
  cancel-in-progress: false
jobs:
  spot-census:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify parser, invalid symbols and exact ranked Top250
        run: |
          set -euo pipefail
          python -m py_compile public/agent_crypto_erith_ia/tools/audit_spot_instruments.py
          python public/agent_crypto_erith_ia/tools/spot_instrument_audit_test.py
          python public/agent_crypto_erith_ia/tools/audit_spot_instruments.py --plan
      - name: Read only official OKX and Bitget Spot instruments
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          python public/agent_crypto_erith_ia/tools/audit_spot_instruments.py --probe
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('public/agent_crypto_erith_ia/data/historical_archive_prototype/top250-official-spot-instruments.json')
          r=json.loads(p.read_text())
          assert r['schema']=='aerith.public.ohlcv.spot.top250.instrument-audit.v1'
          assert r['ranked']==250 and r['remaining']==250-r['archived_assets']
          assert r['none_are_archive_claims'] is True
          assert r['symbol_only_not_identity_proof'] is True
          assert len(r['assets'])==r['remaining']
          assert all(not a['months'] for a in [])  # No monthly OHLCV is ever produced.
          for a in r['assets']:
              for m in a['instruments']:
                  assert m['exact_coingecko_id_proven'] is False
                  assert m['full_native_1m_month_proven'] is False
          print('READ-ONLY SPOT INSTRUMENT PROOF',r['symbol_candidate_assets'],flush=True)
          PY
      - name: Publish audit metadata alone, never historical candles
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          path=public/agent_crypto_erith_ia/data/historical_archive_prototype/top250-official-spot-instruments.json
          git add -- "$path"
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'NOOP: instrument census unchanged'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Persist official Spot instrument candidates without identity approvals'
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Guard existing vault, trading desk, bridge and core
        if: always()
        run: |
          set -euo pipefail
          git diff --exit-code -- \
            public/agent_crypto_erith_ia/administrator/ \
            public/agent_crypto_erith_ia/trader/ \
            public/agent_crypto_erith_ia/core/ \
            public/agent_crypto_erith_ia/data/crypto/ \
            public/agent_crypto_erith_ia/data/historical_archive_prototype/shared_monthly_views/ \
            public/agent_crypto_erith_ia/data/historical_archive_prototype/shared_hourly_views/
