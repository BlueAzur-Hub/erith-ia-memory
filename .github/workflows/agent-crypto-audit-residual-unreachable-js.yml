name: Agent Crypto audit residual unreachable JavaScript

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/agent-crypto-audit-residual-unreachable-js.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Synchronize
        run: git pull --ff-only origin main

      - name: Audit residual unreachable JavaScript
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json, re

          ROOT = Path('public/agent_crypto_erith_ia/administrator')
          ENTRY = Path('runtime-shell.html')
          HTML_JS_RE = re.compile(r'(?:src|href)=["\'](?P<ref>[^"\']+\.js(?:\?[^"\']*)?)["\']', re.I)
          JS_PATH_RE = re.compile(r'(?P<ref>(?:\.\.?/|/)?js/[A-Za-z0-9_./-]+\.js)(?:\?[^"\'`\s)]*)?', re.I)
          REL_JS_RE = re.compile(r'(?P<ref>\.\.?/[A-Za-z0-9_./-]+\.js)(?:\?[^"\'`\s)]*)?', re.I)

          def stripq(ref):
              return ref.split('?', 1)[0].split('#', 1)[0]

          def resolve(source_rel, ref):
              clean = stripq(ref).replace('\\', '/')
              candidates = []
              if clean.startswith('/'):
                  candidates.append(Path(clean.lstrip('/')))
              elif clean.startswith('js/'):
                  candidates.append(Path(clean))
              elif clean.startswith('./js/'):
                  candidates.append(Path(clean[2:]))
                  try:
                      candidates.append(((ROOT/source_rel).parent/clean).resolve().relative_to(ROOT.resolve()))
                  except Exception:
                      pass
              elif clean.startswith(('./', '../')):
                  try:
                      candidates.append(((ROOT/source_rel).parent/clean).resolve().relative_to(ROOT.resolve()))
                  except Exception:
                      pass
                  if clean.startswith('./'):
                      candidates.append(Path(clean[2:]))
              return {rel for rel in candidates if (ROOT/rel).is_file()}

          def refs(text):
              out = [m.group('ref') for m in HTML_JS_RE.finditer(text)]
              out += [m.group('ref') for m in JS_PATH_RE.finditer(text)]
              out += [m.group('ref') for m in REL_JS_RE.finditer(text)]
              return list(dict.fromkeys(out))

          # Real runtime graph.
          queue = [ENTRY]
          reachable, runtime_edges, runtime_texts = set(), {}, {}
          while queue:
              rel = queue.pop(0)
              if rel in reachable:
                  continue
              full = ROOT/rel
              if not full.is_file() or full.suffix.lower() not in {'.html', '.js'}:
                  continue
              try:
                  text = full.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              reachable.add(rel)
              runtime_texts[rel] = text
              targets = set()
              for ref in refs(text):
                  targets.update(resolve(rel, ref))
              runtime_edges[rel] = targets
              for target in sorted(targets, key=str):
                  if target.suffix.lower() in {'.html', '.js'} and target not in reachable:
                      queue.append(target)

          build = json.loads((ROOT/'build.json').read_text(encoding='utf-8'))
          if str(build.get('build')) != '40.6.124':
              raise SystemExit(f"Build drifted: {build.get('build')!r}")
          market_core = str(build.get('market_core') or build.get('engine') or '')
          if '38.15.11' not in market_core:
              raise SystemExit(f'Market Core drifted: {market_core!r}')
          if len(reachable) != 101:
              raise SystemExit(f'Runtime graph drifted: {len(reachable)}')

          # Full textual/dependency view, including historical files.
          all_sources = {}
          for path in sorted(ROOT.rglob('*')):
              if not path.is_file() or path.suffix.lower() not in {'.html', '.js', '.json'}:
                  continue
              try:
                  all_sources[path.relative_to(ROOT)] = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  pass

          full_edges = {}
          for src, text in all_sources.items():
              targets = set()
              for ref in refs(text):
                  targets.update(resolve(src, ref))
              full_edges[src] = targets

          current_metadata = {
              Path('build.json'), Path('version.json'), Path('administrator-version.json'),
              Path('index.html'), Path('runtime-shell.html')
          }

          def protection(rel):
              s = str(rel).lower()
              name = rel.name.lower()
              reasons = []
              if 'aether' in s: reasons.append('AETHER')
              if 'oracle' in s: reasons.append('ORACLE')
              if 'atlas' in s: reasons.append('ATLAS')
              if 'market-core' in s: reasons.append('MARKET_CORE')
              if 'lecture-technique' in s: reasons.append('LECTURE_TECHNIQUE')
              if 'web-classic' in s or 'web-classique' in s: reasons.append('WEB_CLASSIC')
              if ('graph' in name or 'chart' in name) and ('market' in name or 'crypto' in name or 'price' in name): reasons.append('GRAPH')
              if name == 'version-truth-406086-authority-lock.js': reasons.append('VERSION_TRUTH_COMPATIBILITY_LOCK')
              if name == 'version-truth-entry-authority-v2.js': reasons.append('VERSION_TRUTH_SEPARATE_PROOF')
              return reasons

          def ref_kind(src):
              s = str(src)
              name = src.name
              if src in current_metadata: return 'CURRENT_METADATA_OR_ENTRY'
              if re.fullmatch(r'index-40\.\d+\.\d+\.html', name): return 'IMMUTABLE_HISTORICAL_INDEX'
              if s.startswith('architecture/'): return 'ARCHITECTURE_HISTORY'
              if s.startswith('js/') or s == 'runtime-shell.html': return 'CODE_OR_RUNTIME_TEXT'
              return 'OTHER'

          rows = []
          for path in sorted(ROOT.rglob('*.js')):
              rel = path.relative_to(ROOT)
              if rel in reachable:
                  continue
              inbound_runtime = sorted(str(src) for src, tg in runtime_edges.items() if rel in tg and src != rel)
              inbound_all = sorted(src for src, tg in full_edges.items() if rel in tg and src != rel, key=str)
              literal_runtime = sorted(str(src) for src, text in runtime_texts.items() if rel.name in text and src != rel)
              literal_all = sorted(src for src, text in all_sources.items() if rel.name in text and src != rel, key=str)
              prot = protection(rel)
              kind_counts = {}
              for src in inbound_all:
                  k = ref_kind(src)
                  kind_counts[k] = kind_counts.get(k, 0) + 1
              current_refs = sorted(str(src) for src in inbound_all if ref_kind(src) == 'CURRENT_METADATA_OR_ENTRY')
              code_refs = sorted(str(src) for src in inbound_all if ref_kind(src) == 'CODE_OR_RUNTIME_TEXT')
              historical_refs = sorted(str(src) for src in inbound_all if ref_kind(src) in {'IMMUTABLE_HISTORICAL_INDEX','ARCHITECTURE_HISTORY'})
              if prot:
                  classification = 'PROTECTED_UNREACHABLE'
              elif inbound_runtime or literal_runtime:
                  classification = 'RUNTIME_TEXT_OR_EDGE_REVIEW'
              elif current_refs:
                  classification = 'CURRENT_METADATA_REFERENCED'
              elif code_refs:
                  classification = 'NONRUNTIME_CODE_CHAIN'
              elif historical_refs or inbound_all:
                  classification = 'HISTORY_ONLY_REFERENCED'
              else:
                  classification = 'NEUTRAL_ZERO_INBOUND'
              rows.append({
                  'path': str(rel),
                  'bytes': path.stat().st_size,
                  'lines': len(path.read_text(encoding='utf-8').splitlines()),
                  'classification': classification,
                  'protection': prot,
                  'inbound_runtime': inbound_runtime,
                  'literal_runtime': literal_runtime,
                  'current_refs': current_refs,
                  'code_refs': code_refs,
                  'historical_refs_count': len(historical_refs),
                  'historical_refs_sample': historical_refs[:12],
                  'all_inbound_count': len(inbound_all),
                  'all_literal_count': len(literal_all),
                  'ref_kind_counts': kind_counts,
              })

          counts = {}
          for row in rows:
              counts[row['classification']] = counts.get(row['classification'], 0) + 1

          print(json.dumps({
              'head_expected_parent': 'b77088808548f71bb1dac3b68276dd00172bb520',
              'build': build.get('build'),
              'market_core': market_core,
              'runtime_nodes': len(reachable),
              'total_js_files': len(list(ROOT.rglob('*.js'))),
              'unreachable_js_count': len(rows),
              'classification_counts': counts,
              'rows': rows,
              'mutation': 'none'
          }, indent=2, ensure_ascii=False))
          PY

      - name: Retire one-shot audit workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Seven Heaven Refactor'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/agent-crypto-audit-residual-unreachable-js.yml
          git commit -m 'chore(agent-crypto): retire residual JS audit tooling'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo 'Rebase conflict; refusing force-push'
              exit 1
            fi
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*2))
          done
          echo 'Push remained contested after safe retries'
          exit 1
