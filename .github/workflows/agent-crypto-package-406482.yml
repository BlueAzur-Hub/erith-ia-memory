name: Agent-Crypto 40.6.482 Validate Package and Publish ZIP

on:
  push:
    branches:
      - main
      - agent-crypto-406482-oracle-evidence-tiered-storage-foundation
    paths:
      - '.github/workflows/agent-crypto-package-406482.yml'
      - '.github/scripts/agent_crypto_oracle_evidence_tiered_storage_test_406482.py'
      - 'public/agent_crypto_erith_ia/administrator/js/oracle-evidence-tiered-storage-foundation.js'
      - 'public/agent_crypto_erith_ia/data/oracle_evidence/**'
      - 'public/agent_crypto_erith_ia/administrator/build.json'
      - 'public/agent_crypto_erith_ia/administrator/index.html'
  pull_request:
    paths:
      - '.github/workflows/agent-crypto-package-406482.yml'
      - '.github/scripts/agent_crypto_oracle_evidence_tiered_storage_test_406482.py'
      - 'public/agent_crypto_erith_ia/administrator/js/oracle-evidence-tiered-storage-foundation.js'
      - 'public/agent_crypto_erith_ia/data/oracle_evidence/**'
      - 'public/agent_crypto_erith_ia/administrator/build.json'
      - 'public/agent_crypto_erith_ia/administrator/index.html'

permissions:
  contents: write

jobs:
  validate-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Validate 40.6.482 foundation
        run: |
          set -euo pipefail
          ROOT="public/agent_crypto_erith_ia"
          node --check "$ROOT/administrator/js/oracle-evidence-tiered-storage-foundation.js"
          python .github/scripts/agent_crypto_oracle_evidence_tiered_storage_test_406482.py
          python .github/scripts/agent_crypto_version_truth_guard_compat.py
          grep -F 'Build 40.6.482 · Administrator' "$ROOT/administrator/index.html"
          grep -F '"build": "40.6.482"' "$ROOT/administrator/build.json"
          grep -F 'oracle-evidence-tiered-storage-foundation.js?v=40.6.482' "$ROOT/administrator/js/post-boot-runtime-loader.js"

      - name: Validate safety contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path("public/agent_crypto_erith_ia")
          d=json.loads((root/"administrator/build.json").read_text(encoding="utf-8"))
          m=json.loads((root/"data/oracle_evidence/manifest.json").read_text(encoding="utf-8"))
          assert d["build"]=="40.6.482"
          assert d["market_core"]=="38.15.11"
          assert d["strategy_a_modified"] is False
          assert d["strategy_a_business_logic_modified"] is False
          assert d["oracle_math_changed"] is False
          assert d["storage_schema_changed"] is False
          assert d["retention_changed"] is False
          assert d["real_order"] is False
          f=d["oracle_evidence_tiered_storage_foundation_406482"]
          assert f["browser_github_write"] is False
          assert f["automatic_upload"] is False
          assert f["github_token_in_browser"] is False
          assert f["local_retention_allowed"] is False
          assert f["local_delete_api_exposed"] is False
          assert f["local_rows_deleted"] is False
          assert m["archived_rows"]==0
          assert m["chunks"]==[]
          print("40.6.482 SAFETY CONTRACT PASS")
          PY

      - name: Mark test receipt PASS
        if: github.ref == 'refs/heads/main'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("public/agent_crypto_erith_ia/administrator/ORACLE_EVIDENCE_TIERED_STORAGE_TEST_40.6.482.json")
          d=json.loads(p.read_text(encoding="utf-8"))
          d["pass_pending_workflow"]=False
          d["pass"]=True
          d["cases"]={k:"PASS" for k in d["cases"]}
          p.write_text(json.dumps(d,indent=2,ensure_ascii=False)+"\n",encoding="utf-8")
          PY

      - name: Build ZIP
        if: github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          ROOT="public/agent_crypto_erith_ia/administrator"
          ZIP="$ROOT/AGENT_CRYPTO_ORACLE_EVIDENCE_TIERED_STORAGE_FOUNDATION_40.6.482.zip"
          rm -rf /tmp/ac482 "$ZIP" "$ZIP.sha256"
          mkdir -p /tmp/ac482
          cp --parents             .github/workflows/agent-crypto-package-406482.yml             .github/scripts/agent_crypto_oracle_evidence_tiered_storage_test_406482.py             public/agent_crypto_erith_ia/data/oracle_evidence/manifest.json             public/agent_crypto_erith_ia/data/oracle_evidence/README.md             "$ROOT/js/oracle-evidence-tiered-storage-foundation.js"             "$ROOT/js/post-boot-runtime-loader.js"             "$ROOT/js/strategy-a-audit-demand-loader.js"             "$ROOT/index.html"             "$ROOT/index-40.6.482.html"             "$ROOT/build.json"             "$ROOT/RELEASE.md"             "$ROOT/HANDOFF.md"             "$ROOT/HANDOFF_FINAL_40.6.482.md"             "$ROOT/ORACLE_EVIDENCE_TIERED_STORAGE_FOUNDATION_40.6.482.md"             "$ROOT/ORACLE_EVIDENCE_TIERED_STORAGE_TEST_40.6.482.json"             "$ROOT/PATCH_MANIFEST_40.6.482.txt"             /tmp/ac482/
          (cd /tmp/ac482 && zip -9 -r "$GITHUB_WORKSPACE/$ZIP" .)
          unzip -t "$ZIP"
          sha256sum "$ZIP" > "$ZIP.sha256"

      - name: Commit published ZIP
        if: github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          ROOT="public/agent_crypto_erith_ia/administrator"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             "$ROOT/ORACLE_EVIDENCE_TIERED_STORAGE_TEST_40.6.482.json"             "$ROOT/AGENT_CRYPTO_ORACLE_EVIDENCE_TIERED_STORAGE_FOUNDATION_40.6.482.zip"             "$ROOT/AGENT_CRYPTO_ORACLE_EVIDENCE_TIERED_STORAGE_FOUNDATION_40.6.482.zip.sha256"
          git commit -m "chore(package): publish Agent-Crypto 40.6.482 tiered storage ZIP"
          git pull --rebase origin main
          git push origin HEAD:main
