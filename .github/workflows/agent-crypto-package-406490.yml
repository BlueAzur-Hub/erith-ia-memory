name: Agent-Crypto 40.6.490 Historical Package

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate syntax and safety contracts
        run: |
          set -euo pipefail
          ROOT="public/agent_crypto_erith_ia/administrator"
          node --check "$ROOT/js/oracle-evidence-verified-hot-window-retention-406490.js"
          node --check "$ROOT/js/post-boot-runtime-loader.js"
          python .github/scripts/agent_crypto_oracle_evidence_retention_guard_406490.py
          python .github/scripts/agent_crypto_version_truth_guard_compat.py

      - name: Verify protected cold archive is not patched
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          git fetch origin main
          git diff --exit-code origin/main...HEAD -- \
            public/agent_crypto_erith_ia/data/oracle_evidence/manifest.json \
            public/agent_crypto_erith_ia/data/oracle_evidence

      - name: Verify committed delivery ZIP
        run: |
          set -euo pipefail
          ROOT="public/agent_crypto_erith_ia/administrator"
          ZIP="$ROOT/AGENT_CRYPTO_ORACLE_EVIDENCE_VERIFIED_HOT_WINDOW_RETENTION_40.6.490.zip"
          test -f "$ZIP"
          test -f "$ZIP.sha256"
          sha256sum --check "$ZIP.sha256"
          unzip -t "$ZIP"
          unzip -l "$ZIP" | grep -F 'oracle-evidence-verified-hot-window-retention-406490.js'
          unzip -l "$ZIP" | grep -F 'agent_crypto_oracle_evidence_retention_guard_406490.py'
          unzip -l "$ZIP" | grep -F 'PATCH_MANIFEST_40.6.490.txt'

      - uses: actions/upload-artifact@v4
        with:
          name: agent-crypto-40.6.490-verified-hot-window-retention
          path: |
            public/agent_crypto_erith_ia/administrator/AGENT_CRYPTO_ORACLE_EVIDENCE_VERIFIED_HOT_WINDOW_RETENTION_40.6.490.zip
            public/agent_crypto_erith_ia/administrator/AGENT_CRYPTO_ORACLE_EVIDENCE_VERIFIED_HOT_WINDOW_RETENTION_40.6.490.zip.sha256
          if-no-files-found: error
