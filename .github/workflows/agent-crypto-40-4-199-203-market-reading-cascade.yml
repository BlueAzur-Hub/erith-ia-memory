name: Agent-Crypto 40.4.199-203 Market Reading Cascade

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/agent-crypto-40-4-199-203-market-reading-cascade.yml'

permissions:
  contents: write

concurrency:
  group: agent-crypto-market-reading-cascade
  cancel-in-progress: false

jobs:
  cascade:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cascade 40.4.199 through 40.4.203
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          BASE='public/agent_crypto_erith_ia/administrator'
          SCRIPT='.github/scripts/agent_crypto_market_reading_cascade.py'
          GUARD='.github/scripts/agent_crypto_version_truth_guard.py'

          for build in 40.4.199 40.4.200 40.4.201 40.4.202 40.4.203; do
            current="$(python - <<'PY'
          import json
          from pathlib import Path
          p=Path('public/agent_crypto_erith_ia/administrator/version.json')
          print(json.loads(p.read_text(encoding='utf-8'))['build'])
          PY
          )"
            current_patch="${current##*.}"
            target_patch="${build##*.}"
            if [[ "$current" == 40.4.* ]] && (( target_patch <= current_patch )); then
              echo "SKIP $build (current $current)"
              continue
            fi

            echo "=== BUILD $build from $current ==="
            python "$SCRIPT" --build "$build"

            node --check "$BASE/app.js"
            node --check "$BASE/js/app.js"
            node --check "$BASE/js/market-stack.js"
            node --check "$BASE/js/parallel-markets.js"
            node --check "$BASE/js/market-reading-depth.js"
            python -m json.tool "$BASE/build.json" >/dev/null
            python -m json.tool "$BASE/version.json" >/dev/null
            python -m json.tool "$BASE/administrator-version.json" >/dev/null

            if grep -Eq 'setInterval\(|MutationObserver\(' "$BASE/js/market-reading-depth.js"; then
              echo 'ERROR: Market Reading Depth must stay timer/observer free.' >&2
              exit 1
            fi
            grep -q 'Aucune prévision' "$BASE/js/market-reading-depth.js"
            grep -q 'Corrélation ≠ causalité' "$BASE/js/market-reading-depth.js"
            grep -q 'const ENGINE_BUILD = "38.15.11";' "$BASE/js/app.js"

            release="$(python - <<'PY'
          import json
          from pathlib import Path
          p=Path('public/agent_crypto_erith_ia/administrator/version.json')
          print(json.loads(p.read_text(encoding='utf-8'))['release'])
          PY
          )"
            python "$GUARD" --expected-build "$build" --expected-release "$release"

            if [[ "$build" == '40.4.203' ]]; then
              git rm .github/workflows/agent-crypto-40-4-199-203-market-reading-cascade.yml
              git rm .github/scripts/agent_crypto_market_reading_cascade.py
            fi

            git add \
              "$BASE/index.html" \
              "$BASE/app.js" \
              "$BASE/js/app.js" \
              "$BASE/js/market-stack.js" \
              "$BASE/js/parallel-markets.js" \
              "$BASE/js/market-reading-depth.js" \
              "$BASE/market-reading-depth.css" \
              "$BASE/build.json" \
              "$BASE/version.json" \
              "$BASE/administrator-version.json"

            if [[ "$build" == '40.4.202' || "$build" == '40.4.203' ]]; then
              git add public/agent_crypto_erith_ia/data/cross_market/history
            fi

            case "$build" in
              40.4.199) msg='release Agent-Crypto 40.4.199 market reading depth foundation' ;;
              40.4.200) msg='release Agent-Crypto 40.4.200 indices deep reading' ;;
              40.4.201) msg='release Agent-Crypto 40.4.201 energy deep reading' ;;
              40.4.202) msg='release Agent-Crypto 40.4.202 cross-market long memory' ;;
              40.4.203) msg='release Agent-Crypto 40.4.203 historical math core' ;;
            esac

            if git diff --cached --quiet; then
              echo "ERROR: no staged changes for $build" >&2
              exit 1
            fi
            git commit -m "$msg"
            git push origin HEAD:main
          done
