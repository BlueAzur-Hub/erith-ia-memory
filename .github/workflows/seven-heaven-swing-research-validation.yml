name: Seven Heaven - offline BTC swing historical research verification

on:
  pull_request:
    paths:
      - '.github/workflows/seven-heaven-swing-research-validation.yml'
      - 'coordination/inter_ai_dialogues/agent_crypto/research/strategy_profiles/SEVEN_HEAVEN_AGENT_CRYPTO_SWING_TREND_PULLBACK_*'

permissions:
  contents: read

jobs:
  verify-seven-research:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run isolated offline historical backtest
        run: |
          node --check coordination/inter_ai_dialogues/agent_crypto/research/strategy_profiles/SEVEN_HEAVEN_AGENT_CRYPTO_SWING_TREND_PULLBACK_MULTYEAR_REPRODUCIBLE_RESEARCH.cjs
          node coordination/inter_ai_dialogues/agent_crypto/research/strategy_profiles/SEVEN_HEAVEN_AGENT_CRYPTO_SWING_TREND_PULLBACK_MULTYEAR_REPRODUCIBLE_RESEARCH.cjs > /tmp/seven-btc-swing-research.json
      - name: Check research-only state and annual evidence
        run: |
          node - <<'NODE'
          const fs=require('node:fs'), assert=require('node:assert/strict');
          const d=JSON.parse(fs.readFileSync('/tmp/seven-btc-swing-research.json','utf8'));
          assert.equal(d.ordersEnabled,false);
          assert.equal(d.realOrders,0);
          assert.equal(d.researchOnly,true);
          assert.equal(d.source.bars,3075);
          assert.equal(d.years.length,4);
          const expected={
            2022:{swing:-1.2596360520910288,hold20:-10.949271299271036,trades:5},
            2023:{swing:-0.3066591990936063,hold20:17.006741464656862,trades:21},
            2024:{swing:0.677220630583375,hold20:24.87488278375889,trades:17},
            2025:{swing:-0.1555422419979524,hold20:-3.5344946297090063,trades:14}
          };
          for(const y of d.years){
            const e=expected[y.year];
            assert(e,'Unexpected year');
            assert(Math.abs(y.swingPct-e.swing)<1e-6,'Swing result mismatch '+y.year);
            assert(Math.abs(y.buyHold20Pct-e.hold20)<1e-6,'Benchmark mismatch '+y.year);
            assert.equal(y.tradesCount,e.trades);
            assert.equal(y.tradesCount,y.trades.length);
            assert.equal(y.wins+y.losses,y.tradesCount);
          }
          console.log('PASS: 2022-2025 replay, archive provenance, risk and read-only safety');
          NODE
