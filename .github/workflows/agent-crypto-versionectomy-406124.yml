name: Agent-Crypto 40.6.124 versionectomy

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/agent-crypto-versionectomy-406124.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  versionectomy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply versionectomy
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/agent_crypto_versionectomy_406124.py
          ROOT='public/agent_crypto_erith_ia/administrator'
          node --check "$ROOT/app.js"
          node --check "$ROOT/js/app.js"
          node --check "$ROOT/js/boot.js"
          node --check "$ROOT/js/version-truth.js"

      - name: Commit verified surgery
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/agent-crypto-versionectomy-406124.yml
          rm -f .github/scripts/agent_crypto_versionectomy_406124.py
          git config user.name "Aether Release"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(agent-crypto): remove legacy version authority at 40.6.124"
          git pull --rebase origin main
          git push origin HEAD:main
