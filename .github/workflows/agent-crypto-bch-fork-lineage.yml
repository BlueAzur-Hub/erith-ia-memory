name: Agent Crypto Authentic BCH BCC BCHABC Fork Lineage
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/agent-crypto-bch-fork-lineage.yml'
      - 'public/agent_crypto_erith_ia/tools/archive_top25_cash_fork_lineage.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: agent-crypto-original-bch-fork-lineage
  cancel-in-progress: false
jobs:
  original-market-source:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        market: [bcc-pre-fork, bchabc-2018]
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate fork sources by exact Binance original instrument
        run: |
          set -euo pipefail
          python -m py_compile public/agent_crypto_erith_ia/tools/archive_top25_cash_fork_lineage.py
          python public/agent_crypto_erith_ia/tools/archive_top25_cash_fork_lineage.py --self-test
      - name: Preserve native source originals and exact millisecond OHLCV
        run: |
          set -euo pipefail
          python public/agent_crypto_erith_ia/tools/archive_top25_cash_fork_lineage.py \
            --batch ${{ matrix.market }} \
            --output "$RUNNER_TEMP/bch-fork-source"
      - name: Verify SHA256 for every original ZIP, official CHECKSUM and SQLite
        run: |
          set -euo pipefail
          python - <<'PY'
          import pathlib,os,hashlib,json
          base=pathlib.Path(os.environ["RUNNER_TEMP"])/"bch-fork-source"
          j=json.loads((base/"manifest.json").read_text())
          assert j["schema"]=="seven.crypto.top25-source-bch-lineage.v1"
          market=j["source_market_lineage"]["source_original_pair"]
          assert market in ("BCCUSDT","BCHABCUSDT")
          assert j["original_market_symbol"]==market
          assert j["target_month_pairs"]==(12 if market=="BCCUSDT" else 2)
          assert j["pre_fork_and_post_fork_series_not_automatically_spliced"]
          assert j["no_synthetic_bars"] and j["trader_interface_modified"] is False
          assert j["source_verified_month_pairs"]+j["pre_pair_listing_month_pairs"]+j["unavailable_or_unverified_month_pairs"]==j["target_month_pairs"]
          files={"manifest.json"}
          for r in j["records"]:
              assert r["pair"]==market and r["quote"]=="USDT"
              if r["status"] in ("native_1m_complete","native_1m_partial","original_timestamp_quarantine"):
                  assert r["native_rows"]>0
                  for key in ("source_zip","official_checksum","sqlite"):
                      v=r[key];p=base/v["name"]
                      assert v["name"] not in files and p.is_file()
                      assert p.stat().st_size==v["bytes"]
                      assert hashlib.sha256(p.read_bytes()).hexdigest()==v["sha256"]
                      files.add(v["name"])
                  if r["strict_utc_aligned"]:
                      assert r["native_rows"]+r["missing_1m_minutes"]==r["calendar_minutes"]
                      assert sum(g["missing_minutes"] for g in r["missing_intervals"])==r["missing_1m_minutes"]
                  else: assert r["excluded_from_utc_1m_calendar"]
              else: assert r["native_rows"]==0
          assert files=={f.name for f in base.iterdir()}
          print("CASH FORK SOURCE PROVED",market,j["source_verified_month_pairs"],j["original_native_ohlcv_rows"])
          PY
      - name: Publish source-exact immutable GitHub Release
        run: |
          set -euo pipefail
          batch=${{ matrix.market }}
          tag="crypto-top25-authentic-bch-lineage-$batch"
          origin="$RUNNER_TEMP/bch-fork-source"
          git fetch origin main
          root=public/agent_crypto_erith_ia/data/historical_archive_prototype
          for rel in top250_multisource_coverage/index.json top25_historical_expansion/index.json; do
            a=$(sha256sum "$root/$rel" | cut -d' ' -f1)
            b=$(git show "origin/main:$root/$rel" | sha256sum | cut -d' ' -f1)
            test "$a" = "$b" || { echo "::error::Ranked ownership changed";exit 1; }
          done
          if gh release view "$tag" --json tagName >/dev/null 2>"$RUNNER_TEMP/no-tag.txt"; then
            mkdir -p "$RUNNER_TEMP/prior"
            gh release download "$tag" --pattern manifest.json --dir "$RUNNER_TEMP/prior"
            cmp "$RUNNER_TEMP/prior/manifest.json" "$origin/manifest.json" || {
              echo "::error::Immutable source Release changed";exit 1;
            }
          else
            if ! grep -Eqi 'release not found|HTTP 404|not found' "$RUNNER_TEMP/no-tag.txt"; then
              cat "$RUNNER_TEMP/no-tag.txt";exit 1
            fi
            gh release create "$tag" "$origin"/* --target "$GITHUB_SHA" \
              --title "Original Binance Spot $batch OHLCV verified source" \
              --notes "BCCUSDT before 2018 Bitcoin Cash split, BCHABCUSDT after split. Separate instruments, exact original 1m ZIP + official checksum + SQLite, no synthetic candles, no forced one-to-one chart splice." \
              --latest=false
          fi
          gh release view "$tag" --json assets,isDraft,url > "$RUNNER_TEMP/confirmed.json"
          python - <<'PY'
          import pathlib,os,json
          base=pathlib.Path(os.environ["RUNNER_TEMP"])
          j=json.loads((base/"confirmed.json").read_text())
          files={p.name:p.stat().st_size for p in (base/"bch-fork-source").iterdir()}
          actual={a["name"]:a["size"] for a in j["assets"]}
          assert not j["isDraft"] and files==actual
          print("BCH original source Release published",j["url"],len(actual))
          PY
      - name: Copy manifest as independent provenance artifact
        run: |
          cp "$RUNNER_TEMP/bch-fork-source/manifest.json" "$RUNNER_TEMP/batch-${{ matrix.market }}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: source-bch-fork-${{ matrix.market }}
          path: ${{ runner.temp }}/batch-${{ matrix.market }}.json
          retention-days: 30
      - name: Assert original price catalog and Trader untouched
        if: always()
        run: |
          git diff --exit-code -- \
            public/agent_crypto_erith_ia/trader/ \
            public/agent_crypto_erith_ia/administrator/ \
            public/agent_crypto_erith_ia/data/historical_archive_prototype/top250_multisource_coverage/ \
            public/agent_crypto_erith_ia/data/historical_archive_prototype/top25_historical_expansion/
  consolidate-lineage:
    needs: original-market-source
    if: needs.original-market-source.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: source-bch-fork-*
          merge-multiple: true
          path: ${{ runner.temp }}/bch-fork-evidence
      - name: Reconcile original instruments as separate series
        run: |
          set -euo pipefail
          python - <<'PY'
          import pathlib,json,os,hashlib
          base=pathlib.Path(os.environ["RUNNER_TEMP"])/"bch-fork-evidence"
          docs=[]
          for name in ("bcc-pre-fork","bchabc-2018"):
              raw=(base/f"batch-{name}.json").read_bytes()
              x=json.loads(raw)
              assert x["schema"]=="seven.crypto.top25-source-bch-lineage.v1"
              assert x["source_market_lineage"]["source_original_pair"]==("BCCUSDT" if name=="bcc-pre-fork" else "BCHABCUSDT")
              assert x["target_month_pairs"]==(12 if name=="bcc-pre-fork" else 2)
              assert x["no_synthetic_bars"] and x["pre_fork_and_post_fork_series_not_automatically_spliced"]
              docs.append({"name":name,"source_manifest_sha256":hashlib.sha256(raw).hexdigest(),
                          "source_market":x["original_market_symbol"],
                          "source_months_verified":x["source_verified_month_pairs"],
                          "strict_native_1m":x["strict_utc_aligned_native_rows"],
                          "quarantined_native_rows":x["quarantined_native_rows"],
                          "unverified_source_months":x["unavailable_or_unverified_month_pairs"],
                          "release_page":x["release_page"],
                          "first_listing_official_evidence":x["source_market_lineage"]})
          summary={"schema":"seven.crypto.top25-bch-source-lineage-consolidation.v1",
                   "original_markets_not_merged":True,"source_batch_count":2,
                   "source_month_candidates":14,
                   "verified_source_months":sum(x["source_months_verified"] for x in docs),
                   "original_strict_1m":sum(x["strict_native_1m"] for x in docs),
                   "quarantined_source_rows":sum(x["quarantined_native_rows"] for x in docs),
                   "no_synthetic_rows":True,
                   "bchabc_2019_other_source":"top25_historical_expansion/bchabc_pre_rename/index.json",
                   "bch_2019_other_source":"top25_historical_expansion/collection_index.json",
                   "market_lineage":docs,
                   "warning":"Chain fork BCC→BCHABC differs from market symbol change BCHABC→BCH. Do not automatically splice prices across fork."}
          assert summary["original_strict_1m"]+summary["quarantined_source_rows"]>0
          out=pathlib.Path(os.environ["RUNNER_TEMP"])/"bch-fork-index.json"
          out.write_text(json.dumps(summary,indent=2,sort_keys=True)+"\n")
          print("AUTHENTIC BCH HISTORY",summary["verified_source_months"],summary["original_strict_1m"],summary["quarantined_source_rows"])
          PY
      - name: Commit source evidence indexes only, never price originals or Trader
        run: |
          set -euo pipefail
          root=public/agent_crypto_erith_ia/data/historical_archive_prototype
          folder="$root/top25_historical_expansion/cash_lineage"
          for attempt in 1 2 3; do
            git fetch origin main
            for rel in top250_multisource_coverage/index.json top25_historical_expansion/index.json; do
              a=$(sha256sum "$root/$rel" | cut -d' ' -f1)
              b=$(git show "origin/main:$root/$rel" | sha256sum | cut -d' ' -f1)
              test "$a" = "$b" || { echo "::error::Top25 identity changed";exit 1; }
            done
            git reset --hard origin/main
            mkdir -p "$folder"
            cp "$RUNNER_TEMP/bch-fork-index.json" "$folder/index.json"
            for b in bcc-pre-fork bchabc-2018; do
              cp "$RUNNER_TEMP/bch-fork-evidence/batch-$b.json" "$folder/$b.json"
            done
            git add -- "$folder"
            git diff --cached --check
            if git diff --cached --quiet;then exit 0;fi
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Coffre: preserve original BCC and BCHABC market lineage without price splicing'
            if git push origin HEAD:main;then exit 0;fi
          done
          exit 1
