name: Agent-Crypto 40.4.198 Lazy Commodity Release

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/agent_crypto_40_4_198_release.py'
      - '.github/workflows/agent-crypto-40-4-198-release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Python release syntax gate
        run: python -m py_compile .github/scripts/agent_crypto_40_4_198_release.py

      - name: Apply 40.4.198
        run: python .github/scripts/agent_crypto_40_4_198_release.py

      - name: JavaScript syntax gate
        shell: bash
        run: |
          node --check public/agent_crypto_erith_ia/administrator/app.js
          node --check public/agent_crypto_erith_ia/administrator/js/parallel-markets.js
          node --check public/agent_crypto_erith_ia/administrator/js/market-stack.js
          node --check public/agent_crypto_erith_ia/administrator/js/version-truth.js

      - name: Source Truth and lazy contract gate
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          base=Path('public/agent_crypto_erith_ia')
          for domain,path in [('energy',base/'data/energy/history'),('metals',base/'data/metals/history_long')]:
              for horizon in ('5a','10a','max'):
                  p=json.loads((path/f'{horizon}.json').read_text(encoding='utf-8'))
                  assert p['status']=='ready' and p['domain']==domain and p['horizon']==horizon
                  assert p['schema']=='agent_crypto_commodity_historical_depth_v1'
                  assert p['integrity']['future_continuous_only'] is True
                  assert p['integrity']['spot_semantics_forbidden'] is True
                  assert p['integrity']['lazy_browser_load_required'] is True
                  assert p['integrity']['boot_payload_forbidden'] is True
          manifest=json.loads((base/'administrator/build.json').read_text(encoding='utf-8'))
          assert manifest['build']=='40.4.198' and manifest['engine']=='38.15.11'
          print('Source Truth READY · Energy + Metals · 5a/10a/MAX')
          PY
          git diff --check

      - name: Retire diagnostics and one-shot release files
        shell: bash
        run: |
          rm -f .github/diagnostics/agent_crypto_40_4_198_metals_owner.txt
          rm -f .github/diagnostics/agent_crypto_40_4_198_metals_owner_focus.txt
          rm -f .github/scripts/agent_crypto_40_4_198_metals_owner_extract.py
          rm -f .github/workflows/agent-crypto-40-4-198-metals-owner-extract.yml
          rm -f .github/workflows/agent-crypto-metals-owner-diagnostic.yml
          rm -f .github/scripts/agent_crypto_40_4_198_release.py
          rm -f .github/scripts/agent_crypto_40_4_198_release_fix.py
          rm -f .github/workflows/agent-crypto-40-4-198-release.yml

      - name: Commit release
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'release Agent-Crypto 40.4.198 lazy commodity historical depth'
          git push
