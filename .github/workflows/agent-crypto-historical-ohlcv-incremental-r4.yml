name: Agent Crypto Historical OHLCV R10 Synchronized Hourly Pilot
on:
  workflow_dispatch:
  # GitHub schedules are UTC and may run late; requests always start at the
  # last verified closed OHLCV candle, so timing jitter cannot create gaps.
  schedule:
    - cron: '17 * * * *'
  push:
    branches: [main]
    paths:
      - ".github/workflows/agent-crypto-historical-ohlcv-incremental-r4.yml"
      - "public/agent_crypto_erith_ia/tools/append_historical_top10_ohlcv_r4.py"
      - "public/agent_crypto_erith_ia/tools/build_historical_compact_r9.py"
      - "public/agent_crypto_erith_ia/tools/historical-compact-reader.test.mjs"
      - "public/agent_crypto_erith_ia/administrator/js/historical-compact-reader.js"
      - "public/agent_crypto_erith_ia/administrator/js/historical-vault-automatic.js"
      - "public/agent_crypto_erith_ia/tools/historical-vault-automatic.test.mjs"

permissions:
  contents: write

concurrency:
  group: agent-crypto-ohlcv-r4-incremental
  cancel-in-progress: false

jobs:
  append:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source and archives
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Offline tests · must pass before live requests
        run: |
          python -m py_compile public/agent_crypto_erith_ia/tools/append_historical_top10_ohlcv_r4.py
          python public/agent_crypto_erith_ia/tools/append_historical_top10_ohlcv_r4.py --self-test
      - name: Replay existing archive twice · no network or writes
        run: |
          python public/agent_crypto_erith_ia/tools/append_historical_top10_ohlcv_r4.py --audit-existing
      - name: Append only new closed Binance spot candles
        run: |
          python public/agent_crypto_erith_ia/tools/append_historical_top10_ohlcv_r4.py
      - name: Replay cumulative archive after append
        run: |
          python public/agent_crypto_erith_ia/tools/append_historical_top10_ohlcv_r4.py --audit-existing
      - name: Verify index and immutable delta files
        shell: bash
        run: |
          python - <<'PY'
          import gzip, hashlib, json
          from pathlib import Path
          base=Path("public/agent_crypto_erith_ia/data/historical_archive_prototype/ohlcv_spot_pilot")
          index=json.loads((base/"index.json").read_text(encoding="utf-8"))
          assert index["schema"]=="aerith.public.ohlcv.spot.cumulative.index.v1"
          assert index["quote_asset"]=="USDT"
          assert len(index["coverage"])==21 and index["series_count"]==21
          assert index["candles_total"] >= 4452
          for entry in [index["seed"],*index["deltas"]]:
              content=(base/entry["file"]).read_bytes()
              assert len(content)==entry["bytes"]
              assert hashlib.sha256(content).hexdigest()==entry["sha256"]
              assert gzip.decompress(content)
          print({"R4":"PASS","deltas":len(index["deltas"]),
                 "total_candles":index["candles_total"]})
          PY
      # R10: publish raw append and exact compact projection atomically,
      # avoiding old compact catalogues after a new hourly R8 collection.
      - name: Build compact projection from verified R8 state
        run: |
          python -m py_compile public/agent_crypto_erith_ia/tools/build_historical_compact_r9.py
          python public/agent_crypto_erith_ia/tools/build_historical_compact_r9.py --self-test
          python public/agent_crypto_erith_ia/tools/build_historical_compact_r9.py --build
          python public/agent_crypto_erith_ia/tools/build_historical_compact_r9.py --verify
      - name: Install Node.js 22 for offline browser reader checks
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify targeted browser readers and automatic lazy UI
        run: |
          node --check public/agent_crypto_erith_ia/administrator/js/historical-compact-reader.js
          node --check public/agent_crypto_erith_ia/administrator/js/historical-vault-automatic.js
          node --test public/agent_crypto_erith_ia/tools/historical-compact-reader.test.mjs public/agent_crypto_erith_ia/tools/historical-vault-automatic.test.mjs
      - name: Check R2/R4/R8 source is append-only and compact catalog matches source
        shell: bash
        run: |
          set -euo pipefail
          python public/agent_crypto_erith_ia/tools/build_historical_compact_r9.py --verify
          python - <<'PY'
          import json
          from pathlib import Path
          base=Path("public/agent_crypto_erith_ia/data/historical_archive_prototype")
          raw=json.loads((base/"ohlcv_spot_pilot/index.json").read_text())
          compact=json.loads((base/"compact_v1/index.json").read_text())
          assert compact["candles_total"]==raw["candles_total"]
          assert compact["source_delta_count"]==len(raw["deltas"])
          assert compact["source_index_updated_at"]==raw["updated_at"]
          assert compact["series_count"]==raw["series_count"]==21
          print("R10_SYNC_EQUIVALENCE_PASS",compact["candles_total"])
          PY
      - name: Publish raw OHLCV and compact blocks as one commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- public/agent_crypto_erith_ia/data/historical_archive_prototype/ohlcv_spot_pilot/ public/agent_crypto_erith_ia/data/historical_archive_prototype/compact_v1/
          if git diff --cached --quiet; then
            echo "NOOP: archive and compact projection already aligned"
            exit 0
          fi
          git commit -m "Synchronize verified hourly OHLCV and immutable compact series atomically (R10)"
          git pull --rebase origin main
          git push origin HEAD:main
