name: Agent-Crypto 40.4.198 R1 Runtime Truth

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/agent-crypto-40-4-198-r1-runtime-truth.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Repair all stale 40.4.197 runtime identity owners
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib, json

          base = Path('public/agent_crypto_erith_ia/administrator')
          index_path = base / 'index.html'
          root_path = base / 'app.js'
          admin_path = base / 'js/app.js'
          manifest_path = base / 'version.json'
          mirror_path = base / 'administrator-version.json'

          index = index_path.read_text(encoding='utf-8')
          root = root_path.read_text(encoding='utf-8')
          admin = admin_path.read_text(encoding='utf-8')

          replacements = {
              './app.js?v=administrator-build-40.4.197': './app.js?v=administrator-build-40.4.198',
              './js/app.js?v=administrator-build-40.4.197': './js/app.js?v=administrator-build-40.4.198',
              'id="footerRelease">Agent-Crypto @erith.IA · Market Core · Build 40.4.197 · Version : Parker Lewis Can\'t Lose': 'id="footerRelease">Agent-Crypto @erith.IA · Market Core · Build 40.4.198 · Version : Parker Lewis Can\'t Lose',
          }
          for old, new in replacements.items():
              if old not in index:
                  raise SystemExit(f'missing expected stale index token: {old}')
              index = index.replace(old, new, 1)

          old_root = 'const ATLAS_BUILD = "40.4.197";'
          if old_root not in root:
              raise SystemExit('missing stale ATLAS_BUILD 40.4.197')
          root = root.replace(old_root, 'const ATLAS_BUILD = "40.4.198";', 1)

          old_admin = 'const ADMIN_BUILD = "40.4.197";'
          old_release = 'const ADMIN_RELEASE = "HISTORICAL DEPTH FOUNDATION · LAZY LONG HISTORY · INDICES 5Y 10Y MAX";'
          if old_admin not in admin:
              raise SystemExit('missing stale ADMIN_BUILD 40.4.197')
          if old_release not in admin:
              raise SystemExit('missing stale ADMIN_RELEASE text')
          admin = admin.replace(old_admin, 'const ADMIN_BUILD = "40.4.198";', 1)
          admin = admin.replace(old_release, 'const ADMIN_RELEASE = "COMMODITY HISTORICAL DEPTH · LAZY ENERGY METALS · VERSION TRUTH";', 1)

          index_path.write_text(index, encoding='utf-8')
          root_path.write_text(root, encoding='utf-8')
          admin_path.write_text(admin, encoding='utf-8')

          def digest(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()

          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          files = manifest.get('files')
          if not isinstance(files, dict) or not files:
              raise SystemExit('version.json files hash map missing')

          # Recompute the complete declared payload from the actual tree.
          for rel in list(files):
              payload = base / rel
              if not payload.is_file():
                  raise SystemExit(f'manifest hash target missing: {rel}')
              files[rel] = digest(payload)
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          # Mirror identity derives from the canonical manifest, never from a
          # separately hard-coded release string.
          mirror = json.loads(mirror_path.read_text(encoding='utf-8'))
          mirror['build'] = manifest['build']
          mirror['global_versioning'] = manifest['build']
          mirror['release'] = manifest['release']
          mirror['asset_token'] = manifest['asset_token']
          mirror['parent_build'] = manifest.get('parent_build', '')
          if manifest.get('revision'):
              mirror['revision'] = manifest['revision']
          mirror_files = mirror.get('files')
          if isinstance(mirror_files, dict):
              for rel in list(mirror_files):
                  payload = base / rel
                  if payload.is_file():
                      mirror_files[rel] = digest(payload)
          mirror_path.write_text(json.dumps(mirror, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Runtime syntax and canonical truth gates
        shell: bash
        run: |
          set -euo pipefail
          node --check public/agent_crypto_erith_ia/administrator/app.js
          node --check public/agent_crypto_erith_ia/administrator/js/app.js
          python .github/scripts/agent_crypto_version_truth_guard.py --expected-build 40.4.198 --expected-release 'COMMODITY HISTORICAL DEPTH · LAZY ENERGY METALS · VERSION TRUTH'
          python - <<'PY'
          from pathlib import Path
          base=Path('public/agent_crypto_erith_ia/administrator')
          i=(base/'index.html').read_text(encoding='utf-8')
          r=(base/'app.js').read_text(encoding='utf-8')
          a=(base/'js/app.js').read_text(encoding='utf-8')
          assert './app.js?v=administrator-build-40.4.198' in i
          assert './js/app.js?v=administrator-build-40.4.198' in i
          assert './app.js?v=administrator-build-40.4.197' not in i
          assert './js/app.js?v=administrator-build-40.4.197' not in i
          assert 'id="footerRelease">Agent-Crypto @erith.IA · Market Core · Build 40.4.198 ·' in i
          assert 'const ATLAS_BUILD = "40.4.198";' in r
          assert 'const ATLAS_BUILD = "40.4.197";' not in r
          assert 'const ADMIN_BUILD = "40.4.198";' in a
          assert 'const ADMIN_BUILD = "40.4.197";' not in a
          assert 'const ADMIN_RELEASE = "COMMODITY HISTORICAL DEPTH · LAZY ENERGY METALS · VERSION TRUTH";' in a
          PY

      - name: Remove one-shot workflow and commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/agent-crypto-40-4-198-r1-runtime-truth.yml
          git add \
            public/agent_crypto_erith_ia/administrator/index.html \
            public/agent_crypto_erith_ia/administrator/app.js \
            public/agent_crypto_erith_ia/administrator/js/app.js \
            public/agent_crypto_erith_ia/administrator/version.json \
            public/agent_crypto_erith_ia/administrator/administrator-version.json
          git commit -m 'fix Agent-Crypto 40.4.198 runtime truth and cache lock'
          git push
