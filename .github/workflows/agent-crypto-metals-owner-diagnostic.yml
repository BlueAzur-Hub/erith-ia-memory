name: Agent-Crypto Metals Owner Diagnostic

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/agent-crypto-metals-owner-diagnostic.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Print canonical Metals owner excerpts
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('public/agent_crypto_erith_ia/administrator/app.js')
          text=p.read_text(encoding='utf-8')
          names=[
            'data-metals-period',
            'atlasMetalsUnifiedToolbar',
            'atlasParallelMarketMetalsState',
            'atlasParallelMarketRenderMetals()',
            'atlasMetalsQuoteFoundationRenderChart()',
          ]
          for name in names:
              print('\n' + '='*30 + ' ' + name + ' ' + '='*30)
              positions=[]; start=0
              while True:
                  i=text.find(name,start)
                  if i<0: break
                  positions.append(i); start=i+len(name)
              print('occurrences=',len(positions),positions[:30])
              for n,i in enumerate(positions[:10],1):
                  lo=max(0,i-2200); hi=min(len(text),i+4200)
                  print(f'--- occurrence {n} @ {i} ---')
                  print(text[lo:hi])
          PY
