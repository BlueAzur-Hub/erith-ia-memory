name: Strategy Lab preregistered segmented 2022-2023 RSI45 holdout

on:
  push:
    branches:
      - research/strategy-lab-2022-2023-segmented-rsi45-holdout-20261116
    paths:
      - 'seven_heaven_strategy_lab/tools/segmented_2022_2023_rsi45_holdout.py'
      - 'seven_heaven_strategy_lab/src/**'
      - 'coordination/inter_ai_dialogues/agent_crypto/research/strategy_lab/SEVEN_HEAVEN_STRATEGY_LAB_2022_2023_SOURCE_GATE_AND_SEGMENTED_HOLDOUT_PREREG_2026_11_16.md'
      - '.github/workflows/strategy-lab-segmented-2022-2023-holdout.yml'

permissions:
  contents: read

jobs:
  segmented-holdout:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: seven_heaven_strategy_lab
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /seven_heaven_strategy_lab/
            /coordination/inter_ai_dialogues/agent_crypto/research/strategy_lab/SEVEN_HEAVEN_STRATEGY_LAB_2022_2023_SOURCE_GATE_AND_SEGMENTED_HOLDOUT_PREREG_2026_11_16.md
            /.github/workflows/strategy-lab-segmented-2022-2023-holdout.yml
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify segmented preregistration exists first
        run: |
          set -euo pipefail
          DOC=../coordination/inter_ai_dialogues/agent_crypto/research/strategy_lab/SEVEN_HEAVEN_STRATEGY_LAB_2022_2023_SOURCE_GATE_AND_SEGMENTED_HOLDOUT_PREREG_2026_11_16.md
          test -s "$DOC"
          grep -Fq 'Segment B starts at **2023-03-24 16:00 UTC**' "$DOC"
          grep -Fq 'only change: RSI entry <45' "$DOC"
      - name: Compile V4.6.2 engine and fixed experiment
        run: |
          set -euo pipefail
          python -m py_compile src/engine.py src/observatory.py src/binance_monthly_v46.py tools/segmented_2022_2023_rsi45_holdout.py
      - name: Execute preregistered segmented holdout
        run: |
          set -euo pipefail
          python tools/segmented_2022_2023_rsi45_holdout.py
      - name: Verify immutable decision contract
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("segmented_2022_2023_rsi45_holdout.json").read_text())
          assert d["preregistration"]["only_strategy_parameter_changed"]=="rsi_entry_max"
          assert d["fixed_configuration"]["owner"]["rsi_entry_max"]==61
          assert d["fixed_configuration"]["candidate"]["rsi_entry_max"]==45
          assert d["source"]["segment_a_rows_1h"]==10740
          assert d["source"]["segment_b_rows_1h"]==6776
          assert d["source"]["anomaly_policy"]=="NO_FILL_NO_INTERPOLATION_SPLIT_AND_RESET"
          assert d["safety"]["orders_real"]==0
          assert d["status"] in (
              "PREREGISTERED_SEGMENTED_HYPOTHESIS_SUPPORTED",
              "PREREGISTERED_SEGMENTED_HYPOTHESIS_FAIL",
          )
          print("PASS: segmented preregistered verdict preserved:",d["status"])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: strategy-lab-segmented-2022-2023-rsi45-holdout
          path: seven_heaven_strategy_lab/segmented_2022_2023_rsi45_holdout.json
          retention-days: 30
          if-no-files-found: error
