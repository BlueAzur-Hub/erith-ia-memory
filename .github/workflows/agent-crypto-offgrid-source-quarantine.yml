name: Agent Crypto Original Offgrid Minute Source Quarantine
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/agent-crypto-offgrid-source-quarantine.yml'
      - 'public/agent_crypto_erith_ia/tools/archive_timestamp_anomalous_sources.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: agent-crypto-early-original-offgrid-quarantine
  cancel-in-progress: false
jobs:
  preserve-offgrid-originals:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: crypto-binance-early-offgrid-original-sources
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test source ownership, SQLite original millisecond and no gap insertion
        run: |
          set -euo pipefail
          python -m py_compile public/agent_crypto_erith_ia/tools/archive_timestamp_anomalous_sources.py
          python public/agent_crypto_erith_ia/tools/archive_timestamp_anomalous_sources.py --self-test
      - name: Fail closed if original February and December source anomaly diagnosis has changed
        run: |
          set -euo pipefail
          root=public/agent_crypto_erith_ia/data/historical_archive_prototype
          git fetch origin main
          a=$(sha256sum "$root/top5_original_source_anomalies/index.json" | cut -d' ' -f1)
          b=$(git show "origin/main:$root/top5_original_source_anomalies/index.json" | sha256sum | cut -d' ' -f1)
          test "$a" = "$b" || { echo "::error::Original anomaly report changed";exit 1; }
      - name: Preserve every original source row and exact millisecond in separately quarantined SQLite
        run: |
          set -euo pipefail
          python public/agent_crypto_erith_ia/tools/archive_timestamp_anomalous_sources.py \
            --stage --output "$RUNNER_TEMP/quarantined-originals"
      - name: Independently verify 165650 raw source rows and every immutable file SHA-256
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,pathlib,hashlib
          folder=pathlib.Path(os.environ["RUNNER_TEMP"])/"quarantined-originals"
          d=json.loads((folder/"manifest.json").read_text())
          assert d["status"]=="QUERYABLE_SOURCE_QUARANTINE_NOT_CONTINUOUS_MARKET_HISTORY"
          assert d["source_months"]==4 and d["original_unmodified_native_ohlcv_rows"]==165650
          assert d["original_offgrid_rows"]==43204
          assert d["excluded_from_strict_calendar_1m_catalog"] and d["no_synthetic_candles"]
          files={"manifest.json"}
          for row in d["records"]:
              assert row["sqlite"]["rows"]==row["original_rows"]
              assert row["utc_minute_calendar_aggregation_allowed"] is False
              for key in ("original_source_file","official_checksum","sqlite"):
                  item=row[key]
                  assert item["name"] not in files
                  files.add(item["name"])
                  path=folder/item["name"]
                  assert path.is_file() and path.stat().st_size==item["bytes"]
                  assert hashlib.sha256(path.read_bytes()).hexdigest()==item["sha256"]
          assert files=={p.name for p in folder.iterdir()} and len(files)==13
          print("EARLY 2017-2018 ORIGINAL SOURCE QUARANTINE VALIDATED")
          PY
      - name: Publish original exchange sources as immutable, queryable, isolated GitHub Release
        run: |
          set -euo pipefail
          folder="$RUNNER_TEMP/quarantined-originals"
          root=public/agent_crypto_erith_ia/data/historical_archive_prototype
          git fetch origin main
          original=$(sha256sum "$root/top5_original_source_anomalies/index.json" | cut -d' ' -f1)
          remote=$(git show "origin/main:$root/top5_original_source_anomalies/index.json" | sha256sum | cut -d' ' -f1)
          test "$original" = "$remote" || { echo "::error::Source diagnosis changed"; exit 1; }
          if gh release view "$TAG" --json tagName >/dev/null 2>"$RUNNER_TEMP/error.txt"; then
            mkdir -p "$RUNNER_TEMP/existing"
            gh release download "$TAG" --pattern manifest.json --dir "$RUNNER_TEMP/existing"
            cmp "$RUNNER_TEMP/existing/manifest.json" "$folder/manifest.json" || {
              echo "::error::Existing quarantined manifest differs";exit 1;
            }
          else
            if ! grep -Eqi 'release not found|HTTP 404|not found' "$RUNNER_TEMP/error.txt"; then
              cat "$RUNNER_TEMP/error.txt";exit 1
            fi
            gh release create "$TAG" "$folder"/* \
              --target "$GITHUB_SHA" \
              --title "Unmodified original 2017–2018 Binance Spot offgrid-minute source quarantine" \
              --notes "These 4 original Binance Spot ZIPs and official CHECKSUM files contain 165650 source candles including 43204 off-grid timestamps. Exact original milliseconds and OHLCV preserved in queryable SQLite. Not accepted into strictly UTC-aligned 1m canonical catalogue. No price interpolation." \
              --latest=false
          fi
          gh release view "$TAG" --json assets,isDraft,url > "$RUNNER_TEMP/release.json"
          python - <<'PY'
          import json,os,pathlib
          base=pathlib.Path(os.environ["RUNNER_TEMP"])
          j=json.loads((base/"release.json").read_text())
          actual={a["name"]:a["size"] for a in j["assets"]}
          original={p.name:p.stat().st_size for p in (base/"quarantined-originals").iterdir()}
          assert not j["isDraft"] and actual==original
          print("IMMUTABLE QUARANTINED SOURCE PUBLISHED",j["url"],len(actual))
          PY
      - name: Index source quarantine WITHOUT promoting irregular candles
        run: |
          set -euo pipefail
          root=public/agent_crypto_erith_ia/data/historical_archive_prototype
          file="$root/top5_timestamp_source_quarantine/index.json"
          for attempt in 1 2 3; do
            git fetch origin main
            a=$(sha256sum "$root/top5_original_source_anomalies/index.json" | cut -d' ' -f1)
            b=$(git show "origin/main:$root/top5_original_source_anomalies/index.json" | sha256sum | cut -d' ' -f1)
            test "$a" = "$b" || { echo "::error::Source evidence mismatch"; exit 1; }
            git reset --hard origin/main
            mkdir -p "$(dirname "$file")"
            cp "$RUNNER_TEMP/quarantined-originals/manifest.json" "$file"
            git add -- "$file"
            git diff --cached --check
            if git diff --cached --quiet; then exit 0; fi
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m "Coffre: retain authentic offgrid Binance original 1m in isolated SQLite"
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-offgrid-source-provenance
          path: ${{ runner.temp }}/quarantined-originals/manifest.json
          retention-days: 30
          if-no-files-found: ignore
      - name: Protect original monthly source catalog and all trading app files
        if: always()
        run: |
          git diff --exit-code -- \
            public/agent_crypto_erith_ia/trader/ \
            public/agent_crypto_erith_ia/administrator/ \
            public/agent_crypto_erith_ia/data/historical_archive_prototype/top250_multisource_coverage/ \
            public/agent_crypto_erith_ia/data/historical_archive_prototype/top5_earlier_source_vault/
