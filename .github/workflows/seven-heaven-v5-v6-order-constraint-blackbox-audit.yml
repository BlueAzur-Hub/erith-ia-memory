name: Seven Heaven V5 V6 PAPER Order-Constraint Blackbox Audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/seven-heaven-v5-v6-order-constraint-blackbox-audit.yml'
      - 'coordination/inter_ai_dialogues/agent_crypto/research/strategy_profiles/SEVEN_HEAVEN_V5_V6_OKX_SPOT_QUANTITY_LOTS_FEES_MINIMUM_CONTRACT_AUDIT_2026_11_13.cjs'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: seven-heaven-v5-v6-spot-contract-research
  cancel-in-progress: false

jobs:
  read-only-existing-engines:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout research and unmodified Administrator scripts
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Use Node.js for offline test cases
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regression suite for original V5 engine
        run: node public/agent_crypto_erith_ia/administrator/tests/test-market-microscope-paper-backtest-v5.cjs
      - name: Regression suite for original V6 engine
        run: node public/agent_crypto_erith_ia/administrator/tests/test-market-microscope-orderbook-paper-v6.cjs
      - name: Independent instrument-minimum and lot-size audit
        run: node 'coordination/inter_ai_dialogues/agent_crypto/research/strategy_profiles/SEVEN_HEAVEN_V5_V6_OKX_SPOT_QUANTITY_LOTS_FEES_MINIMUM_CONTRACT_AUDIT_2026_11_13.cjs'
      - name: Archive immutable off-market evidence
        uses: actions/upload-artifact@v4
        with:
          name: seven-heaven-v5-v6-quantity-fee-and-minimum-contract-audit
          path: 'coordination/inter_ai_dialogues/agent_crypto/research/strategy_profiles/seven_heaven_v5_v6_okx_spot_contract_audit_evidence/'
          retention-days: 90
          if-no-files-found: error
      - name: Publish only research evidence, never simulator runtime code
        run: |
          set -euo pipefail
          path='coordination/inter_ai_dialogues/agent_crypto/research/strategy_profiles/seven_heaven_v5_v6_okx_spot_contract_audit_evidence'
          git add -- "$path"
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Already committed: nothing to write'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'research: archive V5 V6 small-order contract blackbox evidence'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
