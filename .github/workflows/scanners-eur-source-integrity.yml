name: All five-mode EUR scanner provenance check
on:
  push:
    branches:
      - test/all-eur-scanners-source-integrity-20261027
    paths:
      - '.github/workflows/scanners-eur-source-integrity.yml'
permissions:
  contents: write
jobs:
  verify-eur-scanners:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/all-eur-scanners-source-integrity-20261027
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /public/agent_crypto_erith_ia/administrator/app.js
            /.github/validation/apply_scanners_eur_integrity.py
            /.github/validation/test_scanners_eur_sources.cjs
            /.github/validation/test_top3_eur_sources.cjs
            /.github/validation/test_top5_eur_sources.cjs
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Demonstrate old EUR scanner accepts USD cache and USD network history
        run: |
          if node --test .github/validation/test_scanners_eur_sources.cjs; then
            echo "Baseline unexpectedly passed"; exit 1
          fi
      - name: Enforce original EUR quote across three scanner presets
        run: python3 .github/validation/apply_scanners_eur_integrity.py
      - name: Verify Top3 Top5 Hausses Baisses Volumes EUR source contracts
        run: |
          node --check public/agent_crypto_erith_ia/administrator/app.js
          node --test .github/validation/test_top3_eur_sources.cjs .github/validation/test_top5_eur_sources.cjs .github/validation/test_scanners_eur_sources.cjs
          test "$(git diff --name-only)" = "public/agent_crypto_erith_ia/administrator/app.js"
          git diff --check
      - name: Commit only tested app.js on EUR staging branch
        run: |
          git config user.name 'erith-ci'
          git config user.email 'erith-ci@users.noreply.github.com'
          git add public/agent_crypto_erith_ia/administrator/app.js
          git commit -m "fix(agent-crypto): proteger les historiques EUR des trois scanners"
          git push origin HEAD:refs/heads/test/all-eur-scanners-source-integrity-20261027
