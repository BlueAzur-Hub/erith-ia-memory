name: Aether Release 40.4.157

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/aether-release-40-4-157.yml

permissions:
  contents: write

concurrency:
  group: aether-agent-crypto-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout canonical main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release driver
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile .github/scripts/aether_release_404157.py

      - name: Apply surgical 40.4.157 release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Aether Release"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          python .github/scripts/aether_release_404157.py
          node --check public/agent_crypto_erith_ia/administrator/js/aether.js
          node --check public/agent_crypto_erith_ia/administrator/js/app.js
          node --check public/agent_crypto_erith_ia/administrator/app.js
          node --check public/agent_crypto_erith_ia/administrator/js/layout-repair.js
          python -m json.tool public/agent_crypto_erith_ia/administrator/version.json >/dev/null
          python -m json.tool public/agent_crypto_erith_ia/administrator/administrator-version.json >/dev/null
          git diff --check

          source /tmp/aether_404157_env
          rm -f .github/workflows/aether-release-40-4-157.yml
          rm -f .github/scripts/aether_release_404157.py

          git add \
            public/agent_crypto_erith_ia/administrator/index.html \
            public/agent_crypto_erith_ia/administrator/app.js \
            public/agent_crypto_erith_ia/administrator/js/app.js \
            public/agent_crypto_erith_ia/administrator/js/aether.js \
            public/agent_crypto_erith_ia/administrator/version.json \
            public/agent_crypto_erith_ia/administrator/administrator-version.json \
            "$ARCHIVE" \
            "$SHA_FILE" \
            .github/workflows/aether-release-40-4-157.yml \
            .github/scripts/aether_release_404157.py

          git diff --cached --check
          git commit -m "feat Agent-Crypto 40.4.157 route French News Sentinel headlines through Aether"
          git push origin HEAD:main

      - name: Verify remote truth
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main

          build="$(git show origin/main:public/agent_crypto_erith_ia/administrator/version.json | python -c 'import json,sys; print(json.load(sys.stdin)["build"])')"
          status="$(git show origin/main:public/agent_crypto_erith_ia/administrator/version.json | python -c 'import json,sys; print(json.load(sys.stdin)["status"])')"
          test "$build" = "40.4.157"
          test "$status" = "aether_news_sentinel_french_live_feed_lock"

          git show origin/main:public/agent_crypto_erith_ia/administrator/js/aether.js | grep -Fq 'return aetherNewsHeadlineFr40104(canonical,fallback);'
          git show origin/main:public/agent_crypto_erith_ia/administrator/js/aether.js | grep -Fq 'news_translation_raw_english_in_aether:false'
          git show origin/main:public/agent_crypto_erith_ia/administrator/js/aether.js | grep -Fq 'news_display_contract_build:"40.4.157"'
          git show origin/main:public/agent_crypto_erith_ia/administrator/js/layout-repair.js | grep -Fq '40.4.156R1'

          git cat-file -e origin/main:coordination/inter_ai_dialogues/agent_crypto/AGENT_CRYPTO_BUILD_40_4_157_AUTO_CANONICAL.zip
          git cat-file -e origin/main:coordination/inter_ai_dialogues/agent_crypto/AGENT_CRYPTO_BUILD_40_4_157_AUTO_CANONICAL.zip.sha256

          if git cat-file -e origin/main:.github/workflows/aether-release-40-4-157.yml 2>/dev/null; then
            echo "temporary workflow still present"
            exit 1
          fi
          if git cat-file -e origin/main:.github/scripts/aether_release_404157.py 2>/dev/null; then
            echo "temporary release driver still present"
            exit 1
          fi

          echo "40.4.157 REMOTE TRUTH PASS"
