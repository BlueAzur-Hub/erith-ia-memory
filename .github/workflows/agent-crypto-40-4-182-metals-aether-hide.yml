name: Agent-Crypto 40.4.182 Metals Aether Feed Mask

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/agent-crypto-40-4-182-metals-aether-hide.yml"

permissions:
  contents: write

concurrency:
  group: agent-crypto-release-40-4-182
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply bounded metals Aether mask and publish 40.4.182
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main

          css='public/agent_crypto_erith_ia/administrator/parallel-markets.css'
          if ! grep -Fq '40.4.182 — METALS AETHER FEED MASK' "$css"; then
          cat >> "$css" <<'CSS'

          /* =========================================================
             40.4.182 — METALS AETHER FEED MASK
             Metals graph focus only. The Aether/Veille/System rotating
             ribbon is not rendered while the Metals domain is active.
             The native status lane remains continuously visible so the
             header keeps one stable physical row and no blank phase.
             Crypto and every other market domain keep their existing feed.
             Presentation only: no data, Atlas, Oracle, Market Core,
             collector, timer, storage, Bridge or financial behavior change.
             ========================================================= */
          html[data-cyclic-market-domain="metals"] body #atlasAetherRibbon4084{
            display:none!important;
            visibility:hidden!important;
            opacity:0!important;
            animation:none!important;
            pointer-events:none!important;
          }

          @media (min-width:901px) and (prefers-reduced-motion:no-preference){
            html[data-cyclic-market-domain="metals"] body #livecheck.command-bar>#btnLivecheck,
            html[data-cyclic-market-domain="metals"] body #livecheck.command-bar>#btnRefresh,
            html[data-cyclic-market-domain="metals"] body #livecheck.command-bar>#decisionCard,
            html[data-cyclic-market-domain="metals"] body #livecheck.command-bar>#sourceActiveCard,
            html[data-cyclic-market-domain="metals"] body #livecheck.command-bar>#sourceTimeCard{
              opacity:1!important;
              visibility:visible!important;
              animation:none!important;
            }
          }
          CSS
          fi

          python - <<'PY'
          from pathlib import Path
          base=Path('public/agent_crypto_erith_ia/administrator')
          for rel in ('js/market-stack.js','js/parallel-markets.js'):
              path=base/rel
              text=path.read_text(encoding='utf-8')
              old='const BUILD = "40.4.181";'
              if text.count(old) != 1:
                  raise SystemExit(f'{rel}: expected one 40.4.181 BUILD, got {text.count(old)}')
              path.write_text(text.replace(old,'const BUILD = "40.4.182";',1),encoding='utf-8')

          index=base/'index.html'
          text=index.read_text(encoding='utf-8')
          old='administrator-build-40.4.181'
          if text.count(old) < 4:
              raise SystemExit(f'index 40.4.181 cache token count unexpectedly low: {text.count(old)}')
          index.write_text(text.replace(old,'administrator-build-40.4.182'),encoding='utf-8')
          PY

          cat > /tmp/contract-404182.json <<'JSON'
          {
            "schema": "erith.admin.metals-aether-feed-mask.v1",
            "build": "40.4.182",
            "parent_build": "40.4.181",
            "metals_aether_ribbon_hidden": true,
            "metals_native_status_lane_continuous": true,
            "crypto_aether_feed_changed": false,
            "other_market_domains_changed": false,
            "data_contract_changed": false,
            "chart_engine_changed": false,
            "market_core_modified": false,
            "atlas_runtime_modified": false,
            "new_timer": false,
            "new_observer": false,
            "new_fetch": false,
            "bridge_modified": false,
            "financial_execution_added": false
          }
          JSON

          python .github/scripts/agent_crypto_release_driver.py \
            --build 40.4.182 --parent 40.4.181 \
            --release 'METALS GRAPH AETHER FEED MASK · CRYPTO GEOMETRY CONTINUITY' \
            --status metals_graph_aether_feed_mask_crypto_geometry_continuity \
            --contract-key metals_aether_feed_mask_404182 \
            --contract-json /tmp/contract-404182.json \
            --lineage-note '40.4.182 Metals Graph Aether Feed Mask: Aether/Veille/System ribbon is hidden only while the Metals domain is active; the native status lane remains continuously visible; Crypto and other market domains are unchanged.'

          node --check public/agent_crypto_erith_ia/administrator/app.js
          node --check public/agent_crypto_erith_ia/administrator/js/app.js
          node --check public/agent_crypto_erith_ia/administrator/js/market-stack.js
          node --check public/agent_crypto_erith_ia/administrator/js/parallel-markets.js
          python .github/scripts/agent_crypto_version_truth_guard.py \
            --expected-build 40.4.182 \
            --expected-release 'METALS GRAPH AETHER FEED MASK · CRYPTO GEOMETRY CONTINUITY'

          git rm .github/workflows/agent-crypto-40-4-182-metals-aether-hide.yml
          git add public/agent_crypto_erith_ia/administrator/parallel-markets.css \
                  public/agent_crypto_erith_ia/administrator/js/market-stack.js \
                  public/agent_crypto_erith_ia/administrator/js/parallel-markets.js \
                  public/agent_crypto_erith_ia/administrator/app.js \
                  public/agent_crypto_erith_ia/administrator/js/app.js \
                  public/agent_crypto_erith_ia/administrator/index.html \
                  public/agent_crypto_erith_ia/administrator/version.json \
                  public/agent_crypto_erith_ia/administrator/administrator-version.json

          git status --short
          git commit -m "release Agent-Crypto 40.4.182 metals Aether feed mask"

          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            echo "release push retry ${attempt}/5"
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 2))
          done
          exit 1
