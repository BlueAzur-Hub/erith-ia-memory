name: Archive Agent-Crypto Administrator 40.6.647
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: agent-crypto-647-release-zip
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Validate and create archive
        shell: bash
        run: |
          set -euo pipefail
          base="public/agent_crypto_erith_ia/administrator"
          shared="coordination/inter_ai_dialogues/agent_crypto"
          test "$(node -p "JSON.parse(require('fs').readFileSync('$base/build.json', 'utf8')).build")" = "40.6.647"
          node --check "$base/app.js"
          mkdir -p "$RUNNER_TEMP/agent-crypto-release"
          cp "$base/app.js" "$RUNNER_TEMP/agent-crypto-release/app.js"
          cp "$base/index.html" "$RUNNER_TEMP/agent-crypto-release/index.html"
          cp "$base/build.json" "$RUNNER_TEMP/agent-crypto-release/build.json"
          cp "$shared/AGENT_CRYPTO_ADMINISTRATOR_40.6.647_HAUSSES5_EUR_REAL_ANCHOR_RELEASE_NOTES.md" "$RUNNER_TEMP/agent-crypto-release/RELEASE_NOTES.md"
          (cd "$RUNNER_TEMP/agent-crypto-release" && zip -9 "AGENT_CRYPTO_ADMINISTRATOR_40.6.647_HAUSSES5_EUR_REAL_ANCHOR_4_FILES.zip" app.js index.html build.json RELEASE_NOTES.md)
          cp "$RUNNER_TEMP/agent-crypto-release/AGENT_CRYPTO_ADMINISTRATOR_40.6.647_HAUSSES5_EUR_REAL_ANCHOR_4_FILES.zip" "$shared/AGENT_CRYPTO_ADMINISTRATOR_40.6.647_HAUSSES5_EUR_REAL_ANCHOR_4_FILES.zip"
          (cd "$shared" && sha256sum "AGENT_CRYPTO_ADMINISTRATOR_40.6.647_HAUSSES5_EUR_REAL_ANCHOR_4_FILES.zip" > "AGENT_CRYPTO_ADMINISTRATOR_40.6.647_HAUSSES5_EUR_REAL_ANCHOR_4_FILES.zip.sha256")
          unzip -t "$shared/AGENT_CRYPTO_ADMINISTRATOR_40.6.647_HAUSSES5_EUR_REAL_ANCHOR_4_FILES.zip"
      - name: Commit release zip and checksum
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "coordination/inter_ai_dialogues/agent_crypto/AGENT_CRYPTO_ADMINISTRATOR_40.6.647_HAUSSES5_EUR_REAL_ANCHOR_4_FILES.zip" "coordination/inter_ai_dialogues/agent_crypto/AGENT_CRYPTO_ADMINISTRATOR_40.6.647_HAUSSES5_EUR_REAL_ANCHOR_4_FILES.zip.sha256"
          git diff --cached --quiet && exit 0
          git commit -m "Archive Administrator 40.6.647 Hausses 5 EUR release and checksum"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
