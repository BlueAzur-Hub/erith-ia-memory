name: Aether Agent-Crypto 40.4.251 release

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/aether-release-40-4-251.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch 40.4.251
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json, hashlib, re

          root = Path('public/agent_crypto_erith_ia/administrator')
          OLD='40.4.250'
          NEW='40.4.251'
          RELEASE='TECHNICAL READING FRAMING · CHRONOS CENTER TRUTH LOCK'
          STATUS='technical_reading_framing_chronos_center_truth_lock_404251'

          current=json.loads((root/'version.json').read_text(encoding='utf-8'))
          if current.get('build') != OLD:
              raise SystemExit(f'STOP: expected {OLD}, got {current.get("build")}')
          if str((current.get('engine') or {}).get('reference_build')) != '38.15.11':
              raise SystemExit('STOP: Market Core drift')

          # Technical Reading private framing truth.
          p=root/'index.html'
          t=p.read_text(encoding='utf-8')
          t=t.replace('<meta name="atlas-build" content="40.4.250" />','<meta name="atlas-build" content="40.4.251" />')
          t=t.replace('<meta name="administrator-build" content="40.4.250" />','<meta name="administrator-build" content="40.4.251" />')
          t=t.replace('<meta name="administrator-release" content="MARKETS · FIVE-MARKET STATIC FREEZE CANDIDATE" />',f'<meta name="administrator-release" content="{RELEASE}" />')
          t=t.replace('market-core-v2.0-alpha-build-40.4.250','market-core-v2.0-alpha-build-40.4.251')
          t=t.replace('Agent-Crypto @erith.IA — Build 40.4.250 · Administrator','Agent-Crypto @erith.IA — Build 40.4.251 · Administrator')
          t=t.replace('Version Agent-Crypto installée : Build 40.4.250, mode Administrator','Version Agent-Crypto installée : Build 40.4.251, mode Administrator')
          t=t.replace('>Build 40.4.250</span>','>Build 40.4.251</span>')
          t=t.replace('Agent-Crypto @erith.IA · Market Core · Build 40.4.250 · Version : Parker Lewis Can\'t Lose','Agent-Crypto @erith.IA · Market Core · Build 40.4.251 · Version : Parker Lewis Can\'t Lose')
          t=t.replace('./parallel-markets.css?v=40.4.250','./parallel-markets.css?v=40.4.251')
          t=t.replace('./js/views/system-presentation.js?v=administrator-build-40.4.250','./js/views/system-presentation.js?v=administrator-build-40.4.251')
          t=t.replace('./app.js?v=administrator-build-40.4.250','./app.js?v=administrator-build-40.4.251')
          t=t.replace('./js/parallel-markets.js?v=40.4.250','./js/parallel-markets.js?v=40.4.251')
          t=t.replace('./js/version-truth.js?v=40.4.250','./js/version-truth.js?v=40.4.251')
          t=t.replace('<link rel="stylesheet" href="./admin-chronos.css" />','<link rel="stylesheet" href="./admin-chronos.css?v=administrator-build-40.4.251" />')

          anchor='  const techHost=()=>document.querySelector("#detailPanel .detail-project-visual");'
          if 'normalizePrivateFraming404251' not in t:
              block='''  /* 40.4.251 — FRAMING TRUTH LOCK. Historical 50/12 private fallback\n     is interpreted as centered without rewriting operator IndexedDB. */\n  function normalizePrivateFraming404251(framing){\n    const rawX=Number.parseFloat(framing?.x),rawY=Number.parseFloat(framing?.y);\n    const x=Number.isFinite(rawX)?Math.min(100,Math.max(0,rawX)):50;\n    let y=Number.isFinite(rawY)?Math.min(100,Math.max(0,rawY)):50;\n    if(Math.abs(x-50)<.001&&Math.abs(y-12)<.001)y=50;\n    return {x,y};\n  }\n'''
              if anchor not in t: raise SystemExit('STOP: technical anchor missing')
              t=t.replace(anchor,block+anchor,1)
          t=t.replace('framing:{x:50,y:12},updated_at:new Date().toISOString()','framing:normalizePrivateFraming404251(null),updated_at:new Date().toISOString()')
          t=t.replace('setFraming(theme,framing||{x:50,y:12});','setFraming(theme,normalizePrivateFraming404251(framing));')
          t=t.replace('p.classList.add("atlas-tech-static-cycle","atlas-tech-letterbox-fill-40230","atlas-tech-frame-lock-40259","atlas-classic-web-tech-40261");','p.classList.add("atlas-tech-static-cycle","atlas-classic-web-tech-40261");p.classList.remove("atlas-tech-letterbox-fill-40230","atlas-tech-frame-lock-40259");')
          p.write_text(t,encoding='utf-8')

          # Chronos: repair the actual parent layout owner. No child offsets.
          p=root/'admin-chronos.css'
          c=p.read_text(encoding='utf-8')
          old='''#sourceTimeCard{\n  overflow:hidden;\n}\n'''
          new='''#sourceTimeCard{\n  /* 40.4.251 — CHRONOS CENTER TRUTH LOCK.\n     The clock is one semantic flex group; the parent card owns centering. */\n  display:grid !important;\n  grid-template-columns:minmax(0,1fr) !important;\n  align-items:center !important;\n  justify-items:stretch !important;\n  overflow:hidden;\n}\n'''
          if old not in c: raise SystemExit('STOP: Chronos parent owner not found')
          c=c.replace(old,new,1)
          c=c.replace('  margin:2px 0 0 !important;\n  white-space:nowrap !important;','  margin:0 !important;\n  text-align:center !important;\n  white-space:nowrap !important;',1)
          p.write_text(c,encoding='utf-8')

          # Runtime identity only; no engine behavior changes.
          for rel in ['app.js','js/app.js','js/views/system-presentation.js','parallel-markets.css']:
              p=root/rel
              s=p.read_text(encoding='utf-8')
              s=s.replace(OLD,NEW).replace('TECHNICAL READING · PORTRAIT FRAMING TRUTH LOCK',RELEASE).replace('MARKETS · FIVE-MARKET STATIC FREEZE CANDIDATE',RELEASE)
              p.write_text(s,encoding='utf-8')

          contract_framing={
            'build':NEW,'parent':OLD,'scope':'technical_reading_portrait_framing_truth_lock',
            'private_default_framing':'50/50','legacy_50_12_interpreted_as_center':True,
            'indexeddb_rewrite':False,'legacy_letterbox_runtime_classes_removed':True,
            'technical_reading_geometry_changed':False,'rnd_library_changed':False,
            'market_core_changed':False,'protected_market_core':'38.15.11',
            'firefox_operator_validation_required':True
          }
          contract_chronos={
            'build':NEW,'parent':OLD,'scope':'chronos_parent_grid_center_lock',
            'owner':'admin-chronos.css','parent_layout_owner':'#sourceTimeCard',
            'clock_group':'#atlasCelestialClockHeader','source_card_grid_restored':True,
            'clock_group_full_width':True,'clock_group_centered_as_one_unit':True,
            'internal_spans_moved_individually':False,'chronos_runtime_changed':False,
            'planetary_math_changed':False,'market_core_changed':False,
            'protected_market_core':'38.15.11','firefox_operator_validation_required':True
          }

          for name in ['build.json','version.json','administrator-version.json']:
              p=root/name
              d=json.loads(p.read_text(encoding='utf-8'))
              d['build']=NEW; d['release']=RELEASE; d['status']=STATUS
              if name=='build.json': d['published']=False
              else:
                  d['asset_token']=f'market-core-v2.0-alpha-build-{NEW}'
                  d['parent_build']=OLD
                  if name=='administrator-version.json': d['global_versioning']=NEW
                  d.setdefault('contracts',{})['technical_reading_portrait_framing_truth_lock_404251']=contract_framing
                  d.setdefault('contracts',{})['chronos_parent_grid_center_lock_404251']=contract_chronos
                  note='40.4.251 — Technical Reading framing truth + Chronos parent center lock; no market/Atlas/Math/Bridge/Market Core behavior change.'
                  if isinstance(d.get('release_notes'),list) and note not in d['release_notes']: d['release_notes'].insert(0,note)
                  if isinstance(d.get('lineage'),str) and '40.4.251' not in d['lineage']:
                      d['lineage'] += ' → 40.4.251 locks Technical Reading framing truth and restores Chronos parent grid centering without changing market engines or Market Core'
              p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          # Hash truth after every payload is final except version.json itself.
          vp=root/'version.json'; v=json.loads(vp.read_text(encoding='utf-8'))
          for rel in ['admin-chronos.css','index.html','app.js','js/app.js','js/views/system-presentation.js','parallel-markets.css','build.json','administrator-version.json']:
              if rel in v.get('files',{}): v['files'][rel]=hashlib.sha256((root/rel).read_bytes()).hexdigest()
          vp.write_text(json.dumps(v,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          # Static invariants.
          idx=(root/'index.html').read_text(encoding='utf-8')
          chron=(root/'admin-chronos.css').read_text(encoding='utf-8')
          assert 'framing:{x:50,y:12}' not in idx
          assert 'normalizePrivateFraming404251' in idx
          assert 'display:grid !important;' in chron
          assert 'grid-template-columns:minmax(0,1fr) !important;' in chron
          assert 'justify-content:center !important;' in chron
          assert 'text-align:center !important;' in chron
          assert 'translateX' not in chron
          v=json.loads((root/'version.json').read_text(encoding='utf-8'))
          assert v['build']==NEW and v['parent_build']==OLD
          assert v['engine']['reference_build']=='38.15.11' and v['engine']['status']=='protected'
          for rel,expected in (v.get('files') or {}).items():
              fp=root/rel
              if not fp.is_file(): raise SystemExit(f'STOP: manifest file missing {rel}')
              actual=hashlib.sha256(fp.read_bytes()).hexdigest()
              if actual!=expected: raise SystemExit(f'STOP: hash mismatch {rel}')
          ids=re.findall(r'\bid=["\']([^"\']+)["\']',idx)
          if len(ids)!=len(set(ids)): raise SystemExit('STOP: duplicate HTML IDs')
          PY

      - name: JavaScript syntax gates
        shell: bash
        run: |
          set -euo pipefail
          ROOT=public/agent_crypto_erith_ia/administrator
          node --check "$ROOT/app.js"
          node --check "$ROOT/js/app.js"
          node --check "$ROOT/js/views/system-presentation.js"
          python - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          t=Path('public/agent_crypto_erith_ia/administrator/index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',t,flags=re.S|re.I)
          for i,s in enumerate(scripts):
              if not s.strip(): continue
              p=Path('/tmp')/f'inline_{i}.js'; p.write_text(s,encoding='utf-8')
              subprocess.run(['node','--check',str(p)],check=True)
          PY

      - name: Build changed-files ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/release
          python - <<'PY'
          from pathlib import Path
          import zipfile, hashlib
          root=Path('public/agent_crypto_erith_ia/administrator')
          out=Path('/tmp/release/AGENT_CRYPTO_BUILD_40_4_251_TECHNICAL_READING_FRAMING_CHRONOS_CENTER_TRUTH_LOCK_CHANGED_FILES.zip')
          files=['build.json','version.json','administrator-version.json','index.html','app.js','js/app.js','js/views/system-presentation.js','parallel-markets.css','admin-chronos.css']
          with zipfile.ZipFile(out,'w',zipfile.ZIP_DEFLATED,compresslevel=9) as z:
              for rel in files: z.write(root/rel, f'public/agent_crypto_erith_ia/administrator/{rel}')
          print('ZIP_SHA256='+hashlib.sha256(out.read_bytes()).hexdigest())
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: AGENT_CRYPTO_BUILD_40_4_251_TECHNICAL_READING_FRAMING_CHRONOS_CENTER_TRUTH_LOCK_CHANGED_FILES
          path: /tmp/release/AGENT_CRYPTO_BUILD_40_4_251_TECHNICAL_READING_FRAMING_CHRONOS_CENTER_TRUTH_LOCK_CHANGED_FILES.zip
          retention-days: 30

      - name: Commit release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Aether Release Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/agent_crypto_erith_ia/administrator
          git commit -m "agent-crypto: build 40.4.251 lock Technical Reading framing and Chronos center"
          git push origin HEAD:main
