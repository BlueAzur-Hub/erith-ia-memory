name: Agent-Crypto 40.4.267 Human Readability

on:
  push:
    branches: [ main ]
    paths:
      - '.github/scripts/agent_crypto_404267_human_readability.py'
      - '.github/workflows/agent-crypto-404267-human-readability.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: agent-crypto-404267-human-readability
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configure release identity
        run: |
          git config user.name 'Seven Heaven Release'
          git config user.email 'actions@users.noreply.github.com'

      - name: Rebase on current main
        run: git pull --rebase origin main

      - name: Build validate and package 40.4.267
        run: python .github/scripts/agent_crypto_404267_human_readability.py

      - name: Commit release and retire temporary tooling
        run: |
          git rm --ignore-unmatch .github/scripts/agent_crypto_404267_human_readability.py
          git rm --ignore-unmatch .github/workflows/agent-crypto-404267-human-readability.yml
          git add -A
          git commit -m 'agent-crypto: build 40.4.267 simulation human readability and auto runner operator view lock'
          git pull --rebase origin main
          node --check public/agent_crypto_erith_ia/administrator/app.js
          python .github/scripts/agent_crypto_version_truth_guard.py --expected-build 40.4.267 --expected-release 'SIMULATION HUMAN READABILITY · AUTO RUNNER OPERATOR VIEW LOCK'
          git push origin HEAD:main

      - name: Upload differential release artifact
        uses: actions/upload-artifact@v4
        with:
          name: AGENT_CRYPTO_40_4_267_SIMULATION_HUMAN_READABILITY_AUTO_RUNNER_OPERATOR_VIEW
          path: |
            coordination/inter_ai_dialogues/agent_crypto/AGENT_CRYPTO_40_4_267_SIMULATION_HUMAN_READABILITY_AUTO_RUNNER_OPERATOR_VIEW.zip
            coordination/inter_ai_dialogues/agent_crypto/AGENT_CRYPTO_40_4_267_SIMULATION_HUMAN_READABILITY_AUTO_RUNNER_OPERATOR_VIEW_SHA256.txt
          if-no-files-found: error
          retention-days: 30
