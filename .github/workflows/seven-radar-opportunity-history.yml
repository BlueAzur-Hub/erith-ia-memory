name: Seven Radar Opportunity History
on:
  workflow_dispatch:
  schedule:
    - cron: "31 7 * * *"
permissions:
  contents: write
concurrency:
  group: seven-radar-opportunity-history
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Archive existing public snapshots only
        shell: bash
        run: |
          set -euo pipefail
          node public/agent_crypto_erith_ia/tools/test-radar-opportunity-history.cjs
          node public/agent_crypto_erith_ia/tools/test_seven_capital_scout.cjs
          node public/agent_crypto_erith_ia/tools/test_seven_spot_gate.cjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            node public/agent_crypto_erith_ia/tools/radar_opportunity_history.cjs
            python -m unittest discover -s public/agent_crypto_erith_ia/tools -p test_radar_spot_paper_audit.py
            python public/agent_crypto_erith_ia/tools/radar_spot_paper_audit.py
            # Same daily public archive, NO exchange/order access or separate scheduler.
            node public/agent_crypto_erith_ia/tools/seven_capital_scout.cjs
            # Public OKX Spot/USDC instrument + five-level bid/ask PRECHECK.
            # No account, order placement, fills, secrets or private Bridge.
            node public/agent_crypto_erith_ia/tools/seven_spot_gate.cjs
            git add -- public/agent_crypto_erith_ia/data/crypto/radar-opportunities/ public/agent_crypto_erith_ia/data/trader_flux/seven_capital_scout/status.json public/agent_crypto_erith_ia/data/trader_flux/seven_capital_scout/spot_gate.json
            if git diff --cached --quiet; then
              echo "No new observation; archived dates remain immutable."
              exit 0
            fi
            git commit -m "Archive public Radar opportunity observations (no orders)"
            if git push origin HEAD:main; then
              echo "Radar observation history published."
              exit 0
            fi
            echo "Remote changed during archive; retrying using current sources."
            sleep "$((attempt * 3))"
          done
          echo "Could not publish after retries; no fabricated observation." >&2
          exit 1
