name: Agent-Crypto 40.6.74 R1 Entry Cache Truth

on:
  push:
    paths:
      - '.github/workflows/agent-crypto-406074-r1-entry-cache.yml'

permissions:
  contents: write

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Publish R1 entry cache truth
        shell: python
        run: |
          from pathlib import Path
          path = Path('public/agent_crypto_erith_ia/administrator/index.html')
          text = path.read_text(encoding='utf-8')
          replacements = (
              ('<meta name="administrator-release" content="AETHER V2 · CANONICAL FRAME / READABILITY" />', '<meta name="administrator-release" content="AETHER V2 · CANONICAL FRAME / READABILITY · R1" />'),
              ('./js/aether-role-visibility-406050.js?v=administrator-build-40.6.74', './js/aether-role-visibility-406050.js?v=administrator-build-40.6.74-r1'),
          )
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'missing expected token: {old}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')

      - name: Self-remove one-shot workflow
        run: git rm .github/workflows/agent-crypto-406074-r1-entry-cache.yml

      - name: Commit R1 entry truth
        run: |
          git config user.name "BlueAzur-Hub"
          git config user.email "Blue.Azur@protonmail.com"
          git add public/agent_crypto_erith_ia/administrator/index.html
          git commit -m "fix(agent-crypto): expose 40.6.74 R1 Aether cache truth"
          git push origin HEAD:main
