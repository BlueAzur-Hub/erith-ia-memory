name: Seven Crypto Knowledge Validation
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'public/agent_crypto_erith_ia/data/crypto/research/**'
      - 'public/agent_crypto_erith_ia/laboratoire/crypto-knowledge.html'
      - 'public/agent_crypto_erith_ia/administrator/app.js'
      - 'public/agent_crypto_erith_ia/administrator/index.html'
      - 'public/agent_crypto_erith_ia/administrator/js/okx-public-chart-history.js'
      - 'public/agent_crypto_erith_ia/administrator/js/test-okx-public-chart-history.cjs'
      - 'public/agent_crypto_erith_ia/laboratoire/spot-comparison-paper*'
      - 'public/agent_crypto_erith_ia/laboratoire/CARTOGRAPHIE_CRYPTO_USAGES_ET_CIBLES.md'
      - 'public/agent_crypto_erith_ia/administrator/js/market-radar-native.js'
      - 'public/agent_crypto_erith_ia/trader/quack-ai-case-study.html'
      - 'public/agent_crypto_erith_ia/tools/test-crypto-knowledge.cjs'
      - '.github/workflows/seven-crypto-knowledge.yml'
  push:
    branches: [main]
    paths:
      - 'public/agent_crypto_erith_ia/data/crypto/research/**'
      - 'public/agent_crypto_erith_ia/laboratoire/crypto-knowledge.html'
      - 'public/agent_crypto_erith_ia/administrator/app.js'
      - 'public/agent_crypto_erith_ia/administrator/index.html'
      - 'public/agent_crypto_erith_ia/administrator/js/okx-public-chart-history.js'
      - 'public/agent_crypto_erith_ia/administrator/js/test-okx-public-chart-history.cjs'
      - 'public/agent_crypto_erith_ia/laboratoire/spot-comparison-paper*'
      - 'public/agent_crypto_erith_ia/administrator/js/market-radar-native.js'
      - 'public/agent_crypto_erith_ia/trader/quack-ai-case-study.html'
      - 'public/agent_crypto_erith_ia/tools/test-crypto-knowledge.cjs'
      - '.github/workflows/seven-crypto-knowledge.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate knowledge base and HTML wiring (offline)
        run: node public/agent_crypto_erith_ia/tools/test-crypto-knowledge.cjs
      - name: Regression legacy Radar
        run: node public/agent_crypto_erith_ia/laboratoire/test-radar.cjs
      - name: Validate live Administrator native Spot wiring without HTTP
        run: |
          node --test public/agent_crypto_erith_ia/administrator/js/test-okx-public-chart-history.cjs
          node --check public/agent_crypto_erith_ia/administrator/app.js
      - name: Verify the 3-market PAPER model offline
        run: node --test public/agent_crypto_erith_ia/laboratoire/test-spot-comparison-paper.cjs
      - name: Validate comparator engine syntax
        run: node --check public/agent_crypto_erith_ia/laboratoire/spot-comparison-paper-core.cjs
