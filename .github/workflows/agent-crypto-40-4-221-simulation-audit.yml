name: Agent-Crypto 40.4.221 Simulation Profile Audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/agent-crypto-40-4-221-simulation-audit.yml'
      - '.github/scripts/_tmp_agent_crypto_404221_simulation_audit.py'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout canonical main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Audit Simulation dual profile owners
        run: python .github/scripts/_tmp_agent_crypto_404221_simulation_audit.py
