name: Agent-Crypto 40.4.221 Simulation Profile Audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/agent-crypto-40-4-221-simulation-audit.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout canonical main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Audit Simulation dual profile owners
        run: python .github/scripts/_tmp_agent_crypto_404221_simulation_audit.py > .github/_tmp_agent_crypto_404221_simulation_audit.txt
      - name: Publish temporary audit report
        run: |
          git config user.name "Aether Audit"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/_tmp_agent_crypto_404221_simulation_audit.txt
          git commit -m "chore(agent-crypto): publish temporary 40.4.221 simulation audit report"
          git pull --rebase origin main
          git push origin HEAD:main
