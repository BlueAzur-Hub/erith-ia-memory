name: Atlas Public Historical Depth

on:
  workflow_dispatch:
  schedule:
    - cron: "42 2 * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/atlas-public-historical-depth.yml"
      - "public/agent_crypto_erith_ia/tools/collect_public_historical_depth.py"

permissions:
  contents: write

concurrency:
  group: atlas-public-historical-depth-${{ github.ref }}
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install collector dependencies
        run: python -m pip install --disable-pip-version-check requests==2.32.5 curl-cffi==0.15.0
      - name: Collect long historical indices archive
        run: >-
          python public/agent_crypto_erith_ia/tools/collect_public_historical_depth.py
          --root public/agent_crypto_erith_ia
          --timeout 25
          --pacing 1.6
      - name: Validate lazy history contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path("public/agent_crypto_erith_ia/data/indices/history")
          status=json.loads((root/"status.json").read_text(encoding="utf-8"))
          assert status.get("status")=="ready", status
          for horizon in ("5a","10a","max"):
              payload=json.loads((root/f"{horizon}.json").read_text(encoding="utf-8"))
              assert payload.get("schema")=="agent_crypto_historical_depth_v1", horizon
              assert payload.get("status")=="ready", horizon
              assert int(payload.get("assets_count") or 0)==5, horizon
              assert payload.get("resolution")=="1wk", horizon
              integrity=payload.get("integrity") or {}
              assert integrity.get("no_invented_values") is True, horizon
              assert integrity.get("lazy_browser_load_required") is True, horizon
              assert integrity.get("boot_payload_forbidden") is True, horizon
              for asset in payload.get("assets") or []:
                  points=asset.get("history_points") or []
                  assert len(points)>=12, (horizon,asset.get("symbol"))
                  assert all(isinstance(p.get("close"),(int,float)) and p.get("time") for p in points)
          print({"status":"ready","horizons":["5a","10a","max"],"lazy":True})
          PY
      - name: Commit historical archive
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/agent_crypto_erith_ia/data/indices/history
          if git diff --cached --quiet; then
            echo "No historical archive change."
            exit 0
          fi
          git commit -m "archive public indices historical depth"
          git pull --rebase origin main
          git push origin HEAD:main
