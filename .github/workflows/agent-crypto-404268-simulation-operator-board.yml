name: Agent-Crypto 40.4.268 Simulation Operator Board

on:
  push:
    branches: [ main ]
    paths:
      - '.github/scripts/agent_crypto_404268_simulation_operator_board.py'
      - '.github/workflows/agent-crypto-404268-simulation-operator-board.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: agent-crypto-404268-simulation-operator-board
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configure release identity
        run: |
          git config user.name 'Seven Heaven Release'
          git config user.email 'actions@users.noreply.github.com'

      - name: Rebase on current main
        run: git pull --rebase origin main

      - name: Build validate and package 40.4.268
        run: python .github/scripts/agent_crypto_404268_simulation_operator_board.py

      - name: Commit release and retire temporary tooling
        run: |
          git rm --ignore-unmatch .github/scripts/agent_crypto_404268_simulation_operator_board.py
          git rm --ignore-unmatch .github/workflows/agent-crypto-404268-simulation-operator-board.yml
          git add -A
          git commit -m 'agent-crypto: build 40.4.268 simulation operator board simple human view lock'
          git pull --rebase origin main
          node --check public/agent_crypto_erith_ia/administrator/app.js
          python .github/scripts/agent_crypto_version_truth_guard.py --expected-build 40.4.268 --expected-release 'SIMULATION OPERATOR BOARD · SIMPLE HUMAN VIEW LOCK'
          git push origin HEAD:main

      - name: Upload differential release artifact
        uses: actions/upload-artifact@v4
        with:
          name: AGENT_CRYPTO_40_4_268_SIMULATION_OPERATOR_BOARD_SIMPLE_HUMAN_VIEW
          path: |
            coordination/inter_ai_dialogues/agent_crypto/AGENT_CRYPTO_40_4_268_SIMULATION_OPERATOR_BOARD_SIMPLE_HUMAN_VIEW.zip
            coordination/inter_ai_dialogues/agent_crypto/AGENT_CRYPTO_40_4_268_SIMULATION_OPERATOR_BOARD_SIMPLE_HUMAN_VIEW_SHA256.txt
          if-no-files-found: error
          retention-days: 30
