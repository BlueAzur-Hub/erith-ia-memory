name: Atlas Public Commodity Historical Depth

on:
  workflow_dispatch:
  schedule:
    - cron: "12 3 * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/atlas-public-commodity-historical-depth.yml"
      - "public/agent_crypto_erith_ia/tools/collect_public_commodity_historical_depth.py"

permissions:
  contents: write

concurrency:
  group: atlas-public-commodity-historical-depth-${{ github.ref }}
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install collector dependencies
        run: python -m pip install --disable-pip-version-check requests==2.32.5 curl-cffi==0.15.0
      - name: Collect Energy and Metals long Futures history
        run: >-
          python public/agent_crypto_erith_ia/tools/collect_public_commodity_historical_depth.py
          --root public/agent_crypto_erith_ia
          --domain all
          --timeout 25
          --pacing 1.5
      - name: Validate commodity historical Source Truth
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          specs={"energy":(Path("public/agent_crypto_erith_ia/data/energy/history"),3),"metals":(Path("public/agent_crypto_erith_ia/data/metals/history_long"),5)}
          min_span={"5a":4.5,"10a":8.8,"max":8.8}; min_points={"5a":48,"10a":96,"max":96}
          summary={}
          for domain,(root,expected) in specs.items():
              status=json.loads((root/"status.json").read_text(encoding="utf-8"))
              assert status.get("status")=="ready", (domain,status)
              integrity=status.get("integrity") or {}
              assert integrity.get("future_continuous_only") is True
              assert integrity.get("spot_semantics_forbidden") is True
              assert integrity.get("lazy_browser_load_required") is True
              assert integrity.get("boot_payload_forbidden") is True
              if domain=="metals":
                  assert integrity.get("spot_current_mixing_forbidden") is True
                  assert integrity.get("current_gold_api_excluded") is True
                  assert integrity.get("futures_history_only") is True
              summary[domain]={}
              for horizon in ("5a","10a","max"):
                  p=json.loads((root/f"{horizon}.json").read_text(encoding="utf-8"))
                  assert p.get("schema")=="agent_crypto_commodity_historical_depth_v1"
                  assert p.get("domain")==domain and p.get("status")=="ready"
                  assert int(p.get("assets_count") or 0)==expected
                  cov=p.get("coverage") or {}
                  assert float(cov.get("min_span_years") or 0)>=min_span[horizon], (domain,horizon,cov)
                  assert int(cov.get("min_points") or 0)>=min_points[horizon], (domain,horizon,cov)
                  for asset in p.get("assets") or []:
                      assert asset.get("instrument_type")=="future_continuous"
                      assert isinstance(asset.get("provider_symbol"),str) and asset.get("provider_symbol")
                      assert len(asset.get("history_points") or [])>=min_points[horizon]
                  summary[domain][horizon]={"coverage":cov,"resolution":p.get("resolution")}
          print(summary)
          PY
      - name: Commit commodity historical archives
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/agent_crypto_erith_ia/data/energy/history public/agent_crypto_erith_ia/data/metals/history_long
          if git diff --cached --quiet; then
            echo "No commodity historical archive change."
            exit 0
          fi
          git commit -m "archive public commodity historical depth"
          git pull --rebase origin main
          git push origin HEAD:main
