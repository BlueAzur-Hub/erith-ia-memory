name: Seven Heaven — Bitcoin strategy wins and losses research
on:
  pull_request:
    paths:
      - '.github/workflows/seven-heaven-btc-strategy-win-loss-research.yml'
      - 'coordination/inter_ai_dialogues/agent_crypto/research/strategy_profiles/SEVEN_HEAVEN_BTC_SWING_WIN_LOSS_CATALOG_2026_11_10.py'
permissions:
  contents: read
jobs:
  research-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify study code syntax and run historical simulations
        run: |
          set -euo pipefail
          python3 -m py_compile coordination/inter_ai_dialogues/agent_crypto/research/strategy_profiles/SEVEN_HEAVEN_BTC_SWING_WIN_LOSS_CATALOG_2026_11_10.py
          python3 coordination/inter_ai_dialogues/agent_crypto/research/strategy_profiles/SEVEN_HEAVEN_BTC_SWING_WIN_LOSS_CATALOG_2026_11_10.py \
            public/agent_crypto_erith_ia/data/historical_archive_prototype/btc_native_daily_reconciliation/bitcoin-Max.json.gz \
            /tmp/seven_heaven_btc_strategy_win_loss_research.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/seven_heaven_btc_strategy_win_loss_research.json'))
          assert d['read_only'] and not d['orders_enabled']
          assert d['model']['days']==2830 and not d['model']['prospective_validity_not_proven']==False
          assert len(d['strategies'])==14 and len(d['double_costs'])==14
          assert d['rsi_signal_invariants']=={'filtered':13,'unfiltered':57}
          for r in d['strategies']:
            assert r['trades']==r['wins']+r['losses']
            assert r['net_pct'] > -100
            assert r['max_dd_pct'] <= 0
            assert 0<=r['exposure_pct']<=100
            assert len(r['yearly'])==8
          for k in ['PULLBACK_FILTERED','REBOUND_FILTERED','REBOUND_UNFILTERED']:
            r=next(x for x in d['strategies'] if x['key']==k)
            assert r['trades'] <= 100, 'Unexpected frequency; investigate!'
          print('SEVEN_STRATEGY_FAILURE_RESEARCH_ASSERTIONS_PASSED')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: seven-heaven-btc-research-winners-and-losers-2019-2026
          path: /tmp/seven_heaven_btc_strategy_win_loss_research.json
          retention-days: 60
