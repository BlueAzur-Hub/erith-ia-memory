name: Agent-Crypto 40.6.486 Validate Package and Publish ZIP

on:
  push:
    branches:
      - main
      - agent-crypto-406486-oracle-evidence-automatic-sequential-cold-archive
    paths:
      - '.github/workflows/agent-crypto-package-406486.yml'
      - '.github/scripts/agent_crypto_oracle_evidence_auto_archive_test_406486.py'
      - '.github/workflows/agent-crypto-package-406481.yml'\n      - '.github/workflows/agent-crypto-package-406482.yml'
      - '.github/workflows/agent-crypto-package-406483.yml'
      - '.github/workflows/agent-crypto-package-406484.yml'
      - '.github/workflows/agent-crypto-package-406485.yml'
      - 'public/agent_crypto_erith_ia/administrator/js/oracle-evidence-auto-archive-queue.js'
      - 'public/agent_crypto_erith_ia/administrator/js/post-boot-runtime-loader.js'
      - 'public/agent_crypto_erith_ia/administrator/build.json'
      - 'public/agent_crypto_erith_ia/administrator/index.html'
      - 'public/agent_crypto_erith_ia/administrator/js/strategy-a-audit-demand-loader.js'
      - 'public/agent_crypto_erith_ia/administrator/RELEASE.md'
      - 'public/agent_crypto_erith_ia/administrator/HANDOFF.md'
      - 'public/agent_crypto_erith_ia/administrator/HANDOFF_FINAL_40.6.486.md'
      - 'public/agent_crypto_erith_ia/administrator/ORACLE_EVIDENCE_AUTOMATIC_SEQUENTIAL_COLD_ARCHIVE_40.6.486.md'
      - 'public/agent_crypto_erith_ia/administrator/PATCH_MANIFEST_40.6.486.txt'
  pull_request:
    paths:
      - '.github/workflows/agent-crypto-package-406486.yml'
      - '.github/scripts/agent_crypto_oracle_evidence_auto_archive_test_406486.py'
      - '.github/workflows/agent-crypto-package-406481.yml'
      - '.github/workflows/agent-crypto-package-406482.yml'
      - '.github/workflows/agent-crypto-package-406483.yml'
      - '.github/workflows/agent-crypto-package-406484.yml'
      - '.github/workflows/agent-crypto-package-406485.yml'
      - 'public/agent_crypto_erith_ia/administrator/js/oracle-evidence-auto-archive-queue.js'
      - 'public/agent_crypto_erith_ia/administrator/js/post-boot-runtime-loader.js'
      - 'public/agent_crypto_erith_ia/administrator/build.json'
      - 'public/agent_crypto_erith_ia/administrator/index.html'
      - 'public/agent_crypto_erith_ia/administrator/js/strategy-a-audit-demand-loader.js'
      - 'public/agent_crypto_erith_ia/administrator/RELEASE.md'
      - 'public/agent_crypto_erith_ia/administrator/HANDOFF.md'
      - 'public/agent_crypto_erith_ia/administrator/HANDOFF_FINAL_40.6.486.md'
      - 'public/agent_crypto_erith_ia/administrator/ORACLE_EVIDENCE_AUTOMATIC_SEQUENTIAL_COLD_ARCHIVE_40.6.486.md'
      - 'public/agent_crypto_erith_ia/administrator/PATCH_MANIFEST_40.6.486.txt'

permissions:
  contents: write

jobs:
  validate-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Validate 40.6.486 automatic sequential archive
        run: |
          set -euo pipefail
          ROOT="public/agent_crypto_erith_ia"
          node --check "$ROOT/administrator/js/oracle-evidence-auto-archive-queue.js"
          node --check "$ROOT/administrator/js/post-boot-runtime-loader.js"
          python .github/scripts/agent_crypto_oracle_evidence_auto_archive_test_406486.py
          python .github/scripts/agent_crypto_version_truth_guard_compat.py
          grep -F 'Build 40.6.486 · Administrator' "$ROOT/administrator/index.html"
          grep -F '"build": "40.6.486"' "$ROOT/administrator/build.json"
          grep -F 'oracle-evidence-auto-archive-queue.js?v=40.6.486' "$ROOT/administrator/js/post-boot-runtime-loader.js"

      - name: Validate safety contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("public/agent_crypto_erith_ia/administrator/build.json").read_text(encoding="utf-8"))
          x=d["oracle_evidence_automatic_sequential_cold_archive_406486"]
          assert d["market_core"]=="38.15.11"
          assert d["strategy_a_modified"] is False
          assert d["oracle_math_changed"] is False
          assert d["storage_schema_changed"] is False
          assert d["retention_changed"] is False
          assert d["real_order"] is False
          assert x["chunk_rows"]==500
          assert x["sequential_only"] is True
          assert x["parallel_uploads"] is False
          assert x["wait_for_verified_before_next"] is True
          assert x["fixed_target_at_start"] is True
          assert x["local_retention_allowed"] is False
          assert x["local_delete_api_exposed"] is False
          assert x["browser_github_write"] is False
          assert x["github_token_in_browser"] is False
          print("40.6.486 SAFETY CONTRACT PASS")
          PY

      - name: Mark test receipt PASS
        if: github.ref == 'refs/heads/main'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("public/agent_crypto_erith_ia/administrator/ORACLE_EVIDENCE_AUTO_ARCHIVE_TEST_40.6.486.json")
          d=json.loads(p.read_text(encoding="utf-8"))
          d["pass_pending_workflow"]=False
          d["pass"]=True
          d["cases"]={k:"PASS" for k in d["cases"]}
          p.write_text(json.dumps(d,indent=2,ensure_ascii=False)+"\n",encoding="utf-8")
          PY

      - name: Build ZIP
        if: github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          ROOT="public/agent_crypto_erith_ia/administrator"
          ZIP="$ROOT/AGENT_CRYPTO_ORACLE_EVIDENCE_AUTOMATIC_SEQUENTIAL_COLD_ARCHIVE_40.6.486.zip"
          rm -rf /tmp/ac486 "$ZIP" "$ZIP.sha256"
          mkdir -p /tmp/ac486
          cp --parents \
            .github/workflows/agent-crypto-package-406486.yml \
            .github/scripts/agent_crypto_oracle_evidence_auto_archive_test_406486.py \
            .github/workflows/agent-crypto-package-406481.yml \
            .github/workflows/agent-crypto-package-406482.yml \
            .github/workflows/agent-crypto-package-406483.yml \
            .github/workflows/agent-crypto-package-406484.yml \
            .github/workflows/agent-crypto-package-406485.yml \
            "$ROOT/js/oracle-evidence-tiered-storage-foundation.js" \
            "$ROOT/js/oracle-evidence-existing-bridge-integration.js" \
            "$ROOT/js/oracle-evidence-auto-archive-queue.js" \
            "$ROOT/js/post-boot-runtime-loader.js" \
            "$ROOT/js/strategy-a-audit-demand-loader.js" \
            "$ROOT/index.html" \
            "$ROOT/index-40.6.486.html" \
            "$ROOT/build.json" \
            "$ROOT/RELEASE.md" \
            "$ROOT/HANDOFF.md" \
            "$ROOT/HANDOFF_FINAL_40.6.486.md" \
            "$ROOT/ORACLE_EVIDENCE_AUTOMATIC_SEQUENTIAL_COLD_ARCHIVE_40.6.486.md" \
            "$ROOT/ORACLE_EVIDENCE_AUTO_ARCHIVE_TEST_40.6.486.json" \
            "$ROOT/PATCH_MANIFEST_40.6.486.txt" \
            /tmp/ac486/
          (cd /tmp/ac486 && zip -9 -r "$GITHUB_WORKSPACE/$ZIP" .)
          unzip -t "$ZIP"
          sha256sum "$ZIP" > "$ZIP.sha256"

      - name: Commit published ZIP
        if: github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          ROOT="public/agent_crypto_erith_ia/administrator"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            "$ROOT/ORACLE_EVIDENCE_AUTO_ARCHIVE_TEST_40.6.486.json" \
            "$ROOT/AGENT_CRYPTO_ORACLE_EVIDENCE_AUTOMATIC_SEQUENTIAL_COLD_ARCHIVE_40.6.486.zip" \
            "$ROOT/AGENT_CRYPTO_ORACLE_EVIDENCE_AUTOMATIC_SEQUENTIAL_COLD_ARCHIVE_40.6.486.zip.sha256"
          git commit -m "chore(package): publish Agent-Crypto 40.6.486 automatic archive ZIP"
          git pull --rebase origin main
          git push origin HEAD:main
