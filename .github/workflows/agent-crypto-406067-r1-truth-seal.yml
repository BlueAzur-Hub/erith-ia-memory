name: Agent Crypto 40.6.67 R1 Truth Seal

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  truth_seal:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch manifest truth
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          p = Path("public/agent_crypto_erith_ia/administrator/build.json")
          data = json.loads(p.read_text(encoding="utf-8"))
          assert data["build"] == "40.6.67"
          assert data["engine"] == "38.15.11"
          assert data["parent_build"] == "40.6.66"
          data["asset_token"] = "market-core-v2.0-alpha-build-40.6.67"
          data["administrator_build"] = "40.6.67"
          data["build_label"] = "Build 40.6.67 · Administrator"
          data["release_status"] = "tradus_paper_shadow_independent"
          data["current_version_truth"]["loaded_build"] = "40.6.67"
          p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Validate truth and scope
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path("public/agent_crypto_erith_ia/administrator")
          b = json.loads((root / "build.json").read_text(encoding="utf-8"))
          v = json.loads((root / "version.json").read_text(encoding="utf-8"))
          av = json.loads((root / "administrator-version.json").read_text(encoding="utf-8"))
          html = (root / "index.html").read_text(encoding="utf-8")
          expected = "40.6.67"
          engine = "38.15.11"
          assert b["build"] == expected
          assert b["administrator_build"] == expected
          assert b["build_label"] == "Build 40.6.67 · Administrator"
          assert b["asset_token"] == "market-core-v2.0-alpha-build-40.6.67"
          assert b["current_version_truth"]["loaded_build"] == expected
          assert b["release_status"] == "tradus_paper_shadow_independent"
          assert b["engine"] == engine
          assert b["parent_build"] == "40.6.66"
          assert v["build"] == expected and v["engine"] == engine
          assert av["build"] == expected and av["engine"] == engine
          assert "Build 40.6.67 · Administrator" in html
          assert "market-core-v2.0-alpha-build-40.6.67" in html
          print("40.6.67 R1 VERSION TRUTH PASS")
          PY
          test "$(git diff --name-only)" = "public/agent_crypto_erith_ia/administrator/build.json"

      - name: Commit and remove one shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/agent_crypto_erith_ia/administrator/build.json
          git rm .github/workflows/agent-crypto-406067-r1-truth-seal.yml
          git commit -m "fix(agent-crypto): seal 40.6.67 R1 version truth"
          git push origin main
