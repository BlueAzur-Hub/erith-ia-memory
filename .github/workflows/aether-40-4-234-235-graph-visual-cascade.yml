name: Aether 40.4.234-235 Graph Visual Cascade

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/aether-40-4-234-235-graph-visual-cascade.yml'

permissions:
  contents: write

jobs:
  cascade:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard canonical 40.4.233 + protected geometry lineage
        shell: bash
        run: |
          git fetch origin main
          git checkout main
          git pull --ff-only origin main
          echo "BASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          python3 - <<'PY'
          import json
          from pathlib import Path
          base=Path('public/agent_crypto_erith_ia/administrator')
          m=json.loads((base/'version.json').read_text(encoding='utf-8'))
          assert m['build']=='40.4.233', m['build']
          assert m['engine']['reference_build']=='38.15.11'
          assert m['engine']['status']=='protected'
          js=(base/'js/parallel-markets.js').read_text(encoding='utf-8')
          css=(base/'parallel-markets.css').read_text(encoding='utf-8')
          visual=(base/'market-visual-master-parity.css').read_text(encoding='utf-8')
          assert 'const pad = {l:62,r:24,t:24,b:42}' in js
          assert 'Crypto geometry remains master' in css
          assert 'Final presentation owner for Metals + Indices + Energy + Cross.' in visual
          print('PARENT_GEOMETRY_PASS 40.4.233 / .189-.195 contract preserved / Market Core 38.15.11 PROTECTED')
          PY

      - name: Build 40.4.234 — Crypto plot language
        shell: bash
        run: |
          python3 .github/scripts/aether_40_4_234_235_graph_visual_cascade.py --stage 234
          node --check public/agent_crypto_erith_ia/administrator/js/parallel-markets.js
          git diff --check
          cat >/tmp/contract234.json <<'JSON'
          {"state":"active","scope":"parallel_graph_canvas_crypto_plot_language","crypto_geometry_master_preserved":true,"geometry_404189_404195_changed":false,"toolbar_geometry_changed":false,"rail_geometry_changed":false,"plot_padding_changed":false,"data_changed":false,"source_changed":false,"history_changed":false,"base100_math_changed":false,"hover_semantics_changed":false,"interpolation_added":false,"technical_reading_changed":false,"atlas_changed":false,"math_core_changed":false,"window_manager_changed":false,"market_core_modified":false,"new_timer":false,"new_observer":false,"new_fetch":false,"new_websocket":false,"new_scheduler":false}
          JSON
          python3 .github/scripts/agent_crypto_release_driver.py --build 40.4.234 --parent 40.4.233 --release "PARALLEL GRAPH CANVAS · CRYPTO PLOT LANGUAGE LOCK" --status parallel_graph_canvas_crypto_plot_language_404234 --contract-key parallel_graph_canvas_crypto_plot_language_404234 --contract-json /tmp/contract234.json --lineage-note "40.4.234 parallel graph canvas Crypto plot-language lock: Indices/Energy/Cross retain the validated .189/.195 geometry and real Base 100/time/hover semantics while receiving richer grid, Base 100 emphasis, line depth and terminal markers; no data, source, history, Technical Reading, Atlas, Math, Window Manager or Market Core change"
          node --check public/agent_crypto_erith_ia/administrator/js/parallel-markets.js
          python3 .github/scripts/agent_crypto_version_truth_guard.py --expected-build 40.4.234 --expected-release "PARALLEL GRAPH CANVAS · CRYPTO PLOT LANGUAGE LOCK"
          python3 - <<'PY'
          from pathlib import Path
          import json,subprocess
          b=Path('public/agent_crypto_erith_ia/administrator')
          m=json.loads((b/'version.json').read_text(encoding='utf-8'))
          assert m['build']=='40.4.234' and m['parent_build']=='40.4.233'
          assert m['engine']['reference_build']=='38.15.11' and m['engine']['status']=='protected'
          js=(b/'js/parallel-markets.js').read_text(encoding='utf-8')
          idx=(b/'index.html').read_text(encoding='utf-8')
          assert 'const BUILD = "40.4.234";' in js
          assert 'canvas_crypto_plot_language:true' in js
          assert 'const pad = {l:62,r:24,t:24,b:42}' in js
          assert 'SURVOL = POINT RÉEL LE PLUS PROCHE' in js
          assert './js/parallel-markets.js?v=40.4.234' in idx
          allowed={
            'public/agent_crypto_erith_ia/administrator/js/parallel-markets.js',
            'public/agent_crypto_erith_ia/administrator/index.html',
            'public/agent_crypto_erith_ia/administrator/js/views/system-presentation.js',
            'public/agent_crypto_erith_ia/administrator/app.js',
            'public/agent_crypto_erith_ia/administrator/js/app.js',
            'public/agent_crypto_erith_ia/administrator/version.json',
            'public/agent_crypto_erith_ia/administrator/administrator-version.json',
            'public/agent_crypto_erith_ia/administrator/build.json'
          }
          paths={x[3:] for x in subprocess.check_output(['git','status','--porcelain','-uall'],text=True).splitlines()}
          required={'public/agent_crypto_erith_ia/administrator/js/parallel-markets.js','public/agent_crypto_erith_ia/administrator/version.json'}
          assert required<=paths, sorted(paths)
          assert not paths-allowed, sorted(paths-allowed)
          print('SCOPE_234_PASS',sorted(paths))
          PY
          git diff --check

      - name: Commit canonical 40.4.234
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/agent_crypto_erith_ia/administrator/js/parallel-markets.js public/agent_crypto_erith_ia/administrator/index.html public/agent_crypto_erith_ia/administrator/js/views/system-presentation.js public/agent_crypto_erith_ia/administrator/app.js public/agent_crypto_erith_ia/administrator/js/app.js public/agent_crypto_erith_ia/administrator/version.json public/agent_crypto_erith_ia/administrator/administrator-version.json public/agent_crypto_erith_ia/administrator/build.json
          git commit -m "agent-crypto: build 40.4.234 lock parallel Crypto plot language"
          echo "SHA234=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          git push origin main

      - name: Build 40.4.235 — Crypto values HUD parity
        shell: bash
        run: |
          python3 .github/scripts/aether_40_4_234_235_graph_visual_cascade.py --stage 235
          node --check public/agent_crypto_erith_ia/administrator/js/parallel-markets.js
          git diff --check
          cat >/tmp/contract235.json <<'JSON'
          {"state":"active","scope":"parallel_graph_values_hud_crypto_panel_parity","existing_hud_owner_reused":true,"new_css_owner_added":false,"crypto_geometry_master_preserved":true,"geometry_404189_404195_changed":false,"toolbar_geometry_changed":false,"rail_geometry_changed":false,"data_changed":false,"source_changed":false,"history_changed":false,"base100_math_changed":false,"technical_reading_changed":false,"atlas_changed":false,"math_core_changed":false,"window_manager_changed":false,"market_core_modified":false,"new_timer":false,"new_observer":false,"new_fetch":false,"new_websocket":false,"new_scheduler":false}
          JSON
          python3 .github/scripts/agent_crypto_release_driver.py --build 40.4.235 --parent 40.4.234 --release "PARALLEL GRAPH VALUES HUD · CRYPTO PANEL PARITY LOCK" --status parallel_graph_values_hud_crypto_panel_parity_404235 --contract-key parallel_graph_values_hud_crypto_panel_parity_404235 --contract-json /tmp/contract235.json --lineage-note "40.4.235 parallel graph values HUD Crypto panel parity: the existing .206 VALEURS OBSERVÉES HUD remains sole owner and gains stronger asset-color hierarchy plus explicit positive/negative/flat states; no geometry, data, source, history, Technical Reading, Atlas, Math, Window Manager or Market Core change"
          node --check public/agent_crypto_erith_ia/administrator/js/parallel-markets.js
          python3 .github/scripts/agent_crypto_version_truth_guard.py --expected-build 40.4.235 --expected-release "PARALLEL GRAPH VALUES HUD · CRYPTO PANEL PARITY LOCK"
          python3 - <<'PY'
          from pathlib import Path
          import json,subprocess
          b=Path('public/agent_crypto_erith_ia/administrator')
          m=json.loads((b/'version.json').read_text(encoding='utf-8'))
          assert m['build']=='40.4.235' and m['parent_build']=='40.4.234'
          assert m['engine']['reference_build']=='38.15.11' and m['engine']['status']=='protected'
          js=(b/'js/parallel-markets.js').read_text(encoding='utf-8')
          css=(b/'market-visual-master-parity.css').read_text(encoding='utf-8')
          idx=(b/'index.html').read_text(encoding='utf-8')
          assert 'const BUILD = "40.4.235";' in js
          assert 'values_hud_crypto_panel_parity:true' in js
          assert '40.4.235 — PARALLEL VALUES HUD CRYPTO PANEL PARITY' in css
          assert '.atlas-parallel-chart-table-row-404206.is-up>em' in css
          assert './js/parallel-markets.js?v=40.4.235' in idx
          assert './market-visual-master-parity.css?v=40.4.235' in idx
          allowed={
            'public/agent_crypto_erith_ia/administrator/js/parallel-markets.js',
            'public/agent_crypto_erith_ia/administrator/market-visual-master-parity.css',
            'public/agent_crypto_erith_ia/administrator/index.html',
            'public/agent_crypto_erith_ia/administrator/js/views/system-presentation.js',
            'public/agent_crypto_erith_ia/administrator/app.js',
            'public/agent_crypto_erith_ia/administrator/js/app.js',
            'public/agent_crypto_erith_ia/administrator/version.json',
            'public/agent_crypto_erith_ia/administrator/administrator-version.json',
            'public/agent_crypto_erith_ia/administrator/build.json'
          }
          paths={x[3:] for x in subprocess.check_output(['git','status','--porcelain','-uall'],text=True).splitlines()}
          required={'public/agent_crypto_erith_ia/administrator/js/parallel-markets.js','public/agent_crypto_erith_ia/administrator/market-visual-master-parity.css','public/agent_crypto_erith_ia/administrator/version.json'}
          assert required<=paths, sorted(paths)
          assert not paths-allowed, sorted(paths-allowed)
          print('SCOPE_235_PASS',sorted(paths))
          PY
          git diff --check

      - name: Commit canonical 40.4.235
        shell: bash
        run: |
          git add public/agent_crypto_erith_ia/administrator/js/parallel-markets.js public/agent_crypto_erith_ia/administrator/market-visual-master-parity.css public/agent_crypto_erith_ia/administrator/index.html public/agent_crypto_erith_ia/administrator/js/views/system-presentation.js public/agent_crypto_erith_ia/administrator/app.js public/agent_crypto_erith_ia/administrator/js/app.js public/agent_crypto_erith_ia/administrator/version.json public/agent_crypto_erith_ia/administrator/administrator-version.json public/agent_crypto_erith_ia/administrator/build.json
          git commit -m "agent-crypto: build 40.4.235 lock parallel values HUD parity"
          echo "SHA235=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          git push origin main

      - name: Package both differential releases
        shell: bash
        run: |
          make_pkg(){
            local from="$1" to="$2" build="$3" release="$4" outfile="$5"
            local pkg="/tmp/pkg-$build"
            mkdir -p "$pkg"
            git diff --name-only "$from" "$to" > "/tmp/changed-$build.txt"
            while IFS= read -r p; do mkdir -p "$pkg/$(dirname "$p")"; cp "$p" "$pkg/$p"; done < "/tmp/changed-$build.txt"
            {
              echo "# Agent-Crypto $build — fichiers modifiés"
              echo
              echo "Release: $release"
              echo "Canonical commit: $to"
              echo "Market Core: 38.15.11 PROTECTED"
              echo
              echo "## Fichiers"
              sed 's/^/- `/' "/tmp/changed-$build.txt" | sed 's/$/`/'
              echo
              echo "Geometry .189/.195 preserved; Technical Reading untouched; no new timer/observer/fetch/WebSocket/scheduler."
            } > "$pkg/FILES_CHANGED_$build.md"
            (cd "$pkg" && zip -qr "$GITHUB_WORKSPACE/$outfile" .)
            sha256sum "$GITHUB_WORKSPACE/$outfile"
          }
          make_pkg "$BASE_SHA" "$SHA234" "40.4.234" "PARALLEL GRAPH CANVAS · CRYPTO PLOT LANGUAGE LOCK" "AGENT_CRYPTO_BUILD_40_4_234_PARALLEL_GRAPH_CRYPTO_PLOT_LANGUAGE_CHANGED_FILES.zip"
          make_pkg "$SHA234" "$SHA235" "40.4.235" "PARALLEL GRAPH VALUES HUD · CRYPTO PANEL PARITY LOCK" "AGENT_CRYPTO_BUILD_40_4_235_PARALLEL_GRAPH_VALUES_HUD_PARITY_CHANGED_FILES.zip"

      - name: Upload 40.4.234 artifact
        uses: actions/upload-artifact@v4
        with:
          name: AGENT_CRYPTO_BUILD_40_4_234_PARALLEL_GRAPH_CRYPTO_PLOT_LANGUAGE_CHANGED_FILES
          path: AGENT_CRYPTO_BUILD_40_4_234_PARALLEL_GRAPH_CRYPTO_PLOT_LANGUAGE_CHANGED_FILES.zip
          include-hidden-files: true

      - name: Upload 40.4.235 artifact
        uses: actions/upload-artifact@v4
        with:
          name: AGENT_CRYPTO_BUILD_40_4_235_PARALLEL_GRAPH_VALUES_HUD_PARITY_CHANGED_FILES
          path: AGENT_CRYPTO_BUILD_40_4_235_PARALLEL_GRAPH_VALUES_HUD_PARITY_CHANGED_FILES.zip
          include-hidden-files: true
