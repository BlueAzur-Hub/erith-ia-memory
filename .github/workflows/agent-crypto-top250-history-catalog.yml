name: Agent Crypto Top250 Historical Coverage Catalog
on:
  pull_request:
    paths:
      - '.github/workflows/agent-crypto-top250-history-catalog.yml'
      - 'public/agent_crypto_erith_ia/tools/build_historical_top250_catalog.py'
      - 'public/agent_crypto_erith_ia/tools/build_btc_gap_catalog.py'
      - 'public/agent_crypto_erith_ia/tools/build_btc_gap_catalog_test.py'
      - 'public/agent_crypto_erith_ia/tools/historical_top250_catalog_test.py'
      - 'public/agent_crypto_erith_ia/tools/top250-history-catalog.test.mjs'
      - 'public/agent_crypto_erith_ia/administrator/js/top250-history-catalog.js'
      - 'public/agent_crypto_erith_ia/administrator/historical-archive-reader.html'
      - 'public/agent_crypto_erith_ia/administrator/historical-vault.html'
  push:
    branches: [main]
    paths:
      - '.github/workflows/agent-crypto-top250-history-catalog.yml'
      - 'public/agent_crypto_erith_ia/tools/build_historical_top250_catalog.py'
      - 'public/agent_crypto_erith_ia/tools/build_btc_gap_catalog.py'
      - 'public/agent_crypto_erith_ia/tools/build_btc_gap_catalog_test.py'
      - 'public/agent_crypto_erith_ia/tools/historical_top250_catalog_test.py'
      - 'public/agent_crypto_erith_ia/tools/top250-history-catalog.test.mjs'
      - 'public/agent_crypto_erith_ia/administrator/js/top250-history-catalog.js'
      - 'public/agent_crypto_erith_ia/administrator/historical-archive-reader.html'
      - 'public/agent_crypto_erith_ia/administrator/historical-vault.html'
  workflow_dispatch:
  workflow_run:
    workflows:
      - 'Agent Crypto Top250 - Verified Identity Monthly Addenda'
      - 'Agent Crypto Historical 1m - Continuous Monthly Backfill'
      - 'Agent Crypto Verified Earliest Binance Native Months'
      - 'Agent Crypto BTC Native Older Month Imports'
    types: [completed]
  schedule:
    - cron: '49 1,7,13,19 * * *'
permissions:
  contents: write
concurrency:
  group: agent-crypto-top250-history-coverage
  cancel-in-progress: false
jobs:
  catalog:
    # Do not publish from failed or PR-only upstream checks; scheduled catalog refreshes retain their own downstream daily cadences.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.event != 'schedule')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Offline Top250 identity, release and coverage tests
        run: |
          set -euo pipefail
          python -m py_compile public/agent_crypto_erith_ia/tools/build_historical_top250_catalog.py
          python public/agent_crypto_erith_ia/tools/historical_top250_catalog_test.py
          python public/agent_crypto_erith_ia/tools/build_btc_gap_catalog_test.py
          node --check public/agent_crypto_erith_ia/administrator/js/top250-history-catalog.js
          node --test public/agent_crypto_erith_ia/tools/top250-history-catalog.test.mjs
      - name: Assemble 250 identity records from cryptographically checked Release manifests
        run: |
          set -euo pipefail
          python public/agent_crypto_erith_ia/tools/build_historical_top250_catalog.py --output "$RUNNER_TEMP/top250-catalog.json"
          python - <<'PY'
          import json,os,pathlib
          src=pathlib.Path(os.environ["RUNNER_TEMP"])/"top250-catalog.json"
          obj=json.loads(src.read_text())
          assert obj["ranked"]==250 and len(obj["assets"])==250
          assert obj["native_1m_candles"]>0 and obj["archived_assets"]>0
          assert len(obj["groups"])==4 and obj["quote"]=="USDT"
          print("CATALOG PROOF",json.dumps({"ranked":250,
                  "archived_assets":obj["archived_assets"],
                  "candles":obj["native_1m_candles"],
                  "release_months":obj["release_months"]}))
          PY
      - name: Independently audit BTC gap Releases without publishing a second canonical catalog
        run: |
          set -euo pipefail
          python public/agent_crypto_erith_ia/tools/build_btc_gap_catalog.py \
            --catalog "$RUNNER_TEMP/top250-catalog.json" \
            --output "$RUNNER_TEMP/btc-gap-audit.json"
          python - <<'PY'
          import json,os,pathlib
          p=pathlib.Path(os.environ["RUNNER_TEMP"])/"btc-gap-audit.json"
          j=json.loads(p.read_text())
          assert j["schema"]=="seven.btc.source-quality-catalog.v1"
          assert j["gap_months"]>0 and j["unique_months_total"]==j["complete_months_in_canonical"]+j["gap_months"]
          assert j["unique_native_rows_total"]==j["complete_native_candles_in_canonical"]+j["gap_month_native_rows"]
          print("BTC SOURCE-QUALIFIED COVERAGE",json.dumps({
            "full_months":j["complete_months_in_canonical"],
            "gap_months":j["gap_months"],
            "unique_months":j["unique_months_total"],
            "earliest_month":j["earliest_covered_month"]},sort_keys=True))
          PY
      - name: Commit catalog only on main and never modify source Releases
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          target=public/agent_crypto_erith_ia/data/historical_archive_prototype/top250_history_catalog/index.json
          mkdir -p "$(dirname "$target")"
          cp "$RUNNER_TEMP/top250-catalog.json" "$target"
          git add -- "$target"
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "NOOP: same Top250 verified month coverage"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Refresh actual Top250 monthly OHLCV archive coverage"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Read-only snapshot-aligned archive gap report (no collection)
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          
          root = Path("public/agent_crypto_erith_ia/data")
          historical = root / "historical_archive_prototype"
          market = json.loads((root / "crypto/latest.json").read_text(encoding="utf-8"))
          minute = json.loads((historical / "top250_multisource_coverage/index.json").read_text(encoding="utf-8"))
          daily = json.loads((historical / "top250_multiresolution_sources/index.json").read_text(encoding="utf-8"))
          coins = market.get("coins", [])
          assert len(coins) == 250 and len({x["id"] for x in coins}) == 250, "Latest Core250 market snapshot incomplete"
          assert minute["ranked"] == 250 and len(minute["assets"]) == 250
          assert daily["asset_count"] == len(daily["assets"])
          one_minute = {a["id"] for a in minute["assets"] if a.get("native_1m_count", 0) > 0}
          one_day = {a["id"] for a in daily["assets"] if a.get("native_candles", 0) > 0}
          market_ids = {c["id"] for c in coins}
          missing = [{"rank": c["rank"], "id": c["id"], "symbol": c["symbol"]}
                     for c in coins if c["id"] not in one_minute and c["id"] not in one_day]
          missing.sort(key=lambda a: a["rank"])
          report = {
              "schema": "seven.crypto.current-market-vault-gap.readonly",
              "market_snapshot": market.get("generated_at"),
              "status": "INDEX_PRESENCE_ONLY_NOT_A_REAUDIT_OF_SOURCE_RELEASE_BYTES",
              "ranked_assets": len(coins),
              "archive_source_counts": {
                  "native_minute_ids": len(one_minute),
                  "native_daily_ids": len(one_day),
                  "dual_resolution_ids": len(one_minute & one_day),
                  "historical_union_ids": len(one_minute | one_day)
              },
              "current_market": {
                  "with_at_least_one_indexed_source": len(market_ids & (one_minute | one_day)),
                  "without_either_indexed_source": len(missing),
                  "absent_from_historical_source_roster": sorted(
                      market_ids - {a["id"] for a in minute["assets"]}),
                  "historically_indexed_but_not_in_current_market": sorted(
                      (one_minute | one_day) - market_ids)
              },
              "missing_in_current_market": missing,
              "limitations": [
                  "Current CoinGecko ranks and historical source ranks are from different snapshots.",
                  "Matching uses exact CoinGecko asset IDs; no symbol or rank substitution.",
                  "An indexed native month or daily bar does not prove current price, complete coverage or source ZIP re-verification.",
                  "USD CoinGecko spot prices are not USDT/USDC exchange candles.",
                  "No source archives, market application, order routes or trader code changed."
              ]
          }
          destination = Path(os.environ["RUNNER_TEMP"]) / "current-market-vault-gap.json"
          destination.write_text(json.dumps(report, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print("TOP250 CURRENT MARKET GAP", json.dumps({
              "market_time": report["market_snapshot"],
              "minute_index_ids": len(one_minute), "daily_index_ids": len(one_day),
              "archive_union_not_a_live_rank_count": len(one_minute | one_day),
              "current_market_covered": report["current_market"]["with_at_least_one_indexed_source"],
              "current_market_missing": len(missing),
              "first_missing": missing[:10]
          }, ensure_ascii=False))
          PY
      - name: Publish readable coverage report as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: top250-historical-coverage-index
          path: |
            ${{ runner.temp }}/top250-catalog.json
            ${{ runner.temp }}/btc-gap-audit.json
            ${{ runner.temp }}/current-market-vault-gap.json
          if-no-files-found: error
          retention-days: 30
      - name: Protect Trader, charts and local caches
        if: always()
        run: |
          set -euo pipefail
          git diff --exit-code -- \
            public/agent_crypto_erith_ia/trader/ \
            public/agent_crypto_erith_ia/administrator/app.js \
            public/agent_crypto_erith_ia/core/ \
            public/agent_crypto_erith_ia/data/crypto/
