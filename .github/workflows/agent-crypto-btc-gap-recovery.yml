          python public/agent_crypto_erith_ia/tools/reconcile_btc_native_daily.py --audit-only
      - name: Download and certify the 26 missing-day Binance BTCUSDT 1d originals
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os,pathlib
          root=pathlib.Path("public/agent_crypto_erith_ia/data/historical_archive_prototype")
          target=root/"btc_native_daily_reconciliation"
          if (target/"index.json").is_file():
              old=json.loads((target/"index.json").read_text())
              source={k:hashlib.sha256((root/k).read_bytes()).hexdigest()
                for k in ("btc_max_integrated/index.json","btc_verified_gap_months/index.json")}
              archive=target/old.get("file","missing")
              if (old.get("source_catalog_sha256")==source and
                  old.get("reconciliation_policy")=="official_native_1d_with_majority_source_corroboration_v2" and
                  archive.is_file() and
                  hashlib.sha256(archive.read_bytes()).hexdigest()==old.get("sha256")):
                  pathlib.Path(os.environ["RUNNER_TEMP"],"native-daily-noop").touch()
                  print("NOOP: all 26 original native daily sources already audited")
          PY
          if [[ -f "$RUNNER_TEMP/native-daily-noop" ]]; then exit 0; fi
