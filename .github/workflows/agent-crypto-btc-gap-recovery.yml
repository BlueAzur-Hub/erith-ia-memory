            for source in btc_verified_gap_months/index.json btc_native_daily_reconciliation/index.json btc_native_daily_reconciliation/bitcoin-Max.json.gz; do
              old=$(sha256sum "$root/$source" | cut -d' ' -f1)
              now=$(git show "origin/main:$root/$source" | sha256sum | cut -d' ' -f1)
              if [[ "$old" != "$now" ]]; then
                echo "::error::BTC immutable reference source changed during minute audit"
                exit 1
              fi
            done
            git reset --hard origin/main
            mkdir -p "$root/btc_daily_reference" "$root/btc_minute_gap_audit"
            cp -a "$RUNNER_TEMP/btc_daily_reference/." "$root/btc_daily_reference/"
            cp -a "$RUNNER_TEMP/btc_minute_gap_audit/." "$root/btc_minute_gap_audit/"
            git add -- "$root/btc_daily_reference" "$root/btc_minute_gap_audit"
            git diff --cached --check
            if git diff --cached --quiet; then echo 'NOOP: reference and minute report identical'; exit 0; fi
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Publish frozen BTC daily truth and original 1m gap audit'
            if git push origin HEAD:main; then
              echo 'FROZEN BTC DAILY REFERENCE AND OFFICIAL MINUTE AUDIT PUBLISHED'
              exit 0
            fi
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: btc-1d-reference-1m-source-audit
          path: |
            ${{ runner.temp }}/btc_daily_reference/index.json
            ${{ runner.temp }}/btc_minute_gap_audit/index.json
          if-no-files-found: ignore
          retention-days: 30
  repair-native-daily:
    # Reuse this existing BTC-only workflow while broader historical collection
    # is busy. The main hourly workflow independently provides the same audit.
    # Output is idempotent: source SHA + policy + archive SHA decide NOOP.
