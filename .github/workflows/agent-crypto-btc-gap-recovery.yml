name: Agent Crypto BTC Native Gap Recovery
on:
  pull_request:
    paths:
      - '.github/workflows/agent-crypto-btc-gap-recovery.yml'
      - 'public/agent_crypto_erith_ia/tools/btc_gap_archive.py'
      - 'public/agent_crypto_erith_ia/tools/btc_gap_acquire.py'
      - 'public/agent_crypto_erith_ia/tools/btc_gap_acquire_test.py'
      - 'public/agent_crypto_erith_ia/tools/freeze_btc_daily_reference.py'
      - 'public/agent_crypto_erith_ia/tools/audit_btc_minute_gaps.py'
      - 'public/agent_crypto_erith_ia/tools/btc_minute_gap_audit_test.py'
      - 'public/agent_crypto_erith_ia/tools/audit_btc_minute_rest.py'
      - 'public/agent_crypto_erith_ia/tools/btc_minute_rest_test.py'
      - 'public/agent_crypto_erith_ia/tools/audit_btc_trade_gaps.py'
      - 'public/agent_crypto_erith_ia/tools/btc_trade_gap_test.py'
      - 'public/agent_crypto_erith_ia/tools/compare_btc_cross_venue.py'
      - 'public/agent_crypto_erith_ia/tools/compare_btc_cross_venue_test.py'
      - 'public/agent_crypto_erith_ia/tools/audit_cross_venue_gap_matrix.py'
      - 'public/agent_crypto_erith_ia/tools/audit_cross_venue_gap_matrix_test.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/agent-crypto-btc-gap-recovery.yml'
      - 'public/agent_crypto_erith_ia/tools/btc_gap_archive.py'
      - 'public/agent_crypto_erith_ia/tools/btc_gap_acquire.py'
      - 'public/agent_crypto_erith_ia/tools/btc_gap_acquire_test.py'
      - 'public/agent_crypto_erith_ia/tools/freeze_btc_daily_reference.py'
      - 'public/agent_crypto_erith_ia/tools/audit_btc_minute_gaps.py'
      - 'public/agent_crypto_erith_ia/tools/btc_minute_gap_audit_test.py'
      - 'public/agent_crypto_erith_ia/tools/audit_btc_minute_rest.py'
      - 'public/agent_crypto_erith_ia/tools/btc_minute_rest_test.py'
      - 'public/agent_crypto_erith_ia/tools/audit_btc_trade_gaps.py'
      - 'public/agent_crypto_erith_ia/tools/btc_trade_gap_test.py'
      - 'public/agent_crypto_erith_ia/tools/compare_btc_cross_venue.py'
      - 'public/agent_crypto_erith_ia/tools/compare_btc_cross_venue_test.py'
      - 'public/agent_crypto_erith_ia/tools/audit_cross_venue_gap_matrix.py'
      - 'public/agent_crypto_erith_ia/tools/audit_cross_venue_gap_matrix_test.py'
  workflow_dispatch:
    inputs:
      month:
        description: 'Original BTCUSDT 1m month YYYY-MM'
        required: true
        type: string
        default: '2023-03'
permissions:
  contents: write
concurrency:
  group: btc-native-gap-recovery
  cancel-in-progress: false
jobs:
  btc-top5-venue-history-matrix:
    # Read-only, asset-aware, 42 historical checks. Never rewrites Binance sources.
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Assert 27 BTC source gaps, 12 alt-asset windows and no conflated USD USDT
        run: |
          set -euo pipefail
          python -m py_compile public/agent_crypto_erith_ia/tools/audit_cross_venue_gap_matrix.py
          python public/agent_crypto_erith_ia/tools/audit_cross_venue_gap_matrix_test.py
          python public/agent_crypto_erith_ia/tools/audit_cross_venue_gap_matrix.py --audit-only
      - name: Refuse duplicate source-specific published audit
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os,pathlib
          root=pathlib.Path("public/agent_crypto_erith_ia/data/historical_archive_prototype")
          target=root/"cross_venue_gap_matrix/index.json"
          if not target.is_file():raise SystemExit(0)
          previous=json.loads(target.read_text())
          originals=hashlib.sha256((root/"btc_verified_gap_months/index.json").read_bytes()).hexdigest()
          frozen=json.loads((root/"btc_daily_reference/index.json").read_text())
          if (previous.get("schema")=="seven.crypto.cross-venue-historical-gap-matrix.v1"
              and previous.get("policy")=="native_venue_candles_utc_exact_non_fungible_quotes.v1"
              and previous.get("input_btc_gap_catalog_sha256")==originals
              and previous.get("protected_daily_reference_sha256")==frozen["locked_source"]["data_sha256"]
              and previous.get("btc_gap_windows_total")==27
              and previous.get("btc_expected_gap_minutes")==5881
              and len(previous.get("rows",[]))==42):
              pathlib.Path(os.environ["RUNNER_TEMP"],"cross-venue-matrix-noop").touch()
              print("NOOP: existing 39-window exchange-specific audit immutable")
          PY
      - name: Compare BTC full gaps and Top5 source-qualified historic markets
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          if [[ -f "$RUNNER_TEMP/cross-venue-matrix-noop" ]]; then exit 0; fi
          python public/agent_crypto_erith_ia/tools/audit_cross_venue_gap_matrix.py --output "$RUNNER_TEMP/cross_venue_gap_matrix/index.json"
          python - <<'PY'
          import json,os,pathlib
          path=pathlib.Path(os.environ["RUNNER_TEMP"])/"cross_venue_gap_matrix"/"index.json"
          data=json.loads(path.read_text())
          assert data["schema"]=="seven.crypto.cross-venue-historical-gap-matrix.v1"
          assert data["btc_gap_windows_total"]==27 and data["btc_expected_gap_minutes"]==5881
          assert len(data["rows"])==42 and data["trader_modified"] is False
          assert {a:d["windows"] for a,d in data["summary"].items()}=={
              "BTC":27,"ETH":4,"BNB":4,"XRP":4,"SOL":3}
          assert sum(x["window_calendar_minutes"] for x in data["rows"] if x["asset"]=="BTC")==5881
          for row in data["rows"]:
              assert row["coinbase"]["quote"]=="USD"
              assert row["coinbase"]["candles_present"]<=row["window_calendar_minutes"]
              if row["binance_alt"]:
                  assert row["binance_alt"]["quote"]=="USDT"
              if row["kraken"]:
                  assert row["kraken"]["quote"]=="USD"
          print("VERIFIED BTC+TOP5 HISTORICAL MATRIX",json.dumps(data["summary"],sort_keys=True))
          PY
      - name: Commit verified independent exchange comparisons to source-locked index
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          if [[ -f "$RUNNER_TEMP/cross-venue-matrix-noop" ]]; then exit 0; fi
          base=public/agent_crypto_erith_ia/data/historical_archive_prototype
          for attempt in 1 2 3; do
            git fetch origin main
            for p in btc_verified_gap_months/index.json btc_daily_reference/index.json; do
              old=$(sha256sum "$base/$p" | cut -d' ' -f1)
              new=$(git show "origin/main:$base/$p" | sha256sum | cut -d' ' -f1)
              if [[ "$old" != "$new" ]]; then
                echo "::error::The canonical source changed during external exchange audit"
                exit 1
              fi
            done
            git reset --hard origin/main
            mkdir -p "$base/cross_venue_gap_matrix"
            cp "$RUNNER_TEMP/cross_venue_gap_matrix/index.json" "$base/cross_venue_gap_matrix/index.json"
            git add -- "$base/cross_venue_gap_matrix/index.json"
            git diff --cached --check
            if git diff --cached --quiet; then echo 'NOOP: audit already published'; exit 0; fi
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Publish multi-venue BTC Top5 authenticated historical gap matrix'
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: btc-top5-cross-venue-matrix-evidence
          path: ${{ runner.temp }}/cross_venue_gap_matrix/index.json
          if-no-files-found: ignore
          retention-days: 30
  btc-cross-venue-march2023:
    # Only evidence. Never alter BTCUSDT sources or Trader.
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test official Binance UTC scope and fail-closed independent venue data
        run: |
          set -euo pipefail
          python -m py_compile public/agent_crypto_erith_ia/tools/compare_btc_cross_venue.py
          python public/agent_crypto_erith_ia/tools/compare_btc_cross_venue_test.py
          python public/agent_crypto_erith_ia/tools/compare_btc_cross_venue.py --audit-only
      - name: Query exact Coinbase minute history and Kraken original trades
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          root=public/agent_crypto_erith_ia/data/historical_archive_prototype
          python - <<'PY'
          import hashlib,os,json,pathlib
          root=pathlib.Path("public/agent_crypto_erith_ia/data/historical_archive_prototype")
          manifest=root/"btc_cross_exchange_incident_2023_03_24/index.json"
          original=hashlib.sha256((root/"btc_verified_gap_months/index.json").read_bytes()).hexdigest()
          if manifest.is_file():
              obj=json.loads(manifest.read_text())
              if (obj.get("schema")=="seven.crypto.btc.cross-venue-incident-evidence.v1"
                  and obj.get("requested_minutes")==80 and
                  obj.get("binance",{}).get("gap_source_catalog_sha256")==original):
                  pathlib.Path(os.environ["RUNNER_TEMP"],"cross-venue-noop").touch()
                  print("NOOP: the exact Binance incident has already been compared")
          PY
          if [[ -f "$RUNNER_TEMP/cross-venue-noop" ]]; then exit 0; fi
          python public/agent_crypto_erith_ia/tools/compare_btc_cross_venue.py --output "$RUNNER_TEMP/btc_cross_exchange_incident_2023_03_24"
          python - <<'PY'
          import json,os,pathlib
          path=pathlib.Path(os.environ["RUNNER_TEMP"])/"btc_cross_exchange_incident_2023_03_24"/"index.json"
          obj=json.loads(path.read_text())
          assert obj["requested_minutes"]==80
          assert obj["binance"]["native_1m_gap_minutes"]==80
          assert obj["binance_missing_1m_recovered"]==0
          assert obj["coinbase_exchange"]["pair"]=="BTC-USD"
          assert obj["kraken_spot"]["pair"]=="XBTUSD"
          assert obj["kraken_spot"]["samples_attempted"]==5
          assert obj["comparing_not_replacing_binance_bars"] is True
          print("CROSS-VENUE REAL RESULTS",json.dumps({
           "coinbase_minute_bars":obj["coinbase_exchange"]["minute_candles"],
           "coinbase_positive_volume":obj["coinbase_exchange"]["positive_volume_minutes"],
           "coinbase_status":obj["coinbase_exchange"]["source_status"],
           "kraken_exact_trading_probes":obj["kraken_spot"]["exact_minute_trade_probes"],
           "kraken_probe_statuses":[x["source_status"] for x in obj["kraken_spot"]["probes"]]
           },sort_keys=True))
          PY
      - name: Publish exact source-qualified BTC cross-venue evidence separately
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          if [[ -f "$RUNNER_TEMP/cross-venue-noop" ]]; then exit 0; fi
          root=public/agent_crypto_erith_ia/data/historical_archive_prototype
          for attempt in 1 2 3; do
            git fetch origin main
            old=$(sha256sum "$root/btc_verified_gap_months/index.json" | cut -d' ' -f1)
            newest=$(git show "origin/main:$root/btc_verified_gap_months/index.json" | sha256sum | cut -d' ' -f1)
            if [[ "$old" != "$newest" ]]; then
              echo "::error::Binance canonical minute source changed during venue comparison"
              exit 1
            fi
            git reset --hard origin/main
            mkdir -p "$root/btc_cross_exchange_incident_2023_03_24"
            cp -a "$RUNNER_TEMP/btc_cross_exchange_incident_2023_03_24/." "$root/btc_cross_exchange_incident_2023_03_24/"
            git add -- "$root/btc_cross_exchange_incident_2023_03_24"
            git diff --cached --check
            if git diff --cached --quiet; then
              echo "NOOP: identical cross-venue evidence published"
              exit 0
            fi
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Publish BTC March 2023 Coinbase Kraken independent trading evidence'
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: btc-2023-cross-venue-audit
          path: ${{ runner.temp }}/btc_cross_exchange_incident_2023_03_24/index.json
          if-no-files-found: ignore
          retention-days: 30
  btc-trade-original-pilot:
    # Three representative archived days; source-qualified trades, no fake 1m OHLCV.
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test source archive checksums, trade order, timestamps, and no invented candles
        run: |
          set -euo pipefail
          python -m py_compile public/agent_crypto_erith_ia/tools/audit_btc_trade_gaps.py
          python public/agent_crypto_erith_ia/tools/btc_trade_gap_test.py
          python public/agent_crypto_erith_ia/tools/audit_btc_trade_gaps.py --audit-only
      - name: Check whether identical trade research has already been published
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os,pathlib
          root=pathlib.Path("public/agent_crypto_erith_ia/data/historical_archive_prototype")
          path=root/"btc_trade_gap_pilot/index.json"
          if not path.is_file():raise SystemExit(0)
          idx=json.loads(path.read_text())
          ref=json.loads((root/"btc_daily_reference/index.json").read_text())
          catalog=hashlib.sha256((root/"btc_verified_gap_months/index.json").read_bytes()).hexdigest()
          if (idx.get("schema")=="seven.crypto.btc.trades-gap-pilot.v1"
              and idx.get("sample_count")==3
              and idx.get("source_gap_catalog_sha256")==catalog
              and idx.get("source_daily_reference_sha256")==ref["locked_source"]["data_sha256"]):
              pathlib.Path(os.environ["RUNNER_TEMP"],"btc-trades-pilot-noop").touch()
              print("NOOP: exactly this 3-day source evidence already published")
          PY
      - name: Download only 3 source-qualified BTC trades ZIPs and check original activity
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          if [[ -f "$RUNNER_TEMP/btc-trades-pilot-noop" ]]; then exit 0; fi
          python public/agent_crypto_erith_ia/tools/audit_btc_trade_gaps.py --output "$RUNNER_TEMP/btc_trade_gap_pilot"
          python - <<'PY'
          import json,os,pathlib
          p=pathlib.Path(os.environ["RUNNER_TEMP"])/"btc_trade_gap_pilot"/"index.json"
          j=json.loads(p.read_text())
          assert j["schema"]=="seven.crypto.btc.trades-gap-pilot.v1"
          assert j["sample_count"]==3 and j["original_missing_1m_global"]==5881
          assert j["minute_candles_reconstructed"]==0
          assert len(j["records"])==3
          assert j["sample_missing_1m"]>0
          for row in j["records"]:
              assert row["native_klines_created"]==0
              if row["source_status"]=="sha256_verified":
                  assert row["native_trade_rows"]>0
                  assert len(row["zip_sha256"])==64
                  assert len(row["checksum_sha256"])==64
                  assert row["trade_rows_in_kline_gaps"] <= row["native_trade_rows"]
          print("BTC TRADE ZIP SHA PILOT: VERIFIED",j["verified_trade_source_dates"],
            "of 3; native trade activity",j["observed_trades_in_gap_minutes"],
            "trades in",j["observed_gap_minutes_with_trades"],"missing-minute slots")
          PY
      - name: Publish separate BTC original-trades evidence with locked historical inputs
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          if [[ -f "$RUNNER_TEMP/btc-trades-pilot-noop" ]]; then exit 0; fi
          root=public/agent_crypto_erith_ia/data/historical_archive_prototype
          for attempt in 1 2 3; do
            git fetch origin main
            for p in btc_verified_gap_months/index.json btc_daily_reference/index.json; do
              previous=$(sha256sum "$root/$p" | cut -d' ' -f1)
              latest=$(git show "origin/main:$root/$p" | sha256sum | cut -d' ' -f1)
              if [[ "$previous" != "$latest" ]]; then
                echo "::error::BTC canonical source changed during original-trades pilot"
                exit 1
              fi
            done
            git reset --hard origin/main
            mkdir -p "$root/btc_trade_gap_pilot"
            cp -a "$RUNNER_TEMP/btc_trade_gap_pilot/." "$root/btc_trade_gap_pilot/"
            git add -- "$root/btc_trade_gap_pilot"
            git diff --cached --check
            if git diff --cached --quiet; then echo 'NOOP: already published'; exit 0; fi
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Record verified original BTC trade activity inside minute gaps'
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: btc-native-trade-gap-source-pilot
          path: ${{ runner.temp }}/btc_trade_gap_pilot/index.json
          if-no-files-found: ignore
          retention-days: 30
  btc-rest-and-trade-inventory:
    # This is evidence-only, not a live market feed or a trading component.
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recheck 3075-day immutable truth and offline API/trade audit tests
        run: |
          set -euo pipefail
          python -m py_compile public/agent_crypto_erith_ia/tools/audit_btc_minute_rest.py
          python -m py_compile public/agent_crypto_erith_ia/tools/btc_minute_rest_test.py
          python public/agent_crypto_erith_ia/tools/btc_minute_rest_test.py
          python public/agent_crypto_erith_ia/tools/audit_btc_minute_rest.py --audit-only
      - name: Check whether identical source-locked research already exists
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os,pathlib
          root=pathlib.Path("public/agent_crypto_erith_ia/data/historical_archive_prototype")
          folder=root/"btc_minute_api_research"
          manifest=folder/"index.json"
          if not manifest.is_file(): raise SystemExit(0)
          old=json.loads(manifest.read_text())
          candidate=folder/old.get("candidate_file","absent")
          prior=hashlib.sha256((root/"btc_minute_gap_audit/index.json").read_bytes()).hexdigest()
          daily=json.loads((root/"btc_daily_reference/index.json").read_text())
          original=hashlib.sha256((root/"btc_verified_gap_months/index.json").read_bytes()).hexdigest()
          if (old.get("source_policy")=="official_spot_btcusdt_1m_rest_utc_exact_with_native_witness.v1"
              and old.get("prior_minute_audit_sha256")==prior
              and old.get("frozen_daily_reference_sha256")==daily["locked_source"]["data_sha256"]
              and old.get("source_gap_catalog_sha256")==original
              and old.get("days_checked")==26 and old.get("original_missing_minutes")==5881
              and candidate.is_file() and
              hashlib.sha256(candidate.read_bytes()).hexdigest()==old.get("candidate_sha256")):
              pathlib.Path(os.environ["RUNNER_TEMP"],"btc-rest-noop").touch()
              print("NOOP: REST and trades ZIP research previously published on this source snapshot")
          PY
      - name: Query the original REST minutes and inventory native trade archives
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          if [[ -f "$RUNNER_TEMP/btc-rest-noop" ]]; then exit 0; fi
          python public/agent_crypto_erith_ia/tools/audit_btc_minute_rest.py --output "$RUNNER_TEMP/btc_minute_api_research"
          python - <<'PY'
          import gzip,hashlib,json,os,pathlib
          out=pathlib.Path(os.environ["RUNNER_TEMP"])/"btc_minute_api_research"
          idx=json.loads((out/"index.json").read_text())
          raw=(out/idx["candidate_file"]).read_bytes()
          obj=json.loads(gzip.decompress(raw))
          assert idx["schema"]=="seven.crypto.btc.native-minute-rest-research-index.v1"
          assert idx["original_missing_minutes"]==5881 and idx["days_checked"]==26
          assert idx["rest_native_1m_accepted"]+idx["still_missing_or_not_certified"]==5881
          assert len(idx["trade_archives_inventory"])==52
          assert idx["trade_archives_downloaded"]==0 and idx["trade_candles_reconstructed"]==0
          assert idx["accepted_minutes_applied_to_1m_source"] is False
          assert len(raw)==idx["candidate_bytes"]
          assert hashlib.sha256(raw).hexdigest()==idx["candidate_sha256"]
          assert len(obj["rows"])==idx["rest_native_1m_accepted"]
          assert obj["synthetic_rows"]==0
          assert sum(x["gap_minutes"] for x in idx["requests"])==5881
          print("BTC AUTHENTIC REST GAP QUERY PASS:",
                idx["rest_native_1m_accepted"],"certified API minutes;",
                idx["still_missing_or_not_certified"],"still missing/not certified",
                "API inconclusive:",idx["api_inconclusive_requested_minutes"])
          PY
      - name: Publish separate source-gated BTC historical research evidence
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          if [[ -f "$RUNNER_TEMP/btc-rest-noop" ]]; then exit 0; fi
          root=public/agent_crypto_erith_ia/data/historical_archive_prototype
          for attempt in 1 2 3; do
            git fetch origin main
            for file in btc_minute_gap_audit/index.json btc_daily_reference/index.json btc_verified_gap_months/index.json; do
              local_sha=$(sha256sum "$root/$file" | cut -d' ' -f1)
              latest_sha=$(git show "origin/main:$root/$file" | sha256sum | cut -d' ' -f1)
              if [[ "$local_sha" != "$latest_sha" ]]; then
                echo "::error::Canonical source changed during Binance REST minute audit"
                exit 1
              fi
            done
            git reset --hard origin/main
            mkdir -p "$root/btc_minute_api_research"
            cp -a "$RUNNER_TEMP/btc_minute_api_research/." "$root/btc_minute_api_research/"
            git add -- "$root/btc_minute_api_research"
            git diff --cached --check
            if git diff --cached --quiet; then
              echo 'NOOP: same original Binance REST source evidence already published'
              exit 0
            fi
            git config user.name 'github-actions[bot]'
