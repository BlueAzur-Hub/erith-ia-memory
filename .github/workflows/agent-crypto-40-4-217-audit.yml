name: Agent-Crypto 40.4.217 Market Table Delegation Release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/agent-crypto-40-4-217-audit.yml'

permissions:
  contents: write

concurrency:
  group: agent-crypto-40-4-217-market-delegation
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout canonical main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Execute bounded 40.4.217 release
        run: python .github/scripts/_tmp_agent_crypto_404217_release.py
