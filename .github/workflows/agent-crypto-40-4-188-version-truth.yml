name: Agent-Crypto 40.4.188 Version Truth Cache Lock

on:
  push:
    paths:
      - '.github/workflows/agent-crypto-40-4-188-version-truth.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: agent-crypto-40-4-188-version-truth
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Consolidate 40.4.188 publication truth
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, re
          from datetime import datetime, timezone

          root = Path('public/agent_crypto_erith_ia/administrator')
          build = '40.4.188'
          parent = '40.4.187'
          release = 'VERSION TRUTH · CACHE COHERENCE LOCK · 40.4.187 GRAPH GEOMETRY PRESERVED'
          status = 'version_truth_cache_coherence_lock_404188'
          stamp = datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z')

          def replace_one(text, pattern, repl, label, flags=0):
              out, n = re.subn(pattern, repl, text, count=1, flags=flags)
              if n != 1:
                  raise SystemExit(f'{label}: expected 1 match, got {n}')
              return out

          def replace_optional(text, pattern, repl, label, flags=0):
              out, n = re.subn(pattern, repl, text, count=1, flags=flags)
              if n > 1:
                  raise SystemExit(f'{label}: expected <=1 match, got {n}')
              return out

          def sha256(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()

          # Shared runtime publication owner. Business logic untouched.
          p = root / 'app.js'
          s = p.read_text(encoding='utf-8')
          s = replace_one(s, r'^const ATLAS_BUILD = "40\.4\.\d+";', f'const ATLAS_BUILD = "{build}";', 'ATLAS_BUILD', re.M)
          s = replace_optional(s, r'^const ATLAS_ASSET_TOKEN = "market-core-v2\.0-alpha-build-40\.4\.\d+";', f'const ATLAS_ASSET_TOKEN = "market-core-v2.0-alpha-build-{build}";', 'ATLAS_ASSET_TOKEN', re.M)
          p.write_text(s, encoding='utf-8')

          # Administrator runtime identity only.
          p = root / 'js/app.js'
          s = p.read_text(encoding='utf-8')
          s = replace_one(s, r'^  const ADMIN_BUILD = "40\.4\.\d+";', f'  const ADMIN_BUILD = "{build}";', 'ADMIN_BUILD', re.M)
          s = replace_one(s, r'^  const ADMIN_RELEASE = ".*?";', f'  const ADMIN_RELEASE = "{release}";', 'ADMIN_RELEASE', re.M)
          p.write_text(s, encoding='utf-8')

          # Preserve 40.4.187 graph geometry/behavior; advance identity only.
          for rel in ('js/market-stack.js', 'js/parallel-markets.js'):
              p = root / rel
              s = p.read_text(encoding='utf-8')
              s, n = re.subn(r'^(\s*const BUILD = ")40\.4\.\d+(";)', rf'\g<1>{build}\g<2>', s, count=1, flags=re.M)
              if n != 1:
                  raise SystemExit(f'{rel} BUILD: expected 1 match, got {n}')
              p.write_text(s, encoding='utf-8')

          # HTML publication identity + precise asset generation tokens.
          p = root / 'index.html'
          s = p.read_text(encoding='utf-8')
          s = replace_one(s, r'<meta name="atlas-build" content="40\.4\.\d+" />', f'<meta name="atlas-build" content="{build}" />', 'index atlas build')
          s = replace_one(s, r'<meta name="administrator-build" content="40\.4\.\d+" />', f'<meta name="administrator-build" content="{build}" />', 'index admin build')
          s = replace_one(s, r'<meta name="administrator-revision" content="[^"]+" />', '<meta name="administrator-revision" content="V5" />', 'index revision')
          s = replace_one(s, r'<meta name="administrator-release" content="[^"]+" />', f'<meta name="administrator-release" content="{release}" />', 'index release')
          s = replace_one(s, r'<meta name="atlas-asset-token" content="market-core-v2\.0-alpha-build-40\.4\.\d+" />', f'<meta name="atlas-asset-token" content="market-core-v2.0-alpha-build-{build}" />', 'index token')
          s = replace_one(s, r'<title>Agent-Crypto @erith\.IA — Build 40\.4\.\d+ · Administrator</title>', f'<title>Agent-Crypto @erith.IA — Build {build} · Administrator</title>', 'index title')

          # Only the graph/runtime generation controlled by the 40.4.185→187 line is retokened.
          assets = (
              ('href', './market-cascade.css'),
              ('href', './parallel-markets.css'),
              ('src', './app.js'),
              ('src', './js/app.js'),
              ('src', './js/market-stack.js'),
              ('src', './js/parallel-markets.js'),
          )
          for attr, asset in assets:
              pattern = rf'({attr}="{re.escape(asset)}\?v=administrator-build-)[^"]+(" )'
              # Most tags do not contain a trailing space before >; handle canonical form below.
              s2, n = re.subn(pattern, rf'\g<1>{build}\g<2>', s, count=1)
              if n == 0:
                  pattern = rf'({attr}="{re.escape(asset)}\?v=administrator-build-)[^"]+("[ >])'
                  s2, n = re.subn(pattern, rf'\g<1>{build}\g<2>', s, count=1)
              if n != 1:
                  raise SystemExit(f'cache token {asset}: expected 1 match, got {n}')
              s = s2

          # Footer is an operator-visible publication authority.
          s, n = re.subn(
              r'(<span id="footerRelease">Agent-Crypto @erith\.IA · Market Core · Build )40\.4\.\d+( · Version : Parker Lewis Can\'t Lose</span>)',
              rf'\g<1>{build}\g<2>', s, count=1)
          if n != 1:
              raise SystemExit(f'footer build: expected 1 match, got {n}')
          p.write_text(s, encoding='utf-8')

          # Canonical version manifest. Re-hash every declared payload file that exists.
          vp = root / 'version.json'
          v = json.loads(vp.read_text(encoding='utf-8'))
          v['release'] = release
          v['build'] = build
          v['asset_token'] = f'market-core-v2.0-alpha-build-{build}'
          v['status'] = status
          v['prepared_at'] = stamp
          v['published_at'] = stamp
          v['parent_build'] = parent
          note = '40.4.188 publication truth/cache consolidation; 40.4.187 static five-domain graph geometry preserved without transition or business-runtime change.'
          lineage = v.get('lineage', '')
          if note not in lineage:
              v['lineage'] = lineage + ' → ' + note
          files = v.setdefault('files', {})
          for rel in list(files):
              fp = root / rel
              if fp.is_file():
                  files[rel] = sha256(fp)
          vp.write_text(json.dumps(v, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          # Administrator mirror: top-level publication identity only.
          ap = root / 'administrator-version.json'
          av = json.loads(ap.read_text(encoding='utf-8'))
          av['build'] = build
          av['global_versioning'] = build
          if 'administrator_build' in av:
              av['administrator_build'] = build
          if 'primary_build' in av:
              av['primary_build'] = build
          av['release'] = release
          av['status'] = status
          av['prepared_at'] = stamp
          av['published_at'] = stamp
          av['timestamp'] = stamp
          if 'parent_build' in av:
              av['parent_build'] = parent
          if 'asset_token' in av:
              av['asset_token'] = f'market-core-v2.0-alpha-build-{build}'
          av['release_status'] = 'Publication authorities synchronized; 40.4.187 five-domain static graph geometry preserved.'
          ap.write_text(json.dumps(av, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          # Static truth gate.
          idx = (root/'index.html').read_text(encoding='utf-8')
          shared = (root/'app.js').read_text(encoding='utf-8')
          admin = (root/'js/app.js').read_text(encoding='utf-8')
          stack = (root/'js/market-stack.js').read_text(encoding='utf-8')
          parallel = (root/'js/parallel-markets.js').read_text(encoding='utf-8')
          v = json.loads((root/'version.json').read_text(encoding='utf-8'))
          av = json.loads((root/'administrator-version.json').read_text(encoding='utf-8'))

          assert f'const ATLAS_BUILD = "{build}";' in shared
          assert f'const ADMIN_BUILD = "{build}";' in admin
          assert f'const BUILD = "{build}";' in stack
          assert f'const BUILD = "{build}";' in parallel
          assert f'<meta name="atlas-build" content="{build}" />' in idx
          assert f'<meta name="administrator-build" content="{build}" />' in idx
          assert f'Build {build} · Version : Parker Lewis Can\'t Lose' in idx
          assert '<meta name="atlas-engine-build" content="38.15.11" />' in idx
          assert 'const ENGINE_BUILD = "38.15.11";' in admin
          assert v['build'] == build and v['parent_build'] == parent
          assert v['engine']['reference_build'] == '38.15.11'
          assert av['build'] == build and av['global_versioning'] == build
          for _, asset in assets:
              assert f'{asset}?v=administrator-build-{build}' in idx, asset
          for rel, digest in v.get('files', {}).items():
              fp = root / rel
              if fp.is_file():
                  assert digest == sha256(fp), rel
          print('40.4.188 VERSION TRUTH / CACHE COHERENCE PASS')
          PY

      - name: JavaScript syntax gate
        run: |
          node --check public/agent_crypto_erith_ia/administrator/app.js
          node --check public/agent_crypto_erith_ia/administrator/js/app.js
          node --check public/agent_crypto_erith_ia/administrator/js/market-stack.js
          node --check public/agent_crypto_erith_ia/administrator/js/parallel-markets.js

      - name: Commit release and retire one-shot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/agent-crypto-40-4-188-version-truth.yml
          git add public/agent_crypto_erith_ia/administrator/index.html \
                  public/agent_crypto_erith_ia/administrator/app.js \
                  public/agent_crypto_erith_ia/administrator/js/app.js \
                  public/agent_crypto_erith_ia/administrator/js/market-stack.js \
                  public/agent_crypto_erith_ia/administrator/js/parallel-markets.js \
                  public/agent_crypto_erith_ia/administrator/version.json \
                  public/agent_crypto_erith_ia/administrator/administrator-version.json
          git commit -m 'release Agent-Crypto 40.4.188 version truth cache coherence lock'

          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 3))
          done
          exit 1
