name: Agent Crypto audit orphan release scripts

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/agent-crypto-audit-orphan-scripts.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Audit script ownership
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json,re

          SCRIPTS=Path('.github/scripts')
          WORKFLOWS=Path('.github/workflows')
          SELF='agent-crypto-audit-orphan-scripts.yml'
          protected_words={
            'aether':'AETHER','oracle':'ORACLE','atlas':'ATLAS','market':'MARKET',
            'strategy':'STRATEGY','paper':'PAPER','version':'VERSION_TRUTH',
            'collector':'COLLECTOR','youtube':'YOUTUBE','bridge':'BRIDGE'
          }

          workflow_text={}
          for p in WORKFLOWS.glob('*.y*ml'):
              if p.name==SELF: continue
              workflow_text[p]=p.read_text(encoding='utf-8',errors='replace')

          rows=[]
          for p in sorted(SCRIPTS.rglob('*')):
              if not p.is_file(): continue
              rel=p.as_posix()
              text=p.read_text(encoding='utf-8',errors='replace') if p.suffix.lower() in {'.py','.js','.sh','.ps1','.mjs','.cjs','.txt','.md'} else ''
              refs=[]
              for wf,wtext in workflow_text.items():
                  if rel in wtext or p.name in wtext:
                      refs.append(wf.as_posix())
              prot=[]
              low=(rel+'\n'+text).lower()
              for word,label in protected_words.items():
                  if word in rel.lower(): prot.append(label)
              # Content-level protection only for direct protected module ownership markers.
              if not prot:
                  for word,label in [('aether','AETHER'),('oracle','ORACLE'),('atlas','ATLAS'),('strategy-a','STRATEGY'),('market-core','MARKET_CORE')]:
                      if word in text.lower(): prot.append(label)
              builds=sorted(set(re.findall(r'40[._-](?:3|4|5|6)[._-]\d+(?:[._-]\d+)?',rel+'\n'+text)))[:20]
              current='40.6.124' in (rel+'\n'+text)
              if prot:
                  cls='PROTECTED'
              elif refs:
                  cls='REFERENCED_BY_WORKFLOW'
              elif current:
                  cls='UNREFERENCED_CURRENT_BUILD_REVIEW'
              elif builds:
                  cls='UNREFERENCED_HISTORICAL_CANDIDATE'
              else:
                  cls='UNREFERENCED_NEUTRAL_REVIEW'
              rows.append({
                  'path':rel,'bytes':p.stat().st_size,'classification':cls,
                  'protected':sorted(set(prot)),'workflow_refs':sorted(refs),
                  'build_refs_sample':builds,'current_build_ref':current
              })

          counts={}
          for r in rows: counts[r['classification']]=counts.get(r['classification'],0)+1
          candidates=[r for r in rows if r['classification'] in {'UNREFERENCED_HISTORICAL_CANDIDATE','UNREFERENCED_NEUTRAL_REVIEW'}]
          print(json.dumps({
              'script_file_count':len(rows),
              'classification_counts':counts,
              'unreferenced_candidates':candidates,
              'mutation':'none'
          },indent=2,ensure_ascii=False))
          PY

      - name: Retire one-shot audit workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Seven Heaven Refactor'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/agent-crypto-audit-orphan-scripts.yml
          git commit -m 'chore(agent-crypto): retire orphan script audit tooling'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if ! git rebase origin/main; then git rebase --abort || true; exit 1; fi
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
