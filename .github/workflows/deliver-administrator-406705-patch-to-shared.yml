name: Deliver 40.6.705 scanner clock integrity patch
on:
  push:
    branches:
      - test/administrator-40.6.705-recovery
    paths:
      - .github/workflows/deliver-administrator-406705-patch-to-shared.yml
  workflow_dispatch:
jobs:
  publish-repair:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify real source and regression before packaging
        shell: bash
        run: |
          set -euo pipefail
          node --check public/agent_crypto_erith_ia/administrator/app.js
          node public/agent_crypto_erith_ia/tools/test_administrator_canonical_top5_integrity_406650.cjs
          node public/agent_crypto_erith_ia/tools/test_administrator_scanner_window_integrity_406705.cjs
      - name: Package EXACT two changed files and verify
        shell: bash
        run: |
          python3 - <<'PY'
          import zipfile, pathlib, hashlib, json
          files = [
            "public/agent_crypto_erith_ia/administrator/app.js",
            "public/agent_crypto_erith_ia/tools/test_administrator_scanner_window_integrity_406705.cjs"
          ]
          dst = pathlib.Path("coordination/inter_ai_dialogues/agent_crypto/AGENT_CRYPTO_ADMINISTRATOR_40.6.705_SCANNER_24H_BASE100_CLOCK_INTEGRITY_2_FILES.zip")
          with zipfile.ZipFile(dst,"w",zipfile.ZIP_DEFLATED,compresslevel=9) as z:
            for name in files:
              assert pathlib.Path(name).is_file(), name
              z.write(name, name)
          with zipfile.ZipFile(dst) as z:
            assert z.testzip() is None
            assert z.namelist() == files
            assert all(z.read(name) == pathlib.Path(name).read_bytes() for name in files)
          assert dst.stat().st_size < 5_000_000, "Unexpected oversized patch"
          dst.with_name(dst.name+".sha256").write_text(hashlib.sha256(dst.read_bytes()).hexdigest()+"  "+dst.name+"\n")
          print("PATCH VERIFIED:",dst.stat().st_size,"bytes",len(files),"files")
          PY
          cd coordination/inter_ai_dialogues/agent_crypto
          sha256sum -c AGENT_CRYPTO_ADMINISTRATOR_40.6.705_SCANNER_24H_BASE100_CLOCK_INTEGRITY_2_FILES.zip.sha256
      - name: Publish ZIP and SHA to shared directory of main only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git worktree add --detach /tmp/crypto-705-publish origin/main
          src="$GITHUB_WORKSPACE/coordination/inter_ai_dialogues/agent_crypto"
          dest="/tmp/crypto-705-publish/coordination/inter_ai_dialogues/agent_crypto"
          cp "$src/AGENT_CRYPTO_ADMINISTRATOR_40.6.705_SCANNER_24H_BASE100_CLOCK_INTEGRITY_2_FILES.zip" "$dest/"
          cp "$src/AGENT_CRYPTO_ADMINISTRATOR_40.6.705_SCANNER_24H_BASE100_CLOCK_INTEGRITY_2_FILES.zip.sha256" "$dest/"
          cd /tmp/crypto-705-publish
          git add coordination/inter_ai_dialogues/agent_crypto/AGENT_CRYPTO_ADMINISTRATOR_40.6.705_SCANNER_24H_BASE100_CLOCK_INTEGRITY_2_FILES.zip*
          git commit -m "Archive verified Administrator 40.6.705 scanner Base100 clock repair"
          for attempt in 1 2 3 4 5 6; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
