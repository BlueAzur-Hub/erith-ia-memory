name: Administrator scanner server EUR evidence (isolated)
on:
  pull_request:
    paths:
      - "public/agent_crypto_erith_ia/tools/scanner_verified_history.cjs"
      - "public/agent_crypto_erith_ia/tools/test_scanner_verified_history.cjs"
      - ".github/workflows/administrator-scanner-server-eur-evidence.yml"
  workflow_dispatch:
    inputs:
      five_coingecko_ids:
        description: "Five frozen exact CoinGecko IDs, comma separated"
        required: true
        type: string
      market_frame_id:
        description: "Frozen Market Frame identity; no live reselection"
        required: true
        type: string
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check source syntax
        run: node --check public/agent_crypto_erith_ia/tools/scanner_verified_history.cjs
      - name: Run deterministic fail-closed evidence tests
        run: node --test public/agent_crypto_erith_ia/tools/test_scanner_verified_history.cjs
  acquire:
    if: github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Fetch exact five histories to an isolated evidence artifact only
        env:
          SCAN_IDS: ${{ inputs.five_coingecko_ids }}
          SCAN_FRAME: ${{ inputs.market_frame_id }}
          COINGECKO_DEMO_API_KEY: ${{ secrets.COINGECKO_DEMO_API_KEY }}
        run: |
          mkdir -p evidence
          node public/agent_crypto_erith_ia/tools/scanner_verified_history.cjs \
            "--ids=${SCAN_IDS}" "--frame=${SCAN_FRAME}" "--output=evidence/scanner_server_history.json"
      - name: Archive independently verifiable evidence, never publish to main
        uses: actions/upload-artifact@v4
        with:
          name: scanner-eur-evidence
          path: evidence/scanner_server_history.json
          if-no-files-found: error
          retention-days: 7

  diagnostic_probe:
    # One-shot PR-only server experiment. Never used by live browser or main.
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 700 && github.event.pull_request.head.repo.full_name == github.repository }}
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Freeze an archived public market snapshot as diagnostic-only evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          curl --fail --silent --show-error --location --max-time 30 \
            "https://raw.githubusercontent.com/BlueAzur-Hub/erith-ia-memory/a6d3bf05a012d750a3d917f0e2dbd4be93936dd6/public/agent_crypto_erith_ia/data/crypto/latest.json" \
            -o evidence/frozen_market_snapshot.json
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'evidence/frozen_market_snapshot.json';
          const d = JSON.parse(fs.readFileSync(path,'utf8'));
          const id='coingecko-top250-usd-ecb-eur-github_2026-10-28T06:15:24.810Z';
          if(d.schema!=='agent_crypto_public_market_snapshot_v1' || d.snapshot_id!==id || d.generated_at!=='2026-10-28T06:15:24.810Z' || d.assets_count!==250 || d.source?.provider_id!=='coingecko') throw Error('Archived snapshot identity mismatch');
          const five=d.coins.filter(x=>x.rank<=100 && Number.isFinite(x.change24h))
            .sort((a,b)=>a.change24h-b.change24h || a.rank-b.rank).slice(0,5).map(x=>x.id);
          const expected=['pearl-2','pancakeswap-token','rain','beldex','venice-token'];
          if(JSON.stringify(five)!==JSON.stringify(expected)) throw Error('Frozen diagnostic cohort changed unexpectedly');
          const frame='diagnostic:'+id;
          const proof={mode:'diagnostic-source-snapshot-only',isAdministratorMarketFrame:false,
            archiveCommit:'a6d3bf05a012d750a3d917f0e2dbd4be93936dd6',
            snapshotId:id,snapshotGeneratedAt:d.generated_at,
            selectionRule:'snapshot Top 100, ascending source change24h (USD), no identity substitutions',
            frozenCoinGeckoIds:five,
            warning:'Historical diagnostic cohort; NOT the current Firefox Baisse 5 frame. Do not integrate into scanner.'};
          fs.writeFileSync('evidence/frozen_diagnostic_cohort.json',JSON.stringify(proof,null,2)+'\n');
          fs.appendFileSync(process.env.GITHUB_OUTPUT,'ids='+five.join(',')+'\nframe='+frame+'\n');
          NODE
        id: frame
      - name: Acquire five EUR historical series via same generic collector
        env:
          SCAN_IDS: ${{ steps.frame.outputs.ids }}
          SCAN_FRAME: ${{ steps.frame.outputs.frame }}
          COINGECKO_DEMO_API_KEY: ${{ secrets.COINGECKO_DEMO_API_KEY }}
        run: |
          node public/agent_crypto_erith_ia/tools/scanner_verified_history.cjs \
            "--ids=${SCAN_IDS}" "--frame=${SCAN_FRAME}" \
            "--output=evidence/scanner_server_history.json"
      - name: Store diagnostic evidence as a seven-day PR artifact only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scanner-eur-pr700-diagnostic
          path: |
            evidence/frozen_diagnostic_cohort.json
            evidence/scanner_server_history.json
          if-no-files-found: warn
          retention-days: 7
