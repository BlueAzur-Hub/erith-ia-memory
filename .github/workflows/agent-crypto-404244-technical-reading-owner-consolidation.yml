name: Agent-Crypto 40.4.244 Technical Reading owner consolidation

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/agent-crypto-404244-technical-reading-owner-consolidation.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Consolidate Technical Reading geometry owner
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re, textwrap

          BASE = Path('public/agent_crypto_erith_ia/administrator')
          INDEX = BASE / 'index.html'
          VISUAL = BASE / 'admin-visual-assets.css'
          SYSTEM = BASE / 'js/views/system-presentation.js'

          version = json.loads((BASE/'version.json').read_text(encoding='utf-8'))
          assert version['build'] == '40.4.243', version['build']
          assert version['engine']['reference_build'] == '38.15.11'
          assert version['engine']['status'] == 'protected'

          GEOM_HOST = {
            'position','inset','top','right','bottom','left','display','width','height',
            'min-width','min-height','max-width','max-height','flex','flex-basis',
            'flex-direction','aspect-ratio','margin','margin-top','margin-right',
            'margin-bottom','margin-left','padding','padding-top','padding-right',
            'padding-bottom','padding-left','overflow','overflow-x','overflow-y',
            'object-fit','object-position','transform','filter','z-index','box-sizing'
          }
          GEOM_BODY = {
            'position','z-index','display','width','height','min-width','min-height',
            'max-width','max-height','flex','flex-basis','flex-direction','margin',
            'margin-top','margin-right','margin-bottom','margin-left','padding',
            'padding-top','padding-right','padding-bottom','padding-left','gap',
            'overflow','overflow-x','overflow-y','overscroll-behavior','scrollbar-gutter',
            'box-sizing'
          }
          GEOM_WORKSPACE = {
            'display','position','padding-right','grid-template-columns',
            'grid-template-rows','align-items','height','min-height','max-height'
          }

          DECL_RE = re.compile(r'(?P<prop>--[-\w]+|[-\w]+)\s*:\s*(?P<value>[^;{}]*)(?P<semi>;?)')
          RULE_RE = re.compile(r'(?P<selector>[^{}]+)\{(?P<body>[^{}]*)\}', re.S)

          def strip_props(body, props):
            def repl(m):
              return '' if m.group('prop').strip().lower() in props else m.group(0)
            return DECL_RE.sub(repl, body)

          def clean_rules(css, *, index_mode=False):
            def clean_rule(m):
              selector = m.group('selector')
              body = m.group('body')
              sel = selector.lower()
              original = body

              if '.detail-project-visual.admin-tech-r3' in sel or '.admin-tech-portrait-r3' in sel:
                body = strip_props(body, GEOM_HOST)
              if '#detailpanel' in sel and '.detail-panel-body' in sel:
                body = strip_props(body, GEOM_BODY)
              if '#detailpanel' in sel and ('.detail-panel-toggle' in sel or '.atlas-tech-static-toolbar' in sel):
                body = strip_props(body, {'position','z-index'})
              if '#analyste.champagne-clean-lens:not(.detail-collapsed)' in sel and '#detailpanel' not in sel:
                body = strip_props(body, GEOM_WORKSPACE)
              if '#detailpanel.clean-lens-detail-panel' in sel and '.detail-panel-body' not in sel and '.detail-panel-toggle' not in sel:
                # Only geometry is removed. Background/border/opacity rules stay where they were.
                body = strip_props(body, {
                  'position','top','right','bottom','left','display','width','height',
                  'min-width','min-height','max-width','max-height','flex','flex-direction',
                  'margin','overflow','overflow-x','overflow-y','box-sizing','z-index'
                })

              if body == original:
                return m.group(0)
              if not body.strip():
                return ''
              return selector + '{' + body + '}'
            return RULE_RE.sub(clean_rule, css)

          # ---- index.html: retire every late inline Technical Reading geometry/framing owner.
          index = INDEX.read_text(encoding='utf-8')
          assert index.count('atlasTechnicalReadingHistoricalDock404243') == 1
          assert index.count('atlasTechnicalReadingFrameLock40259') == 1

          STYLE_RE = re.compile(r'<style(?P<attrs>[^>]*)>(?P<css>.*?)</style>', re.S | re.I)
          removed_ids = []
          def clean_style_tag(m):
            attrs, css = m.group('attrs'), m.group('css')
            idm = re.search(r'\bid=["\']([^"\']+)["\']', attrs, re.I)
            sid = idm.group(1) if idm else ''
            if sid in {'atlasTechnicalReadingHistoricalDock404243','atlasTechnicalReadingFrameLock40259'}:
              removed_ids.append(sid)
              return ''
            cleaned = clean_rules(css, index_mode=True)
            return '<style' + attrs + '>' + cleaned + '</style>'

          index = STYLE_RE.sub(clean_style_tag, index)
          assert set(removed_ids) == {'atlasTechnicalReadingHistoricalDock404243','atlasTechnicalReadingFrameLock40259'}, removed_ids
          assert 'atlasTechnicalReadingHistoricalDock404243' not in index
          assert 'atlasTechnicalReadingFrameLock40259' not in index

          # Cache-bust the one canonical Administrator visual owner.
          old_link = '<link rel="stylesheet" href="./admin-visual-assets.css" />'
          new_link = '<link rel="stylesheet" href="./admin-visual-assets.css?v=administrator-build-40.4.244" />'
          assert old_link in index and new_link not in index
          index = index.replace(old_link, new_link, 1)

          # Keep System presentation cache truth aligned with the release.
          old_system_script = '<script src="./js/views/system-presentation.js?v=administrator-build-40.4.243"></script>'
          new_system_script = '<script src="./js/views/system-presentation.js?v=administrator-build-40.4.244"></script>'
          assert old_system_script in index
          index = index.replace(old_system_script, new_system_script, 1)
          INDEX.write_text(index, encoding='utf-8')

          system = SYSTEM.read_text(encoding='utf-8')
          old_source = 'const SOURCE="./views/system.html?v=administrator-build-40.4.243";'
          new_source = 'const SOURCE="./views/system.html?v=administrator-build-40.4.244";'
          assert old_source in system
          SYSTEM.write_text(system.replace(old_source, new_source, 1), encoding='utf-8')

          # ---- admin-visual-assets.css: neutralize all historical geometry/framing
          # declarations for Technical Reading, but preserve their visual alpha/border history.
          visual = VISUAL.read_text(encoding='utf-8')
          assert 'TECHNICAL_READING_CANONICAL_OWNER_404244' not in visual
          visual = clean_rules(visual)

          canonical = textwrap.dedent(r'''

          /* ==========================================================================
             TECHNICAL_READING_CANONICAL_OWNER_404244
             Agent-Crypto 40.4.244 — one Administrator geometry/image owner.

             Proven contract preserved:
             - 28.2.5 / 28.2.9: graph owns workspace height; detail is an absolute
               right dock; long detail content scrolls internally and never grows graph.
             - 40.2.65: immersive selected/private portrait remains cover-rendered.
             - 40.4.243: current 360px right-dock/full-panel portrait appearance retained.

             This block owns geometry + portrait framing only. Opacity/contrast remains
             owned by admin-visual-cache.css and the surviving visual-only historical rules.
             No data, graph canvas, RND library, picker persistence or runtime owner here.
             ========================================================================== */

          @media (min-width:901px){
            body.atlas-administrator-mirror
            #analyste.champagne-clean-lens:not(.detail-collapsed){
              display:block!important;
              position:relative!important;
              padding-right:calc(var(--atlas-open-detail-width,360px) + 7px)!important;
              grid-template-columns:none!important;
              grid-template-rows:none!important;
            }

            body.atlas-administrator-mirror
            #analyste.champagne-clean-lens:not(.detail-collapsed) > #detailPanel.atlas-tech-static-cycle.atlas-classic-web-tech-40261{
              position:absolute!important;
              top:0!important;
              right:0!important;
              bottom:0!important;
              left:auto!important;
              width:var(--atlas-open-detail-width,360px)!important;
              min-width:0!important;
              max-width:var(--atlas-open-detail-width,360px)!important;
              height:100%!important;
              min-height:0!important;
              max-height:100%!important;
              margin:0!important;
              overflow:hidden!important;
              display:flex!important;
              flex-direction:column!important;
              box-sizing:border-box!important;
              z-index:30!important;
            }
          }

          body.atlas-administrator-mirror
          #analyste.champagne-clean-lens:not(.detail-collapsed)
          #detailPanel.atlas-tech-static-cycle.atlas-classic-web-tech-40261::before,
          body.atlas-administrator-mirror
          #analyste.champagne-clean-lens:not(.detail-collapsed)
          #detailPanel.atlas-tech-static-cycle.atlas-classic-web-tech-40261::after{
            content:none!important;
            display:none!important;
            visibility:hidden!important;
            opacity:0!important;
            background:none!important;
            background-image:none!important;
            filter:none!important;
          }

          body.atlas-administrator-mirror
          #analyste.champagne-clean-lens:not(.detail-collapsed)
          #detailPanel.atlas-tech-static-cycle.atlas-classic-web-tech-40261
          .detail-project-visual.admin-tech-r3{
            position:absolute!important;
            inset:0!important;
            top:0!important;
            right:0!important;
            bottom:0!important;
            left:0!important;
            display:block!important;
            width:100%!important;
            height:100%!important;
            min-width:0!important;
            min-height:0!important;
            max-width:none!important;
            max-height:none!important;
            margin:0!important;
            padding:0!important;
            flex:none!important;
            aspect-ratio:auto!important;
            overflow:hidden!important;
            background:transparent!important;
            border:0!important;
            border-radius:0!important;
            box-shadow:none!important;
            z-index:0!important;
            isolation:isolate!important;
            cursor:pointer!important;
          }

          body.atlas-administrator-mirror
          #analyste.champagne-clean-lens:not(.detail-collapsed)
          #detailPanel.atlas-tech-static-cycle.atlas-classic-web-tech-40261
          .detail-project-visual.admin-tech-r3 > .admin-tech-portrait-r3{
            position:absolute!important;
            inset:0!important;
            width:100%!important;
            height:100%!important;
            min-width:100%!important;
            min-height:100%!important;
            max-width:none!important;
            max-height:none!important;
            margin:0!important;
            padding:0!important;
            object-fit:cover!important;
            object-position:var(--admin-tech-x,50%) var(--admin-tech-y,50%)!important;
            opacity:1!important;
            filter:none!important;
            transform:none!important;
            z-index:0!important;
            pointer-events:none!important;
            user-select:none!important;
          }

          body.atlas-administrator-mirror #detailPanel .detail-project-visual.admin-tech-r3 > span{
            position:absolute!important;
            left:10px!important;
            right:auto!important;
            top:156px!important;
            bottom:auto!important;
            z-index:4!important;
            max-width:calc(100% - 20px)!important;
            padding:4px 7px!important;
            border-radius:999px!important;
          }

          body.atlas-administrator-mirror #detailPanel .detail-project-visual.admin-tech-r3::after,
          body.atlas-administrator-mirror #detailPanel .admin-tech-reset-r3{
            content:none!important;
            display:none!important;
            visibility:hidden!important;
            opacity:0!important;
          }

          body.atlas-administrator-mirror
          #analyste.champagne-clean-lens:not(.detail-collapsed)
          #detailPanel.atlas-tech-static-cycle.atlas-classic-web-tech-40261 > .detail-panel-toggle,
          body.atlas-administrator-mirror
          #analyste.champagne-clean-lens:not(.detail-collapsed)
          #detailPanel.atlas-tech-static-cycle.atlas-classic-web-tech-40261 > .atlas-tech-static-toolbar,
          body.atlas-administrator-mirror
          #analyste.champagne-clean-lens:not(.detail-collapsed)
          #detailPanel.atlas-tech-static-cycle.atlas-classic-web-tech-40261 > .detail-panel-body{
            position:relative!important;
            z-index:3!important;
          }

          body.atlas-administrator-mirror
          #analyste.champagne-clean-lens:not(.detail-collapsed)
          #detailPanel.atlas-tech-static-cycle.atlas-classic-web-tech-40261 > .detail-panel-body{
            display:flex!important;
            flex:1 1 auto!important;
            flex-direction:column!important;
            min-height:0!important;
            width:100%!important;
            margin:0!important;
            padding:0!important;
            gap:5px!important;
            overflow-y:auto!important;
            overflow-x:hidden!important;
            overscroll-behavior:contain!important;
            scrollbar-gutter:auto!important;
            background:transparent!important;
          }
          ''')

          VISUAL.write_text(visual.rstrip() + '\n' + canonical, encoding='utf-8')

          contract = {
            'build':'40.4.244',
            'parent':'40.4.243',
            'scope':'technical_reading_geometry_and_portrait_owner_consolidation',
            'historical_reference':'28.2.5/28.2.9 geometry + 40.2.65 immersive renderer + 40.4.243 dock recovery',
            'visual_redesign':False,
            'preserve_404243_operator_screenshot_contract':True,
            'canonical_geometry_owner':'admin-visual-assets.css#TECHNICAL_READING_CANONICAL_OWNER_404244',
            'legacy_inline_geometry_owner_404243_retired':True,
            'legacy_inline_frame_lock_40259_retired':True,
            'legacy_portrait_geometry_neutralized_in_head':True,
            'legacy_portrait_geometry_neutralized_in_admin_visual_assets':True,
            'graph_is_height_owner':True,
            'detail_panel_absolute_right_dock':True,
            'detail_body_internal_scroll':True,
            'portrait_full_panel':True,
            'portrait_fit':'cover',
            'portrait_focal_variables_preserved':True,
            'admin_visual_cache_opacity_owner_untouched':True,
            'rnd_library_changed':False,
            'rnd_assets_changed':False,
            'local_upload_changed':False,
            'private_image_storage_changed':False,
            'market_graph_changed':False,
            'parallel_markets_changed':False,
            'data_changed':False,
            'atlas_changed':False,
            'oracle_changed':False,
            'math_core_changed':False,
            'window_manager_changed':False,
            'bridge_changed':False,
            'market_core_changed':False,
            'protected_market_core':'38.15.11',
            'new_timer':False,
            'new_observer':False,
            'new_fetch':False,
            'new_websocket':False,
            'new_scheduler':False
          }
          Path('/tmp/contract-404244.json').write_text(json.dumps(contract,ensure_ascii=False,indent=2),encoding='utf-8')
          PY

      - name: Release identity 40.4.244
        shell: bash
        run: |
          python .github/scripts/agent_crypto_release_driver.py \
            --build 40.4.244 \
            --parent 40.4.243 \
            --release "TECHNICAL READING · CANONICAL GEOMETRY OWNER CONSOLIDATION" \
            --status "technical_reading_canonical_geometry_owner_consolidation_404244" \
            --contract-key "technical_reading_canonical_geometry_owner_consolidation_404244" \
            --contract-json /tmp/contract-404244.json \
            --lineage-note "40.4.244 consolidates Technical Reading geometry and portrait framing into admin-visual-assets.css while preserving the validated 28.2.5/28.2.9 right-dock contract and the 40.2.65/40.4.243 immersive cover presentation"

      - name: Prove single effective Technical Reading geometry owner
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,re
          base=Path('public/agent_crypto_erith_ia/administrator')
          index=(base/'index.html').read_text(encoding='utf-8')
          visual=(base/'admin-visual-assets.css').read_text(encoding='utf-8')
          system=(base/'js/views/system-presentation.js').read_text(encoding='utf-8')
          version=json.loads((base/'version.json').read_text(encoding='utf-8'))

          assert version['build']=='40.4.244'
          assert version['parent_build']=='40.4.243'
          assert version['engine']['reference_build']=='38.15.11'
          assert version['engine']['status']=='protected'
          assert visual.count('TECHNICAL_READING_CANONICAL_OWNER_404244')==1
          assert 'atlasTechnicalReadingHistoricalDock404243' not in index
          assert 'atlasTechnicalReadingFrameLock40259' not in index
          assert './admin-visual-assets.css?v=administrator-build-40.4.244' in index
          assert '<script src="./js/views/system-presentation.js?v=administrator-build-40.4.244"></script>' in index
          assert 'const SOURCE="./views/system.html?v=administrator-build-40.4.244";' in system

          marker=visual.index('TECHNICAL_READING_CANONICAL_OWNER_404244')
          before=visual[:marker]
          rule_re=re.compile(r'(?P<sel>[^{}]+)\{(?P<body>[^{}]*)\}',re.S)
          forbidden_host=('position','inset','top','right','bottom','left','width','height','min-width','min-height','max-width','max-height','flex','aspect-ratio','object-fit','object-position','transform')
          for m in rule_re.finditer(before):
            sel=m.group('sel').lower(); body=m.group('body').lower()
            if '.detail-project-visual.admin-tech-r3' in sel or '.admin-tech-portrait-r3' in sel:
              for prop in forbidden_host:
                assert not re.search(r'(?<![-\w])'+re.escape(prop)+r'\s*:',body), (sel[-160:],prop,body)

          # No late inline portrait/wrapper framing survives after external owner load.
          head=index[:index.index('</head>')]
          for m in re.finditer(r'<style[^>]*>(.*?)</style>',head,re.S|re.I):
            css=m.group(1)
            for r in rule_re.finditer(css):
              sel=r.group('sel').lower(); body=r.group('body').lower()
              if '.detail-project-visual.admin-tech-r3' in sel or '.admin-tech-portrait-r3' in sel:
                for prop in forbidden_host:
                  assert not re.search(r'(?<![-\w])'+re.escape(prop)+r'\s*:',body), (sel[-160:],prop,body)
              if '#analyste.champagne-clean-lens:not(.detail-collapsed)' in sel and '#detailpanel' not in sel:
                for prop in ('display','position','padding-right','grid-template-columns','grid-template-rows'):
                  assert not re.search(r'(?<![-\w])'+re.escape(prop)+r'\s*:',body), (sel[-160:],prop,body)

          owner=visual[marker:]
          for proof in (
            'padding-right:calc(var(--atlas-open-detail-width,360px) + 7px)!important;',
            'position:absolute!important;',
            'width:var(--atlas-open-detail-width,360px)!important;',
            'height:100%!important;',
            'object-fit:cover!important;',
            'object-position:var(--admin-tech-x,50%) var(--admin-tech-y,50%)!important;',
            'overflow-y:auto!important;'
          ):
            assert proof in owner, proof

          # The RND/local-image runtime remains present; no asset path was touched.
          for name in ('technical-random-11.png','technical-random-12.png','technical-random-16.png'):
            assert name in index, name
          assert 'AgentCryptoPrivateVisuals40269' in index
          print('TECHNICAL_READING_OWNER_404244_PASS')
          PY

          python .github/scripts/agent_crypto_version_truth_guard.py \
            --expected-build 40.4.244 \
            --expected-release "TECHNICAL READING · CANONICAL GEOMETRY OWNER CONSOLIDATION"

          node --check public/agent_crypto_erith_ia/administrator/app.js
          node --check public/agent_crypto_erith_ia/administrator/js/app.js
          node --check public/agent_crypto_erith_ia/administrator/js/views/system-presentation.js

      - name: Scope guard
        shell: bash
        run: |
          python - <<'PY'
          import subprocess
          allowed={
            'public/agent_crypto_erith_ia/administrator/admin-visual-assets.css',
            'public/agent_crypto_erith_ia/administrator/administrator-version.json',
            'public/agent_crypto_erith_ia/administrator/app.js',
            'public/agent_crypto_erith_ia/administrator/build.json',
            'public/agent_crypto_erith_ia/administrator/index.html',
            'public/agent_crypto_erith_ia/administrator/js/app.js',
            'public/agent_crypto_erith_ia/administrator/js/views/system-presentation.js',
            'public/agent_crypto_erith_ia/administrator/version.json',
          }
          changed=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          assert changed==allowed, (sorted(changed),sorted(allowed))
          print('scope ok')
          PY

      - name: Commit final release
        shell: bash
        run: |
          rm -f .github/workflows/agent-crypto-404244-technical-reading-owner-consolidation.yml
          git config user.name "Aether Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "agent-crypto: build 40.4.244 consolidate Technical Reading geometry owner"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Build final differential package
        shell: bash
        run: |
          rm -rf /tmp/pkg && mkdir -p /tmp/pkg
          git diff --diff-filter=ACMRT --name-only HEAD^ HEAD | while read f; do
            [ -f "$f" ] || continue
            mkdir -p "/tmp/pkg/$(dirname "$f")"
            cp "$f" "/tmp/pkg/$f"
          done
          cat > /tmp/pkg/FILES_CHANGED_40.4.244.md <<'EOF'
          # Agent-Crypto 40.4.244 — final Technical Reading consolidation

          - Preserves the validated 40.4.243 visible contract: Technical Reading docked right, graph owns height, internal detail scroll, full-panel immersive portrait.
          - Consolidates Administrator geometry + portrait framing into one effective owner in `admin-visual-assets.css`.
          - Retires the late 40.4.243 inline geometry owner and the obsolete 40.2.59 frame lock.
          - Neutralizes legacy portrait/wrapper geometry declarations that competed through `!important` cascade.
          - Keeps focal variables, RND library, private local image picker/IndexedDB, opacity hierarchy and all functional detail DOM.
          - Market Core 38.15.11, Graph, Parallel Markets, Atlas, Oracle, Math Core, Window Manager, Bridge and data are unchanged.
          EOF
          cd /tmp/pkg
          zip -qr /tmp/AGENT_CRYPTO_BUILD_40_4_244_TECHNICAL_READING_CANONICAL_OWNER_CHANGED_FILES.zip .
          sha256sum /tmp/AGENT_CRYPTO_BUILD_40_4_244_TECHNICAL_READING_CANONICAL_OWNER_CHANGED_FILES.zip

      - uses: actions/upload-artifact@v4
        with:
          name: AGENT_CRYPTO_BUILD_40_4_244_TECHNICAL_READING_CANONICAL_OWNER_CHANGED_FILES
          path: /tmp/AGENT_CRYPTO_BUILD_40_4_244_TECHNICAL_READING_CANONICAL_OWNER_CHANGED_FILES.zip
          if-no-files-found: error
