name: Strategy Lab Binance long-history pilot

on:
  push:
    branches:
      - research/strategy-lab-binance-long-history-pilot-20261116
    paths:
      - 'seven_heaven_strategy_lab/tools/binance_long_history_pilot.py'
      - 'seven_heaven_strategy_lab/tools/binance_long_history_scan.py'
      - 'seven_heaven_strategy_lab/tools/binance_long_history_diagnostics.py'
      - 'seven_heaven_strategy_lab/tools/binance_2024_2025_replay.py'
      - 'seven_heaven_strategy_lab/tools/binance_2024_2025_aether_scientific.py'
      - 'seven_heaven_strategy_lab/tools/binance_2024_2025_aether_research_filters.py'
      - 'seven_heaven_strategy_lab/src/binance_monthly_v46.py'
      - '.github/workflows/strategy-lab-binance-long-history-pilot.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'seven_heaven_strategy_lab/tools/binance_long_history_pilot.py'
      - 'seven_heaven_strategy_lab/src/binance_monthly_v46.py'
      - '.github/workflows/strategy-lab-binance-long-history-pilot.yml'

permissions:
  contents: read

jobs:
  verify-four-official-months:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: seven_heaven_strategy_lab
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /seven_heaven_strategy_lab/
            /.github/workflows/strategy-lab-binance-long-history-pilot.yml
      - name: Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compile validator and pilot
        run: |
          set -euo pipefail
          python -m py_compile src/binance_monthly_v46.py tools/binance_long_history_pilot.py tools/binance_long_history_scan.py tools/binance_long_history_diagnostics.py tools/binance_2024_2025_replay.py tools/binance_2024_2025_aether_scientific.py tools/binance_2024_2025_aether_research_filters.py
      - name: Verify official Binance monthly archives and checksums
        run: |
          set -euo pipefail
          python tools/binance_long_history_pilot.py
      - name: Scan complete target corpus 2019-2021 and 2024-2025
        run: |
          set -euo pipefail
          python tools/binance_long_history_scan.py
      - name: Diagnose anomalous months without repairing source data
        run: |
          set -euo pipefail
          python tools/binance_long_history_diagnostics.py
      - name: Replay current seven-model 4h configuration on clean 2024-2025 corpus
        run: |
          set -euo pipefail
          python tools/binance_2024_2025_replay.py
      - name: Aether Scientific on clean 2024-2025 corpus
        run: |
          set -euo pipefail
          python tools/binance_2024_2025_aether_scientific.py
      - name: Aether Research controlled filters on clean 2024-2025 corpus
        run: |
          set -euo pipefail
          python tools/binance_2024_2025_aether_research_filters.py
      - name: Strict-parse evidence
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("binance_long_history_pilot_evidence.json")
          data = json.loads(p.read_text(encoding="utf-8"))
          assert data["status"] == "PASS"
          assert data["months_tested"] == 4
          assert data["safety"]["orders_real"] == 0
          assert [x["timestamp_input_unit"] for x in data["reports"]] == [
              "milliseconds", "milliseconds", "milliseconds", "microseconds"
          ]
          assert all(x["missing_bars"] == 0 for x in data["reports"])
          full = json.loads(Path("binance_long_history_scan_evidence.json").read_text(encoding="utf-8"))
          assert full["status"] in ("PASS", "COMPLETE_WITH_SOURCE_GAPS")
          assert full["months_attempted"] == 60
          assert full["months_verified"] + full["months_failed"] == 60
          assert full["safety"]["orders_real"] == 0
          assert all(x["missing_bars"] == 0 for x in full["reports"])
          assert sum(1 for x in full["reports"] if x["timestamp_input_unit"] == "microseconds") <= 12
          assert all(f["error"] for f in full["failures"])
          diag = json.loads(Path("binance_long_history_diagnostics.json").read_text(encoding="utf-8"))
          assert diag["status"] == "COMPLETE"
          assert diag["months_inspected"] == 60
          assert diag["months_clean"] + diag["months_anomalous"] == 60
          assert diag["months_anomalous"] == full["months_failed"]
          assert diag["policy"] == "REPORT_ONLY_NO_GAP_FILLING"
          replay = json.loads(Path("binance_2024_2025_replay_evidence.json").read_text(encoding="utf-8"))
          assert replay["status"] == "PASS_STRICT_CLEAN_CORPUS_INTERNAL_PAPER_REPLAY"
          assert replay["source"]["rows_total"] == 17544
          assert replay["source"]["strict_continuity"] is True
          assert replay["source"]["gap_filling"] is False
          assert replay["safety"]["orders_real"] == 0
          assert all(len(case["rows"]) == 7 for case in replay["comparisons"].values())
          sci = json.loads(Path("binance_2024_2025_aether_scientific.json").read_text(encoding="utf-8"))
          assert sci["summary"]["holdout_windows"] == 2
          assert sci["total_bars"] == 4386
          assert sci["safety"]["orders_real"] == 0
          filters = json.loads(Path("binance_2024_2025_aether_research_filters.json").read_text(encoding="utf-8"))
          assert filters["summary"]["verification_windows"] == 2
          assert filters["summary"]["variants_compared"] <= 5
          assert filters["total_bars"] == 4386
          assert filters["safety"]["orders_real"] == 0
          print(
              "PASS: scan classified all 60 target months; "
              f"{full['months_verified']} strict-valid, {full['months_failed']} diagnosed; "
              "clean 2024-2025 replay + Scientific + controlled filters completed"
          )
          PY
      - name: Upload research evidence
        uses: actions/upload-artifact@v4
        with:
          name: strategy-lab-binance-long-history-pilot-evidence
          path: |
            seven_heaven_strategy_lab/binance_long_history_pilot_evidence.json
            seven_heaven_strategy_lab/binance_long_history_scan_evidence.json
            seven_heaven_strategy_lab/binance_long_history_diagnostics.json
            seven_heaven_strategy_lab/binance_2024_2025_replay_evidence.json
            seven_heaven_strategy_lab/binance_2024_2025_aether_scientific.json
            seven_heaven_strategy_lab/binance_2024_2025_aether_research_filters.json
          retention-days: 30
          if-no-files-found: error
