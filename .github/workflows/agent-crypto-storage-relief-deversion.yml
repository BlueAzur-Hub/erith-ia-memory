name: Storage Relief functional de-versioning

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/agent-crypto-storage-relief-deversion.yml'

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout canonical main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Map canonical Storage Relief contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess

          root = Path('public/agent_crypto_erith_ia/administrator')
          old = 'AtlasStorageRelief40278'
          new = 'AtlasStorageRelief'

          tracked = subprocess.check_output(['git','ls-files'], text=True).splitlines()
          repo_hits = []
          canonical_hits = []

          for rel in tracked:
              path = Path(rel)
              try:
                  text = path.read_text(encoding='utf-8')
              except Exception:
                  continue
              count = text.count(old)
              if not count:
                  continue
              repo_hits.append((path, count, text))
              is_canonical = (
                  path == root / 'runtime-shell.html'
                  or path == root / 'index.html'
                  or (path.is_relative_to(root / 'js') and path.suffix == '.js')
              )
              if is_canonical:
                  canonical_hits.append((path, count, text))
              print(f'REPO {path}: {count}')

          if not canonical_hits:
              raise SystemExit('No canonical Storage Relief occurrences found')

          producers = []
          for path, count, text in canonical_hits:
              print(f'CANONICAL {path}: {count}')
              for i, line in enumerate(text.splitlines(), 1):
                  if old in line:
                      print(f'  L{i}: {line[:700]}')
              # Any canonical occurrence is migrated atomically. Producer presence is informative,
              # not mandatory: current consumers explicitly fall back to localStorage when absent.
              if f'globalThis.{old}=' in text or f'globalThis.{old} =' in text or f'globalThis["{old}"]=' in text or f"globalThis['{old}']=" in text:
                  producers.append(path)

          print('CANONICAL PRODUCERS:', ', '.join(map(str, producers)) or 'NONE (fallback contract)')

          mixed = []
          for path, _, text in canonical_hits:
              stable_only_count = text.replace(old, '').count(new)
              if stable_only_count:
                  mixed.append((path, stable_only_count))
          if mixed:
              raise SystemExit(f'Stable identifier already mixed into canonical old-token files: {mixed}')

          # Historical snapshots/releases remain historical evidence and are not rewritten.
          historical = [(str(path), count) for path, count, _ in repo_hits if all(path != p for p,_,_ in canonical_hits)]
          if historical:
              print('HISTORICAL/OTHER LEFT UNTOUCHED:', historical)

          manifest = Path('/tmp/storage_relief_canonical_files.txt')
          manifest.write_text('\n'.join(str(path) for path, _, _ in canonical_hits), encoding='utf-8')
          Path('/tmp/storage_relief_expected_count.txt').write_text(str(sum(count for _,count,_ in canonical_hits)), encoding='utf-8')
          print('SAFE_MAP_OK')
          PY

      - name: De-version canonical Storage Relief contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          old = 'AtlasStorageRelief40278'
          new = 'AtlasStorageRelief'
          files = [Path(line) for line in Path('/tmp/storage_relief_canonical_files.txt').read_text(encoding='utf-8').splitlines() if line.strip()]
          expected = int(Path('/tmp/storage_relief_expected_count.txt').read_text())
          changed = 0
          for path in files:
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              changed += count
              path.write_text(text.replace(old, new), encoding='utf-8')
          old_after = sum(path.read_text(encoding='utf-8').count(old) for path in files)
          new_after = sum(path.read_text(encoding='utf-8').count(new) for path in files)
          if changed != expected or old_after != 0 or new_after != expected:
              raise SystemExit(f'Atomic rewrite proof failed: changed={changed}/{expected}, old_after={old_after}, stable_after={new_after}')
          print(f'MIGRATED {changed} canonical occurrence(s) across {len(files)} file(s)')
          PY

      - name: Static proof and protected invariants
        shell: bash
        run: |
          set -euo pipefail
          R='public/agent_crypto_erith_ia/administrator/runtime-shell.html'
          grep -Fq 'span.dataset.chrono=key' "$R"
          grep -Fq 'data-chrono="${key}"' "$R"
          grep -Fq '__AGENT_CRYPTO_ASTROCYCLE__' "$R"
          grep -Fq '__AGENT_CRYPTO_CELESTIAL_SENTINEL__' "$R"
          grep -Fq '__AGENT_CRYPTO_CELESTIAL_CADENCE__' "$R"
          grep -Fq '38.15.11' "$R"
          while IFS= read -r file; do
            ! grep -Fq 'AtlasStorageRelief40278' "$file"
            grep -Fq 'AtlasStorageRelief' "$file"
          done < /tmp/storage_relief_canonical_files.txt
          git diff --check

      - name: Commit surgical cleanup and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'BlueAzur-Hub'
          git config user.email 'Blue.Azur@protonmail.com'
          git rm --ignore-unmatch '.github/workflows/agent-crypto-storage-relief-deversion.yml'
          while IFS= read -r file; do git add "$file"; done < /tmp/storage_relief_canonical_files.txt
          git diff --cached --check
          git commit -m 'refactor(storage): stabilize Storage Relief contract'
          git push origin HEAD:main
