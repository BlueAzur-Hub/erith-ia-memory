name: Storage Relief functional de-versioning

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/agent-crypto-storage-relief-deversion.yml'

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout canonical main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Map active Storage Relief contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('public/agent_crypto_erith_ia/administrator')
          runtime = root / 'runtime-shell.html'
          old = 'AtlasStorageRelief40278'
          new = 'AtlasStorageRelief'
          html = runtime.read_text(encoding='utf-8')

          active = [runtime]
          for rel in re.findall(r'<script[^>]+src=["\']\.\/js\/([^"\']+)["\']', html, flags=re.I):
              p = root / 'js' / rel.split('?', 1)[0]
              if p.exists() and p not in active:
                  active.append(p)

          hits = []
          for path in active:
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count:
                  hits.append((path, count, text))
                  print(f'ACTIVE {path}: {count} occurrence(s)')
                  for i, line in enumerate(text.splitlines(), 1):
                      if old in line:
                          print(f'  L{i}: {line[:500]}')

          if not hits:
              raise SystemExit('No active Storage Relief contract found')

          producer_patterns = (
              rf'globalThis\.{old}\s*=',
              rf'globalThis\[["\']{old}["\']\]\s*=',
          )
          producers = []
          for path, _, text in hits:
              if any(re.search(pattern, text) for pattern in producer_patterns):
                  producers.append(path)

          print('PRODUCERS:', ', '.join(map(str, producers)) or 'NONE')
          if len(producers) != 1:
              raise SystemExit(f'Expected exactly one active producer, found {len(producers)}; refusing mutation')

          if any(new in text for _, _, text in hits):
              raise SystemExit('Stable Storage Relief identifier already present in active hit files; refusing mixed contract')

          manifest = Path('/tmp/storage_relief_active_files.txt')
          manifest.write_text('\n'.join(str(path) for path, _, _ in hits), encoding='utf-8')
          print('SAFE_MAP_OK')
          PY

      - name: De-version active Storage Relief contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          old = 'AtlasStorageRelief40278'
          new = 'AtlasStorageRelief'
          files = [Path(line) for line in Path('/tmp/storage_relief_active_files.txt').read_text(encoding='utf-8').splitlines() if line.strip()]
          before = 0
          for path in files:
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              before += count
              path.write_text(text.replace(old, new), encoding='utf-8')
          after_old = sum(path.read_text(encoding='utf-8').count(old) for path in files)
          after_new = sum(path.read_text(encoding='utf-8').count(new) for path in files)
          if after_old != 0 or after_new != before:
              raise SystemExit(f'Post-rewrite proof failed: old={after_old}, stable={after_new}, expected stable={before}')
          print(f'MIGRATED {before} active occurrence(s) across {len(files)} file(s)')
          PY

      - name: Static proof and protected invariants
        shell: bash
        run: |
          set -euo pipefail
          R='public/agent_crypto_erith_ia/administrator/runtime-shell.html'
          grep -Fq 'span.dataset.chrono=key' "$R"
          grep -Fq 'data-chrono="${key}"' "$R"
          grep -Fq '__AGENT_CRYPTO_ASTROCYCLE__' "$R"
          grep -Fq '__AGENT_CRYPTO_CELESTIAL_SENTINEL__' "$R"
          grep -Fq '__AGENT_CRYPTO_CELESTIAL_CADENCE__' "$R"
          grep -Fq '38.15.11' "$R"
          while IFS= read -r file; do
            ! grep -Fq 'AtlasStorageRelief40278' "$file"
            grep -Fq 'AtlasStorageRelief' "$file"
          done < /tmp/storage_relief_active_files.txt
          git diff --check

      - name: Commit surgical cleanup and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'BlueAzur-Hub'
          git config user.email 'Blue.Azur@protonmail.com'
          git rm --ignore-unmatch '.github/workflows/agent-crypto-storage-relief-deversion.yml'
          while IFS= read -r file; do git add "$file"; done < /tmp/storage_relief_active_files.txt
          git diff --cached --check
          git commit -m 'refactor(storage): stabilize Storage Relief contract'
          git push origin HEAD:main
