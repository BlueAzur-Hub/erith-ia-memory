name: Agent-Crypto Trader Current

on:
  pull_request:
    paths:
      - "public/agent_crypto_erith_ia/trader/**"
      - "public/agent_crypto_erith_ia/administrator/js/quote-currency-architecture-406497.js"
      - "public/agent_crypto_erith_ia/administrator/js/okx-local-backend-transport.js"
      - "public/agent_crypto_erith_ia/administrator/js/new-listings-live-asset-406529.js"
      - "public/agent_crypto_erith_ia/administrator/js/market-microscope-candles.js"
      - "public/agent_crypto_erith_ia/administrator/js/okx-microstructure-406499.js"
      - "public/agent_crypto_erith_ia/tools/trader-historical-panel.test.mjs"
      - "public/agent_crypto_erith_ia/tools/trader-shared-market-selection.test.mjs"
      - ".github/workflows/agent-crypto-trader-current.yml"
  push:
    branches: [main]
    paths:
      - "public/agent_crypto_erith_ia/trader/**"
      - "public/agent_crypto_erith_ia/administrator/js/quote-currency-architecture-406497.js"
      - "public/agent_crypto_erith_ia/administrator/js/okx-local-backend-transport.js"
      - "public/agent_crypto_erith_ia/administrator/js/new-listings-live-asset-406529.js"
      - "public/agent_crypto_erith_ia/administrator/js/market-microscope-candles.js"
      - "public/agent_crypto_erith_ia/administrator/js/okx-microstructure-406499.js"
      - "public/agent_crypto_erith_ia/tools/trader-historical-panel.test.mjs"
      - "public/agent_crypto_erith_ia/tools/trader-shared-market-selection.test.mjs"
      - ".github/workflows/agent-crypto-trader-current.yml"

permissions:
  contents: write

jobs:
  validate-trader:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            public/agent_crypto_erith_ia/trader/line-chart-native.js \
            public/agent_crypto_erith_ia/trader/market-fiche-native.js \
            public/agent_crypto_erith_ia/trader/market-transpose.js \
            public/agent_crypto_erith_ia/trader/math-core-transpose.js \
            public/agent_crypto_erith_ia/trader/new-listings-transpose.js \
            public/agent_crypto_erith_ia/trader/pair-central-truth.js \
            public/agent_crypto_erith_ia/trader/source-dock-native.js \
            public/agent_crypto_erith_ia/trader/technical-reading-data-sync.js \
            public/agent_crypto_erith_ia/trader/technical-reading-transpose.js \
            public/agent_crypto_erith_ia/trader/trader-fidelity.js \
            public/agent_crypto_erith_ia/trader/trader-historical-panel.js \
            public/agent_crypto_erith_ia/trader/trader-historical-universe-reader.js \
            public/agent_crypto_erith_ia/trader/trader-historical-long-reader.js \
            public/agent_crypto_erith_ia/trader/trader-historical-cohort-reader.js \
            public/agent_crypto_erith_ia/trader/trading-desk.js \
            public/agent_crypto_erith_ia/administrator/js/quote-currency-architecture-406497.js \
            public/agent_crypto_erith_ia/administrator/js/okx-local-backend-transport.js \
            public/agent_crypto_erith_ia/administrator/js/new-listings-live-asset-406529.js \
            public/agent_crypto_erith_ia/administrator/js/market-microscope-candles.js \
            public/agent_crypto_erith_ia/administrator/js/okx-microstructure-406499.js
          do
            node --check "$file"
          done

      - name: Trader direct-page contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          trader=Path("public/agent_crypto_erith_ia/trader")
          html=(trader/"trading-desk.html").read_text(encoding="utf-8")
          build=json.loads((trader/"build.json").read_text(encoding="utf-8"))
          current=str(build.get("build","")).strip()

          required_scripts=[
            "line-chart-native.js",
            "market-transpose.js",
            "math-core-transpose.js",
            "technical-reading-transpose.js",
            "pair-central-truth.js",
            "trader-historical-panel.js",
            "trading-desk.js",
          ]
          forbidden=[
            "<iframe",
            "trader-runtime-mirror.js",
            "trader-paper-preparation.js",
            "trader-paper-t0.js",
          ]

          checks={
            "build_format": bool(current) and current.count(".")==2 and all(p.isdigit() for p in current.split(".")),
            "entry_build_matches": current in html,
            "standalone_dom": 'id="market-zone"' in html and 'id="marketWorkspaceGrid"' in html and 'id="math"' in html,
            "btc_case_inline": 'id="traderBtcCaseStudy"' in html,
            "verified_history_slot": 'id="traderHistoryMount"' in html and "trader-historical-panel.js" in html,
            "required_scripts": all(name in html for name in required_scripts),
            "no_mirror_or_iframe": all(token not in html for token in forbidden),
            "strategy_a_not_loaded": "Strategy A" in html and "trader-paper-preparation.js" not in html and "trader-paper-t0.js" not in html,
            "read_only": build.get("execution")=="disabled" and build.get("real_orders") is False,
            "build_direct_truth": build.get("architecture",{}).get("iframe_administrator") is False and build.get("architecture",{}).get("runtime_mirror_loaded") is False,
            "market_core_protected": str(build.get("market_core"))=="38.15.11",
          }
          print(json.dumps(checks,indent=2,ensure_ascii=False))
          if not all(checks.values()):
              raise SystemExit("Trader direct-page contract failed")
          PY

      - name: Trader focused tests
        run: |
          node --test \
            public/agent_crypto_erith_ia/tools/trader-historical-panel.test.mjs \
            public/agent_crypto_erith_ia/tools/historical-universe-reader.test.mjs \
            public/agent_crypto_erith_ia/tools/historical-long-reader.test.mjs \
            public/agent_crypto_erith_ia/tools/trader-shared-market-selection.test.mjs

      - name: Package standalone Trader
        id: package
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json, zipfile, os, shutil

          root=Path("public/agent_crypto_erith_ia")
          trader=root/"trader"
          build=json.loads((trader/"build.json").read_text(encoding="utf-8"))["build"]
          out=Path(f"AGENT_CRYPTO_TRADER_{build}.zip")

          files=[]
          for p in trader.iterdir():
            if p.is_file() and p.suffix in {".html",".js",".css",".json",".md"}:
              files.append(p)

          shared=[
            root/"administrator"/"style.css",
            root/"administrator"/"admin-windows.css",
            root/"administrator"/"admin-visual-assets.css",
            root/"administrator"/"admin-technical-reading-classic-opacity.css",
            root/"administrator"/"market-reading-depth.css",
            root/"administrator"/"help-layer.css",
            root/"administrator"/"js"/"quote-currency-architecture-406497.js",
            root/"administrator"/"js"/"okx-local-backend-transport.js",
            root/"administrator"/"js"/"new-listings-live-asset-406529.js",
            root/"administrator"/"js"/"market-microscope-candles.js",
            root/"administrator"/"js"/"okx-microstructure-406499.js",
          ]
          files.extend(p for p in shared if p.exists())

          with zipfile.ZipFile(out,"w",zipfile.ZIP_DEFLATED) as z:
            for p in sorted(set(files)):
              z.write(p,p.as_posix())

          shutil.copy2(out,Path("/tmp")/out.name)
          with open(os.environ["GITHUB_OUTPUT"],"a",encoding="utf-8") as fh:
            fh.write(f"build={build}\n")
            fh.write(f"zip={out.name}\n")
          print(out,out.stat().st_size)
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: AGENT_CRYPTO_TRADER_${{ steps.package.outputs.build }}
          path: ${{ steps.package.outputs.zip }}

      - name: Persist current Trader package
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          BUILD: ${{ steps.package.outputs.build }}
          ZIP_NAME: ${{ steps.package.outputs.zip }}
        run: |
          set -euo pipefail
          target="coordination/inter_ai_dialogues/agent_crypto"
          current_zip="/tmp/$ZIP_NAME"
          test -f "$current_zip"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            git fetch origin main
            git checkout -B trader-build-publish origin/main
            cp "$current_zip" "$target/$ZIP_NAME"
            cat > "$target/LATEST_TRADER_BUILD.md" <<EOF
          # Latest Trader build

          - Current build: **$BUILD**
          - ZIP: **$ZIP_NAME**
          - Architecture: **standalone Trader page**
          - Source: `public/agent_crypto_erith_ia/trader/build.json`

          [Download current build](./$ZIP_NAME)
          EOF

            git add "$target/$ZIP_NAME" "$target/LATEST_TRADER_BUILD.md"
            if git diff --cached --quiet; then
              exit 0
            fi
            git commit -m "agent-crypto: persist Trader build $BUILD [skip ci]"
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 2
          done
          exit 1
