name: Agent-Crypto Trader Current

on:
  pull_request:
    paths:
      - "public/agent_crypto_erith_ia/trader/**"
      - "public/agent_crypto_erith_ia/administrator/index.html"
      - "public/agent_crypto_erith_ia/administrator/app.js"
      - "public/agent_crypto_erith_ia/administrator/js/new-listings-native-category.js"
      - "public/agent_crypto_erith_ia/administrator/js/graph-native-usd-406520.js"
      - "public/agent_crypto_erith_ia/administrator/js/learning-lab.js"
      - "public/agent_crypto_erith_ia/administrator/css/learning-lab.css"
      - "public/agent_crypto_erith_ia/laboratoire/**"
      - "public/agent_crypto_erith_ia/administrator/js/okx-market-pair-resolver.js"
      - "public/agent_crypto_erith_ia/administrator/js/market-microscope-candles.js"
      - "public/agent_crypto_erith_ia/administrator/js/okx-microstructure-406499.js"
      - "public/agent_crypto_erith_ia/administrator/js/trader-cockpit-fit.js"
      - "public/agent_crypto_erith_ia/administrator/js/aether.js"
      - ".github/workflows/agent-crypto-trader-current.yml"
  push:
    branches: [main]
    paths:
      - "public/agent_crypto_erith_ia/trader/**"
      - "public/agent_crypto_erith_ia/administrator/index.html"
      - "public/agent_crypto_erith_ia/administrator/app.js"
      - "public/agent_crypto_erith_ia/administrator/js/new-listings-native-category.js"
      - "public/agent_crypto_erith_ia/administrator/js/graph-native-usd-406520.js"
      - "public/agent_crypto_erith_ia/administrator/js/learning-lab.js"
      - "public/agent_crypto_erith_ia/administrator/css/learning-lab.css"
      - "public/agent_crypto_erith_ia/laboratoire/**"
      - "public/agent_crypto_erith_ia/administrator/js/okx-market-pair-resolver.js"
      - "public/agent_crypto_erith_ia/administrator/js/market-microscope-candles.js"
      - "public/agent_crypto_erith_ia/administrator/js/okx-microstructure-406499.js"
      - "public/agent_crypto_erith_ia/administrator/js/trader-cockpit-fit.js"
      - "public/agent_crypto_erith_ia/administrator/js/aether.js"
      - ".github/workflows/agent-crypto-trader-current.yml"

permissions:
  contents: read

jobs:
  validate-trader:
    runs-on: ubuntu-latest
    steps:
      # The Trader test suite must not hydrate cold historical data, media or
      # unrelated repository projects just to validate a small code change.
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /tests/
            /tools/
            /public/agent_crypto_erith_ia/trader/
            /public/agent_crypto_erith_ia/administrator/
            /public/agent_crypto_erith_ia/laboratoire/
            !/public/agent_crypto_erith_ia/administrator/assets/visual/
            !/public/agent_crypto_erith_ia/administrator/assets/images/
            !/public/agent_crypto_erith_ia/trader/assets/
            !/**/*.zip
            !/**/*.jsonl
            !/**/*.gz

      - name: JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check public/agent_crypto_erith_ia/trader/trader-runtime-mirror.js
          node --check public/agent_crypto_erith_ia/trader/trader-okx-account.js
          node --check public/agent_crypto_erith_ia/administrator/app.js
          node --check public/agent_crypto_erith_ia/administrator/js/new-listings-native-category.js
          node --check public/agent_crypto_erith_ia/trader/ct-selection-memory.js
          node --check public/agent_crypto_erith_ia/administrator/js/okx-market-pair-resolver.js
          node --check public/agent_crypto_erith_ia/administrator/js/market-microscope-candles.js
          node --check public/agent_crypto_erith_ia/administrator/js/okx-microstructure-406499.js
          node --check public/agent_crypto_erith_ia/administrator/js/graph-native-usd-406520.js
          node - <<'NODE'
          require("./public/agent_crypto_erith_ia/administrator/js/graph-native-usd-406520.js");
          const result=globalThis.AgentCryptoGraphNativeUsd406520?.self_test?.();
          console.log(JSON.stringify(result,null,2));
          if(!result?.pass||result?.checks?.top5_24h_canonical_history_owner!==true||result?.checks?.stale_usd_cache_refused!==true)process.exit(1);
          NODE
          node --check public/agent_crypto_erith_ia/administrator/js/trader-cockpit-fit.js
          node --check public/agent_crypto_erith_ia/administrator/js/aether.js

      - name: Private OKX portfolio and Seven Concrete existing integration
        run: |
          node --check public/agent_crypto_erith_ia/trader/ai-ct-contract.js
          node --check public/agent_crypto_erith_ia/trader/ai-ct-panel.js
          node --test public/agent_crypto_erith_ia/trader/test-ai-ct-contract.cjs
          node --test public/agent_crypto_erith_ia/trader/test-ai-ct-account-routing.cjs
          node --test public/agent_crypto_erith_ia/trader/test-btc-position-reading.cjs
          node --test public/agent_crypto_erith_ia/trader/test-okx-capital-journey.cjs
          node --test public/agent_crypto_erith_ia/trader/test-okx-position-scenarios.cjs
          node --test public/agent_crypto_erith_ia/trader/test-ct-spot-rules.cjs

      - name: Refuse late external order books and candles after selection change
        run: node tests/agent_crypto_external_market_race.cjs

      - name: CT orderbook and native USD Top 5 source safeguards
        run: node tests/agent_crypto_market_integrity.cjs

      - name: External graph and Technical Reading identity
        run: |
          node --check public/agent_crypto_erith_ia/administrator/js/market-fiche-display-406518.js
          node tests/agent_crypto_external_fiche_consistency.cjs

      - name: Workspace chip CT/BTC truth in Interface and Trader
        run: node tests/agent_crypto_workspace_visible_external.cjs
      - name: A/B/C IndexedDB slot persistence and legacy fallback
        run: node tests/agent_crypto_workspace_slot_storage.cjs
      - name: Trader CT single-flight and A/B/C rollback
        run: node tests/agent_crypto_trader_ct_recall.cjs

      - name: Cross-market candle identity and quote truth
        run: node tests/agent_crypto_market_context_identity.cjs

      - name: Trader Vider cancels external CT and RND is shared
        run: node tests/agent_crypto_trader_vide_rnd_shared.cjs

      - name: Trader external Math Core cannot relabel BTC as CT
        run: node tests/agent_crypto_trader_external_math_guard.cjs

      - name: Trader historical selection identity and native quote
        run: node tests/agent_crypto_trader_historical_identity.cjs

      - name: Trader Lab buttons use canonical BTC CT Q owners
        run: node tests/agent_crypto_lab_market_selection.cjs

      - name: CT V7 restored view and no implicit viewport jump
        run: node tests/agent_crypto_ct_v7_authority.cjs

      - name: CT V7 single selection authority contract
        run: |
          python - <<'PY'
          from pathlib import Path
          root=Path("public/agent_crypto_erith_ia")
          app=(root/"administrator/app.js").read_text(encoding="utf-8")
          native=(root/"administrator/js/new-listings-native-category.js").read_text(encoding="utf-8")
          ct=(root/"trader/ct-selection-memory.js").read_text(encoding="utf-8")
          assert "traderExternalSelection: atlasTraderExternalSelectionNormalize" in app
          assert 'agent-crypto:graph-context-ready' in app and 'agent-crypto:workspace-restored' in app
          assert 'atlasTraderExternalSelectionCommit?.(spec)' in native
          assert 'atlasTraderExternalSelectionClear?.()' in native
          assert 'atlasTraderExternalSelectionRead()&&!atlasExternalChartActive()' in app
          assert 'Graph Context V7 / IndexedDB' in ct
          assert 'localStorage.setItem' not in ct and 'localStorage.getItem' not in ct
          assert 'setTimeout(' not in ct and 'MutationObserver' not in ct
          assert 'selectById(ID)' in ct
          print("V7 CT continuity invariants OK")
          PY

      - name: Trader single-runtime contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root=Path("public/agent_crypto_erith_ia")
          trader=root/"trader"
          html=(trader/"trading-desk.html").read_text(encoding="utf-8")
          mirror=(trader/"trader-runtime-mirror.js").read_text(encoding="utf-8")
          build=json.loads((trader/"build.json").read_text(encoding="utf-8"))
          admin=(root/"administrator"/"index.html").read_text(encoding="utf-8")
          admin_build=json.loads((root/"administrator"/"build.json").read_text(encoding="utf-8"))
          aether=(root/"administrator"/"js"/"aether.js").read_text(encoding="utf-8")
          app=(root/"administrator"/"app.js").read_text(encoding="utf-8")
          candles=(root/"administrator"/"js"/"market-microscope-candles.js").read_text(encoding="utf-8")
          graph_usd=(root/"administrator"/"js"/"graph-native-usd-406520.js").read_text(encoding="utf-8")
          current=str(build.get("build","")).strip()

          forbidden=[
            "line-chart-native.js",
            "market-transpose.js",
            "math-core-transpose.js",
            "technical-reading-transpose.js",
            "source-dock-native.js",
            "market-fiche-native.js",
            "pair-central-truth.js",
          ]
          checks={
            "build_format": bool(current) and current.count(".")==2 and all(part.isdigit() for part in current.split(".")),
            "entry_build_matches": current in html,
            "mirror_build_matches": f'const BUILD="{current}"' in mirror,
            "administrator_build_matches": str(admin_build.get("build","")).strip()==current,
            "administrator_index_matches": current in admin,
            "administrator_frame": 'src="../administrator/index.html' in html,
            "trader_surface_query": 'surface=trader' in html,
            "mirror_loaded": 'src="./trader-runtime-mirror.js' in html,
            "legacy_runtime_not_loaded": all(name not in html for name in forbidden),
            "market_zone_filter": "#market-zone" in mirror,
            "presentation_only": "filtered_presentation_only:true" in mirror,
            "no_duplicate_chart": "duplicated_chart_owner:false" in mirror,
            "no_duplicate_market": "duplicated_market_owner:false" in mirror,
            "read_only": build["execution"]=="disabled" and build["real_orders"] is False,
            "native_trader_badge": 'id="traderSurfaceBadge">TRADER · '+current+'</span>' in admin,
            "native_admin_arrow": 'id="traderSurfaceAdminLink"' in admin and '>↗</a>' in admin,
            "native_header_first_paint": 'id="agentCryptoTraderFirstPaint"' in admin,
            "no_late_header_injection": "traderRuntimeBadge" not in mirror and "traderRuntimeAdminLink" not in mirror and "traderBadge.textContent" not in mirror,
            "native_status_lane_present": all(token in admin for token in ['id="livecheck"', 'id="btnLivecheck"', 'id="btnRefresh"', 'id="decisionCard"', 'id="sourceActiveCard"', 'id="sourceTimeCard"']),
            "native_status_lane_not_first_paint_hidden": 'html[data-agent-crypto-surface="trader"] #livecheck{display:none!important}' not in admin,
            "mirror_preserves_native_status_lane": ':not(#accueil):not(#livecheck):not(#market-zone)' in mirror,
            "aether_trader_ribbon_disabled": 'const AETHER_RIBBON_ENABLED=AETHER_SURFACE!=="trader"' in aether,
            "aether_trader_native_phase": 'aetherPhaseApply("native","trader-ribbon-disabled")' in aether,
            "minimum_nav_livecheck_first_paint": '[data-atlas-essential-target]:not([data-atlas-essential-target="livecheck"]):not([data-atlas-essential-target="market-workspace"]):not([data-atlas-essential-target="analyste"])' in admin,
            "minimum_nav_aether_native_owner": admin.count('id="atlasAetherStatusToggle"')==1 and 'id="atlasAetherStatusLabel"' in admin,
            "minimum_nav_advanced_filtered": '#atlasAdminGraphToggle' in admin and '#atlasAdminCenterToggle' in admin and '#atlasAdminCenterDrawer' in admin and '#atlasAetherStatusToggle{display:inline-flex!important}' in admin,
            "minimum_nav_mirror_contract": "minimum_nav:true" in mirror and 'minimum_nav_items:Object.freeze(["Livecheck","Marché","Graphique","Aether"])' in mirror,
            "minimum_nav_no_aether_clone": "createElement" not in "\n".join(line for line in mirror.splitlines() if "Aether" in line or "aether" in line),
            "pair_resolver_loaded": 'js/okx-market-pair-resolver.js?v='+current in admin,
            "pair_resolver_stable_filename": "okx-market-pair-resolver-406" not in admin,
            "pair_resolver_before_consumers": admin.find("js/okx-market-pair-resolver.js") < admin.find("js/market-microscope-candles.js") < admin.find("js/okx-microstructure-406499.js"),
            "canonical_selection_event_owner": 'agent-crypto:selected-market-changed' in app and 'atlasBroadcastSelectedMarketChange' in app,
            "candles_selection_event_listener": 'window.addEventListener("agent-crypto:selected-market-changed",handleCanonicalSelectionChanged' in candles,
            "candles_no_legacy_function_wrapper": "__agentCryptoMicroscopeHook" not in candles and "__agentCryptoMicroscopeOriginal" not in candles,
            "candles_stale_canvas_clear": "stale_asset_canvas_cleared:true" in candles,
            "graph_native_usd_current_cache_token": 'js/graph-native-usd-406520.js?v='+current in admin,
            "graph_top5_24h_canonical_owner": "top5_24h_canonical_history_owner:true" in graph_usd,
            "graph_top5_canonical_delegate": 'usd()&&!canonicalTop5History(p)?cmp(c,p,opt):o.apply(this,arguments)' in graph_usd,
            "graph_stale_usd_cache_refused": "coingecko-usd-stale-cache-refused" in graph_usd,
            "graph_no_app_rewrite": "app_js_changed:false" in graph_usd,
            "fullscreen_restore_no_cockpit_runtime": 'js/trader-cockpit-fit.js' not in admin,
            "fullscreen_restore_no_height_var": '--trader-target-top-analyst-height' not in admin,
            "first_paint_preserves_native_status_lane": ':not(#accueil):not(#livecheck):not(#market-zone)' in admin,
            "target_top_native_dom": 'id="targetTop5Cycle"' in admin and 'id="top5Track"' in admin,
            "admin_graph_present": 'id="analyste"' in admin and 'id="mainChart"' in admin,
            "admin_market_present": 'id="market-workspace"' in admin,
            "top_explorer_absent": 'src="./js/top10-explorer.js"' not in admin,
            "admin_math_present": 'id="math"' in admin,
            "admin_detail_present": 'id="detailPanel"' in admin,
          }
          print(json.dumps(checks,indent=2,ensure_ascii=False))
          if not all(checks.values()):
              raise SystemExit("Trader single-runtime contract failed")
          PY

      - name: No parallel Trader owners in entrypoint
        run: |
          python - <<'PY'
          from pathlib import Path
          html=Path("public/agent_crypto_erith_ia/trader/trading-desk.html").read_text(encoding="utf-8")
          scripts=[line.strip() for line in html.splitlines() if "<script" in line]
          print("\n".join(scripts))
          assert len(scripts)==1, scripts
          assert "trader-runtime-mirror.js" in scripts[0]
          PY


      - name: Verify changed-file CLEAN_UPLOAD rules
        run: python tests/test_trader_clean_upload.py

      - name: Package changed Trader files only
        id: package
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags --filter=blob:none --depth=1 origin "$BASE_SHA" "$HEAD_SHA"
          python tools/trader-clean-upload.py --base "$BASE_SHA" --head "$HEAD_SHA" --output out/AGENT_CRYPTO_TRADER_CLEAN_UPLOAD.zip

      - name: Upload only the small Trader patch and SHA-256
        uses: actions/upload-artifact@v4
        with:
          name: agent-crypto-trader-clean-upload
          path: |
            out/AGENT_CRYPTO_TRADER_CLEAN_UPLOAD.zip
            out/AGENT_CRYPTO_TRADER_CLEAN_UPLOAD.zip.sha256
          if-no-files-found: error
          retention-days: 14
