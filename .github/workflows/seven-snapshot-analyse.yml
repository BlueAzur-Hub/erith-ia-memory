name: Seven Snapshot Analyse
on:
  pull_request:
    paths:
      - 'public/agent_crypto_erith_ia/trader/snapshot-analyse-native.js'
      - 'public/agent_crypto_erith_ia/trader/snapshot-analyse-native.css'
      - 'public/agent_crypto_erith_ia/trader/trader-runtime-mirror.js'
      - 'public/agent_crypto_erith_ia/trader/test-snapshot-analyse-native.cjs'
      - 'public/agent_crypto_erith_ia/laboratoire/snapshot-analyse.js'
      - 'public/agent_crypto_erith_ia/laboratoire/test-snapshot-analyse.cjs'
      - '.github/workflows/seven-snapshot-analyse.yml'
  push:
    branches: [main]
    paths:
      - 'public/agent_crypto_erith_ia/trader/snapshot-analyse-native.js'
      - 'public/agent_crypto_erith_ia/trader/test-snapshot-analyse-native.cjs'
      - 'public/agent_crypto_erith_ia/laboratoire/snapshot-analyse.js'
      - 'public/agent_crypto_erith_ia/laboratoire/test-snapshot-analyse.cjs'
      - '.github/workflows/seven-snapshot-analyse.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify pure calculator and native technical reading
        run: |
          node --test public/agent_crypto_erith_ia/laboratoire/test-snapshot-analyse.cjs
          node --test public/agent_crypto_erith_ia/trader/test-snapshot-analyse-native.cjs
