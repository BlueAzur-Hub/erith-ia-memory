name: Agent-Crypto Metals Canonical Cascade 40.4.164-166

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/agent-crypto-40-4-164-166-metals-cascade.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: agent-crypto-metals-cascade-40-4-164-166
  cancel-in-progress: false

jobs:
  cascade:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify existing Metals owners before canonization
        shell: bash
        run: |
          set -euo pipefail
          APP=public/agent_crypto_erith_ia/administrator/app.js
          grep -F 'function atlasParallelMarketInit' "$APP" >/dev/null
          grep -F 'function atlasMetalsQuoteFoundationLoad' "$APP" >/dev/null
          grep -F 'function atlasMetalsQuoteFoundationHorizonReading' "$APP" >/dev/null
          grep -F 'function atlasMetalsQuoteFoundationRenderAnalysisHorizons' "$APP" >/dev/null
          grep -F 'function atlasParallelMarketRenderMetals' "$APP" >/dev/null
          test -f public/agent_crypto_erith_ia/data/metals/latest.json
          test -f public/agent_crypto_erith_ia/data/metals/status.json
          test -f public/agent_crypto_erith_ia/data/metals/history/index.json
          grep -F 'const ATLAS_BUILD = "40.4.163";' "$APP" >/dev/null

      - name: Prepare bounded cascade helper
        shell: bash
        run: |
          cat > /tmp/metals_cascade.py <<'PY'
          from pathlib import Path
          from datetime import datetime, timezone
          import hashlib, json, re, sys

          build = sys.argv[1]
          parent = sys.argv[2]
          release = sys.argv[3]
          status = sys.argv[4]
          root = Path('public/agent_crypto_erith_ia/administrator')
          app = root/'app.js'
          jsapp = root/'js/app.js'
          index = root/'index.html'
          version_path = root/'version.json'
          admin_path = root/'administrator-version.json'
          module = root/'js/markets-domain-contract.js'
          architecture = root/'architecture/markets-domain-canonical.json'

          def replace_once(text, pattern, replacement, label):
              out, n = re.subn(pattern, replacement, text, count=1)
              if n != 1:
                  raise SystemExit(f'{label}: expected one replacement, got {n}')
              return out

          # Root shared runtime: identity only. Existing Metals engines stay untouched.
          t = app.read_text(encoding='utf-8')
          t = replace_once(t, r'const ATLAS_BUILD = "40\.4\.\d+";', f'const ATLAS_BUILD = "{build}";', 'ATLAS_BUILD')
          app.write_text(t, encoding='utf-8')

          # Administrator runtime identity only.
          t = jsapp.read_text(encoding='utf-8')
          t = replace_once(t, r'const ADMIN_BUILD = "40\.4\.\d+";', f'const ADMIN_BUILD = "{build}";', 'ADMIN_BUILD')
          t = replace_once(t, r'const ADMIN_RELEASE = "[^"]*";', f'const ADMIN_RELEASE = "{release}";', 'ADMIN_RELEASE')
          jsapp.write_text(t, encoding='utf-8')

          foundation = '''
            const METALS_FOUNDATION = Object.freeze({
              build: "40.4.164",
              state: "CANONICAL_EXISTING_RUNTIME",
              runtime_owner: "app.js::atlasParallelMarketInit + atlasMetalsQuoteFoundation*",
              archive_root: "../data/metals/",
              symbols: Object.freeze(["XAU","XAG","XPT","XPD","HG"]),
              asset_ids: Object.freeze(["gold","silver","platinum","palladium","copper"]),
              current_quote_source: "Gold API public archive",
              history_source: "Yahoo Finance Futures public archive",
              eur_conversion: "ECB indicative only",
              structural_sources: Object.freeze(["USGS","IEA","RMIS","World Bank"]),
              current_quote_and_futures_history_separate: true,
              structural_data_never_replaces_market_quote: true,
              crypto_cache_reuse_forbidden: true,
              fabricated_values_forbidden: true,
              observation_only: true,
              forecast_added: false,
              order_added: false,
              execution_signal_added: false,
              stop_if_date_currency_unit_or_state_incoherent: true,
              market_core_changed: false,
              new_network_owner: false,
              new_timer: false,
              new_observer: false,
              new_storage_owner: false
            });
            globalThis.ErithMetalsFoundation404164 = METALS_FOUNDATION;
          '''

          multi = '''
            const METALS_MULTI_HORIZON = Object.freeze({
              build: "40.4.165",
              state: "CANONICAL_EXISTING_ENGINE",
              owner: "app.js::atlasMetalsQuoteFoundationHorizonReading + atlasMetalsQuoteFoundationRenderAnalysisHorizons",
              horizons: Object.freeze([
                Object.freeze({id:"7d",days:7,series:"Yahoo Finance Futures daily"}),
                Object.freeze({id:"30d",days:30,series:"Yahoo Finance Futures daily"}),
                Object.freeze({id:"90d",days:90,series:"Yahoo Finance Futures daily"}),
                Object.freeze({id:"1y",days:365,series:"Yahoo Finance Futures daily"})
              ]),
              intraday_24h_owner: "Yahoo Finance Futures intraday when available; never synthesized from daily data",
              current_quote_excluded_from_historical_return_path: true,
              sample_count_must_be_visible: true,
              source_period_and_units_preserved: true,
              no_new_calculation_engine: true,
              no_new_fetch: true,
              no_new_timer: true,
              market_core_changed: false,
              audit() {
                const names = ["atlasMetalsQuoteFoundationHorizonReading","atlasMetalsQuoteFoundationRenderAnalysisHorizons","atlasMetalsQuoteFoundationPeriodRows"];
                return Object.freeze({
                  build: "40.4.165",
                  owners: Object.freeze(Object.fromEntries(names.map(name => [name, typeof globalThis[name] === "function"]))),
                  dom_horizons: Object.freeze([...document.querySelectorAll("[data-metals-analysis-horizon]")].map(node => Number(node.dataset.metalsAnalysisHorizon)).filter(Number.isFinite))
                });
              }
            });
            globalThis.ErithMetalsMultiHorizon404165 = METALS_MULTI_HORIZON;
          '''

          router = '''
            const PARALLEL_MARKETS_ROUTER = Object.freeze({
              build: "40.4.166",
              state: "CANONICAL_FACADE_OVER_EXISTING_PARALLEL_MARKET_RUNTIME",
              runtime_owner: "app.js::atlasParallelMarketInit",
              active_domains: Object.freeze({
                crypto: Object.freeze({id:"crypto",state:"ACTIVE",engine:"Market Core 38.15.11",data_scope:"crypto only"}),
                metals: Object.freeze({id:"metals",state:"ACTIVE",engine:"existing Parallel Markets / Metals runtime",data_scope:"metals only"})
              }),
              future_domains: Object.freeze({
                indices: Object.freeze({id:"indices",state:"PLANNED_INERT"}),
                energy: Object.freeze({id:"energy",state:"PLANNED_INERT"}),
                commodities: Object.freeze({id:"commodities",state:"PLANNED_INERT"})
              }),
              separation: Object.freeze({
                crypto_state_is_authority_for_crypto: true,
                metals_state_is_authority_for_metals: true,
                cross_domain_cache_reuse_forbidden: true,
                source_truth_kept_per_domain: true,
                no_cross_domain_average: true,
                no_automatic_financial_action: true
              }),
              readiness() {
                return Object.freeze({
                  crypto: true,
                  metals: typeof globalThis.atlasParallelMarketInit === "function" && typeof globalThis.atlasParallelMarketRenderMetals === "function",
                  indices: false,
                  energy: false,
                  commodities: false
                });
              },
              initializeExistingRouter() {
                if (typeof globalThis.atlasParallelMarketInit !== "function") return Object.freeze({ok:false,reason:"canonical-router-owner-unavailable"});
                globalThis.atlasParallelMarketInit();
                return Object.freeze({ok:true,owner:"app.js::atlasParallelMarketInit",second_engine_created:false});
              },
              second_engine_created: false,
              new_network_owner: false,
              new_timer: false,
              new_observer: false,
              new_storage_owner: false
            });
            globalThis.ErithParallelMarketsRouter404166 = PARALLEL_MARKETS_ROUTER;
          '''

          parts = ['(() => {','  "use strict";',f'  const BUILD = "{build}";']
          parts.append(foundation)
          if build in ('40.4.165','40.4.166'):
              parts.append(multi)
          if build == '40.4.166':
              parts.append(router)
          parts.append('  document.documentElement.dataset.marketsDomainContractBuild = BUILD;')
          parts.append('})();')
          module.write_text('\n'.join(parts)+'\n', encoding='utf-8')

          # HTML publication identity and one canonical script include.
          html = index.read_text(encoding='utf-8')
          current = re.search(r'<meta name="administrator-build" content="(40\.4\.\d+)"', html)
          if not current:
              raise SystemExit('index administrator-build identity missing')
          old_build = current.group(1)
          html = html.replace(f'content="{old_build}" />\n  <meta name="administrator-release"', f'content="{build}" />\n  <meta name="administrator-release"', 1)
          html = html.replace(f'<meta name="atlas-build" content="{old_build}" />', f'<meta name="atlas-build" content="{build}" />', 1)
          html = re.sub(r'<meta name="administrator-release" content="[^"]*" />', f'<meta name="administrator-release" content="{release}" />', html, count=1)
          html = re.sub(r'<meta name="atlas-asset-token" content="market-core-v2\.0-alpha-build-40\.4\.\d+" />', f'<meta name="atlas-asset-token" content="market-core-v2.0-alpha-build-{build}" />', html, count=1)
          html = re.sub(r'<title>Agent-Crypto @erith\.IA — Build 40\.4\.\d+ · Administrator</title>', f'<title>Agent-Crypto @erith.IA — Build {build} · Administrator</title>', html, count=1)
          html = re.sub(r'admin-ribbons\.css\?v=administrator-build-40\.4\.\d+', f'admin-ribbons.css?v=administrator-build-{build}', html, count=1)
          html = re.sub(r'app\.js\?v=administrator-build-40\.4\.\d+', f'app.js?v=administrator-build-{build}', html, count=1)
          html = re.sub(r'aether\.js\?v=administrator-build-40\.4\.\d+', f'aether.js?v=administrator-build-{build}', html, count=1)
          html = re.sub(r'view-lifecycle\.js\?v=administrator-build-40\.4\.\d+', f'view-lifecycle.js?v=administrator-build-{build}', html, count=1)
          html = re.sub(r'js/app\.js\?v=administrator-build-40\.4\.\d+', f'js/app.js?v=administrator-build-{build}', html, count=1)
          html = re.sub(r'system-demand-residency\.js\?v=administrator-build-40\.4\.\d+', f'system-demand-residency.js?v=administrator-build-{build}', html, count=1)
          html = re.sub(r'atlas-family-demand-residency\.js\?v=administrator-build-40\.4\.\d+', f'atlas-family-demand-residency.js?v=administrator-build-{build}', html, count=1)
          html = re.sub(r'Agent-Crypto @erith\.IA · Market Core · Build 40\.4\.\d+ · Version : [^<]*', f'Agent-Crypto @erith.IA · Market Core · Build {build} · Version : {release}', html, count=1)
          include_re = r'\s*<script src="\./js/markets-domain-contract\.js\?v=administrator-build-40\.4\.\d+"></script>'
          html = re.sub(include_re, '', html)
          anchor = f'<script src="./js/app.js?v=administrator-build-{build}"></script>'
          if anchor not in html:
              raise SystemExit('index js/app anchor not found')
          html = html.replace(anchor, anchor + f'\n  <script src="./js/markets-domain-contract.js?v=administrator-build-{build}"></script>', 1)
          index.write_text(html, encoding='utf-8')

          contract = {
              '40.4.164': {
                  'name':'metals_foundation_canonical_404164',
                  'owner':'app.js existing Parallel Markets + Metals Quote Foundation',
                  'symbols':['XAU','XAG','XPT','XPD','HG'],
                  'current_quote':'Gold API public archive',
                  'history':'Yahoo Finance Futures public archive',
                  'eur':'ECB indicative only',
                  'structural':['USGS','IEA','RMIS','World Bank'],
                  'crypto_cache_reuse_forbidden':True,
                  'no_new_engine':True,
              },
              '40.4.165': {
                  'name':'metals_multi_horizon_canonical_404165',
                  'owner':'app.js::atlasMetalsQuoteFoundationHorizonReading + RenderAnalysisHorizons',
                  'horizons':['7d','30d','90d','1y'],
                  'history_series':'homogeneous Yahoo Finance Futures daily',
                  'current_quote_excluded_from_returns':True,
                  'no_new_engine':True,
              },
              '40.4.166': {
                  'name':'parallel_markets_router_canonical_404166',
                  'owner':'app.js::atlasParallelMarketInit',
                  'active_domains':['crypto','metals'],
                  'future_domains_inert':['indices','energy','commodities'],
                  'cross_domain_cache_reuse_forbidden':True,
                  'second_engine_created':False,
              }
          }[build]

          architecture_payload = {
              'schema':'agent_crypto_parallel_markets_canonical_v1',
              'build':build,
              'parent_build':parent,
              'release':release,
              'protected_market_core':'38.15.11',
              'classic_web_modified':False,
              'canonical_runtime_owner':'administrator/app.js',
              'canonical_presentation_owner':'existing Administrator Parallel Markets surfaces',
              'contracts':{
                  'metals_foundation': {
                      'canonical_from':'40.4.164',
                      'symbols':['XAU','XAG','XPT','XPD','HG'],
                      'quote_source':'Gold API',
                      'history_source':'Yahoo Finance Futures',
                      'eur_conversion':'ECB indicative',
                      'structural_sources':['USGS','IEA','RMIS','World Bank'],
                      'separate_from_crypto':True,
                  },
              },
              'no_new_network_owner':True,
              'no_new_timer':True,
              'no_new_observer':True,
              'no_new_storage_owner':True,
          }
          if build in ('40.4.165','40.4.166'):
              architecture_payload['contracts']['multi_horizon'] = {
                  'canonical_from':'40.4.165','horizons':['7d','30d','90d','1y'],
                  'owner':'atlasMetalsQuoteFoundationHorizonReading','series':'Yahoo Finance Futures daily',
                  'spot_futures_mix_forbidden':True,
              }
          if build == '40.4.166':
              architecture_payload['contracts']['parallel_router'] = {
                  'canonical_from':'40.4.166','owner':'atlasParallelMarketInit',
                  'active_domains':['crypto','metals'],
                  'future_domains_inert':['indices','energy','commodities'],
                  'second_engine_created':False,
              }
          architecture.write_text(json.dumps(architecture_payload, ensure_ascii=False, indent=2)+'\n', encoding='utf-8')

          now = datetime.now(timezone.utc).isoformat(timespec='seconds').replace('+00:00','Z')
          def update_manifest(path):
              data = json.loads(path.read_text(encoding='utf-8'))
              current = str(data.get('build'))
              if current != parent:
                  raise SystemExit(f'{path.name}: expected parent {parent}, got {current}')
              data['parent_build'] = parent
              data['build'] = build
              data['release'] = release
              data['status'] = status
              data['prepared_at'] = now
              data['published_at'] = now
              if isinstance(data.get('global_versioning'), str): data['global_versioning'] = build
              if isinstance(data.get('asset_token'), str): data['asset_token'] = re.sub(r'build-40\.4\.\d+', f'build-{build}', data['asset_token'])
              pub = data.get('publication_identity')
              if isinstance(pub, dict):
                  pub['build'] = build
                  if isinstance(pub.get('asset_token'), str): pub['asset_token'] = re.sub(r'build-40\.4\.\d+', f'build-{build}', pub['asset_token'])
                  pub['status'] = status
              contracts = data.setdefault('contracts', {})
              contracts[contract['name']] = contract
              lineage = str(data.get('lineage') or '')
              tail = f' → {build} {release}'
              if build not in lineage: data['lineage'] = lineage + tail
              path.write_text(json.dumps(data, ensure_ascii=False, indent=2)+'\n', encoding='utf-8')

          update_manifest(admin_path)
          update_manifest(version_path)

          def sha(p): return hashlib.sha256(p.read_bytes()).hexdigest()
          tracked = {
              'app.js':sha(app),'js/app.js':sha(jsapp),'index.html':sha(index),
              'js/markets-domain-contract.js':sha(module),
              'architecture/markets-domain-canonical.json':sha(architecture),
          }
          # administrator-version first so version can reference its final digest.
          admin = json.loads(admin_path.read_text(encoding='utf-8'))
          def sync_files(node):
              if isinstance(node, dict):
                  for k,v in node.items():
                      if k == 'files' and isinstance(v, dict):
                          for rel,digest in tracked.items():
                              if rel in v or k == 'files': v[rel] = digest
                      else: sync_files(v)
              elif isinstance(node, list):
                  for x in node: sync_files(x)
          sync_files(admin)
          admin_path.write_text(json.dumps(admin, ensure_ascii=False, indent=2)+'\n', encoding='utf-8')
          admin_sha = sha(admin_path)
          version = json.loads(version_path.read_text(encoding='utf-8'))
          sync_files(version)
          def sync_admin_ref(node):
              if isinstance(node, dict):
                  for k,v in node.items():
                      if k == 'administrator-version.json' and isinstance(v,str): node[k]=admin_sha
                      else: sync_admin_ref(v)
              elif isinstance(node,list):
                  for x in node: sync_admin_ref(x)
          sync_admin_ref(version)
          version_path.write_text(json.dumps(version, ensure_ascii=False, indent=2)+'\n', encoding='utf-8')
          print({'build':build,'parent':parent,'release':release,'contract':contract['name']})
          PY

      - name: Build 40.4.164 - Metals Foundation Canonical
        shell: bash
        run: |
          set -euo pipefail
          python /tmp/metals_cascade.py 40.4.164 40.4.163 'METALS FOUNDATION CANONICAL · SOURCE TRUTH & OWNERSHIP LOCK' metals_foundation_canonical_source_truth_ownership
          node --check public/agent_crypto_erith_ia/administrator/js/markets-domain-contract.js
          node --check public/agent_crypto_erith_ia/administrator/js/app.js
          python -m json.tool public/agent_crypto_erith_ia/administrator/version.json >/dev/null
          python -m json.tool public/agent_crypto_erith_ia/administrator/administrator-version.json >/dev/null
          python -m json.tool public/agent_crypto_erith_ia/administrator/architecture/markets-domain-canonical.json >/dev/null
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/agent_crypto_erith_ia/administrator
          git commit -m 'release Agent-Crypto 40.4.164 Metals Foundation Canonical'

      - name: Build 40.4.165 - Multi-Horizon Metals
        shell: bash
        run: |
          set -euo pipefail
          python /tmp/metals_cascade.py 40.4.165 40.4.164 'MULTI-HORIZON METALS · HOMOGENEOUS FUTURES TRUTH LOCK' metals_multi_horizon_homogeneous_futures_truth
          node --check public/agent_crypto_erith_ia/administrator/js/markets-domain-contract.js
          grep -F 'function atlasMetalsQuoteFoundationHorizonReading' public/agent_crypto_erith_ia/administrator/app.js >/dev/null
          grep -F 'function atlasMetalsQuoteFoundationRenderAnalysisHorizons' public/agent_crypto_erith_ia/administrator/app.js >/dev/null
          grep -F 'data-metals-analysis-horizon' public/agent_crypto_erith_ia/administrator/app.js >/dev/null
          git add public/agent_crypto_erith_ia/administrator
          git commit -m 'release Agent-Crypto 40.4.165 Multi-Horizon Metals'

      - name: Build 40.4.166 - Parallel Markets Router
        shell: bash
        run: |
          set -euo pipefail
          python /tmp/metals_cascade.py 40.4.166 40.4.165 'PARALLEL MARKETS ROUTER · CRYPTO + METALS DOMAIN SEPARATION LOCK' parallel_markets_router_crypto_metals_separation
          node --check public/agent_crypto_erith_ia/administrator/js/markets-domain-contract.js
          grep -F 'function atlasParallelMarketInit' public/agent_crypto_erith_ia/administrator/app.js >/dev/null
          grep -F 'function atlasParallelMarketRenderMetals' public/agent_crypto_erith_ia/administrator/app.js >/dev/null
          grep -F 'const ATLAS_BUILD = "40.4.166";' public/agent_crypto_erith_ia/administrator/app.js >/dev/null
          grep -F 'const ADMIN_BUILD = "40.4.166";' public/agent_crypto_erith_ia/administrator/js/app.js >/dev/null
          grep -F '<meta name="administrator-build" content="40.4.166"' public/agent_crypto_erith_ia/administrator/index.html >/dev/null
          python -m json.tool public/agent_crypto_erith_ia/administrator/version.json >/dev/null
          python -m json.tool public/agent_crypto_erith_ia/administrator/administrator-version.json >/dev/null
          git rm .github/workflows/agent-crypto-40-4-164-166-metals-cascade.yml
          git add public/agent_crypto_erith_ia/administrator
          git commit -m 'release Agent-Crypto 40.4.166 Parallel Markets Router'

      - name: Push cumulative cascade
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git pull --rebase origin main
            sleep $((attempt * 2))
          done
          exit 1
