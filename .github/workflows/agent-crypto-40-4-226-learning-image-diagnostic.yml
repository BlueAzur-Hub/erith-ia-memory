name: Agent-Crypto 40.4.226 Learning Image Diagnostic

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify current release and inspect Module 02 owners
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('public/agent_crypto_erith_ia/administrator/version.json').read_text(encoding='utf-8'))
          print('BUILD',m.get('build'),'PARENT',m.get('parent_build'),'MC',m.get('engine',{}).get('reference_build'),m.get('engine',{}).get('status'))
          PY
          echo '--- administrator assets/learning ---'
          find public/agent_crypto_erith_ia/administrator/assets/learning -maxdepth 1 -type f -printf '%f\n' 2>/dev/null | sort || true
          echo '--- web assets/learning ---'
          find public/agent_crypto_erith_ia/web/assets/learning -maxdepth 1 -type f -printf '%f\n' 2>/dev/null | sort || true
          echo '--- Module 02 references in Administrator runtime ---'
          grep -n -E -C 6 'module_02_spot_visual_recap|spot_visual_recap|SpotVisual|spotVisual|visual recap|VisualRecap|Module 02|MODULE 02|module 02' public/agent_crypto_erith_ia/administrator/app.js | head -n 360 || true
          echo '--- Module 02 references in Learning CSS ---'
          grep -n -E -C 4 'spot|visual-recap|foundation-visual' public/agent_crypto_erith_ia/administrator/admin-learning-journey.css | head -n 240 || true
