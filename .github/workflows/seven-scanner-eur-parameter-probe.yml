name: Seven CoinGecko EUR parameter diagnostic (isolated)
on:
  pull_request:
    paths:
      - ".github/workflows/seven-scanner-eur-parameter-probe.yml"
permissions:
  contents: read
jobs:
  probe:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Examine upstream native EUR request without precision override
        run: |
          node <<'NODE'
          (async()=>{
          const {validatePoints}=require('./public/agent_crypto_erith_ia/tools/scanner_verified_history.cjs');
          const fs=require('node:fs');
          const time=Date.now(),url='https://api.coingecko.com/api/v3/coins/figure-heloc/market_chart?vs_currency=eur&days=2';
          const row={id:'figure-heloc',url,quote:'EUR',durationMs:null,httpStatus:null,status:'unavailable'};
          const start=Date.now();
          try {
            const r=await fetch(url,{signal:AbortSignal.timeout(35000),headers:{Accept:'application/json','User-Agent':'agent-crypto-seven-history-diagnostic/1'}});
            row.httpStatus=r.status;
            if(r.ok){
              const body=await r.text();
              row.responseBytes=body.length;
              const json=JSON.parse(body);
              const points=Array.isArray(json?.prices)?json.prices:[];
              const from=time-24*60*60*1000, tolerance=12*60*1000;
              const today=points.filter(p=>Array.isArray(p)&&Number(p[0])>=from-tolerance&&Number(p[0])<=time+tolerance);
              const first=Number(today[0]?.[0]),last=Number(today.at(-1)?.[0]);
              const maxGap=today.slice(1).reduce((m,p,i)=>Math.max(m,Number(p[0])-Number(today[i]?.[0])),0);
              const ok=today.length>=20&&Number.isFinite(first)&&Number.isFinite(last)
                &&first<=from+tolerance&&last>=time-tolerance&&maxGap<=90*60*1000;
              row.pointCount=points.length;
              row.coverage={ok,fullPoints:points.length,last24hPoints:today.length,
                first,last,spanHours:(last-first)/3600000,maxGapMinutes:maxGap/60000,anchor:time};
              row.status=ok?'ready':'invalid';
            }else row.error='HTTP '+r.status;
          }catch(e){row.error=String(e?.name||'Error')+': '+String(e?.message||e).slice(0,250);}
          row.durationMs=Date.now()-start;
          console.log('FIGR EUR DIAGNOSTIC '+JSON.stringify(row));
          fs.mkdirSync('evidence',{recursive:true});
          fs.writeFileSync('evidence/figr-eur-parameter-probe.json',JSON.stringify(row,null,2)+'\n');
          })().catch(e=>{console.error(e);process.exitCode=1});
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fig-heloc-eur-parameter-evidence
          path: evidence/figr-eur-parameter-probe.json
          if-no-files-found: warn
          retention-days: 7
