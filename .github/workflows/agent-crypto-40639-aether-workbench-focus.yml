name: Agent-Crypto 40.6.39 Aether Workbench Focus

on:
  push:
    paths:
      - '.github/workflows/agent-crypto-40639-aether-workbench-focus.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout canonical main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Build guarded 40.6.39
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile .github/scripts/agent_crypto_40639_aether_workbench_focus.py
          python3 .github/scripts/agent_crypto_40639_aether_workbench_focus.py

      - name: Final anti-destruction gates
        shell: bash
        run: |
          set -euo pipefail
          ROOT=public/agent_crypto_erith_ia/administrator
          ZIP=coordination/inter_ai_dialogues/agent_crypto/AGENT_CRYPTO_BUILD_40_6_39_AETHER_WORKBENCH_FOCUS_READABILITY_Z_ORDER_CLEAN_UPLOAD_7_FILES.zip
          SHA="$ZIP.sha256"
          node --check "$ROOT/js/aether.js"
          node --check "$ROOT/js/aether-workbench-406039.js"
          python3 -m json.tool "$ROOT/build.json" >/dev/null
          python3 -m json.tool "$ROOT/administrator-version.json" >/dev/null
          python3 -m json.tool "$ROOT/version.json" >/dev/null
          grep -q '<meta name="administrator-build" content="40.6.39"' "$ROOT/index.html"
          grep -q 'js/aether.js?v=administrator-build-40.6.39' "$ROOT/index.html"
          grep -q '40.6.39 — AETHER WORKBENCH FOCUS' "$ROOT/js/aether.js"
          grep -q 'aether_attention_floating_workbench_build:"40.6.39"' "$ROOT/js/aether.js"
          grep -q 'aether-workbench-406039.js?v=administrator-build-40.6.39' "$ROOT/js/aether.js"
          ! grep -q '<script[^>]*aether-workbench-406039.js' "$ROOT/index.html"
          ! grep -q 'fetch(' "$ROOT/js/aether-workbench-406039.js"
          ! grep -q 'setInterval(' "$ROOT/js/aether-workbench-406039.js"
          ! grep -q 'MutationObserver' "$ROOT/js/aether-workbench-406039.js"
          ! grep -q 'ResizeObserver' "$ROOT/js/aether-workbench-406039.js"
          ! grep -q 'localStorage' "$ROOT/js/aether-workbench-406039.js"
          ! grep -q 'sessionStorage' "$ROOT/js/aether-workbench-406039.js"
          grep -q '40.6.36 — AETHER TYPOGRAPHY CALIBRATION' "$ROOT/admin-ribbons.css"
          git diff --exit-code -- "$ROOT/admin-ribbons.css"
          grep -q '"engine": "38.15.11"' "$ROOT/build.json"
          grep -q '"build": "40.6.39"' "$ROOT/build.json"
          printf '5c4d61e9410d4a701372e2d30640d6523938dfe603f65902d493b354c5f2e7b2  %s\n' "$ROOT/assets/aether/aether-observatory-background-406032.webp" | sha256sum -c -
          test -f "$ZIP"
          test -f "$SHA"
          (cd "$(dirname "$ZIP")" && sha256sum -c "$(basename "$SHA")")
          git diff --check
          python3 - <<'PY'
          from zipfile import ZipFile
          p='coordination/inter_ai_dialogues/agent_crypto/AGENT_CRYPTO_BUILD_40_6_39_AETHER_WORKBENCH_FOCUS_READABILITY_Z_ORDER_CLEAN_UPLOAD_7_FILES.zip'
          with ZipFile(p) as z:
              files=[n for n in z.namelist() if not n.endswith('/')]
              assert len(files)==7, files
              assert z.testzip() is None
              assert 'administrator/js/aether-workbench-406039.js' in files
          print('40.6.39 ZIP 7 files PASS')
          PY

      - name: Commit and publish 40.6.39
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Seven Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/agent_crypto_erith_ia/administrator/index.html \
                  public/agent_crypto_erith_ia/administrator/build.json \
                  public/agent_crypto_erith_ia/administrator/administrator-version.json \
                  public/agent_crypto_erith_ia/administrator/version.json \
                  public/agent_crypto_erith_ia/administrator/js/aether.js \
                  public/agent_crypto_erith_ia/administrator/js/aether-workbench-406039.js \
                  public/agent_crypto_erith_ia/administrator/RELEASE_40_6_39.md \
                  coordination/inter_ai_dialogues/agent_crypto/AGENT_CRYPTO_BUILD_40_6_39_AETHER_WORKBENCH_FOCUS_READABILITY_Z_ORDER_CLEAN_UPLOAD_7_FILES.zip \
                  coordination/inter_ai_dialogues/agent_crypto/AGENT_CRYPTO_BUILD_40_6_39_AETHER_WORKBENCH_FOCUS_READABILITY_Z_ORDER_CLEAN_UPLOAD_7_FILES.zip.sha256
          git commit -m "fix(agent-crypto): focus Aether workbench 40.6.39"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Upload clean ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: AGENT_CRYPTO_BUILD_40_6_39_AETHER_WORKBENCH_FOCUS_READABILITY_Z_ORDER_CLEAN_UPLOAD_7_FILES
          path: coordination/inter_ai_dialogues/agent_crypto/AGENT_CRYPTO_BUILD_40_6_39_AETHER_WORKBENCH_FOCUS_READABILITY_Z_ORDER_CLEAN_UPLOAD_7_FILES.zip
          if-no-files-found: error
          compression-level: 0
