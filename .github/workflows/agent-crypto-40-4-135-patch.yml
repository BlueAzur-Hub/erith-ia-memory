name: Agent-Crypto 40.4.135 guarded recovery

on:
  push:
    branches: [main]
    paths:
      - coordination/inter_ai_dialogues/agent_crypto/patches/40.4.135.request.json

permissions:
  contents: write

concurrency:
  group: agent-crypto-40-4-135-guarded-recovery
  cancel-in-progress: false

jobs:
  deploy:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout canonical main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply bounded 40.4.135 recovery
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from datetime import datetime, timezone
          import hashlib, json, re, zipfile

          R=Path('public/agent_crypto_erith_ia/administrator')
          DATA=Path('public/agent_crypto_erith_ia/data/crypto')
          Q=Path('coordination/inter_ai_dialogues/agent_crypto/patches/40.4.135.request.json')
          B='40.4.135'; P='40.4.134'
          REL='ADMIN CANONICAL CLICK RECOVERY · MARKET SNAPSHOT WAKE SEAL'
          STATUS='candidate_admin_click_market_wake_operator_validation_required'

          def sha(p): return hashlib.sha256(p.read_bytes()).hexdigest()
          def rep(p,a,b,label):
              t=p.read_text(encoding='utf-8'); n=t.count(a)
              if n!=1: raise SystemExit(f'STOP {label}: {n}')
              p.write_text(t.replace(a,b,1),encoding='utf-8')
          def sub(p,a,b,label,flags=0):
              t=p.read_text(encoding='utf-8'); o,n=re.subn(a,b,t,count=1,flags=flags)
              if n!=1: raise SystemExit(f'STOP {label}: {n}')
              p.write_text(o,encoding='utf-8')

          q=json.loads(Q.read_text(encoding='utf-8'))
          v=json.loads((R/'version.json').read_text(encoding='utf-8'))
          if q.get('build')!=B or q.get('parent_build')!=P or v.get('build')!=P:
              raise SystemExit('STOP parent/request mismatch')
          if str((v.get('engine') or {}).get('reference_build'))!='38.15.11':
              raise SystemExit('STOP protected Market Core identity mismatch')

          index=R/'index.html'; root_app=R/'app.js'; admin_app=R/'js/app.js'; aether=R/'js/aether.js'; lifecycle=R/'js/views/view-lifecycle.js'
          ix=index.read_text(encoding='utf-8'); rt=root_app.read_text(encoding='utf-8'); lc=lifecycle.read_text(encoding='utf-8')
          if rt.count('const ATLAS_BUILD = "40.4.134";')!=1: raise SystemExit('STOP root build guard')
          if ix.count('data-atlas-admin-active-role-lock-404134="true"')!=1: raise SystemExit('STOP .134 active-role guard missing/duplicated')
          old_branch='''function atlasAdminAccountToggleAction40449() {\n  if (atlasAccessIsAuthorized() && atlasV2Mode() === "advanced") {\n    atlasAccessLock();\n  } else if (atlasAccessIsAuthorized()) {'''
          if rt.count(old_branch)!=1: raise SystemExit('STOP canonical Administration branch guard')
          visibility_owner='''function atlasPulseVisible() {\n  return document.visibilityState !== "hidden";\n}'''
          if rt.count(visibility_owner)!=1: raise SystemExit('STOP canonical market visibility owner drift')
          if 'focus_required:false' not in lc or 'document.hidden!==true' not in lc: raise SystemExit('STOP resident market wake visibility contract drift')

          latest=json.loads((DATA/'latest.json').read_text(encoding='utf-8'))
          if latest.get('schema')!='agent_crypto_public_market_snapshot_v1': raise SystemExit('STOP Top-250 public snapshot schema')
          if int(latest.get('requested_assets') or 0)!=250 or int(latest.get('assets_count') or 0)<240: raise SystemExit('STOP Top-250 public snapshot incomplete')
          generated=str(latest.get('generated_at') or '')
          try:
              dt=datetime.fromisoformat(generated.replace('Z','+00:00'))
              age=(datetime.now(timezone.utc)-dt).total_seconds()
          except Exception: raise SystemExit('STOP Top-250 generated_at invalid')
          if age<0 or age>8*3600: raise SystemExit(f'STOP Top-250 public snapshot stale: {age:.0f}s')

          sub(index,
              r'\n  <script data-atlas-admin-active-role-lock-404134="true">.*?</script>\n',
              '\n',
              '.134 active-role capture guard retirement',
              flags=re.S)

          new_branch='''function atlasAdminAccountToggleAction40449() {\n  if (atlasAccessIsAuthorized() && atlasV2Mode() === "advanced") {\n    atlasV2SyncShareableUrl("advanced");\n    atlasV2WriteSetting(ATLAS_V2_MODE_KEY, "advanced");\n    atlasV2ApplyMode("advanced", { persist: false, syncUrl: true });\n    return;\n  } else if (atlasAccessIsAuthorized()) {'''
          rep(root_app,old_branch,new_branch,'canonical Administration idempotent owner')

          rep(root_app,'const ATLAS_BUILD = "40.4.134";','const ATLAS_BUILD = "40.4.135";','root build')
          rep(admin_app,'  const ADMIN_BUILD = "40.4.134";','  const ADMIN_BUILD = "40.4.135";','admin build')
          rep(aether,'  Build: 40.4.134','  Build: 40.4.135','Aether build')
          sub(aether,r'  Revision: 40\.4\.134[^\n]*',
              '  Revision: 40.4.135 recovery seal. Aether Attention, French news, Maintenon five-day weather, Atlas AUTO and the 40.4.134 detail opener are preserved unchanged.',
              'Aether revision')
          rep(aether,'    build:"40.4.134",','    build:"40.4.135",','Aether API build')

          t=index.read_text(encoding='utf-8')
          for pattern,repl,label in [
              (r'(<meta name="atlas-build" content=")[^"]+("\s*/>)',rf'\g<1>{B}\2','meta atlas'),
              (r'(<meta name="administrator-build" content=")[^"]+("\s*/>)',rf'\g<1>{B}\2','meta admin'),
              (r'(<meta name="administrator-release" content=")[^"]+("\s*/>)',rf'\g<1>{REL}\2','meta release'),
              (r'(<meta name="atlas-asset-token" content="market-core-v2\.0-alpha-build-)[^"]+("\s*/>)',rf'\g<1>{B}\2','meta token'),
              (r'(<title>Agent-Crypto @erith\.IA — Build )[^<]+( · Administrator</title>)',rf'\g<1>{B}\2','title build')
          ]:
              t,n=re.subn(pattern,repl,t,count=1)
              if n!=1: raise SystemExit(f'STOP {label}: {n}')
          t=t.replace('market-core-v2.0-alpha-build-40.4.134',f'market-core-v2.0-alpha-build-{B}')
          t=t.replace('administrator-build-40.4.134',f'administrator-build-{B}')
          for pattern,repl,label in [
              (r'(data-administrator-build=")[^"]+(")',rf'\g<1>{B}\2','data admin build'),
              (r'(aria-label="Version Agent-Crypto installée : Build )[^"]+(, mode Administrator")',rf'\g<1>{B}\2','aria build'),
              (r'(<span id="atlasVersionControlText">Build )[^<]+(</span>)',rf'\g<1>{B}\2','badge build'),
              (r'(<span id="atlasV2ReleaseBadge">Agent-Crypto @erith\.IA · Build )[^<]+( · Administrator</span>)',rf'\g<1>{B}\2','release badge'),
              (r'(<span id="footerRelease">Agent-Crypto @erith\.IA · Build )[^<]+( · Administrator</span>)',rf'\g<1>{B}\2','footer build')
          ]:
              t,n=re.subn(pattern,repl,t,count=1)
              if n!=1: raise SystemExit(f'STOP {label}: {n}')
          index.write_text(t,encoding='utf-8')

          note='40.4.135 — Administration canonical-click recovery + market snapshot wake seal: the 40.4.134 capture-phase active-role guard is retired; repeated Administration clicks are idempotent in the canonical app.js owner and an authorized Classic/visual mismatch is forced back to Advanced without logout. The canonical market pulse remains visibility-only and consumes the fresh public Top-250 archive; no Market Core, Graphique, Oracle, Bridge, CURRENT, weather or News owner is replaced.'
          feat={'build':B,'administrator_capture_guard_404134_retired':True,'administrator_canonical_click_owner_restored':True,'administrator_authorized_visual_mismatch_forces_advanced':True,'administrator_active_reclick_logout':False,'market_public_top250_freshness_verified':True,'market_pulse_visibility_only_preserved':True,'aether_attention_preserved':True,'aether_french_news_preserved':True,'aether_maintenon_5_day_weather_preserved':True,'aether_detail_opener_404134_preserved':True,'new_market_timer':False,'new_market_fetch_owner':False,'new_observer':False,'market_core_changed':False,'graph_changed':False,'oracle_engine_changed':False,'bridge_engine_changed':False,'atlas_current_engine_changed':False}

          def manifest(path,admin_sha=None):
              d=json.loads(path.read_text(encoding='utf-8'))
              d['build']=B; d['release']=REL; d['status']=STATUS
              d['prepared_at']=datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z')
              d['published_at']=None; d['parent_build']=P; d['asset_token']=f'market-core-v2.0-alpha-build-{B}'
              if 'global_versioning' in d: d['global_versioning']=B
              if 'source' in d and isinstance(d['source'],str) and d['source']==P: d['source']=B
              lineage=str(d.get('lineage') or '')
              entry=f'{B} Administration canonical click recovery + public Top-250 wake seal'
              if entry not in lineage: d['lineage']=(lineage+' → '+entry).strip(' →')
              d.setdefault('features',{})['admin_market_wake_404135']=feat.copy()
              integ=d.setdefault('integrity',{}); integ['admin_market_wake_404135']=feat.copy()
              pub=integ.setdefault('publication_identity',{})
              pub.update({'build':B,'asset_token':f'market-core-v2.0-alpha-build-{B}','status':STATUS,'app_sha256':sha(root_app)})
              if admin_sha: pub['administrator_version_sha256']=admin_sha
              notes=d.setdefault('release_notes',[])
              if isinstance(notes,list):
                  if not notes or notes[0]!=note: notes.insert(0,note)
              else: d['release_notes']=[note,str(notes)]
              for rel in list((d.get('files') or {})):
                  target=R/rel
                  if not target.is_file(): raise SystemExit(f'STOP manifest file missing {rel}')
                  d['files'][rel]=sha(target)
              path.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          admin_manifest=R/'administrator-version.json'; version_manifest=R/'version.json'
          manifest(admin_manifest)
          manifest(version_manifest,sha(admin_manifest))

          rt=root_app.read_text(encoding='utf-8'); ix=index.read_text(encoding='utf-8'); at=aether.read_text(encoding='utf-8')
          if 'data-atlas-admin-active-role-lock-404134' in ix: raise SystemExit('STOP .134 active-role guard survived')
          if old_branch in rt or new_branch not in rt: raise SystemExit('STOP canonical Administration recovery missing')
          if visibility_owner not in rt: raise SystemExit('STOP market visibility-only owner changed')
          if 'aetherDetailBound404134' not in at or 'aetherPanelSet4084(true)' not in at: raise SystemExit('STOP Aether .134 detail opener lost')
          if 'function aetherWeatherForecast40133(payload)' not in at: raise SystemExit('STOP Maintenon weather owner lost')
          if json.loads(version_manifest.read_text(encoding='utf-8')).get('build')!=B: raise SystemExit('STOP version build')

          files=list((json.loads(version_manifest.read_text(encoding='utf-8')).get('files') or {}).keys())
          for required in ('version.json','administrator-version.json'):
              if required not in files: files.append(required)
          missing=[rel for rel in files if not (R/rel).is_file()]
          if missing: raise SystemExit('STOP archive files missing: '+', '.join(missing))
          outdir=Path('coordination/inter_ai_dialogues/agent_crypto'); outdir.mkdir(parents=True,exist_ok=True)
          archive_name='AGENT_CRYPTO_BUILD_'+B.replace('.','_')+'_AUTO_CANONICAL.zip'
          out=outdir/archive_name
          with zipfile.ZipFile(out,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=9) as zf:
              for rel in files: zf.write(R/rel,arcname=(Path('public/agent_crypto_erith_ia/administrator')/rel).as_posix())
          digest=sha(out); Path(str(out)+'.sha256').write_text(f'{digest}  {out.name}\n',encoding='utf-8')
          print('BUILD',B); print('TOP250',latest.get('snapshot_id')); print('ARCHIVE',out); print('SHA256',digest)
          PY

          node --check public/agent_crypto_erith_ia/administrator/js/aether.js
          node --check public/agent_crypto_erith_ia/administrator/js/app.js
          node --check public/agent_crypto_erith_ia/administrator/app.js

      - name: Commit validated 40.4.135 atomically
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Aether Release"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/agent-crypto-40-4-135-patch.yml coordination/inter_ai_dialogues/agent_crypto/patches/40.4.135.request.json
          git add public/agent_crypto_erith_ia/administrator \
                  coordination/inter_ai_dialogues/agent_crypto/AGENT_CRYPTO_BUILD_40_4_135_AUTO_CANONICAL.zip \
                  coordination/inter_ai_dialogues/agent_crypto/AGENT_CRYPTO_BUILD_40_4_135_AUTO_CANONICAL.zip.sha256
          git diff --cached --check
          git commit -m "fix Agent-Crypto 40.4.135 Administration click and market wake seal"
          git pull --rebase origin main
          git push origin HEAD:main
