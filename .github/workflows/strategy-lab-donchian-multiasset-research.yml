name: Strategy Lab Donchian Multi-Asset Research

on:
  push:
    branches:
      - research/strategy-lab-donchian-multiasset-2026-11-16
    paths:
      - 'seven_heaven_strategy_lab/tools/binance_symbol_month.py'
      - 'seven_heaven_strategy_lab/tools/experimental_donchian.py'
      - 'seven_heaven_strategy_lab/tests/test_binance_symbol_month.py'
      - '.github/workflows/strategy-lab-donchian-multiasset-research.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: seven_heaven_strategy_lab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Run focused research tests
        run: |
          python -m unittest             tests.test_binance_symbol_month             tests.test_experimental_donchian

  fixed-basket:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    defaults:
      run:
        working-directory: seven_heaven_strategy_lab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Download fixed BNB XRP SOL monthly source set
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/donchian-fixed-basket"
          mkdir -p "$root"
          total_bytes=0
          for symbol in BNBUSDT XRPUSDT SOLUSDT; do
            mkdir -p "$root/$symbol"
            base="https://data.binance.vision/data/spot/monthly/klines/$symbol/1h"
            for year in 2024 2025; do
              for mm in $(seq -w 1 12); do
                file="$symbol-1h-$year-$mm.zip"
                curl --silent --show-error --fail --location --retry 2 --connect-timeout 10 --max-time 45                   "$base/$file" -o "$root/$symbol/$file"
                curl --silent --show-error --fail --location --retry 2 --connect-timeout 10 --max-time 20                   "$base/$file.CHECKSUM" -o "$root/$symbol/$file.CHECKSUM"
                bytes=$(stat -c%s "$root/$symbol/$file")
                if [ "$bytes" -le 0 ] || [ "$bytes" -gt 8000000 ]; then
                  echo "Unexpected archive size for $file: $bytes" >&2
                  exit 1
                fi
                total_bytes=$((total_bytes + bytes))
              done
            done
          done
          if [ "$total_bytes" -gt 50000000 ]; then
            echo "Fixed basket exceeded 50 MB: $total_bytes" >&2
            exit 1
          fi
          echo "Bounded fixed basket downloaded: $total_bytes bytes"

      - name: Certify all 72 months and run unchanged Donchian 55-20 4h
        run: |
          set -euo pipefail
          BASKET_ROOT="$RUNNER_TEMP/donchian-fixed-basket" python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          from tools.binance_symbol_month import validate_symbol_month
          from tools.experimental_donchian import simulate_donchian
          from src.observatory import aggregate_bars

          root = Path(os.environ["BASKET_ROOT"])
          symbols = ("BNBUSDT", "XRPUSDT", "SOLUSDT")
          results = {}

          for symbol in symbols:
              yearly = {2024: [], 2025: []}
              normalized_hashes = []
              months = []
              for year in (2024, 2025):
                  previous_last = None
                  for month in range(1, 13):
                      name = f"{symbol}-1h-{year}-{month:02d}.zip"
                      report = validate_symbol_month(
                          (root / symbol / name).read_bytes(),
                          (root / symbol / f"{name}.CHECKSUM").read_text(encoding="ascii"),
                          symbol=symbol,
                          year=year,
                          month=month,
                      )
                      bars = report["bars"]
                      if previous_last is not None:
                          assert bars[0][0] == previous_last + 3600
                      previous_last = bars[-1][0]
                      yearly[year].extend(bars)
                      normalized_hashes.append(report["normalized_csv_sha256"])
                      months.append({
                          "month": f"{year}-{month:02d}",
                          "rows": report["rows"],
                          "archive_sha256": report["archive_sha256"],
                          "normalized_csv_sha256": report["normalized_csv_sha256"],
                          "timestamp_input_unit": report["timestamp_input_unit"],
                      })

              assert len(months) == 24
              assert len(yearly[2024]) == 8784
              assert len(yearly[2025]) == 8760
              manifest_sha = hashlib.sha256(
                  "\n".join(normalized_hashes).encode("ascii")
              ).hexdigest()

              annual = {}
              for year in (2024, 2025):
                  hourly = yearly[year]
                  bars4h = aggregate_bars(hourly, "4h", source_timeframe="1h")
                  base = simulate_donchian(bars4h, fee=0.001, slippage=0.0005)
                  ideal = simulate_donchian(bars4h, fee=0.0, slippage=0.0)
                  stress = simulate_donchian(bars4h, fee=0.002, slippage=0.001)
                  market_return = 100 * (hourly[-1][4] / hourly[0][1] - 1)
                  annual[str(year)] = {
                      "hourly_candles": len(hourly),
                      "candles_4h": len(bars4h),
                      "underlying_return_pct": round(market_return, 5),
                      "base": base["results"],
                      "zero_friction": ideal["results"],
                      "double_cost": stress["results"],
                      "safety": base["safety"],
                  }
                  assert base["safety"]["orders_real"] == 0
                  assert base["safety"]["runtime_integration"] is False

              results[symbol] = {
                  "months_certified": 24,
                  "months_rejected": 0,
                  "normalized_manifest_sha256": manifest_sha,
                  "annual": annual,
              }

          print("DONCHIAN_FIXED_BASKET_BNB_XRP_SOL")
          print(json.dumps(results, indent=2, ensure_ascii=False, sort_keys=True))
          PY

      - name: Prove basket study stayed ephemeral
        run: |
          set -euo pipefail
          test ! -e workspace
          echo "PASS fixed basket used runner-temp only; workspace untouched"
