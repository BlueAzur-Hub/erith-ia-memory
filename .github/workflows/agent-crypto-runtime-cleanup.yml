name: Agent-Crypto Runtime Cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/agent-crypto-runtime-cleanup.yml'
      - '.github/scripts/agent_crypto_runtime_decontaminate.py'

permissions:
  contents: write

concurrency:
  group: agent-crypto-runtime-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Synchronize
        run: git pull --ff-only origin main

      - name: Decontaminate active runtime shell
        run: python .github/scripts/agent_crypto_runtime_decontaminate.py

      - name: Canonical JavaScript syntax
        run: |
          node --check public/agent_crypto_erith_ia/administrator/js/boot.js
          node --check public/agent_crypto_erith_ia/administrator/js/version-truth.js
          node --check public/agent_crypto_erith_ia/administrator/js/runtime-modules.js
          node --check public/agent_crypto_erith_ia/administrator/js/generated-report-version-truth.js
          node --check public/agent_crypto_erith_ia/administrator/js/pedagogy-version-truth.js
          node --check public/agent_crypto_erith_ia/administrator/js/tradus-canonical-strategy-reader.js
          node --check public/agent_crypto_erith_ia/administrator/js/strategy-a-auto-start.js
          node --check public/agent_crypto_erith_ia/administrator/js/tradus-autonomous-refresh.js

      - name: Commit runtime cleanup and retire one-shot tooling
        run: |
          set -euo pipefail
          git config user.name 'Seven Heaven Refactor'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/agent_crypto_erith_ia/administrator/runtime-shell.html
          git rm -f .github/workflows/agent-crypto-runtime-cleanup.yml
          git rm -f .github/scripts/agent_crypto_runtime_decontaminate.py
          git commit -m 'refactor(agent-crypto): decontaminate active runtime shell'
          git push origin HEAD:main
