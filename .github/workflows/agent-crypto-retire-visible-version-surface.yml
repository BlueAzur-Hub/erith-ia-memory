name: Agent Crypto retire obsolete visible version surface patch

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/agent-crypto-retire-visible-version-surface.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Synchronize
        run: git pull --ff-only origin main

      - name: Revalidate and retire obsolete visible version surface patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json, re

          ROOT = Path('public/agent_crypto_erith_ia/administrator')
          ENTRY = Path('runtime-shell.html')
          CANDIDATE = Path('js/visible-version-surface-truth-406107.js')
          CANONICAL = Path('js/version-truth.js')
          HTML_JS_RE = re.compile(r'(?:src|href)=["\'](?P<ref>[^"\']+\.js(?:\?[^"\']*)?)["\']', re.I)
          JS_PATH_RE = re.compile(r'(?P<ref>(?:\.\.?/|/)?js/[A-Za-z0-9_./-]+\.js)(?:\?[^"\'`\s)]*)?', re.I)
          REL_JS_RE = re.compile(r'(?P<ref>\.\.?/[A-Za-z0-9_./-]+\.js)(?:\?[^"\'`\s)]*)?', re.I)

          def strip_query(ref):
              return ref.split('?',1)[0].split('#',1)[0]

          def resolve(source_rel, ref):
              clean = strip_query(ref).replace('\\','/')
              candidates = []
              if clean.startswith('/'):
                  candidates.append(Path(clean.lstrip('/')))
              elif clean.startswith('js/'):
                  candidates.append(Path(clean))
              elif clean.startswith('./js/'):
                  candidates.append(Path(clean[2:]))
                  try: candidates.append(((ROOT/source_rel).parent/clean).resolve().relative_to(ROOT.resolve()))
                  except Exception: pass
              elif clean.startswith(('./','../')):
                  try: candidates.append(((ROOT/source_rel).parent/clean).resolve().relative_to(ROOT.resolve()))
                  except Exception: pass
                  if clean.startswith('./'): candidates.append(Path(clean[2:]))
              return {rel for rel in candidates if (ROOT/rel).is_file()}

          def refs(text):
              out=[m.group('ref') for m in HTML_JS_RE.finditer(text)]
              out += [m.group('ref') for m in JS_PATH_RE.finditer(text)]
              out += [m.group('ref') for m in REL_JS_RE.finditer(text)]
              return list(dict.fromkeys(out))

          def graph():
              queue=[ENTRY]
              reachable=set(); edges={}; texts={}
              while queue:
                  rel=queue.pop(0)
                  if rel in reachable: continue
                  full=ROOT/rel
                  if not full.is_file() or full.suffix.lower() not in {'.html','.js'}: continue
                  try: text=full.read_text(encoding='utf-8')
                  except UnicodeDecodeError: continue
                  reachable.add(rel); texts[rel]=text
                  targets=set()
                  for ref in refs(text): targets.update(resolve(rel,ref))
                  edges[rel]=targets
                  for target in sorted(targets,key=str):
                      if target.suffix.lower() in {'.html','.js'} and target not in reachable:
                          queue.append(target)
              return reachable, edges, texts

          build=json.loads((ROOT/'build.json').read_text(encoding='utf-8'))
          if str(build.get('build'))!='40.6.124':
              raise SystemExit(f"Build drifted: {build.get('build')!r}")
          market_core=str(build.get('market_core') or build.get('engine') or '')
          if '38.15.11' not in market_core:
              raise SystemExit(f'Market Core drifted: {market_core!r}')

          candidate_path=ROOT/CANDIDATE
          canonical_path=ROOT/CANONICAL
          if not candidate_path.is_file():
              raise SystemExit('Candidate already absent; refusing ambiguous cleanup')
          if not canonical_path.is_file():
              raise SystemExit('Canonical version-truth.js missing')

          reachable_before, edges_before, texts_before = graph()
          inbound=sorted(str(src) for src,targets in edges_before.items() if CANDIDATE in targets)
          literal_sources=sorted(str(src) for src,text in texts_before.items() if CANDIDATE.name in text)
          if CANDIDATE in reachable_before:
              raise SystemExit('Candidate became runtime reachable')
          if inbound:
              raise SystemExit('Candidate has runtime inbound edges: '+', '.join(inbound))
          if literal_sources:
              raise SystemExit('Candidate has active literal references: '+', '.join(literal_sources))
          if CANONICAL not in reachable_before:
              raise SystemExit('Canonical version-truth.js is not runtime reachable')
          if len(reachable_before) != 101:
              raise SystemExit(f'Unexpected runtime graph before cleanup: {len(reachable_before)}')

          version_truth=canonical_path.read_text(encoding='utf-8')
          contract={
              'owner_version_truth': 'const OWNER = "version-truth"' in version_truth,
              'build_json_authority': 'build_json_authority: true' in version_truth,
              'stable_runtime_filenames': 'versioned_runtime_filenames: false' in version_truth,
              'sync_footer': 'function syncFooter(' in version_truth,
              'sync_mirror': 'function syncMirror(' in version_truth,
              'sync_visible_truth': 'syncVisibleTruth' in version_truth,
          }
          if not all(contract.values()):
              raise SystemExit('Canonical Version Truth contract incomplete: '+json.dumps(contract, ensure_ascii=False))

          old_bytes=candidate_path.stat().st_size
          old_lines=len(candidate_path.read_text(encoding='utf-8').splitlines())
          candidate_path.unlink()

          reachable_after, edges_after, texts_after = graph()
          if len(reachable_after) != len(reachable_before):
              raise SystemExit(f'Runtime graph changed: {len(reachable_before)} -> {len(reachable_after)}')
          if CANONICAL not in reachable_after:
              raise SystemExit('Canonical version-truth.js lost reachability')
          version_truth_after=canonical_path.read_text(encoding='utf-8')
          contract_after={
              'owner_version_truth': 'const OWNER = "version-truth"' in version_truth_after,
              'build_json_authority': 'build_json_authority: true' in version_truth_after,
              'stable_runtime_filenames': 'versioned_runtime_filenames: false' in version_truth_after,
              'sync_footer': 'function syncFooter(' in version_truth_after,
              'sync_mirror': 'function syncMirror(' in version_truth_after,
              'sync_visible_truth': 'syncVisibleTruth' in version_truth_after,
          }
          if not all(contract_after.values()):
              raise SystemExit('Canonical Version Truth contract changed after cleanup')

          print(json.dumps({
              'build':build.get('build'),
              'market_core':market_core,
              'retired':str(CANDIDATE),
              'retired_bytes':old_bytes,
              'retired_lines':old_lines,
              'runtime_nodes_before':len(reachable_before),
              'runtime_nodes_after':len(reachable_after),
              'candidate_inbound_before':inbound,
              'candidate_active_literal_sources_before':literal_sources,
              'canonical_version_truth_contract_before':contract,
              'canonical_version_truth_contract_after':contract_after,
          },indent=2,ensure_ascii=False))
          PY

      - name: JavaScript syntax check
        run: |
          find public/agent_crypto_erith_ia/administrator -type f -name '*.js' -print0 \
            | xargs -0 -n1 node --check

      - name: Runtime shell direct reference sanity
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          root=Path('public/agent_crypto_erith_ia/administrator')
          shell=(root/'runtime-shell.html').read_text(encoding='utf-8')
          missing=[]
          for ref in re.findall(r'(?:src|href)=["\'](\./[^"\']+)["\']',shell):
              clean=ref.split('?',1)[0]
              if not (root/clean[2:]).exists(): missing.append(clean)
          if missing: raise SystemExit('Missing runtime references: '+', '.join(sorted(set(missing))))
          print('Runtime shell references OK')
          PY

      - name: Duplicate shell DOM id guard
        run: |
          python - <<'PY'
          from pathlib import Path
          import collections,re
          shell=Path('public/agent_crypto_erith_ia/administrator/runtime-shell.html').read_text(encoding='utf-8')
          ids=re.findall(r'\bid=["\']([^"\']+)["\']',shell,re.I)
          dup=[x for x,n in collections.Counter(ids).items() if n>1]
          if dup: raise SystemExit('Duplicate shell DOM ids: '+', '.join(sorted(dup)))
          print('Shell DOM ids unique')
          PY

      - name: Build and Market Core lock guard
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          d=json.loads(Path('public/agent_crypto_erith_ia/administrator/build.json').read_text(encoding='utf-8'))
          if str(d.get('build'))!='40.6.124': raise SystemExit(f'Build drifted: {d.get("build")!r}')
          e=str(d.get('market_core') or d.get('engine') or '')
          if '38.15.11' not in e: raise SystemExit(f'Market Core drifted: {e!r}')
          print('Build 40.6.124 unchanged · Market Core 38.15.11 locked')
          PY

      - name: Commit cleanup and retire one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Seven Heaven Refactor'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A public/agent_crypto_erith_ia/administrator
          git rm -f .github/workflows/agent-crypto-retire-visible-version-surface.yml
          git commit -m 'refactor(agent-crypto): retire obsolete visible version surface patch'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo 'Rebase conflict; refusing force-push'
              exit 1
            fi
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*2))
          done
          echo 'Push remained contested after safe retries'
          exit 1
