name: Agent-Crypto 40.6.66 R1 direct repair
'on':
  push:
    branches: [main]
    paths:
      - .github/workflows/agent-crypto-406066-r1-direct.yml
      - .github/scripts/agent_crypto_406066_r1_direct.py
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python .github/scripts/agent_crypto_406066_r1_direct.py
      - run: node --check public/agent_crypto_erith_ia/administrator/app.js
      - run: node --check public/agent_crypto_erith_ia/administrator/js/tradus-shadow-adapter-406066.js
      - run: python .github/scripts/agent_crypto_version_truth_guard_compat.py
      - shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/agent-crypto-406066-r1-direct.yml
          rm -f .github/workflows/agent-crypto-406066-r1-once.yml
          rm -f .github/scripts/agent_crypto_406066_r1_direct.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(agent-crypto): 40.6.66 R1 truth and OFF semantics"
          git pull --rebase origin main
          git push origin HEAD:main
