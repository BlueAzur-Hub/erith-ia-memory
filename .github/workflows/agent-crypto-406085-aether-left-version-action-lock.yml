name: Agent-Crypto 40.6.85 Aether Left Boot + Version Action Lock

on:
  push:
    paths:
      - '.github/workflows/agent-crypto-406085-aether-left-version-action-lock.yml'
      - '.github/scripts/agent_crypto_406085.trigger'

permissions:
  contents: write

env:
  ADMIN: public/agent_crypto_erith_ia/administrator

jobs:
  release:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Synchronize main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          git config user.name "BlueAzur-Hub"
          git config user.email "Blue.Azur@protonmail.com"

      - name: Apply and verify 40.6.85 surgery
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/agent_crypto_406085.py
          git diff --check
          git diff -- "$ADMIN/index.html" "$ADMIN/js/app.js" "$ADMIN/js/version-truth.js" "$ADMIN/build.json" "$ADMIN/RELEASE_40_6_85.md"

      - name: Commit release
        shell: bash
        run: |
          set -euo pipefail
          git add "$ADMIN/index.html" "$ADMIN/js/app.js" "$ADMIN/js/version-truth.js" "$ADMIN/build.json" "$ADMIN/RELEASE_40_6_85.md"
          git commit -m "fix(agent-crypto): 40.6.85 repair Aether boot and version action"

      - name: Retire one-shot release files and publish
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/agent-crypto-406085-aether-left-version-action-lock.yml .github/scripts/agent_crypto_406085.py .github/scripts/agent_crypto_406085.trigger
          git commit -m "chore(agent-crypto): retire 40.6.85 one-shot release tooling"
          git push origin HEAD:main

      - name: Upload 40.6.85 clean package
        uses: actions/upload-artifact@v4
        with:
          name: AGENT_CRYPTO_BUILD_40_6_85_AETHER_LEFT_BOOT_VERSION_ACTION_LOCK_CLEAN_UPLOAD
          path: |
            dist/AGENT_CRYPTO_BUILD_40_6_85_AETHER_LEFT_BOOT_VERSION_ACTION_LOCK_CLEAN_UPLOAD.zip
            dist/AGENT_CRYPTO_BUILD_40_6_85_AETHER_LEFT_BOOT_VERSION_ACTION_LOCK_CLEAN_UPLOAD.zip.sha256
          if-no-files-found: error
          retention-days: 30
