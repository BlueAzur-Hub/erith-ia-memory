name: Agent Crypto Radar20 Verified Taker Flows
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/agent-crypto-radar20-flows.yml'
      - 'public/agent_crypto_erith_ia/tools/build_radar20_flows.py'
      - 'public/agent_crypto_erith_ia/tools/test_build_radar20_flows.py'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish verified Radar20 outputs in public data directory'
        type: boolean
        required: true
        default: false
permissions:
  contents: write
concurrency:
  group: agent-crypto-radar20-flows
  cancel-in-progress: false
jobs:
  extract-60-native-archives:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify parser and fail-closed source catalog selection
        run: |
          set -euo pipefail
          python -m py_compile public/agent_crypto_erith_ia/tools/build_radar20_flows.py
          python -m unittest discover -s public/agent_crypto_erith_ia/tools -p test_build_radar20_flows.py -v
      - name: Read canonical Top250 catalog and 60 immutable release ZIPs
        run: |
          set -euo pipefail
          python public/agent_crypto_erith_ia/tools/build_radar20_flows.py \
            --out "$RUNNER_TEMP/radar20-derived" --workers 4
      - name: Check SHA256 of each derived file and complete 20x3 inventory
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os,pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'radar20-derived'
          index=json.loads((root/'index.json').read_text())
          assert index['schema']=='erith.trader.radar20.flows.index.v1'
          assert index['markets']==20 and len(index['entries'])==60
          assert not index['orders_enabled'] and not index['strategy_certified']
          expected_hours=20*(31+31+30)*24
          assert sum(r['hours'] for r in index['entries'])==expected_hours
          for entry in index['entries']:
              p=root/entry['path']
              raw=p.read_bytes()
              assert hashlib.sha256(raw).hexdigest()==entry['sha256']
              data=json.loads(raw)
              assert data['pair']==entry['pair'] and data['month']==entry['month']
              assert data['row_count']==entry['hours']==len(data['rows'])
              assert data['source']['sha256']==entry['source_zip_sha256']
              assert len(data['experiments'])==24
              assert not data['strategy_certified'] and not data['orders_enabled']
          print('PASS: 60/60 source-verified month JSONs',expected_hours,'hourly rows')
          PY
      - name: Preserve all derived data as a downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: trader-radar20-taker-flows-verified
          path: ${{ runner.temp }}/radar20-derived/
          retention-days: 30
          if-no-files-found: error
      - name: Publish only explicitly approved verified Radar20 data
        if: ${{ github.ref == 'refs/heads/main' && (inputs.publish == true || (github.event_name == 'push' && contains(github.event.head_commit.message, '[radar20-publish]'))) }}
        run: |
          set -euo pipefail
          target=public/agent_crypto_erith_ia/data/trader_flux/radar20
          mkdir -p "$target"
          cp -a "$RUNNER_TEMP/radar20-derived/." "$target/"
          git add -- "$target"
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'NOOP: verified derived JSON unchanged'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Publish verified Radar20 60-month taker flow JSON views'
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Verify no protected Trader or vault source files changed
        if: always()
        run: |
          set -euo pipefail
          git diff --exit-code -- public/agent_crypto_erith_ia/trader/ \
            public/agent_crypto_erith_ia/administrator/app.js \
            public/agent_crypto_erith_ia/data/historical_archive_prototype/ \
            public/agent_crypto_erith_ia/core/