name: Archive Administrator current presentation delivery
on:
  push:
    branches: [main]
    paths:
      - 'public/agent_crypto_erith_ia/administrator/app.js'
      - 'public/agent_crypto_erith_ia/administrator/index.html'
      - 'public/agent_crypto_erith_ia/administrator/build.json'
      - 'public/agent_crypto_erith_ia/tools/test_analysis_legacy_406649.cjs'
      - '.github/workflows/agent-crypto-administrator-package.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: administrator-legacy-649-release
  cancel-in-progress: false
jobs:
  verify-and-package:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Validate JavaScript and legacy Analyse renderer
        run: |
          node --check public/agent_crypto_erith_ia/administrator/app.js
          node public/agent_crypto_erith_ia/tools/test_analysis_legacy_406649.cjs
      - name: Produce release ZIP and SHA-256
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib,json,zipfile,hashlib
          root=pathlib.Path('.')
          base=root/'public/agent_crypto_erith_ia/administrator'
          version=json.loads((base/'build.json').read_text(encoding='utf-8'))['build']
          if version!='40.6.649': raise SystemExit('Wrong active build: '+version)
          shared=root/'coordination/inter_ai_dialogues/agent_crypto'
          name=f'AGENT_CRYPTO_ADMINISTRATOR_{version}_ANALYSE_LEGACY_RESTORE_5_FILES.zip'
          paths=[base/'app.js',base/'index.html',base/'build.json',
            root/'public/agent_crypto_erith_ia/tools/test_analysis_legacy_406649.cjs',
            shared/f'AGENT_CRYPTO_ADMINISTRATOR_{version}_ANALYSE_LEGACY_RESTORE_HANDOFF.md']
          with zipfile.ZipFile(shared/name,'w',zipfile.ZIP_DEFLATED,compresslevel=9) as z:
            for p in paths:z.write(p,arcname=p.name)
          with zipfile.ZipFile(shared/name) as z:
            bad=z.testzip()
            if bad: raise SystemExit('ZIP integrity failure: '+bad)
          digest=hashlib.sha256((shared/name).read_bytes()).hexdigest()
          (shared/(name+'.sha256')).write_text(digest+'  '+name+'\n',encoding='utf-8')
          print(name,digest)
          PY
      - name: Commit release ZIP and checksum
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add coordination/inter_ai_dialogues/agent_crypto/AGENT_CRYPTO_ADMINISTRATOR_40.6.649_ANALYSE_LEGACY_RESTORE_5_FILES.zip*
          git diff --cached --quiet && exit 0
          git commit -m "Archive Administrator 40.6.649 legacy Analyse restoration with SHA256"
          for i in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
