name: Atlas Market Archive Top 50 Stable

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

concurrency:
  group: atlas-market-archive-top50-stable
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Collect CoinGecko Top 50 archive
        env:
          COINGECKO_DEMO_API_KEY: ${{ secrets.COINGECKO_DEMO_API_KEY }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');

          const ARCHIVE_VERSION = 'V1.1-alpha.26.47';
          const ROOT = path.join('public', 'agent_crypto_erith_ia', 'data');
          const HISTORY = path.join(ROOT, 'history');
          fs.mkdirSync(HISTORY, { recursive: true });

          const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
          const headers = process.env.COINGECKO_DEMO_API_KEY
            ? { 'x-cg-demo-api-key': process.env.COINGECKO_DEMO_API_KEY }
            : {};

          async function fetchJson(url, attempts = 3) {
            let last;
            for (let i = 0; i < attempts; i++) {
              try {
                const controller = new AbortController();
                const timer = setTimeout(() => controller.abort(), 20000);
                const response = await fetch(url, { headers, signal: controller.signal });
                clearTimeout(timer);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                return await response.json();
              } catch (error) {
                last = error;
                if (i + 1 < attempts) await sleep(2000 * (i + 1));
              }
            }
            throw last;
          }

          function compact(row, usd = {}) {
            return {
              id: row.id,
              rank: row.market_cap_rank,
              name: row.name,
              symbol: String(row.symbol || '').toUpperCase(),
              image: row.image || '',
              price_eur: row.current_price,
              price_usd: Number.isFinite(Number(usd.usd)) ? Number(usd.usd) : null,
              change_1h_pct: row.price_change_percentage_1h_in_currency ?? null,
              change_24h_pct: row.price_change_percentage_24h_in_currency ?? row.price_change_percentage_24h ?? null,
              change_7d_pct: row.price_change_percentage_7d_in_currency ?? null,
              change_30d_pct: row.price_change_percentage_30d_in_currency ?? null,
              market_cap_eur: row.market_cap,
              market_cap_usd: null,
              volume_24h_eur: row.total_volume,
              volume_24h_usd: null,
              high_24h_eur: row.high_24h,
              low_24h_eur: row.low_24h,
              last_updated: row.last_updated || (usd.last_updated_at ? new Date(Number(usd.last_updated_at) * 1000).toISOString() : null)
            };
          }

          (async () => {
            const common = 'order=market_cap_desc&per_page=50&page=1&sparkline=false&precision=full';
            const eurUrl = `https://api.coingecko.com/api/v3/coins/markets?vs_currency=eur&${common}&price_change_percentage=1h,24h,7d,30d`;
            const eurRows = await fetchJson(eurUrl);
            if (!Array.isArray(eurRows) || eurRows.length < 40) throw new Error(`EUR incomplet ${eurRows?.length || 0}/50`);

            const ids = eurRows.map(row => row.id).filter(Boolean);
            let usdPayload = {};
            try {
              await sleep(1500);
              usdPayload = await fetchJson(`https://api.coingecko.com/api/v3/simple/price?ids=${encodeURIComponent(ids.join(','))}&vs_currencies=usd&include_last_updated_at=true&precision=full`);
            } catch (error) {
              console.warn('USD enrichment unavailable:', error.message);
            }

            const assets = eurRows.map(row => compact(row, usdPayload?.[row.id] || {})).filter(row => row.id && Number.isFinite(Number(row.price_eur)) && Number(row.price_eur) > 0);
            if (assets.length < 40) throw new Error(`Top 50 EUR incomplet ${assets.length}/50`);
            const usdCount = assets.filter(row => Number.isFinite(Number(row.price_usd)) && Number(row.price_usd) > 0).length;

            const now = new Date().toISOString();
            const totalCap = assets.reduce((sum, row) => sum + (Number(row.market_cap_eur) || 0), 0);
            const totalVolume = assets.reduce((sum, row) => sum + (Number(row.volume_24h_eur) || 0), 0);
            const btc = assets.find(row => row.id === 'bitcoin');
            const record = {
              schema: 'atlas_market_snapshot_top50_v1',
              version: ARCHIVE_VERSION,
              snapshot_id: `github-action-main_${now.replace(/[:.]/g, '-')}`,
              collector_id: 'github-action-main',
              collector_type: 'github_archive',
              saved_at: now,
              source: 'CoinGecko',
              source_mode: 'archive',
              live_ok: true,
              usd_enriched_count: usdCount,
              assets_count: assets.length,
              quote_currencies: usdCount ? ['EUR', 'USD'] : ['EUR'],
              global: {
                market_cap_eur: totalCap,
                volume_24h_eur: totalVolume,
                btc_dominance_pct: totalCap > 0 && btc ? Number(btc.market_cap_eur) / totalCap * 100 : null,
                scope: 'top50'
              },
              assets
            };

            const latest = {
              schema: 'atlas_github_market_memory_v2',
              version: record.version,
              generated_at: now,
              source: 'CoinGecko',
              live_ok: true,
              archive_only: true,
              assets_count: assets.length,
              latest: record,
              records: [record]
            };
            fs.writeFileSync(path.join(ROOT, 'latest.json'), JSON.stringify(latest, null, 2) + '\n');
            const day = now.slice(0, 10);
            fs.appendFileSync(path.join(HISTORY, `${day}.jsonl`), JSON.stringify(record) + '\n');
            fs.writeFileSync(path.join(ROOT, 'status.json'), JSON.stringify({
              schema: 'atlas_github_market_status_v2',
              version: record.version,
              updated_at: now,
              status: 'ok',
              source: 'CoinGecko',
              archive_only: true,
              assets_count: assets.length,
              quote_currencies: usdCount ? ['EUR', 'USD'] : ['EUR'],
              message: 'Archive Top 50 EUR créée ; USD ajouté si disponible. Aucun graphe collecté.'
            }, null, 2) + '\n');
          })().catch(error => {
            const now = new Date().toISOString();
            fs.writeFileSync(path.join(ROOT, 'status.json'), JSON.stringify({
              schema: 'atlas_github_market_status_v2',
              version: ARCHIVE_VERSION,
              updated_at: now,
              status: 'error',
              source: 'CoinGecko',
              archive_only: true,
              message: String(error?.message || error)
            }, null, 2) + '\n');
            console.error(error);
            process.exitCode = 1;
          });
          NODE

      - name: Commit archive
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/agent_crypto_erith_ia/data/latest.json \
                  public/agent_crypto_erith_ia/data/status.json \
                  public/agent_crypto_erith_ia/data/history || true
          if git diff --cached --quiet; then
            echo "No archive change"
            exit 0
          fi
          git commit -m "archive atlas top 50 market snapshot"
          git pull --rebase origin main
          git push origin HEAD:main
