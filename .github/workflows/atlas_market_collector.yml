name: Atlas Market Archive CoinMarketCap Top 50

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

concurrency:
  group: atlas-market-archive-cmc-top50
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Collect CoinMarketCap Top 50 archive
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const ROOT = path.join('public', 'agent_crypto_erith_ia', 'data');
          const HISTORY = path.join(ROOT, 'history');
          fs.mkdirSync(HISTORY, { recursive: true });
          const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));

          async function fetchJson(url, attempts = 3) {
            let lastError;
            for (let attempt = 0; attempt < attempts; attempt += 1) {
              try {
                const controller = new AbortController();
                const timer = setTimeout(() => controller.abort(), 20000);
                const response = await fetch(url, { signal: controller.signal, headers: { accept: 'application/json' } });
                clearTimeout(timer);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const payload = await response.json();
                if (Number(payload?.status?.error_code || 0) !== 0) throw new Error(payload?.status?.error_message || 'CMC API error');
                return payload;
              } catch (error) {
                lastError = error;
                if (attempt + 1 < attempts) await sleep(1500 * (2 ** attempt));
              }
            }
            throw lastError;
          }

          function quote(row, symbol) {
            const wanted = String(symbol).toUpperCase();
            const q = row?.quote;
            if (Array.isArray(q)) return q.find(x => String(x?.symbol || x?.name || '').toUpperCase() === wanted) || null;
            if (q && typeof q === 'object') return q[wanted] || Object.values(q).find(x => String(x?.symbol || x?.name || '').toUpperCase() === wanted) || null;
            return null;
          }

          (async () => {
            const url = 'https://pro-api.coinmarketcap.com/public-api/v3/cryptocurrency/listings/latest?start=1&limit=50&convert=EUR,USD';
            const payload = await fetchJson(url);
            const rows = Array.isArray(payload?.data) ? payload.data : [];
            if (rows.length < 40) throw new Error(`Top 50 incomplet ${rows.length}/50`);
            const now = payload?.status?.timestamp || new Date().toISOString();
            const assets = rows.map(row => {
              const eur = quote(row, 'EUR');
              const usd = quote(row, 'USD');
              if (!eur || !Number.isFinite(Number(eur.price))) return null;
              return {
                cmc_id: Number(row.id),
                slug: row.slug,
                rank: Number(row.cmc_rank),
                name: row.name,
                symbol: String(row.symbol || '').toUpperCase(),
                price_eur: Number(eur.price),
                price_usd: Number.isFinite(Number(usd?.price)) ? Number(usd.price) : null,
                change_1h_pct: Number.isFinite(Number(eur.percent_change_1h)) ? Number(eur.percent_change_1h) : null,
                change_24h_pct: Number.isFinite(Number(eur.percent_change_24h)) ? Number(eur.percent_change_24h) : null,
                change_7d_pct: Number.isFinite(Number(eur.percent_change_7d)) ? Number(eur.percent_change_7d) : null,
                change_30d_pct: Number.isFinite(Number(eur.percent_change_30d)) ? Number(eur.percent_change_30d) : null,
                market_cap_eur: Number.isFinite(Number(eur.market_cap)) ? Number(eur.market_cap) : null,
                market_cap_usd: Number.isFinite(Number(usd?.market_cap)) ? Number(usd.market_cap) : null,
                market_cap_dominance: Number.isFinite(Number(eur.market_cap_dominance)) ? Number(eur.market_cap_dominance) : null,
                volume_24h_eur: Number.isFinite(Number(eur.volume_24h)) ? Number(eur.volume_24h) : null,
                volume_24h_usd: Number.isFinite(Number(usd?.volume_24h)) ? Number(usd.volume_24h) : null,
                circulating_supply: Number.isFinite(Number(row.circulating_supply)) ? Number(row.circulating_supply) : null,
                total_supply: Number.isFinite(Number(row.total_supply)) ? Number(row.total_supply) : null,
                max_supply: Number.isFinite(Number(row.max_supply)) ? Number(row.max_supply) : null,
                last_updated: row.last_updated || eur.last_updated || now
              };
            }).filter(Boolean);
            if (assets.length < 40) throw new Error(`Top 50 valide incomplet ${assets.length}/50`);
            const totalCap = assets.reduce((sum, row) => sum + (Number(row.market_cap_eur) || 0), 0);
            const totalVolume = assets.reduce((sum, row) => sum + (Number(row.volume_24h_eur) || 0), 0);
            const btc = assets.find(row => row.symbol === 'BTC');
            const record = {
              schema: 'atlas_market_snapshot_cmc_top50_v1',
              version: 'V1.1-alpha.26.38',
              snapshot_id: `github-action-cmc_${String(now).replace(/[:.]/g, '-')}`,
              collector_id: 'github-action-main',
              collector_type: 'github_archive',
              saved_at: now,
              source: 'CoinMarketCap',
              source_mode: 'archive',
              live_ok: true,
              archive_only: true,
              assets_count: assets.length,
              quote_currencies: ['EUR', 'USD'],
              global: {
                market_cap_eur: totalCap,
                volume_24h_eur: totalVolume,
                btc_dominance_pct: Number.isFinite(Number(btc?.market_cap_dominance)) ? Number(btc.market_cap_dominance) : null,
                scope: 'top50'
              },
              assets
            };
            fs.writeFileSync(path.join(ROOT, 'latest.json'), JSON.stringify({
              schema: 'atlas_github_market_memory_v3', version: record.version, generated_at: now,
              source: 'CoinMarketCap', live_ok: true, archive_only: true, assets_count: assets.length,
              latest: record, records: [record]
            }, null, 2) + '\n');
            fs.appendFileSync(path.join(HISTORY, `${String(now).slice(0, 10)}.jsonl`), JSON.stringify(record) + '\n');
            fs.writeFileSync(path.join(ROOT, 'status.json'), JSON.stringify({
              schema: 'atlas_github_market_status_v3', version: record.version, updated_at: now,
              status: 'ok', source: 'CoinMarketCap', archive_only: true, assets_count: assets.length,
              quote_currencies: ['EUR', 'USD'], message: 'Archive Top 50 CoinMarketCap créée en un appel. Non utilisée comme flux live.'
            }, null, 2) + '\n');
          })().catch(error => {
            const now = new Date().toISOString();
            fs.writeFileSync(path.join(ROOT, 'status.json'), JSON.stringify({
              schema: 'atlas_github_market_status_v3', version: 'V1.1-alpha.26.38', updated_at: now,
              status: 'error', source: 'CoinMarketCap', archive_only: true,
              message: String(error?.message || error)
            }, null, 2) + '\n');
            console.error(error);
            process.exitCode = 1;
          });
          NODE

      - name: Commit archive
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/agent_crypto_erith_ia/data/latest.json \
                  public/agent_crypto_erith_ia/data/status.json \
                  public/agent_crypto_erith_ia/data/history || true
          if git diff --cached --quiet; then
            echo "No archive change"
            exit 0
          fi
          git commit -m "archive atlas coinmarketcap top 50 snapshot"
          git pull --rebase origin main
          git push origin HEAD:main
