name: Atlas Market Collector

on:
  workflow_dispatch:
  schedule:
    - cron: "2-57/5 * * * *"

permissions:
  contents: write

concurrency:
  group: atlas-market-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    env:
      COINGECKO_DEMO_API_KEY: ${{ secrets.COINGECKO_DEMO_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Collect market data and rotating chart caches
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("fs");
          const path = require("path");
          
          const ROOT = "public/agent_crypto_erith_ia/data";
          const HISTORY = path.join(ROOT, "history");
          const CHARTS = path.join(ROOT, "charts");
          const CHART_ASSETS = path.join(CHARTS, "assets");
          fs.mkdirSync(HISTORY, { recursive: true });
          fs.mkdirSync(CHARTS, { recursive: true });
          fs.mkdirSync(CHART_ASSETS, { recursive: true });
          
          const TOP_LIMIT = 50;
          const CG_DEMO_KEY = String(process.env.COINGECKO_DEMO_API_KEY || "").trim();
          const PRIORITY_CHART_IDS = Object.freeze(["bitcoin", "ethereum", "solana"]);
          const CHART_BATCH_SIZE = process.env.GITHUB_EVENT_NAME === "workflow_dispatch" ? 10 : 3;
          
          function nowContext() {
            const now = new Date();
            const iso = now.toISOString();
            const day = iso.slice(0, 10);
            return {
              now,
              iso,
              day,
              historyFile: path.join(HISTORY, `${day}.jsonl`)
            };
          }
          
          function writeJson(file, payload) {
            fs.writeFileSync(file, JSON.stringify(payload, null, 2) + "\n", "utf8");
          }
          
          function writeJsonAtomic(file, payload) {
            const temp = `${file}.tmp`;
            fs.writeFileSync(temp, JSON.stringify(payload, null, 2) + "\n", "utf8");
            fs.renameSync(temp, file);
          }
          
          function readJsonSafe(file) {
            try { return JSON.parse(fs.readFileSync(file, "utf8")); }
            catch { return null; }
          }
          
          function appendJsonl(file, payload) {
            fs.appendFileSync(file, JSON.stringify(payload) + "\n", "utf8");
          }
          
          function writeFatalStatus(error) {
            const ctx = nowContext();
            writeJsonAtomic(path.join(ROOT, "status.json"), {
              schema: "atlas_github_market_status_v1",
              version: "V1.1-alpha.26.34",
              updated_at: ctx.iso,
              status: "workflow_error",
              live_ok: false,
              source: "none",
              assets_count: 0,
              history_file: null,
              message: "Erreur interne du workflow. Diagnostic commité si possible.",
              errors: [String(error?.stack || error?.message || error)]
            });
            if (!fs.existsSync(path.join(ROOT, "latest.json"))) writeJsonAtomic(path.join(ROOT, "latest.json"), {
              schema: "atlas_github_market_latest_v1",
              version: "V1.1-alpha.26.34",
              generated_at: ctx.iso,
              collector_id: "github-action-main",
              collector_type: "github_action",
              source: "none",
              live_ok: false,
              record_count: 0,
              records: [],
              last_error_record: {
                id: `github-action-main_${ctx.iso.replace(/[:.]/g, "-")}`,
                snapshot_id: `github-action-main_${ctx.iso.replace(/[:.]/g, "-")}`,
                saved_at: ctx.iso,
                version: "V1.1-alpha.26.34",
                collector_id: "github-action-main",
                collector_type: "github_action",
                source: "none",
                live_ok: false,
                cadence_ms: 300000,
                global: {
                  market_cap_eur: null,
                  volume_24h_eur: null,
                  btc_dominance_pct: null
                },
                market_pulse: {
                  state: "Diagnostic workflow",
                  avg_top20_24h_pct: 0,
                  btc_24h_pct: null,
                  eth_24h_pct: null
                },
                assets: [],
                errors: [String(error?.stack || error?.message || error)]
              }
            });
            console.log("ATLAS_COLLECTOR_WORKFLOW_ERROR", String(error?.message || error));
          }
          
          const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));
          
          async function fetchJson(url, timeoutMs = 18000, retries = 2) {
            let lastError = null;
            for (let attempt = 0; attempt <= retries; attempt += 1) {
              const controller = new AbortController();
              const timeout = setTimeout(() => controller.abort(), timeoutMs);
              try {
                const headers = {
                  accept: "application/json",
                  "user-agent": "atlas-market-collector/1.1-alpha.26.34"
                };
                if (CG_DEMO_KEY && String(url).includes("api.coingecko.com")) headers["x-cg-demo-api-key"] = CG_DEMO_KEY;
                const res = await fetch(url, { signal: controller.signal, headers });
                if (!res.ok) {
                  const error = new Error(`HTTP ${res.status}`);
                  error.status = res.status;
                  throw error;
                }
                return await res.json();
              } catch (error) {
                lastError = error;
                const retryable = error?.name === "AbortError" || Number(error?.status || 0) === 429 || Number(error?.status || 0) >= 500 || !error?.status;
                if (!retryable || attempt >= retries) break;
                await sleep(1200 * Math.pow(2, attempt));
              } finally {
                clearTimeout(timeout);
              }
            }
            throw lastError || new Error("fetch failed");
          }
          
          function scoreCoin(c) {
            let score = 40;
            const rank = Number(c.rank || 9999);
            const change24 = Number(c.change_24h_pct ?? c.change24h ?? 0);
            const change7 = Number(c.change_7d_pct ?? c.change7d ?? 0);
            const marketCap = Number(c.market_cap_eur ?? c.marketCap ?? 0);
            const volume = Number(c.volume_24h_eur ?? c.volume24h ?? 0);
            const ratio = marketCap > 0 ? volume / marketCap : 0;
          
            if (rank <= 2) score += 12;
            else if (rank <= 10) score += 7;
            else if (rank <= 30) score += 4;
            if (Math.abs(change24) <= 5) score += 5;
            if (change24 > 0 && change7 > 0) score += 8;
            if (ratio > 0.015) score += 8;
            if (ratio > 0.05) score += 4;
            if (marketCap > 10000000000) score += 6;
            if (change24 < -10) score -= 10;
          
            return Math.max(0, Math.min(100, Math.round(score)));
          }
          
          function classifyAsset(c) {
            const symbol = String(c.symbol || "").toUpperCase();
            const rank = Number(c.rank || 9999);
            const marketCap = Number(c.market_cap_eur ?? c.marketCap ?? 0);
            const volume = Number(c.volume_24h_eur ?? c.volume24h ?? 0);
            const ratio = marketCap > 0 ? volume / marketCap : 0;
          
            if (["USDT", "USDC", "DAI", "USDS", "FDUSD", "TUSD"].includes(symbol)) return "Stablecoin";
            if (["BTC", "ETH"].includes(symbol)) return "Socle marché";
            if (rank <= 20 && marketCap > 3000000000) return "Grand actif solide";
            if (rank <= 80 && ratio > 0.02) return "Spéculatif liquide";
            if (rank <= 150) return "Opportunité à surveiller";
            if (volume < 1000000 || marketCap < 50000000) return "À vérifier";
            return "À vérifier";
          }
          
          function decideAction(c) {
            const type = classifyAsset(c);
            const change24 = Number(c.change_24h_pct ?? c.change24h ?? 0);
            const change7 = Number(c.change_7d_pct ?? c.change7d ?? 0);
          
            if (type === "Stablecoin") return "Surveiller stabilité";
            if (type === "Socle marché") return "Observer / comparer";
            if (change24 > 12 && change7 > 20) return "Attendre / éviter FOMO";
            if (change24 < -10) return "Surveiller risque";
            if (type === "Spéculatif liquide") return "Surveiller fortement";
            if (type === "Opportunité à surveiller") return "Comparer";
            return "Observer";
          }
          
          function normalizeCoinGeckoMarket(rows, usdById = {}) {
            if (!Array.isArray(rows)) throw new Error("CoinGecko payload invalid");
            return rows.slice(0, TOP_LIMIT).map((c) => {
              const row = {
                id: c.id,
                symbol: String(c.symbol || "").toUpperCase(),
                name: c.name,
                rank: c.market_cap_rank,
                price_eur: c.current_price,
                price_usd: Number.isFinite(Number(usdById?.[c.id]?.usd)) ? Number(usdById[c.id].usd) : null,
                change_1h_pct: c.price_change_percentage_1h_in_currency,
                change_24h_pct: c.price_change_percentage_24h_in_currency ?? c.price_change_percentage_24h,
                change_7d_pct: c.price_change_percentage_7d_in_currency,
                change_30d_pct: c.price_change_percentage_30d_in_currency,
                high_24h_eur: c.high_24h,
                low_24h_eur: c.low_24h,
                market_cap_eur: c.market_cap,
                volume_24h_eur: c.total_volume,
                sparkline_7d_eur: Array.isArray(c.sparkline_in_7d?.price) ? c.sparkline_in_7d.price : [],
                last_updated: c.last_updated || new Date().toISOString(),
                source: "CoinGecko"
              };
              row.category = classifyAsset(row);
              row.action = decideAction(row);
              row.score = scoreCoin(row);
              return row;
            });
          }
          
          async function collectCoinGecko() {
            const marketsUrl = "https://api.coingecko.com/api/v3/coins/markets?vs_currency=eur&order=market_cap_desc&per_page=50&page=1&sparkline=true&price_change_percentage=1h%2C24h%2C7d%2C30d&precision=full";
            const globalUrl = "https://api.coingecko.com/api/v3/global";
            const [markets, global] = await Promise.all([fetchJson(marketsUrl), fetchJson(globalUrl)]);
            const ids = Array.isArray(markets) ? markets.map(row => row.id).filter(Boolean).join(",") : "";
            let usdById = {};
            if (ids) {
              try {
                usdById = await fetchJson(`https://api.coingecko.com/api/v3/simple/price?ids=${encodeURIComponent(ids)}&vs_currencies=usd&include_last_updated_at=true&precision=full`, 18000, 2);
              } catch (error) {
                console.log("ATLAS_USD_PRICE_WARNING", String(error?.message || error));
              }
            }
            const assets = normalizeCoinGeckoMarket(markets, usdById);
            return {
              source: "CoinGecko",
              source_lock: "CoinGecko",
              quote_currencies: ["EUR", "USD"],
              global: {
                market_cap_eur: global?.data?.total_market_cap?.eur ?? null,
                volume_24h_eur: global?.data?.total_volume?.eur ?? null,
                btc_dominance_pct: global?.data?.market_cap_percentage?.btc ?? null
              },
              assets
            };
          }
          
          async function collect() {
            try {
              return await collectCoinGecko();
            } catch (error) {
              return {
                source: "none",
                source_lock: "CoinGecko",
                quote_currencies: ["EUR", "USD"],
                global: { market_cap_eur: null, volume_24h_eur: null, btc_dominance_pct: null },
                assets: [],
                errors: [`CoinGecko: ${String(error?.message || error)}`]
              };
            }
          }
          
          function marketPulse(assets) {
            const btc = assets.find(a => a.symbol === "BTC");
            const eth = assets.find(a => a.symbol === "ETH");
            const top = assets.slice(0, 20);
            const avg24 = top.length ? top.reduce((s, a) => s + Number(a.change_24h_pct || 0), 0) / top.length : 0;
            return {
              state: avg24 > 3 ? "Marché en hausse" : avg24 < -3 ? "Marché sous pression" : "Marché calme",
              avg_top20_24h_pct: avg24,
              btc_24h_pct: btc?.change_24h_pct ?? null,
              eth_24h_pct: eth?.change_24h_pct ?? null
            };
          }
          
          
          
          function normalizeMarketChartPrices(payload) {
            const rows = Array.isArray(payload?.prices) ? payload.prices : [];
            const dedup = new Map();
            for (const point of rows) {
              const timestamp = Number(point?.[0]);
              const price = Number(point?.[1]);
              if (!Number.isFinite(timestamp) || timestamp <= 0 || !Number.isFinite(price) || price <= 0) continue;
              dedup.set(timestamp, price);
            }
            return [...dedup.entries()].sort((a, b) => a[0] - b[0]);
          }
          
          function sliceChartPeriod(prices, days) {
            if (!Array.isArray(prices) || prices.length < 2) return [];
            const lastTimestamp = Number(prices[prices.length - 1][0]);
            const startTimestamp = lastTimestamp - Number(days) * 24 * 60 * 60 * 1000;
            const sliced = prices.filter((point) => Number(point[0]) >= startTimestamp);
            if (sliced.length && Number(sliced[0][0]) > startTimestamp) {
              const previous = [...prices].reverse().find((point) => Number(point[0]) < Number(sliced[0][0]));
              if (previous) sliced.unshift(previous);
            }
            return sliced;
          }
          
          function chartPayload(ctx, asset, prices) {
            const values = prices.map((point) => point[1]);
            return {
              schema: "atlas_chart_asset_cache_v1",
              version: "V1.1-alpha.26.34",
              generated_at: ctx.iso,
              collector_id: "github-action-main",
              collector_type: "github_action",
              source: "CoinGecko",
              endpoint: `coins/${asset.id}/market_chart`,
              coin_id: asset.id,
              symbol: asset.symbol,
              vs_currency: "eur",
              period: "30j",
              days: 30,
              point_count: prices.length,
              first_timestamp: prices[0]?.[0] ?? null,
              last_timestamp: prices[prices.length - 1]?.[0] ?? null,
              min_price_eur: Math.min(...values),
              max_price_eur: Math.max(...values),
              first_price_eur: values[0],
              last_price_eur: values[values.length - 1],
              prices,
              live_ok: true,
              errors: []
            };
          }
          
          function safeChartAssetId(id) {
            return String(id || "").toLowerCase().replace(/[^a-z0-9_-]+/g, "-");
          }
          
          function chartAssetFile(asset) {
            return path.join(CHART_ASSETS, `${safeChartAssetId(asset.id)}_30d.json`);
          }
          
          function existingChartStatus(asset, error = null) {
            const file = chartAssetFile(asset);
            const existing = readJsonSafe(file);
            const usable = existing?.live_ok === true && Array.isArray(existing?.prices) && existing.prices.length >= 100;
            return {
              file: `assets/${path.basename(file)}`,
              coin_id: asset.id,
              symbol: asset.symbol,
              live_ok: usable,
              retained_existing: usable,
              point_count: usable ? existing.prices.length : 0,
              source: "CoinGecko",
              error: error ? String(error?.message || error) : null
            };
          }
          
          function chooseChartBatch(assets, ctx) {
            const candidates = (assets || [])
              .filter(asset => asset?.id && asset?.symbol && asset.source === "CoinGecko")
              .sort((a, b) => String(a.id).localeCompare(String(b.id)));
            if (!candidates.length) return [];
            const byId = new Map(candidates.map(asset => [asset.id, asset]));
            const chosen = [];
            for (const id of PRIORITY_CHART_IDS) {
              const asset = byId.get(id);
              if (asset && !fs.existsSync(chartAssetFile(asset))) chosen.push(asset);
            }
            const slot = Math.floor(ctx.now.getTime() / 300000) % candidates.length;
            for (let offset = 0; chosen.length < CHART_BATCH_SIZE && offset < candidates.length * 2; offset += 1) {
              const asset = candidates[(slot + offset) % candidates.length];
              if (!chosen.some(item => item.id === asset.id)) chosen.push(asset);
            }
            return chosen.slice(0, CHART_BATCH_SIZE);
          }
          
          async function collectAssetChart(ctx, asset) {
            const file = chartAssetFile(asset);
            try {
              const url = `https://api.coingecko.com/api/v3/coins/${encodeURIComponent(asset.id)}/market_chart?vs_currency=eur&days=30&precision=full`;
              const payload = await fetchJson(url, 22000, 2);
              const prices = normalizeMarketChartPrices(payload);
              if (prices.length < 100) throw new Error(`not enough 30d points: ${prices.length}`);
              writeJsonAtomic(file, chartPayload(ctx, asset, prices));
              return { file: `assets/${path.basename(file)}`, coin_id: asset.id, symbol: asset.symbol, live_ok: true, retained_existing: false, point_count: prices.length, source: "CoinGecko" };
            } catch (error) {
              return existingChartStatus(asset, error);
            }
          }
          
          async function collectRotatingCharts(ctx, assets) {
            const batch = chooseChartBatch(assets, ctx);
            const statuses = [];
            for (const asset of batch) {
              statuses.push(await collectAssetChart(ctx, asset));
              await sleep(1400);
            }
            return statuses;
          }
          
          function historyAssets(assets) {
            return (assets || []).map(asset => {
              const { sparkline_7d_eur, ...compact } = asset;
              return compact;
            });
          }
          
          async function main() {
            const ctx = nowContext();
            const collected = await collect();
            const assets = Array.isArray(collected.assets) ? collected.assets : [];
            const liveOk = assets.length > 0 && collected.source !== "none";
            const snapshotId = `github-action-main_${ctx.iso.replace(/[:.]/g, "-")}`;
          
            const record = {
              id: snapshotId,
              snapshot_id: snapshotId,
              saved_at: ctx.iso,
              version: "V1.1-alpha.26.34",
              collector_id: "github-action-main",
              collector_type: "github_action",
              source: collected.source,
              source_lock: "CoinGecko",
              quote_currencies: collected.quote_currencies || ["EUR", "USD"],
              live_ok: liveOk,
              cadence_ms: 300000,
              global: collected.global,
              market_pulse: marketPulse(assets),
              assets: historyAssets(assets),
              errors: collected.errors || []
            };
          
            const chartCache = await collectRotatingCharts(ctx, assets);
          
            const latest = {
              schema: "atlas_github_market_latest_v1",
              version: "V1.1-alpha.26.34",
              generated_at: ctx.iso,
              collector_id: "github-action-main",
              collector_type: "github_action",
              source: collected.source,
              source_lock: "CoinGecko",
              quote_currencies: collected.quote_currencies || ["EUR", "USD"],
              live_ok: liveOk,
              record_count: liveOk ? 1 : 0,
              records: liveOk ? [record] : [],
              live_assets: liveOk ? assets : [],
              chart_cache: chartCache,
              last_error_record: liveOk ? null : record
            };
          
            const status = {
              schema: "atlas_github_market_status_v1",
              version: "V1.1-alpha.26.34",
              updated_at: ctx.iso,
              status: liveOk ? "ok" : "source_error",
              live_ok: liveOk,
              source: collected.source,
              source_lock: "CoinGecko",
              quote_currencies: collected.quote_currencies || ["EUR", "USD"],
              assets_count: assets.length,
              history_file: liveOk ? ctx.historyFile : null,
              chart_cache: chartCache,
              message: liveOk ? `Collecte OK depuis ${collected.source}` : "CoinGecko indisponible : dernier latest.json canonique conservé, diagnostic commité.",
              errors: collected.errors || []
            };
          
            if (liveOk || !fs.existsSync(path.join(ROOT, "latest.json"))) {
              writeJsonAtomic(path.join(ROOT, "latest.json"), latest);
            } else {
              console.log("ATLAS_LATEST_RETAINED previous valid latest.json preserved");
            }
            writeJsonAtomic(path.join(ROOT, "status.json"), status);
          
            if (liveOk) {
              appendJsonl(ctx.historyFile, record);
              console.log(`ATLAS_COLLECTOR_OK source=${collected.source} assets=${assets.length} history=${ctx.historyFile}`);
            } else {
              console.log(`ATLAS_COLLECTOR_SOURCE_ERROR ${JSON.stringify(collected.errors || [])}`);
            }
          }
          
          main().catch((error) => {
            writeFatalStatus(error);
          });
          NODE

      - name: Commit collected data or diagnostic
        shell: bash
        run: |
          set -e
          git config user.name "atlas-market-collector"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/agent_crypto_erith_ia/data/latest.json \
                  public/agent_crypto_erith_ia/data/status.json \
                  public/agent_crypto_erith_ia/data/history/ \
                  public/agent_crypto_erith_ia/data/charts/
          if git diff --cached --quiet; then
            echo "No market data changes to commit."
            exit 0
          fi
          git commit -m "update atlas market memory"
          for attempt in 1 2 3; do
            if git pull --rebase --autostash origin main && git push origin HEAD:main; then
              exit 0
            fi
            echo "Push attempt $attempt failed; retrying after rebase."
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 4))
          done
          echo "Unable to push Atlas data after 3 attempts."
          exit 1
