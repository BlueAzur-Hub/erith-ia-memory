name: Agent Crypto audit visible version surface patch

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/agent-crypto-audit-visible-version-surface.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Synchronize
        run: git pull --ff-only origin main

      - name: Audit reachable Auto Reader and version-surface truth
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json, re

          ROOT = Path('public/agent_crypto_erith_ia/administrator')
          ENTRY = Path('runtime-shell.html')
          CANDIDATE = Path('js/visible-version-surface-truth-406107.js')
          HTML_JS_RE = re.compile(r'(?:src|href)=["\'](?P<ref>[^"\']+\.js(?:\?[^"\']*)?)["\']', re.I)
          JS_PATH_RE = re.compile(r'(?P<ref>(?:\.\.?/|/)?js/[A-Za-z0-9_./-]+\.js)(?:\?[^"\'`\s)]*)?', re.I)
          REL_JS_RE = re.compile(r'(?P<ref>\.\.?/[A-Za-z0-9_./-]+\.js)(?:\?[^"\'`\s)]*)?', re.I)
          TOKENS = [
              'ATLAS AUTO READER V4',
              'interface_build_truth',
              '40.6.86',
              'AUTO READER',
              'Auto Reader',
              'auto reader',
              'visibleVersionSurfaceTruth',
              'AgentCryptoVisibleVersionSurfaceTruth',
          ]

          def strip_query(ref):
              return ref.split('?',1)[0].split('#',1)[0]

          def resolve(source_rel, ref):
              clean = strip_query(ref).replace('\\','/')
              candidates = []
              if clean.startswith('/'):
                  candidates.append(Path(clean.lstrip('/')))
              elif clean.startswith('js/'):
                  candidates.append(Path(clean))
              elif clean.startswith('./js/'):
                  candidates.append(Path(clean[2:]))
                  try: candidates.append(((ROOT/source_rel).parent/clean).resolve().relative_to(ROOT.resolve()))
                  except Exception: pass
              elif clean.startswith(('./','../')):
                  try: candidates.append(((ROOT/source_rel).parent/clean).resolve().relative_to(ROOT.resolve()))
                  except Exception: pass
                  if clean.startswith('./'): candidates.append(Path(clean[2:]))
              return {rel for rel in candidates if (ROOT/rel).is_file()}

          def refs(text):
              out=[m.group('ref') for m in HTML_JS_RE.finditer(text)]
              out += [m.group('ref') for m in JS_PATH_RE.finditer(text)]
              out += [m.group('ref') for m in REL_JS_RE.finditer(text)]
              return list(dict.fromkeys(out))

          queue=[ENTRY]
          reachable=set(); edges={}; texts={}
          while queue:
              rel=queue.pop(0)
              if rel in reachable: continue
              full=ROOT/rel
              if not full.is_file() or full.suffix.lower() not in {'.html','.js'}: continue
              try: text=full.read_text(encoding='utf-8')
              except UnicodeDecodeError: continue
              reachable.add(rel); texts[rel]=text
              targets=set()
              for ref in refs(text): targets.update(resolve(rel,ref))
              edges[rel]=targets
              for target in sorted(targets,key=str):
                  if target.suffix.lower() in {'.html','.js'} and target not in reachable:
                      queue.append(target)

          build=json.loads((ROOT/'build.json').read_text(encoding='utf-8'))
          if str(build.get('build'))!='40.6.124': raise SystemExit(f"Build drifted: {build.get('build')!r}")
          market_core=str(build.get('market_core') or build.get('engine') or '')
          if '38.15.11' not in market_core: raise SystemExit(f'Market Core drifted: {market_core!r}')

          inbound=sorted(str(src) for src,targets in edges.items() if CANDIDATE in targets)
          literal_sources=sorted(str(src) for src,text in texts.items() if CANDIDATE.name in text)

          reachable_hits={}
          for rel,text in sorted(texts.items(),key=lambda item:str(item[0])):
              hits=[]
              for lineno,line in enumerate(text.splitlines(),1):
                  matched=[token for token in TOKENS if token in line]
                  if matched:
                      hits.append({'line':lineno,'tokens':matched,'text':line.strip()[:500]})
              if hits: reachable_hits[str(rel)]=hits

          repository_hits={}
          for path in sorted(ROOT.rglob('*')):
              if not path.is_file() or path.suffix.lower() not in {'.html','.js','.json'}: continue
              try: text=path.read_text(encoding='utf-8')
              except UnicodeDecodeError: continue
              hits=[]
              for lineno,line in enumerate(text.splitlines(),1):
                  matched=[token for token in TOKENS if token in line]
                  if matched:
                      hits.append({'line':lineno,'tokens':matched,'text':line.strip()[:500]})
              if hits: repository_hits[str(path.relative_to(ROOT))]=hits

          version_truth=(ROOT/'js/version-truth.js').read_text(encoding='utf-8')
          canonical_truth={
              'owner_version_truth': 'const OWNER = "version-truth"' in version_truth,
              'build_json_authority': 'build_json_authority: true' in version_truth,
              'stable_runtime_filenames': 'versioned_runtime_filenames: false' in version_truth,
              'sync_footer': 'function syncFooter(' in version_truth,
              'sync_mirror': 'function syncMirror(' in version_truth,
              'sync_visible_truth': 'syncVisibleTruth' in version_truth,
          }

          print(json.dumps({
              'build':build.get('build'),
              'market_core':market_core,
              'runtime_nodes':len(reachable),
              'candidate':str(CANDIDATE),
              'candidate_exists':(ROOT/CANDIDATE).is_file(),
              'candidate_reachable':CANDIDATE in reachable,
              'candidate_inbound_from':inbound,
              'candidate_active_literal_sources':literal_sources,
              'reachable_token_hits':reachable_hits,
              'repository_token_hits':repository_hits,
              'canonical_version_truth_contract':canonical_truth,
              'mutation':'none'
          },indent=2,ensure_ascii=False))
          PY

      - name: Retire one-shot audit workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Seven Heaven Refactor'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/agent-crypto-audit-visible-version-surface.yml
          git commit -m 'chore(agent-crypto): retire visible version surface audit tooling'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo 'Rebase conflict; refusing force-push'
              exit 1
            fi
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*2))
          done
          echo 'Push remained contested after safe retries'
          exit 1
