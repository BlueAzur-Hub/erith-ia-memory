name: Agent-Crypto Package 40.6.443 Execution Cost Restore

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/agent-crypto-package-406443.yml'

permissions:
  contents: write

jobs:
  validate-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate Execution Cost on-demand restore
        shell: bash
        run: |
          set -euo pipefail
          ROOT="public/agent_crypto_erith_ia/administrator"
          node --check "$ROOT/js/strategy-a-audit-demand-loader.js"
          node --check "$ROOT/js/strategy-a-execution-cost-truth.js"
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path("public/agent_crypto_erith_ia/administrator")
          demand=(root/"js/strategy-a-audit-demand-loader.js").read_text(encoding="utf-8")
          exe=(root/"js/strategy-a-execution-cost-truth.js").read_text(encoding="utf-8")
          post=(root/"js/post-boot-runtime-loader.js").read_text(encoding="utf-8")
          css=(root/"style.css").read_text(encoding="utf-8")
          idx=(root/"index.html").read_text(encoding="utf-8")
          b=json.loads((root/"build.json").read_text(encoding="utf-8"))
          checks={
            "build":b.get("build")=="40.6.443",
            "demand_execution":'key:"execution-cost"' in demand,
            "execution_443":'const BUILD="40.6.443"' in exe,
            "not_postboot":"strategy-a-execution-cost-truth.js" not in post,
            "null_guard":'v===null||v===undefined||v===""' in exe,
            "crossed_okx":"bid/ask OKX croisés" in exe,
            "crossed_kraken":"carnet croisé" in exe,
            "demand_timeout":"Source Truth demand timeout" in exe,
            "repeatable_export":'addEventListener("click",exportJson);' in exe,
            "backend_priority":'data-agent-crypto-backend-priority="40.6.443"' in idx,
            "chart_428":"height: clamp(525px, calc(61.5vh + 42px), 720px) !important;" in css,
          }
          bad=[k for k,v in checks.items() if not v]
          if bad: raise SystemExit(f"40.6.443 validation failed: {bad}")
          print("40.6.443 EXECUTION COST ON-DEMAND STATIC PASS")
          PY

      - name: Build bounded ZIP
        shell: bash
        run: |
          set -euo pipefail
          ROOT="public/agent_crypto_erith_ia/administrator"
          ZIP="$ROOT/AGENT_CRYPTO_EXECUTION_COST_ON_DEMAND_RESTORE_40.6.443.zip"
          SHA="$ZIP.sha256"
          rm -f "$ZIP" "$SHA"
          rm -rf /tmp/agent-crypto-406443
          mkdir -p /tmp/agent-crypto-406443/administrator/js
          cp "$ROOT/index.html" /tmp/agent-crypto-406443/administrator/
          cp "$ROOT/index-40.6.443.html" /tmp/agent-crypto-406443/administrator/
          cp "$ROOT/build.json" /tmp/agent-crypto-406443/administrator/
          cp "$ROOT/RELEASE.md" /tmp/agent-crypto-406443/administrator/
          cp "$ROOT/HANDOFF.md" /tmp/agent-crypto-406443/administrator/
          cp "$ROOT/PATCH_MANIFEST_40.6.443.txt" /tmp/agent-crypto-406443/administrator/
          cp "$ROOT/js/strategy-a-audit-demand-loader.js" /tmp/agent-crypto-406443/administrator/js/
          cp "$ROOT/js/strategy-a-execution-cost-truth.js" /tmp/agent-crypto-406443/administrator/js/
          (cd /tmp/agent-crypto-406443 && zip -9 -r "$GITHUB_WORKSPACE/$ZIP" .)
          unzip -t "$ZIP"
          sha256sum "$ZIP" > "$SHA"

      - name: Commit package
        shell: bash
        run: |
          set -euo pipefail
          ROOT="public/agent_crypto_erith_ia/administrator"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$ROOT/AGENT_CRYPTO_EXECUTION_COST_ON_DEMAND_RESTORE_40.6.443.zip" "$ROOT/AGENT_CRYPTO_EXECUTION_COST_ON_DEMAND_RESTORE_40.6.443.zip.sha256"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore(package): add Agent-Crypto 40.6.443 Execution Cost restore ZIP"
          git pull --rebase origin main
          git push origin HEAD:main
