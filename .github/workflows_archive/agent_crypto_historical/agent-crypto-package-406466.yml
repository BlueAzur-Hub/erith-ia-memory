# 40.6.466 audit-loader newline repair
name: Agent-Crypto Package 40.6.466 Real Venue Cost Shadow Truth
on:
  push:
    branches: [main]
    paths: ['.github/workflows/agent-crypto-package-406466.yml']
permissions: {contents: write}
jobs:
  validate-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 2}
      - name: Validate syntax and delivery
        run: |
          ROOT="public/agent_crypto_erith_ia/administrator"
          node --check "$ROOT/js/strategy-a-real-venue-cost-shadow-truth.js"
          node --check "$ROOT/js/strategy-a-execution-cost-truth.js"
          node --check "$ROOT/js/strategy-a-audit-demand-loader.js"
          node --check "$ROOT/js/post-boot-runtime-loader.js"
          grep -F 'strategy-a-real-venue-cost-shadow-truth.js?v=40.6.466' "$ROOT/js/strategy-a-audit-demand-loader.js"
          grep -F 'strategy-a-execution-cost-truth.js?v=40.6.466' "$ROOT/js/strategy-a-audit-demand-loader.js"
          grep -F 'strategy-a-execution-cost-truth.js?v=40.6.466' "$ROOT/js/post-boot-runtime-loader.js"
          grep -F 'agent-crypto:strategy-a-execution-cost-measured' "$ROOT/js/strategy-a-execution-cost-truth.js"
          grep -F 'Build 40.6.466 · Administrator' "$ROOT/index.html"
      - name: Exercise shadow classification
        run: |
          node <<'NODE'
          const fs=require("fs"),vm=require("vm");
          const path="public/agent_crypto_erith_ia/administrator/js/strategy-a-real-venue-cost-shadow-truth.js";
          vm.runInThisContext(fs.readFileSync(path,"utf8"),{filename:path});
          const t=global.AgentCryptoStrategyARealVenueCostShadowTruth.self_test();
          if(!t.pass)throw new Error("Shadow self-test failed: "+JSON.stringify(t));
          if(global.AgentCryptoStrategyARealVenueCostShadowTruth.thresholds_changed!==false)throw new Error("threshold invariant");
          if(global.AgentCryptoStrategyARealVenueCostShadowTruth.strategy_decision_changed!==false)throw new Error("strategy invariant");
          if(global.AgentCryptoStrategyARealVenueCostShadowTruth.real_order!==false)throw new Error("real-order invariant");
          console.log("PASS: Real Venue Cost Shadow classification");
          NODE
      - name: Package
        run: |
          ROOT="public/agent_crypto_erith_ia/administrator"; ZIP="$ROOT/AGENT_CRYPTO_REAL_VENUE_COST_SHADOW_TRUTH_40.6.466.zip"
          rm -f "$ZIP" "$ZIP.sha256"; rm -rf /tmp/ac466; mkdir -p /tmp/ac466/administrator/js
          cp "$ROOT/index.html" "$ROOT/index-40.6.466.html" "$ROOT/build.json" "$ROOT/RELEASE.md" "$ROOT/HANDOFF.md" "$ROOT/HANDOFF_FINAL_40.6.466.md" "$ROOT/REAL_VENUE_COST_SHADOW_TRUTH_TEST_40.6.466.json" /tmp/ac466/administrator/
          cp "$ROOT/js/strategy-a-real-venue-cost-shadow-truth.js" "$ROOT/js/strategy-a-execution-cost-truth.js" "$ROOT/js/strategy-a-audit-demand-loader.js" "$ROOT/js/post-boot-runtime-loader.js" /tmp/ac466/administrator/js/
          (cd /tmp/ac466 && zip -9 -r "$GITHUB_WORKSPACE/$ZIP" .)
          unzip -t "$ZIP"; sha256sum "$ZIP" > "$ZIP.sha256"
      - name: Commit package
        run: |
          ROOT="public/agent_crypto_erith_ia/administrator"
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$ROOT/AGENT_CRYPTO_REAL_VENUE_COST_SHADOW_TRUTH_40.6.466.zip" "$ROOT/AGENT_CRYPTO_REAL_VENUE_COST_SHADOW_TRUTH_40.6.466.zip.sha256"
          git commit -m "chore(package): add Agent-Crypto 40.6.466 Real Venue Cost Shadow Truth ZIP"
          git pull --rebase origin main; git push origin HEAD:main
