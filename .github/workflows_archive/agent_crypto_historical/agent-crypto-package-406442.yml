name: Agent-Crypto Package 40.6.442 Chart CSS Restore

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/agent-crypto-package-406442.yml'

permissions:
  contents: write

jobs:
  validate-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate exact 40.6.428 CSS restore
        shell: bash
        run: |
          set -euo pipefail
          ROOT="public/agent_crypto_erith_ia/administrator"
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path("public/agent_crypto_erith_ia/administrator")
          css=(root/"style.css").read_text(encoding="utf-8")
          idx=(root/"index.html").read_text(encoding="utf-8")
          b=json.loads((root/"build.json").read_text(encoding="utf-8"))
          checks={
            "build":b.get("build")=="40.6.442",
            "height":"height: clamp(525px, calc(61.5vh + 42px), 720px) !important;" in css,
            "min_height":"min-height: 525px !important;" in css,
            "max_height":"max-height: 720px !important;" in css,
            "old_height_removed":"height: clamp(507px, calc(59vh + 42px), 647px) !important;" not in css,
            "backend_priority_preserved":'data-agent-crypto-backend-priority="40.6.442"' in idx,
            "execution_cost_not_postboot":"strategy-a-execution-cost-truth.js" not in (root/"js/post-boot-runtime-loader.js").read_text(encoding="utf-8"),
          }
          bad=[k for k,v in checks.items() if not v]
          if bad: raise SystemExit(f"40.6.442 validation failed: {bad}")
          print("40.6.442 EXACT 40.6.428 CSS RESTORE STATIC PASS")
          PY

      - name: Build bounded ZIP
        shell: bash
        run: |
          set -euo pipefail
          ROOT="public/agent_crypto_erith_ia/administrator"
          ZIP="$ROOT/AGENT_CRYPTO_CHART_FRAME_EXACT_RESTORE_40.6.442.zip"
          SHA="$ZIP.sha256"
          rm -f "$ZIP" "$SHA"
          rm -rf /tmp/agent-crypto-406442
          mkdir -p /tmp/agent-crypto-406442/administrator/js/views /tmp/agent-crypto-406442/administrator/js
          cp "$ROOT/index.html" /tmp/agent-crypto-406442/administrator/
          cp "$ROOT/index-40.6.442.html" /tmp/agent-crypto-406442/administrator/
          cp "$ROOT/style.css" /tmp/agent-crypto-406442/administrator/
          cp "$ROOT/build.json" /tmp/agent-crypto-406442/administrator/
          cp "$ROOT/RELEASE.md" /tmp/agent-crypto-406442/administrator/
          cp "$ROOT/HANDOFF.md" /tmp/agent-crypto-406442/administrator/
          cp "$ROOT/PATCH_MANIFEST_40.6.442.txt" /tmp/agent-crypto-406442/administrator/
          cp "$ROOT/js/views/private-backend-sources.js" /tmp/agent-crypto-406442/administrator/js/views/
          (cd /tmp/agent-crypto-406442 && zip -9 -r "$GITHUB_WORKSPACE/$ZIP" .)
          unzip -t "$ZIP"
          sha256sum "$ZIP" > "$SHA"

      - name: Commit package
        shell: bash
        run: |
          set -euo pipefail
          ROOT="public/agent_crypto_erith_ia/administrator"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$ROOT/AGENT_CRYPTO_CHART_FRAME_EXACT_RESTORE_40.6.442.zip" "$ROOT/AGENT_CRYPTO_CHART_FRAME_EXACT_RESTORE_40.6.442.zip.sha256"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore(package): add Agent-Crypto 40.6.442 chart CSS restore ZIP"
          git pull --rebase origin main
          git push origin HEAD:main
