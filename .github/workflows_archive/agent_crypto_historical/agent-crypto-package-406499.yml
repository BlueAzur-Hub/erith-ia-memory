name: Agent-Crypto 40.6.499 Validate Package
on:
  push: {branches: [main]}
  workflow_dispatch:
permissions: {contents: read}
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scope
        run: |
          CURRENT="$(python -c 'import json; print(json.load(open("public/agent_crypto_erith_ia/administrator/build.json"))["build"])')"
          if [ "$CURRENT" != "40.6.499" ]; then echo "SKIP=true" >> "$GITHUB_ENV"; fi
      - name: Validate cumulative market microscope
        if: env.SKIP != 'true'
        run: |
          node --check public/agent_crypto_erith_ia/administrator/js/quote-currency-architecture-406497.js
          node --check public/agent_crypto_erith_ia/administrator/js/market-microscope-candles-406498.js
          node --check public/agent_crypto_erith_ia/administrator/js/okx-microstructure-406499.js
          node -e "require('./public/agent_crypto_erith_ia/administrator/js/quote-currency-architecture-406497.js');require('./public/agent_crypto_erith_ia/administrator/js/market-microscope-candles-406498.js');require('./public/agent_crypto_erith_ia/administrator/js/okx-microstructure-406499.js'); for(const r of [global.AgentCryptoQuoteCurrencyArchitecture.self_test(),global.AgentCryptoMarketMicroscope.self_test(),global.AgentCryptoOkxMicrostructure.self_test()]){console.log(r);if(!r.pass)process.exit(1)}"
          python .github/scripts/agent_crypto_okx_microstructure_guard_406499.py
          python .github/scripts/agent_crypto_version_truth_guard_compat.py
