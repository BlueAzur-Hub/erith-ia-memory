name: Agent-Crypto Package 40.6.462 After-Cost Completeness Truth

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/agent-crypto-package-406462.yml'

permissions:
  contents: write

jobs:
  validate-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Validate 40.6.462
        shell: bash
        run: |
          set -euo pipefail
          ROOT="public/agent_crypto_erith_ia/administrator"
          node --check "$ROOT/js/strategy-a-after-cost-completeness-truth.js"
          node --check "$ROOT/js/strategy-a-audit-demand-loader.js"

          node <<'NODE'
          const fs=require('fs');
          const s=fs.readFileSync('public/agent_crypto_erith_ia/administrator/js/strategy-a-after-cost-completeness-truth.js','utf8');
          Function(s)();
          const t=globalThis.AgentCryptoStrategyAAfterCostCompletenessTruth.self_test();
          if(!t.pass) throw new Error(JSON.stringify(t));
          const api=globalThis.AgentCryptoStrategyAAfterCostCompletenessTruth;
          if(api.storage_write!==false||api.mutates_evidence!==false) throw new Error('completeness truth must remain read-only');
          if(api.certifies_g1!==false||api.certifies_g8!==false) throw new Error('certification forbidden');
          console.log('40.6.462 AFTER-COST COMPLETENESS HARNESS PASS');
          NODE

          python - <<'PY'
          import json
          from pathlib import Path
          r=Path('public/agent_crypto_erith_ia/administrator')
          idx=(r/'index.html').read_text(encoding='utf-8')
          audit=(r/'js/strategy-a-audit-demand-loader.js').read_text(encoding='utf-8')
          b=json.loads((r/'build.json').read_text(encoding='utf-8'))
          receipt=json.loads((r/'AFTER_COST_COMPLETENESS_TEST_40.6.462.json').read_text(encoding='utf-8'))
          checks={
            'build':b.get('build')=='40.6.462',
            'release':b.get('release')=='STRATEGY A AFTER-COST COMPLETENESS TRUTH',
            'market_core':b.get('market_core')=='38.15.11',
            'entry':'Build 40.6.462 · Administrator' in idx,
            'audit_delivery':'strategy-a-audit-demand-loader.js?v=40.6.462' in idx,
            'module_delivery':'strategy-a-after-cost-completeness-truth.js?v=40.6.462' in audit,
            'crosswalk_461_preserved':'strategy-a-evidence-identity-crosswalk-truth.js?v=40.6.461' in audit,
            'reconciliation_460_preserved':'strategy-a-durable-evidence-reconciliation-truth.js?v=40.6.460' in audit,
            'execution_cost_459_preserved':'strategy-a-execution-cost-truth.js?v=40.6.459' in audit,
            'source_loader_457_preserved':'post-boot-runtime-loader.js?v=40.6.457' in idx,
            'receipt':receipt.get('pass') is True,
          }
          bad=[k for k,v in checks.items() if not v]
          if bad: raise SystemExit('40.6.462 failed: '+str(bad))
          print('40.6.462 STATIC PASS')
          PY

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          ROOT="public/agent_crypto_erith_ia/administrator"
          ZIP="$ROOT/AGENT_CRYPTO_STRATEGY_A_AFTER_COST_COMPLETENESS_TRUTH_40.6.462.zip"
          rm -f "$ZIP" "$ZIP.sha256"
          rm -rf /tmp/ac462
          mkdir -p /tmp/ac462/administrator/js
          cp "$ROOT/index.html" /tmp/ac462/administrator/
          cp "$ROOT/index-40.6.462.html" /tmp/ac462/administrator/
          cp "$ROOT/build.json" /tmp/ac462/administrator/
          cp "$ROOT/RELEASE.md" /tmp/ac462/administrator/
          cp "$ROOT/HANDOFF.md" /tmp/ac462/administrator/
          cp "$ROOT/PATCH_MANIFEST_40.6.462.txt" /tmp/ac462/administrator/
          cp "$ROOT/AFTER_COST_COMPLETENESS_TEST_40.6.462.json" /tmp/ac462/administrator/
          cp "$ROOT/js/strategy-a-after-cost-completeness-truth.js" /tmp/ac462/administrator/js/
          cp "$ROOT/js/strategy-a-audit-demand-loader.js" /tmp/ac462/administrator/js/
          (cd /tmp/ac462 && zip -9 -r "$GITHUB_WORKSPACE/$ZIP" .)
          unzip -t "$ZIP"
          sha256sum "$ZIP" > "$ZIP.sha256"

      - name: Commit package
        shell: bash
        run: |
          set -euo pipefail
          ROOT="public/agent_crypto_erith_ia/administrator"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$ROOT/AGENT_CRYPTO_STRATEGY_A_AFTER_COST_COMPLETENESS_TRUTH_40.6.462.zip" "$ROOT/AGENT_CRYPTO_STRATEGY_A_AFTER_COST_COMPLETENESS_TRUTH_40.6.462.zip.sha256"
          git commit -m "chore(package): add Agent-Crypto 40.6.462 Completeness Truth ZIP"
          git pull --rebase origin main
          git push origin HEAD:main
