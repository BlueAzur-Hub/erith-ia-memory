name: Agent-Crypto 40.6.508 Validate Package

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scope
        run: |
          CURRENT="$(python -c 'import json; print(json.load(open("public/agent_crypto_erith_ia/administrator/build.json"))["build"])')"
          if [ "$CURRENT" != "40.6.508" ]; then echo "SKIP=true" >> "$GITHUB_ENV"; fi
      - name: Validate Final Administrator Truth Freeze
        if: env.SKIP != 'true'
        run: |
          node --check public/agent_crypto_erith_ia/administrator/js/okx-microstructure-406499.js
          python .github/scripts/agent_crypto_final_truth_freeze_guard_406508.py
          python .github/scripts/agent_crypto_version_truth_guard_compat.py
