name: Agent-Crypto Package 40.6.445 Oracle Metrics Final Fit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/agent-crypto-package-406445.yml'

permissions:
  contents: write

jobs:
  validate-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate Oracle metrics final fit
        shell: bash
        run: |
          set -euo pipefail
          ROOT="public/agent_crypto_erith_ia/administrator"
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path("public/agent_crypto_erith_ia/administrator")
          idx=(root/"index.html").read_text(encoding="utf-8")
          b=json.loads((root/"build.json").read_text(encoding="utf-8"))
          checks={
            "build":b.get("build")=="40.6.445",
            "three_columns":"grid-template-columns:repeat(3,minmax(0,1fr))!important;" in idx,
            "first_metric_not_spanning":"grid-column:auto!important;" in idx,
            "old_two_column_restore_removed":"40.6.444 — ORACLE METRICS READABILITY RESTORE" not in idx,
            "backend_priority_preserved":'data-agent-crypto-backend-priority="40.6.445"' in idx,
            "chart_428_preserved":"40.6.445" in idx,
          }
          bad=[k for k,v in checks.items() if not v]
          if bad: raise SystemExit(f"40.6.445 validation failed: {bad}")
          print("40.6.445 ORACLE METRICS FINAL FIT STATIC PASS")
          PY

      - name: Build bounded ZIP
        shell: bash
        run: |
          set -euo pipefail
          ROOT="public/agent_crypto_erith_ia/administrator"
          ZIP="$ROOT/AGENT_CRYPTO_ORACLE_METRICS_FINAL_FIT_40.6.445.zip"
          SHA="$ZIP.sha256"
          rm -f "$ZIP" "$SHA"
          rm -rf /tmp/agent-crypto-406445
          mkdir -p /tmp/agent-crypto-406445/administrator
          cp "$ROOT/index.html" /tmp/agent-crypto-406445/administrator/
          cp "$ROOT/index-40.6.445.html" /tmp/agent-crypto-406445/administrator/
          cp "$ROOT/build.json" /tmp/agent-crypto-406445/administrator/
          cp "$ROOT/RELEASE.md" /tmp/agent-crypto-406445/administrator/
          cp "$ROOT/HANDOFF.md" /tmp/agent-crypto-406445/administrator/
          cp "$ROOT/PATCH_MANIFEST_40.6.445.txt" /tmp/agent-crypto-406445/administrator/
          (cd /tmp/agent-crypto-406445 && zip -9 -r "$GITHUB_WORKSPACE/$ZIP" .)
          unzip -t "$ZIP"
          sha256sum "$ZIP" > "$SHA"

      - name: Commit package
        shell: bash
        run: |
          set -euo pipefail
          ROOT="public/agent_crypto_erith_ia/administrator"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$ROOT/AGENT_CRYPTO_ORACLE_METRICS_FINAL_FIT_40.6.445.zip" "$ROOT/AGENT_CRYPTO_ORACLE_METRICS_FINAL_FIT_40.6.445.zip.sha256"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore(package): add Agent-Crypto 40.6.445 Oracle metrics final fit ZIP"
          git pull --rebase origin main
          git push origin HEAD:main
