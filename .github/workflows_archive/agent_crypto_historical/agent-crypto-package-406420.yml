name: Agent-Crypto Package 40.6.420

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/agent-crypto-package-406420.yml'

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build clean ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP="public/agent_crypto_erith_ia/administrator/AGENT_CRYPTO_NEWS_SEMANTIC_TRUTH_40.6.420.zip"
          rm -f "$ZIP"
          rm -rf /tmp/agent-crypto-406420
          mkdir -p /tmp/agent-crypto-406420/administrator
          mkdir -p /tmp/agent-crypto-406420/coordination
          cp public/agent_crypto_erith_ia/administrator/app.js /tmp/agent-crypto-406420/administrator/
          cp public/agent_crypto_erith_ia/administrator/index.html /tmp/agent-crypto-406420/administrator/
          cp public/agent_crypto_erith_ia/administrator/index-40.6.420.html /tmp/agent-crypto-406420/administrator/
          cp public/agent_crypto_erith_ia/administrator/build.json /tmp/agent-crypto-406420/administrator/
          cp public/agent_crypto_erith_ia/administrator/RELEASE.md /tmp/agent-crypto-406420/administrator/
          cp public/agent_crypto_erith_ia/administrator/HANDOFF.md /tmp/agent-crypto-406420/administrator/
          cp coordination/inter_ai_dialogues/agent_crypto/HANDOFF_40.6.420_NEWS_SEMANTIC_TRUTH.md /tmp/agent-crypto-406420/coordination/
          cp coordination/inter_ai_dialogues/agent_crypto/PROMPT_REPRISE_SEVEN_AGENT_CRYPTO_40.6.420.md /tmp/agent-crypto-406420/coordination/
          cp coordination/inter_ai_dialogues/agent_crypto/PACKAGE_MANIFEST_40.6.420.txt /tmp/agent-crypto-406420/PATCH_MANIFEST.txt
          (
            cd /tmp/agent-crypto-406420
            zip -9 -r "$GITHUB_WORKSPACE/$ZIP" .
          )
          unzip -t "$ZIP"
          unzip -l "$ZIP"

      - name: Commit package
        shell: bash
        run: |
          set -euo pipefail
          ZIP="public/agent_crypto_erith_ia/administrator/AGENT_CRYPTO_NEWS_SEMANTIC_TRUTH_40.6.420.zip"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$ZIP"
          if git diff --cached --quiet; then
            echo "Package already current."
            exit 0
          fi
          git commit -m "chore(package): add clean Agent-Crypto 40.6.420 ZIP"
          git push origin HEAD:main
