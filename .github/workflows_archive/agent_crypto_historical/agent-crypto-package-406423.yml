name: Agent-Crypto Package 40.6.423

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/agent-crypto-package-406423.yml'

permissions:
  contents: write

jobs:
  validate-and-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate Aether phase / visibility truth
        shell: bash
        run: |
          set -euo pipefail
          node --check public/agent_crypto_erith_ia/administrator/js/aether.js
          python - <<'PY'
          import json
          from pathlib import Path
          js=Path("public/agent_crypto_erith_ia/administrator/js/aether.js").read_text(encoding="utf-8")
          css=Path("public/agent_crypto_erith_ia/administrator/admin-ribbons.css").read_text(encoding="utf-8")
          index=Path("public/agent_crypto_erith_ia/administrator/index.html").read_text(encoding="utf-8")
          build=json.loads(Path("public/agent_crypto_erith_ia/administrator/build.json").read_text(encoding="utf-8"))
          checks={
              "build": build.get("build")=="40.6.423",
              "release": build.get("release")=="AETHER PHASE / VISIBILITY TRUTH",
              "market_core_protected": build.get("market_core_modified") is False,
              "top12": 'const AETHER_VEILLE_TOP=12;' in js,
              "render_log": "batchRenderLog" in js,
              "visible_log": "batchVisibleLog" in js,
              "read_log": "batchReadCompleteLog" in js,
              "honest_duplicates": "visible-visibleUnique" in js,
              "complete_reads": "batchKeys.every(key=>key&&readingCompleteSet.has(key))" in js,
              "pause_ids": "#btnLivecheck" in css and "#sourceTimeCard" in css and 'data-aether-cadence-paused="1"' in css,
              "native_wrap_overlap": "99.920%,100%" in css,
              "veille_starts_before_45s_pulse": "16.550%,96.820%" in css,
              "system_overlap": "96.550%,100%" in css,
              "no_new_interval": "setInterval(" not in js,
              "no_observer": "MutationObserver" not in js,
              "index": "Build 40.6.423" in index,
          }
          bad=[k for k,v in checks.items() if not v]
          if bad: raise SystemExit(f"Aether 40.6.423 validation failed: {bad}")
          print("AETHER PHASE / VISIBILITY TRUTH 40.6.423 STATIC PASS")
          PY

      - name: Build clean ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP="public/agent_crypto_erith_ia/administrator/AGENT_CRYPTO_AETHER_PHASE_VISIBILITY_TRUTH_40.6.423.zip"
          rm -f "$ZIP"
          rm -rf /tmp/agent-crypto-406423
          mkdir -p /tmp/agent-crypto-406423/administrator/js /tmp/agent-crypto-406423/coordination
          cp public/agent_crypto_erith_ia/administrator/index.html /tmp/agent-crypto-406423/administrator/
          cp public/agent_crypto_erith_ia/administrator/index-40.6.423.html /tmp/agent-crypto-406423/administrator/
          cp public/agent_crypto_erith_ia/administrator/build.json /tmp/agent-crypto-406423/administrator/
          cp public/agent_crypto_erith_ia/administrator/RELEASE.md /tmp/agent-crypto-406423/administrator/
          cp public/agent_crypto_erith_ia/administrator/HANDOFF.md /tmp/agent-crypto-406423/administrator/
          cp public/agent_crypto_erith_ia/administrator/admin-ribbons.css /tmp/agent-crypto-406423/administrator/
          cp public/agent_crypto_erith_ia/administrator/js/aether.js /tmp/agent-crypto-406423/administrator/js/
          cp coordination/inter_ai_dialogues/agent_crypto/HANDOFF_40.6.423_AETHER_PHASE_VISIBILITY_TRUTH.md /tmp/agent-crypto-406423/coordination/
          cp coordination/inter_ai_dialogues/agent_crypto/PROMPT_REPRISE_SEVEN_AGENT_CRYPTO_40.6.423.md /tmp/agent-crypto-406423/coordination/
          cp coordination/inter_ai_dialogues/agent_crypto/PACKAGE_MANIFEST_40.6.423.txt /tmp/agent-crypto-406423/PATCH_MANIFEST.txt
          (cd /tmp/agent-crypto-406423 && zip -9 -r "$GITHUB_WORKSPACE/$ZIP" .)
          unzip -t "$ZIP"
          unzip -l "$ZIP"

      - name: Commit package
        shell: bash
        run: |
          set -euo pipefail
          ZIP="public/agent_crypto_erith_ia/administrator/AGENT_CRYPTO_AETHER_PHASE_VISIBILITY_TRUTH_40.6.423.zip"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$ZIP"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore(package): add clean Agent-Crypto 40.6.423 ZIP"
          git pull --rebase origin main
          git push origin HEAD:main
