name: Agent-Crypto 40.4.131 guarded patch

on:
  push:
    branches: [main]
    paths:
      - coordination/inter_ai_dialogues/agent_crypto/patches/40.4.131.request.json

permissions:
  contents: write

concurrency:
  group: agent-crypto-40-4-131-guarded-patch
  cancel-in-progress: false

jobs:
  deploy:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout canonical main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply and validate 40.4.131
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('coordination/inter_ai_dialogues/agent_crypto/patches/40.4.131.py')
          s=p.read_text(encoding='utf-8')
          old='        if str((d.get("engine") or {}).get("reference_build")) != "38.15.11":\n            raise SystemExit("STOP: Market Core modifié")'
          new='        engine = d.get("engine") or {}\n        if engine and str(engine.get("reference_build")) != "38.15.11":\n            raise SystemExit("STOP: Market Core modifié")\n        if fn == "administrator-version.json" and (d.get("protected_base") or {}).get("market_core_modified") is not False:\n            raise SystemExit("STOP: protection Market Core absente du miroir Administrator")'
          if s.count(old) != 1:
              raise SystemExit(f'STOP: engine guard attendu 1 occurrence, trouvé {s.count(old)}')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          python coordination/inter_ai_dialogues/agent_crypto/patches/40.4.131.py

      - name: Commit validated 40.4.131 atomically
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Aether Release"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix Agent-Crypto 40.4.131 extend News reading flow and preserve auth truth panel"
          git pull --rebase origin main
          git push origin HEAD:main
