name: Agent-Crypto 40.6.22 Local First Salon
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/agent-crypto-40622-local-salon.yml
permissions:
  contents: write
concurrency:
  group: agent-crypto-40622-local-salon
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout canonical main
        uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - name: Apply bounded local salon
        run: python .github/scripts/agent_crypto_40622_local_salon.py
      - name: Anti-destruction gates
        shell: bash
        run: |
          set -euo pipefail
          ROOT=public/agent_crypto_erith_ia/administrator
          python -m json.tool "$ROOT/build.json" >/dev/null
          python -m json.tool "$ROOT/administrator-version.json" >/dev/null
          python -m json.tool "$ROOT/version.json" >/dev/null
          node --check "$ROOT/js/salon-partage-406022.js"
          git diff --check
          for f in "$ROOT/admin-chronos.css" "$ROOT/js/version-truth.js" "$ROOT/oracle-presentation-405010.css" "$ROOT/oracle-fx-406013.css" "$ROOT/js/oracle-fx-406013.js" "$ROOT/js/app.js" "$ROOT/app.js" "$ROOT/js/core/admin-window-manager.js" "$ROOT/parallel-markets.css" "$ROOT/market-reading-depth.css" "$ROOT/js/aerith10-workspace-bridge-406021.js" "$ROOT/aerith10-creator-406020.css"; do git diff --exit-code -- "$f"; done
          grep -q 'id="salon-partage"' "$ROOT/views/atlas.html"
          grep -q 'id="salon-partage"' "$ROOT/js/views/atlas-presentation.js"
          test "$(grep -c 'id="salon-partage"' "$ROOT/views/atlas.html")" = 1
          test "$(grep -c 'id="salon-partage"' "$ROOT/js/views/atlas-presentation.js")" = 1
          grep -q 'THIS_FIREFOX_ONLY' "$ROOT/js/salon-partage-406022.js"
          grep -q 'id="aerith10CreatorEmbedded"' "$ROOT/views/atlas.html"
          grep -q 'id="forgeAerithEmbedded"' "$ROOT/views/atlas.html"
          python - <<'PY'
          import subprocess
          expected={'public/agent_crypto_erith_ia/administrator/index.html','public/agent_crypto_erith_ia/administrator/views/atlas.html','public/agent_crypto_erith_ia/administrator/js/views/atlas-presentation.js','public/agent_crypto_erith_ia/administrator/salon-partage-406022.css','public/agent_crypto_erith_ia/administrator/js/salon-partage-406022.js','public/agent_crypto_erith_ia/administrator/build.json','public/agent_crypto_erith_ia/administrator/administrator-version.json','public/agent_crypto_erith_ia/administrator/version.json','public/agent_crypto_erith_ia/administrator/RELEASE_40_6_22.md','coordination/inter_ai_dialogues/agent_crypto/AGENT_CRYPTO_BUILD_40_6_22_LOCAL_FIRST_SALON_CLEAN_UPLOAD_9_FILES.zip','coordination/inter_ai_dialogues/agent_crypto/AGENT_CRYPTO_BUILD_40_6_22_LOCAL_FIRST_SALON_CLEAN_UPLOAD_9_FILES.zip.sha256'}
          s=subprocess.check_output(['git','status','--porcelain=v1','--untracked-files=all'],text=True);changed=set()
          for line in s.splitlines():
            if not line.strip():continue
            p=line[3:]
            if ' -> ' in p:p=p.split(' -> ',1)[1]
            changed.add(p)
          if changed-expected:raise SystemExit(f'STOP 40.6.22 extra {sorted(changed-expected)}')
          if expected-changed:raise SystemExit(f'STOP 40.6.22 missing {sorted(expected-changed)}')
          print('40.6.22 bounded diff OK')
          PY
      - name: Commit released build
        shell: bash
        run: |
          set -euo pipefail
          ROOT=public/agent_crypto_erith_ia/administrator
          git config user.name "Seven Release Bot";git config user.email "actions@users.noreply.github.com"
          git add "$ROOT/index.html" "$ROOT/views/atlas.html" "$ROOT/js/views/atlas-presentation.js" "$ROOT/salon-partage-406022.css" "$ROOT/js/salon-partage-406022.js" "$ROOT/build.json" "$ROOT/administrator-version.json" "$ROOT/version.json" "$ROOT/RELEASE_40_6_22.md"
          git add coordination/inter_ai_dialogues/agent_crypto/AGENT_CRYPTO_BUILD_40_6_22_LOCAL_FIRST_SALON_CLEAN_UPLOAD_9_FILES.zip*
          git commit -m "feat(agent-crypto): add local-first sharing salon 40.6.22"
          git pull --rebase origin main
          git push origin HEAD:main
