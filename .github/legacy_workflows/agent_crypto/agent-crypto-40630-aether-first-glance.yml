name: Agent-Crypto 40.6.30 Aether First Glance

on:
  push:
    paths:
      - '.github/workflows/agent-crypto-40630-aether-first-glance.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout canonical main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply guarded 40.6.30 release
        run: python3 .github/scripts/agent_crypto_40630_release.py

      - name: Syntax and anti-destruction gates
        shell: bash
        run: |
          set -euo pipefail
          ROOT=public/agent_crypto_erith_ia/administrator
          ZIP=coordination/inter_ai_dialogues/agent_crypto/AGENT_CRYPTO_BUILD_40_6_30_AETHER_FIRST_GLANCE_LARGE_TEXT_WEATHER_SINGLE_DETAIL_ZONE_CLEAN_UPLOAD_7_FILES.zip
          SHA="$ZIP.sha256"
          node --check "$ROOT/js/aether.js"
          python3 -m json.tool "$ROOT/build.json" >/dev/null
          python3 -m json.tool "$ROOT/administrator-version.json" >/dev/null
          python3 -m json.tool "$ROOT/version.json" >/dev/null
          grep -q '<meta name="administrator-build" content="40.6.30"' "$ROOT/index.html"
          grep -q 'aether.js?v=administrator-build-40.6.30' "$ROOT/index.html"
          grep -q 'admin-ribbons.css?v=administrator-build-40.6.30' "$ROOT/index.html"
          grep -q 'aether_attention_first_glance_build:"40.6.30"' "$ROOT/js/aether.js"
          grep -q 'aetherWeatherFirstGlance406030' "$ROOT/js/aether.js"
          grep -q 'aetherPanelFocus406030' "$ROOT/js/aether.js"
          grep -q 'data-aether-focus-view-406030="glance"' "$ROOT/js/aether.js"
          grep -q 'data-aether-focus-view-406030="history"' "$ROOT/js/aether.js"
          grep -q 'data-aether-focus-view-406030="details"' "$ROOT/js/aether.js"
          grep -q '40.6.30 — AETHER WATCH · FIRST GLANCE' "$ROOT/admin-ribbons.css"
          grep -q "Version : Parker Lewis Can't Lose" "$ROOT/js/footer-version-truth-406026.js"
          grep -q "Version : Parker Lewis Can't Lose" "$ROOT/index.html"
          grep -q '"engine": "38.15.11"' "$ROOT/build.json"
          test -f "$ZIP"
          test -f "$SHA"
          (cd "$(dirname "$ZIP")" && sha256sum -c "$(basename "$SHA")")
          python3 - <<'PY'
          from zipfile import ZipFile
          p='coordination/inter_ai_dialogues/agent_crypto/AGENT_CRYPTO_BUILD_40_6_30_AETHER_FIRST_GLANCE_LARGE_TEXT_WEATHER_SINGLE_DETAIL_ZONE_CLEAN_UPLOAD_7_FILES.zip'
          with ZipFile(p) as z:
              names=z.namelist()
              assert len(names)==7, names
              assert 'administrator/index.html' in names
              assert 'administrator/js/aether.js' in names
              assert 'administrator/admin-ribbons.css' in names
              assert 'administrator/RELEASE_40_6_30.md' in names
              assert z.testzip() is None
          print('ZIP 7 files PASS')
          PY

      - name: Commit released build and clean ZIP
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Seven Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/agent_crypto_erith_ia/administrator \
                  coordination/inter_ai_dialogues/agent_crypto/AGENT_CRYPTO_BUILD_40_6_30_AETHER_FIRST_GLANCE_LARGE_TEXT_WEATHER_SINGLE_DETAIL_ZONE_CLEAN_UPLOAD_7_FILES.zip \
                  coordination/inter_ai_dialogues/agent_crypto/AGENT_CRYPTO_BUILD_40_6_30_AETHER_FIRST_GLANCE_LARGE_TEXT_WEATHER_SINGLE_DETAIL_ZONE_CLEAN_UPLOAD_7_FILES.zip.sha256
          if git diff --cached --quiet; then
            echo 'No runtime changes to commit'
            exit 1
          fi
          git commit -m "feat(agent-crypto): Aether first-glance watch 40.6.30"
          git push origin HEAD:main

      - name: Upload clean ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: AGENT_CRYPTO_BUILD_40_6_30_AETHER_FIRST_GLANCE_LARGE_TEXT_WEATHER_SINGLE_DETAIL_ZONE_CLEAN_UPLOAD_7_FILES
          path: coordination/inter_ai_dialogues/agent_crypto/AGENT_CRYPTO_BUILD_40_6_30_AETHER_FIRST_GLANCE_LARGE_TEXT_WEATHER_SINGLE_DETAIL_ZONE_CLEAN_UPLOAD_7_FILES.zip
          if-no-files-found: error
          compression-level: 0
