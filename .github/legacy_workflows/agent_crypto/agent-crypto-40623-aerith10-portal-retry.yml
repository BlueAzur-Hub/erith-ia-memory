name: Agent-Crypto 40.6.23 Aerith-10 Portal Fallback Retry

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/agent-crypto-40623-aerith10-portal-retry.yml

permissions:
  contents: write

concurrency:
  group: agent-crypto-40623-aerith10-portal-retry
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout canonical main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply corrected bounded Creator portal surgery
        run: python .github/scripts/agent_crypto_40623_aerith10_portal_retry.py

      - name: Anti-destruction gates
        shell: bash
        run: |
          set -euo pipefail
          ROOT=public/agent_crypto_erith_ia/administrator
          python -m json.tool "$ROOT/build.json" >/dev/null
          python -m json.tool "$ROOT/administrator-version.json" >/dev/null
          python -m json.tool "$ROOT/version.json" >/dev/null
          git diff --check

          git diff --exit-code -- \
            "$ROOT/admin-chronos.css" \
            "$ROOT/js/version-truth.js" \
            "$ROOT/oracle-presentation-405010.css" \
            "$ROOT/oracle-fx-406013.css" \
            "$ROOT/js/oracle-fx-406013.js" \
            "$ROOT/parallel-markets.css" \
            "$ROOT/market-reading-depth.css" \
            "$ROOT/js/core/admin-window-manager.js" \
            "$ROOT/js/strategy-a-paper-lifecycle-404295.js" \
            "$ROOT/js/app.js" \
            "$ROOT/js/aerith10-workspace-bridge-406021.js" \
            "$ROOT/salon-partage-406022.css" \
            "$ROOT/js/salon-partage-406022.js"

          grep -q 'data-aerith10-portal="40.6.23"' "$ROOT/views/atlas.html"
          grep -q 'data-aerith10-portal="40.6.23"' "$ROOT/js/views/atlas-presentation.js"
          ! grep -q 'id="aerith10CreatorEmbedded"' "$ROOT/views/atlas.html"
          ! grep -q 'id="aerith10CreatorEmbedded"' "$ROOT/js/views/atlas-presentation.js"
          grep -q 'sustaining-boar-5c6.notion.site/erith-10-Cr-atrice-3977754fe0848036a47cfd55786b4b40' "$ROOT/views/atlas.html"
          grep -q 'id="aerith10WorkspaceBridge"' "$ROOT/views/atlas.html"
          grep -q 'id="forge-aerith"' "$ROOT/views/atlas.html"
          grep -q '"build": "40.6.23"' "$ROOT/build.json"
          grep -q '"engine": "38.15.11"' "$ROOT/build.json"

          python - <<'PY'
          import subprocess
          allowed={
            'public/agent_crypto_erith_ia/administrator/index.html',
            'public/agent_crypto_erith_ia/administrator/views/atlas.html',
            'public/agent_crypto_erith_ia/administrator/js/views/atlas-presentation.js',
            'public/agent_crypto_erith_ia/administrator/aerith10-portal-406023.css',
            'public/agent_crypto_erith_ia/administrator/build.json',
            'public/agent_crypto_erith_ia/administrator/administrator-version.json',
            'public/agent_crypto_erith_ia/administrator/version.json',
            'public/agent_crypto_erith_ia/administrator/RELEASE_40_6_23.md',
            'coordination/inter_ai_dialogues/agent_crypto/AGENT_CRYPTO_BUILD_40_6_23_AERITH10_PORTAL_FALLBACK_CLEAN_UPLOAD_8_FILES.zip',
            'coordination/inter_ai_dialogues/agent_crypto/AGENT_CRYPTO_BUILD_40_6_23_AERITH10_PORTAL_FALLBACK_CLEAN_UPLOAD_8_FILES.zip.sha256',
          }
          out=subprocess.check_output(['git','status','--porcelain=v1','--untracked-files=all'],text=True)
          changed=set()
          for line in out.splitlines():
            if not line.strip(): continue
            p=line[3:]
            if ' -> ' in p:p=p.split(' -> ',1)[1]
            changed.add(p)
          extra=changed-allowed; missing=allowed-changed
          if extra: raise SystemExit(f'STOP 40.6.23 unexpected files: {sorted(extra)}')
          if missing: raise SystemExit(f'STOP 40.6.23 missing files: {sorted(missing)}')
          print('40.6.23 bounded diff OK')
          PY

      - name: Commit released build
        shell: bash
        run: |
          set -euo pipefail
          ROOT=public/agent_crypto_erith_ia/administrator
          git config user.name "Seven Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add "$ROOT/index.html" "$ROOT/views/atlas.html" "$ROOT/js/views/atlas-presentation.js" "$ROOT/aerith10-portal-406023.css" "$ROOT/build.json" "$ROOT/administrator-version.json" "$ROOT/version.json" "$ROOT/RELEASE_40_6_23.md"
          git add coordination/inter_ai_dialogues/agent_crypto/AGENT_CRYPTO_BUILD_40_6_23_AERITH10_PORTAL_FALLBACK_CLEAN_UPLOAD_8_FILES.zip
          git add coordination/inter_ai_dialogues/agent_crypto/AGENT_CRYPTO_BUILD_40_6_23_AERITH10_PORTAL_FALLBACK_CLEAN_UPLOAD_8_FILES.zip.sha256
          git diff --cached --quiet && { echo 'STOP 40.6.23: no changes'; exit 1; }
          git commit -m "fix(agent-crypto): replace blocked Notion iframe with Creator portal 40.6.23"
          git pull --rebase origin main
          git push origin HEAD:main
