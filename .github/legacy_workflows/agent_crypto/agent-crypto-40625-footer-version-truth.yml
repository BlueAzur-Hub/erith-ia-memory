name: Agent-Crypto 40.6.25 Footer Version Truth Cleanup

on:
  push:
    paths:
      - '.github/workflows/agent-crypto-40625-footer-version-truth.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout canonical main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply bounded footer truth cleanup
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, hashlib, datetime

          root = Path('public/agent_crypto_erith_ia/administrator')
          index = root/'index.html'
          app = root/'js/app.js'
          classic_manifest_path = Path('public/agent_crypto_erith_ia/web/version.json')

          def sha(path): return hashlib.sha256(path.read_bytes()).hexdigest()
          def replace_once(text, old, new, label):
              if old not in text: raise AssertionError(f'{label} not found')
              return text.replace(old, new, 1)

          protected = [
              root/'admin-chronos.css', root/'js/version-truth.js',
              root/'oracle-presentation-405010.css', root/'oracle-fx-406013.css',
              root/'js/oracle-fx-406013.js', root/'js/core/admin-window-manager.js',
              root/'views/atlas.html'
          ]
          before = {str(p): sha(p) for p in protected}

          classic = json.loads(classic_manifest_path.read_text(encoding='utf-8'))
          classic_build = str(classic.get('build') or '').strip()
          classic_engine = str((classic.get('engine') or {}).get('reference_build') or '').strip()
          assert classic_build == '38.15.16', classic_build
          assert classic_engine == '38.15.11', classic_engine

          html = index.read_text(encoding='utf-8')
          html = replace_once(html, '<meta name="atlas-build" content="40.6.24" />', '<meta name="atlas-build" content="40.6.25" />', 'atlas build meta')
          html = replace_once(html, '<meta name="administrator-build" content="40.6.24" />', '<meta name="administrator-build" content="40.6.25" />', 'administrator build meta')
          html = replace_once(html, '<meta name="administrator-release" content="INTERNET RESEARCH PANEL · EXTERNAL SEARCH · SOURCE BOUNDARY LOCK" />', '<meta name="administrator-release" content="FOOTER VERSION TRUTH CLEANUP · CANONICAL OWNERS LOCK" />', 'administrator release meta')
          html = replace_once(html, '<meta name="atlas-asset-token" content="market-core-v2.0-alpha-build-40.6.24" />', '<meta name="atlas-asset-token" content="market-core-v2.0-alpha-build-40.6.25" />', 'asset token')
          html = replace_once(html, '<title>Agent-Crypto @erith.IA — Build 40.6.24 · Administrator</title>', '<title>Agent-Crypto @erith.IA — Build 40.6.25 · Administrator</title>', 'title')
          html = replace_once(html, './js/app.js?v=administrator-build-40.5.23', './js/app.js?v=administrator-build-40.6.25', 'app cache token')
          html = replace_once(html, 'Agent-Crypto @erith.IA · Market Core · Build 40.6.4 · Chronos True Center + Version Safe Refresh', 'Agent-Crypto @erith.IA · Administrator 40.6.25 · Market Core 38.15.11 · Web Classic · manifeste', 'footer fallback')
          app_tag = '<script src="./js/app.js?v=administrator-build-40.6.25"></script>'
          truth_tag = '<script src="./js/footer-version-truth-406025.js?v=administrator-build-40.6.25"></script>'
          if truth_tag not in html:
              html = replace_once(html, app_tag, app_tag+'\n  '+truth_tag, 'footer truth script host')
          index.write_text(html, encoding='utf-8')

          js = app.read_text(encoding='utf-8')
          js = replace_once(js,
              '  const ADMIN_BUILD = "40.4.295";\n  const ADMIN_RELEASE = "STRATEGY A FOUNDATION INTEGRITY CORRECTIVE LOCK";\n  const ENGINE_BUILD = "38.15.11";\n  const CLASSIC_WEB_BUILD = "38.15.13";',
              '  const metaTruth406025 = name => document.querySelector(`meta[name="${name}"]`)?.content?.trim() || "";\n  const ADMIN_BUILD = metaTruth406025("administrator-build") || "UNKNOWN";\n  const ADMIN_RELEASE = metaTruth406025("administrator-release") || "UNKNOWN";\n  const ENGINE_BUILD = metaTruth406025("atlas-engine-build") || "UNKNOWN";',
              'legacy app version constants')
          js = replace_once(js,
              'if (footer) footer.textContent = `Agent-Crypto @erith.IA · Market Core · Build ${ADMIN_BUILD} · Version : Parker Lewis Can\'t Lose`;',
              'if (footer) footer.textContent = `Agent-Crypto @erith.IA · Administrator ${ADMIN_BUILD} · Market Core ${ENGINE_BUILD} · Web Classic · manifeste`;',
              'legacy footer writer')
          js = replace_once(js,
              '    const classic = document.createElement("a");\n    classic.href = "../web/index.html";\n    classic.textContent = `CLASSIC ${CLASSIC_WEB_BUILD}`;\n    classic.title = `Ouvrir la Web Classique ${CLASSIC_WEB_BUILD} · Engine ${ENGINE_BUILD}`;',
              '    const classic = document.createElement("a");\n    classic.id = "atlasClassicVersionTruth406025";\n    classic.href = "../web/index.html";\n    classic.textContent = "CLASSIC · manifeste";\n    classic.title = `Ouvrir la Web Classique · Engine ${ENGINE_BUILD}`;\n    classic.dataset.versionTruth = "pending";',
              'legacy Classic dock writer')
          app.write_text(js, encoding='utf-8')

          (root/'js/footer-version-truth-406025.js').write_text(r'''(() => {
            "use strict";
            const BUILD = "40.6.25";
            const MANIFEST = "../web/version.json";
            const meta = name => document.querySelector(`meta[name="${name}"]`)?.content?.trim() || "UNKNOWN";
            async function render(){
              const admin = meta("administrator-build");
              const engine = meta("atlas-engine-build");
              const footer = document.getElementById("footerRelease");
              const classic = document.getElementById("atlasClassicVersionTruth406025");
              if (footer) footer.textContent = `Agent-Crypto @erith.IA · Administrator ${admin} · Market Core ${engine} · Web Classic · vérification…`;
              try {
                const response = await fetch(MANIFEST,{cache:"no-store"});
                if(!response.ok) throw new Error(`HTTP ${response.status}`);
                const manifest = await response.json();
                const webBuild = String(manifest?.build || "").trim();
                const webEngine = String(manifest?.engine?.reference_build || "").trim() || engine;
                if(!webBuild) throw new Error("classic build absent");
                if(classic){
                  classic.textContent = `CLASSIC ${webBuild}`;
                  classic.title = `Ouvrir la Web Classique ${webBuild} · Engine ${webEngine}`;
                  classic.dataset.versionTruth = "manifest";
                }
                if(footer) footer.textContent = `Agent-Crypto @erith.IA · Administrator ${admin} · Market Core ${engine} · Web Classic ${webBuild}`;
                globalThis.__AGENT_CRYPTO_FOOTER_VERSION_TRUTH_406025__ = Object.freeze({build:BUILD,administrator_build:admin,market_core:engine,classic_build:webBuild,classic_engine:webEngine,classic_source:MANIFEST,one_shot_fetch:true,recurring_timer:false,observer:false,storage_write:false});
              } catch(error) {
                if(classic){ classic.textContent="CLASSIC · version inconnue"; classic.dataset.versionTruth="unknown"; }
                if(footer) footer.textContent = `Agent-Crypto @erith.IA · Administrator ${admin} · Market Core ${engine} · Web Classic · version inconnue`;
                globalThis.__AGENT_CRYPTO_FOOTER_VERSION_TRUTH_406025__ = Object.freeze({build:BUILD,administrator_build:admin,market_core:engine,classic_build:null,classic_source:MANIFEST,error:String(error?.message||error||"unknown"),one_shot_fetch:true,recurring_timer:false,observer:false,storage_write:false});
              }
            }
            if(document.readyState==="loading") document.addEventListener("DOMContentLoaded",render,{once:true}); else render();
          })();
          ''', encoding='utf-8')

          now = datetime.datetime.now(datetime.timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z')
          release = 'FOOTER VERSION TRUTH CLEANUP · CANONICAL OWNERS LOCK'
          status = 'footer_version_truth_cleanup_canonical_owners_lock_406025'
          cascade = {
              'parent_build':'40.6.24','release':release,
              'scope':'footer_and_global_dock_version_truth_only',
              'administrator_truth_source':'index.html meta administrator-build',
              'market_core_truth_source':'index.html meta atlas-engine-build',
              'classic_web_truth_source':'../web/version.json',
              'classic_web_build_at_release':classic_build,
              'classic_market_core_reference':classic_engine,
              'classic_manifest_fetch':'one-shot no-store',
              'legacy_admin_fixed_constant_removed':True,
              'legacy_classic_fixed_constant_removed':True,
              'legacy_parker_lewis_footer_removed':True,
              'market_core_modified':False,'web_classic_modified':False,'graph_modified':False,
              'oracle_modified':False,'technical_reading_modified':False,'chronos_modified':False,
              'version_truth_modified':False,'window_manager_modified':False,'strategy_a_modified':False,
              'new_recurring_timer':False,'new_observer':False,'new_storage_owner':False,
              'automatic_order':False,'real_order':False
          }
          manifests=[root/'build.json',root/'administrator-version.json',root/'version.json']
          for path in manifests:
              data=json.loads(path.read_text(encoding='utf-8'))
              data['build']='40.6.25'; data['release']=release; data['status']=status; data['parent_build']='40.6.24'
              if 'asset_token' in data: data['asset_token']='market-core-v2.0-alpha-build-40.6.25'
              if 'administrator_build' in data: data['administrator_build']='40.6.25'
              if 'build_label' in data: data['build_label']='Build 40.6.25'
              if 'release_status' in data: data['release_status']=release
              if 'timestamp' in data: data['timestamp']=now
              if 'prepared_at' in data: data['prepared_at']=now
              if 'published_at' in data: data['published_at']=now
              if isinstance(data.get('current_version_truth'),dict): data['current_version_truth']['loaded_build']='40.6.25'
              data['cascade_40_6_25']=cascade
              if path.name=='version.json' and isinstance(data.get('lineage'),str) and '40.6.25 footer version truth' not in data['lineage']:
                  data['lineage'] += ' → 40.6.25 footer version truth cleanup from canonical owners'
              path.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          (root/'RELEASE_40_6_25.md').write_text(f'''# Agent-Crypto 40.6.25 — Footer Version Truth Cleanup\n\nParent: `40.6.24`  \nMarket Core protected: `38.15.11`  \nWeb Classic manifest observed at release: `{classic_build}`\n\n## Scope\n- Administrator truth: `index.html` meta `administrator-build`.\n- Market Core truth: `index.html` meta `atlas-engine-build`.\n- Web Classic truth: `../web/version.json`, one-shot `no-store`.\n- Footer and bottom CLASSIC dock consume those owners.\n- Removed stale fixed runtime values `40.4.295`, `38.15.13`, and the obsolete Parker Lewis footer label.\n\n## Frozen\nOracle 40.6.13 + FX, Chronos, Version button, width 40.6.10, Graphique, Lecture Technique, Paper/Safety 40.6.14→40.6.19, Window Manager, Market Core 38.15.11.\n''',encoding='utf-8')

          after={str(p):sha(p) for p in protected}
          assert before==after,'protected file checksum changed'
          PY

      - name: Syntax and anti-destruction gates
        shell: bash
        run: |
          set -euo pipefail
          ROOT=public/agent_crypto_erith_ia/administrator
          node --check "$ROOT/js/app.js"
          node --check "$ROOT/js/footer-version-truth-406025.js"
          python3 -m json.tool "$ROOT/build.json" >/dev/null
          python3 -m json.tool "$ROOT/administrator-version.json" >/dev/null
          python3 -m json.tool "$ROOT/version.json" >/dev/null
          grep -q '<meta name="administrator-build" content="40.6.25"' "$ROOT/index.html"
          grep -q '<meta name="atlas-engine-build" content="38.15.11"' "$ROOT/index.html"
          grep -q 'footer-version-truth-406025.js?v=administrator-build-40.6.25' "$ROOT/index.html"
          grep -q 'metaTruth406025("administrator-build")' "$ROOT/js/app.js"
          grep -q 'atlasClassicVersionTruth406025' "$ROOT/js/app.js"
          ! grep -q 'const ADMIN_BUILD = "40.4.295"' "$ROOT/js/app.js"
          ! grep -q 'const CLASSIC_WEB_BUILD = "38.15.13"' "$ROOT/js/app.js"
          ! grep -q "Parker Lewis Can't Lose" "$ROOT/js/app.js"
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('public/agent_crypto_erith_ia/administrator')
          for name in ['build.json','administrator-version.json','version.json']:
              data=json.loads((root/name).read_text(encoding='utf-8'))
              assert data['build']=='40.6.25'
              c=data['cascade_40_6_25']
              assert c['market_core_modified'] is False and c['window_manager_modified'] is False
          classic=json.loads(Path('public/agent_crypto_erith_ia/web/version.json').read_text(encoding='utf-8'))
          assert classic['build']=='38.15.16'
          assert classic['engine']['reference_build']=='38.15.11'
          PY
          allowed='^(public/agent_crypto_erith_ia/administrator/(index.html|js/app.js|js/footer-version-truth-406025.js|build.json|administrator-version.json|version.json|RELEASE_40_6_25.md))$'
          bad=$(git diff --name-only | grep -Ev "$allowed" || true)
          if [ -n "$bad" ]; then echo "Unexpected modified files:"; echo "$bad"; exit 1; fi

      - name: Commit released build
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Seven Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/agent_crypto_erith_ia/administrator/index.html \
                  public/agent_crypto_erith_ia/administrator/js/app.js \
                  public/agent_crypto_erith_ia/administrator/js/footer-version-truth-406025.js \
                  public/agent_crypto_erith_ia/administrator/build.json \
                  public/agent_crypto_erith_ia/administrator/administrator-version.json \
                  public/agent_crypto_erith_ia/administrator/version.json \
                  public/agent_crypto_erith_ia/administrator/RELEASE_40_6_25.md
          git commit -m "fix(agent-crypto): clean footer version truth 40.6.25"
          git push origin HEAD:main
