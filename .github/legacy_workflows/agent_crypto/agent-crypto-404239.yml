name: Agent-Crypto 40.4.239 Technical Reading full-background restore

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/agent-crypto-404239.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore canonical Technical Reading full-background owner
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re

          base = Path('public/agent_crypto_erith_ia/administrator')
          version = json.loads((base/'version.json').read_text(encoding='utf-8'))
          assert version['build'] == '40.4.238', version['build']
          assert version['engine']['reference_build'] == '38.15.11'

          index_path = base/'index.html'
          text = index_path.read_text(encoding='utf-8')

          # 1) Retire the 40.4.238 letterbox workaround completely.
          proof_re = re.compile(r'\n\s*<style id="atlasTechnicalReadingBackdropRestore404238">.*?</style>\n', re.S)
          text, removed = proof_re.subn('\n', text, count=1)
          assert removed == 1, removed

          backdrop_runtime = '''\n    const backdropPanel=panel();\n    if(backdropPanel){\n      const backdropUrl=String(actual).replaceAll('"','%22');\n      backdropPanel.style.setProperty("--atlas-tech-backdrop-image",`url("${backdropUrl}")`);\n      backdropPanel.dataset.techBackdropSource=source||resolved.source||"resolved";\n    }'''
          assert backdrop_runtime in text
          text = text.replace(backdrop_runtime, '', 1)

          # 2) Restore the two canonical full-background cover owners that 40.4.237 changed to contain.
          def patch_block(anchor, old, new):
              nonlocal_text = None
              start = text.index(anchor)
              end = text.index('</style>', start)
              block = text[start:end]
              assert old in block, f'missing {old!r} in {anchor}'
              block = block.replace(old, new, 1)
              return text[:start] + block + text[end:]

          anchor_framing = '<style id="atlasTechnicalReadingFraming40218">'
          start = text.index(anchor_framing)
          end = text.index('</style>', start)
          block = text[start:end]
          assert 'object-fit:contain!important;' in block
          block = block.replace('object-fit:contain!important;', 'object-fit:cover!important;', 1)
          text = text[:start] + block + text[end:]

          anchor_renderer = '<style id="atlasTechnicalReadingCanonicalImageRenderer40265">'
          start = text.index(anchor_renderer)
          end = text.index('</style>', start)
          block = text[start:end]
          assert 'object-fit:contain!important;' in block
          block = block.replace('object-fit:contain!important;', 'object-fit:cover!important;', 1)
          text = text[:start] + block + text[end:]

          # 3) 40.2.30 backdrop remains dormant as historical code: no resolved URL handoff means no duplicate visual owner.
          assert 'backdropPanel.style.setProperty("--atlas-tech-backdrop-image"' not in text
          assert 'atlasTechnicalReadingBackdropRestore404238' not in text

          index_path.write_text(text, encoding='utf-8')

          contract = {
            'build': '40.4.239',
            'parent': '40.4.238',
            'technical_reading_only': True,
            'user_screenshot_contract': 'image_fills_complete_technical_reading_background',
            'canonical_foreground_fit': 'cover',
            'framing_40218_fit': 'cover',
            'renderer_40265_fit': 'cover',
            'object_position_variables_preserved': True,
            'letterbox_workaround_404238_retired': True,
            'resolved_backdrop_runtime_retired': True,
            'single_portrait_visual_owner': True,
            'rnd_library_changed': False,
            'rnd_assets_changed': False,
            'local_upload_changed': False,
            'private_image_storage_changed': False,
            'graph_changed': False,
            'parallel_markets_changed': False,
            'atlas_changed': False,
            'math_core_changed': False,
            'window_manager_changed': False,
            'market_core_changed': False,
            'protected_market_core': '38.15.11',
            'new_timer': False,
            'new_observer': False,
            'new_fetch': False,
            'new_websocket': False,
            'new_scheduler': False
          }
          Path('/tmp/contract-404239.json').write_text(json.dumps(contract, ensure_ascii=False, indent=2), encoding='utf-8')
          PY

      - name: Release identity 40.4.239
        run: |
          python .github/scripts/agent_crypto_release_driver.py \
            --build 40.4.239 \
            --parent 40.4.238 \
            --release "TECHNICAL READING · CANONICAL FULL-BACKGROUND COVER RESTORE LOCK" \
            --status "technical_reading_canonical_full_background_cover_404239" \
            --contract-key "technical_reading_canonical_full_background_cover_404239" \
            --contract-json /tmp/contract-404239.json \
            --lineage-note "40.4.239 Technical Reading canonical full-background cover restore; 40.4.237 contain and 40.4.238 letterbox workaround retired"

      - name: Technical Reading proof assertions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          base=Path('public/agent_crypto_erith_ia/administrator')
          index=(base/'index.html').read_text(encoding='utf-8')
          app=(base/'js/app.js').read_text(encoding='utf-8')
          version=json.loads((base/'version.json').read_text(encoding='utf-8'))
          assert version['build']=='40.4.239'
          assert version['parent_build']=='40.4.238'
          assert version['engine']['reference_build']=='38.15.11'
          for anchor in ('<style id="atlasTechnicalReadingFraming40218">','<style id="atlasTechnicalReadingCanonicalImageRenderer40265">'):
              start=index.index(anchor); end=index.index('</style>',start); block=index[start:end]
              assert 'object-fit:cover!important;' in block
              assert 'object-fit:contain!important;' not in block
          assert 'atlasTechnicalReadingBackdropRestore404238' not in index
          assert 'backdropPanel.style.setProperty("--atlas-tech-backdrop-image"' not in index
          assert 'object-position:var(--admin-tech-x,50%) var(--admin-tech-y,50%)!important;' in index
          assert 'const ADMIN_BUILD = "40.4.239";' in app
          assert 'const ENGINE_BUILD = "38.15.11";' in app
          PY
          python .github/scripts/agent_crypto_version_truth_guard.py \
            --expected-build 40.4.239 \
            --expected-release "TECHNICAL READING · CANONICAL FULL-BACKGROUND COVER RESTORE LOCK"

      - name: Scope guard
        shell: bash
        run: |
          python - <<'PY'
          import subprocess
          allowed={
            'public/agent_crypto_erith_ia/administrator/administrator-version.json',
            'public/agent_crypto_erith_ia/administrator/app.js',
            'public/agent_crypto_erith_ia/administrator/build.json',
            'public/agent_crypto_erith_ia/administrator/index.html',
            'public/agent_crypto_erith_ia/administrator/js/app.js',
            'public/agent_crypto_erith_ia/administrator/version.json',
          }
          changed=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          extra=changed-allowed
          missing=allowed-changed
          assert not extra, f'out-of-scope: {sorted(extra)}'
          assert not missing, f'missing expected identity files: {sorted(missing)}'
          print('scope ok:', *sorted(changed), sep='\n- ')
          PY

      - name: Commit release
        run: |
          git config user.name "Aether Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/agent_crypto_erith_ia/administrator
          git commit -m "agent-crypto: build 40.4.239 restore Technical Reading full-background cover"
          git push origin HEAD:main

      - name: Build differential package
        shell: bash
        run: |
          mkdir -p /tmp/pkg
          git diff --name-only HEAD^ HEAD | while read f; do
            mkdir -p "/tmp/pkg/$(dirname "$f")"
            cp "$f" "/tmp/pkg/$f"
          done
          cat > /tmp/pkg/FILES_CHANGED_40.4.239.md <<'EOF'
          # Agent-Crypto 40.4.239 — changed files

          Technical Reading only: restore the historically validated full-background portrait contract.

          - Foreground portrait returns to `object-fit: cover` in the two canonical owners changed by 40.4.237.
          - 40.4.238 same-asset letterbox workaround is retired.
          - Existing `--admin-tech-x/y` focal variables remain authoritative.
          - RND library, local upload/storage, Graph, Atlas, Math Core, Window Manager and Market Core are unchanged.
          EOF
          cd /tmp/pkg
          zip -qr /tmp/AGENT_CRYPTO_BUILD_40_4_239_TECHNICAL_READING_FULL_BACKGROUND_COVER_CHANGED_FILES.zip .
          sha256sum /tmp/AGENT_CRYPTO_BUILD_40_4_239_TECHNICAL_READING_FULL_BACKGROUND_COVER_CHANGED_FILES.zip

      - uses: actions/upload-artifact@v4
        with:
          name: AGENT_CRYPTO_BUILD_40_4_239_TECHNICAL_READING_FULL_BACKGROUND_COVER_CHANGED_FILES
          path: /tmp/AGENT_CRYPTO_BUILD_40_4_239_TECHNICAL_READING_FULL_BACKGROUND_COVER_CHANGED_FILES.zip
          if-no-files-found: error
