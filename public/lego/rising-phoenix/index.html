<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>ERROR 404</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #ffffff;
      color: #000000;
      font-family: Arial, Helvetica, sans-serif;
    }
    body {
      overflow: hidden;
    }
    main {
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2vw;
    }
    h1 {
      margin: 0;
      font-size: clamp(6rem, 18vw, 24rem);
      line-height: 0.82;
      font-weight: 1000;
      letter-spacing: -0.08em;
      white-space: nowrap;
    }
    @media (max-width: 700px) {
      h1 {
        font-size: clamp(4.2rem, 20vw, 10rem);
        white-space: normal;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>ERROR 404</h1>
  </main>
</body>
</html>
