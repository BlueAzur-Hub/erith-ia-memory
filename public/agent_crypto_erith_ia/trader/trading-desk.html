<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>ERITH.IA · Trading Desk — 40.6.625</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#071018}
    body{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    #traderInterfaceRuntime{display:block;width:100%;height:100%;border:0;background:#071018}
    #traderBootstrapStatus{position:fixed;left:12px;bottom:10px;z-index:3;padding:5px 9px;border:1px solid rgba(83,222,222,.28);border-radius:999px;background:rgba(4,15,24,.82);color:#91a8b7;font-size:11px;letter-spacing:.03em;pointer-events:none;opacity:.88}
    #traderBootstrapStatus[data-state="ready"]{opacity:0;transition:opacity .8s ease 1.2s}
    #traderBootstrapStatus[data-state="error"]{color:#ff9caa;border-color:rgba(255,92,120,.45);opacity:1}
  </style>
  <link rel="stylesheet" href="./ai-ct-panel.css">
</head>
<body>
  <iframe
    id="traderInterfaceRuntime"
    title="Agent-Crypto Trader — runtime Interface Administrator"
    src="../administrator/index.html?surface=trader"
    loading="eager"
    referrerpolicy="same-origin">
  </iframe>
  <div id="traderBootstrapStatus" role="status" aria-live="polite">Chargement du runtime Interface…</div>
  <button id="aiCtToggle" type="button" aria-haspopup="dialog" aria-expanded="false" aria-controls="aiCtPanel">IA · Concrete</button>
  <section id="aiCtPanel" role="dialog" aria-label="Passerelle IA, pilote Concrete" hidden>
    <header><h2>Passerelle IA · Concrete</h2><button class="ai-ct-close" type="button" id="aiCtClose" aria-label="Fermer">×</button></header>
    <p>Lecture privée sur ton PC · aucun ordre réel · marché CT/USDC.</p>
    <div class="ai-ct-actions"><button id="aiCtRead" type="button">Lire ma position CT</button><button id="aiCtCopy" type="button" disabled>Copier le résumé privé</button></div>
    <p id="aiCtStatus" role="status" aria-live="polite">Prêt · aucune consultation automatique.</p>
    <div id="aiCtDetails"></div>
  </section>
  <script src="./trader-runtime-mirror.js?feature=okx-private-read"></script>
</body>
</html>
