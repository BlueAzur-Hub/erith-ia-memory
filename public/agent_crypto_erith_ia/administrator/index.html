<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <meta name="agent-crypto-loaded-build" content="" />
  <meta name="agent-crypto-engine-build" content="38.15.11" />
  <meta name="agent-crypto-published-manifest" content="./build.json" />
  <title>Agent-Crypto Administrator — Initialisation</title>
  <style>
    html,body{margin:0;min-height:100%;background:#071018;color:#dbe7ef;font:14px/1.45 system-ui,sans-serif}
    #bootStatus{min-height:100vh;display:grid;place-items:center;padding:24px;box-sizing:border-box;text-align:center}
  </style>
</head>
<body>
  <main id="bootStatus" role="status" aria-live="polite">Initialisation Agent-Crypto…</main>
  <script>
  (() => {
    "use strict";
    const meta = name => String(document.querySelector(`meta[name="${name}"]`)?.content || "").trim();
    let LOADED_BUILD = meta("agent-crypto-loaded-build");
    const ENGINE = meta("agent-crypto-engine-build");
    const SHELL_URL = "./runtime-shell.html";
    const BUILD_RE = /^\d+\.\d+\.\d+$/;
    const MANIFEST_URL = meta("agent-crypto-published-manifest") || "./build.json";
    const STORAGE_QUOTA_MODULE = "./js/storage-quota-truth-406239.js";
    const COMMAND_CENTER_ROUTER_MODULE = "./js/command-center-routing-406240.js";
    const DECISION_INTELLIGENCE_CURRENT_TRUTH_MODULE = "./js/decision-intelligence-current-truth-406243.js";

    const EVIDENCE_MODULES = Object.freeze([
      "./js/strategy-a-evidence-lifecycle-truth.js",
      "./js/strategy-a-foundation-applicability-truth.js",
      "./js/strategy-a-foundation-delegated-certification-406221.js",
      "./js/strategy-a-time-semantics-truth.js",
      "./js/strategy-a-g3-structured-data-truth.js",
      "./js/strategy-a-g3-history-owner-discovery.js",
      "./js/strategy-a-g3-historical-evidence-adapter.js",
      "./js/strategy-a-g3-t0-decision-proof.js",
      "./js/strategy-a-g3-replay-dataset.js",
      "./js/strategy-a-g3-decision-replay.js",
      "./js/strategy-a-g3-cascade-checkpoint.js",
      "./js/strategy-a-gate-canonical-truth.js",
      "./js/strategy-a-evidence-dossier-supplement-integrator.js",
      "./js/strategy-a-g3-prospective-t0-capture.js",
      "./js/strategy-a-g3-overlap-live-refresh.js",
      "./js/strategy-a-g3-post-horizon-outcome.js",
      "./js/strategy-a-g3-post-horizon-mount-repair-406216.js",
      "./js/strategy-a-g3-outcome-certification-406222.js",
      "./js/strategy-a-g3-realistic-replay-readiness-406223.js",
      "./js/strategy-a-g3-forward-evidence-bridge-406224.js",
      "./js/strategy-a-g3-current-truth-surface-406225.js",
      "./js/strategy-a-g3-strict-decision-time-truth-406226.js",
      "./js/strategy-a-g3-strict-truth-mount-proof-406227.js",
      "./js/strategy-a-g3-strict-outcome-revalidation-406228.js",
      "./js/strategy-a-g3-strict-execution-realism-rebind-406229.js"
    ]);
    const PRESENTATION_MODULES = Object.freeze([
      "./js/administrator-operator-focus-406216.js"
    ]);

    const EVIDENCE_PANEL_IDS = Object.freeze([
      "strategyAG3StructuredTruth",
      "strategyAG3HistoryOwnerDiscovery",
      "strategyAG3HistoricalEvidenceAdapter",
      "strategyAG3T0DecisionProof",
      "strategyAG3ReplayDataset",
      "strategyAG3DecisionReplay",
      "strategyAG3CascadeCheckpoint"
    ]);

    async function canonicalIdentity() {
      const separator = MANIFEST_URL.includes("?") ? "&" : "?";
      const response = await fetch(`${MANIFEST_URL}${separator}t=${Date.now()}`, {cache:"no-store",credentials:"same-origin"});
      if (!response.ok) throw new Error(`build.json: HTTP ${response.status}`);
      const manifest = await response.json();
      const build = String(manifest?.build || "").trim();
      const engine = String(manifest?.engine || ENGINE || "").trim();
      if (!BUILD_RE.test(build)) throw new Error("published build invalide");
      if (!engine) throw new Error("Market Core absent du manifeste");
      LOADED_BUILD = build;
      return Object.freeze({build,loaded_build:build,engine,source:"canonical-build.json",canonical_evidence_wiring:manifest?.strategy_a_canonical_evidence_wiring?.enabled===true});
    }
    const statusNode=()=>document.getElementById("bootStatus");
    function fail(message){document.documentElement.dataset.agentCryptoBoot="failed";const node=statusNode();if(node){node.setAttribute("role","alert");node.textContent=`Agent-Crypto indisponible — ${message}`;}}
    function replaceMeta(html,name,value){const re=new RegExp(`<meta\\s+name=["']${name}["']\\s+content=["'][^"']*["']\\s*\\/?\\s*>`,"i");const tag=`<meta name="${name}" content="${String(value).replace(/"/g,"&quot;")}" />`;return re.test(html)?html.replace(re,tag):html.replace(/<head>/i,`<head>\n  ${tag}`);}
    function stampLocalAssets(html,build){const stamp=(prefix,url,suffix)=>{if(!/^\.\//.test(url))return `${prefix}${url}${suffix}`;if(!/\.(?:js|css)(?:$|\?)/i.test(url))return `${prefix}${url}${suffix}`;const clean=url.replace(/([?&])release=[^&"']*/i,"$1").replace(/[?&]$/,"");const join=clean.includes("?")?"&":"?";const chronos=/^\.\/admin-chronos\.css(?:[?#]|$)/i.test(clean)?"&chronos=canonical":"";return `${prefix}${clean}${join}release=${encodeURIComponent(build)}${chronos}${suffix}`;};return html.replace(/(\bsrc=["'])([^"']+)(["'])/gi,(_,a,u,q)=>stamp(a,u,q)).replace(/(\bhref=["'])([^"']+)(["'])/gi,(_,a,u,q)=>stamp(a,u,q));}
    function injectStorageQuotaTruth(html,truth){
      if(html.includes('data-agent-crypto-storage-quota-truth="'))return html;
      const tag=`<script src="${STORAGE_QUOTA_MODULE}" data-agent-crypto-storage-quota-truth="${truth.build}"><\/script>`;
      if(/<head>/i.test(html))return html.replace(/<head>/i,`<head>\n  ${tag}`);
      throw new Error("runtime-shell.html sans <head>");
    }
    function injectCommandCenterRouter(html,truth){
      if(html.includes('data-agent-crypto-command-center-router="'))return html;
      const tag=`<script defer src="${COMMAND_CENTER_ROUTER_MODULE}" data-agent-crypto-command-center-router="${truth.build}"><\/script>`;
      if(/<head>/i.test(html))return html.replace(/<head>/i,`<head>\n  ${tag}`);
      throw new Error("runtime-shell.html sans <head>");
    }
    function injectDecisionIntelligenceCurrentTruth(html,truth){
      if(html.includes('data-agent-crypto-decision-intelligence-current-truth="'))return html;
      const tag=`<script defer src="${DECISION_INTELLIGENCE_CURRENT_TRUTH_MODULE}" data-agent-crypto-decision-intelligence-current-truth="${truth.build}"><\/script>`;
      if(/<head>/i.test(html))return html.replace(/<head>/i,`<head>\n  ${tag}`);
      throw new Error("runtime-shell.html sans <head>");
    }
    function injectCanonicalEvidence(html,truth){
      if(!truth.canonical_evidence_wiring)return html;
      if(html.includes('data-agent-crypto-canonical-evidence-modules="'))return html;
      if(!/<\/body>/i.test(html))throw new Error("runtime-shell.html sans </body>");
      const build=truth.build;
      const moduleTags=EVIDENCE_MODULES.map(src=>`<script src="${src}" data-agent-crypto-canonical-evidence-modules="${build}"><\/script>`).join("\n");
      const presentationTags=PRESENTATION_MODULES.map(src=>`<script src="${src}" data-agent-crypto-admin-presentation-modules="${build}"><\/script>`).join("\n");
      const receipt=`<script data-agent-crypto-evidence-dossier-integrator-receipt="${build}">
      (()=>{
        "use strict";
        const mountEvidence=()=>{
          try{globalThis.AgentCryptoStrategyAEvidenceDossierSupplementIntegrator?.mount?.();}catch(_){}
          try{globalThis.AgentCryptoStrategyAFoundationDelegatedCertification?.run?.("canonical-window-load");}catch(_){}
          try{globalThis.AgentCryptoStrategyAG3CascadeCheckpoint?.render?.();}catch(_){}
          try{globalThis.AgentCryptoStrategyAG3ProspectiveT0Capture?.render?.();}catch(_){}
          try{globalThis.AgentCryptoStrategyAG3OverlapLiveRefresh?.refresh?.("canonical-mount");}catch(_){}
          try{globalThis.AgentCryptoStrategyAG3PostHorizonOutcome?.render?.();}catch(_){}
          try{globalThis.AgentCryptoStrategyAG3PostHorizonMountRepair?.mount?.("canonical-mount");}catch(_){}
          try{globalThis.AgentCryptoStrategyAG3OutcomeCertification?.render?.();}catch(_){}
          try{globalThis.AgentCryptoStrategyAG3RealisticReplayReadiness?.render?.();}catch(_){}
          try{globalThis.AgentCryptoStrategyAG3ForwardEvidenceBridge?.render?.();}catch(_){}
          try{globalThis.AgentCryptoStrategyAG3CurrentTruthSurface?.render?.("canonical-mount");}catch(_){}
          try{globalThis.AgentCryptoStrategyAG3StrictDecisionTimeTruth?.render?.("canonical-mount");}catch(_){}
          try{globalThis.AgentCryptoStrategyAG3StrictTruthMountProof?.mount?.("canonical-mount");}catch(_){}
          try{globalThis.AgentCryptoStrategyAG3StrictOutcomeRevalidation?.render?.("canonical-mount");}catch(_){}
          try{globalThis.AgentCryptoStrategyAG3StrictExecutionRealismRebind?.render?.("canonical-mount");}catch(_){}
          try{globalThis.AgentCryptoAdministratorOperatorFocus?.requestSettled?.("canonical-mount");}catch(_){}
        };
        globalThis.AgentCryptoCanonicalEvidenceWiring=Object.freeze({build:${JSON.stringify(build)},owner:"administrator/index.html",mode:"CANONICAL_ENTRY_DOSSIER_INTEGRATION",modules:${JSON.stringify(EVIDENCE_MODULES)},presentation_modules:${JSON.stringify(PRESENTATION_MODULES)},panels:${JSON.stringify(EVIDENCE_PANEL_IDS)},dossier_id:"strategyADossier",separate_host:false,g3:"PENDING",g9:"LOCKED",recurring_timer:false,observer:false,storage_write:true,storage_scope:"PROSPECTIVE_T0_EVIDENCE_PLUS_BOUNDED_FOUNDATION_SESSION_RECEIPT",business_network_request:false,real_order:false,paper_only:true,mount_timing:"WINDOW_LOAD_ONCE",snapshot:()=>({build:${JSON.stringify(build)},owner:"administrator/index.html",dossier_present:!!document.getElementById("strategyADossier"),integrator_available:typeof globalThis.AgentCryptoStrategyAEvidenceDossierSupplementIntegrator?.mount==="function",foundation_delegated_available:typeof globalThis.AgentCryptoStrategyAFoundationDelegatedCertification?.run==="function",prospective_t0_capture_available:typeof globalThis.AgentCryptoStrategyAG3ProspectiveT0Capture?.capture_once==="function",overlap_live_refresh_available:typeof globalThis.AgentCryptoStrategyAG3OverlapLiveRefresh?.refresh==="function",post_horizon_outcome_available:typeof globalThis.AgentCryptoStrategyAG3PostHorizonOutcome?.render==="function",post_horizon_mount_repair_available:typeof globalThis.AgentCryptoStrategyAG3PostHorizonMountRepair?.mount==="function",outcome_certification_available:typeof globalThis.AgentCryptoStrategyAG3OutcomeCertification?.render==="function",realistic_replay_readiness_available:typeof globalThis.AgentCryptoStrategyAG3RealisticReplayReadiness?.render==="function",g3_forward_bridge_available:typeof globalThis.AgentCryptoStrategyAG3ForwardEvidenceBridge?.render==="function",g3_current_truth_surface_available:typeof globalThis.AgentCryptoStrategyAG3CurrentTruthSurface?.render==="function",g3_strict_decision_time_truth_available:typeof globalThis.AgentCryptoStrategyAG3StrictDecisionTimeTruth?.render==="function",g3_strict_truth_mount_proof_available:typeof globalThis.AgentCryptoStrategyAG3StrictTruthMountProof?.mount==="function",g3_strict_outcome_revalidation_available:typeof globalThis.AgentCryptoStrategyAG3StrictOutcomeRevalidation?.render==="function",g3_strict_execution_realism_rebind_available:typeof globalThis.AgentCryptoStrategyAG3StrictExecutionRealismRebind?.render==="function",operator_focus_available:typeof globalThis.AgentCryptoAdministratorOperatorFocus?.refresh==="function",panels:${JSON.stringify(EVIDENCE_PANEL_IDS)}.map(id=>({id,present:!!document.getElementById(id),parent:document.getElementById(id)?.parentElement?.id||null})),g3:"PENDING",g9:"LOCKED"})});
        if(document.readyState==="complete") mountEvidence();
        else window.addEventListener("load",mountEvidence,{once:true});
      })();
      <\/script>`;
      return html.replace(/<\/body>/i,`${moduleTags}\n${presentationTags}\n${receipt}\n</body>`);
    }
    function patchShell(raw,truth){let out=String(raw||"");if(!/^\s*<!doctype html>/i.test(out))throw new Error("runtime-shell.html invalide");out=out.replace(/administrator-build-\d+\.\d+\.\d+/g,`administrator-build-${truth.build}`);out=out.replace(/market-core-v2\.0-alpha-build-\d+\.\d+\.\d+/g,`market-core-v2.0-alpha-build-${truth.build}`);out=replaceMeta(out,"administrator-build",truth.build);out=replaceMeta(out,"atlas-build",truth.build);out=replaceMeta(out,"atlas-engine-build",truth.engine);out=replaceMeta(out,"agent-crypto-boot-build",truth.build);out=replaceMeta(out,"agent-crypto-loaded-build",truth.build);out=replaceMeta(out,"agent-crypto-version-owner","canonical-entry");out=replaceMeta(out,"agent-crypto-published-manifest",MANIFEST_URL);out=out.replace(/<title>[\s\S]*?<\/title>/i,`<title>Agent-Crypto @erith.IA — Build ${truth.build} · Administrator</title>`);out=out.replace(/(<button\b[^>]*\bid=["']atlasVersionTruthControl["'][^>]*\baria-label=["'])[^"']*(["'])/i,`$1Version Agent-Crypto chargée : Build ${truth.build}, mode Administrator$2`);out=out.replace(/<span\s+id=["']atlasVersionTruthText["'][^>]*>[\s\S]*?<\/span>/i,`<span id="atlasVersionTruthText">Build ${truth.build} · Administrator</span>`);out=out.replace(/<span\s+id=["']footerRelease["'][^>]*>[\s\S]*?<\/span>/i,`<span id="footerRelease">Agent-Crypto @erith.IA · Market Core · Build ${truth.build} · Version : Parker Lewis Can't Lose</span>`);out=out.replace(/AGENT-CRYPTO\s+\d+\.\d+\.\d+\s+·\s+ADMINISTRATOR/gi,`AGENT-CRYPTO ${truth.build} · ADMINISTRATOR`);out=injectStorageQuotaTruth(out,truth);out=injectCommandCenterRouter(out,truth);out=injectDecisionIntelligenceCurrentTruth(out,truth);out=injectCanonicalEvidence(out,truth);return stampLocalAssets(out,truth.build);}
    async function fetchShell(){const response=await fetch(`${SHELL_URL}?release=${encodeURIComponent(LOADED_BUILD)}&t=${Date.now()}`,{cache:"no-store",credentials:"same-origin"});if(!response.ok)throw new Error(`runtime-shell.html: HTTP ${response.status}`);return response.text();}
    async function boot(){document.documentElement.dataset.agentCryptoBoot="loading";try{const truth=await canonicalIdentity();const shell=patchShell(await fetchShell(),truth);globalThis.AgentCryptoBootTruth=truth;globalThis.AGENT_CRYPTO_EMBEDDED_BUILD=truth.build;globalThis.AGENT_CRYPTO_EFFECTIVE_BUILD=truth.build;globalThis.AGENT_CRYPTO_BUILD=truth.build;globalThis.ATLAS_ENGINE_BUILD=truth.engine;document.documentElement.dataset.agentCryptoLoadedBuild=truth.build;document.documentElement.dataset.agentCryptoBoot="ready";document.open();document.write(shell);document.close();}catch(error){console.error("[Agent-Crypto boot]",error);fail(String(error?.message||error||"initialisation impossible"));}}
    void boot();
  })();
  </script>
</body>
</html>
