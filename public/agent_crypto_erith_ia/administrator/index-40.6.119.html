<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="atlas-engine-build" content="38.15.11" />
  <meta name="administrator-release" content="LEGACY COMPATIBILITY ENTRY" />
  <title>Agent-Crypto @erith.IA — entrée historique → Administrator courant</title>
  <script>
    (() => {
      const requested = String(location.pathname || "").match(/index-(\d+\.\d+\.\d+)\.html$/i)?.[1] || "legacy";
      const target = new URL('./index.html', location.href);
      const source = new URLSearchParams(location.search || '');
      for (const [key, value] of source.entries()) {
        if (key === 'ac-probe' || key === 'ac-build') continue;
        target.searchParams.set(key, value);
      }
      if (requested !== "legacy") target.searchParams.set('ac-build', requested);
      target.searchParams.set('ac-refresh', source.get('ac-refresh') || `${requested}-${Date.now()}`);
      location.replace(target.toString());
    })();
  </script>
</head>
<body>
  <p>Entrée historique — redirection vers Administrator courant.</p>
  <noscript><a href="./index.html">Ouvrir Administrator</a></noscript>
</body>
</html>
