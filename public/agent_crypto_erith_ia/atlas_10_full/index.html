<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#070a16">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Forge d’Aerith Pro · restauration V3.3R9 + The Vault</title>
<style>
html,body{margin:0;min-height:100%;background:#070a16;color:#eef3ff;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
#restoreBoot{min-height:100vh;display:grid;place-items:center;padding:32px}
.restore-card{width:min(720px,calc(100vw - 40px));border:1px solid #334563;border-radius:22px;padding:28px;background:#0b1222;box-shadow:0 30px 90px #0008}
.restore-card h1{margin:0 0 8px;font-size:24px}
.restore-card p{color:#aebbd0;line-height:1.6}
.restore-state{margin-top:18px;padding:12px 14px;border:1px solid #31425e;border-radius:12px;background:#080e1b;font:12px/1.5 ui-monospace,monospace;white-space:pre-wrap}
.restore-error{color:#ff9aad}
</style>
</head>
<body>
<div id="restoreBoot">
  <div class="restore-card">
    <h1>FORGE D’AERITH PRO</h1>
    <p>Restauration exacte de la baseline V3.3R9. Aucun moteur n’est reconstruit.</p>
    <div class="restore-state" id="restoreState">Chargement de la baseline canonique…</div>
  </div>
</div>

<script>
(() => {
  "use strict";

  const BASE_COMMIT = "52a0ab7ac5bb2b0313ae53b24cff4f86a2813d2f";
  const BASE = "https://cdn.jsdelivr.net/gh/BlueAzur-Hub/erith-ia-memory@52a0ab7ac5bb2b0313ae53b24cff4f86a2813d2f/public/agent_crypto_erith_ia/atlas_10_full";
  const CACHE_KEY = "forge-aerith-v33r9-exact-baseline-" + BASE_COMMIT;
  const stateEl = document.getElementById("restoreState");

  const FILES = {
    index: "index.html",
    style: "style.css",
    flower: "flower-girls-registry.js",
    data: "forge-data.js",
    app: "app.js"
  };

  function status(msg, error=false) {
    if (!stateEl) return;
    stateEl.textContent = msg;
    stateEl.classList.toggle("restore-error", !!error);
  }

  async function fetchText(url) {
    const r = await fetch(url, {cache:"no-store"});
    if (!r.ok) throw new Error(url + " — HTTP " + r.status);
    return await r.text();
  }

  function exactPatch(bundle) {
    // 1) HTML : une seule image changée, celle de l'AIDE DE CRÉATRICE à droite.
    const oldHero = '<img id="matrixImage" src="assets/themes/aerith_10_creatrice.webp" alt="">';
    const newHero = '<img id="matrixImage" src="assets/themes/aerith_10_creatrice_vault.png" alt="Aerith-10 Créatrice — The Vault">';
    if (!bundle.index.includes(oldHero)) {
      throw new Error("Marqueur V3.3R9 matrixImage introuvable : restauration annulée.");
    }
    bundle.index = bundle.index.replace(oldHero, newHero);

    // 2) DATA : seul le visual du profil creator est modifié.
    const creatorStart = bundle.data.indexOf('id: "creator"');
    if (creatorStart < 0) throw new Error("Profil creator V3.3R9 introuvable.");
    const before = bundle.data.slice(0, creatorStart);
    let creatorTail = bundle.data.slice(creatorStart);
    const visualNeedle = 'visual: "assets/themes/aerith_10_creatrice.webp"';
    const visualPos = creatorTail.indexOf(visualNeedle);
    if (visualPos < 0) throw new Error("Visual creator V3.3R9 introuvable.");
    creatorTail = creatorTail.slice(0, visualPos)
      + 'visual: "assets/themes/aerith_10_creatrice_vault.png"'
      + creatorTail.slice(visualPos + visualNeedle.length);
    bundle.data = before + creatorTail;

    // 3) CSS : règle STRICTEMENT bornée à cette nouvelle image.
    bundle.style += `
/* THE VAULT — visual patch only. No Forge layout/function rewrite. */
#matrixImage[src$="aerith_10_creatrice_vault.png"] {
  object-fit: cover;
  object-position: center 42%;
  background: #03060e;
}
`;

    return bundle;
  }

  function validateExactBaseline(bundle) {
    const checks = [
      [bundle.index.includes('data-build="V3.3R9-cartes-profils-uniformisees"'), "HTML build V3.3R9"],
      [bundle.data.includes('V3.3R9-cartes-profils-uniformisees'), "DATA V3.3R9"],
      [bundle.app.includes('const STORAGE_KEY = "aerith-forge-v3-3r7-guided-pack";'), "moteur App V3.3R9"],
      [bundle.app.includes('const FLOWER = window.AERITH_FLOWER_GIRLS;'), "moteur Flower Girls"],
      [bundle.flower.includes('window.AERITH_FLOWER_GIRLS'), "registre Flower Girls"],
      [bundle.style.includes('aerith_7_world.webp'), "background historique conservé"],
      [(bundle.index.match(/data-step="/g)||[]).length === 8, "8 étapes Atelier"],
      [bundle.data.includes('moduleRouter'), "routeur modules"],
      [bundle.data.includes('aerith_10_creatrice_vault.png'), "The Vault sur Creator"],
      [bundle.index.includes('aerith_10_creatrice_vault.png'), "The Vault sur Hero"]
    ];
    const failed = checks.filter(x => !x[0]);
    if (failed.length) throw new Error("Contrôle baseline échoué : " + failed.map(x=>x[1]).join(", "));
    return checks.map(x => "✓ " + x[1]).join("\n");
  }

  function stripBaselineResourceTags(html) {
    // Retire uniquement les ressources que nous allons injecter inline.
    html = html.replace(/<link\b[^>]*href=["']style\.css[^"']*["'][^>]*>/i, "");
    html = html.replace(/<script\b[^>]*src=["']flower-girls-registry\.js[^"']*["'][^>]*><\/script>/i, "");
    html = html.replace(/<script\b[^>]*src=["']forge-data\.js[^"']*["'][^>]*><\/script>/i, "");
    html = html.replace(/<script\b[^>]*src=["']app\.js[^"']*["'][^>]*><\/script>/i, "");
    return html;
  }

  function buildDocument(bundle) {
    let html = stripBaselineResourceTags(bundle.index);

    const styleTag = "<style data-exact-v33r9-style>\n" + bundle.style + "\n</style>";
    html = html.replace("</head>", styleTag + "\n</head>");

    // Ordre canonique obligatoire : Flower registry → DATA → App.
    const scripts =
      "<script data-exact-v33r9-flower>\n" + bundle.flower + "\n<\/script>\n" +
      "<script data-exact-v33r9-data>\n" + bundle.data + "\n<\/script>\n" +
      "<script data-exact-v33r9-app>\n" + bundle.app + "\n<\/script>\n";

    html = html.replace("</body>", scripts + "</body>");
    return html;
  }

  async function loadBundle() {
    status("Baseline : 52a0ab7ac5bb2b0313ae53b24cff4f86a2813d2f\nChargement index / CSS / DATA / Flower Girls / App…");
    try {
      const [index, style, flower, data, app] = await Promise.all([
        fetchText(BASE + "/" + FILES.index),
        fetchText(BASE + "/" + FILES.style),
        fetchText(BASE + "/" + FILES.flower),
        fetchText(BASE + "/" + FILES.data),
        fetchText(BASE + "/" + FILES.app)
      ]);
      const raw = {index,style,flower,data,app};
      try { localStorage.setItem(CACHE_KEY, JSON.stringify(raw)); } catch(_e) {}
      return raw;
    } catch (networkError) {
      let cached = null;
      try { cached = JSON.parse(localStorage.getItem(CACHE_KEY) || "null"); } catch(_e) {}
      if (cached && cached.index && cached.style && cached.flower && cached.data && cached.app) {
        status("Réseau indisponible : baseline V3.3R9 chargée depuis le cache local.");
        return cached;
      }
      throw networkError;
    }
  }

  (async () => {
    try {
      const raw = await loadBundle();
      const patched = exactPatch(raw);
      const report = validateExactBaseline(patched);
      status("Contrôles OK :\n" + report + "\n\nOuverture de la Forge…");
      const finalHtml = buildDocument(patched);
      document.open();
      document.write(finalHtml);
      document.close();
    } catch (err) {
      console.error(err);
      status(
        "RESTAURATION BLOQUÉE — aucun fallback simplifié n’a été lancé.\n\n" +
        (err && err.message ? err.message : String(err)) +
        "\n\nBaseline attendue : " + BASE_COMMIT,
        true
      );
    }
  })();
})();
</script>
</body>
</html>
